<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover">
  <title>API Tester · Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --theme-primary: #ff4fb2;
      --theme-bg: #000000;
      --theme-surface: #1a1a1a;
      --theme-surface2: #252525;
      --theme-text: #ffffff;
      --theme-text-secondary: rgba(255,255,255,0.6);
      --theme-text-tertiary: rgba(255,255,255,0.3);
      --theme-border: rgba(255,255,255,0.08);
      --theme-glass-bg: rgba(255,255,255,0.05);
      --theme-input-bg: rgba(255,255,255,0.04);
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
      --shadow: 0 8px 30px rgba(0,0,0,0.4);
      --radius: 16px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="light"] {
      --theme-bg: #f5f7fa;
      --theme-surface: #ffffff;
      --theme-surface2: #f0f2f5;
      --theme-text: #1a1a2e;
      --theme-text-secondary: rgba(26,26,46,0.6);
      --theme-text-tertiary: rgba(26,26,46,0.35);
      --theme-border: rgba(0,0,0,0.08);
      --theme-glass-bg: rgba(0,0,0,0.03);
      --theme-input-bg: rgba(0,0,0,0.03);
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    html, body {
      height: 100%; width: 100%; overflow-x: hidden;
      background: var(--theme-bg);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--theme-text);
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      transition: background var(--transition), color var(--transition);
    }
    .page-container {
      max-width: 600px; margin: 0 auto;
      padding: 0 16px 40px;
      min-height: 100vh;
    }
    /* header */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0 8px; margin-bottom: 4px;
    }
    .app-header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid var(--theme-border); background: var(--theme-glass-bg);
      color: var(--theme-text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: var(--transition); font-size: 18px;
    }
    .back-btn:active { background: rgba(255,255,255,0.08); transform: scale(0.95); }
    .app-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid var(--theme-border); background: var(--theme-glass-bg);
      color: var(--theme-text-secondary); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: var(--transition); font-size: 18px;
    }
    .icon-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.06); }
    .icon-btn.active { color: var(--theme-primary); border-color: var(--theme-primary); }

    .theme-toggle {
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid var(--theme-border); background: var(--theme-glass-bg);
      color: var(--theme-text-secondary); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: var(--transition); font-size: 18px;
    }
    .theme-toggle:active { transform: scale(0.95); }

    /* filter pills */
    .filter-scroll {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 8px 0 16px; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .filter-pill {
      padding: 8px 16px; border-radius: 20px;
      border: 1px solid var(--theme-border); background: var(--theme-glass-bg);
      color: var(--theme-text-secondary); font-size: 13px; font-weight: 600;
      white-space: nowrap; cursor: pointer; transition: var(--transition);
      flex-shrink: 0; font-family: inherit; display: flex; align-items: center; gap: 6px;
    }
    .filter-pill.active { background: var(--theme-primary); border-color: var(--theme-primary); color: #fff; }
    .filter-pill .badge {
      display: inline-block; background: rgba(255,255,255,0.15);
      padding: 0 7px; border-radius: 10px; font-size: 11px; margin-left: 2px;
    }
    [data-theme="light"] .filter-pill .badge { background: rgba(0,0,0,0.08); color: var(--theme-text-secondary); }

    /* cards */
    .card {
      background: var(--theme-surface); border: 1px solid var(--theme-border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
      box-shadow: var(--shadow); transition: background var(--transition), box-shadow var(--transition);
    }
    .card-title {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--theme-text-tertiary);
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .card-title i { font-size: 14px; }
    .field { margin-bottom: 12px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600; color: var(--theme-text-secondary);
      margin-bottom: 4px; letter-spacing: 0.3px;
    }
    .field label i { margin-right: 6px; width: 16px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 14px;
      background: var(--theme-input-bg); border: 1px solid var(--theme-border);
      border-radius: 12px; color: var(--theme-text); font-size: 14px;
      font-family: inherit; transition: var(--transition); outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--theme-primary);
      box-shadow: 0 0 0 3px rgba(255,79,178,0.1);
    }
    .field textarea { resize: vertical; min-height: 60px; font-size: 13px; font-family: 'Monaco', 'Menlo', monospace; }
    .field textarea.json-area { min-height: 80px; }

    .method-group {
      display: flex; gap: 4px; background: var(--theme-surface2);
      padding: 4px; border-radius: 12px; margin-bottom: 12px;
      transition: background var(--transition);
    }
    .method-btn {
      flex: 1; border: none; background: transparent; padding: 6px 0;
      border-radius: 10px; font-weight: 700; font-size: 13px;
      color: var(--theme-text-secondary); cursor: pointer; transition: var(--transition);
    }
    .method-btn.active { background: var(--theme-primary); color: #fff; }
    .method-btn:active { transform: scale(0.96); }

    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .btn {
      border: none; padding: 10px 18px; border-radius: 40px;
      font-weight: 700; font-size: 13px; font-family: inherit;
      background: var(--theme-glass-bg); border: 1px solid var(--theme-border);
      color: var(--theme-text); cursor: pointer; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--theme-primary); border-color: var(--theme-primary); color: #fff; }
    .btn-primary:active { opacity: 0.85; }
    .btn-secondary { background: var(--theme-surface2); border-color: var(--theme-border); }
    .btn-danger { background: rgba(255,79,178,0.12); border-color: var(--theme-primary); color: var(--theme-primary); }
    .btn-sm { padding: 6px 12px; font-size: 11px; }

    /* dynamic pairs */
    .pair-container { margin-bottom: 4px; }
    .pair-row {
      display: flex; gap: 8px; margin-bottom: 6px; align-items: center;
      animation: slideIn 0.2s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pair-row input, .pair-row textarea {
      flex: 1; padding: 8px 12px; background: var(--theme-input-bg);
      border: 1px solid var(--theme-border); border-radius: 10px;
      color: var(--theme-text); font-size: 13px; font-family: inherit;
      transition: var(--transition); outline: none; min-width: 0;
    }
    .pair-row input:focus, .pair-row textarea:focus { border-color: var(--theme-primary); }
    .pair-row textarea { min-height: 40px; resize: vertical; }
    .pair-row .remove-btn {
      background: none; border: none; color: var(--theme-text-tertiary);
      cursor: pointer; font-size: 16px; padding: 4px 6px; transition: var(--transition);
      display: flex; align-items: center; justify-content: center;
    }
    .pair-row .remove-btn:hover { color: var(--theme-primary); }
    .add-btn {
      background: none; border: 1px dashed var(--theme-border); border-radius: 10px;
      padding: 6px 12px; color: var(--theme-text-secondary); cursor: pointer;
      font-size: 12px; width: 100%; margin-top: 4px; transition: var(--transition);
    }
    .add-btn:hover { border-color: var(--theme-primary); color: var(--theme-primary); }
    .pair-toolbar {
      display: flex; gap: 6px; margin: 4px 0 8px; flex-wrap: wrap;
    }

    /* response */
    .response-meta {
      display: flex; flex-wrap: wrap; gap: 12px;
      background: var(--theme-surface2); border-radius: 12px; padding: 10px 14px;
      margin-bottom: 10px; font-size: 12px; color: var(--theme-text-secondary);
      transition: background var(--transition);
    }
    .response-meta span { display: flex; align-items: center; gap: 6px; }
    .response-status { font-weight: 700; }
    .status-ok { color: #34c759; }
    .status-error { color: var(--theme-primary); }
    .response-body {
      background: var(--theme-input-bg); border-radius: 12px; padding: 14px;
      font-family: 'Monaco', 'Menlo', monospace; font-size: 12px;
      white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow-y: auto;
      border: 1px solid var(--theme-border); color: var(--theme-text);
      transition: background var(--transition);
    }
    .response-body .empty { color: var(--theme-text-tertiary); font-style: italic; }
    .response-headers {
      display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 10px;
    }
    .response-headers span {
      background: var(--theme-surface2); padding: 2px 10px; border-radius: 20px;
      font-size: 11px; border: 1px solid var(--theme-border);
      transition: background var(--transition);
    }

    /* history */
    .history-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; background: var(--theme-surface2); border-radius: 12px;
      margin-bottom: 6px; border: 1px solid var(--theme-border);
      cursor: pointer; transition: var(--transition);
    }
    .history-item:active { border-color: var(--theme-primary); transform: scale(0.99); }
    .history-item .h-info { flex: 1; min-width: 0; }
    .history-item .h-method { font-weight: 700; font-size: 12px; color: var(--theme-primary); margin-right: 8px; }
    .history-item .h-url { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item .h-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .history-item .h-actions button {
      background: none; border: none; color: var(--theme-text-tertiary);
      cursor: pointer; font-size: 15px; padding: 4px 6px; transition: var(--transition);
      border-radius: 8px;
    }
    .history-item .h-actions button:hover { color: var(--theme-text); background: var(--theme-glass-bg); }
    .history-item .h-actions .h-load:hover { color: var(--theme-primary); }
    .history-item .h-actions .h-delete:hover { color: #ff4fb2; }
    .empty-state { text-align: center; padding: 30px 10px; color: var(--theme-text-tertiary); }
    .empty-state i { font-size: 32px; margin-bottom: 12px; display: block; }

    /* modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; padding: 20px; opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--theme-surface); border: 1px solid var(--theme-border);
      border-radius: 24px; max-width: 480px; width: 100%;
      padding: 24px; max-height: 80vh; overflow-y: auto;
      box-shadow: var(--shadow);
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal h3 { font-size: 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
    .modal .field { margin-bottom: 10px; }
    .modal .btn-group { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

    /* offline banner */
    .offline-banner {
      display: none; background: rgba(255,79,178,0.12);
      border: 1px solid var(--theme-primary); border-radius: 12px;
      padding: 10px 14px; margin-bottom: 12px;
      color: var(--theme-text-secondary); font-size: 13px;
      align-items: center; gap: 10px;
    }
    .offline-banner.show { display: flex; }
    .offline-banner i { color: var(--theme-primary); font-size: 16px; }

    /* live timer */
    .timer-live {
      font-variant-numeric: tabular-nums;
      color: var(--theme-primary);
      font-weight: 700;
    }

    /* responsive */
    @media (max-width: 500px) {
      .page-container { padding: 0 12px 30px; }
      .app-header h2 { font-size: 18px; }
      .app-header-left { gap: 8px; }
      .back-btn, .icon-btn, .theme-toggle { width: 36px; height: 36px; font-size: 15px; }
      .card { padding: 12px; border-radius: 14px; }
      .method-btn { font-size: 11px; padding: 5px 0; }
      .btn { padding: 8px 14px; font-size: 12px; }
      .field input, .field select, .field textarea { font-size: 13px; padding: 8px 12px; }
      .response-body { font-size: 11px; max-height: 160px; }
      .modal { padding: 18px; }
      .pair-row { flex-wrap: wrap; }
      .pair-row input { min-width: 70px; }
    }
    @media (max-width: 380px) {
      .app-header h2 { font-size: 16px; }
      .filter-pill { font-size: 11px; padding: 6px 12px; }
      .action-row .btn { font-size: 11px; padding: 6px 12px; }
    }
  </style>
</head>
<body>
<div class="page-container">

  <!-- header -->
  <div class="app-header">
    <div class="app-header-left">
      <button class="back-btn" id="backBtn"><i class="fas fa-chevron-left"></i></button>
      <h2>API Tester</h2>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" title="Toggle theme"><i class="fas fa-moon"></i></button>
      <button class="icon-btn" id="historyToggle" title="History"><i class="fas fa-clock"></i></button>
    </div>
  </div>

  <!-- offline banner -->
  <div class="offline-banner" id="offlineBanner">
    <i class="fas fa-wifi-slash"></i>
    <span>No internet connection. Please check your network.</span>
  </div>

  <!-- filter pills -->
  <div class="filter-scroll" id="tabScroll">
    <button class="filter-pill active" data-tab="tester"><i class="fas fa-flask"></i> Tester</button>
    <button class="filter-pill" data-tab="history"><i class="fas fa-clock"></i> History <span class="badge" id="historyBadge">0</span></button>
  </div>

  <!-- TAB: TESTER -->
  <div id="tabTester">
    <div class="card">
      <div class="card-title"><i class="fas fa-paper-plane"></i> Request</div>
      <div class="method-group" id="methodGroup">
        <button class="method-btn active" data-method="GET">GET</button>
        <button class="method-btn" data-method="POST">POST</button>
        <button class="method-btn" data-method="PUT">PUT</button>
        <button class="method-btn" data-method="PATCH">PATCH</button>
        <button class="method-btn" data-method="DELETE">DELETE</button>
      </div>
      <div class="field">
        <label><i class="fas fa-link"></i> URL</label>
        <input type="text" id="endpointUrl" placeholder="https://api.example.com/endpoint" value="https://jsonplaceholder.typicode.com/posts/1">
      </div>
      <div class="field">
        <label><i class="fas fa-headers"></i> Headers</label>
        <div class="pair-container" id="headersContainer">
          <div class="pair-row">
            <input class="pair-key" placeholder="Key" value="Content-Type">
            <input class="pair-value" placeholder="Value" value="application/json">
            <button class="remove-btn" title="Remove header"><i class="fas fa-trash-alt"></i></button>
          </div>
        </div>
        <button class="add-btn" id="addHeaderBtn"><i class="fas fa-plus"></i> Add header</button>
      </div>
      <div class="field">
        <label><i class="fas fa-database"></i> Body</label>
        <div class="pair-toolbar">
          <button class="btn btn-secondary btn-sm" id="bodyAddPairBtn"><i class="fas fa-plus"></i> Add pair</button>
          <button class="btn btn-secondary btn-sm" id="bodyToJsonBtn"><i class="fas fa-code"></i> To JSON</button>
          <button class="btn btn-secondary btn-sm" id="bodyFromJsonBtn"><i class="fas fa-undo"></i> From JSON</button>
        </div>
        <div class="pair-container" id="bodyContainer">
          <div class="pair-row">
            <input class="pair-key" placeholder="Key" value="title">
            <input class="pair-value" placeholder="Value" value="API Tester">
            <button class="remove-btn" title="Remove field"><i class="fas fa-trash-alt"></i></button>
          </div>
          <div class="pair-row">
            <input class="pair-key" placeholder="Key" value="body">
            <input class="pair-value" placeholder="Value" value="hello from tester">
            <button class="remove-btn" title="Remove field"><i class="fas fa-trash-alt"></i></button>
          </div>
          <div class="pair-row">
            <input class="pair-key" placeholder="Key" value="userId">
            <input class="pair-value" placeholder="Value" value="1">
            <button class="remove-btn" title="Remove field"><i class="fas fa-trash-alt"></i></button>
          </div>
        </div>
        <textarea id="requestBodyRaw" class="json-area" rows="3" style="display:none;" placeholder="{ &quot;key&quot;: &quot;value&quot; }"></textarea>
      </div>
      <div class="action-row">
        <button class="btn btn-primary" id="sendBtn"><i class="fas fa-play"></i> Send</button>
        <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-undo"></i> Reset</button>
        <button class="btn btn-secondary" id="saveHistoryBtn"><i class="fas fa-bookmark"></i> Save</button>
      </div>
    </div>

    <!-- response -->
    <div class="card">
      <div class="card-title"><i class="fas fa-chart-bar"></i> Response</div>
      <div class="response-meta">
        <span class="response-status" id="respStatus">—</span>
        <span id="respTime"><i class="far fa-clock"></i> <span id="timerDisplay">—</span> ms</span>
        <span id="respSize"><i class="fas fa-weight-hanging"></i> —</span>
      </div>
      <div class="response-headers" id="respHeadersContainer"></div>
      <div class="response-body" id="responseBodyDisplay"><span class="empty"><i class="fas fa-arrow-left"></i> send a request</span></div>
    </div>
  </div>

  <!-- TAB: HISTORY -->
  <div id="tabHistory" style="display:none;">
    <div class="card" style="min-height:200px;">
      <div class="card-title"><i class="fas fa-archive"></i> Saved requests</div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle"><i class="fas fa-pen"></i> Edit Request</h3>
      <div class="field"><label><i class="fas fa-tag"></i> Name</label><input id="modalName" placeholder="My API"></div>
      <div class="field"><label><i class="fas fa-code"></i> Method</label><select id="modalMethod"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select></div>
      <div class="field"><label><i class="fas fa-link"></i> URL</label><input id="modalUrl" placeholder="https://..."></div>
      <div class="field"><label><i class="fas fa-headers"></i> Headers (one per line, Key: Value)</label><textarea id="modalHeaders" rows="2" placeholder="Content-Type: application/json"></textarea></div>
      <div class="field"><label><i class="fas fa-database"></i> Body</label><textarea id="modalBody" rows="3"></textarea></div>
      <div class="btn-group">
        <button class="btn btn-secondary" id="modalCancel"><i class="fas fa-times"></i> Cancel</button>
        <button class="btn btn-danger" id="modalDelete" style="display:none;"><i class="fas fa-trash"></i> Delete</button>
        <button class="btn btn-primary" id="modalSave"><i class="fas fa-save"></i> Save</button>
      </div>
      <input type="hidden" id="modalEditId">
    </div>
  </div>
</div>

<script>
  (function(){
    'use strict';

    // ---- state ----
    let currentMethod = 'GET';
    let historyItems = JSON.parse(localStorage.getItem('apiTesterHistory') || '[]');
    let editingId = null;
    let bodyMode = 'pairs';
    let currentTheme = localStorage.getItem('apiTesterTheme') || 'dark';
    let timerInterval = null;
    let timerStart = 0;

    // ---- refs ----
    const endpointInput = document.getElementById('endpointUrl');
    const headersContainer = document.getElementById('headersContainer');
    const bodyContainer = document.getElementById('bodyContainer');
    const requestBodyRaw = document.getElementById('requestBodyRaw');
    const addHeaderBtn = document.getElementById('addHeaderBtn');
    const bodyAddPairBtn = document.getElementById('bodyAddPairBtn');
    const bodyToJsonBtn = document.getElementById('bodyToJsonBtn');
    const bodyFromJsonBtn = document.getElementById('bodyFromJsonBtn');
    const sendBtn = document.getElementById('sendBtn');
    const resetBtn = document.getElementById('resetBtn');
    const saveHistoryBtn = document.getElementById('saveHistoryBtn');
    const respStatus = document.getElementById('respStatus');
    const respTime = document.getElementById('respTime');
    const timerDisplay = document.getElementById('timerDisplay');
    const respSize = document.getElementById('respSize');
    const respHeadersContainer = document.getElementById('respHeadersContainer');
    const responseBodyDisplay = document.getElementById('responseBodyDisplay');
    const historyList = document.getElementById('historyList');
    const historyBadge = document.getElementById('historyBadge');
    const historyToggle = document.getElementById('historyToggle');
    const themeToggle = document.getElementById('themeToggle');
    const offlineBanner = document.getElementById('offlineBanner');

    const modalOverlay = document.getElementById('modalOverlay');
    const modalName = document.getElementById('modalName');
    const modalMethod = document.getElementById('modalMethod');
    const modalUrl = document.getElementById('modalUrl');
    const modalHeaders = document.getElementById('modalHeaders');
    const modalBody = document.getElementById('modalBody');
    const modalCancel = document.getElementById('modalCancel');
    const modalSave = document.getElementById('modalSave');
    const modalDelete = document.getElementById('modalDelete');
    const modalEditId = document.getElementById('modalEditId');
    const modalTitle = document.getElementById('modalTitle');

    // ---- theme ----
    function setTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('apiTesterTheme', theme);
      const icon = themeToggle.querySelector('i');
      icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
    }
    function getSystemTheme() {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function toggleTheme() {
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    }
    themeToggle.addEventListener('click', toggleTheme);
    const systemMedia = window.matchMedia('(prefers-color-scheme: dark)');
    systemMedia.addEventListener('change', (e) => {
      if (!localStorage.getItem('apiTesterTheme')) {
        setTheme(e.matches ? 'dark' : 'light');
      }
    });
    const storedTheme = localStorage.getItem('apiTesterTheme');
    if (storedTheme) setTheme(storedTheme);
    else setTheme(getSystemTheme());

    // ---- internet ----
    function updateOnlineStatus() {
      if (navigator.onLine) offlineBanner.classList.remove('show');
      else offlineBanner.classList.add('show');
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // ---- pair helpers ----
    function createPairRow(key, value) {
      const div = document.createElement('div');
      div.className = 'pair-row';
      const inputKey = document.createElement('input');
      inputKey.className = 'pair-key';
      inputKey.placeholder = 'Key';
      inputKey.value = key || '';
      const inputVal = document.createElement('input');
      inputVal.className = 'pair-value';
      inputVal.placeholder = 'Value';
      inputVal.value = value || '';
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
      removeBtn.title = 'Remove item';
      removeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const container = this.closest('.pair-container');
        if (container.querySelectorAll('.pair-row').length > 1) {
          this.closest('.pair-row').remove();
        } else {
          // if last, clear values instead
          const row = this.closest('.pair-row');
          row.querySelector('.pair-key').value = '';
          row.querySelector('.pair-value').value = '';
        }
        updateRemoveButtons(container);
      });
      div.appendChild(inputKey);
      div.appendChild(inputVal);
      div.appendChild(removeBtn);
      return div;
    }

    function updateRemoveButtons(container) {
      const rows = container.querySelectorAll('.pair-row');
      rows.forEach(row => {
        const btn = row.querySelector('.remove-btn');
        if (rows.length <= 1) {
          btn.style.opacity = '0.4';
        } else {
          btn.style.opacity = '1';
        }
      });
    }

    function getPairs(container) {
      const pairs = {};
      container.querySelectorAll('.pair-row').forEach(row => {
        const key = row.querySelector('.pair-key').value.trim();
        const val = row.querySelector('.pair-value').value.trim();
        if (key) pairs[key] = val;
      });
      return pairs;
    }

    function setPairs(container, pairs) {
      container.innerHTML = '';
      if (!pairs || Object.keys(pairs).length === 0) {
        container.appendChild(createPairRow('', ''));
      } else {
        for (const [k, v] of Object.entries(pairs)) {
          container.appendChild(createPairRow(k, v));
        }
      }
      updateRemoveButtons(container);
    }

    function getBodyPairs() { return getPairs(bodyContainer); }
    function setBodyPairs(pairs) { setPairs(bodyContainer, pairs); }
    function getHeadersFromUI() { return getPairs(headersContainer); }
    function setHeadersUI(headers) { setPairs(headersContainer, headers || {}); }

    // ---- body mode ----
    function switchBodyMode(mode) {
      bodyMode = mode;
      if (mode === 'pairs') {
        bodyContainer.style.display = 'block';
        requestBodyRaw.style.display = 'none';
      } else {
        bodyContainer.style.display = 'none';
        requestBodyRaw.style.display = 'block';
        const pairs = getBodyPairs();
        requestBodyRaw.value = JSON.stringify(pairs, null, 2);
      }
    }

    function pairsToJson() {
      const pairs = getBodyPairs();
      requestBodyRaw.value = JSON.stringify(pairs, null, 2);
      switchBodyMode('raw');
    }

    function jsonToPairs() {
      try {
        const raw = requestBodyRaw.value.trim();
        if (!raw) { setBodyPairs({}); switchBodyMode('pairs'); return; }
        const parsed = JSON.parse(raw);
        if (typeof parsed === 'object' && parsed !== null) {
          setBodyPairs(parsed);
          switchBodyMode('pairs');
        } else {
          alert('JSON must be an object with key-value pairs.');
        }
      } catch (e) {
        alert('Invalid JSON: ' + e.message);
      }
    }

    function getRequestBody() {
      if (bodyMode === 'pairs') {
        const pairs = getBodyPairs();
        return JSON.stringify(pairs, null, 2);
      } else {
        return requestBodyRaw.value;
      }
    }

    function setRequestBody(value) {
      try {
        const parsed = JSON.parse(value);
        if (typeof parsed === 'object' && parsed !== null) {
          setBodyPairs(parsed);
          switchBodyMode('pairs');
        } else {
          requestBodyRaw.value = value;
          switchBodyMode('raw');
        }
      } catch (_) {
        requestBodyRaw.value = value;
        switchBodyMode('raw');
      }
    }

    // ---- timer ----
    function startTimer() {
      timerStart = performance.now();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = (performance.now() - timerStart);
        timerDisplay.textContent = Math.round(elapsed);
      }, 10);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function resetTimer() {
      stopTimer();
      timerDisplay.textContent = '—';
    }

    // ---- send ----
    async function sendRequest() {
      if (!navigator.onLine) {
        setResponse('⚠️ Offline', '—', '—', {});
        responseBodyDisplay.textContent = '❌ No internet connection. Please check your network.';
        resetTimer();
        return;
      }
      const url = endpointInput.value.trim();
      if (!url) {
        setResponse('❌ URL required', '—', '—', {});
        responseBodyDisplay.textContent = 'Please enter a valid URL.';
        resetTimer();
        return;
      }
      const method = currentMethod;
      const headers = getHeadersFromUI();
      let body = getRequestBody();

      setResponse('⏳ Sending...', '—', '—', {});
      responseBodyDisplay.textContent = '⏳ Waiting for response...';
      startTimer();

      try {
        const opts = { method, headers };
        if (method !== 'GET' && method !== 'HEAD' && body && body.trim()) {
          opts.body = body;
        }
        const resp = await fetch(url, opts);
        stopTimer();
        const elapsed = performance.now() - timerStart;
        const text = await resp.text();
        const size = new Blob([text]).size;

        const statusText = `${resp.status} ${resp.statusText}`;
        const isOk = resp.ok;
        const headersObj = {};
        resp.headers.forEach((v,k) => { headersObj[k] = v; });

        respStatus.textContent = statusText;
        respStatus.className = 'response-status ' + (isOk ? 'status-ok' : 'status-error');
        timerDisplay.textContent = Math.round(elapsed);
        respTime.innerHTML = `<i class="far fa-clock"></i> <span class="timer-live">${Math.round(elapsed)}</span> ms`;
        respSize.innerHTML = `<i class="fas fa-weight-hanging"></i> ${size} B`;

        respHeadersContainer.innerHTML = '';
        Object.entries(headersObj).slice(0, 14).forEach(([k,v]) => {
          const span = document.createElement('span');
          span.textContent = `${k}: ${v}`;
          respHeadersContainer.appendChild(span);
        });

        try {
          const json = JSON.parse(text);
          responseBodyDisplay.textContent = JSON.stringify(json, null, 2);
        } catch (_) {
          responseBodyDisplay.textContent = text || '(empty)';
        }

      } catch (err) {
        stopTimer();
        const elapsed = performance.now() - timerStart;
        respStatus.textContent = '⚠️ Error';
        respStatus.className = 'response-status status-error';
        timerDisplay.textContent = Math.round(elapsed);
        respTime.innerHTML = `<i class="far fa-clock"></i> <span class="timer-live">${Math.round(elapsed)}</span> ms`;
        respSize.innerHTML = `<i class="fas fa-weight-hanging"></i> —`;
        respHeadersContainer.innerHTML = '';
        responseBodyDisplay.textContent = `❌ ${err.message || 'Network error'}`;
      }
    }

    function setResponse(status, time, size, headers) {
      stopTimer();
      respStatus.textContent = status;
      if (time === '—') {
        timerDisplay.textContent = '—';
        respTime.innerHTML = `<i class="far fa-clock"></i> — ms`;
      }
      respSize.innerHTML = size;
      respHeadersContainer.innerHTML = '';
      if (headers && Object.keys(headers).length) {
        Object.entries(headers).slice(0,10).forEach(([k,v]) => {
          const span = document.createElement('span');
          span.textContent = `${k}: ${v}`;
          respHeadersContainer.appendChild(span);
        });
      }
    }

    // ---- reset ----
    function resetAll() {
      endpointInput.value = 'https://jsonplaceholder.typicode.com/posts/1';
      setHeadersUI({ 'Content-Type': 'application/json' });
      setBodyPairs({ title: 'API Tester', body: 'hello from tester', userId: '1' });
      switchBodyMode('pairs');
      document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.method-btn[data-method="GET"]').classList.add('active');
      currentMethod = 'GET';
      responseBodyDisplay.innerHTML = '<span class="empty"><i class="fas fa-arrow-left"></i> reset done</span>';
      respStatus.textContent = '—';
      resetTimer();
      respTime.innerHTML = `<i class="far fa-clock"></i> — ms`;
      respSize.innerHTML = `<i class="fas fa-weight-hanging"></i> —`;
      respHeadersContainer.innerHTML = '';
    }

    // ---- history ----
    function renderHistory() {
      if (!historyItems.length) {
        historyList.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i>No saved requests. Save one from the tester!</div>`;
        historyBadge.textContent = '0';
        return;
      }
      historyBadge.textContent = historyItems.length;
      let html = '';
      historyItems.forEach((item, idx) => {
        const id = item.id || idx;
        html += `
          <div class="history-item" data-id="${id}">
            <div class="h-info">
              <span class="h-method">${item.method}</span>
              <span class="h-url">${escapeHtml(item.name || item.url)}</span>
            </div>
            <div class="h-actions">
              <button class="h-load" data-id="${id}" title="Load"><i class="fas fa-arrow-right"></i></button>
              <button class="h-edit" data-id="${id}" title="Edit"><i class="fas fa-pen"></i></button>
              <button class="h-delete" data-id="${id}" title="Delete"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `;
      });
      historyList.innerHTML = html;

      historyList.querySelectorAll('.h-load').forEach(b => {
        b.addEventListener('click', (e) => { e.stopPropagation(); loadHistoryItem(b.dataset.id); });
      });
      historyList.querySelectorAll('.h-edit').forEach(b => {
        b.addEventListener('click', (e) => { e.stopPropagation(); openEditModal(b.dataset.id); });
      });
      historyList.querySelectorAll('.h-delete').forEach(b => {
        b.addEventListener('click', (e) => { e.stopPropagation(); deleteHistoryItem(b.dataset.id); });
      });
      historyList.querySelectorAll('.history-item').forEach(item => {
        item.addEventListener('click', function() {
          const id = this.dataset.id;
          if (id) loadHistoryItem(id);
        });
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function saveHistoryToStorage() {
      localStorage.setItem('apiTesterHistory', JSON.stringify(historyItems));
      renderHistory();
    }

    function addHistoryItem(method, url, headers, body, name) {
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      const item = { id, method, url, headers, body, name: name || url };
      historyItems.unshift(item);
      if (historyItems.length > 50) historyItems.pop();
      saveHistoryToStorage();
    }

    function loadHistoryItem(id) {
      const item = historyItems.find(i => i.id == id);
      if (!item) return;
      currentMethod = item.method;
      document.querySelectorAll('.method-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.method === item.method);
      });
      endpointInput.value = item.url;
      setRequestBody(item.body || '');
      setHeadersUI(item.headers || {});
      switchTab('tester');
    }

    function deleteHistoryItem(id) {
      if (!confirm('Delete this saved request?')) return;
      historyItems = historyItems.filter(i => i.id != id);
      saveHistoryToStorage();
    }

    function openEditModal(id) {
      const item = historyItems.find(i => i.id == id);
      if (!item) return;
      editingId = id;
      modalTitle.innerHTML = '<i class="fas fa-pen"></i> Edit Request';
      modalName.value = item.name || item.url;
      modalMethod.value = item.method;
      modalUrl.value = item.url;
      modalHeaders.value = Object.entries(item.headers || {}).map(([k,v]) => `${k}: ${v}`).join('\n');
      modalBody.value = item.body || '';
      modalDelete.style.display = 'inline-flex';
      modalOverlay.classList.add('open');
    }

    function closeModal() { modalOverlay.classList.remove('open'); editingId = null; modalDelete.style.display = 'none'; }

    function saveFromModal() {
      const name = modalName.value.trim() || modalUrl.value;
      const method = modalMethod.value;
      const url = modalUrl.value.trim();
      if (!url) { alert('URL is required'); return; }
      const headersText = modalHeaders.value;
      const headers = {};
      headersText.split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx > 0) {
          const k = line.slice(0, idx).trim();
          const v = line.slice(idx+1).trim();
          if (k) headers[k] = v;
        }
      });
      const body = modalBody.value;

      if (editingId) {
        const item = historyItems.find(i => i.id == editingId);
        if (item) {
          item.name = name;
          item.method = method;
          item.url = url;
          item.headers = headers;
          item.body = body;
          saveHistoryToStorage();
        }
      } else {
        addHistoryItem(method, url, headers, body, name);
      }
      closeModal();
      renderHistory();
      switchTab('history');
    }

    // ---- tabs ----
    function switchTab(tab) {
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      document.querySelector(`.filter-pill[data-tab="${tab}"]`)?.classList.add('active');
      document.getElementById('tabTester').style.display = tab === 'tester' ? 'block' : 'none';
      document.getElementById('tabHistory').style.display = tab === 'history' ? 'block' : 'none';
    }

    // ---- init ----
    function init() {
      document.querySelectorAll('.method-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentMethod = this.dataset.method;
        });
      });

      sendBtn.addEventListener('click', sendRequest);
      endpointInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendRequest(); });
      resetBtn.addEventListener('click', resetAll);

      saveHistoryBtn.addEventListener('click', function() {
        const url = endpointInput.value.trim();
        if (!url) { alert('Enter a URL to save'); return; }
        const method = currentMethod;
        const headers = getHeadersFromUI();
        const body = getRequestBody();
        addHistoryItem(method, url, headers, body, url);
        renderHistory();
        switchTab('history');
      });

      document.querySelectorAll('.filter-pill').forEach(pill => {
        pill.addEventListener('click', function() {
          switchTab(this.dataset.tab);
        });
      });

      historyToggle.addEventListener('click', function() {
        const histTab = document.querySelector('.filter-pill[data-tab="history"]');
        if (histTab) histTab.click();
      });

      document.getElementById('backBtn').addEventListener('click', () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'navigate', url: 'back' }, window.location.origin);
        } else { window.history.back(); }
      });

      modalCancel.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
      modalSave.addEventListener('click', saveFromModal);
      modalDelete.addEventListener('click', function() {
        if (editingId && confirm('Delete this request?')) {
          deleteHistoryItem(editingId);
          closeModal();
          renderHistory();
        }
      });

      // header add
      addHeaderBtn.addEventListener('click', function() {
        headersContainer.appendChild(createPairRow('', ''));
        updateRemoveButtons(headersContainer);
      });

      bodyAddPairBtn.addEventListener('click', function() {
        if (bodyMode === 'raw') jsonToPairs();
        if (bodyMode === 'pairs') {
          bodyContainer.appendChild(createPairRow('', ''));
          updateRemoveButtons(bodyContainer);
        }
      });

      bodyToJsonBtn.addEventListener('click', pairsToJson);
      bodyFromJsonBtn.addEventListener('click', jsonToPairs);

      updateRemoveButtons(headersContainer);
      updateRemoveButtons(bodyContainer);
      renderHistory();
      switchTab('tester');
      resetTimer();
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();

    window.addEventListener('message', (e) => {
      if (e.origin !== window.location.origin) return;
      if (e.data?.type === 'theme-change') setTheme(e.data.theme);
    });

  })();
</script>
</body>
</html>
