<script>
(function(){
  try {
    var pref = localStorage.getItem('folio.theme') || 'dark';
    if (pref === 'light') document.documentElement.setAttribute('data-theme','light');
  } catch(e){}
})();
</script>

<style>
:root {
  --theme-primary: #F59E0B;
  --theme-primary-hover: #fbbf24;
  --theme-primary-glow: rgba(245, 158, 11, 0.40);
  --theme-primary-soft: rgba(245, 158, 11, 0.14);
  --theme-bg: #0a0c10;
  --theme-surface: #0f1218;
  --theme-surface-card: rgba(21, 25, 34, 0.72);
  --theme-surface-card-solid: #151922;
  --theme-surface-elevated: #1a1f2a;
  --theme-text: #e8ecf1;
  --theme-text-secondary: rgba(232, 236, 241, 0.72);
  --theme-text-tertiary: rgba(232, 236, 241, 0.44);
  --theme-glass-bg: rgba(255, 255, 255, 0.05);
  --theme-glass-border: rgba(255, 255, 255, 0.09);
  --theme-overlay: rgba(10, 12, 16, 0.85);
  --theme-card-border: rgba(255, 255, 255, 0.08);
  --theme-divider: rgba(255, 255, 255, 0.08);
  --input-bg: rgba(26, 31, 42, 0.88);
  --theme-success: #10B981;
  --theme-success-soft: rgba(16, 185, 129, 0.14);
  --theme-danger: #EF4444;
  --theme-danger-soft: rgba(239, 68, 68, 0.12);
  --theme-warning: #D97706;
  --theme-warning-soft: rgba(217, 119, 6, 0.14);
  --theme-info: #3B82F6;
  --bg-gradient-1: radial-gradient(circle at 50% -10%, rgba(245, 158, 11, 0.14) 0%, transparent 60%);
  --bg-gradient-2: radial-gradient(circle at 100% 100%, rgba(249, 115, 22, 0.10) 0%, transparent 55%);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --rail-w: 60px;
  --sidebar-w: 280px;
  --header-h: 48px;
  --toolbar-row-h: 48px;
  --bottom-nav-h: 56px;
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, Monaco, monospace;
}

[data-theme="light"] {
  --theme-primary: #D97706;
  --theme-primary-hover: #B45309;
  --theme-primary-glow: rgba(217, 119, 6, 0.28);
  --theme-primary-soft: rgba(217, 119, 6, 0.10);
  --theme-bg: #f7f8fa;
  --theme-surface: #ffffff;
  --theme-surface-card: rgba(255, 255, 255, 0.85);
  --theme-surface-card-solid: #ffffff;
  --theme-surface-elevated: #ffffff;
  --theme-text: #121316;
  --theme-text-secondary: rgba(18, 19, 22, 0.72);
  --theme-text-tertiary: rgba(18, 19, 22, 0.48);
  --theme-glass-bg: rgba(255, 255, 255, 0.75);
  --theme-glass-border: rgba(0, 0, 0, 0.08);
  --theme-overlay: rgba(18, 19, 22, 0.55);
  --theme-card-border: rgba(0, 0, 0, 0.07);
  --theme-divider: rgba(0, 0, 0, 0.06);
  --input-bg: #ffffff;
  --theme-success: #059669;
  --theme-success-soft: rgba(5, 150, 105, 0.12);
  --theme-danger: #DC2626;
  --theme-danger-soft: rgba(220, 38, 38, 0.10);
  --theme-warning: #B45309;
  --theme-warning-soft: rgba(180, 83, 9, 0.10);
  --bg-gradient-1: radial-gradient(circle at 50% -10%, rgba(217, 119, 6, 0.08) 0%, transparent 60%);
  --bg-gradient-2: radial-gradient(circle at 100% 100%, rgba(249, 115, 22, 0.06) 0%, transparent 55%);
}

/* Mobile (compact) */
@media (max-width: 639px) {
  :root {
    --rail-w: 0px;
    --sidebar-w: 100vw;
    --header-h: 40px;
    --toolbar-row-h: 46px;
    --bottom-nav-h: 52px;
  }
  html, body { font-size: 12px; }
}

/* Tablet (medium) */
@media (min-width: 640px) and (max-width: 1023px) {
  :root {
    --rail-w: 52px;
    --header-h: 44px;
    --toolbar-row-h: 46px;
  }
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  width: 100%;
  background: var(--theme-bg);
  font-family: var(--font);
  color: var(--theme-text);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  overscroll-behavior: none;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; border: none; background: none; padding: 0; }
a { color: var(--theme-primary); text-decoration: none; }
svg { display: block; }
.hidden { display: none !important; }
.mono { font-family: var(--font-mono); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

:focus-visible {
  outline: 2px solid var(--theme-primary);
  outline-offset: 2px;
  border-radius: 6px;
}

.app-shell {
  display: grid;
  grid-template-columns: var(--rail-w) 1fr;
  grid-template-rows: var(--header-h) 1fr auto;
  grid-template-areas:
    "rail header"
    "rail body"
    "rail toolbar";
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

@media (max-width: 1023px) {
  .app-shell {
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "body"
      "toolbar";
  }
}

.rail {
  grid-area: rail;
  background: var(--theme-surface);
  border-right: 1px solid var(--theme-glass-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: calc(10px + var(--safe-top)) 0 calc(10px + var(--safe-bottom));
  overflow-y: auto;
  scrollbar-width: none;
  z-index: 30;
}
.rail::-webkit-scrollbar { display: none; }

@media (max-width: 1023px) { .rail { display: none; } }

.rail-top, .rail-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.rail-logo {
  width: 36px; height: 36px;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
  background: var(--theme-surface-elevated);
  border: 1px solid var(--theme-glass-border);
  display: flex; align-items: center; justify-content: center;
  color: var(--theme-primary);
}
.rail-logo img { width: 100%; height: 100%; object-fit: cover; }
.rail-logo svg { width: 18px; height: 18px; stroke-width: 2; }

.rail-item {
  width: 36px; height: 36px;
  border-radius: 9px;
  color: var(--theme-text-tertiary);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s var(--ease);
  position: relative;
  text-decoration: none;
}
.rail-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.rail-item:hover { color: var(--theme-text-secondary); background: var(--theme-glass-bg); }
.rail-item.active {
  color: var(--theme-primary);
  background: var(--theme-primary-soft);
}
.rail-item.active::before {
  content: '';
  position: absolute;
  left: -7px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 18px;
  border-radius: 0 3px 3px 0;
  background: var(--theme-primary);
}
.rail-item.guest-signin {
  width: auto;
  padding: 0 8px;
  gap: 5px;
  font-size: 10px;
  font-weight: 700;
  background: var(--theme-primary-soft);
  color: var(--theme-primary);
  border: 1px solid var(--theme-primary-glow);
}
.rail-item.guest-signin:hover { background: var(--theme-primary); color: #0a0c10; }
.rail-divider { width: 22px; height: 1px; background: var(--theme-divider); margin: 5px 0; }

.header {
  grid-area: header;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  padding-left: calc(10px + var(--safe-left));
  padding-right: calc(10px + var(--safe-right));
  background: var(--theme-surface);
  border-bottom: 1px solid var(--theme-glass-border);
  position: relative;
  z-index: 20;
  min-width: 0;
}
@media (max-width: 639px) {
  .header { padding: 0 6px; gap: 4px; }
}

.header-menu-btn {
  width: 28px; height: 28px;
  border-radius: 7px;
  color: var(--theme-text-secondary);
  display: none;
  align-items: center; justify-content: center;
  flex-shrink: 0;
}
.header-menu-btn:hover { background: var(--theme-glass-bg); color: var(--theme-text); }
.header-menu-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }
@media (max-width: 1023px) { .header-menu-btn { display: flex; } }

.header-left {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  flex: 1;
}

.header-breadcrumb {
  display: flex;
  align-items: center;
  gap: 3px;
  min-width: 0;
  overflow: hidden;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--theme-text-secondary);
}
@media (max-width: 639px) {
  .header-breadcrumb { font-size: 10.5px; }
}
.header-breadcrumb .seg {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.header-breadcrumb .seg.current { color: var(--theme-text); font-weight: 700; }
.header-breadcrumb .sep { color: var(--theme-text-tertiary); opacity: 0.6; flex-shrink: 0; }

.dirty-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--theme-primary);
  opacity: 0;
  transition: opacity 0.2s var(--ease);
  flex-shrink: 0;
}
.dirty-dot.visible { opacity: 1; }

.header-guest-badge {
  display: none;
  padding: 1px 5px;
  font-size: 8px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  background: var(--theme-primary-soft);
  color: var(--theme-primary);
  border-radius: 3px;
  flex-shrink: 0;
}
.header-guest-badge.visible { display: inline-block; }

.header-right {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}

.header-btn {
  height: 28px;
  padding: 0 8px;
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  color: var(--theme-text-secondary);
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  transition: all 0.15s var(--ease);
  white-space: nowrap;
  flex-shrink: 0;
}
.header-btn:hover { color: var(--theme-text); border-color: var(--theme-primary-glow); }
.header-btn:active { transform: scale(0.96); }
.header-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; flex-shrink: 0; }
.header-btn.primary {
  background: var(--theme-primary);
  color: #0a0c10;
  border-color: var(--theme-primary);
}
[data-theme="light"] .header-btn.primary { color: #ffffff; }
.header-btn.primary:hover { background: var(--theme-primary-hover); }
.header-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.header-btn .lbl { display: inline; }
@media (max-width: 639px) {
  .header-btn .lbl { display: none; }
  .header-btn { padding: 0 6px; width: 26px; height: 26px; justify-content: center; }
  .header-btn.split { padding: 0; width: auto; gap: 0; }
  .header-btn.split .main { width: 22px; padding: 0; justify-content: center; display: flex; align-items: center; }
  .header-btn.split .caret { width: 12px; padding: 0; display: flex; align-items: center; justify-content: center; border-left: 1px solid rgba(0,0,0,0.15); height: 18px; }
  .header-btn svg { width: 11px; height: 11px; }
}

.header-btn.split { padding: 0; gap: 0; }
.header-btn.split .main {
  padding: 0 6px 0 8px;
  display: flex; align-items: center; gap: 5px;
  height: 100%;
}
.header-btn.split .caret {
  padding: 0 5px;
  border-left: 1px solid var(--theme-glass-border);
  display: flex; align-items: center;
  height: 60%;
  color: var(--theme-text-secondary);
}
.header-btn.split .caret:hover { color: var(--theme-text); }
.header-btn.split .caret svg { width: 10px; height: 10px; }

.menu-popover {
  position: absolute;
  top: calc(100% + 4px);
  right: 10px;
  min-width: 150px;
  background: var(--theme-surface-card-solid);
  border: 1px solid var(--theme-glass-border);
  border-radius: 9px;
  padding: 4px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  z-index: 100;
  animation: menuIn 0.15s var(--ease);
}
@keyframes menuIn {
  from { opacity: 0; transform: translateY(-4px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.menu-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 9px;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--theme-text);
  width: 100%;
  text-align: left;
}
.menu-row:hover { background: var(--theme-glass-bg); }
.menu-row svg { width: 12px; height: 12px; stroke: var(--theme-text-tertiary); fill: none; stroke-width: 2.2; }
.menu-row .check { margin-left: auto; color: var(--theme-primary); font-weight: 800; }

.app-body {
  grid-area: body;
  display: flex;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--theme-surface);
  border-right: 1px solid var(--theme-glass-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
  transition: transform 0.28s var(--ease);
  z-index: 25;
}
@media (max-width: 1023px) {
  .sidebar {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: min(88vw, 320px);
    transform: translateX(-100%);
    box-shadow: 6px 0 40px rgba(0,0,0,0.35);
  }
  .sidebar.open { transform: translateX(0); }
}

.sidebar-backdrop {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(10, 12, 16, 0.6);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  z-index: 24;
}
@media (max-width: 1023px) {
  .sidebar-backdrop.open { display: block; }
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-bottom: 1px solid var(--theme-glass-border);
  flex-shrink: 0;
}
.sidebar-title {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--theme-text-tertiary);
}
.sidebar-close {
  width: 22px; height: 22px;
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  color: var(--theme-text-tertiary);
}
.sidebar-close:hover { color: var(--theme-text); background: var(--theme-glass-bg); }
.sidebar-close svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.4; }
@media (min-width: 1024px) { .sidebar-close { display: none; } }

.sidebar-tabs {
  display: flex;
  gap: 2px;
  padding: 5px 7px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--theme-glass-border);
  flex-shrink: 0;
}
.sidebar-tabs::-webkit-scrollbar { display: none; }
.sidebar-tab {
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.15s var(--ease);
}
.sidebar-tab:hover { color: var(--theme-text); background: var(--theme-glass-bg); }
.sidebar-tab.active { color: var(--theme-primary); background: var(--theme-primary-soft); }
@media (max-width: 639px) {
  .sidebar-tab { padding: 3px 6px; font-size: 9.5px; }
}

.sidebar-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  padding: 6px;
  min-height: 0;
  overscroll-behavior: contain;
}
.sidebar-body::-webkit-scrollbar { width: 5px; }
.sidebar-body::-webkit-scrollbar-thumb { background: var(--theme-divider); border-radius: 3px; }

.editor-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

.editor-tabs {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--theme-surface);
  border-bottom: 1px solid var(--theme-glass-border);
  flex-shrink: 0;
  height: 30px;
}
.editor-tabs::-webkit-scrollbar { display: none; }
.editor-tab {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 8px;
  height: 30px;
  font-size: 11px;
  font-weight: 600;
  color: var(--theme-text-tertiary);
  border-right: 1px solid var(--theme-glass-border);
  white-space: nowrap;
  flex-shrink: 0;
  position: relative;
  transition: color 0.15s var(--ease);
}
.editor-tab:hover { color: var(--theme-text); }
.editor-tab.active {
  color: var(--theme-text);
  background: var(--theme-bg);
}
.editor-tab.active::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: var(--theme-primary);
}
.editor-tab .close {
  width: 14px; height: 14px;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  color: var(--theme-text-tertiary);
  opacity: 0.6;
}
.editor-tab .close:hover { opacity: 1; background: var(--theme-glass-bg); color: var(--theme-text); }
.editor-tab .close svg { width: 8px; height: 8px; stroke: currentColor; fill: none; stroke-width: 2.4; }
.editor-tab .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--theme-primary);
}

.editor-container {
  flex: 1;
  position: relative;
  min-height: 0;
  overflow: hidden;
  transition: padding-bottom 0.28s var(--ease);
  background: var(--theme-bg);
}

.editor-loading,
.editor-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px;
  text-align: center;
  z-index: 5;
}
.editor-empty.hidden,
.editor-loading.hidden { display: none; }

.editor-empty-icon {
  width: 54px; height: 54px;
  border-radius: 15px;
  background: var(--theme-primary-soft);
  color: var(--theme-primary);
  display: flex; align-items: center; justify-content: center;
}
.editor-empty-icon svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; }
.editor-empty-title {
  font-size: 14px; font-weight: 800;
  color: var(--theme-text);
  letter-spacing: -0.3px;
}
.editor-empty-desc {
  font-size: 11.5px;
  color: var(--theme-text-tertiary);
  line-height: 1.5;
  max-width: 300px;
}
.editor-empty-actions {
  display: flex; gap: 6px;
  margin-top: 4px;
  flex-wrap: wrap;
  justify-content: center;
}

.spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--theme-primary-soft);
  border-top-color: var(--theme-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.cm-editor {
  height: 100%;
  outline: none !important;
  background: var(--theme-bg) !important;
}
.cm-editor .cm-scroller {
  font-family: var(--font-mono) !important;
  overflow: auto;
}
.cm-editor .cm-content { padding: 10px 0; }
.cm-editor .cm-line { padding-left: 4px; padding-right: 6px; }
.cm-editor .cm-gutters {
  background: var(--theme-bg) !important;

.toolbar {

}

.toolbar-row {

}

.toolbar-btn {

  height: 36px;

.toolbar-btn:hover { color: var(--theme-text); background: var(--theme-glass-bg); }
.toolbar-btn:active { transform: scale(0.94); }
.toolbar-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
.toolbar-btn.active { color: var(--theme-primary); background: var(--theme-primary-soft); }

.bottom-nav {

.nav-btn {

}

.sidebar-section-title {

}
.sidebar-section-title .actions { display: flex; gap: 1px; }

}
.sidebar-section-title .actions .act:hover { background: var(--theme-glass-bg); color: var(--theme-text); }

.sidebar-filter {

.search-file-block { margin-bottom: 8px; }

.search-file-path .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.search-match .content {

.version-item {

}

}
.version-item .meta {

  gap: 6px;
  font-size: 9px;
  color: var(--theme-text-tertiary);
  margin-bottom: 5px;
}

.notepad {
  width: 100%;
  height: calc(100% - 26px);

  background: var(--input-bg);
  border: 1px solid var(--theme-card-border);

  color: var(--theme-text);
  font-size: 11.5px;
  font-family: var(--font-mono);

}

.backdrop {
  position: fixed;
  inset: 0;
  z-index: 800;
  background: rgba(10, 12, 16, 0.7);

}

.sheet {
  position: fixed;
  left: 0; right: 0;
  bottom: 0;
  max-height: 90vh;

  border-top: 1px solid var(--theme-glass-border);
  border-radius: 18px 18px 0 0;

  .sheet {
    left: 50%; right: auto;

    max-height: 85vh;
    transform: translate(-50%, -46%);
    border-radius: 16px;
    border: 1px solid var(--theme-glass-border);

.sheet-handle {

.sheet-header {

}

}
.sheet-close {
  width: 26px; height: 26px;

  display: flex; align-items: center; justify-content: center;

}
.sheet-close:hover { background: var(--theme-glass-bg); color: var(--theme-text); }
.sheet-close svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; }

.sheet-body {

}
.sheet-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--theme-divider);

/* Symbols sheet — hidden by default, no blur, editor stays visible */
.symbols-sheet {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--bottom-nav-h) + var(--safe-bottom));
  background: var(--theme-surface);
  border-top: 1px solid var(--theme-glass-border);
  z-index: 720;
  transform: translateY(100%);
  visibility: hidden;
  pointer-events: none;
  transition: transform 0.28s var(--ease), visibility 0s linear 0.28s;
  padding-bottom: 6px;
}

}
.symbols-sheet.open {
  transform: translateY(0);
  visibility: visible;
  pointer-events: auto;
  transition: transform 0.28s var(--ease), visibility 0s linear 0s;
}

.symbols-sheet-inner { padding: 8px 10px; }

  display: flex;

.symbols-sheet-title {

  font-weight: 800;

  letter-spacing: 0.5px;

.symbol-btn {

  align-items: center;
  justify-content: center;
  transition: all 0.12s var(--ease);
}
@media (max-width: 639px) {
  .symbol-btn { height: 34px; font-size: 12px; }
}
.symbol-btn:hover { background: var(--theme-primary-soft); color: var(--theme-primary); border-color: var(--theme-primary-glow); }

.preview-fullscreen {

.btn {

  align-items: center;
  justify-content: center;

  padding: 7px 12px;
  border-radius: 7px;
  font-size: 11.5px;
  font-weight: 700;
  border: 1px solid transparent;

  white-space: nowrap;
  min-height: 30px;
  font-family: inherit;
  flex-shrink: 0;
}
.btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; flex-shrink: 0; }

.btn-primary { background: var(--theme-primary); color: #0a0c10; }

.btn-primary:hover:not(:disabled) { background: var(--theme-primary-hover); }

.btn-secondary { background: var(--theme-glass-bg); color: var(--theme-text); border-color: var(--theme-card-border); }
.btn-secondary:hover:not(:disabled) { background: var(--theme-surface-elevated); border-color: var(--theme-primary-glow); }

.btn-ghost { background: transparent; color: var(--theme-text-secondary); }
.btn-ghost:hover:not(:disabled) { color: var(--theme-text); background: var(--theme-glass-bg); }

.btn-danger { background: var(--theme-danger); color: #ffffff; }

.btn-outline-danger { background: transparent; color: var(--theme-danger); border-color: rgba(239, 68, 68, 0.3); }

.btn-sm { padding: 4px 8px; font-size: 10.5px; min-height: 24px; border-radius: 5px; }

.btn-block { width: 100%; }
.btn-icon { padding: 5px; min-width: 24px; }

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field:last-child { margin-bottom: 0; }
.field-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.field-hint { font-size: 10px; color: var(--theme-text-tertiary); line-height: 1.4; }

.input, .textarea {
  width: 100%;
  padding: 8px 10px;
  background: var(--input-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 6px;
  color: var(--theme-text);
  font-size: 12px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s var(--ease);

.setup-grid { display: flex; flex-direction: column; gap: 5px; }
.setup-row {

  align-items: center;

  padding: 10px 12px;
  border-radius: 9px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  cursor: pointer;
  transition: all 0.15s var(--ease);
  text-align: left;
  width: 100%;
}
.setup-row:hover { border-color: var(--theme-primary-glow); background: var(--theme-surface-elevated); transform: translateY(-1px); }

  border-radius: 8px;
  background: var(--theme-primary-soft);

  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.setup-row-info { flex: 1; min-width: 0; }
.setup-row-title {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--theme-text);

.toast {

<script type="module">
"use strict";

console.log("[Folio] Boot");

const API_BASE = 'https://foliostudios.vercel.app/api';
const API_AUTH = API_BASE + '/auth';
const API_HOST = API_BASE + '/host';

const STORAGE = {
  theme: 'folio.theme',
  prefs: 'folio.editorPrefs',
  session: 'folio.session',
  user: 'folio.user',
  lastProject: 'folio.lastProject',
  lastFile: 'folio.lastFile',
  previewMode: 'folio.previewMode',
  guestBannerDismissed: 'folio.guestBannerDismissed',
  pendingInsert: 'folio.pendingInsert',
};

const DB_NAME = 'folio';
const DB_VERSION = 2;
const AUTOSAVE_DELAY = 2000;
const SYNTAX_CACHE_TTL = 7 * 24 * 60 * 60 * 1000;

const DEFAULT_PREFS = {
  fontSize: 14, lineHeight: 1.5, tabSize: 2, softTabs: true,
  lineNumbers: true, wordWrap: true, activeLine: true, bracketMatching: true,
  jsLint: true, jsonLint: true, autosaveDelay: 2000, formatOnSave: false,
};

const FALLBACK_SYNTAX = {
  html: 'https://esm.sh/@codemirror/lang-html@6.4.6',
  htm: 'https://esm.sh/@codemirror/lang-html@6.4.6',
  css: 'https://esm.sh/@codemirror/lang-css@6.2.1',
  js: 'https://esm.sh/@codemirror/lang-javascript@6.2.1',
  mjs: 'https://esm.sh/@codemirror/lang-javascript@6.2.1',
  cjs: 'https://esm.sh/@codemirror/lang-javascript@6.2.1',
  json: 'https://esm.sh/@codemirror/lang-json@6.0.1',
  md: 'https://esm.sh/@codemirror/lang-markdown@6.2.3',
  markdown: 'https://esm.sh/@codemirror/lang-markdown@6.2.3',
};

const SETUP_PAGES = [
  { id: 'projects', title: 'Projects', desc: 'All your projects', icon: 'i-folder', href: '/projects' },
  { id: 'tools', title: 'Tools', desc: 'Web-dev utilities', icon: 'i-code', href: '/tools' },
  { id: 'analytics', title: 'Analytics', desc: 'Usage across projects', icon: 'i-hash', href: '/analytics' },
  { id: 'profile', title: 'Profile', desc: 'Your public profile', icon: 'i-edit', href: '/profile', requiresAuth: true },
  { id: 'settings', title: 'Settings', desc: 'App configuration', icon: 'i-more', href: '/settings' },
  { id: 'offline', title: 'Offline page', desc: 'Preview offline fallback', icon: 'i-file-text', href: '/offline' },
];

const S = {
  session: null, user: null, isGuest: true, online: true,
  projects: [], currentProject: null, openFiles: [], activeFile: null,
  dirtyFiles: new Set(), expandedFolders: new Set(), fileFilter: '',
  prefs: { ...DEFAULT_PREFS }, previewMode: 'fullscreen',
  sidebarPanel: 'files', sidebarOpen: false, symbolsOpen: false,
  syntaxMap: null, ctrlLatch: false,
};

const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'dataset' && typeof v === 'object') Object.assign(node.dataset, v);
    else if (v === true) node.setAttribute(k, '');
    else node.setAttribute(k, v);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.appendChild(typeof child === 'string' || typeof child === 'number'
      ? document.createTextNode(String(child)) : child);
  }
  return node;
}

function icon(name, size = 14) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', String(size));
  svg.setAttribute('height', String(size));
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', '#i-' + name);
  svg.appendChild(use);
  return svg;
}

function iconHTML(name, size = 14) {
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-' + name + '"/></svg>';
}

function relativeTime(ts) {
  if (!ts) return '—';
  const diff = Date.now() - ts;
  if (diff < 60000) return 'Just now';
  const m = Math.floor(diff / 60000);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  if (d < 7) return `${d}d ago`;
  return new Date(ts).toLocaleDateString();
}

function fileIconName(path) {
  const ext = (path.split('.').pop() || '').toLowerCase();
  if (['html', 'htm', 'css', 'scss', 'less', 'js', 'mjs', 'cjs', 'jsx', 'ts', 'tsx'].includes(ext)) return 'file-code';
  if (ext === 'json') return 'file-json';
  if (['md', 'markdown', 'txt'].includes(ext)) return 'file-text';
  if (['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'].includes(ext)) return 'file-image';
  return 'file';
}

function isTextFile(path) {
  return /\.(html?|css|js|mjs|cjs|jsx|tsx?|py|json|md|txt|ya?ml)$/i.test(path);
}

function isPlaceholder(path) {
  return /(^|\/)\.gitkeep$/i.test(path) || /(^|\/)\.keep$/i.test(path);
}

function debounce(fn, ms) {
  let t = null;
  return function (...args) {
    if (t) clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

function loadPrefs() {
  try {
    const raw = localStorage.getItem(STORAGE.prefs);
    if (raw) {
      const parsed = JSON.parse(raw);
      Object.assign(S.prefs, DEFAULT_PREFS, parsed);
    }
  } catch {}
}

function readSession() {
  try { S.session = localStorage.getItem(STORAGE.session); } catch {}
  try {
    const raw = localStorage.getItem(STORAGE.user);
    S.user = raw ? JSON.parse(raw) : null;
  } catch {}
  S.isGuest = !S.session;
}

async function apiFetch(url, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (S.session) headers['Authorization'] = `Bearer ${S.session}`;
  try {
    const res = await fetch(url, { ...opts, headers });
    let data = {};
    try { data = await res.json(); } catch {}
    return { ok: res.ok, status: res.status, data };
  } catch (err) {
    return { ok: false, status: 0, data: { error: 'NETWORK_ERROR' } };
  }
}

const toastQueue = [];
let toastActive = false;

function toast(message, type = 'info', duration) {
  const d = duration ?? (type === 'error' || type === 'warning' ? 5000 : 3000);
  toastQueue.push({ message, type, duration: d });
  if (!toastActive) drainToast();
}
window.toast = toast;

function drainToast() {
  const next = toastQueue.shift();
  if (!next) { toastActive = false; return; }
  toastActive = true;
  const container = $('toastContainer');
  if (!container) { toastActive = false; return; }
  const node = el('div', { class: `toast ${next.type}` },
    icon(next.type === 'success' ? 'check' : next.type === 'error' ? 'alert' : next.type === 'warning' ? 'alert' : 'info', 12),
    el('span', {}, next.message)
  );
  container.appendChild(node);
  requestAnimationFrame(() => node.classList.add('show'));
  setTimeout(() => {
    node.classList.remove('show');
    setTimeout(() => {
      node.remove();
      toastActive = false;
      drainToast();
    }, 250);
  }, next.duration);
}

let sheetOpen = false;

function openSheet({ title, body, footer, onClose }) {
  const sheet = $('sheet');
  const backdrop = $('backdrop');
  if (!sheet) return;
  sheet._onClose = onClose || null;
  $('sheetTitle').textContent = title || 'Panel';
  $('sheetBody').innerHTML = '';
  if (body instanceof Node) $('sheetBody').appendChild(body);
  else if (typeof body === 'string') $('sheetBody').innerHTML = body;

  const footerEl = $('sheetFooter');
  footerEl.innerHTML = '';
  if (footer instanceof Node) {
    footerEl.appendChild(footer);
    footerEl.style.display = 'flex';
  } else if (Array.isArray(footer) && footer.length) {
    footer.forEach(n => footerEl.appendChild(n));
    footerEl.style.display = 'flex';
  } else {
    footerEl.style.display = 'none';
  }

  backdrop.classList.add('visible');
  sheet.classList.add('open');
  sheetOpen = true;
}

function closeSheet() {
  if (!sheetOpen) return;
  const sheet = $('sheet');
  const backdrop = $('backdrop');
  sheet.classList.remove('open');
  backdrop.classList.remove('visible');
  sheetOpen = false;
  const cb = sheet._onClose;
  sheet._onClose = null;
  setTimeout(() => {
    $('sheetBody').innerHTML = '';
    $('sheetFooter').innerHTML = '';
    if (cb) try { cb(); } catch (e) { console.error(e); }
  }, 300);
}

let confirmResolve = null;

function confirm({ title, message, confirmLabel = 'Confirm', danger = false }) {
  return new Promise((resolve) => {
    confirmResolve = resolve;
    const dialog = $('confirmDialog');
    const backdrop = $('backdrop');
    $('confirmTitle').textContent = title || 'Are you sure?';
    $('confirmMessage').textContent = message || '';
    $('confirmOk').textContent = confirmLabel;
    $('confirmOk').className = danger ? 'btn btn-danger' : 'btn btn-primary';
    backdrop.classList.add('visible');
    dialog.classList.add('open');
    setTimeout(() => $('confirmOk')?.focus(), 50);
  });
}
window.confirm = confirm;

function resolveConfirm(value) {
  const dialog = $('confirmDialog');
  const backdrop = $('backdrop');
  dialog.classList.remove('open');
  if (!sheetOpen) backdrop.classList.remove('visible');
  const r = confirmResolve;
  confirmResolve = null;
  if (r) r(value);
}

let dbConn = null;

async function openDB() {
  if (dbConn) return dbConn;
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { dbConn = req.result; resolve(dbConn); };
    req.onupgradeneeded = (event) => {
      const conn = event.target.result;
      if (!conn.objectStoreNames.contains('projects')) conn.createObjectStore('projects', { keyPath: 'pid' });
      if (!conn.objectStoreNames.contains('files')) {
        const store = conn.createObjectStore('files', { keyPath: ['pid', 'path'] });
        store.createIndex('pid', 'pid');
      }
      if (!conn.objectStoreNames.contains('versions')) {
        const store = conn.createObjectStore('versions', { keyPath: 'vid' });
        store.createIndex('pid', 'pid');
      }
      if (!conn.objectStoreNames.contains('projectMeta')) conn.createObjectStore('projectMeta', { keyPath: 'pid' });
      if (!conn.objectStoreNames.contains('syntaxCache')) conn.createObjectStore('syntaxCache', { keyPath: 'key' });
      if (!conn.objectStoreNames.contains('syncQueue')) conn.createObjectStore('syncQueue', { keyPath: 'id', autoIncrement: true });
    };
  });
}

function dbWrap(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbTx(store, mode = 'readonly') {
  return dbConn.transaction(store, mode).objectStore(store);
}

const db = {
  async listProjects() {
    const all = await dbWrap(dbTx('projects').getAll());
    return all.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  },
  async getProject(pid) { return dbWrap(dbTx('projects').get(pid)); },
  async putProject(p) { return dbWrap(dbTx('projects', 'readwrite').put(p)); },
  async deleteProject(pid) {
    await dbWrap(dbTx('projects', 'readwrite').delete(pid));
    const files = await dbWrap(dbTx('files').index('pid').getAll(pid));
    for (const f of files) await dbWrap(dbTx('files', 'readwrite').delete([f.pid, f.path]));
    const versions = await dbWrap(dbTx('versions').index('pid').getAll(pid));
    for (const v of versions) await dbWrap(dbTx('versions', 'readwrite').delete(v.vid));
  },
  async listFiles(pid) { return dbWrap(dbTx('files').index('pid').getAll(pid)); },
  async getFile(pid, path) { return dbWrap(dbTx('files').get([pid, path])); },
  async putFile(pid, path, content) {
    return dbWrap(dbTx('files', 'readwrite').put({ pid, path, content, updatedAt: Date.now() }));
  },
  async deleteFile(pid, path) { return dbWrap(dbTx('files', 'readwrite').delete([pid, path])); },
  async listVersions(pid) {
    const all = await dbWrap(dbTx('versions').index('pid').getAll(pid));
    return all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  },
  async getVersion(vid) { return dbWrap(dbTx('versions').get(vid)); },
  async putVersion(v) { return dbWrap(dbTx('versions', 'readwrite').put(v)); },
  async deleteVersion(vid) { return dbWrap(dbTx('versions', 'readwrite').delete(vid)); },
  async getProjectMeta(pid) {
    const m = await dbWrap(dbTx('projectMeta').get(pid));
    return m || { pid, notepad: '' };
  },
  async setProjectMeta(pid, patch) {
    const current = await this.getProjectMeta(pid);
    return dbWrap(dbTx('projectMeta', 'readwrite').put({ ...current, ...patch, pid }));
  },
  async getSyntaxCache() {
    const c = await dbWrap(dbTx('syntaxCache').get('map'));
    return c || null;
  },
  async setSyntaxCache(map) {
    return dbWrap(dbTx('syntaxCache', 'readwrite').put({ key: 'map', map, fetchedAt: Date.now() }));
  },
  async enqueueSync(op) {
    if (!S.session) return;
    return dbWrap(dbTx('syncQueue', 'readwrite').add({ ...op, ts: Date.now() }));
  },
};

// Tag pieces (safe to keep literal):
// Built via concat so the literal close-tag sequence never appears in source.
const TAG_SCRIPT_OPEN  = '<' + 'script>';
const TAG_SCRIPT_CLOSE = '<' + '/script>';
const TAG_STYLE_OPEN   = '<' + 'style>';
const TAG_STYLE_CLOSE  = '<' + '/style>';

const cm = {
  view: null,
  modules: null,
  commands: null,
  mergeMod: null,
  lintMod: null,
  _loading: null,
  _initToken: 0,
  _langCache: new Map(),
  _prettierCache: new Map(),

  async loadSyntaxMap() {
    if (S.syntaxMap) return S.syntaxMap;
    try {
      const cached = await db.getSyntaxCache();
      if (cached && (Date.now() - cached.fetchedAt) < SYNTAX_CACHE_TTL) {
        S.syntaxMap = cached.map;
        return S.syntaxMap;
      }
    } catch {}
    try {
      let res = await fetch('/syntax.json', { cache: 'force-cache' });
      if (!res.ok) res = await fetch('/synthax.json', { cache: 'force-cache' });
      if (res.ok) {
        const map = await res.json();
        S.syntaxMap = map;
        try { await db.setSyntaxCache(map); } catch {}
        return map;
      }
    } catch {}
    S.syntaxMap = FALLBACK_SYNTAX;
    return S.syntaxMap;
  },

  async loadModules() {
  if (this.modules) return this.modules;
  if (this._loading) return this._loading;

  // Shared peer versions — pinned via ?external so every package shares ONE instance.
  // esm.sh's ?external is more reliable than ?deps for forcing shared singletons.
  const SHARED = 'external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/search,@codemirror/lint,@lezer/common,@lezer/highlight,@lezer/lr';

  const withExt = (url) => `${url}${url.includes('?') ? '&' : '?'}${SHARED}`;

  this._loading = (async () => {
    // Load the base modules FIRST, unpinned, to guarantee correct shape.
    const stateMod = await import('https://esm.sh/@codemirror/state@6.3.1');
    const viewMod  = await import('https://esm.sh/@codemirror/view@6.22.0');
    const langMod  = await import('https://esm.sh/@codemirror/language@6.10.1');

    // Then everything else that depends on them.
    const [codemirrorPkg, oneDark, searchMod, commandsMod, lintMod, mergeMod] = await Promise.all([
      import(withExt('https://esm.sh/codemirror@6.0.2')),
      import(withExt('https://esm.sh/@codemirror/theme-one-dark@6.1.2')),
      import(withExt('https://esm.sh/@codemirror/search@6.5.0')),
      import(withExt('https://esm.sh/@codemirror/commands@6.3.0')),
      import(withExt('https://esm.sh/@codemirror/lint@6.5.0')),
      import(withExt('https://esm.sh/@codemirror/merge@6.4.0')),
    ]);

    this.modules = {
      basicSetup: codemirrorPkg.basicSetup,
      EditorView: viewMod.EditorView,
      EditorState: stateMod.EditorState,
      keymap: viewMod.keymap,
      oneDark: oneDark.oneDark,
    };
    this.commands = {
      undo: commandsMod.undo,
      redo: commandsMod.redo,
      openSearchPanel: searchMod.openSearchPanel,
    };
    this.lintMod = lintMod;
    this.mergeMod = mergeMod;

    // Verify the critical facades exist before anyone calls .of on them.
    const missing = [];
    if (!this.modules.EditorView) missing.push('EditorView');
    if (!this.modules.EditorState) missing.push('EditorState');
    if (!this.modules.basicSetup) missing.push('basicSetup');
    if (!this.modules.EditorView?.contentAttributes) missing.push('EditorView.contentAttributes');
    if (!this.modules.EditorView?.lineWrapping) missing.push('EditorView.lineWrapping');
    if (missing.length) {
      this._loading = null;
      this.modules = null;
      throw new Error('CodeMirror modules missing: ' + missing.join(', '));
    }

    return this.modules;
  })();

  try { return await this._loading; }
  catch (e) { this._loading = null; throw e; }
},
  async getLanguageExtension(path) {
    const ext = (path.split('.').pop() || '').toLowerCase();
    if (!ext) return null;
    if (this._langCache.has(ext)) return this._langCache.get(ext);
    const map = await this.loadSyntaxMap();
    const url = map[ext];
    if (!url) return null;
    try {
      const mod = await import(url);
      const fnNames = ['html', 'css', 'javascript', 'json', 'markdown', 'python'];
      let extFn = null;
      if (typeof mod.default === 'function') extFn = mod.default();
      else {
        for (const fn of fnNames) {
          if (typeof mod[fn] === 'function') { extFn = mod[fn](); break; }
        }
      }
      if (extFn) this._langCache.set(ext, extFn);
      else this._langCache.set(ext, null);
      return extFn;
    } catch (err) {
      console.warn('[CM] language pack failed for', ext, err);
      this._langCache.set(ext, null);
      return null;
    }
  },

  detectLanguage(path) {
    if (!path) return 'text';
    const ext = path.split('.').pop()?.toLowerCase();
    if (ext === 'css') return 'css';
    if (['js', 'mjs', 'cjs', 'jsx', 'ts', 'tsx'].includes(ext)) return 'javascript';
    if (ext === 'json') return 'json';
    if (['md', 'markdown'].includes(ext)) return 'markdown';
    if (['html', 'htm'].includes(ext)) return 'html';
    return 'text';
  },

  buildTheme() {
    return this.modules.EditorView.theme({
      '&': { fontSize: S.prefs.fontSize + 'px' },
      '.cm-content': {
        fontSize: S.prefs.fontSize + 'px',
        tabSize: S.prefs.tabSize,
        lineHeight: String(S.prefs.lineHeight),
      },
    });
  },

  async init(container, content, path) {
    const m = await this.loadModules();
    const token = ++this._initToken;
    if (this.view) { this.view.destroy(); this.view = null; }

    const extensions = [
      m.basicSetup,
      m.oneDark,
      this.buildTheme(),
      m.EditorView.contentAttributes.of({ inputstyle: 'contenteditable' }),
    ];

    const langExt = await this.getLanguageExtension(path);
    if (langExt && token === this._initToken) extensions.push(langExt);

    if (S.prefs.wordWrap) extensions.push(m.EditorView.lineWrapping);
    if (!S.prefs.lineNumbers) extensions.push(m.EditorView.theme({ '.cm-lineNumbers': { display: 'none' } }));
if (this.detectLanguage(path) === 'json' && this.lintMod) {
  try {
    const jsonMod = await import('https://esm.sh/@codemirror/lang-json@6.0.1?external=@codemirror/state,@codemirror/view,@codemirror/language');
    if (jsonMod.jsonParseLinter && token === this._initToken) {
      extensions.push(this.lintMod.linter(jsonMod.jsonParseLinter()));
    }
  } catch {}
}

    extensions.push(m.EditorView.updateListener.of((update) => {
      if (update.docChanged) {
        if (token !== this._initToken) return;
        workspace.markDirty();
        this.scheduleAutosave();
      }
    }));

    const state = m.EditorState.create({ doc: content || '', extensions });
    if (token !== this._initToken) return null;

    this.view = new m.EditorView({ state, parent: container });

    this.view.contentDOM.addEventListener('blur', () => {
      if (workspace.activeFile && workspace.dirtyFiles.has(workspace.activeFile)) {
        workspace.saveActiveFile({ silent: true });
      }
    });

    return this.view;
  },

  scheduleAutosave() {
    if (this._autosaveTimer) clearTimeout(this._autosaveTimer);
    const delay = S.prefs.autosaveDelay ?? AUTOSAVE_DELAY;
    if (delay <= 0) return;
    this._autosaveTimer = setTimeout(() => {
      if (workspace.activeFile && workspace.dirtyFiles.has(workspace.activeFile)) {
        workspace.saveActiveFile({ silent: true });
      }
    }, delay);
  },

  getContent() { return this.view?.state.doc.toString() || ''; },
  getSelection() {
    if (!this.view) return '';
    const sel = this.view.state.selection.main;
    return this.view.state.sliceDoc(sel.from, sel.to);
  },
  selectAll() {
    if (!this.view) return;
    this.view.dispatch({ selection: { anchor: 0, head: this.view.state.doc.length } });
    this.view.focus();
  },
  replaceSelection(text) {
    if (!this.view) return;
    const sel = this.view.state.selection.main;
    this.view.dispatch({
      changes: { from: sel.from, to: sel.to, insert: text },
      selection: { anchor: sel.from + text.length },
    });
    this.view.focus();
  },
  insertText(text) {
    if (!this.view) return;
    const sel = this.view.state.selection.main;
    this.view.dispatch({
      changes: { from: sel.from, to: sel.to, insert: text },
      selection: { anchor: sel.from + text.length },
    });
    this.view.focus();
  },
  undo() { if (this.view && this.commands) this.commands.undo(this.view); },
  redo() { if (this.view && this.commands) this.commands.redo(this.view); },
  openSearch() { if (this.view && this.commands) this.commands.openSearchPanel(this.view); },
  goToLine(lineNumber) {
    if (!this.view) return;
    try {
      const clamped = Math.max(1, Math.min(lineNumber, this.view.state.doc.lines));
      const line = this.view.state.doc.line(clamped);
      this.view.dispatch({ selection: { anchor: line.from }, scrollIntoView: true });
      this.view.focus();
    } catch {}
  },
  setContent(text) {
    if (!this.view) return;
    this.view.dispatch({ changes: { from: 0, to: this.view.state.doc.length, insert: text } });
  },
  async formatCurrent() {
    if (!this.view || !workspace.activeFile) { toast('Open a file first', 'info'); return; }
    const lang = this.detectLanguage(workspace.activeFile);
    const original = this.getContent();
    if (lang === 'json') {
      try {
        const parsed = JSON.parse(original);
        this.setContent(JSON.stringify(parsed, null, S.prefs.tabSize));
        workspace.markDirty();
        toast('Formatted JSON', 'success');
      } catch { toast("Invalid JSON — can't format", 'error'); }
      return;
    }
    const parserMap = { html: 'html', css: 'css', javascript: 'babel', markdown: 'markdown' };
    const parser = parserMap[lang];
    if (!parser) { toast(`No formatter for ${lang}`, 'info'); return; }
    try {
      const prettier = await this.loadPrettier();
      const plugin = await this.loadPrettierPlugin(parser);
      const formatted = await prettier.format(original, {
        parser, plugins: plugin ? [plugin] : [],
        tabWidth: S.prefs.tabSize, useTabs: !S.prefs.softTabs, printWidth: 100,
      });
      this.setContent(formatted);
      workspace.markDirty();
      toast('Formatted ' + lang, 'success');
    } catch (err) {
      console.error('[Format]', err);
      toast('Format failed: ' + (err.message || 'syntax error'), 'error');
    }
  },
  async loadPrettier() {
    if (this._prettierCache.has('prettier')) return this._prettierCache.get('prettier');
    const mod = await import('https://esm.sh/prettier@3.2.5/standalone');
    this._prettierCache.set('prettier', mod.default || mod);
    return mod.default || mod;
  },
  async loadPrettierPlugin(parser) {
    const pluginMap = { html: 'html', css: 'postcss', babel: 'babel', markdown: 'markdown' };
    const name = pluginMap[parser];
    if (!name) return null;
    if (this._prettierCache.has('plugin-' + name)) return this._prettierCache.get('plugin-' + name);
    const mod = await import(`https://esm.sh/prettier@3.2.5/plugins/${name}`);
    const plugin = mod.default || mod;
    this._prettierCache.set('plugin-' + name, plugin);
    return plugin;
  },
  async openDiff(oldContent, newContent, title) {
    const m = this.modules;
    const merge = this.mergeMod;
    if (!m || !merge) { toast('Diff unavailable', 'error'); return; }
    const container = el('div', { style: 'height:min(60vh,500px);border:1px solid var(--theme-glass-border);border-radius:8px;overflow:hidden;' });
    const view = new m.EditorView({
      state: m.EditorState.create({
        doc: newContent,
        extensions: [
          m.basicSetup, m.oneDark,
          merge.unifiedMergeView({ original: oldContent, highlightChanges: true, gutter: true }),
          m.EditorView.editable.of(false),
        ],
      }),
      parent: container,
    });
    openSheet({ title: title || 'Changes', body: container, onClose: () => view.destroy() });
  },
  destroy() { if (this.view) { this.view.destroy(); this.view = null; } },
};

const workspace = {
  get currentProject() { return S.currentProject; },
  get activeFile() { return S.activeFile; },
  get openFiles() { return S.openFiles; },
  get dirtyFiles() { return S.dirtyFiles; },
  get dirty() { return S.dirtyFiles.size > 0; },

  async loadLastProject() {
    let pid = null;
    try { pid = localStorage.getItem(STORAGE.lastProject); } catch {}
    if (!pid) return null;
    const project = await db.getProject(pid);
    if (!project) return null;
    await this.openProject(project);
    return project;
  },

  async openProject(project) {
    S.currentProject = project;
    try { localStorage.setItem(STORAGE.lastProject, project.pid); } catch {}
    S.activeFile = null;
    S.openFiles = [];
    S.dirtyFiles.clear();
    S.expandedFolders.clear();
    S.fileFilter = '';
    updateBreadcrumb();
    updateTabs();
    updateDirtyDot();
    renderSidebar();

    let files = [];
    try { files = await db.listFiles(project.pid); } catch (err) {
      console.error('[Workspace] listFiles failed:', err);
      showEmpty('Failed to load files');
      return;
    }
    const realFiles = files.filter(f => !isPlaceholder(f.path));

    if (realFiles.length > 0) {
      let lastPath = null;
      try { lastPath = localStorage.getItem(STORAGE.lastFile); } catch {}
      const target = (lastPath && realFiles.find(f => f.path === lastPath)) || realFiles[0];
      await this.openFile(target.path);
    } else {
      showEmpty('No files yet — create one from the sidebar');
    }
  },

  async openFile(path) {
    if (!S.currentProject) return;
    const file = await db.getFile(S.currentProject.pid, path);
    if (!file) { toast('File not found', 'error'); return; }

    if (!S.openFiles.includes(path)) S.openFiles.push(path);
    S.activeFile = path;
    try { localStorage.setItem(STORAGE.lastFile, path); } catch {}
    updateBreadcrumb();
    updateTabs();
    updateDirtyDot();
    renderSidebar();

    const container = $('editorContainer');
    const loading = $('editorLoading');
    const empty = $('editorEmpty');
    if (!container) return;

    if (!cm.modules) {
      loading.classList.remove('hidden');
      empty.classList.add('hidden');
    }

    try {
      container.innerHTML = '';
      await cm.init(container, file.content, path);
      loading.classList.add('hidden');
      empty.classList.add('hidden');
    } catch (err) {
      console.error('[Workspace] Editor failed:', err);
      loading.classList.add('hidden');
      showEditorError();
    }
  },

  async closeFile(path) {
    if (path === S.activeFile && S.dirtyFiles.has(path)) {
      const ok = await confirm({ title: 'Discard unsaved changes?', message: `${path.split('/').pop()} has unsaved changes.`, confirmLabel: 'Discard', danger: true });
      if (!ok) return;
    }
    const idx = S.openFiles.indexOf(path);
    if (idx >= 0) S.openFiles.splice(idx, 1);
    S.dirtyFiles.delete(path);
    if (S.activeFile === path) {
      if (S.openFiles.length > 0) {
        await this.openFile(S.openFiles[S.openFiles.length - 1]);
      } else {
        S.activeFile = null;
        showEmpty('No file open');
      }
    }
    updateTabs();
    updateDirtyDot();
  },

  markDirty() {
    if (!S.activeFile) return;
    const was = S.dirtyFiles.size;
    S.dirtyFiles.add(S.activeFile);
    if (S.dirtyFiles.size !== was) {
      updateDirtyDot();
      updateTabs();
    }
  },

  async saveActiveFile({ silent = false } = {}) {
    if (!S.currentProject || !S.activeFile) {
      if (!silent) toast('No file open', 'info');
      return;
    }
    let content;
    if (cm.view) content = cm.getContent();
    else {
      if (!silent) toast('Editor not ready — nothing to save', 'info');
      return;
    }
    try {
      await db.putFile(S.currentProject.pid, S.activeFile, content);
      const project = await db.getProject(S.currentProject.pid);
      if (project) { project.updatedAt = Date.now(); await db.putProject(project); }
      S.dirtyFiles.delete(S.activeFile);
      updateDirtyDot();
      updateTabs();
      if (!S.isGuest) {
        db.enqueueSync({ action: 'file:put', pid: S.currentProject.pid, path: S.activeFile, content }).catch(() => {});
      }
      if (!silent) toast(S.isGuest ? 'Saved locally' : 'Saved', 'success');
    } catch (err) {
      if (err?.name === 'QuotaExceededError') {
        toast('Storage full. Delete old versions or projects.', 'error', 8000);
      } else {
        console.error('[Save]', err);
        toast("Couldn't save", 'error');
      }
    }
  },

  async saveAll() {
    const dirty = Array.from(S.dirtyFiles);
    if (dirty.length === 0) { toast('No unsaved files', 'info'); return; }
    if (S.activeFile && S.dirtyFiles.has(S.activeFile)) {
      await this.saveActiveFile({ silent: true });
    }
    for (const p of dirty) {
      if (p !== S.activeFile) S.dirtyFiles.delete(p);
    }
    updateDirtyDot();
    updateTabs();
    toast(`Saved ${dirty.length} file${dirty.length === 1 ? '' : 's'}`, 'success');
  },
};

function updateDirtyDot() {
  $('dirtyDot')?.classList.toggle('visible', S.dirtyFiles.size > 0);
  const saveBtn = $('saveBtn');
  if (saveBtn) saveBtn.disabled = S.dirtyFiles.size === 0;
}

function updateBreadcrumb() {
  const bc = $('breadcrumb');
  if (!bc) return;
  bc.innerHTML = '';
  if (!S.currentProject) {
    bc.appendChild(el('span', { class: 'seg current' }, 'No project'));
    return;
  }
  bc.appendChild(el('span', { class: S.activeFile ? 'seg' : 'seg current' }, S.currentProject.name));
  if (S.activeFile) {
    bc.appendChild(el('span', { class: 'sep' }, '›'));
    bc.appendChild(el('span', { class: 'seg current' }, S.activeFile.split('/').pop()));
  }
}

function updateTabs() {
  const tabsEl = $('tabs');
  if (!tabsEl) return;
  if (S.openFiles.length === 0) {
    tabsEl.style.display = 'none';
    tabsEl.innerHTML = '';
    return;
  }
  tabsEl.style.display = 'flex';
  tabsEl.innerHTML = '';
  for (const path of S.openFiles) {
    const isActive = path === S.activeFile;
    const isDirty = S.dirtyFiles.has(path);
    const name = path.split('/').pop();
    const tab = el('button', {
      class: `editor-tab${isActive ? ' active' : ''}`,
      type: 'button',
      onclick: () => workspace.openFile(path),
    },
      el('span', {}, name),
      isDirty ? el('span', { class: 'dot' }) : null,
      el('button', {
        class: 'close', type: 'button', 'aria-label': 'Close',
        onclick: (e) => { e.stopPropagation(); workspace.closeFile(path); },
      }, icon('x', 8))
    );
    tabsEl.appendChild(tab);
  }
}

  $('editorEmpty')?.classList.remove('hidden');

function showEditorError() {
  const container = $('editorContainer');
  if (!container) return;
  container.innerHTML = '';

  const box = el('div', { class: 'editor-empty', style: 'display:flex' });

  const iconWrap = el('div', { class: 'editor-empty-icon' });
  iconWrap.innerHTML = iconHTML('alert', 24);

  const title = el('h2', { class: 'editor-empty-title' }, 'Editor failed to load');
  const desc = el('p', { class: 'editor-empty-desc' }, 'CodeMirror needs internet the first time. Check your connection and try again.');
  const actions = el('div', { class: 'editor-empty-actions' });
  const retryBtn = el('button', { class: 'btn btn-primary', type: 'button' }, 'Try again');

const SIDEBAR_PANELS = [
  { id: 'files', label: 'Files' },
  { id: 'search', label: 'Search' },
  { id: 'versions', label: 'Versions' },
  { id: 'changes', label: 'Changes' },
  { id: 'outline', label: 'Outline' },
  { id: 'notes', label: 'Notes' },
];

function openSidebar(panel) {
  if (panel) S.sidebarPanel = panel;
  S.sidebarOpen = true;
  $('sidebar').classList.add('open');
  $('sidebarBackdrop').classList.toggle('open', window.innerWidth < 1024);
  renderSidebar();
}

function closeSidebar() {
  S.sidebarOpen = false;
  $('sidebar').classList.remove('open');
  $('sidebarBackdrop').classList.remove('open');
}

let sidebarToken = 0;

function renderSidebar() {
  const tabsEl = $('sidebarTabs');
  const bodyEl = $('sidebarBody');
  const titleEl = $('sidebarTitle');
  if (!tabsEl || !bodyEl) return;
  const token = ++sidebarToken;

  tabsEl.innerHTML = '';
  for (const p of SIDEBAR_PANELS) {
    tabsEl.appendChild(el('button', {
      class: `sidebar-tab${p.id === S.sidebarPanel ? ' active' : ''}`,
      type: 'button',
      onclick: () => { S.sidebarPanel = p.id; renderSidebar(); },
    }, p.label));
  }

  if (titleEl) {
    const cur = SIDEBAR_PANELS.find(p => p.id === S.sidebarPanel);
    titleEl.textContent = cur?.label || 'Panel';
  }

  bodyEl.innerHTML = '';
  bodyEl.scrollTop = 0;

  const paint = (fn) => {
    Promise.resolve(fn(bodyEl)).catch(err => {
      if (token !== sidebarToken) return;
      console.error('[Sidebar] render failed:', err);
      bodyEl.innerHTML = '';
      bodyEl.appendChild(el('div', { class: 'empty-state', style: 'padding:20px 6px' },
        el('div', { class: 'empty-state-title', style: 'font-size:12px' }, 'Panel failed to load'),
        el('div', { class: 'empty-state-desc', style: 'font-size:10px' }, String(err?.message || err))
      ));
    });
  };

  switch (S.sidebarPanel) {
    case 'files': paint(renderFilesPanel); break;
    case 'search': paint(renderSearchPanel); break;
    case 'versions': paint(renderVersionsPanel); break;
    case 'changes': paint(renderChangesPanel); break;
    case 'outline': paint(renderOutlinePanel); break;
    case 'notes': paint(renderNotesPanel); break;
  }
}

async function renderFilesPanel(container) {
  if (!S.currentProject) {
    container.appendChild(el('div', { class: 'empty-state', style: 'padding:20px 6px' },
      el('div', { class: 'empty-state-title' }, 'No project open'),
      el('div', { class: 'empty-state-desc' }, 'Create or open a project to see files.'),
      el('button', { class: 'btn btn-primary btn-sm', style: 'margin-top:6px', onclick: createNewProject }, icon('plus', 12), ' New project'),
      el('button', { class: 'btn btn-secondary btn-sm', style: 'margin-top:3px', onclick: openProjectsDialog }, icon('folder', 12), ' Open project')
    ));
    return;
  }

  let files = [];
  try { files = await db.listFiles(S.currentProject.pid); }
  catch (err) {
    container.appendChild(el('div', { class: 'empty-state', style: 'padding:20px 6px' },
      el('div', { class: 'empty-state-title', style: 'font-size:12px' }, "Couldn't load files"),
      el('div', { class: 'empty-state-desc', style: 'font-size:10px' }, String(err?.message || err))
    ));
    return;
  }

  const visibleFiles = files.filter(f => !isPlaceholder(f.path));

  container.appendChild(el('div', { class: 'sidebar-section-title' },
    el('span', {}, `Files (${visibleFiles.length})`),
    el('div', { class: 'actions' },
      el('button', { class: 'act', type: 'button', title: 'New file', onclick: () => createFilePrompt() }, icon('file-plus', 12)),
      el('button', { class: 'act', type: 'button', title: 'New folder', onclick: () => createFolderPrompt() }, icon('folder-plus', 12)),
      el('button', { class: 'act', type: 'button', title: 'Import file', onclick: importFile }, icon('upload', 12)),
      el('button', { class: 'act', type: 'button', title: 'Collapse all', onclick: () => { S.expandedFolders.clear(); renderSidebar(); } }, icon('collapse', 12)),
      el('button', { class: 'act', type: 'button', title: 'Expand all', onclick: expandAllFolders }, icon('expand', 12))
    )
  ));

  const filterInput = el('input', {
    type: 'search', class: 'sidebar-filter', placeholder: 'Filter files…',
    value: S.fileFilter,
    oninput: (e) => { S.fileFilter = e.target.value; refreshTree(); },
  });
  container.appendChild(filterInput);

  const treeEl = el('div');
  container.appendChild(treeEl);

  async function refreshTree() {
    if (!treeEl.isConnected) return;
    treeEl.innerHTML = '';
    const filtered = S.fileFilter
      ? visibleFiles.filter(f => f.path.toLowerCase().includes(S.fileFilter.toLowerCase()))
      : visibleFiles;

    if (filtered.length === 0) {
      treeEl.appendChild(el('div', { class: 'empty-state', style: 'padding:20px 6px' },
        el('div', { class: 'empty-state-title', style: 'font-size:12px' }, 'No files yet'),
        el('button', { class: 'btn btn-primary btn-sm', style: 'margin-top:6px', onclick: () => createFilePrompt() }, 'Create first file')
      ));
      return;
    }

    const tree = buildTree(filtered.map(f => f.path));
    try { await renderTreeNodes(treeEl, tree, 0); }
    catch (err) { console.error('[Tree]', err); }
  }

  await refreshTree();
}

function buildTree(paths) {
  const root = { name: '', children: {}, files: [], path: '' };
  for (const path of paths) {
    const parts = path.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      const part = parts[i];
      if (!node.children[part]) {
        node.children[part] = { name: part, children: {}, files: [], path: parts.slice(0, i + 1).join('/'), isFolder: true };
      }
      node = node.children[part];
    }
    node.files.push({ name: parts[parts.length - 1], path });
  }
  return root;
}

async function renderTreeNodes(container, node, depth) {
  const folderNames = Object.keys(node.children).sort();
  for (const folderName of folderNames) {
    const folder = node.children[folderName];
    const isExpanded = S.fileFilter ? true : S.expandedFolders.has(folder.path);
    const folderRow = el('div', {
      class: `tree-node is-folder${isExpanded ? ' expanded' : ''}`,
      style: `--depth:${depth}`,
      onclick: (e) => {
        if (e.target.closest('.actions')) return;
        if (S.expandedFolders.has(folder.path)) S.expandedFolders.delete(folder.path);
        else S.expandedFolders.add(folder.path);
        renderSidebar();
      },
    },
      el('span', { class: 'chevron' }, icon('chevron-right', 9)),
      el('span', { class: 'icon' }, icon(isExpanded ? 'folder-open' : 'folder', 12)),
      el('span', { class: 'name' }, folderName),
      el('div', { class: 'actions' },
        el('button', { class: 'act', type: 'button', title: 'New file', onclick: (e) => { e.stopPropagation(); createFilePrompt(folder.path); } }, icon('file-plus', 10)),
        el('button', { class: 'act', type: 'button', title: 'Rename', onclick: (e) => { e.stopPropagation(); renameFolder(folder.path); } }, icon('edit', 10)),
        el('button', { class: 'act danger', type: 'button', title: 'Delete', onclick: (e) => { e.stopPropagation(); deleteFolder(folder.path); } }, icon('trash', 10))
      )
    );
    container.appendChild(folderRow);
    if (isExpanded) {
      const child = el('div', { class: 'tree-children expanded' });
      container.appendChild(child);
      await renderTreeNodes(child, folder, depth + 1);
    }
  }

  const files = node.files.sort((a, b) => a.name.localeCompare(b.name));
  for (const file of files) {
    if (isPlaceholder(file.path)) continue;
    const isActive = file.path === S.activeFile;
    const fileRow = el('div', {
      class: `tree-node${isActive ? ' active' : ''}`,
      style: `--depth:${depth}`,
      onclick: () => workspace.openFile(file.path),
    },
      el('span', { class: 'icon' }, icon(fileIconName(file.path), 12)),
      el('span', { class: 'name' }, file.name),
      el('div', { class: 'actions' },
        el('button', { class: 'act', type: 'button', title: 'Rename', onclick: (e) => { e.stopPropagation(); renameFile(file.path); } }, icon('edit', 10)),
        el('button', { class: 'act danger', type: 'button', title: 'Delete', onclick: (e) => { e.stopPropagation(); deleteFile(file.path); } }, icon('trash', 10))
      )
    );
    container.appendChild(fileRow);
  }
}

async function createFilePrompt(parentPath = '') {
  if (!S.currentProject) { toast('No project', 'warning'); return; }
  const name = prompt('File name (e.g. index.html):');
  if (!name) return;
  const cleaned = name.trim().replace(/[^a-zA-Z0-9._/-]/g, '');
  if (!cleaned) return;
  const path = parentPath ? `${parentPath}/${cleaned}` : cleaned;
  const existing = await db.getFile(S.currentProject.pid, path);
  if (existing) { toast('File already exists', 'warning'); return; }
  await db.putFile(S.currentProject.pid, path, '');
  toast(`Created ${path}`, 'success');
  await workspace.openFile(path);
  renderSidebar();
}

async function createFolderPrompt(parentPath = '') {
  if (!S.currentProject) { toast('No project', 'warning'); return; }
  const name = prompt('Folder name:');
  if (!name) return;
  const cleaned = name.trim().replace(/[^a-zA-Z0-9._-]/g, '');
  if (!cleaned) return;
  const folderPath = parentPath ? `${parentPath}/${cleaned}` : cleaned;
  const placeholderPath = `${folderPath}/.gitkeep`;
  await db.putFile(S.currentProject.pid, placeholderPath, '');
  S.expandedFolders.add(folderPath);
  toast(`Created ${folderPath}`, 'success');
  renderSidebar();
}

async function deleteFile(path) {
  if (!S.currentProject) return;
  const ok = await confirm({ title: `Delete ${path.split('/').pop()}?`, message: "This can't be undone.", confirmLabel: 'Delete', danger: true });
  if (!ok) return;
  await db.deleteFile(S.currentProject.pid, path);
  S.dirtyFiles.delete(path);
  const idx = S.openFiles.indexOf(path);
  if (idx >= 0) S.openFiles.splice(idx, 1);
  if (S.activeFile === path) {
    S.activeFile = null;
    if (S.openFiles.length > 0) await workspace.openFile(S.openFiles[S.openFiles.length - 1]);
    else showEmpty('No file open');
  }
  toast('File deleted', 'info');
  renderSidebar();
}

async function deleteFolder(path) {
  if (!S.currentProject) return;
  const files = await db.listFiles(S.currentProject.pid);
  const inFolder = files.filter(f => f.path.startsWith(path + '/'));
  if (inFolder.length === 0) { toast('Empty folder', 'info'); return; }
  const ok = await confirm({
    title: `Delete folder ${path.split('/').pop()}?`,
    message: `Deletes ${inFolder.length} file${inFolder.length === 1 ? '' : 's'}. Cannot be undone.`,
    confirmLabel: 'Delete folder', danger: true,
  });
  if (!ok) return;
  for (const f of inFolder) {
    await db.deleteFile(S.currentProject.pid, f.path);
    S.dirtyFiles.delete(f.path);
  }
  S.expandedFolders.delete(path);
  toast('Folder deleted', 'info');
  renderSidebar();
}

async function renameFile(oldPath) {
  if (!S.currentProject) return;
  const newName = prompt('New name:', oldPath.split('/').pop());
  if (!newName) return;
  const dir = oldPath.includes('/') ? oldPath.slice(0, oldPath.lastIndexOf('/')) : '';
  const newPath = dir ? `${dir}/${newName.trim()}` : newName.trim();
  if (newPath === oldPath) return;
  const file = await db.getFile(S.currentProject.pid, oldPath);
  if (!file) return;
  await db.putFile(S.currentProject.pid, newPath, file.content);
  await db.deleteFile(S.currentProject.pid, oldPath);
  const idx = S.openFiles.indexOf(oldPath);
  if (idx >= 0) S.openFiles[idx] = newPath;
  if (S.activeFile === oldPath) S.activeFile = newPath;
  if (S.dirtyFiles.has(oldPath)) { S.dirtyFiles.delete(oldPath); S.dirtyFiles.add(newPath); }
  updateTabs();
  updateBreadcrumb();
  toast('Renamed', 'success');
  renderSidebar();
}

async function renameFolder(path) {
  if (!S.currentProject) return;
  const newName = prompt('New folder name:', path.split('/').pop());
  if (!newName) return;
  const parent = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
  const newPath = parent ? `${parent}/${newName.trim()}` : newName.trim();
  if (newPath === path) return;
  const files = await db.listFiles(S.currentProject.pid);
  const inFolder = files.filter(f => f.path.startsWith(path + '/'));
  for (const f of inFolder) {
    const newFilePath = newPath + f.path.slice(path.length);
    await db.putFile(S.currentProject.pid, newFilePath, f.content);
    await db.deleteFile(S.currentProject.pid, f.path);
    const idx = S.openFiles.indexOf(f.path);
    if (idx >= 0) S.openFiles[idx] = newFilePath;
    if (S.activeFile === f.path) S.activeFile = newFilePath;
    if (S.dirtyFiles.has(f.path)) { S.dirtyFiles.delete(f.path); S.dirtyFiles.add(newFilePath); }
  }
  toast('Folder renamed', 'success');
  updateTabs();
  renderSidebar();
}

async function importFile() {
  if (!S.currentProject) { toast('No project', 'warning'); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.multiple = true;
  input.onchange = async () => {
    const files = Array.from(input.files);
    let imported = 0;
    for (const file of files) {
      try {
        const content = await file.text();
        await db.putFile(S.currentProject.pid, file.name, content);
        imported++;
      } catch (err) { console.error('Import failed:', file.name, err); }
    }
    if (imported > 0) {
      toast(`Imported ${imported} file${imported === 1 ? '' : 's'}`, 'success');
      renderSidebar();
    }
  };
  input.click();
}

async function expandAllFolders() {
  if (!S.currentProject) return;
  const files = await db.listFiles(S.currentProject.pid);
  for (const f of files) {
    const parts = f.path.split('/');
    for (let i = 1; i < parts.length; i++) S.expandedFolders.add(parts.slice(0, i).join('/'));
  }
  renderSidebar();
}

function renderSearchPanel(container) {
  if (!S.currentProject) {
    container.innerHTML = '<div class="empty-state" style="padding:20px 6px"><div class="empty-state-title" style="font-size:12px;">No project</div></div>';
    return;
  }
  const results = el('div');
  const input = el('input', {
    type: 'search', class: 'sidebar-filter', placeholder: 'Search across all files…',
    oninput: debounce(async (e) => {
      const q = e.target.value.trim();
      if (!q) { results.innerHTML = ''; return; }
      try { await doSearch(q, results); }
      catch (err) { console.error('[Search]', err); }
    }, 300),
  });
  container.appendChild(input);
  container.appendChild(results);
}

async function doSearch(query, resultsEl) {
  resultsEl.innerHTML = '';
  const files = await db.listFiles(S.currentProject.pid);
  const lower = query.toLowerCase();
  let totalMatches = 0;

  for (const file of files) {
    if (!isTextFile(file.path) || isPlaceholder(file.path)) continue;
    const lines = file.content.split('\n');
    const matches = [];
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].toLowerCase().includes(lower)) {
        matches.push({ line: i + 1, content: lines[i].trim().slice(0, 120) });
      }
    }
    if (matches.length === 0) continue;
    totalMatches += matches.length;

    const block = el('div', { class: 'search-file-block' },
      el('div', { class: 'search-file-path' },
        el('span', { class: 'icon' }, icon(fileIconName(file.path), 10)),
        el('span', { class: 'path' }, file.path),
        el('span', { class: 'count' }, String(matches.length))
      )
    );
    for (const m of matches) {
      block.appendChild(el('div', {
        class: 'search-match',
        onclick: async () => {
          await workspace.openFile(file.path);
          setTimeout(() => cm.goToLine(m.line), 100);
        },
      },
        el('span', { class: 'line-num' }, String(m.line)),
        el('span', { class: 'content' }, m.content)
      ));
    }
    resultsEl.appendChild(block);
  }

  if (totalMatches === 0) {
    resultsEl.appendChild(el('div', { class: 'empty-state', style: 'padding:20px 6px' },
      el('div', { class: 'empty-state-title', style: 'font-size:12px' }, 'No matches'),
      el('div', { class: 'empty-state-desc', style: 'font-size:10px' }, `Nothing found for "${query}"`)
    ));
  }
}

async function renderVersionsPanel(container) {

    )
  ));

  if (versions.length === 0) {

      el('div', { class: 'empty-state-title', style: 'font-size:12px' }, 'No versions yet'),

    ));

  }

      ),

        prev ? el('button', { class: 'btn btn-secondary btn-sm', type: 'button', onclick: () => showVersionDiff(prev, v) }, 'Diff') : null,
        el('button', { class: 'btn btn-ghost btn-sm btn-icon', type: 'button', style: 'color:var(--theme-danger)', onclick: () => deleteVersionConfirm(v.vid) }, icon('trash', 10))
      )
    ));
  }

async function showVersionDiff(prevVersion, curVersion) {
  const paths = new Set([...Object.keys(prevVersion.files || {}), ...Object.keys(curVersion.files || {})]);
  const listBody = el('div');
  const section = el('div', { style: 'display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto;' });
  for (const p of Array.from(paths)) {
    const before = prevVersion.files[p] || '';
    const after = curVersion.files[p] || '';
    if (before === after) continue;
    section.appendChild(el('button', {
      class: 'btn btn-secondary btn-block', type: 'button',
      style: 'justify-content:flex-start;font-family:var(--font-mono);font-size:11px',
      onclick: () => {
        closeSheet();
        setTimeout(() => cm.openDiff(before, after, p), 250);
      },
    }, icon('code', 12), ' ' + p));
  }
  if (section.children.length === 0) {
    section.appendChild(el('div', { class: 'empty-state' }, el('div', { class: 'empty-state-desc' }, 'No file differences')));
  }
  listBody.appendChild(section);
  openSheet({ title: `Compare: ${prevVersion.message} → ${curVersion.message}`, body: listBody });
}

async function restoreVersion(vid) {
  const version = await db.getVersion(vid);
  if (!version) return;
  const files = await db.listFiles(S.currentProject.pid);
  const snapshot = {};
  for (const f of files) { if (!isPlaceholder(f.path)) snapshot[f.path] = f.content; }
  const autoVid = `v_auto_${Date.now()}`;
  try {
    await db.putVersion({
      vid: autoVid, pid: S.currentProject.pid,
      message: `Auto-snapshot before restoring "${version.message}"`,
      files: snapshot, createdAt: Date.now(),
    });
  } catch (err) { console.warn('[Restore] auto-snapshot failed:', err); }

  const ok = await confirm({
    title: 'Restore this version?',
    message: `Replaces ${files.length} file${files.length === 1 ? '' : 's'}. Current state auto-saved.`,
    confirmLabel: 'Restore', danger: true,
  });
  if (!ok) return;

  for (const f of files) await db.deleteFile(S.currentProject.pid, f.path);
  for (const [path, content] of Object.entries(version.files || {})) {
    await db.putFile(S.currentProject.pid, path, content);
  }
  S.dirtyFiles.clear();
  const firstPath = Object.keys(version.files || {})[0];
  if (S.activeFile && version.files[S.activeFile]) await workspace.openFile(S.activeFile);
  else if (firstPath) await workspace.openFile(firstPath);
  else showEmpty('Version was empty');
  toast('Version restored', 'success');
  renderSidebar();
}

async function deleteVersionConfirm(vid) {
  const ok = await confirm({ title: 'Delete this version?', message: "This can't be undone.", confirmLabel: 'Delete', danger: true });
  if (!ok) return;
  await db.deleteVersion(vid);
  toast('Version deleted', 'info');
  renderSidebar();
}

async function renderChangesPanel(container) {
  if (!S.currentProject) {
    container.innerHTML = '<div class="empty-state" style="padding:20px 6px"><div class="empty-state-title" style="font-size:12px;">No project</div></div>';
    return;
  }
  container.appendChild(el('div', { class: 'sidebar-section-title' }, el('span', {}, 'Changes')));

  if (S.dirtyFiles.size === 0) {
    container.appendChild(el('div', { class: 'empty-state', style: 'padding:20px 6px' },
      el('div', { class: 'empty-state-title', style: 'font-size:12px' }, 'No unsaved changes'),
      el('div', { class: 'empty-state-desc', style: 'font-size:10px' }, 'Edit a file to see changes.')
    ));
    return;

  if (!cm.view) {

      el('div', { class: 'empty-state-title', style: 'font-size:12px' }, 'No sections found')

      el('span', { class: 'icon' }, icon(item.icon || 'hash', 11)),
      el('span', { class: 'name' }, item.name),
      el('span', { class: 'stat' }, String(item.line + 1))
    ));

function extractOutline(content, lang) {
  const items = [];
  const lines = content.split('\n');
  if (lang === 'html') {
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const idMatch = line.match(/<(\w+)[^>]*id=["']([^"']+)["']/);
      if (idMatch) {
        const tag = idMatch[1].toLowerCase();
        const level = tag.startsWith('h') && tag.length === 2 ? parseInt(tag[1]) : 3;
        items.push({ name: `#${idMatch[2]}`, line: i, level, icon: 'hash' });
      }
      const headingMatch = line.match(/<h([1-6])[^>]*>(.*?)<\/h\1>/);
      if (headingMatch && !idMatch) {
        const level = parseInt(headingMatch[1]);
        const name = headingMatch[2].replace(/<[^>]+>/g, '').trim();
        if (name) items.push({ name, line: i, level, icon: 'hash' });
      }
    }
  } else if (lang === 'css') {
    for (let i = 0; i < lines.length; i++) {
      const match = lines[i].match(/^\s*([.#][\w-]+|\w+)\s*[{,]/);
      if (match) items.push({ name: match[1], line: i, level: 1, icon: 'code' });
    }
  } else if (lang === 'javascript') {
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const funcMatch = line.match(/(?:function\s+(\w+)|(?:const|let|var)\s+(\w+)\s*=\s*(?:async\s*)?(?:\([^)]*\)|\w+)\s*=>)/);
      if (funcMatch) {
        const name = funcMatch[1] || funcMatch[2];
        if (name) items.push({ name, line: i, level: 1, icon: 'code' });
      }
      const classMatch = line.match(/class\s+(\w+)/);
      if (classMatch) items.push({ name: classMatch[1], line: i, level: 1, icon: 'hash' });
    }
  } else if (lang === 'json') {
    for (let i = 0; i < lines.length; i++) {
      const match = lines[i].match(/^\s*"([^"]+)"\s*:/);
      if (match) items.push({ name: match[1], line: i, level: 1, icon: 'hash' });
    }
  } else if (lang === 'markdown') {
    for (let i = 0; i < lines.length; i++) {
      const match = lines[i].match(/^(#{1,6})\s+(.+)$/);
      if (match) items.push({ name: match[2], line: i, level: match[1].length, icon: 'hash' });
    }
  }
  return items;
}
