async function openCommitDialog() {
  if (!S.currentProject) { toast('No project', 'warning'); return; }
  if (S.activeFile && S.dirtyFiles.has(S.activeFile)) await workspace.saveActiveFile({ silent: true });

  const files = await db.listFiles(S.currentProject.pid);
  const versions = await db.listVersions(S.currentProject.pid);
  const lastVersion = versions[0];

  const changes = [];
  let totalAdd = 0, totalRem = 0;
  for (const f of files) {
    if (isPlaceholder(f.path)) continue;
    const before = lastVersion?.files?.[f.path] || '';
    const after = f.content || '';
    if (before === after) continue;
    const beforeLines = before.split('\n');
    const afterLines = after.split('\n');
    const add = Math.max(0, afterLines.length - beforeLines.length);
    const rem = Math.max(0, beforeLines.length - afterLines.length);
    changes.push({ path: f.path, add, rem });
    totalAdd += add;
    totalRem += rem;
  }

  if (changes.length === 0) {
    openSheet({
      title: 'Commit',
      body: el('div', { class: 'empty-state' },
        el('div', { class: 'empty-state-title' }, 'No changes'),
        el('div', { class: 'empty-state-desc' }, 'Nothing to commit since the last version.')
      ),
    });
    return;
  }

  const autoMsg = generateCommitMessage(changes, totalAdd, totalRem);

  const msgInput = el('input', {
    class: 'input', value: autoMsg, maxlength: '200',
    placeholder: 'Describe what changed…',
  });

  const changesList = el('div', { class: 'commit-changes' });
  for (const c of changes) {
    changesList.appendChild(el('div', { class: 'commit-change-row' },
      el('span', { class: 'icon' }, icon(fileIconName(c.path), 10)),
      el('span', { class: 'name' }, c.path),
      el('span', { class: 'stat' },
        el('span', { class: 'add' }, `+${c.add}`),
        ' ',
        el('span', { class: 'rem' }, `−${c.rem}`)
      )
    ));
  }

  const body = el('div', {},
    el('div', { class: 'field' },
      el('label', { class: 'field-label' }, 'Message (auto-generated)'),
      msgInput,
    ),
    el('button', {
      class: 'btn btn-ghost btn-sm', type: 'button', style: 'margin-bottom:10px',
      onclick: () => { msgInput.value = generateCommitMessage(changes, totalAdd, totalRem); },
    }, icon('refresh', 10), ' Regenerate'),
    el('div', { class: 'field' },
      el('label', { class: 'field-label' }, `Changes (${changes.length} files)`),
      changesList
    )
  );

  const footer = el('div', { style: 'display:flex;gap:6px;width:100%;' },
    el('button', { class: 'btn btn-secondary', type: 'button', onclick: closeSheet }, 'Cancel'),
    el('button', {
      class: 'btn btn-primary', type: 'button',
      onclick: async () => {
        const msg = msgInput.value.trim() || autoMsg;
        await createVersion(msg);
        closeSheet();
      },
    }, icon('check', 10), ' Commit')
  );

  openSheet({ title: 'Commit version', body, footer });
}

function generateCommitMessage(changes, totalAdd, totalRem) {
  if (changes.length === 0) return 'edit: no changes';
  if (changes.length === 1) {
    const c = changes[0];
    return `edit: ${c.path.split('/').pop()} (+${c.add}, −${c.rem})`;
  }
  if (changes.length <= 5) {
    const first = changes[0].path.split('/').pop();
    return `edit: ${first} and ${changes.length - 1} other${changes.length === 2 ? '' : 's'} (+${totalAdd}, −${totalRem})`;
  }
  return `edit: ${changes.length} files (+${totalAdd}, −${totalRem})`;
}

async function createVersion(message) {
  const files = await db.listFiles(S.currentProject.pid);
  const snapshot = {};
  for (const f of files) { if (!isPlaceholder(f.path)) snapshot[f.path] = f.content; }
  const vid = `v_${Date.now()}`;
  await db.putVersion({
    vid, pid: S.currentProject.pid, message, files: snapshot, createdAt: Date.now(),
  });
  if (!S.isGuest) {
    db.enqueueSync({ action: 'version:create', pid: S.currentProject.pid, vid, message }).catch(() => {});
  }
  toast(S.isGuest ? 'Committed locally' : 'Version committed', 'success');
  renderSidebar();
}

async function buildPreviewHtml() {
  const files = await db.listFiles(S.currentProject.pid);
  const htmlFile = files.find(f => f.path.endsWith('.html') || f.path.endsWith('.htm'));
  if (!htmlFile) return null;

  const fileMap = {};
  for (const f of files) fileMap[f.path] = f.content;

  let html = htmlFile.content;

  html = html.replace(
    /<link[^>]*href=["']([^"']+\.css)["'][^>]*>/gi,
    (match, href) => {
      const path = href.replace(/^\.\//, '');
      if (fileMap[path]) {
        return TAG_STYLE_OPEN + '\n' + fileMap[path] + '\n' + TAG_STYLE_CLOSE;
      }
      return match;
    }
  );

  const scriptRe = new RegExp(
    TAG_SCRIPT_OPEN.replace('>', '[^>]*src=["\']([^"\']+\\.js)["\'][^>]*>'),
    'gi'
  );

  html = html.replace(scriptRe, (match, src) => {
    const path = src.replace(/^\.\//, '');
    if (fileMap[path]) {
      return TAG_SCRIPT_OPEN + '\n' + fileMap[path] + '\n' + TAG_SCRIPT_CLOSE;
    }
    return match;
  });

  const consoleBridge =
    TAG_SCRIPT_OPEN + '\n' +
    '(function(){\n' +
    '  var orig = { log: console.log, warn: console.warn, error: console.error };\n' +
    '  [\'log\',\'warn\',\'error\'].forEach(function(level){\n' +
    '    console[level] = function(){\n' +
    '      try { window.parent.postMessage({ __folio: \'console\', level: level, args: Array.prototype.slice.call(arguments).map(String) }, \'*\'); } catch(e) {}\n' +
    '      return orig[level].apply(console, arguments);\n' +
    '    };\n' +
    '  });\n' +
    '})();\n' +
    TAG_SCRIPT_CLOSE;

  html = html.replace(/<head[^>]*>/i, (match) => match + consoleBridge);

  return html;
}

  });
  $('tbCut')?.addEventListener('click', async () => {
    if (!cm.view) { toast('Open a file first', 'info'); return; }
    const text = cm.getSelection();
    if (!text) { toast('Select text first', 'info'); return; }
    try {
      await navigator.clipboard.writeText(text);
      cm.replaceSelection('');
      workspace.markDirty();
      toast('Cut', 'success', 1500);
    } catch { toast("Couldn't cut", 'error'); }
  });
  $('tbPaste')?.addEventListener('click', async () => {
    if (!cm.view) { toast('Open a file first', 'info'); return; }
    try {
      const text = await navigator.clipboard.readText();
      if (!text) { toast('Clipboard empty', 'info'); return; }
      cm.replaceSelection(text);
      workspace.markDirty();
      toast('Pasted', 'success', 1500);
    } catch { toast('Clipboard access denied', 'error'); }
  });
  $('tbSelect')?.addEventListener('click', () => {
    if (!cm.view) { toast('Open a file first', 'info'); return; }
    cm.selectAll();
  });
  $('tbSymbols')?.addEventListener('click', openSymbolsSheet);
  $('tbCommit')?.addEventListener('click', openCommitDialog);
  $('tbPreview')?.addEventListener('click', launchPreview);
  $('tbHost')?.addEventListener('click', hostProject);

  $('symbolsClose')?.addEventListener('click', closeSymbolsSheet);
  $('previewFullClose')?.addEventListener('click', () => $('previewFullscreen').classList.remove('visible'));
  $('previewFullRefresh')?.addEventListener('click', () => openFullscreenPreview());
  $('previewMiniClose')?.addEventListener('click', () => $('previewMini').classList.remove('visible'));
  $('previewMiniRefresh')?.addEventListener('click', () => openMiniPreview());
  $('previewMiniFull')?.addEventListener('click', () => {
    $('previewMini').classList.remove('visible');
    openFullscreenPreview();
  });

  $('guestBannerClose')?.addEventListener('click', () => {
    $('guestBanner').classList.remove('visible');
    try { localStorage.setItem(STORAGE.guestBannerDismissed, 'true'); } catch {}
  });

  document.addEventListener('keydown', (e) => {
    if (S.ctrlLatch && !(e.ctrlKey || e.metaKey)) {
      const key = e.key.toLowerCase();
      let handled = true;
      if (key === 'a' && cm.view) cm.selectAll();
      else if (key === 's') { e.preventDefault(); workspace.saveActiveFile(); }
      else if (key === 'z' && cm.view) { e.preventDefault(); cm.undo(); }
      else if (key === 'y' && cm.view) { e.preventDefault(); cm.redo(); }
      else if (key === 'f' && cm.view) { e.preventDefault(); cm.openSearch(); }
      else if (key === 'c' && cm.view) {
        const sel = cm.getSelection();
        if (sel) navigator.clipboard.writeText(sel);
      }
      else if (key === 'v' && cm.view) {
        navigator.clipboard.readText().then(t => { if (t) { cm.replaceSelection(t); workspace.markDirty(); } });
      }
      else if (key === 'x' && cm.view) {
        const sel = cm.getSelection();
        if (sel) { navigator.clipboard.writeText(sel); cm.replaceSelection(''); workspace.markDirty(); }
      }
      else handled = false;
      if (handled) {
        e.preventDefault();
        setCtrlLatch(false);
        return;
      }
    }

    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key === 's') {
      e.preventDefault();
      if (e.shiftKey) workspace.saveAll();
      else workspace.saveActiveFile();
      return;
    }
    if (mod && e.key === 'f') {
      e.preventDefault();
      cm.view ? cm.openSearch() : openSidebar('search');
      return;
    }
    if (mod && e.shiftKey && e.key === 'F') {
      e.preventDefault();
      openSidebar('search');
      return;
    }
    if (mod && e.key === 'b') {
      e.preventDefault();
      S.sidebarOpen ? closeSidebar() : openSidebar();
      return;
    }
    if (e.key === 'Escape') {
      if ($('previewFullscreen').classList.contains('visible')) { $('previewFullscreen').classList.remove('visible'); return; }
      if (S.symbolsOpen) { closeSymbolsSheet(); return; }
      if ($('confirmDialog').classList.contains('open')) { resolveConfirm(false); return; }
      if (sheetOpen) { closeSheet(); return; }
      if (S.sidebarOpen && window.innerWidth < 1024) { closeSidebar(); return; }
      if (S.ctrlLatch) { setCtrlLatch(false); return; }
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (S.dirtyFiles.size > 0) {
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });

  const updateOnline = () => {
    S.online = navigator.onLine;
    $('offlineBanner')?.classList.toggle('visible', !S.online);
  };
  window.addEventListener('online', () => { updateOnline(); drainSyncQueue(); });
  window.addEventListener('offline', updateOnline);
  updateOnline();

  window.addEventListener('resize', () => {
    if (window.innerWidth >= 1024) {
      $('sidebarBackdrop')?.classList.remove('open');
    } else {
      if (S.sidebarOpen) $('sidebarBackdrop')?.classList.add('open');
    }
    if (S.symbolsOpen) shiftEditorForSymbols(true);
  });

  setupPreviewConsole();
}

async function boot() {
  console.log('[Boot] Starting');
  readSession();
  applyGuestState();

  try {
    const theme = localStorage.getItem(STORAGE.theme) || 'dark';
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  } catch {}
  loadPrefs();
  try { S.previewMode = localStorage.getItem(STORAGE.previewMode) || 'fullscreen'; } catch {}

  try { await openDB(); console.log('[Boot] DB opened'); }
  catch (err) {
    console.error('[Boot] DB failed:', err);
    toast('Storage initialization failed', 'error');
    return;
  }
  try { await navigator.storage?.persist?.(); } catch {}

  wireUI();
  console.log('[Boot] Wired');

  if (window.innerWidth >= 1024) openSidebar('files');

  cm.loadSyntaxMap().then(() => console.log('[Boot] Syntax map loaded'));

  try { S.projects = await db.listProjects(); }
  catch (err) { console.error('[Boot] projects load:', err); }

  try {
    const project = await workspace.loadLastProject();
    if (!project) $('editorEmpty')?.classList.remove('hidden');
  } catch (err) { console.error('[Boot] load failed:', err); }

  if (S.session) {
    apiFetch(API_AUTH + '?action=me').then(res => {
      if (res.status === 401) {
        try { localStorage.removeItem(STORAGE.session); localStorage.removeItem(STORAGE.user); } catch {}
        S.session = null;
        S.isGuest = true;
        applyGuestState();
        toast('Session expired — you are now a guest', 'warning', 4000);
      }
    }).catch(() => {});
  }

  if (!S.isGuest && S.online) drainSyncQueue();

  setTimeout(() => {
    try {
      const raw = localStorage.getItem(STORAGE.pendingInsert);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.content && (Date.now() - (parsed.at || 0)) < 60000) {
          if (cm.view) {
            cm.insertText(parsed.content);
            toast('Content inserted', 'success');
          }
        }
        localStorage.removeItem(STORAGE.pendingInsert);
      }
    } catch {}
  }, 800);

  console.log('[Boot] Complete');
}

boot().catch(err => {
  console.error('[Boot] Fatal:', err);
  toast('Startup error: ' + (err.message || 'unknown'), 'error', 8000);
});

</script>

</body>
</html>
