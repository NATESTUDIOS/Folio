  const body = el("div", { class: "panel" },
    el("div", { class: "panel-section" },
      el("div", { class: "panel-section-header" },
        el("span", { class: "panel-section-title" }, `Projects (${projects.length})`),
        el("button", {
          class: "btn btn-primary btn-sm", type: "button",
          onclick: () => { closeSheet(); setTimeout(createNewProject, 250); },
        }, icon("plus", 14), " New")
      ),
      projects.length === 0
        ? el("div", { class: "empty-state" },
            el("div", { class: "empty-state-icon" }, icon("folder", 24)),
            el("div", { class: "empty-state-title" }, "No projects yet"),
            el("div", { class: "empty-state-desc" }, "Create your first project.")
          )
        : el("div", { class: "flex flex-col gap-2" },
            ...projects.map(p => el("div", {
              class: "list-row", style: "cursor:pointer",
              onclick: async () => { closeSheet(); await workspace.openProject(p); },
            },
              el("div", { style: "flex:1;min-width:0" },
                el("div", { class: "font-semibold" }, p.name),
                el("div", { class: "text-xs text-muted" }, relativeTime(p.updatedAt))
              ),
              el("button", {
                class: "btn btn-ghost btn-sm btn-icon", type: "button", style: "color:var(--danger)",
                onclick: async (e) => {
                  e.stopPropagation();
                  const ok = await confirm({
                    title: `Delete ${p.name}?`,
                    message: "All files and versions will be deleted. Cannot be undone.",
                    confirmLabel: "Delete project", danger: true,
                  });
                  if (!ok) return;
                  await db.deleteProject(p.pid);
                  if (workspace.currentProject?.pid === p.pid) {
                    workspace.currentProject = null;
                    workspace.activeFile = null;
                    workspace.showEmpty("No project open");
                    try { localStorage.removeItem(STORAGE_KEYS.lastProject); } catch {}
                  }
                  toast("Project deleted", { type: "info" });
                  closeSheet();
                  setTimeout(renderProjectsPanel, 250);
                },
              }, icon("trash", 14))
            ))
          )
    )
  );
  openSheet({ title: "Projects", body });
}

async function createNewProject() {
  const name = prompt("Project name:");
  if (!name) return;
  const cleaned = name.trim();
  if (!cleaned) return;
  const pid = `p_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
  const slug = cleaned.toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-|-$/g, "") || "project";

  const project = { pid, name: cleaned, slug, createdAt: Date.now(), updatedAt: Date.now() };
  await db.putProject(project);
  await db.putFile(pid, "index.html", `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${cleaned}</title>
</head>
<body>
  <h1>${cleaned}</h1>
  <p>Edit this file to get started.</p>
</body>
</html>`);
  await db.putFile(pid, "style.css", `body {
  font-family: system-ui, sans-serif;
  margin: 2rem;
  background: #0a0c10;
  color: #e8ecf1;
}
`);
  toast(`Created ${cleaned}`, { type: "success" });
  await workspace.openProject(project);
  renderSidebar();
}

/* ═══════════════════════════════════════════════════════════════════════
   COMMIT PANEL
   ═══════════════════════════════════════════════════════════════════════ */

function renderCommitPanel() {
  if (!workspace.currentProject) { toast("No project", { type: "warning" }); return; }

  const textarea = el("textarea", {
    class: "textarea", placeholder: "Describe what changed…", rows: "4",
  });

  const body = el("div", { class: "panel" },
    el("div", { class: "panel-section" },
      el("span", { class: "panel-section-title" }, "Commit message"),
      textarea
    )
  );

  const footer = el("div", { style: "display:flex;gap:8px;width:100%" },
    el("button", { class: "btn btn-secondary", type: "button", onclick: closeSheet }, "Cancel"),
    el("button", {
      class: "btn btn-primary", type: "button",
      onclick: async () => {
        const msg = textarea.value.trim();
        if (!msg) { toast("Add a message", { type: "warning" }); return; }

        if (workspace.activeFile && workspace.dirtyFiles.has(workspace.activeFile)) {
          await workspace.saveActiveFile({ silent: true });
        }

        const files = await db.listFiles(workspace.currentProject.pid);
        const snapshot = {};
        for (const f of files) {
          if (isPlaceholder(f.path)) continue;
          snapshot[f.path] = f.content;
        }
        const vid = `v_${Date.now()}`;
        await db.putVersion({
          vid,
          pid: workspace.currentProject.pid,
          message: msg,
          files: snapshot,
          createdAt: Date.now(),
        });
        closeSheet();
        toast("Version committed", { type: "success" });
        renderSidebar();
      },
    }, icon("save", 14), " Commit")
  );
  openSheet({ title: "Commit changes", body, footer });
}

/* ═══════════════════════════════════════════════════════════════════════
   PREVIEW
   ═══════════════════════════════════════════════════════════════════════ */

async function renderPreviewPanel() {
  if (!workspace.currentProject) { toast("No project", { type: "warning" }); return; }
  const files = await db.listFiles(workspace.currentProject.pid);
  const htmlFile = files.find(f => f.path.endsWith(".html") || f.path.endsWith(".htm"));
  if (!htmlFile) {
    openSheet({
      title: "Preview",
      body: el("div", { class: "empty-state" },
        el("div", { class: "empty-state-title" }, "No HTML file"),
        el("div", { class: "empty-state-desc" }, "Add an index.html to preview.")
      ),
    });
    return;
  }

  const fileMap = {};
  for (const f of files) fileMap[f.path] = f.content;
  let html = htmlFile.content;

  html = html.replace(/<link[^>]*href=["']([^"']+\.css)["'][^>]*>/gi, (match, href) => {
    const path = href.replace(/^\.\//, "");
    if (fileMap[path]) return TAG.styleOpen + "\n" + fileMap[path] + "\n" + TAG.styleClose;
    return match;
  });

  const scriptSrcRegex = new RegExp("<" + "script[^>]*src=[\"']([^\"']+\\.js)[\"'][^>]*><" + "/script>", "gi");
  html = html.replace(scriptSrcRegex, (match, src) => {
    const path = src.replace(/^\.\//, "");
    if (fileMap[path]) return TAG.scriptOpen + "\n" + fileMap[path] + "\n" + TAG.scriptClose;
    return match;
  });

  const consoleBridge = [
    "<" + "script>",
    "(function(){",
    "  var orig = { log: console.log, warn: console.warn, error: console.error };",
    "  ['log','warn','error'].forEach(function(level){",
    "    console[level] = function(){",
    "      try { window.parent.postMessage({ __folio: 'console', level: level, args: Array.prototype.slice.call(arguments).map(String) }, '*'); } catch(e) {}",
    "      return orig[level].apply(console, arguments);",
    "    };",
    "  });",
    "})();",
    "<" + "/script>",
  ].join("\n");
  html = html.replace(/<head[^>]*>/i, (match) => match + consoleBridge);

  let iframeEl = null;
  let consoleEl = null;

  const buildBody = () => {
    iframeEl = el("iframe", {
      style: "width:100%;height:100%;border:none;display:block",
      sandbox: "allow-scripts allow-forms allow-modals",
    });
    iframeEl.srcdoc = html;

    consoleEl = el("div", { class: "preview-console" },
      el("div", { class: "preview-console-title" }, "Console")
    );

    return el("div", { class: "panel" },
      el("div", { class: "preview-frame" }, iframeEl),
      el("div", { style: "display:flex;gap:8px;margin-top:8px" },
        el("button", {
          class: "btn btn-secondary btn-sm", type: "button", style: "flex:1",
          onclick: () => { iframeEl.srcdoc = html; },
        }, icon("refresh", 14), " Refresh"),
        el("button", {
          class: "btn btn-secondary btn-sm", type: "button", style: "flex:1",
          onclick: () => {
            const blob = new Blob([html], { type: "text/html" });
            window.open(URL.createObjectURL(blob), "_blank");
          },
        }, " Open in tab")
      ),
      consoleEl
    );
  };

  const listener = (event) => {
    const data = event.data || {};
    if (data.__folio !== "console" || !consoleEl) return;
    consoleEl.appendChild(el("div", { class: `preview-console-line preview-console-${data.level || "log"}` },
      el("span", { class: "preview-console-dot" }),
      el("span", null, (data.args || []).join(" "))
    ));
    consoleEl.scrollTop = consoleEl.scrollHeight;
  };
  window.addEventListener("message", listener);

  openSheet({
    title: "Preview: " + htmlFile.path.split("/").pop(),
    body: buildBody(),
    onClose: () => window.removeEventListener("message", listener),
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   SYMBOLS
   ═══════════════════════════════════════════════════════════════════════ */

function renderSymbolsPanel() {
  const symbols = ["{","}","(",")","[","]","<",">","=",";",":",".",",",'"',"'","`","&","|","$","#","/","\\","!","?","%","^","~","@"];
  const body = el("div", { class: "panel" },
    el("div", { class: "panel-section" },
      el("span", { class: "panel-section-title" }, "Insert symbol"),
      el("div", { style: "display:flex;flex-wrap:wrap;gap:6px" },
        ...symbols.map(s => el("button", {
          class: "btn btn-secondary btn-sm", type: "button",
          style: "font-family:var(--font-mono);min-width:44px;min-height:44px;font-size:16px",
          onclick: () => {
            if (!cm.view) { toast("Open a file first", { type: "info" }); return; }
            cm.insertText(s);
          },
        }, s))
      )
    )
  );
  openSheet({ title: "Symbols", body });
}

/* ═══════════════════════════════════════════════════════════════════════
   DEBUG
   ═══════════════════════════════════════════════════════════════════════ */

async function renderDebugPanel() {
  const projects = await db.listProjects();
  const files = workspace.currentProject ? await db.listFiles(workspace.currentProject.pid) : [];
  const body = el("div", { class: "panel" },
    el("div", { class: "panel-section" },
      el("span", { class: "panel-section-title" }, "Debug info"),
      el("div", { class: "card card-compact" },
        el("div", { class: "text-sm" }, "DB: ", dbConn ? "✓ open" : "✗ closed"),
        el("div", { class: "text-sm" }, "CodeMirror: ", cm.modules ? "✓ loaded" : "✗ not loaded"),
        el("div", { class: "text-sm" }, "Syntax map: ", cm._syntaxMap ? "✓ loaded" : "✗ not loaded"),
        el("div", { class: "text-sm" }, "Projects: ", String(projects.length)),
        el("div", { class: "text-sm" }, "Current: ", workspace.currentProject?.name || "none"),
        el("div", { class: "text-sm" }, "Files: ", String(files.length)),
        el("div", { class: "text-sm" }, "Active: ", workspace.activeFile || "none"),
        el("div", { class: "text-sm" }, "Dirty files: ", String(workspace.dirtyFiles.size)),
        el("div", { class: "text-sm" }, "Install prompt: ", window.FOLIO?.install?.isInstalled?.() ? "installed" : "not installed"),
        el("div", { class: "text-sm" }, "SW: ", navigator.serviceWorker?.controller ? "controlled" : "no controller")
      )
    )
  );
  openSheet({ title: "Debug", body });
}

/* ═══════════════════════════════════════════════════════════════════════
   WIRING
   ═══════════════════════════════════════════════════════════════════════ */

function wireAll() {
  $$(".rail-item[data-panel]").forEach(btn => {
    btn.addEventListener("click", () => {
      const panel = btn.dataset.panel;
      if (panel === "projects") renderProjectsPanel();
      else openSidebar(panel);
    });
  });

  $("saveBtn")?.addEventListener("click", () => workspace.saveActiveFile());
  $("menuBtn")?.addEventListener("click", () => {
    openSidebar(sidebarState.tab);
    if (window.innerWidth < 768) $("sidebarBackdrop")?.classList.add("visible");
  });
  $("debugBtn")?.addEventListener("click", renderDebugPanel);

  // Hide install icon if install.js hides it. Keep the element visible by default
  // only if there's no install button elsewhere — install.js toggles .style.display.
  $("installBtn")?.removeAttribute("hidden");

  $("sidebarCloseBtn")?.addEventListener("click", closeSidebar);
  $("sidebarBackdrop")?.addEventListener("click", closeSidebar);

  $("emptyNewProject")?.addEventListener("click", createNewProject);
  $("emptyOpenProject")?.addEventListener("click", renderProjectsPanel);

  $("tbSave")?.addEventListener("click", () => workspace.saveActiveFile());
  $("tbUndo")?.addEventListener("click", () => {
    if (!cm.view) { toast("Open a file first", { type: "info" }); return; }
    cm.undo();
  });
  $("tbRedo")?.addEventListener("click", () => {
    if (!cm.view) { toast("Open a file first", { type: "info" }); return; }
    cm.redo();
  });
  $("tbSearch")?.addEventListener("click", () => {
    if (!cm.view) { toast("Open a file first", { type: "info" }); return; }
    cm.openSearch();
  });
  $("tbFormat")?.addEventListener("click", () => cm.formatCurrent());
  $("tbMore")?.addEventListener("click", () => {
    $("toolbarRow2")?.classList.toggle("visible");
  });

  $("tbNewFile")?.addEventListener("click", () => createFilePrompt());
  $("tbCopy")?.addEventListener("click", async () => {
    if (!cm.view) { toast("Open a file first", { type: "info" }); return; }
    const text = cm.getSelection();
    if (!text) { toast("Select text first", { type: "info" }); return; }
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied", { type: "success", duration: 1500 });
    } catch { toast("Couldn't copy", { type: "error" }); }
  });
  $("tbCut")?.addEventListener("click", async () => {
    if (!cm.view) { toast("Open a file first", { type: "info" }); return; }
    const text = cm.getSelection();
    if (!text) { toast("Select text first", { type: "info" }); return; }
    try {
      await navigator.clipboard.writeText(text);
      cm.replaceSelection("");
      workspace.markDirty();
      toast("Cut", { type: "success", duration: 1500 });
    } catch { toast("Couldn't cut", { type: "error" }); }
  });
  $("tbPaste")?.addEventListener("click", async () => {
    if (!cm.view) { toast("Open a file first", { type: "info" }); return; }
    try {
      const text = await navigator.clipboard.readText();
      if (!text) { toast("Clipboard empty", { type: "info" }); return; }
      cm.replaceSelection(text);
      workspace.markDirty();
      toast("Pasted", { type: "success", duration: 1500 });
    } catch { toast("Clipboard access denied", { type: "error" }); }
  });
  $("tbSelectAll")?.addEventListener("click", () => {
    if (!cm.view) { toast("Open a file first", { type: "info" }); return; }
    cm.selectAll();
  });
  $("tbSymbols")?.addEventListener("click", renderSymbolsPanel);
  $("tbCommit")?.addEventListener("click", renderCommitPanel);
  $("tbPreview")?.addEventListener("click", renderPreviewPanel);
  $("tbReset")?.addEventListener("click", async () => {
    const ok = await confirm({
      title: "Reset all data?",
      message: "Deletes all projects, files, versions, settings. Cannot be undone.",
      confirmLabel: "Reset everything", danger: true,
    });
    if (!ok) return;
    indexedDB.deleteDatabase(DB_NAME);
    try { localStorage.clear(); } catch {}
    setTimeout(() => location.reload(), 500);
  });

  document.addEventListener("keydown", (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key === "s") {
      e.preventDefault();
      workspace.saveActiveFile();
      return;
    }
    if (mod && !e.shiftKey && e.key === "k") {
      e.preventDefault();
      renderProjectsPanel();
      return;
    }
    if (mod && e.shiftKey && e.key === "F") {
      e.preventDefault();
      openSidebar("search");
      setTimeout(() => $("sidebarBody")?.querySelector("input")?.focus(), 100);
      return;
    }
    if (mod && !e.shiftKey && e.key === "g") {
      e.preventDefault();
      if (!cm.view) return;
      const line = prompt(`Go to line (1–${cm.view.state.doc.lines}):`);
      if (line) cm.goToLine(parseInt(line, 10));
      return;
    }
    if (mod && e.key === "b") {
      e.preventDefault();
      if (sidebarState.visible) closeSidebar();
      else openSidebar(sidebarState.tab);
      return;
    }
  });

  // Guard against accidental data loss — cooperates with update.js
  // (update.js calls window.confirm before reloading if dirty, so the user
  // already has a chance to cancel. This guard catches tab close / navigation.)
  window.addEventListener("beforeunload", (e) => {
    if (workspace.dirty && !(window.FOLIO?.update?.isPaused?.())) {
      e.preventDefault();
      e.returnValue = "";
      return "";
    }
  });

  window.addEventListener("resize", () => {
    if (window.innerWidth >= 768 && sidebarState.visible) {
      $("sidebarBackdrop")?.classList.remove("visible");
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════════════ */

async function boot() {
  console.log("[Boot] Starting");

  try {
    const savedTheme = localStorage.getItem(STORAGE_KEYS.theme) || "dark";
    applyTheme(savedTheme);
  } catch {}

  loadPrefs();

  try {
    await openDB();
    console.log("[Boot] DB opened");
  } catch (err) {
    console.error("[Boot] DB failed:", err);
    toast("Storage initialization failed", { type: "error" });
    return;
  }

  try { await navigator.storage?.persist?.(); } catch {}

  wireAll();
  console.log("[Boot] Wired");

  if (window.innerWidth >= 768) {
    openSidebar("files");
  } else {
    renderSidebar();
    $$(".rail-item[data-panel]").forEach(item => {
      item.classList.toggle("active", item.dataset.panel === "files");
    });
  }

  try {
    const project = await workspace.loadLastProject();
    if (!project) $("editorEmpty")?.classList.add("visible");
  } catch (err) {
    console.error("[Boot] Load failed:", err);
  }

  console.log("[Boot] Complete");
}

boot();
</script>
