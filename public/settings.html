  async function requestPersistStorage() {
    if (!navigator.storage || !navigator.storage.persist) { toast('Not supported', 'warning'); return; }
    try {
      const granted = await navigator.storage.persist();
      S.storagePersisted = granted;
      toast(granted ? 'Persistent storage granted' : 'Not granted', granted ? 'success' : 'warning');
      renderSection('storage');
    } catch { toast('Failed to request', 'error'); }
  }

  function confirmClearLocalCache() {
    confirmModal(
      'Clear local cache?',
      'All offline copies of your projects will be removed from this browser. Server data is not affected.',
      'Clear cache',
      true,
      async () => {
        showLoading('Clearing cache', '');
        try {
          if (indexedDB.databases) {
            const dbs = await indexedDB.databases();
            for (const db of dbs) if (db.name) indexedDB.deleteDatabase(db.name);
          } else {
            indexedDB.deleteDatabase('folio');
          }
        } catch {}
        hideLoading();
        toast('Cache cleared — reloading', 'success');
        setTimeout(() => location.reload(), 800);
      }
    );
  }

  function confirmResetSettings() {
    confirmModal(
      'Reset all settings?',
      'All app preferences will be wiped. You\'ll stay signed in.',
      'Reset',
      true,
      () => {
        try {
          Object.values(STORAGE).forEach(k => {
            if (k && k.startsWith('folio.') && k !== STORAGE.session && k !== STORAGE.user) {
              localStorage.removeItem(k);
            }
          });
        } catch {}
        toast('Settings reset', 'success');
        setTimeout(() => location.reload(), 600);
      }
    );
  }

  }

  async function checkForUpdates() {
    if (!S.swRegistration) { toast('Service worker not registered', 'warning'); return; }
    try {
      await S.swRegistration.update();
      if (S.swRegistration.waiting) toast('Update available — reload to apply', 'info', 4000);
      else toast('You\'re up to date', 'success');
    } catch { toast('Update check failed', 'error'); }
  }

  function confirmClearCache() {
    confirmModal(
      'Clear cache & reload?',
      'Cached app files will be removed. You may need to re-download resources on next load.',
      'Clear & reload',
      true,
      async () => {
        showLoading('Clearing cache', '');
        try {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        } catch {}
        hideLoading();
        location.reload();
      }
    );
  }

  // ═══════════════════════════════════════════════════════════
  // DATA ACTIONS
  // ═══════════════════════════════════════════════════════════

  function exportSettings() {
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      prefs: {
        theme: S.prefs.theme,
        pageScale: S.prefs.pageScale,
        reducedMotion: S.prefs.reducedMotion,
        fontFamily: S.prefs.fontFamily,
        fontSize: S.prefs.fontSize,
        lineHeight: S.prefs.lineHeight,
        tabSize: S.prefs.tabSize,
        softTabs: S.prefs.softTabs,
        lineNumbers: S.prefs.lineNumbers,
        wordWrap: S.prefs.wordWrap,
        formatOnSave: S.prefs.formatOnSave,
        emmetEnabled: S.prefs.emmetEnabled,
        activeLine: S.prefs.activeLine,
        bracketMatching: S.prefs.bracketMatching,
        autosaveDelay: S.prefs.autosaveDelay,
        jsLint: S.prefs.jsLint,
        jsonLint: S.prefs.jsonLint,
        debug: S.prefs.debug,
        autoClean: S.prefs.autoClean,
        autoCleanDays: S.prefs.autoCleanDays,
      },
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `folio-settings-${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Settings exported', 'success');
  }

  async function importSettings(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = '';

    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || typeof data !== 'object') throw new Error('Invalid file');
      if (!data.prefs || typeof data.prefs !== 'object') throw new Error('Missing prefs');
      const knownKeys = ['theme','reducedMotion','fontFamily','fontSize','tabSize','softTabs','pageScale'];
      const matched = knownKeys.filter(k => k in data.prefs);
      if (matched.length < 2) throw new Error('Not a Folio settings file');

      confirmModal(
        'Import settings?',
        `This will overwrite your current app preferences (${matched.length} settings detected). Continue?`,
        'Import',
        false,
        () => {
          const p = data.prefs;
          const mapping = {
            theme: STORAGE.theme,
            pageScale: STORAGE.pageScale,
            reducedMotion: STORAGE.reducedMotion,
            fontFamily: STORAGE.fontFamily,
            formatOnSave: STORAGE.formatOnSave,
            emmetEnabled: STORAGE.emmetEnabled,
            activeLine: STORAGE.activeLine,
            bracketMatching: STORAGE.bracketMatching,
            autosaveDelay: STORAGE.autosaveDelay,
            jsLint: STORAGE.jsLint,
            jsonLint: STORAGE.jsonLint,
            debug: STORAGE.debug,
            autoClean: STORAGE.autoClean,
            autoCleanDays: STORAGE.autoCleanDays,
          };
          Object.entries(mapping).forEach(([key, storageKey]) => {
            if (p[key] !== undefined) savePrefLocal(storageKey, p[key]);
          });
          const ep = {};
          if (p.fontSize !== undefined) ep.fontSize = p.fontSize;
          if (p.lineHeight !== undefined) ep.lineHeight = p.lineHeight;
          if (p.tabSize !== undefined) ep.tabSize = p.tabSize;
          if (p.softTabs !== undefined) ep.softTabs = p.softTabs;
          if (p.lineNumbers !== undefined) ep.lineNumbers = p.lineNumbers;
          if (p.wordWrap !== undefined) ep.wordWrap = p.wordWrap;
          try { localStorage.setItem(STORAGE.editorPrefs, JSON.stringify(ep)); } catch {}
          toast('Settings imported — reloading', 'success');
          setTimeout(() => location.reload(), 800);
        }
      );
    } catch (err) {
      toast('Couldn\'t read file: ' + (err.message || 'invalid'), 'error');
    }
  }

  // ═══════════════════════════════════════════════════════════
  // SYNC QUEUE (real IDB store from index.html)
  // ═══════════════════════════════════════════════════════════

  async function readSyncQueue() {
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open('folio', 2);
        req.onerror = () => resolve([]);
        req.onsuccess = () => {
          const conn = req.result;
          if (!conn.objectStoreNames.contains('syncQueue')) { resolve([]); return; }
          try {
            const tx = conn.transaction('syncQueue', 'readonly').objectStore('syncQueue');
            const all = tx.getAll();
            all.onsuccess = () => resolve(all.result || []);
            all.onerror = () => resolve([]);
          } catch { resolve([]); }
        };
      } catch { resolve([]); }
    });
  }

  async function updateSyncQueueInfo() {
    const info = $('syncQueueInfo');
    if (!info) return;
    const items = await readSyncQueue();
    if (items.length === 0) info.textContent = 'Sync queue is empty.';
    else info.textContent = `${items.length} pending item${items.length === 1 ? '' : 's'} waiting to sync.`;
  }

  async function drainSync() {
    if (!S.isAuthed) { toast('Sign in required', 'warning'); return; }
    const items = await readSyncQueue();
    if (items.length === 0) { toast('Sync queue is empty', 'info'); return; }
    showLoading('Draining queue', `Syncing ${items.length} item${items.length === 1 ? '' : 's'}…`);
    let ok = 0, failed = 0;
    for (const item of items) {
      try {
        if (item.action === 'file:put') {
          await apiFetch(API_HOST + '?action=project/sync-back', {
            method: 'POST',
            body: JSON.stringify({ pid: item.pid, files: { [item.path]: item.content } }),
          });
        }
        ok++;
      } catch { failed++; }
    }
    hideLoading();
    if (failed === 0) toast(`Drained ${ok} item${ok === 1 ? '' : 's'}`, 'success');
    else toast(`Synced ${ok}, failed ${failed}`, 'warning');
    updateSyncQueueInfo();
  }

  async function confirmClearSync() {
    const items = await readSyncQueue();
    if (items.length === 0) { toast('Sync queue is already empty', 'info'); return; }
    confirmModal(
      'Clear sync queue?',
      `${items.length} pending item${items.length === 1 ? '' : 's'} will be discarded. Cannot be undone.`,
      'Clear queue',
      true,
      async () => {
        try {
          const req = indexedDB.open('folio', 2);
          req.onsuccess = () => {
            const conn = req.result;
            const tx = conn.transaction('syncQueue', 'readwrite');
            tx.objectStore('syncQueue').clear();
            tx.oncomplete = () => {
              toast('Sync queue cleared', 'success');
              updateSyncQueueInfo();
            };
          };
        } catch { toast('Failed to clear', 'error'); }
      }
    );
  }

  // ═══════════════════════════════════════════════════════════
  // SECTION SEARCH (Cmd/Ctrl+K)
  // ═══════════════════════════════════════════════════════════

  function openSearchOverlay() {
    S.searchOverlayOpen = true;
    S.searchSelectedIndex = 0;
    $('searchOverlay').classList.add('active');
    $('sectionSearchInput').value = '';
    updateSearchResults('');
    setTimeout(() => $('sectionSearchInput').focus(), 100);
  }

  function closeSearchOverlay() {
    S.searchOverlayOpen = false;
    $('searchOverlay').classList.remove('active');
  }

  function updateSearchResults(query) {
    const q = query.trim().toLowerCase();
    const matches = q
      ? SECTIONS.filter(s => s.label.toLowerCase().includes(q))
      : SECTIONS.slice();

    S.searchMatches = matches;
    S.searchSelectedIndex = Math.min(S.searchSelectedIndex, Math.max(0, matches.length - 1));

    const results = $('sectionSearchResults');
    if (matches.length === 0) {
      results.innerHTML = `<div class="search-empty">No sections match "${escapeHTML(query)}"</div>`;
      return;
    }

    results.innerHTML = matches.map((s, i) => `
      <button class="search-result ${i === S.searchSelectedIndex ? 'selected' : ''}" data-jump-section="${escapeAttr(s.id)}" type="button">
        ${svg(s.icon, 14, 2.2)}
        <span>${escapeHTML(s.label)}</span>
      </button>
    `).join('');

    results.querySelectorAll('[data-jump-section]').forEach(r => {
      r.addEventListener('click', () => {
        closeSearchOverlay();
        setActiveSection(r.dataset.jumpSection);
      });
    });
  }

  // ═══════════════════════════════════════════════════════════
  // GLOBAL WIRING
  // ═══════════════════════════════════════════════════════════

  function wireGlobal() {
    $('modalOverlay').addEventListener('click', (e) => {
      if (e.target === $('modalOverlay')) closeModal();
    });
    document.addEventListener('click', (e) => {
      if (e.target.matches('[data-modal-close]')) closeModal();
    });

    $('searchOverlay').addEventListener('click', (e) => {
      if (e.target === $('searchOverlay')) closeSearchOverlay();
    });
    $('sectionSearchInput').addEventListener('input', (e) => {
      S.searchSelectedIndex = 0;
      updateSearchResults(e.target.value);
    });
    $('sectionSearchInput').addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        S.searchSelectedIndex = Math.min(S.searchSelectedIndex + 1, S.searchMatches.length - 1);
        updateSearchResults($('sectionSearchInput').value);
        $('sectionSearchResults').querySelector('.search-result.selected')?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        S.searchSelectedIndex = Math.max(0, S.searchSelectedIndex - 1);
        updateSearchResults($('sectionSearchInput').value);
        $('sectionSearchResults').querySelector('.search-result.selected')?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const match = S.searchMatches[S.searchSelectedIndex];
        if (match) { closeSearchOverlay(); setActiveSection(match.id); }
      } else if (e.key === 'Escape') {
        closeSearchOverlay();
      }
    });
    $('btnSectionSearch').addEventListener('click', openSearchOverlay);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if ($('modalOverlay').classList.contains('active')) return closeModal();
        if (S.searchOverlayOpen) return closeSearchOverlay();
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (S.searchOverlayOpen) closeSearchOverlay();
        else openSearchOverlay();
      }
      if (!e.metaKey && !e.ctrlKey && !e.altKey && /^[1-9]$/.test(e.key)) {
        const tag = (e.target.tagName || '').toLowerCase();
        const inField = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
        if (inField) return;
        const idx = parseInt(e.key, 10) - 1;
        if (SECTIONS[idx]) {
          e.preventDefault();
          setActiveSection(SECTIONS[idx].id);
        }
      }
    });
  }

  // ═══════════════════════════════════════════════════════════
  // START
  // ═══════════════════════════════════════════════════════════

  function init() {
    wireGlobal();
    boot();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
