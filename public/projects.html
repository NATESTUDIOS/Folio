  // ═══════════════════════════════════════════════════════════

  function getCountForTab(tabId) { return S.projects.filter(p => matchesTab(p, tabId)).length; }

  function renderTabs() {
    const tabsEl = $('tabsBar');
    tabsEl.innerHTML = TABS.map(t => `
      <button class="tab ${t.id === S.activeTab ? 'active' : ''}" data-tab="${escapeAttr(t.id)}" type="button">
        <span>${escapeHTML(t.label)}</span>
        <span class="tab-count">${getCountForTab(t.id)}</span>
      </button>
    `).join('');
    tabsEl.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
  }

  function updateHeaderCount() {
    const count = S.projects.length;
    $('pageCount').textContent = `${count} project${count === 1 ? '' : 's'}`;
    const badge = $('filterBadge');
    const badgeCount = S.activeFilters.size + (S.searchQuery ? 1 : 0) + (S.sortId !== 'modified' ? 1 : 0);
    if (badgeCount > 0) {
      badge.textContent = String(badgeCount);
      badge.classList.remove('hidden');
      $('filterBtn').classList.add('filter-active');
    } else {
      badge.classList.add('hidden');
      $('filterBtn').classList.remove('filter-active');
    }
    $('sortLabel').textContent = SORTS.find(s => s.id === S.sortId)?.label || 'Modified';
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER: ACTIVE FILTERS
  // ═══════════════════════════════════════════════════════════

  function renderActiveFilters() {
    const el = $('activeFilters');
    const chips = [];

    S.activeFilters.forEach(f => {
      chips.push(`
        <div class="filter-chip">
          <span>${escapeHTML(FILTER_LABELS[f] || f)}</span>
          <button data-remove-filter="${escapeAttr(f)}" type="button" aria-label="Remove">${svg('x', 9, 2.4)}</button>
        </div>
      `);
    });

    if (S.searchQuery) {
      chips.push(`
        <div class="filter-chip">
          <span>"${escapeHTML(S.searchQuery)}"</span>
          <button data-remove-search type="button" aria-label="Remove search">${svg('x', 9, 2.4)}</button>
        </div>
      `);
    }

    if (chips.length === 0) { el.classList.remove('visible'); el.innerHTML = ''; return; }

    el.innerHTML = chips.join('') + `<button class="clear-filters-btn" id="clearAllFilters" type="button">Clear all</button>`;
    el.classList.add('visible');

    el.querySelectorAll('[data-remove-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        S.activeFilters.delete(btn.dataset.removeFilter);
        renderActiveFilters();
        applyFiltersAndRender();
      });
    });
    el.querySelector('[data-remove-search]')?.addEventListener('click', () => {
      S.searchQuery = '';
      $('searchInput').value = '';
      $('searchClear').classList.remove('visible');
      renderActiveFilters();
      applyFiltersAndRender();
    });
    $('clearAllFilters')?.addEventListener('click', () => {
      S.activeFilters.clear();
      S.searchQuery = '';
      $('searchInput').value = '';
      $('searchClear').classList.remove('visible');
      renderActiveFilters();
      applyFiltersAndRender();
    });
  }

  // ═══════════════════════════════════════════════════════════
  // FILTERING
  // ═══════════════════════════════════════════════════════════

  function matchesTab(p, tabId) {
    if (tabId === 'all') return !p.archived;
    if (tabId === 'owned') return p.myRole === 'owner' && !p.archived;
    if (tabId === 'shared') return p.myRole && p.myRole !== 'owner' && !p.archived;
    if (tabId === 'public') return p.visibility?.profile === 'public' && !p.archived;
    if (tabId === 'archived') return p.archived === true;
    return true;
  }
  function matchesFilters(p) {
    if (S.activeFilters.size === 0) return true;
    for (const f of S.activeFilters) {
      if (f === 'deployed' && !p.deployment?.url) return false;
      if (f === 'notDeployed' && p.deployment?.url) return false;
      if (f === 'expired') {
        const hasExpired = S.expiredDeployments.some(d => d.pid === p.pid);
        if (!hasExpired) return false;
      }
      if (f === 'editor' && p.myRole !== 'editor') return false;
      if (f === 'viewer' && p.myRole !== 'viewer') return false;
      if (f === 'commenter' && p.myRole !== 'commenter') return false;
    }
    return true;
  }
  function matchesSearch(p) {
    if (!S.searchQuery) return true;
    const q = S.searchQuery.toLowerCase();
    const haystack = [p.name, p.slug, p.description, ...Object.keys(p.languages?.breakdown || {})]
      .filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
  }

  function applyFiltersAndRender() {
    let list = S.projects.filter(p => matchesTab(p, S.activeTab) && matchesFilters(p) && matchesSearch(p));
    const sorter = SORTS.find(s => s.id === S.sortId) || SORTS[0];
    list.sort(sorter.fn);
    S.filtered = list;
    renderProjects();
    updateHeaderCount();
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER: PROJECT CARDS
  // ═══════════════════════════════════════════════════════════

  function renderSkeletons() {
    const container = $('projectsContainer');
    container.innerHTML = Array.from({ length: 6 }, () => `
      <div class="skeleton-card">
        <div class="skeleton-card-row">
          <div class="skeleton skeleton-icon"></div>
          <div style="flex:1;">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-sub"></div>
          </div>
        </div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line short"></div>
      </div>
    `).join('');
  }

  function renderProjects() {
    const container = $('projectsContainer');
    if (S.filtered.length === 0) {
      container.innerHTML = renderEmptyState();
      bindEmptyStateActions();
      return;
    }
    container.innerHTML = S.filtered.map(p => renderProjectCard(p)).join('');
    bindProjectCardEvents();
  }

  function renderEmptyState() {
    if (S.projects.length === 0) {
      return `
        <div class="empty-state">
          <div class="empty-icon">${svg('folder', 22, 2)}</div>
          <div class="empty-title">No projects yet</div>
          <div class="empty-desc">Create your first project to get started.</div>
          <div class="empty-actions">
            <button class="btn btn-primary" data-empty-new>${svg('plus', 12, 2.4)} New project</button>
          </div>
        </div>
      `;
    }
    if (S.activeTab === 'shared') {
      return `<div class="empty-state"><div class="empty-icon">${svg('users', 22, 2)}</div>
        <div class="empty-title">No shared projects</div>
        <div class="empty-desc">When someone invites you, it will appear here.</div></div>`;
    }
    if (S.activeTab === 'owned') {
      return `<div class="empty-state"><div class="empty-icon">${svg('folder', 22, 2)}</div>
        <div class="empty-title">You don't own any projects</div>
        <div class="empty-actions">
          <button class="btn btn-primary" data-empty-new>${svg('plus', 12, 2.4)} New project</button>
        </div></div>`;
    }
    if (S.activeTab === 'public') {
      return `<div class="empty-state"><div class="empty-icon">${svg('eye', 22, 2)}</div>
        <div class="empty-title">No public projects</div>
        <div class="empty-desc">Make a project public to list it here.</div></div>`;
    }
    return `<div class="empty-state"><div class="empty-icon">${svg('search', 22, 2)}</div>
      <div class="empty-title">No projects match</div>
      <div class="empty-actions"><button class="btn btn-secondary" data-empty-clear-filters>Clear filters</button></div></div>`;
  }

  function bindEmptyStateActions() {
    document.querySelector('[data-empty-new]')?.addEventListener('click', openCreateFlow);
    document.querySelector('[data-empty-import]')?.addEventListener('click', openImportFlow);
    document.querySelector('[data-empty-clear-filters]')?.addEventListener('click', () => {
      S.activeFilters.clear(); S.searchQuery = '';
      $('searchInput').value = ''; $('searchClear').classList.remove('visible');
      renderActiveFilters(); applyFiltersAndRender();
    });
  }

  function renderProjectCard(p) {
    const iconHTML = p.iconUrl
      ? `<img src="${escapeAttr(p.iconUrl)}" alt="">`
      : `<span>${escapeHTML(getInitials(p.name))}</span>`;
    const iconBg = p.iconUrl ? '' : `background:${getAvatarColor(p.name)};color:#0a0c10;`;
    const roleBadge = p.myRole === 'owner'
      ? '<span class="role-badge owner">Owner</span>'
      : p.myRole === 'editor'
      ? '<span class="role-badge editor">Editor</span>'
      : p.myRole ? `<span class="role-badge">${escapeHTML(p.myRole)}</span>` : '';
    const liveBadge = p.deployment?.url
      ? '<span class="live-badge"><span class="dot"></span>Live</span>'
      : p.deployment?.state === 'OFFLINE'
      ? '<span class="live-badge offline"><span class="dot"></span>Offline</span>'
      : '<span class="live-badge offline">Local</span>';
    const langBadges = p.languages?.breakdown
      ? Object.entries(p.languages.breakdown).slice(0, 3)
          .map(([name, pct]) => `<span class="lang-badge">${escapeHTML(name)} ${pct}%</span>`).join('')
      : '';
    const viewCount = p.viewCount || 0;
    const fileCount = p.fileCount;
    const statsHTML = [
      viewCount > 0 ? `<span class="stat-item">${svg('eye', 9, 2.2)}${formatNumber(viewCount)}</span>` : '',
      fileCount != null ? `<span class="stat-item">${svg('file', 9, 2.2)}${fileCount}</span>` : '',
      p.updatedAt ? `<span class="stat-item">${timeAgo(p.updatedAt)}</span>` : '',
    ].filter(Boolean).join('');
    const hasExpired = S.expiredDeployments.some(d => d.pid === p.pid);

    return `
  <div class="project-card" data-pid="${escapeAttr(p.pid)}">
    <div class="project-card-header">
      <div class="project-icon" style="${iconBg}">${iconHTML}</div>
      <div class="project-header-info">
        <div class="project-name">${escapeHTML(p.name || 'Untitled project')}</div>
        <div class="project-meta">
          ${roleBadge}${liveBadge}
          ${hasExpired ? `<span style="color:var(--theme-warning);display:inline-flex;align-items:center;gap:2px;">${svg('alertTriangle', 9, 2.4)}</span>` : ''}
        </div>
      </div>
      <div class="project-card-actions">
        <button class="project-edit-btn" data-edit="${escapeAttr(p.pid)}" aria-label="Open in editor" title="Open in editor">${svg('edit3', 12, 2.2)}</button>
        <button class="project-more-btn" data-more="${escapeAttr(p.pid)}" aria-label="More actions" title="More">${svg('more', 13, 2.4)}</button>
      </div>
    </div>
    ${p.description ? `<div class="project-desc">${escapeHTML(p.description)}</div>` : ''}
    ${langBadges ? `<div class="lang-badges">${langBadges}</div>` : ''}
    ${statsHTML ? `<div class="project-stats">${statsHTML}</div>` : ''}
  </div>
`;
  }

  function bindProjectCardEvents() {
  document.querySelectorAll('.project-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('[data-more]') || e.target.closest('[data-edit]')) return;
      goDashboard(card.dataset.pid);
    });
  });
  document.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      goEditor(btn.dataset.edit);
    });
  });
  document.querySelectorAll('[data-more]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = S.projects.find(proj => proj.pid === btn.dataset.more);
      if (p) openActionMenu(p);
    });
  });
}

  // ═══════════════════════════════════════════════════════════
  // ACTION MENU
  // ═══════════════════════════════════════════════════════════

  function openActionMenu(p) {
    S.activeMenuProject = p;
    const isOwner = p.myRole === 'owner';
    const hasExpired = S.expiredDeployments.some(d => d.pid === p.pid);
    const expiredCount = S.expiredDeployments.filter(d => d.pid === p.pid).length;
    const shareUrl = p.visibility?.profile === 'public'
      ? `${location.origin}/${S.user?.username || ''}/${p.slug || ''}` : null;
    const iconHTML = p.iconUrl
      ? `<img src="${escapeAttr(p.iconUrl)}" alt="">`
      : `<span>${escapeHTML(getInitials(p.name))}</span>`;
    const iconBg = p.iconUrl ? '' : `background:${getAvatarColor(p.name)};color:#0a0c10;`;

    const sheet = $('actionSheet');
    sheet.innerHTML = `
      <div class="action-sheet-header">
        <div class="action-sheet-icon" style="${iconBg}">${iconHTML}</div>
        <div class="action-sheet-title">
          <div class="action-sheet-name">${escapeHTML(p.name || 'Untitled project')}</div>
          <div class="action-sheet-meta">${escapeHTML(p.myRole || 'local')} · ${p.deployment?.url ? 'Live' : 'Local'}</div>
        </div>
      </div>
      <div class="action-list">
        <button class="action-item" data-action="editor">${svg('edit3', 14, 2.2)}<span>Open in editor</span></button>
        
        ${shareUrl ? `<button class="action-item" data-action="share">${svg('share', 14, 2.2)}<span>Copy share link</span></button>` : ''}
        <div class="action-divider"></div>
        <button class="action-item" data-action="download">${svg('download', 14, 2.2)}<span>Download .folio</span></button>
        <button class="action-item" data-action="duplicate">${svg('copy', 14, 2.2)}<span>Duplicate</span></button>
        ${isOwner ? `<button class="action-item" data-action="rename">${svg('edit', 14, 2.2)}<span>Rename</span></button>` : ''}
        ${hasExpired ? `<button class="action-item" data-action="cleanExpired">${svg('alertTriangle', 14, 2.2)}<span>Clean ${expiredCount} expired deploy${expiredCount === 1 ? '' : 's'}</span></button>` : ''}
        <div class="action-divider"></div>
        <button class="action-item danger" data-action="delete">${svg('trash', 14, 2.2)}<span>Delete project</span></button>
      </div>
    `;

    sheet.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => handleAction(btn.dataset.action, p));
    });
    $('actionMenu').classList.add('active');
  }

  function closeActionMenu() {
    $('actionMenu').classList.remove('active');
    S.activeMenuProject = null;
  }

  function handleAction(action, p) {
    closeActionMenu();
    switch (action) {
      case 'editor': goEditor(p.pid); break;
      case 'dashboard': goDashboard(p.pid); break;
      case 'share': {
        const shareUrl = `${location.origin}/${S.user?.username || ''}/${p.slug || ''}`;
        navigator.clipboard.writeText(shareUrl).then(() => toast('Link copied', 'success', 1200)).catch(() => toast('Copy failed', 'error'));
        break;
      }
      case 'download': downloadProject(p); break;
      case 'duplicate': duplicateProject(p); break;
      case 'rename': openRenameModal(p); break;
      case 'cleanExpired': cleanExpiredForProject(p); break;
      case 'delete': confirmDeleteProject(p); break;
    }
  }

  // ═══════════════════════════════════════════════════════════
  // ACTIONS
  // ═══════════════════════════════════════════════════════════

  async function downloadProject(p) {
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    try {
      showLoading('Preparing download', 'Building .folio backup…');
      const res = await fetch(`${API_HOST}?action=project/export&pid=${encodeURIComponent(p.pid)}&format=folio`, {
        headers: { Authorization: `Bearer ${S.session}` },
      });
      hideLoading();
      if (!res.ok) throw new Error('Download failed');
      const blob = await res.blob();
      triggerDownload(blob, `${p.slug || 'project'}-${p.pid.slice(-6)}.folio`);
      toast('Downloaded', 'success');
    } catch (err) { hideLoading(); toast(err.message || 'Download failed', 'error'); }
  }

  async function duplicateProject(p) {
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    confirmModal('Duplicate project?', 'A new project will be created with a copy of the files.', 'Duplicate', false, async () => {
      showLoading('Duplicating', 'Copying files…');
      try {
        const res = await apiFetch(API_HOST + '?action=project/copy', {
          method: 'POST', body: JSON.stringify({ pid: p.pid, newName: `${p.name} (copy)` }),
        });
        hideLoading();
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        toast('Duplicated', 'success');
        await loadProjects();
      } catch (err) { hideLoading(); toast(err.message || 'Duplicate failed', 'error'); }
    });
  }

  function openRenameModal(p) {
    openModal(`
      <div class="modal-title">Rename project</div>
      <div class="field">
        <label class="field-label">Project name</label>
        <input class="input" id="renameInput" value="${escapeAttr(p.name || '')}" maxlength="100" autofocus>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-modal-close>Cancel</button>
        <button class="btn btn-primary" id="renameSubmit">Save</button>
      </div>
    `);
    $('renameInput').focus(); $('renameInput').select();
    $('renameSubmit').addEventListener('click', async () => {
      const name = $('renameInput').value.trim();
      if (!name) { toast('Name required', 'error'); return; }
      if (name === p.name) { closeModal(); return; }
      $('renameSubmit').disabled = true;
      try {
        if (S.session && S.online && p._serverData) {
          const res = await apiFetch(API_HOST + '?action=projects/update', {
            method: 'POST', body: JSON.stringify({ pid: p.pid, name }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        p.name = name;
        p.updatedAt = Date.now();
        await IDB.putProject({
          pid: p.pid, name, slug: p.slug || '', description: p.description || '',
          createdAt: p.createdAt, updatedAt: Date.now(), iconUrl: p.iconUrl || null,
        });
        closeModal();
        toast('Renamed', 'success');
        renderProjects();
      } catch (err) {
        toast(err.message || 'Rename failed', 'error');
        $('renameSubmit').disabled = false;
      }
    });
    $('renameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('renameSubmit').click(); });
  }

  function confirmDeleteProject(p) {
    openModal(`
      <div class="modal-title">Delete project?</div>
      <div class="modal-desc">This deletes all files, versions, and data. Cannot be undone.</div>
      <div class="field">
        <label class="field-label">Type "${escapeHTML(p.name || 'Untitled project')}" to confirm</label>
        <input class="input" id="deleteConfirmInput" placeholder="Project name">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-modal-close>Cancel</button>
        <button class="btn btn-danger" id="deleteConfirmBtn" disabled>Delete</button>
      </div>
    `);
    $('deleteConfirmInput').addEventListener('input', (e) => {
      $('deleteConfirmBtn').disabled = e.target.value !== p.name;
    });
    $('deleteConfirmBtn').addEventListener('click', async () => {
      showLoading('Deleting', 'Removing project and all data…');
      try {
        if (S.session && S.online && p._serverData) {
          const res = await apiFetch(API_HOST + '?action=projects/delete', {
            method: 'POST', body: JSON.stringify({ pid: p.pid }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        await IDB.deleteProject(p.pid);
        hideLoading();
        closeModal();
        toast('Project deleted', 'success');
        S.projects = S.projects.filter(proj => proj.pid !== p.pid);
        applyFiltersAndRender();
      } catch (err) { hideLoading(); toast(err.message || 'Delete failed', 'error'); }
    });
  }

  async function cleanExpiredForProject(p) {
    const expired = S.expiredDeployments.filter(d => d.pid === p.pid);
    if (expired.length === 0) { toast('No expired deployments', 'info'); return; }
    confirmModal(
      `Delete ${expired.length} expired deployment${expired.length === 1 ? '' : 's'}?`,
      'Live URLs will stop working. Cannot be undone.', 'Delete', true,
      async () => {
        showLoading('Cleaning', `Deleting ${expired.length}…`);
        try {
          for (const d of expired) {
            await apiFetch(API_HOST + '?action=deployment/delete', {
              method: 'POST', body: JSON.stringify({ pid: d.pid, deploymentId: d.deploymentId }),
            });
          }
          S.expiredDeployments = S.expiredDeployments.filter(d => d.pid !== p.pid);
          hideLoading();
          toast(`Cleaned ${expired.length}`, 'success');
          applyFiltersAndRender();
        } catch (err) { hideLoading(); toast(err.message || 'Failed', 'error'); }
      }
    );
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ═══════════════════════════════════════════════════════════
  // CREATE FLOW
  // ═══════════════════════════════════════════════════════════

  function openCreateFlow() {
    S.createStep = 1; S.createName = ''; S.createDescription = '';
    S.createIconMode = 'name'; S.createIconUrl = null; S.createIconDataUrl = null;
    S.createIconVariants = []; S.createImageUrlInput = '';
    renderCreateStep();
  }

  function renderCreateStep() {
    const content = $('modalBody');
    $('modalOverlay').classList.add('active');
    const steps = ['Basics', 'Icon', 'Review'];
    const stepperHTML = steps.map((_, i) => `<div class="step ${i < S.createStep ? 'active' : ''}"></div>`).join('');

    if (S.createStep === 1) {
      content.innerHTML = `
        <div class="modal-handle"></div>
        <div class="stepper">${stepperHTML}</div>
        <div class="step-label">Step 1 of 3 · Basics</div>
        <div class="modal-title">New project</div>
        <div class="modal-desc">Give it a name and short description.</div>
        <div class="field">
          <label class="field-label">Name *</label>
          <input class="input" id="createName" value="${escapeAttr(S.createName)}" placeholder="My project" maxlength="100" autofocus>
        </div>
        <div class="field">
          <label class="field-label">Description (optional)</label>
          <textarea class="textarea" id="createDesc" placeholder="What's this project about?" maxlength="500">${escapeHTML(S.createDescription)}</textarea>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" data-modal-close>Cancel</button>
          <button class="btn btn-primary" id="createNext">Next</button>
        </div>
      `;
      $('createName').focus();
      $('createNext').addEventListener('click', () => {
        const name = $('createName').value.trim();
        if (!name) { toast('Project name required', 'error'); return; }
        S.createName = name;
        S.createDescription = $('createDesc').value.trim();
        S.createStep = 2; renderCreateStep();
      });
    } else if (S.createStep === 2) {
      content.innerHTML = `
        <div class="modal-handle"></div>
        <div class="stepper">${stepperHTML}</div>
        <div class="step-label">Step 2 of 3 · Icon (optional)</div>
        <div class="modal-title">Choose an icon</div>
        <div class="modal-desc">Generated by Flier from your project name.</div>
        <div class="icon-tabs">
          <button class="icon-tab ${S.createIconMode === 'name' ? 'active' : ''}" data-icon-mode="name">From name</button>
          <button class="icon-tab ${S.createIconMode === 'url' ? 'active' : ''}" data-icon-mode="url">From URL</button>
          <button class="icon-tab ${S.createIconMode === 'upload' ? 'active' : ''}" data-icon-mode="upload">Upload</button>
        </div>
        <div class="icon-mode-panel ${S.createIconMode === 'name' ? 'active' : ''}" data-panel="name">
          <div class="icon-grid" id="iconGrid"><div class="icon-placeholder" style="grid-column:1/-1;">Tap "Generate" below</div></div>
          <button class="icon-generate-btn" id="iconGenName">${svg('refresh', 11, 2.2)} Generate from "${escapeHTML(S.createName)}"</button>
        </div>
        <div class="icon-mode-panel ${S.createIconMode === 'url' ? 'active' : ''}" data-panel="url">
          <div class="field">
            <label class="field-label">Image URL</label>
            <input class="input" id="iconUrlInput" placeholder="https://example.com/image.jpg" value="${escapeAttr(S.createImageUrlInput)}">
            <div class="field-hint">HTTPS only.</div>
          </div>
          <div class="icon-grid" id="iconGridUrl"><div class="icon-placeholder" style="grid-column:1/-1;">Paste URL and tap Generate</div></div>
          <button class="icon-generate-btn" id="iconGenUrl">${svg('image', 11, 2.2)} Generate from URL</button>
        </div>
        <div class="icon-mode-panel ${S.createIconMode === 'upload' ? 'active' : ''}" data-panel="upload">
          <input type="file" id="iconUploadFile" accept="image/*" style="display:none;">
          <div class="icon-upload-btn" id="iconUploadBtn">${svg('upload', 20, 2)}<span>Upload image</span><span class="sub">JPG, PNG, WebP · max 5 MB</span></div>
          <div class="icon-grid" id="iconGridUpload" style="margin-top:10px;"></div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="createBack">Back</button>
          <button class="btn btn-primary" id="createNext">Next</button>
        </div>
      `;

      content.querySelectorAll('[data-icon-mode]').forEach(btn => {
        btn.addEventListener('click', () => { S.createIconMode = btn.dataset.iconMode; renderCreateStep(); });
      });
      $('iconGenName').addEventListener('click', generateIconFromName);
      $('iconGenUrl').addEventListener('click', generateIconFromUrl);
      $('iconUploadBtn').addEventListener('click', () => $('iconUploadFile').click());
      $('iconUploadFile').addEventListener('change', handleIconUpload);

      if (S.createIconVariants.length > 0) {
        const gridId = S.createIconMode === 'name' ? 'iconGrid' : S.createIconMode === 'url' ? 'iconGridUrl' : 'iconGridUpload';
        renderIconVariants(gridId);
      }
      $('createBack').addEventListener('click', () => { S.createStep = 1; renderCreateStep(); });
      $('createNext').addEventListener('click', async () => {
        if (S.createIconDataUrl) await uploadSelectedIcon();
        S.createStep = 3; renderCreateStep();
      });
    } else if (S.createStep === 3) {
      const iconPreview = S.createIconUrl
        ? `<img src="${escapeAttr(S.createIconUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;">`
        : `<span style="color:var(--theme-primary);font-weight:800;">${escapeHTML(getInitials(S.createName))}</span>`;
      const iconBg = S.createIconUrl ? '' : `background:${getAvatarColor(S.createName)};`;

      content.innerHTML = `
        <div class="modal-handle"></div>
        <div class="stepper">${stepperHTML}</div>
        <div class="step-label">Step 3 of 3 · Review</div>
        <div class="modal-title">Create project</div>
        <div class="modal-desc">Review and confirm.</div>
        <div style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--theme-glass-bg);border-radius:8px;margin-bottom:12px;">
          <div style="width:40px;height:40px;border-radius:9px;overflow:hidden;background:var(--theme-surface-elevated);display:flex;align-items:center;justify-content:center;flex-shrink:0;${iconBg}">${iconPreview}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:12px;font-weight:700;color:var(--theme-text);">${escapeHTML(S.createName)}</div>
            <div style="font-size:10.5px;color:var(--theme-text-tertiary);">${S.createDescription ? escapeHTML(S.createDescription) : 'No description'}</div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="createBack">Back</button>
          <button class="btn btn-primary" id="createSubmit">${svg('check', 12, 2.4)} Create project</button>
        </div>
      `;
      $('createBack').addEventListener('click', () => { S.createStep = 2; renderCreateStep(); });
      $('createSubmit').addEventListener('click', submitCreateProject);
    }
  }

  async function generateIconFromName() {
    const grid = $('iconGrid'); if (!grid) return;
    grid.innerHTML = Array.from({ length: 5 }, () => '<div class="icon-skeleton"></div>').join('');
    $('iconGenName').disabled = true;
    try {
      const res = await fetch(API_FLIER + '?action=avatar/preview', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: S.createName.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 30) || 'project',
          displayName: S.createName,
        }),
      });
      const data = await res.json();
      if (!data.success || !Array.isArray(data.variants)) throw new Error(data.error || 'Failed');
      S.createIconVariants = data.variants;
      renderIconVariants('iconGrid');
    } catch {
      grid.innerHTML = '<div class="icon-placeholder" style="grid-column:1/-1;aspect-ratio:auto;padding:14px;">Could not generate</div>';
      toast('Icon generation failed', 'error');
    } finally { $('iconGenName').disabled = false; }
  }

  async function generateIconFromUrl() {
    const url = $('iconUrlInput').value.trim();
    if (!url) { toast('Paste an image URL', 'error'); return; }
    if (!url.startsWith('https://')) { toast('URL must start with https://', 'error'); return; }
    S.createImageUrlInput = url;
    const grid = $('iconGridUrl');
    grid.innerHTML = Array.from({ length: 5 }, () => '<div class="icon-skeleton"></div>').join('');
    $('iconGenUrl').disabled = true;
    try {
      const res = await fetch(API_FLIER + '?action=avatar/preview', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: S.createName.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 30) || 'project',
          displayName: S.createName, imageUrl: url,
        }),
      });
      const data = await res.json();
      if (!data.success || !Array.isArray(data.variants)) throw new Error('Failed');
      S.createIconVariants = data.variants;
      renderIconVariants('iconGridUrl');
    } catch {
      grid.innerHTML = '<div class="icon-placeholder" style="grid-column:1/-1;aspect-ratio:auto;padding:14px;">Could not fetch image</div>';
      toast('Could not fetch image', 'error');
    } finally { $('iconGenUrl').disabled = false; }
  }

  async function handleIconUpload(e) {
    const file = e.target.files?.[0]; if (!file) return;
    if (!file.type.startsWith('image/')) { toast('Not an image', 'error'); return; }
    if (file.size > 5 * 1024 * 1024) { toast('Image too large', 'error'); return; }
    const dataUrl = await fileToDataUrl(file);
    S.createIconDataUrl = dataUrl;
    const grid = $('iconGridUpload');
    grid.innerHTML = `<button class="icon-option selected" data-selected="1" type="button"><img src="${escapeAttr(dataUrl)}" alt=""></button>`;
  }

  function renderIconVariants(gridId) {
    const grid = document.getElementById(gridId); if (!grid) return;
    grid.innerHTML = S.createIconVariants.map((v, idx) => `
      <button class="icon-option ${S.createIconDataUrl === v.dataUrl ? 'selected' : ''}" data-icon-idx="${idx}" type="button">
        <img src="${escapeAttr(v.dataUrl)}" alt="">
      </button>
    `).join('');
    grid.querySelectorAll('[data-icon-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        const v = S.createIconVariants[parseInt(btn.dataset.iconIdx, 10)]; if (!v) return;
        S.createIconDataUrl = v.dataUrl;
        grid.querySelectorAll('.icon-option').forEach(o => o.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
  }

  async function uploadSelectedIcon() {
    if (!S.createIconDataUrl) return;
    try {
      const res = await fetch(API_FLIER + '?action=avatar/upload', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          dataUrl: S.createIconDataUrl,
          username: S.createName.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 30) || 'project',
        }),
      });
      const data = await res.json();
      if (data.success && data.url) S.createIconUrl = data.url;
    } catch {}
  }

  async function submitCreateProject() {
    showLoading('Creating project', 'Setting up…');
    try {
      const name = S.createName;
      const description = S.createDescription || '';
      const iconUrl = S.createIconUrl || null;
      let pid;

      if (S.session && S.online) {
        const body = { name, description };
        if (iconUrl) body.iconUrl = iconUrl;
        const res = await apiFetch(API_HOST + '?action=projects/create', {
          method: 'POST', body: JSON.stringify(body),
        });
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Create failed');
        pid = res.data.pid;
      } else {
        pid = `local_${Date.now()}`;
      }

      const slug = name.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '') || 'project';
      await IDB.putProject({ pid, name, slug, description, iconUrl, createdAt: Date.now(), updatedAt: Date.now() });
      await IDB.putFile(pid, 'index.html',
        `<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>${name}</title>\n</head>\n<body>\n  <h1>${name}</h1>\n  <p>Edit this file to get started.</p>\n</body>\n</html>`);
      await IDB.putFile(pid, 'style.css', 'body { font-family: system-ui, sans-serif; margin: 2rem; }\n');
      await IDB.putFile(pid, 'app.js', `console.log('Hello from ${name}');\n`);

      hideLoading();
      closeModal();
      showCelebration(pid, name);
    } catch (err) { hideLoading(); toast(err.message || 'Create failed', 'error'); }
  }

  function showCelebration(pid, name) {
    $('celeTitle').textContent = 'Project created';
    $('celeDesc').textContent = `"${name}" is ready to edit.`;
    $('celebration').classList.add('active');
    $('celeOpenEditor').onclick = () => {
      $('celebration').classList.remove('active');
      goEditor(pid);
    };
    $('celeStay').onclick = () => {
      $('celebration').classList.remove('active');
      loadProjects();
    };
    setTimeout(() => {
      if ($('celebration').classList.contains('active')) {
        $('celebration').classList.remove('active');
        goEditor(pid);
      }
    }, 4000);
  }

  function openImportFlow() {
    openModal(`
      <div class="modal-title">Import project</div>
      <div class="modal-desc">Load a .folio backup file to create a new project.</div>
      <input type="file" id="importFile" accept=".folio,.zip" style="display:none;">
      <div class="icon-upload-btn" id="importUploadBtn" style="margin-bottom:12px;">
        ${svg('upload', 20, 2)}<span>Choose .folio file</span><span class="sub">Or .zip archive</span>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-modal-close>Cancel</button>
      </div>
    `);
    $('importUploadBtn').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', handleImportFile);
  }

  async function handleImportFile(e) {
    const file = e.target.files?.[0]; if (!file) return;
    closeModal();
    showLoading('Importing', 'Reading file…');
    try {
      const text = await file.text();
      let data = null;
      try { data = JSON.parse(text); } catch { hideLoading(); toast('Only JSON .folio files supported', 'info'); return; }
      if (!data.name) throw new Error('Invalid file');

      const pid = S.session && S.online ? null : `local_${Date.now()}`;
      let newPid = pid;
      if (!newPid) {
        const createRes = await apiFetch(API_HOST + '?action=projects/create', {
          method: 'POST', body: JSON.stringify({ name: data.name || 'Imported project', description: data.description || '' }),
        });
        if (!createRes.ok || !createRes.data?.success) throw new Error(createRes.data?.error || 'Create failed');
        newPid = createRes.data.pid;
      }
      await IDB.putProject({
        pid: newPid, name: data.name || 'Imported project',
        slug: (data.name || '').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '') || 'project',
        description: data.description || '', createdAt: Date.now(), updatedAt: Date.now(),
      });
      hideLoading();
      toast('Project imported', 'success');
      await loadProjects();
    } catch (err) { hideLoading(); toast(err.message || 'Import failed', 'error'); }
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  // ═══════════════════════════════════════════════════════════
  // FILTERS OVERLAY
  // ═══════════════════════════════════════════════════════════

  function openFiltersOverlay() {
    renderFiltersBody();
    $('filtersOverlay').classList.add('active');
  }
  function closeFiltersOverlay() { $('filtersOverlay').classList.remove('active'); }

  function renderFiltersBody() {
    const body = $('filtersBody');
    const subtitle = $('filtersSubtitle');
    const tab = TABS.find(t => t.id === S.activeTab);
    if (subtitle) subtitle.textContent = `${tab?.label || 'All'} · ${S.filtered.length} visible`;

    const stats = computeStats();
    const expiredCount = S.expiredDeployments.length;
    const filterPills = FILTERS_BY_TAB[S.activeTab] || [];
    const pillsHTML = filterPills.length > 0 ? `
      <div class="filter-section">
        <div class="filter-label">Filters</div>
        <div class="filter-pills">
          ${filterPills.map(f => `<button class="filter-pill ${S.activeFilters.has(f) ? 'active' : ''}" data-filter="${escapeAttr(f)}" type="button">${escapeHTML(FILTER_LABELS[f])}</button>`).join('')}
        </div>
      </div>
    ` : '';

    const storagePct = S.storageLimit > 0 ? Math.min(100, (stats.totalStorage / S.storageLimit) * 100) : 0;
    const storageClass = storagePct > 90 ? 'danger' : storagePct > 70 ? 'warn' : '';

    body.innerHTML = `
      ${pillsHTML}
      <div class="filter-section">
        <div class="filter-label">Overview</div>
        <div class="stats-grid">
          <div class="stat-tile"><div class="stat-label">Total</div><div class="stat-value">${S.projects.length}</div></div>
          <div class="stat-tile"><div class="stat-label">Public</div><div class="stat-value">${stats.publicCount}</div></div>
          <div class="stat-tile"><div class="stat-label">Deployed</div><div class="stat-value">${stats.deployedCount}</div></div>
          <div class="stat-tile"><div class="stat-label">Expired deploys</div><div class="stat-value ${expiredCount > 0 ? 'warn' : ''}">${expiredCount}</div></div>
        </div>
      </div>
      <div class="storage-block">
        <div class="storage-header">
          <div class="storage-title">Storage</div>
          <div class="storage-amount">${formatBytes(stats.totalStorage)} / ${formatBytes(S.storageLimit)}</div>
        </div>
        <div class="storage-bar"><div class="storage-bar-fill ${storageClass}" style="width:${storagePct}%"></div></div>
        <div class="storage-note">${storagePct > 90 ? '⚠ Storage nearly full.' : storagePct > 70 ? 'Storage is getting full.' : 'Plenty of space remaining.'}</div>
      </div>
      ${expiredCount > 0 ? `
        <div class="cleanup-block">
          <div class="cleanup-header">${svg('alertTriangle', 13, 2.2)}<div class="cleanup-title">${expiredCount} expired deploy${expiredCount === 1 ? '' : 's'}</div></div>
          <div class="cleanup-desc">Older than 30 days. Safe to delete.</div>
          <button class="btn btn-secondary btn-sm" id="btnCleanAll" type="button" style="width:100%;">${svg('trash', 10, 2.2)} Clean up all expired</button>
        </div>
      ` : ''}
      <div class="toggle-row">
        <div class="toggle-info">
          <div class="toggle-title">Auto-clean expired deployments</div>
          <div class="toggle-desc">Silently remove deployments older than 30 days.</div>
        </div>
        <button class="switch ${S.autoCleanEnabled ? 'on' : ''}" id="autoCleanSwitch" type="button" aria-label="Toggle auto-clean"></button>
      </div>
      <div class="filter-section">
        <div class="filter-label">Sort by</div>
        <div class="filter-pills">
          ${SORTS.map(s => `<button class="filter-pill ${S.sortId === s.id ? 'active' : ''}" data-sort="${escapeAttr(s.id)}" type="button">${escapeHTML(s.label)}</button>`).join('')}
        </div>
      </div>
    `;

    body.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        const f = btn.dataset.filter;
        if (S.activeFilters.has(f)) S.activeFilters.delete(f);
        else S.activeFilters.add(f);
        renderFiltersBody();
        renderActiveFilters();
        applyFiltersAndRender();
      });
    });
    body.querySelectorAll('[data-sort]').forEach(btn => {
      btn.addEventListener('click', () => {
        S.sortId = btn.dataset.sort;
        renderFiltersBody();
        applyFiltersAndRender();
      });
    });
    $('autoCleanSwitch')?.addEventListener('click', () => {
      S.autoCleanEnabled = !S.autoCleanEnabled;
      try { localStorage.setItem(STORAGE.autoClean, String(S.autoCleanEnabled)); } catch {}
      $('autoCleanSwitch').classList.toggle('on', S.autoCleanEnabled);
      toast(S.autoCleanEnabled ? 'Auto-clean on' : 'Auto-clean off', 'info', 1200);
    });
    $('btnCleanAll')?.addEventListener('click', cleanAllExpired);
  }

  function computeStats() {
    let publicCount = 0, deployedCount = 0, totalStorage = 0;
    for (const p of S.projects) {
      if (p.visibility?.profile === 'public') publicCount++;
      if (p.deployment?.url) deployedCount++;
      totalStorage += p.storageUsed || 0;
    }
    return { publicCount, deployedCount, totalStorage };
  }

  function cleanAllExpired() {
    const count = S.expiredDeployments.length;
    if (count === 0) return;
    confirmModal(`Delete ${count} expired deployment${count === 1 ? '' : 's'}?`, 'Live URLs will stop working. Cannot be undone.', 'Delete all', true, async () => {
      showLoading('Cleaning', `Deleting ${count}…`);
      try {
        for (const d of [...S.expiredDeployments]) {
          await apiFetch(API_HOST + '?action=deployment/delete', {
            method: 'POST', body: JSON.stringify({ pid: d.pid, deploymentId: d.deploymentId }),
          });
        }
        S.expiredDeployments = [];
        hideLoading();
        closeFiltersOverlay();
        toast(`Cleaned ${count}`, 'success');
        applyFiltersAndRender();
      } catch (err) { hideLoading(); toast(err.message || 'Failed', 'error'); }
    });
  }

  // ═══════════════════════════════════════════════════════════
  // SEARCH
  // ═══════════════════════════════════════════════════════════

  function wireSearch() {
    const input = $('searchInput');
    const clear = $('searchClear');
    const doSearch = debounce(() => {
      S.searchQuery = input.value.trim();
      renderActiveFilters();
      applyFiltersAndRender();
    }, 300);
    input.addEventListener('input', () => {
      clear.classList.toggle('visible', input.value.length > 0);
      doSearch();
    });
    clear.addEventListener('click', () => {
      input.value = ''; clear.classList.remove('visible');
      S.searchQuery = '';
      renderActiveFilters();
      applyFiltersAndRender();
    });
  }

  // ═══════════════════════════════════════════════════════════
  // WIRING
  // ═══════════════════════════════════════════════════════════

  function wireGlobalEvents() {
    $('modalOverlay').addEventListener('click', (e) => {
      if (e.target === $('modalOverlay')) closeModal();
    });
    document.addEventListener('click', (e) => {
      if (e.target.matches('[data-modal-close]')) closeModal();
    });
    $('actionMenu').addEventListener('click', (e) => {
      if (e.target === $('actionMenu')) closeActionMenu();
    });
    $('filterBtn').addEventListener('click', openFiltersOverlay);
    $('filtersClose').addEventListener('click', closeFiltersOverlay);
    $('filtersApply').addEventListener('click', closeFiltersOverlay);
    $('filtersClearAll').addEventListener('click', () => {
      S.activeFilters.clear(); S.searchQuery = '';
      $('searchInput').value = ''; $('searchClear').classList.remove('visible');
      renderActiveFilters(); applyFiltersAndRender(); renderFiltersBody();
    });
    $('filtersOverlay').addEventListener('click', (e) => {
      if (e.target === $('filtersOverlay')) closeFiltersOverlay();
    });
    $('newBtn').addEventListener('click', openCreateFlow);
    // Search trigger → sheet (below 900px)
$('searchTrigger')?.addEventListener('click', () => {
  $('searchSheetInput').value = S.searchQuery;
  $('searchOverlay').classList.add('active');
  setTimeout(() => $('searchSheetInput').focus(), 250);
});
$('searchSheetClose')?.addEventListener('click', () => {
  $('searchOverlay').classList.remove('active');
});
$('searchOverlay')?.addEventListener('click', (e) => {
  if (e.target === $('searchOverlay')) $('searchOverlay').classList.remove('active');
});
$('searchSheetInput')?.addEventListener('input', debounce((e) => {
  S.searchQuery = e.target.value.trim();
  const inline = $('searchInput');
  if (inline) inline.value = S.searchQuery;
  const clearBtn = $('searchClear');
  if (clearBtn) clearBtn.classList.toggle('visible', S.searchQuery.length > 0);
  renderActiveFilters();
  applyFiltersAndRender();
}, 300));
    $('searchSheetInput')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    $('searchOverlay').classList.remove('active');
  }
});
    $('sortBtn').addEventListener('click', openFiltersOverlay);
    wireSearch();
    document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('celebration').classList.contains('active')) return;
    if ($('searchOverlay')?.classList.contains('active')) return $('searchOverlay').classList.remove('active');
    if ($('actionMenu').classList.contains('active')) return closeActionMenu();
    if ($('modalOverlay').classList.contains('active')) return closeModal();
    if ($('filtersOverlay').classList.contains('active')) return closeFiltersOverlay();
  }
});
    const updateOnline = () => {
      S.online = navigator.onLine;
      $('offlineBanner').classList.toggle('visible', !S.online);
    };
    window.addEventListener('online', () => { updateOnline(); loadProjects(); });
    window.addEventListener('offline', updateOnline);
    updateOnline();
    window.addEventListener('hashchange', () => {
      const t = getHashTab();
      if (t && t !== S.activeTab) {
        S.activeTab = t; S.activeFilters.clear();
        renderTabs(); renderActiveFilters(); applyFiltersAndRender();
      }
    });
  }

  // ═══════════════════════════════════════════════════════════
  // BOOT
  // ═══════════════════════════════════════════════════════════

  async function boot() {
    wireThemeSync();
wireThemeMediaQuery();
    readSession();
    try { await openDB(); } catch (err) {
      console.error('[Projects] DB failed:', err);
      toast('Storage failed', 'error');
      return;
    }

    const hashTab = getHashTab();
    if (hashTab) S.activeTab = hashTab;
    else {
      try {
        const last = localStorage.getItem(STORAGE.lastTab);
        if (TABS.some(t => t.id === last)) S.activeTab = last;
      } catch {}
    }

    wireGlobalEvents();
    renderTabs();
    await loadProjects();
  }

  document.addEventListener('DOMContentLoaded', boot);

  // Expose for inline modal handlers
  window.closeModal = closeModal;
})();
</script>

</body>
</html>
