<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Folio — Projects</title>
<meta name="theme-color" content="#0a0c10" id="themeColorMeta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
(function () {
  try {
    var pref = localStorage.getItem("folio.theme") || "dark";
    var resolved = pref;
    if (pref === "auto" || pref === "system") {
      resolved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
        ? "light" : "dark";
    }
    if (resolved === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");

    if (localStorage.getItem("folio.reducedMotion") === "true") {
      document.documentElement.setAttribute("data-reduced-motion", "true");
    }

    var scale = Number(localStorage.getItem("folio.pageScale") || 1);
    if (!Number.isFinite(scale) || scale < 0.85) scale = 1;
    if (scale > 1.35) scale = 1.35;
    document.documentElement.style.setProperty("--page-scale", String(scale));

    var meta = document.getElementById("themeColorMeta");
    if (meta) meta.setAttribute("content", resolved === "light" ? "#f7f8fa" : "#0a0c10");
  } catch (e) {}
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════
   THEME
   ═══════════════════════════════════════════════════════════ */
:root {
  --theme-primary: #F59E0B;
  --theme-primary-hover: #fbbf24;
  --theme-primary-glow: rgba(245, 158, 11, 0.40);
  --theme-primary-soft: rgba(245, 158, 11, 0.14);
  --theme-bg: #0a0c10;
  --theme-surface: #0f1218;
  --theme-surface-card: rgba(21, 25, 34, 0.72);
  --theme-surface-card-solid: #151922;
  --theme-surface-elevated: #1a1f2a;
  --theme-text: #e8ecf1;
  --theme-text-secondary: rgba(232, 236, 241, 0.72);
  --theme-text-tertiary: rgba(232, 236, 241, 0.44);
  --theme-glass-bg: rgba(255, 255, 255, 0.05);
  --theme-glass-border: rgba(255, 255, 255, 0.09);
  --theme-overlay: rgba(10, 12, 16, 0.85);
  --theme-card-border: rgba(255, 255, 255, 0.08);
  --theme-divider: rgba(255, 255, 255, 0.08);
  --input-bg: rgba(26, 31, 42, 0.88);
  --theme-success: #10B981;
  --theme-success-soft: rgba(16, 185, 129, 0.14);
  --theme-danger: #EF4444;
  --theme-danger-soft: rgba(239, 68, 68, 0.12);
  --theme-warning: #D97706;
  --theme-warning-soft: rgba(217, 119, 6, 0.14);
  --theme-info: #3B82F6;
  --theme-info-soft: rgba(59, 130, 246, 0.14);
  --bg-gradient-1: radial-gradient(circle at 50% -10%, rgba(245, 158, 11, 0.14) 0%, transparent 60%);
  --bg-gradient-2: radial-gradient(circle at 100% 100%, rgba(249, 115, 22, 0.10) 0%, transparent 55%);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --rail-w: 60px;
  --header-h: 48px;
  --bottom-nav-h: 56px;
  --content-max: 1200px;
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'SF Mono', Consolas, Monaco, monospace;
}

[data-theme="light"] {
  --theme-primary: #D97706;
  --theme-primary-hover: #B45309;
  --theme-primary-glow: rgba(217, 119, 6, 0.28);
  --theme-primary-soft: rgba(217, 119, 6, 0.10);
  --theme-bg: #f7f8fa;
  --theme-surface: #ffffff;
  --theme-surface-card: rgba(255, 255, 255, 0.85);
  --theme-surface-card-solid: #ffffff;
  --theme-surface-elevated: #ffffff;
  --theme-text: #121316;
  --theme-text-secondary: rgba(18, 19, 22, 0.72);
  --theme-text-tertiary: rgba(18, 19, 22, 0.48);
  --theme-glass-bg: rgba(255, 255, 255, 0.75);
  --theme-glass-border: rgba(0, 0, 0, 0.08);
  --theme-overlay: rgba(18, 19, 22, 0.55);
  --theme-card-border: rgba(0, 0, 0, 0.07);
  --theme-divider: rgba(0, 0, 0, 0.06);
  --input-bg: #ffffff;
  --theme-success: #059669;
  --theme-success-soft: rgba(5, 150, 105, 0.12);
  --theme-danger: #DC2626;
  --theme-danger-soft: rgba(220, 38, 38, 0.10);
  --theme-warning: #B45309;
  --theme-warning-soft: rgba(180, 83, 9, 0.10);
  --bg-gradient-1: radial-gradient(circle at 50% -10%, rgba(217, 119, 6, 0.08) 0%, transparent 60%);
  --bg-gradient-2: radial-gradient(circle at 100% 100%, rgba(249, 115, 22, 0.06) 0%, transparent 55%);
}

@media (max-width: 639px) {
  :root {
    --rail-w: 0px;
    --header-h: 44px;
    --bottom-nav-h: 52px;
  }
  html, body { font-size: 12px; }
}
@media (min-width: 640px) and (max-width: 1023px) {
  :root { --rail-w: 52px; --header-h: 44px; }
}

/* ═══════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: var(--theme-bg);
  font-family: var(--font);
  color: var(--theme-text);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
}
body {
  background: var(--bg-gradient-1), var(--bg-gradient-2), var(--theme-bg);
  background-attachment: fixed;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; border: none; background: none; padding: 0; }
a { color: var(--theme-primary); text-decoration: none; }
svg { display: block; }
.hidden { display: none !important; }
.mono { font-family: var(--font-mono); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
[data-reduced-motion="true"] *,
[data-reduced-motion="true"] *::before,
[data-reduced-motion="true"] *::after {
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.01ms !important;
}

:focus-visible {
  outline: 2px solid var(--theme-primary);
  outline-offset: 2px;
  border-radius: 6px;
}

/* ═══════════════════════════════════════════════════════════
   SHELL
   ═══════════════════════════════════════════════════════════ */
.app {
  display: flex;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
}

.rail {
  display: none;
  width: var(--rail-w);
  background: var(--theme-surface);
  border-right: 1px solid var(--theme-glass-border);
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: calc(10px + var(--safe-top)) 0 calc(10px + var(--safe-bottom));
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  flex-shrink: 0;
  z-index: 90;
}
@media (min-width: 1024px) { .rail { display: flex; } }

.rail-top, .rail-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.rail-logo {
  width: 36px; height: 36px;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
  background: var(--theme-surface-elevated);
  border: 1px solid var(--theme-glass-border);
  display: flex; align-items: center; justify-content: center;
  color: var(--theme-primary);
  text-decoration: none;
}
.rail-logo img { width: 100%; height: 100%; object-fit: cover; }

.rail-btn {
  width: 36px; height: 36px;
  border-radius: 9px;
  color: var(--theme-text-tertiary);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s var(--ease);
  position: relative;
  text-decoration: none;
}
.rail-btn svg { width: 16px; height: 16px; stroke-width: 2; stroke: currentColor; fill: none; }
.rail-btn:hover { color: var(--theme-text-secondary); background: var(--theme-glass-bg); }
.rail-btn.active { color: var(--theme-primary); background: var(--theme-primary-soft); }
.rail-btn.active::before {
  content: '';
  position: absolute;
  left: -7px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 18px;
  border-radius: 0 3px 3px 0;
  background: var(--theme-primary);
}
.rail-divider { width: 22px; height: 1px; background: var(--theme-divider); margin: 5px 0; }

/* ═══════════════════════════════════════════════════════════
   MAIN
   ═══════════════════════════════════════════════════════════ */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 8px);
}
@media (min-width: 1024px) {
  .main { padding-bottom: calc(16px + var(--safe-bottom)); }
}

.main-inner {
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  padding: calc(12px + var(--safe-top)) 12px 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
@media (min-width: 1024px) {
  .main-inner { padding: 20px 20px 0; gap: 14px; }
}

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
.page-header {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.header-logo {
  display: none;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  color: var(--theme-text);
}
@media (max-width: 1023px) {
  .header-logo { display: flex; }
}

.header-logo-badge {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  border-radius: 8px;
  background: var(--theme-surface-elevated);
  border: 1px solid var(--theme-glass-border);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-primary);
}
.header-logo-badge img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.page-title {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.4px;
  color: var(--theme-text);
  margin: 0;
}
@media (min-width: 640px) { .page-title { font-size: 20px; } }

.page-count {
  font-size: 11px;
  font-weight: 600;
  color: var(--theme-text-tertiary);
  padding: 2px 7px;
  background: var(--theme-glass-bg);
  border-radius: 6px;
}

.header-spacer { flex: 1; }

.search-wrap {
  display: none;
  flex: 1;
  max-width: 320px;
  min-width: 180px;
  position: relative;
  align-items: center;
}
@media (min-width: 900px) {
  .search-wrap { display: flex; }
}
.search-trigger {
  display: none;
}
@media (max-width: 899px) {
  .search-trigger { display: flex; }
}
.search-icon {
  position: absolute;
  left: 10px;
  width: 13px;
  height: 13px;
  stroke: var(--theme-text-tertiary);
  fill: none;
  stroke-width: 2.2;
  pointer-events: none;
}
.search-input {
  width: 100%;
  height: 32px;
  padding: 0 28px 0 30px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 8px;
  color: var(--theme-text);
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  outline: none;
  transition: all 0.2s var(--ease);
}
.search-input:focus {
  border-color: var(--theme-primary);
  background: var(--input-bg);
}
.search-input::placeholder { color: var(--theme-text-tertiary); }

.search-clear {
  position: absolute;
  right: 4px;
  width: 22px;
  height: 22px;
  border-radius: 5px;
  display: none;
  align-items: center;
  justify-content: center;
  color: var(--theme-text-tertiary);
}
.search-clear.visible { display: flex; }
.search-clear:hover { color: var(--theme-text); background: var(--theme-divider); }
.search-clear svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.4; }

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  color: var(--theme-text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s var(--ease);
  flex-shrink: 0;
  position: relative;
}
.icon-btn:hover { color: var(--theme-text); border-color: var(--theme-primary-glow); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.icon-btn.filter-active {
  color: var(--theme-primary);
  border-color: var(--theme-primary);
  background: var(--theme-primary-soft);
}
.icon-btn .filter-badge {
  position: absolute;
  top: -3px;
  right: -3px;
  min-width: 14px;
  height: 14px;
  border-radius: 7px;
  background: var(--theme-primary);
  color: #0a0c10;
  font-size: 8px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
}

.btn-new {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 32px;
  padding: 0 11px;
  background: var(--theme-primary);
  color: #0a0c10;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  transition: all 0.2s var(--ease);
  flex-shrink: 0;
}
.btn-new svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.4; }
.btn-new:hover { background: var(--theme-primary-hover); }
.btn-new:active { transform: scale(0.97); }
.btn-new .label { display: none; }
@media (min-width: 640px) { .btn-new .label { display: inline; } }

/* ═══════════════════════════════════════════════════════════
   STORAGE SUMMARY BAR (plan-wide)
   ═══════════════════════════════════════════════════════════ */
.storage-summary {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 9px;
  font-size: 10.5px;
  color: var(--theme-text-secondary);
  flex-wrap: wrap;
}
.storage-summary-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  font-size: 9.5px;
  flex-shrink: 0;
}
.storage-summary-label svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.storage-summary-bar {
  flex: 1;
  min-width: 80px;
  height: 6px;
  border-radius: 3px;
  background: var(--theme-divider);
  overflow: hidden;
}
.storage-summary-bar-fill {
  height: 100%;
  background: var(--theme-success);
  transition: width 0.3s var(--ease), background 0.3s var(--ease);
}
.storage-summary-bar-fill.warn { background: var(--theme-warning); }
.storage-summary-bar-fill.danger { background: var(--theme-danger); }
.storage-summary-amount {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--theme-text);
  flex-shrink: 0;
}
.storage-summary-pct {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--theme-text-tertiary);
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════════
   TABS
   ═══════════════════════════════════════════════════════════ */
.tabs-bar {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--theme-divider);
  padding-bottom: 0;
  margin-bottom: -4px;
}
.tabs-bar::-webkit-scrollbar { display: none; }

.tab {
  padding: 7px 10px 9px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  white-space: nowrap;
  flex-shrink: 0;
  position: relative;
  transition: color 0.2s var(--ease);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.tab:hover { color: var(--theme-text); }
.tab.active { color: var(--theme-primary); }
.tab.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 8px;
  right: 8px;
  height: 2px;
  background: var(--theme-primary);
  border-radius: 2px 2px 0 0;
}
.tab-count {
  padding: 0 5px;
  border-radius: 4px;
  background: var(--theme-glass-bg);
  font-size: 9px;
  font-weight: 800;
  color: var(--theme-text-tertiary);
}
.tab.active .tab-count {
  background: var(--theme-primary-soft);
  color: var(--theme-primary);
}
.tab-badge-notif {
  padding: 0 5px;
  border-radius: 4px;
  background: var(--theme-danger);
  color: #fff;
  font-size: 8px;
  font-weight: 800;
}

/* ═══════════════════════════════════════════════════════════
   ACTIVE FILTERS
   ═══════════════════════════════════════════════════════════ */
.active-filters {
  display: none;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  padding: 4px 0;
}
.active-filters.visible { display: flex; }

.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--theme-primary-soft);
  border: 1px solid var(--theme-primary-glow);
  color: var(--theme-primary);
  font-size: 10.5px;
  font-weight: 700;
}
.filter-chip button {
  color: currentColor;
  display: flex;
  align-items: center;
}
.filter-chip svg { width: 9px; height: 9px; stroke-width: 2.4; }

.clear-filters-btn {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  padding: 3px 6px;
  border-radius: 5px;
}
.clear-filters-btn:hover { color: var(--theme-text); background: var(--theme-glass-bg); }

/* ═══════════════════════════════════════════════════════════
   PROJECT GRID
   ═══════════════════════════════════════════════════════════ */
.projects-container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  padding-bottom: 12px;
  grid-auto-rows: min-content;
}
@media (min-width: 640px) {
  .projects-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
}
@media (min-width: 1024px) {
  .projects-container { grid-template-columns: repeat(3, 1fr); gap: 12px; }
}

/* ── Project card ── */
.project-card {
  background: var(--theme-surface-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--theme-card-border);
  border-radius: 10px;
  transition: all 0.2s var(--ease);
  display: flex;
  flex-direction: column;
  position: relative;
  min-width: 0;
  overflow: hidden;
}
.project-card:hover {
  border-color: var(--theme-primary-glow);
  transform: translateY(-1px);
}
.project-card.expanded {
  grid-column: 1 / -1;
  border-color: var(--theme-primary-glow);
}
@media (prefers-reduced-transparency: reduce) {
  .project-card { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--theme-surface-card-solid); }
}

/* Header row — always visible */
.project-card-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  cursor: pointer;
  user-select: none;
  min-width: 0;
}
@media (max-width: 639px) {
  .project-card-row { padding: 9px; gap: 9px; }
}

.project-icon {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--theme-surface-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-primary);
  font-weight: 800;
  font-size: 12px;
  border: 1px solid var(--theme-glass-border);
}
.project-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

.project-header-info { flex: 1; min-width: 0; }

.project-name-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 2px;
  min-width: 0;
}
.project-name {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--theme-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
  line-height: 1.3;
}
.project-pin-icon {
  color: var(--theme-primary);
  flex-shrink: 0;
  display: inline-flex;
}

.project-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  font-size: 9.5px;
  color: var(--theme-text-tertiary);
  font-weight: 600;
  line-height: 1.3;
}
.project-meta .sep { opacity: 0.5; }

.role-badge {
  padding: 0px 5px;
  border-radius: 3px;
  font-size: 8.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  background: var(--theme-glass-bg);
  color: var(--theme-text-tertiary);
}
.role-badge.owner { background: var(--theme-primary-soft); color: var(--theme-primary); }
.role-badge.editor { background: var(--theme-info-soft); color: var(--theme-info); }

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.live-badge.live { background: var(--theme-success-soft); color: var(--theme-success); }
.live-badge.live .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
}
.live-badge.offline { background: var(--theme-divider); color: var(--theme-text-tertiary); }
.live-badge.offline .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
}

/* Chevron button — expands card */
.project-expand-btn {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-text-tertiary);
  flex-shrink: 0;
  transition: all 0.2s var(--ease);
}
.project-expand-btn:hover {
  background: var(--theme-glass-bg);
  color: var(--theme-text);
}
.project-expand-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.4;
  transition: transform 0.25s var(--ease);
}
.project-card.expanded .project-expand-btn svg {
  transform: rotate(180deg);
}

/* Stats row — always visible below header */
.project-stats-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px 10px;
  flex-wrap: wrap;
  font-size: 9.5px;
  color: var(--theme-text-tertiary);
  font-weight: 600;
}
@media (max-width: 639px) {
  .project-stats-row { padding: 0 9px 9px; font-size: 9px; }
}
.project-stat-item {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.project-stat-item svg {
  width: 9px;
  height: 9px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
  opacity: 0.8;
}
.project-stat-warn { color: var(--theme-warning); }
.project-stat-danger { color: var(--theme-danger); }

/* Expanded detail — slides in */
.project-card-detail {
  display: none;
  padding: 0 10px 10px;
  flex-direction: column;
  gap: 10px;
  border-top: 1px solid var(--theme-divider);
  padding-top: 10px;
  animation: expandIn 0.25s var(--ease);
}
.project-card.expanded .project-card-detail {
  display: flex;
}
@keyframes expandIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Detail — description */
.detail-desc {
  font-size: 11px;
  color: var(--theme-text-secondary);
  line-height: 1.5;
  overflow-wrap: break-word;
}
.detail-desc.empty {
  color: var(--theme-text-tertiary);
  font-style: italic;
}

/* Detail — language badges */
.lang-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.lang-badge {
  font-size: 9px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--theme-glass-bg);
  color: var(--theme-text-tertiary);
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.lang-badge .lang-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--theme-primary);
}

/* Detail — storage bar */
.detail-storage {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.detail-storage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 9.5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.detail-storage-header span:last-child {
  font-family: var(--font-mono);
  text-transform: none;
  letter-spacing: 0;
  color: var(--theme-text-secondary);
  font-weight: 600;
}
.detail-storage-bar {
  height: 5px;
  border-radius: 3px;
  background: var(--theme-divider);
  overflow: hidden;
}
.detail-storage-fill {
  height: 100%;
  background: var(--theme-success);
  transition: width 0.3s var(--ease), background 0.3s var(--ease);
}
.detail-storage-fill.warn { background: var(--theme-warning); }
.detail-storage-fill.danger { background: var(--theme-danger); }

/* Detail — warning */
.detail-warning {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 9px;
  border-radius: 6px;
  background: var(--theme-warning-soft);
  border: 1px solid rgba(217, 119, 6, 0.25);
  font-size: 10px;
  color: var(--theme-warning);
  font-weight: 600;
  line-height: 1.35;
}
.detail-warning svg {
  width: 11px;
  height: 11px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
  flex-shrink: 0;
}

.detail-warning.danger {
  background: var(--theme-danger-soft);
  border-color: rgba(239, 68, 68, 0.25);
  color: var(--theme-danger);
}

/* Detail — action buttons (horizontal grid) */
.detail-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding-top: 4px;
}
.detail-action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 10px 6px;
  border-radius: 8px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  color: var(--theme-text-secondary);
  font-size: 10px;
  font-weight: 700;
  transition: all 0.15s var(--ease);
  text-align: center;
  min-height: 54px;
}
.detail-action-btn:hover {
  color: var(--theme-text);
  border-color: var(--theme-primary-glow);
  background: var(--theme-surface-elevated);
}
.detail-action-btn:active { transform: scale(0.97); }
.detail-action-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
}
.detail-action-btn .label {
  font-size: 9.5px;
  font-weight: 700;
  line-height: 1.2;
}
.detail-action-btn.primary {
  background: var(--theme-primary-soft);
  color: var(--theme-primary);
  border-color: var(--theme-primary-glow);
}
.detail-action-btn.primary:hover {
  background: var(--theme-primary);
  color: #0a0c10;
  border-color: var(--theme-primary);
}
[data-theme="light"] .detail-action-btn.primary:hover { color: #fff; }
.detail-action-btn.danger {
  color: var(--theme-danger);
}
.detail-action-btn.danger:hover {
  background: var(--theme-danger-soft);
  border-color: rgba(239, 68, 68, 0.4);
  color: var(--theme-danger);
}

/* ═══════════════════════════════════════════════════════════
   SKELETON
   ═══════════════════════════════════════════════════════════ */
.skeleton {
  background: linear-gradient(90deg, var(--theme-divider) 0%, var(--theme-glass-border) 50%, var(--theme-divider) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite linear;
  border-radius: 5px;
}
@keyframes shimmer {
  from { background-position: 200% 0; }
  to { background-position: -200% 0; }
}
.skeleton-card {
  background: var(--theme-surface-card);
  border: 1px solid var(--theme-card-border);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.skeleton-card-row { display: flex; align-items: center; gap: 10px; }
.skeleton-icon { width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0; }
.skeleton-title { width: 60%; height: 12px; }
.skeleton-sub { width: 40%; height: 8px; margin-top: 3px; }

/* ═══════════════════════════════════════════════════════════
   EMPTY STATE
   ═══════════════════════════════════════════════════════════ */
.empty-state {
  padding: 40px 16px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  grid-column: 1 / -1;
}
.empty-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--theme-primary-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-primary);
  margin-bottom: 4px;
}
.empty-icon svg { width: 22px; height: 22px; stroke-width: 2; }
.empty-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--theme-text);
}
.empty-desc {
  font-size: 11.5px;
  color: var(--theme-text-tertiary);
  line-height: 1.45;
  max-width: 320px;
  margin-bottom: 4px;
}
.empty-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

/* ═══════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 7px 12px;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 700;
  border: 1px solid transparent;
  transition: all 0.2s var(--ease);
  white-space: nowrap;
  min-height: 30px;
  font-family: inherit;
}
.btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; flex-shrink: 0; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-primary { background: var(--theme-primary); color: #0a0c10; }
[data-theme="light"] .btn-primary { color: #ffffff; }
.btn-primary:hover:not(:disabled) { background: var(--theme-primary-hover); }

.btn-secondary { background: var(--theme-glass-bg); color: var(--theme-text); border-color: var(--theme-card-border); }
.btn-secondary:hover:not(:disabled) { background: var(--theme-surface-elevated); border-color: var(--theme-primary-glow); }

.btn-ghost { background: transparent; color: var(--theme-text-secondary); border-color: transparent; }
.btn-ghost:hover:not(:disabled) { color: var(--theme-text); background: var(--theme-glass-bg); }

.btn-danger { background: var(--theme-danger); color: #ffffff; }
.btn-danger:hover:not(:disabled) { background: #dc2626; }

.btn-outline-danger { background: transparent; color: var(--theme-danger); border-color: rgba(239, 68, 68, 0.3); }
.btn-outline-danger:hover:not(:disabled) { background: var(--theme-danger-soft); }

.btn-sm { padding: 4px 9px; font-size: 10.5px; min-height: 24px; border-radius: 6px; }
.btn-sm svg { width: 10px; height: 10px; }
.btn-block { width: 100%; }

/* ═══════════════════════════════════════════════════════════
   FULLSCREEN OVERLAY (filters / stats)
   ═══════════════════════════════════════════════════════════ */
.fullscreen-overlay {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: var(--theme-bg);
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.35s var(--ease), opacity 0.25s var(--ease);
  overflow: hidden;
}
.fullscreen-overlay.active {
  transform: translateY(0);
  opacity: 1;
  pointer-events: all;
}
@media (min-width: 640px) {
  .fullscreen-overlay {
    transform: scale(0.97);
    background: var(--theme-overlay);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 20px;
    align-items: center;
    justify-content: center;
  }
  .fullscreen-overlay.active { transform: scale(1); }
}

.overlay-inner {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  background: var(--theme-bg);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  height: 100%;
}
@media (min-width: 640px) {
  .overlay-inner {
    background: var(--theme-surface-card-solid);
    border: 1px solid var(--theme-glass-border);
    border-radius: 16px;
    max-height: 88vh;
    height: auto;
  }
}

.overlay-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(10px + var(--safe-top)) 12px 10px;
  border-bottom: 1px solid var(--theme-divider);
  flex-shrink: 0;
  background: var(--theme-bg);
}
@media (min-width: 640px) {
  .overlay-header { padding: 12px 16px; background: transparent; }
}

.overlay-title {
  flex: 1;
  font-size: 14px;
  font-weight: 800;
  color: var(--theme-text);
  letter-spacing: -0.2px;
}
.overlay-sub {
  font-size: 10.5px;
  color: var(--theme-text-tertiary);
  font-weight: 600;
  margin-top: 1px;
}
.overlay-close {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  color: var(--theme-text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.overlay-close:hover { color: var(--theme-text); border-color: var(--theme-primary-glow); }
.overlay-close svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; }

.overlay-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}
@media (min-width: 640px) { .overlay-body { padding: 16px; } }

.overlay-footer {
  padding: 10px 12px calc(10px + var(--safe-bottom));
  border-top: 1px solid var(--theme-divider);
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  background: var(--theme-bg);
}
@media (min-width: 640px) {
  .overlay-footer { padding: 12px 16px; background: transparent; }
}
.overlay-footer .btn { flex: 1; }

/* ═══════════════════════════════════════════════════════════
   FILTERS / STATS BLOCKS
   ═══════════════════════════════════════════════════════════ */
.filter-section {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.filter-label {
  font-size: 9.5px;
  font-weight: 800;
  color: var(--theme-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.filter-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.filter-pill {
  padding: 5px 10px;
  border-radius: 7px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  color: var(--theme-text-secondary);
  font-size: 11px;
  font-weight: 700;
  transition: all 0.2s var(--ease);
  cursor: pointer;
  font-family: inherit;
}
.filter-pill:hover { border-color: var(--theme-primary-glow); color: var(--theme-text); }
.filter-pill.active {
  background: var(--theme-primary);
  color: #0a0c10;
  border-color: var(--theme-primary);
}
[data-theme="light"] .filter-pill.active { color: #ffffff; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.stat-tile {
  padding: 8px 10px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 8px;
}
.stat-label {
  font-size: 9px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 2px;
}
.stat-value {
  font-size: 15px;
  font-weight: 800;
  color: var(--theme-text);
  letter-spacing: -0.3px;
  line-height: 1.1;
}
.stat-value.warn { color: var(--theme-warning); }
.stat-value.danger { color: var(--theme-danger); }
.stat-value.success { color: var(--theme-success); }

.storage-block {
  padding: 10px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 10px;
}
.storage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.storage-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--theme-text);
}
.storage-amount {
  font-size: 10px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  font-family: var(--font-mono);
}
.storage-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--theme-divider);
  overflow: hidden;
  margin-bottom: 5px;
}
.storage-bar-fill {
  height: 100%;
  background: var(--theme-success);
  transition: width 0.3s var(--ease), background 0.3s var(--ease);
}
.storage-bar-fill.warn { background: var(--theme-warning); }
.storage-bar-fill.danger { background: var(--theme-danger); }
.storage-note {
  font-size: 10px;
  color: var(--theme-text-tertiary);
  line-height: 1.4;
}

.cleanup-block {
  padding: 10px;
  background: var(--theme-warning-soft);
  border: 1px solid rgba(217, 119, 6, 0.3);
  border-radius: 10px;
}
.cleanup-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.cleanup-header svg { width: 13px; height: 13px; stroke: var(--theme-warning); fill: none; stroke-width: 2.2; flex-shrink: 0; }
.cleanup-title {
  flex: 1;
  font-size: 11px;
  font-weight: 800;
  color: var(--theme-warning);
}
.cleanup-desc {
  font-size: 10px;
  color: var(--theme-text-secondary);
  line-height: 1.45;
  margin-bottom: 8px;
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
}
.toggle-info { flex: 1; min-width: 0; }
.toggle-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--theme-text);
  margin-bottom: 1px;
}
.toggle-desc {
  font-size: 10px;
  color: var(--theme-text-tertiary);
  line-height: 1.4;
}
.switch {
  position: relative;
  width: 36px;
  height: 20px;
  border-radius: 10px;
  background: var(--theme-divider);
  cursor: pointer;
  transition: background 0.2s var(--ease);
  flex-shrink: 0;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ffffff;
  transition: transform 0.22s var(--ease);
  box-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.switch.on { background: var(--theme-primary); }
.switch.on::after { transform: translateX(16px); }

/* ═══════════════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 700;
  background: var(--theme-overlay);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s var(--ease);
  padding: 0;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }
@media (min-width: 640px) {
  .modal-overlay { align-items: center; padding: 20px; }
}

.modal {
  background: var(--theme-surface-card-solid);
  border: 1px solid var(--theme-glass-border);
  border-radius: 20px 20px 0 0;
  padding: 14px 14px calc(14px + var(--safe-bottom));
  max-width: 100%;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.28s var(--ease);
}
.modal-overlay.active .modal { transform: translateY(0); }

@media (min-width: 640px) {
  .modal {
    border-radius: 16px;
    max-width: 460px;
    padding: 20px;
    transform: scale(0.94);
  }
  .modal-overlay.active .modal { transform: scale(1); }
}

.modal-handle {
  width: 32px;
  height: 3px;
  border-radius: 2px;
  background: var(--theme-glass-border);
  margin: 0 auto 12px;
}
@media (min-width: 640px) { .modal-handle { display: none; } }

.modal-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--theme-text);
  letter-spacing: -0.2px;
  margin-bottom: 3px;
}
.modal-desc {
  font-size: 11.5px;
  color: var(--theme-text-secondary);
  line-height: 1.5;
  margin-bottom: 12px;
}
.modal-actions {
  display: flex;
  gap: 6px;
  margin-top: 14px;
}
.modal-actions .btn { flex: 1; }

/* ═══════════════════════════════════════════════════════════
   FIELDS
   ═══════════════════════════════════════════════════════════ */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.field-hint { font-size: 10px; color: var(--theme-text-tertiary); line-height: 1.4; }

.input, .textarea {
  width: 100%;
  padding: 8px 10px;
  background: var(--input-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 7px;
  color: var(--theme-text);
  font-size: 12px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s var(--ease);
}
.input:focus, .textarea:focus { border-color: var(--theme-primary); }
.input::placeholder, .textarea::placeholder { color: var(--theme-text-tertiary); }
.textarea { min-height: 64px; resize: vertical; line-height: 1.5; }

/* ═══════════════════════════════════════════════════════════
   ACTION MENU
   ═══════════════════════════════════════════════════════════ */
.action-menu {
  position: fixed;
  inset: 0;
  z-index: 800;
  display: none;
  align-items: flex-end;
  justify-content: center;
  background: var(--theme-overlay);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  opacity: 0;
  transition: opacity 0.25s var(--ease);
}
.action-menu.active { display: flex; opacity: 1; }
@media (min-width: 640px) {
  .action-menu { align-items: center; padding: 20px; }
}

.action-sheet {
  background: var(--theme-surface-card-solid);
  border: 1px solid var(--theme-glass-border);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 400px;
  transform: translateY(100%);
  transition: transform 0.28s var(--ease);
  overflow: hidden;
}
.action-menu.active .action-sheet { transform: translateY(0); }

@media (min-width: 640px) {
  .action-sheet { border-radius: 14px; transform: scale(0.94); }
  .action-menu.active .action-sheet { transform: scale(1); }
}

.action-sheet-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 12px 10px;
  border-bottom: 1px solid var(--theme-divider);
  background: var(--theme-glass-bg);
}
.action-sheet-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--theme-surface-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-primary);
  font-weight: 800;
  font-size: 12px;
  border: 1px solid var(--theme-glass-border);
}
.action-sheet-icon img { width: 100%; height: 100%; object-fit: cover; }
.action-sheet-title { flex: 1; min-width: 0; }
.action-sheet-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--theme-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.action-sheet-meta {
  font-size: 10px;
  color: var(--theme-text-tertiary);
  font-weight: 600;
}

.action-list { padding: 4px; }
.action-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border-radius: 6px;
  color: var(--theme-text);
  font-size: 12px;
  font-weight: 600;
  width: 100%;
  text-align: left;
  transition: background 0.15s var(--ease);
}
.action-item:hover { background: var(--theme-glass-bg); }
.action-item svg { width: 14px; height: 14px; stroke: var(--theme-text-tertiary); fill: none; stroke-width: 2.2; flex-shrink: 0; }
.action-item:hover svg { stroke: var(--theme-primary); }
.action-item.danger { color: var(--theme-danger); }
.action-item.danger svg { stroke: var(--theme-danger); }
.action-item.danger:hover { background: var(--theme-danger-soft); }
.action-divider {
  height: 1px;
  background: var(--theme-divider);
  margin: 4px 10px;
}

/* ═══════════════════════════════════════════════════════════
   LOADING / TOAST
   ═══════════════════════════════════════════════════════════ */
.loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 900;
  background: var(--theme-overlay);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  padding: 20px;
}
.loading-overlay.active { display: flex; }
.loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--theme-primary-soft);
  border-top-color: var(--theme-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--theme-text);
  text-align: center;
}
.loading-desc {
  font-size: 11.5px;
  color: var(--theme-text-secondary);
  text-align: center;
  line-height: 1.5;
  max-width: 280px;
}

.toast-container {
  position: fixed;
  bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 10px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 950;
  width: calc(100% - 20px);
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  pointer-events: none;
}
@media (min-width: 1024px) {
  .toast-container {
    left: auto;
    right: 16px;
    transform: none;
    bottom: 16px;
  }
}

.toast {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: var(--theme-surface-card-solid);
  border: 1px solid var(--theme-card-border);
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--theme-text);
  transform: translateY(20px);
  opacity: 0;
  transition: all 0.28s var(--ease-spring);
  pointer-events: all;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast svg { width: 12px; height: 12px; flex-shrink: 0; }
.toast.success svg { stroke: var(--theme-success); }
.toast.error svg { stroke: var(--theme-danger); }
.toast.info svg { stroke: var(--theme-primary); }
.toast.warning svg { stroke: var(--theme-warning); }

/* ═══════════════════════════════════════════════════════════
   CELEBRATION
   ═══════════════════════════════════════════════════════════ */
.celebration {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: var(--theme-overlay);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.3s var(--ease);
}
.celebration.active { display: flex; opacity: 1; }

.celebration-card {
  background: var(--theme-surface-card-solid);
  border: 1px solid var(--theme-glass-border);
  border-radius: 18px;
  padding: 24px 20px;
  width: 100%;
  max-width: 340px;
  text-align: center;
  transform: scale(0.92);
  transition: transform 0.4s var(--ease-spring);
}
.celebration.active .celebration-card { transform: scale(1); }

.celebration-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  margin: 0 auto 12px;
  background: var(--theme-primary-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-primary);
}
.celebration-icon svg { width: 26px; height: 26px; stroke-width: 2.4; }

.celebration-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--theme-text);
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}
.celebration-desc {
  font-size: 11.5px;
  color: var(--theme-text-secondary);
  line-height: 1.5;
  margin-bottom: 16px;
}
.celebration-actions { display: flex; flex-direction: column; gap: 6px; }

/* ═══════════════════════════════════════════════════════════
   BOTTOM NAV
   ═══════════════════════════════════════════════════════════ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(var(--bottom-nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--theme-surface);
  border-top: 1px solid var(--theme-glass-border);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-around;
}
@media (min-width: 1024px) { .bottom-nav { display: none; } }

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 3px;
  border-radius: 8px;
  color: var(--theme-text-tertiary);
  text-decoration: none;
  transition: all 0.2s var(--ease);
  font-size: 8.5px;
  font-weight: 700;
  height: 42px;
  justify-content: center;
}
.nav-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.nav-btn.active {
  color: var(--theme-primary);
  background: var(--theme-primary-soft);
}
.nav-btn:active { transform: scale(0.94); }
@media (max-width: 639px) {
  .nav-btn { height: 40px; font-size: 8px; }
  .nav-btn svg { width: 15px; height: 15px; }
}

/* ═══════════════════════════════════════════════════════════
   OFFLINE
   ═══════════════════════════════════════════════════════════ */
.offline-banner {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: var(--theme-warning-soft);
  border: 1px solid rgba(217, 119, 6, 0.3);
  border-radius: 8px;
  color: var(--theme-warning);
  font-size: 10.5px;
  font-weight: 700;
}
.offline-banner.visible { display: flex; }
.offline-banner svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.2; flex-shrink: 0; }

/* ═══════════════════════════════════════════════════════════
   SORT BTN
   ═══════════════════════════════════════════════════════════ */
.sort-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 32px;
  padding: 0 10px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 8px;
  color: var(--theme-text-secondary);
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
  transition: all 0.2s var(--ease);
}
.sort-btn:hover { color: var(--theme-text); border-color: var(--theme-primary-glow); }
.sort-btn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.sort-btn .label { display: none; }
@media (min-width: 640px) { .sort-btn .label { display: inline; } }

/* ═══════════════════════════════════════════════════════════
   NOTIFICATION BANNER
   ═══════════════════════════════════════════════════════════ */
.notif-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: var(--theme-primary-soft);
  border: 1px solid var(--theme-primary-glow);
  border-radius: 9px;
  font-size: 11px;
  color: var(--theme-text-secondary);
}
.notif-banner strong { color: var(--theme-text); font-weight: 700; }
.notif-banner > svg { width: 14px; height: 14px; stroke: var(--theme-primary); fill: none; stroke-width: 2.2; flex-shrink: 0; }
.notif-banner .nb-text { flex: 1; min-width: 0; line-height: 1.35; }
.notif-banner .nb-link {
  color: var(--theme-primary);
  font-weight: 700;
  text-decoration: none;
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════════
   ICON PICKER (create flow reuse)
   ═══════════════════════════════════════════════════════════ */
.icon-tabs {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--theme-glass-bg);
  border-radius: 8px;
  margin-bottom: 10px;
}
.icon-tab {
  flex: 1;
  padding: 6px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  transition: all 0.2s var(--ease);
  font-family: inherit;
  border: none;
  cursor: pointer;
  background: transparent;
}
.icon-tab.active {
  background: var(--theme-surface-elevated);
  color: var(--theme-text);
}
.icon-mode-panel { display: none; }
.icon-mode-panel.active { display: block; }
.icon-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 10px;
  min-height: 50px;
}
@media (max-width: 480px) {
  .icon-grid { grid-template-columns: repeat(3, 1fr); }
}
.icon-option {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  background: var(--theme-surface-elevated);
  border: 2px solid transparent;
  overflow: hidden;
  transition: border-color 0.2s var(--ease), transform 0.15s var(--ease);
  cursor: pointer;
  padding: 0;
}
.icon-option:hover { transform: scale(1.04); }
.icon-option.selected {
  border-color: var(--theme-primary);
  box-shadow: 0 0 0 2px var(--theme-primary-soft);
}
.icon-option img { width: 100%; height: 100%; object-fit: cover; display: block; }
.icon-skeleton {
  aspect-ratio: 1;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--theme-divider) 0%, var(--theme-glass-border) 50%, var(--theme-divider) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite linear;
}
.icon-placeholder {
  aspect-ratio: 1;
  border-radius: 8px;
  background: var(--theme-glass-bg);
  border: 1px dashed var(--theme-card-border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-text-tertiary);
  font-size: 9px;
  text-align: center;
  padding: 3px;
  line-height: 1.2;
}

/* ═══════════════════════════════════════════════════════════
   DELETE CONFIRM (typed name)
   ═══════════════════════════════════════════════════════════ */
.delete-confirm-input {
  width: 100%;
  padding: 10px 12px;
  background: var(--input-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 8px;
  color: var(--theme-text);
  font-size: 12px;
  font-family: var(--font-mono);
  outline: none;
  transition: border-color 0.2s;
  margin-top: 8px;
}
.delete-confirm-input:focus { border-color: var(--theme-danger); }
.delete-confirm-input.matched { border-color: var(--theme-success); }

.delete-danger-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--theme-danger-soft);
  color: var(--theme-danger);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 12px;
}
.delete-danger-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ═══════════════════════════════════════════════════════════
   MOBILE TWEAKS
   ═══════════════════════════════════════════════════════════ */
@media (max-width: 639px) {
  .detail-actions { gap: 5px; }
  .detail-action-btn { padding: 9px 4px; min-height: 50px; }
  .detail-action-btn svg { width: 15px; height: 15px; }
  .detail-action-btn .label { font-size: 9px; }
}
</style>
</head>

        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>

    <div class="rail-bottom">
      <div class="rail-divider"></div>

<script>
(function () {
  'use strict';

  function wireThemeSync() {
    window.addEventListener('storage', function (e) {
      try {
        if (e.key === 'folio.theme') {
          var pref = e.newValue || 'dark';
          var resolved = pref;
          if (pref === 'auto' || pref === 'system') {
            resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
              ? 'light' : 'dark';
          }
          if (resolved === 'light') document.documentElement.setAttribute('data-theme', 'light');
          else document.documentElement.removeAttribute('data-theme');
          var meta = document.getElementById('themeColorMeta');
          if (meta) meta.setAttribute('content', resolved === 'light' ? '#f7f8fa' : '#0a0c10');
        }
        if (e.key === 'folio.reducedMotion') {
          if (e.newValue === 'true') document.documentElement.setAttribute('data-reduced-motion', 'true');
          else document.documentElement.removeAttribute('data-reduced-motion');
        }
        if (e.key === 'folio.pageScale') {
          var scale = Number(e.newValue || 1);
          if (!Number.isFinite(scale) || scale < 0.85) scale = 1;
          if (scale > 1.35) scale = 1.35;
          document.documentElement.style.setProperty('--page-scale', String(scale));
        }
      } catch (err) {}
    });
  }

  function wireThemeMediaQuery() {
    if (!window.matchMedia) return;
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    var handler = function () {
      try {
        var pref = localStorage.getItem('folio.theme') || 'dark';
        if (pref !== 'auto' && pref !== 'system') return;
        var resolved = mq.matches ? 'light' : 'dark';
        if (resolved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
        var meta = document.getElementById('themeColorMeta');
        if (meta) meta.setAttribute('content', resolved === 'light' ? '#f7f8fa' : '#0a0c10');
      } catch (e) {}
    };
    if (mq.addEventListener) mq.addEventListener('change', handler);
    else if (mq.addListener) mq.addListener(handler);
  }

  // ═══════════════════════════════════════════════════════════
  // CONFIG
  // ═══════════════════════════════════════════════════════════

  const API_BASE = 'https://foliostudios.vercel.app/api';

  // ═══════════════════════════════════════════════════════════

  const SVG = {

    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>',

    image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
    checkCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
    edit3: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
    wifiOff: '<line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>',
