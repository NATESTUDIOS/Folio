    archive: '<polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>',
    unlock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
    bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
    dashboard: '<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
  };

  const svg = (name, size = 14, sw = 2.2) =>
    `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${SVG[name] || ''}</svg>`;

  // ═══════════════════════════════════════════════════════════
  // IDB v3
  // ═══════════════════════════════════════════════════════════

  let dbConn = null;
  function openDB() {
    if (dbConn) return Promise.resolve(dbConn);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => { dbConn = req.result; resolve(dbConn); };
      req.onupgradeneeded = (event) => {
        const conn = event.target.result;
        if (!conn.objectStoreNames.contains('projects')) conn.createObjectStore('projects', { keyPath: 'pid' });
        if (!conn.objectStoreNames.contains('files')) {
          const store = conn.createObjectStore('files', { keyPath: ['pid', 'path'] });
          store.createIndex('pid', 'pid');
        }
        if (!conn.objectStoreNames.contains('versions')) {
          const store = conn.createObjectStore('versions', { keyPath: 'vid' });
          store.createIndex('pid', 'pid');
        }
        if (!conn.objectStoreNames.contains('projectMeta')) conn.createObjectStore('projectMeta', { keyPath: 'pid' });
        if (!conn.objectStoreNames.contains('syncQueue')) conn.createObjectStore('syncQueue', { keyPath: 'id', autoIncrement: true });
        if (!conn.objectStoreNames.contains('folders')) {
          const store = conn.createObjectStore('folders', { keyPath: ['pid', 'path'] });
          store.createIndex('pid', 'pid');
        }
      };
    });
  }

  function dbWrap(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
  function dbTx(store, mode = 'readonly') { return dbConn.transaction(store, mode).objectStore(store); }

  const IDB = {
    async listProjects() {
      const all = await dbWrap(dbTx('projects').getAll());
      return all.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    },
    async getProject(pid) { return dbWrap(dbTx('projects').get(pid)); },
    async putProject(p) { return dbWrap(dbTx('projects', 'readwrite').put(p)); },
    async deleteProject(pid) {
      await dbWrap(dbTx('projects', 'readwrite').delete(pid));
      const files = await dbWrap(dbTx('files').index('pid').getAll(pid));
      for (const f of files) await dbWrap(dbTx('files', 'readwrite').delete([f.pid, f.path]));
      const versions = await dbWrap(dbTx('versions').index('pid').getAll(pid));
      for (const v of versions) await dbWrap(dbTx('versions', 'readwrite').delete(v.vid));
      const folders = await dbWrap(dbTx('folders').index('pid').getAll(pid));
      for (const fo of folders) await dbWrap(dbTx('folders', 'readwrite').delete([fo.pid, fo.path]));
    },
    async putFile(pid, path, content) {
      return dbWrap(dbTx('files', 'readwrite').put({ pid, path, content, updatedAt: Date.now() }));
    },
    async listFiles(pid) {
      return dbWrap(dbTx('files').index('pid').getAll(pid));
    },
  };

  function normalizeServerProject(p) {
    return {
      pid: p.pid,
      name: p.name || 'Untitled project',
      slug: p.slug || '',
      description: p.description || '',
      iconUrl: p.iconUrl || null,
      createdAt: p.createdAt ? new Date(p.createdAt).getTime() : Date.now(),
      updatedAt: p.updatedAt ? new Date(p.updatedAt).getTime() : Date.now(),
      storageUsed: p.storageUsed || 0,
      storageLimit: p.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT,
      viewCount: p.viewCount || 0,
      deployment: p.deployment || null,
      _server: true,
    };
  }

  async function hydrateProjectsFromServer(projects) {
    if (!Array.isArray(projects)) return;
    for (const p of projects) {
      if (!p || !p.pid) continue;
      const existing = await IDB.getProject(p.pid);
      const localUpdated = existing?.updatedAt || 0;
      const serverUpdated = p.updatedAt ? new Date(p.updatedAt).getTime() : 0;
      if (existing && localUpdated > serverUpdated) continue;
      await IDB.putProject(normalizeServerProject(p));
    }
  }

  // ═══════════════════════════════════════════════════════════
  // STATE
  // ═══════════════════════════════════════════════════════════

  const S = {
    session: null, user: null, uid: null,
    projects: [], filtered: [],
    activeTab: 'all', activeFilters: new Set(),
    searchQuery: '', sortId: 'modified',
    createStep: 1, createName: '', createDescription: '',
    createIconMode: 'name', createIconUrl: null, createIconDataUrl: null,
    createIconVariants: [], createImageUrlInput: '',
    storageEstimate: null, storageLimit: 10 * 1024 * 1024,
    deploymentCache: new Map(), expiredDeployments: [],
    autoCleanEnabled: true, activeMenuProject: null,
    online: navigator.onLine,
    expandedProjects: new Set(),
    pinnedProjects: new Set(),
    notifStats: null,
    notifBellTimer: null,
    analytics: new Map(),
    lastSyncedAt: 0,
    recentSearches: [],
  };

  const $ = id => document.getElementById(id);
  const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const escapeAttr = s => String(s ?? '').replace(/"/g, '&quot;');

  // ═══════════════════════════════════════════════════════════
  // UTILITIES
  // ═══════════════════════════════════════════════════════════

  function timeAgo(ts) {
    if (!ts) return '—';
    const diff = Date.now() - ts;
    if (diff < 60000) return 'now';
    const m = Math.floor(diff / 60000);
    if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h`;
    const d = Math.floor(h / 24);
    if (d < 30) return `${d}d`;
    return new Date(ts).toLocaleDateString();
  }
  function formatBytes(n) {
    if (!n || n < 0) return '0 B';
    const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${n < 10 ? n.toFixed(1) : Math.round(n)} ${u[i]}`;
  }
  function formatNumber(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n || 0);
  }
  function getInitials(name) {
    const s = String(name || '').trim();
    if (!s) return '?';
    const parts = s.split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  function getAvatarColor(seed) {
    const colors = [
      'linear-gradient(135deg, #F59E0B, #f97316)',
      'linear-gradient(135deg, #0284c7, #0369a1)',
      'linear-gradient(135deg, #a855f7, #6d28d9)',
      'linear-gradient(135deg, #10B981, #059669)',
      'linear-gradient(135deg, #ec4899, #be185d)',
      'linear-gradient(135deg, #06b6d4, #0891b2)',
    ];
    let hash = 0;
    const s = String(seed || '');
    for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
  }
  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }
  function copyToClipboard(text) {
    try {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
        return true;
      }
    } catch {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch { return false; }
  }

  function toast(msg, type = 'info', duration = 2400) {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const ic = type === 'success' ? 'checkCircle' : type === 'error' ? 'alert' : type === 'warning' ? 'alertTriangle' : 'info';
    el.innerHTML = svg(ic, 13, 2.4) + '<span></span>';
    el.querySelector('span').textContent = msg;
    $('toastContainer').appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, duration);
  }

  function showLoading(title, desc) {
    $('loadingTitle').textContent = title || 'Loading…';
    $('loadingDesc').textContent = desc || '';
    $('loadingOverlay').classList.add('active');
  }
  function hideLoading() { $('loadingOverlay').classList.remove('active'); }

  function openModal(html) {
    $('modalBody').innerHTML = html;
    $('modalOverlay').classList.add('active');
  }
  function closeModal() {
    $('modalOverlay').classList.remove('active');
    setTimeout(() => { $('modalBody').innerHTML = ''; }, 250);
  }
  window.closeModal = closeModal;

  function confirmModal(title, desc, confirmLabel, danger, onConfirm) {
    openModal(`
      <div class="modal-title">${escapeHTML(title)}</div>
      <div class="modal-desc">${escapeHTML(desc)}</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-modal-close>Cancel</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="modalConfirmBtn">${escapeHTML(confirmLabel)}</button>
      </div>
    `);
    $('modalConfirmBtn').addEventListener('click', () => { closeModal(); onConfirm(); });
  }

  // ═══════════════════════════════════════════════════════════
  // SESSION / API
  // ═══════════════════════════════════════════════════════════

  function readSession() {
    try { S.session = localStorage.getItem(STORAGE.session); } catch {}
    try {
      const raw = localStorage.getItem(STORAGE.user);
      S.user = raw ? JSON.parse(raw) : null;
    } catch {}
    if (S.user) S.uid = S.user.uid || null;
    try {
      const pinRaw = localStorage.getItem(STORAGE.pinned);
      if (pinRaw) S.pinnedProjects = new Set(JSON.parse(pinRaw));
    } catch {}
    try {
      const rsRaw = localStorage.getItem(STORAGE.recentSearches);
      if (rsRaw) S.recentSearches = JSON.parse(rsRaw).slice(0, 5);
    } catch {}
  }

  async function apiFetch(url, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    if (S.session) headers['Authorization'] = `Bearer ${S.session}`;
    try {
      const res = await fetch(url, { ...opts, headers });
      let data = {};
      try { data = await res.json(); } catch {}
      return { ok: res.ok, status: res.status, data };
    } catch (err) {
      return { ok: false, status: 0, data: { error: 'NETWORK_ERROR' } };
    }
  }

  // ═══════════════════════════════════════════════════════════
  // ROUTING
  // ═══════════════════════════════════════════════════════════

  function getHashTab() {
    const h = location.hash.replace(/^#\/?/, '');
    return TABS.some(t => t.id === h) ? h : null;
  }
  function setHashTab(id) {
    const newHash = `#/${id}`;
    if (location.hash !== newHash) history.replaceState(null, '', newHash);
  }
  function switchTab(id) {
    if (!TABS.some(t => t.id === id)) return;
    S.activeTab = id;
    S.activeFilters.clear();
    setHashTab(id);
    try { localStorage.setItem(STORAGE.lastTab, id); } catch {}
    renderTabs();
    renderActiveFilters();
    applyFiltersAndRender();
  }
  function goEditor(pid) { window.location.href = '/?pid=' + encodeURIComponent(pid); }
  function goDashboard(pid) { window.location.href = '/project?pid=' + encodeURIComponent(pid); }

  function readUrlParams() {
    const params = new URLSearchParams(location.search);
    const pid = params.get('pid');
    if (pid) {
      // Direct deep-link → navigate to project page
      window.location.replace('/project?pid=' + encodeURIComponent(pid));
      return false;
    }
    const tab = params.get('tab');
    if (tab && TABS.some(t => t.id === tab)) S.activeTab = tab;
    const q = params.get('q');
    if (q) S.searchQuery = q;
    return true;
  }

  // ═══════════════════════════════════════════════════════════
  // PIN / UNPIN
  // ═══════════════════════════════════════════════════════════

  function togglePin(pid) {
    if (S.pinnedProjects.has(pid)) S.pinnedProjects.delete(pid);
    else S.pinnedProjects.add(pid);
    try { localStorage.setItem(STORAGE.pinned, JSON.stringify([...S.pinnedProjects])); } catch {}
    toast(S.pinnedProjects.has(pid) ? 'Pinned' : 'Unpinned', 'success', 1200);
  }

  // ═══════════════════════════════════════════════════════════
  // ARCHIVE
  // ═══════════════════════════════════════════════════════════

  async function toggleArchive(project) {
    const wasArchived = !!project.archived;
    project.archived = !wasArchived;
    project.archivedAt = wasArchived ? null : Date.now();
    project.updatedAt = Date.now();
    try {
      await IDB.putProject({
        pid: project.pid,
        name: project.name,
        slug: project.slug || '',
        description: project.description || '',
        iconUrl: project.iconUrl || null,
        createdAt: project.createdAt || Date.now(),
        updatedAt: Date.now(),
        archived: project.archived,
        archivedAt: project.archivedAt,
      });
      toast(wasArchived ? 'Unarchived' : 'Archived', 'success', 1200);
      await loadProjects();
    } catch (err) {
      toast('Could not update', 'error');
    }
  }

  // ═══════════════════════════════════════════════════════════
  // LOAD PROJECTS
  // ═══════════════════════════════════════════════════════════

  async function loadProjects() {
    renderSkeletons();

    let local = [];
    try { local = await IDB.listProjects(); } catch {}

    let serverMap = new Map();
    if (S.session && S.online) {
      try {
        const res = await apiFetch(API_HOST + '?action=projects/list');
        if (res.ok && res.data?.success) {
          const serverProjects = res.data.projects || [];
          serverMap = new Map(serverProjects.map(p => [p.pid, p]));
          await hydrateProjectsFromServer(serverProjects);
          local = await IDB.listProjects();
          S.lastSyncedAt = Date.now();
        } else if (res.status === 401) {
          S.session = null;
          try { localStorage.removeItem(STORAGE.session); } catch {}
        }
      } catch {}
    }

    S.projects = local.map(lp => {
      const server = serverMap.get(lp.pid);
      return {
        ...(server || {}),
        ...lp,
        _serverData: server || null,
      };
    });

    if (S.user && S.user.settings && typeof S.user.settings.globalLimit === 'number') {
      S.storageLimit = S.user.settings.globalLimit;
    }
    if (navigator.storage && navigator.storage.estimate) {
      try { S.storageEstimate = await navigator.storage.estimate(); } catch {}
    }
    try {
      const ac = localStorage.getItem(STORAGE.autoClean);
      S.autoCleanEnabled = ac === null ? true : ac === 'true';
    } catch {}

    const serverBacked = S.projects.filter(p => p._serverData);
    if (serverBacked.length > 0) {
      await loadDeploymentHistoriesFor(serverBacked);
      computeExpiredDeployments();
    }

    if (S.autoCleanEnabled && S.expiredDeployments.length > 0 && S.online) {
      setTimeout(() => autoCleanExpired(), 1200);
    }

    updateHeaderCount();
    renderStorageSummary();
    applyFiltersAndRender();
  }

  async function loadDeploymentHistoriesFor(projects) {
    const queue = projects.slice();
    const workers = [];
    async function worker() {
      while (queue.length) {
        const p = queue.shift();
        try {
          const res = await apiFetch(API_HOST + '?action=deployment/history&pid=' + encodeURIComponent(p.pid));
          if (res.ok && res.data?.success) {
            S.deploymentCache.set(p.pid, {
              deployments: res.data.deployments || [],
              currentId: res.data.currentDeploymentId || null,
            });
          }
        } catch {}
      }
    }
    for (let i = 0; i < 4; i++) workers.push(worker());
    await Promise.all(workers);
  }

  function computeExpiredDeployments() {
    S.expiredDeployments = [];
    const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
    const now = Date.now();
    for (const [pid, cache] of S.deploymentCache.entries()) {
      for (const d of cache.deployments) {
        if (d.id === cache.currentId) continue;
        if (!d.deployedAt) continue;
        if (now - d.deployedAt < THIRTY_DAYS) continue;
        S.expiredDeployments.push({ pid, deploymentId: d.id, deployedAt: d.deployedAt });
      }
    }
  }

  async function autoCleanExpired() {
    if (S.expiredDeployments.length === 0) return;
    const count = S.expiredDeployments.length;
    try {
      for (const d of S.expiredDeployments) {
        await apiFetch(API_HOST + '?action=deployment/delete', {
          method: 'POST', body: JSON.stringify({ pid: d.pid, deploymentId: d.deploymentId }),
        });
      }
      S.expiredDeployments = [];
      toast(`Auto-cleaned ${count} expired deployment${count === 1 ? '' : 's'}`, 'success', 2600);
      updateHeaderCount();
      applyFiltersAndRender();
    } catch {}
  }

  // ═══════════════════════════════════════════════════════════
  // STORAGE SUMMARY
  // ═══════════════════════════════════════════════════════════

  function renderStorageSummary() {
    let totalUsed = 0;
    for (const p of S.projects) {
      totalUsed += p.storageUsed || 0;
    }
    const limit = S.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT;
    const pct = Math.min(100, (totalUsed / limit) * 100);
    const barCls = pct > 90 ? 'danger' : pct > 70 ? 'warn' : '';

    const barFill = $('storageBarFill');
    const amount = $('storageAmount');
    const pctEl = $('storagePct');

    if (barFill) {
      barFill.style.width = pct + '%';
      barFill.className = 'storage-summary-bar-fill ' + barCls;
    }
    if (amount) amount.textContent = `${formatBytes(totalUsed)} / ${formatBytes(limit)}`;
    if (pctEl) pctEl.textContent = `${Math.round(pct)}%`;
  }

  // ═══════════════════════════════════════════════════════════
  // NOTIFICATIONS
  // ═══════════════════════════════════════════════════════════

  async function loadNotificationStats() {
    if (!S.session || !S.online) return;
    try {
      const res = await apiFetch(API_NOTIFY + '?action=stats');
      if (res.ok && res.data?.success && res.data.stats) {
        S.notifStats = res.data.stats;
        updateBell(S.notifStats.unread || 0);
        renderNotifBanner();
      }
    } catch {}
  }

  function updateBell(count) {
    const bell = $('bellBtn');
    const badge = $('bellBadge');
    if (!bell || !badge) return;
    bell.style.display = S.session ? '' : 'none';
    if (count > 0) {
      badge.textContent = count > 99 ? '99+' : String(count);
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  function renderNotifBanner() {
    const mount = $('notifBannerMount');
    if (!mount) return;
    if (!S.session || !S.notifStats) { mount.innerHTML = ''; return; }
    const unread = S.notifStats.unread || 0;
    const inviteCount = S.notifStats.invite || 0;
    if (unread === 0 && inviteCount === 0) { mount.innerHTML = ''; return; }

    let text = '';
    if (inviteCount > 0 && unread > 0) text = `${unread} new notification${unread === 1 ? '' : 's'} including ${inviteCount} invite${inviteCount === 1 ? '' : 's'}`;
    else if (inviteCount > 0) text = `You have ${inviteCount} new invite${inviteCount === 1 ? '' : 's'}`;
    else text = `${unread} new notification${unread === 1 ? '' : 's'}`;

    mount.innerHTML = `
      <div class="notif-banner">
        ${svg('bell', 14, 2.2)}
        <div class="nb-text"><strong>${escapeHTML(text)}</strong></div>
        <a href="/notifications" class="nb-link">View</a>
      </div>
    `;
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER: HEADER + STORAGE + TABS
  // ═══════════════════════════════════════════════════════════

  function getCountForTab(tabId) { return S.projects.filter(p => matchesTab(p, tabId)).length; }

  function renderTabs() {
    const tabsEl = $('tabsBar');
    const inviteCount = (S.notifStats?.invite || 0);
    tabsEl.innerHTML = TABS.map(t => {
      const count = getCountForTab(t.id);
      const showNotifBadge = t.id === 'shared' && inviteCount > 0;
      return `
        <button class="tab ${t.id === S.activeTab ? 'active' : ''}" data-tab="${escapeAttr(t.id)}" type="button">
          <span>${escapeHTML(t.label)}</span>
          <span class="tab-count">${count}</span>
          ${showNotifBadge ? `<span class="tab-badge-notif">${inviteCount}</span>` : ''}
        </button>
      `;
    }).join('');
    tabsEl.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
  }

  function updateHeaderCount() {
    const count = S.projects.length;
    $('pageCount').textContent = `${count} project${count === 1 ? '' : 's'}`;
    const badge = $('filterBadge');
    const badgeCount = S.activeFilters.size + (S.searchQuery ? 1 : 0) + (S.sortId !== 'modified' ? 1 : 0);
    if (badgeCount > 0) {
      badge.textContent = String(badgeCount);
      badge.classList.remove('hidden');
      $('filterBtn').classList.add('filter-active');
    } else {
      badge.classList.add('hidden');
      $('filterBtn').classList.remove('filter-active');
    }
    $('sortLabel').textContent = SORTS.find(s => s.id === S.sortId)?.label || 'Modified';
  }

  // ═══════════════════════════════════════════════════════════
  // ACTIVE FILTERS
  // ═══════════════════════════════════════════════════════════

  function renderActiveFilters() {
    const el = $('activeFilters');
    const chips = [];

    S.activeFilters.forEach(f => {
      chips.push(`
        <div class="filter-chip">
          <span>${escapeHTML(FILTER_LABELS[f] || f)}</span>
          <button data-remove-filter="${escapeAttr(f)}" type="button" aria-label="Remove">${svg('x', 9, 2.4)}</button>
        </div>
      `);
    });

    if (S.searchQuery) {
      chips.push(`
        <div class="filter-chip">
          <span>"${escapeHTML(S.searchQuery)}"</span>
          <button data-remove-search type="button" aria-label="Remove search">${svg('x', 9, 2.4)}</button>
        </div>
      `);
    }

    if (chips.length === 0) { el.classList.remove('visible'); el.innerHTML = ''; return; }

    el.innerHTML = chips.join('') + `<button class="clear-filters-btn" id="clearAllFilters" type="button">Clear all</button>`;
    el.classList.add('visible');

    el.querySelectorAll('[data-remove-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        S.activeFilters.delete(btn.dataset.removeFilter);
        renderActiveFilters();
        applyFiltersAndRender();
      });
    });
    el.querySelector('[data-remove-search]')?.addEventListener('click', () => {
      S.searchQuery = '';
      $('searchInput').value = '';
      $('searchClear').classList.remove('visible');
      renderActiveFilters();
      applyFiltersAndRender();
    });
    $('clearAllFilters')?.addEventListener('click', () => {
      S.activeFilters.clear();
      S.searchQuery = '';
      $('searchInput').value = '';
      $('searchClear').classList.remove('visible');
      renderActiveFilters();
      applyFiltersAndRender();
    });
  }

  // ═══════════════════════════════════════════════════════════
  // FILTERING
  // ═══════════════════════════════════════════════════════════

  function matchesTab(p, tabId) {
    if (tabId === 'archived') return p.archived === true;
    if (p.archived) return false;
    if (tabId === 'all') return true;
    if (tabId === 'pinned') return S.pinnedProjects.has(p.pid);
    if (tabId === 'owned') return p.myRole === 'owner';
    if (tabId === 'shared') return p.myRole && p.myRole !== 'owner';
    if (tabId === 'public') return p.visibility?.profile === 'public';
    return true;
  }

  function matchesFilters(p) {
    if (S.activeFilters.size === 0) return true;
    for (const f of S.activeFilters) {
      if (f === 'deployed' && !p.deployment?.url) return false;
      if (f === 'notDeployed' && p.deployment?.url) return false;
      if (f === 'neverDeployed' && p.deployment?.url) return false;
      if (f === 'expired') {
        const hasExpired = S.expiredDeployments.some(d => d.pid === p.pid);
        if (!hasExpired) return false;
      }
      if (f === 'editor' && p.myRole !== 'editor') return false;
      if (f === 'viewer' && p.myRole !== 'viewer') return false;
      if (f === 'commenter' && p.myRole !== 'commenter') return false;
      if (f === 'storageWarning') {
        const limit = p.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT;
        const pct = (p.storageUsed || 0) / limit * 100;
        if (pct < 70) return false;
      }
      if (f === 'recentlyEdited') {
        const sevenDays = 7 * 24 * 60 * 60 * 1000;
        if (!p.updatedAt || Date.now() - p.updatedAt > sevenDays) return false;
      }
    }
    return true;
  }

  function matchesSearch(p) {
    if (!S.searchQuery) return true;
    const q = S.searchQuery.toLowerCase();
    const haystack = [p.name, p.slug, p.description, ...Object.keys(p.languages?.breakdown || {})]
      .filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
  }

  function applyFiltersAndRender() {
    let list = S.projects.filter(p => matchesTab(p, S.activeTab) && matchesFilters(p) && matchesSearch(p));
    const sorter = SORTS.find(s => s.id === S.sortId) || SORTS[0];
    list.sort(sorter.fn);

    // Pinned first
    list.sort((a, b) => {
      const aPin = S.pinnedProjects.has(a.pid) ? 1 : 0;
      const bPin = S.pinnedProjects.has(b.pid) ? 1 : 0;
      if (aPin !== bPin) return bPin - aPin;
      return 0;
    });

    S.filtered = list;
    renderProjects();
    updateHeaderCount();
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER: SKELETONS + PROJECT CARDS
  // ═══════════════════════════════════════════════════════════

  function renderSkeletons() {
    const container = $('projectsContainer');
    container.innerHTML = Array.from({ length: 6 }, () => `
      <div class="skeleton-card">
        <div class="skeleton-card-row">
          <div class="skeleton skeleton-icon"></div>
          <div style="flex:1;">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-sub"></div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderProjects() {
    const container = $('projectsContainer');
    if (S.filtered.length === 0) {
      container.innerHTML = renderEmptyState();
      bindEmptyStateActions();
      return;
    }
    container.innerHTML = S.filtered.map(p => renderProjectCard(p)).join('');
    bindProjectCardEvents();
  }

  function renderEmptyState() {
    if (S.projects.length === 0) {
      return `
        <div class="empty-state">
          <div class="empty-icon">${svg('folder', 22, 2)}</div>
          <div class="empty-title">No projects yet</div>
          <div class="empty-desc">Create your first project to get started.</div>
          <div class="empty-actions">
            <button class="btn btn-primary" data-empty-new>${svg('plus', 12, 2.4)} New project</button>
          </div>
        </div>
      `;
    }
    if (S.activeTab === 'shared') {
      return `<div class="empty-state"><div class="empty-icon">${svg('users', 22, 2)}</div>
        <div class="empty-title">No shared projects</div>
        <div class="empty-desc">When someone invites you, it will appear here.</div></div>`;
    }
    if (S.activeTab === 'pinned') {
      return `<div class="empty-state"><div class="empty-icon">${svg('bookmark', 22, 2)}</div>
        <div class="empty-title">No pinned projects</div>
        <div class="empty-desc">Tap the star icon on a project to pin it here.</div></div>`;
    }
    if (S.activeTab === 'archived') {
      return `<div class="empty-state"><div class="empty-icon">${svg('archive', 22, 2)}</div>
        <div class="empty-title">No archived projects</div>
        <div class="empty-desc">Archived projects will appear here.</div></div>`;
    }
    if (S.activeTab === 'owned') {
      return `<div class="empty-state"><div class="empty-icon">${svg('folder', 22, 2)}</div>
        <div class="empty-title">You don't own any projects</div>
        <div class="empty-actions">
          <button class="btn btn-primary" data-empty-new>${svg('plus', 12, 2.4)} New project</button>
        </div></div>`;

      return `<div class="empty-state"><div class="empty-icon">${svg('eye', 22, 2)}</div>
        <div class="empty-title">No public projects</div>
        <div class="empty-desc">Make a project public to list it here.</div></div>`;
    }

      <div class="empty-title">No projects match</div>
      <div class="empty-actions"><button class="btn btn-secondary" data-empty-clear-filters>Clear filters</button></div></div>`;
  }

  function bindEmptyStateActions() {
    document.querySelector('[data-empty-new]')?.addEventListener('click', openCreateFlow);
    document.querySelector('[data-empty-clear-filters]')?.addEventListener('click', () => {
      S.activeFilters.clear(); S.searchQuery = '';
      $('searchInput').value = ''; $('searchClear').classList.remove('visible');
      renderActiveFilters(); applyFiltersAndRender();
    });
  }

  function renderProjectCard(p) {
    const isExpanded = S.expandedProjects.has(p.pid);
    const isPinned = S.pinnedProjects.has(p.pid);

    const iconHTML = p.iconUrl
      ? `<img src="${escapeAttr(p.iconUrl)}" alt="">`
      : `<span style="background:${getAvatarColor(p.name)};color:#0a0c10;">${escapeHTML(getInitials(p.name))}</span>`;

    const roleBadge = p.myRole === 'owner'
      ? '<span class="role-badge owner">Owner</span>'
      : p.myRole === 'editor'
        ? '<span class="role-badge editor">Editor</span>'
        : p.myRole ? `<span class="role-badge">${escapeHTML(p.myRole)}</span>` : '';

    const deployState = p.deployment?.url
      ? '<span class="live-badge live"><span class="dot"></span>Live</span>'
      : p.deployment?.state === 'OFFLINE'
        ? '<span class="live-badge offline"><span class="dot"></span>Offline</span>'
        : '';

    const lastDeployText = p.deployment?.deployedAt
      ? `Deployed ${timeAgo(p.deployment.deployedAt)}`
      : 'Never deployed';

    const langBadges = p.languages?.breakdown
      ? Object.entries(p.languages.breakdown).slice(0, 3).map(([name, pct]) =>
          `<span class="lang-badge"><span class="lang-dot"></span>${escapeHTML(name)} ${pct}%</span>`
        ).join('')
      : '';

    const storageUsed = p.storageUsed || 0;
    const storageLimit = p.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT;
    const storagePct = Math.min(100, (storageUsed / storageLimit) * 100);
    const storageCls = storagePct > 90 ? 'danger' : storagePct > 70 ? 'warn' : '';

    const hasExpired = S.expiredDeployments.some(d => d.pid === p.pid);
    const storageWarn = storagePct > 70;

    // Stats row (always visible)
    const statsRow = `
      <div class="project-stats-row">
        <span class="project-stat-item ${storageWarn ? 'project-stat-warn' : ''}">
          ${svg('database', 9, 2.2)}
          ${formatBytes(storageUsed)}
        </span>
        <span class="project-stat-item">
          ${svg('eye', 9, 2.2)}
          ${formatNumber(p.viewCount || 0)}
        </span>
        <span class="project-stat-item">
          ${svg('clock', 9, 2.2)}
          ${timeAgo(p.updatedAt)}
        </span>
        ${hasExpired ? `<span class="project-stat-item project-stat-warn">${svg('alertTriangle', 9, 2.4)} expired</span>` : ''}
      </div>
    `;

    // Expanded detail
    const detail = isExpanded ? `
      <div class="project-card-detail">
        ${p.description ? `<div class="detail-desc">${escapeHTML(p.description)}</div>` : `<div class="detail-desc empty">No description</div>`}

        ${langBadges ? `<div class="lang-badges">${langBadges}</div>` : ''}

        <div class="detail-storage">
          <div class="detail-storage-header">
            <span>Storage</span>
            <span>${formatBytes(storageUsed)} / ${formatBytes(storageLimit)}</span>
          </div>
          <div class="detail-storage-bar">
            <div class="detail-storage-fill ${storageCls}" style="width:${storagePct}%"></div>
          </div>
        </div>

        ${hasExpired ? `
          <div class="detail-warning">
            ${svg('alertTriangle', 11, 2.4)}
            <span>Some deployments are expired. Clean them to free space.</span>
          </div>
        ` : ''}

        ${storagePct > 90 ? `
          <div class="detail-warning danger">
            ${svg('alert', 11, 2.4)}
            <span>Storage nearly full — delete files to avoid issues.</span>
          </div>
        ` : ''}

        <div style="font-size:10px;color:var(--theme-text-tertiary);line-height:1.4;">
          ${escapeHTML(lastDeployText)} · ${p.slug ? '@' + escapeHTML(p.slug) : escapeHTML(p.pid.slice(-8))}
        </div>

        <div class="detail-actions">
          <button class="detail-action-btn primary" data-card-action="editor" data-pid="${escapeAttr(p.pid)}" type="button">
            ${svg('edit3', 16, 2.2)}
            <span class="label">Editor</span>
          </button>
          <button class="detail-action-btn" data-card-action="view" data-pid="${escapeAttr(p.pid)}" type="button">
            ${svg('dashboard', 16, 2.2)}
            <span class="label">View</span>
          </button>
          <button class="detail-action-btn danger" data-card-action="delete" data-pid="${escapeAttr(p.pid)}" type="button">
            ${svg('trash', 16, 2.2)}
            <span class="label">Delete</span>
          </button>
        </div>
      </div>
    ` : '';

    return `
      <div class="project-card${isExpanded ? ' expanded' : ''}" data-pid="${escapeAttr(p.pid)}">
        <div class="project-card-row" data-card-expand="${escapeAttr(p.pid)}">
          <div class="project-icon">${iconHTML}</div>
          <div class="project-header-info">
            <div class="project-name-row">
              ${isPinned ? `<span class="project-pin-icon">${svg('bookmark', 10, 2.4)}</span>` : ''}
              <div class="project-name">${escapeHTML(p.name || 'Untitled project')}</div>
            </div>
            <div class="project-meta">
              ${roleBadge}${deployState}
              <span class="sep">·</span>
              <span>${escapeHTML(lastDeployText)}</span>
            </div>
          </div>
          <button class="project-expand-btn" data-card-expand="${escapeAttr(p.pid)}" type="button" aria-label="Expand details" aria-expanded="${isExpanded}">
            ${svg('chevron-down', 14, 2.4)}
          </button>
        </div>
        ${statsRow}
        ${detail}
      </div>
    `;
  }

  function bindProjectCardEvents() {
    // Expand toggle
    document.querySelectorAll('[data-card-expand]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const pid = btn.dataset.cardExpand;
        if (S.expandedProjects.has(pid)) S.expandedProjects.delete(pid);
        else S.expandedProjects.add(pid);
        // Update DOM in place
        const card = document.querySelector(`.project-card[data-pid="${pid}"]`);
        if (card) {
          const p = S.filtered.find(x => x.pid === pid);
          if (p) card.outerHTML = renderProjectCard(p);
          bindProjectCardEvents();
        }
      });
    });

    // Detail action buttons
    document.querySelectorAll('[data-card-action]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const pid = btn.dataset.pid;
        const action = btn.dataset.cardAction;
        const p = S.projects.find(x => x.pid === pid);
        if (!p) return;
        if (action === 'editor') goEditor(pid);
        else if (action === 'view') goDashboard(pid);
        else if (action === 'delete') openDeleteProjectModal(p);
      });
    });

    // Prevent row click from doing anything besides expand
    document.querySelectorAll('.project-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('[data-card-expand]') || e.target.closest('[data-card-action]')) return;
        // Clicking elsewhere on card also expands
        const pid = card.dataset.pid;
        if (S.expandedProjects.has(pid)) S.expandedProjects.delete(pid);
        else S.expandedProjects.add(pid);
        const p = S.filtered.find(x => x.pid === pid);
        if (p) {
          card.outerHTML = renderProjectCard(p);
          bindProjectCardEvents();
        }
      });
    });
  }

  // ═══════════════════════════════════════════════════════════
  // DELETE PROJECT (typed confirm)
  // ═══════════════════════════════════════════════════════════

  function openDeleteProjectModal(p) {
    openModal(`
      <div class="delete-danger-icon">
        ${svg('trash', 22, 2.4)}
      </div>
      <div class="modal-title" style="text-align:center;">Delete project?</div>
      <div class="modal-desc" style="text-align:center;">
        This deletes all files, versions, and data. Cannot be undone.
      </div>
      <div class="field" style="margin-bottom:0;">
        <label class="field-label">Type "${escapeHTML(p.name || 'Untitled project')}" to confirm</label>
        <input class="delete-confirm-input" id="deleteConfirmInput" type="text" placeholder="Project name" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-modal-close>Cancel</button>
        <button class="btn btn-danger" id="deleteConfirmBtn" disabled>Delete project</button>
      </div>
    `);

    const input = $('deleteConfirmInput');
    const confirmBtn = $('deleteConfirmBtn');
    input.addEventListener('input', () => {
      const matched = input.value === p.name;
      confirmBtn.disabled = !matched;
      input.classList.toggle('matched', matched);
    });
    setTimeout(() => input.focus(), 100);

    confirmBtn.addEventListener('click', async () => {
      showLoading('Deleting', 'Removing project and all data…');
      try {
        if (S.session && S.online && p._serverData) {
          const res = await apiFetch(API_HOST + '?action=projects/delete', {
            method: 'POST', body: JSON.stringify({ pid: p.pid }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        await IDB.deleteProject(p.pid);
        hideLoading();
        closeModal();
        toast('Project deleted', 'success');
        S.projects = S.projects.filter(proj => proj.pid !== p.pid);
        applyFiltersAndRender();
      } catch (err) {
        hideLoading();
        toast(err.message || 'Delete failed', 'error');
      }
    });
  }

  // ACTION MENU

  function openActionMenu(p) {
    S.activeMenuProject = p;
    const isOwner = p.myRole === 'owner';
    const isArchived = !!p.archived;
    const hasExpired = S.expiredDeployments.some(d => d.pid === p.pid);
    const expiredCount = S.expiredDeployments.filter(d => d.pid === p.pid).length;
    const shareUrl = p.visibility?.profile === 'public'
      ? `${location.origin}/${S.user?.profile?.username || S.user?.username || ''}/${p.slug || ''}`
      : null;
    const iconHTML = p.iconUrl
      ? `<img src="${escapeAttr(p.iconUrl)}" alt="">`
      : `<span>${escapeHTML(getInitials(p.name))}</span>`;
    const iconBg = p.iconUrl ? '' : `background:${getAvatarColor(p.name)};color:#0a0c10;`;

    const sheet = $('actionSheet');
    sheet.innerHTML = `
      <div class="action-sheet-header">
        <div class="action-sheet-icon" style="${iconBg}">${iconHTML}</div>
        <div class="action-sheet-title">
          <div class="action-sheet-name">${escapeHTML(p.name || 'Untitled project')}</div>
          <div class="action-sheet-meta">${escapeHTML(p.myRole || 'local')} · ${p.deployment?.url ? 'Live' : 'Local'}</div>
        </div>
      </div>
      <div class="action-list">
        <button class="action-item" data-action="dashboard">${svg('dashboard', 14, 2.2)}<span>Open dashboard</span></button>
        <button class="action-item" data-action="editor">${svg('edit3', 14, 2.2)}<span>Open in editor</span></button>
        ${p.deployment?.url ? `<button class="action-item" data-action="openLive">${svg('external', 14, 2.2)}<span>Open live site</span></button>` : ''}
        ${p.deployment?.url ? `<button class="action-item" data-action="copyLive">${svg('copy', 14, 2.2)}<span>Copy live URL</span></button>` : ''}
        ${shareUrl ? `<button class="action-item" data-action="share">${svg('share', 14, 2.2)}<span>Copy share link</span></button>` : ''}
        <div class="action-divider"></div>
        <button class="action-item" data-action="download">${svg('download', 14, 2.2)}<span>Download .folio</span></button>
        <button class="action-item" data-action="duplicate">${svg('copy', 14, 2.2)}<span>Duplicate</span></button>
        <button class="action-item" data-action="pin">${svg('bookmark', 14, 2.2)}<span>${S.pinnedProjects.has(p.pid) ? 'Unpin' : 'Pin'}</span></button>
        ${isOwner ? `<button class="action-item" data-action="rename">${svg('edit', 14, 2.2)}<span>Rename</span></button>` : ''}
        <button class="action-item" data-action="archive">${svg(isArchived ? 'unlock' : 'archive', 14, 2.2)}<span>${isArchived ? 'Unarchive' : 'Archive'}</span></button>
        ${hasExpired ? `<button class="action-item" data-action="cleanExpired">${svg('alertTriangle', 14, 2.2)}<span>Clean ${expiredCount} expired deploy${expiredCount === 1 ? '' : 's'}</span></button>` : ''}
        <div class="action-divider"></div>
        <button class="action-item danger" data-action="delete">${svg('trash', 14, 2.2)}<span>Delete project</span></button>
      </div>
    `;

    sheet.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => handleAction(btn.dataset.action, p));
    });
    $('actionMenu').classList.add('active');
  }

  function closeActionMenu() {
    $('actionMenu').classList.remove('active');
    S.activeMenuProject = null;
  }

  function handleAction(action, p) {
    closeActionMenu();
    switch (action) {
      case 'editor': goEditor(p.pid); break;
      case 'dashboard': goDashboard(p.pid); break;
      case 'openLive': if (p.deployment?.url) window.open(p.deployment.url, '_blank', 'noopener'); break;
      case 'copyLive':
        if (p.deployment?.url && copyToClipboard(p.deployment.url)) toast('Live URL copied', 'success', 1200);
        else toast('Copy failed', 'error');
        break;
      case 'share': {
        const shareUrl = `${location.origin}/${S.user?.profile?.username || S.user?.username || ''}/${p.slug || ''}`;
        if (copyToClipboard(shareUrl)) toast('Link copied', 'success', 1200);
        else toast('Copy failed', 'error');
        break;
      }
      case 'download': downloadProject(p); break;
      case 'duplicate': duplicateProject(p); break;
      case 'pin':
        togglePin(p.pid);
        applyFiltersAndRender();
        break;
      case 'rename': openRenameModal(p); break;
      case 'archive': toggleArchive(p); break;
      case 'cleanExpired': cleanExpiredForProject(p); break;
      case 'delete': openDeleteProjectModal(p); break;
    }
  }

  // ═══════════════════════════════════════════════════════════
  // ACTIONS
  // ═══════════════════════════════════════════════════════════

  async function downloadProject(p) {
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    try {
      showLoading('Preparing download', 'Building .folio backup…');
      const res = await fetch(`${API_HOST}?action=project/export&pid=${encodeURIComponent(p.pid)}&format=folio`, {
        headers: { Authorization: `Bearer ${S.session}` },
      });
      hideLoading();
      if (!res.ok) throw new Error('Download failed');
      const blob = await res.blob();
      triggerDownload(blob, `${p.slug || 'project'}-${p.pid.slice(-6)}.folio`);
      toast('Downloaded', 'success');
    } catch (err) { hideLoading(); toast(err.message || 'Download failed', 'error'); }
  }

  async function duplicateProject(p) {
    if (!S.online) { toast('Requires internet', 'warning'); return; }

    openModal(`
      <div class="modal-title">Duplicate project</div>
      <div class="modal-desc">A new project will be created with a copy of the files.</div>
      <div class="field">
        <label class="field-label">New name</label>
        <input class="input" id="duplicateName" value="${escapeAttr((p.name || 'Untitled') + ' (copy)')}" maxlength="100">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-modal-close>Cancel</button>
        <button class="btn btn-primary" id="duplicateSubmit">${svg('copy', 12, 2.2)} Duplicate</button>
      </div>
    `);
    $('duplicateName').select();
    $('duplicateSubmit').addEventListener('click', async () => {
      const newName = ($('duplicateName').value || '').trim();
      if (!newName) { toast('Name required', 'error'); return; }
      const btn = $('duplicateSubmit');
      btn.disabled = true;
      btn.innerHTML = 'Duplicating…';
      try {
        const res = await apiFetch(API_HOST + '?action=project/copy', {
          method: 'POST', body: JSON.stringify({ pid: p.pid, newName }),
        });
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        closeModal();
        toast('Duplicated', 'success');
        await loadProjects();
      } catch (err) {
        toast(err.message || 'Duplicate failed', 'error');
        btn.disabled = false;
        btn.innerHTML = `${svg('copy', 12, 2.2)} Duplicate`;
      }
    });
  }

  function openRenameModal(p) {
    const oldSlug = p.slug || '';
    const newSlugPreview = (name) => (name || '').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '');

    openModal(`
      <div class="modal-title">Rename project</div>
      <div class="field">
        <label class="field-label">Project name</label>
        <input class="input" id="renameInput" value="${escapeAttr(p.name || '')}" maxlength="100">
      </div>
      <div class="field">
        <label class="field-label">Slug (auto-generated)</label>
        <input class="input mono" id="renameSlug" value="${escapeAttr(oldSlug)}" readonly>
        <div class="field-hint" id="renameSlugHint" style="margin-top:4px;font-size:10px;">This changes your share URL.</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-modal-close>Cancel</button>
        <button class="btn btn-primary" id="renameSubmit">Save</button>
      </div>
    `);

    $('renameInput').focus();
    $('renameInput').select();

    const updateSlug = () => {
      const newName = $('renameInput').value.trim();
      const slug = newSlugPreview(newName);
      $('renameSlug').value = slug;
      const hint = $('renameSlugHint');
      if (slug !== oldSlug && oldSlug) {
        hint.textContent = `Share URL will change from /${oldSlug} to /${slug}`;
        hint.style.color = 'var(--theme-warning)';
      } else {
        hint.textContent = 'This changes your share URL.';
        hint.style.color = '';
      }
    };
    $('renameInput').addEventListener('input', updateSlug);

    $('renameSubmit').addEventListener('click', async () => {
      const name = $('renameInput').value.trim();
      if (!name) { toast('Name required', 'error'); return; }
      if (name === p.name) { closeModal(); return; }
      $('renameSubmit').disabled = true;
      try {
        if (S.session && S.online && p._serverData) {
          const res = await apiFetch(API_HOST + '?action=projects/update', {
            method: 'POST', body: JSON.stringify({ pid: p.pid, name }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        p.name = name;
        p.updatedAt = Date.now();
        await IDB.putProject({
          pid: p.pid, name, slug: p.slug || '', description: p.description || '',
          createdAt: p.createdAt, updatedAt: Date.now(), iconUrl: p.iconUrl || null,
          archived: p.archived || false, archivedAt: p.archivedAt || null,
        });
        closeModal();
        toast('Renamed', 'success');
        applyFiltersAndRender();
      } catch (err) {
        toast(err.message || 'Rename failed', 'error');
        $('renameSubmit').disabled = false;
      }
    });
    $('renameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('renameSubmit').click(); });
  }

  async function cleanExpiredForProject(p) {
    const expired = S.expiredDeployments.filter(d => d.pid === p.pid);
    if (expired.length === 0) { toast('No expired deployments', 'info'); return; }
    confirmModal(
      `Delete ${expired.length} expired deployment${expired.length === 1 ? '' : 's'}?`,
      'Live URLs will stop working. Cannot be undone.', 'Delete', true,
      async () => {
        showLoading('Cleaning', `Deleting ${expired.length}…`);
        try {
          for (const d of expired) {
            await apiFetch(API_HOST + '?action=deployment/delete', {
              method: 'POST', body: JSON.stringify({ pid: d.pid, deploymentId: d.deploymentId }),
            });
          }
          S.expiredDeployments = S.expiredDeployments.filter(d => d.pid !== p.pid);
          hideLoading();
          toast(`Cleaned ${expired.length}`, 'success');
          applyFiltersAndRender();
        } catch (err) { hideLoading(); toast(err.message || 'Failed', 'error'); }
      }
    );
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

    openModal(body);

    document.querySelectorAll('[data-template]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-template]').forEach(b => b.classList.remove('active'));

      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-icon-tab]').forEach(b => b.classList.remove('active'));

        document.querySelectorAll('[data-icon-panel]').forEach(p => {
          p.classList.toggle('active', p.dataset.iconPanel === btn.dataset.iconTab);
        });
      });
    });

    generateIcons();
    $('iconShuffleBtn')?.addEventListener('click', () => {
      S.createIconVariants = [];
      generateIcons({ shuffle: true });
    });

    $('iconUploadBtn')?.addEventListener('click', () => $('iconUploadFile')?.click());
    $('iconUploadFile')?.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      if (file.size > 1024 * 1024) { toast('Image too large (max 1 MB)', 'error'); return; }
      const status = $('iconUploadStatus');
      if (status) status.textContent = 'Uploading…';
      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = reject;
          r.readAsDataURL(file);
        });
        const upRes = await fetch(API_FLIER + '?action=avatar/upload', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            dataUrl,
            username: (($('createName')?.value || 'project')).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 30) || 'project',
          }),
        });
        const data = await upRes.json();
        if (!data.success || !data.url) throw new Error(data.error || 'Upload failed');
        S.createIconUrl = data.url;
        if (status) status.textContent = 'Uploaded ✓';
        toast('Icon ready', 'success', 1200);
      } catch (err) {
        if (status) status.textContent = '';
        toast(err.message || 'Upload failed', 'error');
      }
    });

    $('createName').focus();
    $('createName').addEventListener('input', () => {
      const name = $('createName').value.trim();
      if (name && S.createIconVariants.length === 0 && !S.createIconUrl) {
        // Reset preview initials for the fallback icon
      }
    });

    $('createSubmit').addEventListener('click', () => submitCreateProject(selectedTemplate));
  }

  async function generateIcons({ shuffle = false } = {}) {
    const grid = $('iconPickerGrid');
    if (!grid) return;
    if (S.createIconVariants.length > 0 && !shuffle) {
      renderIconOptions(grid);
      return;
    }
    grid.innerHTML = Array.from({ length: 5 }, () => '<div class="icon-skeleton"></div>').join('');

    const projectName = $('createName')?.value.trim() || 'Project';
    const baseSeed = projectName.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 30) || 'project';
    const suffix = shuffle ? Math.random().toString(36).slice(2, 6) : '';

    try {
      const res = await fetch(API_FLIER + '?action=avatar/preview', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: baseSeed + suffix, displayName: projectName }),
      });
      const data = await res.json();
      if (!data.success || !Array.isArray(data.variants)) throw new Error('Failed');
      S.createIconVariants = data.variants;
      renderIconOptions(grid);
    } catch {
      grid.innerHTML = `<div class="icon-placeholder" style="grid-column:1/-1;aspect-ratio:auto;padding:14px;">Could not generate</div>`;
    }
  }

  function renderIconOptions(grid) {
    grid.innerHTML = '';
    if (S.createIconVariants.length === 0) {
      grid.innerHTML = `<div class="icon-placeholder" style="grid-column:1/-1;aspect-ratio:auto;padding:14px;">No presets. Tap Shuffle.</div>`;
      return;
    }
    S.createIconVariants.forEach(v => {
      const btn = document.createElement('button');
      btn.className = 'icon-option';
      btn.type = 'button';
      btn.innerHTML = `<img src="${escapeAttr(v.dataUrl)}" alt="">`;
      btn.addEventListener('click', () => {
        S.createIconDataUrl = v.dataUrl;
        grid.querySelectorAll('.icon-option').forEach(o => o.classList.remove('selected'));
        btn.classList.add('selected');
      });
      grid.appendChild(btn);
    });
  }

  async function submitCreateProject(template) {
    const name = ($('createName').value || '').trim();
    const description = ($('createDesc').value || '').trim();
    if (!name) { toast('Project name required', 'error'); return; }

    showLoading('Creating project', 'Setting up…');
    try {
      const iconUrl = S.createIconUrl || null;
      let pid;

      if (S.session && S.online) {
        const body = { name, description };
        if (iconUrl) body.iconUrl = iconUrl;
        const res = await apiFetch(API_HOST + '?action=projects/create', {
          method: 'POST', body: JSON.stringify(body),
        });
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Create failed');
        pid = res.data.pid;
      } else {
        pid = `local_${Date.now()}`;
      }

      const slug = name.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '') || 'project';
      await IDB.putProject({
        pid, name, slug, description, iconUrl,
        createdAt: Date.now(), updatedAt: Date.now(),
        archived: false,
      });

      // Template seed files
      const seedFiles = getTemplateSeedFiles(template, name);
      for (const [path, content] of Object.entries(seedFiles)) {
        await IDB.putFile(pid, path, content);
      }

      if (!S.isGuest && S.online) {
        try {
          await apiFetch(API_HOST + '?action=project/sync-back', {
            method: 'POST',
            body: JSON.stringify({ pid, files: seedFiles }),
          });
        } catch {}
      }

      hideLoading();
      closeModal();
      showCelebration(pid, name);
    } catch (err) {
      hideLoading();
      toast(err.message || 'Create failed', 'error');
    }
  }

  function openFiltersOverlay() {
    renderFiltersBody();
    $('filtersOverlay').classList.add('active');
  }
  function closeFiltersOverlay() { $('filtersOverlay').classList.remove('active'); }

  function renderFiltersBody() {
    const body = $('filtersBody');
    const subtitle = $('filtersSubtitle');
    const tab = TABS.find(t => t.id === S.activeTab);
    if (subtitle) subtitle.textContent = `${tab?.label || 'All'} · ${S.filtered.length} visible`;

    const stats = computeStats();
    const expiredCount = S.expiredDeployments.length;
    const filterPills = FILTERS_BY_TAB[S.activeTab] || [];
    const pillsHTML = filterPills.length > 0 ? `
      <div class="filter-section">
        <div class="filter-label">Filters</div>
        <div class="filter-pills">
          ${filterPills.map(f => `<button class="filter-pill ${S.activeFilters.has(f) ? 'active' : ''}" data-filter="${escapeAttr(f)}" type="button">${escapeHTML(FILTER_LABELS[f])}</button>`).join('')}
        </div>
      </div>
    ` : '';

    const storagePct = S.storageLimit > 0 ? Math.min(100, (stats.totalStorage / S.storageLimit) * 100) : 0;
    const storageClass = storagePct > 90 ? 'danger' : storagePct > 70 ? 'warn' : '';

    body.innerHTML = `
      ${pillsHTML}
      <div class="filter-section">
        <div class="filter-label">Overview</div>
        <div class="stats-grid">
          <div class="stat-tile"><div class="stat-label">Total</div><div class="stat-value">${S.projects.length}</div></div>
          <div class="stat-tile"><div class="stat-label">Public</div><div class="stat-value">${stats.publicCount}</div></div>
          <div class="stat-tile"><div class="stat-label">Deployed</div><div class="stat-value">${stats.deployedCount}</div></div>
          <div class="stat-tile"><div class="stat-label">Expired</div><div class="stat-value ${expiredCount > 0 ? 'warn' : ''}">${expiredCount}</div></div>
        </div>
      </div>
      <div class="storage-block">
        <div class="storage-header">
          <div class="storage-title">Storage</div>
          <div class="storage-amount">${formatBytes(stats.totalStorage)} / ${formatBytes(S.storageLimit)}</div>
        </div>
        <div class="storage-bar"><div class="storage-bar-fill ${storageClass}" style="width:${storagePct}%"></div></div>
        <div class="storage-note">${storagePct > 90 ? '⚠ Storage nearly full.' : storagePct > 70 ? 'Storage is getting full.' : 'Plenty of space remaining.'}</div>
      </div>
      ${expiredCount > 0 ? `
        <div class="cleanup-block">
          <div class="cleanup-header">${svg('alertTriangle', 13, 2.2)}<div class="cleanup-title">${expiredCount} expired deploy${expiredCount === 1 ? '' : 's'}</div></div>
          <div class="cleanup-desc">Older than 30 days. Safe to delete.</div>
          <button class="btn btn-secondary btn-sm" id="btnCleanAll" type="button" style="width:100%;">${svg('trash', 10, 2.2)} Clean up all expired</button>
        </div>
      ` : ''}
      <div class="toggle-row">
        <div class="toggle-info">
          <div class="toggle-title">Auto-clean expired deployments</div>
          <div class="toggle-desc">Silently remove deployments older than 30 days.</div>
        </div>
        <button class="switch ${S.autoCleanEnabled ? 'on' : ''}" id="autoCleanSwitch" type="button" aria-label="Toggle auto-clean"></button>
      </div>
      <div class="filter-section">
        <div class="filter-label">Sort by</div>
        <div class="filter-pills">
          ${SORTS.map(s => `<button class="filter-pill ${S.sortId === s.id ? 'active' : ''}" data-sort="${escapeAttr(s.id)}" type="button">${escapeHTML(s.label)}</button>`).join('')}
        </div>
      </div>
    `;

    body.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        const f = btn.dataset.filter;
        if (S.activeFilters.has(f)) S.activeFilters.delete(f);
        else S.activeFilters.add(f);
        renderFiltersBody();
        renderActiveFilters();
        applyFiltersAndRender();
      });
    });
    body.querySelectorAll('[data-sort]').forEach(btn => {
      btn.addEventListener('click', () => {
        S.sortId = btn.dataset.sort;
        renderFiltersBody();
        applyFiltersAndRender();
      });
    });
    $('autoCleanSwitch')?.addEventListener('click', () => {
      S.autoCleanEnabled = !S.autoCleanEnabled;
      try { localStorage.setItem(STORAGE.autoClean, String(S.autoCleanEnabled)); } catch {}
      $('autoCleanSwitch').classList.toggle('on', S.autoCleanEnabled);
      toast(S.autoCleanEnabled ? 'Auto-clean on' : 'Auto-clean off', 'info', 1200);
    });
    $('btnCleanAll')?.addEventListener('click', cleanAllExpired);
  }

  function computeStats() {
    let publicCount = 0, deployedCount = 0, totalStorage = 0;
    for (const p of S.projects) {
      if (p.visibility?.profile === 'public') publicCount++;
      if (p.deployment?.url) deployedCount++;
      totalStorage += p.storageUsed || 0;
    }
    return { publicCount, deployedCount, totalStorage };
  }

  function cleanAllExpired() {
    const count = S.expiredDeployments.length;
    if (count === 0) return;
    confirmModal(`Delete ${count} expired deployment${count === 1 ? '' : 's'}?`, 'Live URLs will stop working. Cannot be undone.', 'Delete all', true, async () => {
      showLoading('Cleaning', `Deleting ${count}…`);
      try {
        for (const d of [...S.expiredDeployments]) {
          await apiFetch(API_HOST + '?action=deployment/delete', {
            method: 'POST', body: JSON.stringify({ pid: d.pid, deploymentId: d.deploymentId }),
          });
        }
        S.expiredDeployments = [];
        hideLoading();
        closeFiltersOverlay();
        toast(`Cleaned ${count}`, 'success');
        applyFiltersAndRender();
      } catch (err) { hideLoading(); toast(err.message || 'Failed', 'error'); }
    });
  }

  function wireSearch() {
    const input = $('searchInput');
    const clear = $('searchClear');
    const doSearch = debounce(() => {
      S.searchQuery = input.value.trim();
      renderActiveFilters();
      applyFiltersAndRender();
    }, 300);
    input.addEventListener('input', () => {
      clear.classList.toggle('visible', input.value.length > 0);
      doSearch();
    });
    clear.addEventListener('click', () => {
      input.value = ''; clear.classList.remove('visible');
      S.searchQuery = '';
      renderActiveFilters();
      applyFiltersAndRender();
    });
  }

    if (!q) return;
    S.recentSearches = [q, ...S.recentSearches.filter(x => x !== q)].slice(0, 5);

        $('searchClear').classList.add('visible');
        renderActiveFilters();
        applyFiltersAndRender();
        $('searchOverlay').classList.remove('active');
      });
    });
  }

  // ═══════════════════════════════════════════════════════════
  // WIRING
  // ═══════════════════════════════════════════════════════════

  function wireGlobalEvents() {
    $('modalOverlay').addEventListener('click', (e) => {
      if (e.target === $('modalOverlay')) closeModal();
    });
    document.addEventListener('click', (e) => {
      if (e.target.matches('[data-modal-close]')) closeModal();
    });
    $('actionMenu').addEventListener('click', (e) => {
      if (e.target === $('actionMenu')) closeActionMenu();
    });
    $('filterBtn').addEventListener('click', openFiltersOverlay);
    $('filtersClose').addEventListener('click', closeFiltersOverlay);
    $('filtersApply').addEventListener('click', closeFiltersOverlay);
    $('filtersClearAll').addEventListener('click', () => {
      S.activeFilters.clear(); S.searchQuery = '';
      $('searchInput').value = ''; $('searchClear').classList.remove('visible');
      renderActiveFilters(); applyFiltersAndRender(); renderFiltersBody();
    });
    $('filtersOverlay').addEventListener('click', (e) => {
      if (e.target === $('filtersOverlay')) closeFiltersOverlay();
    });
    $('newBtn').addEventListener('click', openCreateFlow);

    $('searchTrigger')?.addEventListener('click', () => {
      $('searchSheetInput').value = S.searchQuery;
      $('searchOverlay').classList.add('active');
      renderRecentSearches();
      setTimeout(() => $('searchSheetInput').focus(), 250);
    });
    $('searchSheetClose')?.addEventListener('click', () => {
      $('searchOverlay').classList.remove('active');
    });
    $('searchOverlay')?.addEventListener('click', (e) => {
      if (e.target === $('searchOverlay')) $('searchOverlay').classList.remove('active');
    });
    $('searchSheetInput')?.addEventListener('input', debounce((e) => {
      S.searchQuery = e.target.value.trim();
      const inline = $('searchInput');
      if (inline) inline.value = S.searchQuery;
      const clearBtn = $('searchClear');
      if (clearBtn) clearBtn.classList.toggle('visible', S.searchQuery.length > 0);
      renderActiveFilters();
      applyFiltersAndRender();
    }, 300));
    $('searchSheetInput')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveRecentSearch(S.searchQuery);
        $('searchOverlay').classList.remove('active');
      }
    });

    $('sortBtn').addEventListener('click', openFiltersOverlay);
    $('bellBtn')?.addEventListener('click', () => {
      window.open('/notifications', '_blank', 'noopener');
    });

    wireSearch();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if ($('celebration').classList.contains('active')) return;
        if ($('searchOverlay')?.classList.contains('active')) return $('searchOverlay').classList.remove('active');
        if ($('actionMenu').classList.contains('active')) return closeActionMenu();
        if ($('modalOverlay').classList.contains('active')) return closeModal();
        if ($('filtersOverlay').classList.contains('active')) return closeFiltersOverlay();
      }
    });

    const updateOnline = () => {
      S.online = navigator.onLine;
      $('offlineBanner').classList.toggle('visible', !S.online);
    };
    window.addEventListener('online', () => { updateOnline(); loadProjects(); });
    window.addEventListener('offline', updateOnline);
    updateOnline();

    window.addEventListener('hashchange', () => {
      const t = getHashTab();
      if (t && t !== S.activeTab) {
        S.activeTab = t; S.activeFilters.clear();
        renderTabs(); renderActiveFilters(); applyFiltersAndRender();
      }
    });

    // Auto-refresh every 60s if visible
    setInterval(() => {
      if (document.visibilityState === 'visible') {
        loadNotificationStats();
      }
    }, 60000);

    // Notification polling
    if (S.notifBellTimer) clearInterval(S.notifBellTimer);
    S.notifBellTimer = setInterval(() => {
      if (document.visibilityState === 'visible') loadNotificationStats();
    }, 60000);
  }

  // ═══════════════════════════════════════════════════════════
  // BOOT
  // ═══════════════════════════════════════════════════════════

  async function boot() {
    wireThemeSync();
    wireThemeMediaQuery();
    readSession();

    // Deep-link ?pid=
    if (!readUrlParams()) return;

    try { await openDB(); } catch (err) {
      console.error('[Projects] DB failed:', err);
      toast('Storage failed', 'error');
      return;
    }

    const hashTab = getHashTab();
    if (hashTab) S.activeTab = hashTab;
    else {
      try {
        const last = localStorage.getItem(STORAGE.lastTab);
        if (TABS.some(t => t.id === last)) S.activeTab = last;
      } catch {}
    }

    wireGlobalEvents();
    renderTabs();
    await loadProjects();

    // Notifications
    loadNotificationStats().catch(() => {});

    // Update sort label / search input to reflect URL state
    if (S.searchQuery) {
      $('searchInput').value = S.searchQuery;
      $('searchClear').classList.add('visible');
      renderActiveFilters();
      applyFiltersAndRender();
    }
  }

  document.addEventListener('DOMContentLoaded', boot);

  window.closeModal = closeModal;
})();
</script>

</body>
</html>
