<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Folio — Projects</title>
<meta name="theme-color" content="#0a0c10" id="themeColorMeta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
(function () {
  try {
    // 1. Read the raw preference from storage ("dark", "light", "auto", or "system")
    var pref = localStorage.getItem("folio.theme") || "dark";

    // 2. If it's "auto" or "system", resolve it to a concrete value using the OS setting
    var resolved = pref;
    if (pref === "auto" || pref === "system") {
      resolved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
        ? "light" : "dark";
    }

    // 3. Apply the RESOLVED value (not the raw preference)
    if (resolved === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");

    // 4. Also apply reduced-motion (Settings slider writes this)
    if (localStorage.getItem("folio.reducedMotion") === "true") {
      document.documentElement.setAttribute("data-reduced-motion", "true");
    }

    // 5. Also apply page scale (Settings text-size slider writes this)
    var scale = Number(localStorage.getItem("folio.pageScale") || 1);
    if (!Number.isFinite(scale) || scale < 0.85) scale = 1;
    if (scale > 1.35) scale = 1.35;
    document.documentElement.style.setProperty("--page-scale", String(scale));

    // 6. Update the mobile browser chrome color bar
    var meta = document.getElementById("themeColorMeta") || document.getElementById("metaThemeColor");
    if (meta) meta.setAttribute("content", resolved === "light" ? "#f7f8fa" : "#0a0c10");
  } catch (e) {}
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════
   THEME
   ═══════════════════════════════════════════════════════════ */
:root {
  --theme-primary: #F59E0B;
  --theme-primary-hover: #fbbf24;
  --theme-primary-glow: rgba(245, 158, 11, 0.40);
  --theme-primary-soft: rgba(245, 158, 11, 0.14);

  --theme-bg: #0a0c10;
  --theme-surface: #0f1218;
  --theme-surface-card: rgba(21, 25, 34, 0.72);
  --theme-surface-card-solid: #151922;
  --theme-surface-elevated: #1a1f2a;
  --theme-text: #e8ecf1;
  --theme-text-secondary: rgba(232, 236, 241, 0.72);
  --theme-text-tertiary: rgba(232, 236, 241, 0.44);

  --theme-glass-bg: rgba(255, 255, 255, 0.05);
  --theme-glass-border: rgba(255, 255, 255, 0.09);
  --theme-overlay: rgba(10, 12, 16, 0.85);
  --theme-card-border: rgba(255, 255, 255, 0.08);
  --theme-divider: rgba(255, 255, 255, 0.08);
  --input-bg: rgba(26, 31, 42, 0.88);

  --theme-success: #10B981;
  --theme-success-soft: rgba(16, 185, 129, 0.14);
  --theme-danger: #EF4444;
  --theme-danger-soft: rgba(239, 68, 68, 0.12);
  --theme-warning: #D97706;
  --theme-warning-soft: rgba(217, 119, 6, 0.14);
  --theme-info: #3B82F6;
  --theme-info-soft: rgba(59, 130, 246, 0.14);

  --bg-gradient-1: radial-gradient(circle at 50% -10%, rgba(245, 158, 11, 0.14) 0%, transparent 60%);
  --bg-gradient-2: radial-gradient(circle at 100% 100%, rgba(249, 115, 22, 0.10) 0%, transparent 55%);

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  --rail-w: 60px;
  --header-h: 48px;
  --bottom-nav-h: 56px;
  --content-max: 1200px;

  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'SF Mono', Consolas, Monaco, monospace;
}

[data-theme="light"] {
  --theme-primary: #D97706;
  --theme-primary-hover: #B45309;
  --theme-primary-glow: rgba(217, 119, 6, 0.28);
  --theme-primary-soft: rgba(217, 119, 6, 0.10);
  --theme-bg: #f7f8fa;
  --theme-surface: #ffffff;
  --theme-surface-card: rgba(255, 255, 255, 0.85);
  --theme-surface-card-solid: #ffffff;
  --theme-surface-elevated: #ffffff;
  --theme-text: #121316;
  --theme-text-secondary: rgba(18, 19, 22, 0.72);
  --theme-text-tertiary: rgba(18, 19, 22, 0.48);
  --theme-glass-bg: rgba(255, 255, 255, 0.75);
  --theme-glass-border: rgba(0, 0, 0, 0.08);
  --theme-overlay: rgba(18, 19, 22, 0.55);
  --theme-card-border: rgba(0, 0, 0, 0.07);
  --theme-divider: rgba(0, 0, 0, 0.06);
  --input-bg: #ffffff;
  --theme-success: #059669;
  --theme-success-soft: rgba(5, 150, 105, 0.12);
  --theme-danger: #DC2626;
  --theme-danger-soft: rgba(220, 38, 38, 0.10);
  --theme-warning: #B45309;
  --theme-warning-soft: rgba(180, 83, 9, 0.10);
  --bg-gradient-1: radial-gradient(circle at 50% -10%, rgba(217, 119, 6, 0.08) 0%, transparent 60%);
  --bg-gradient-2: radial-gradient(circle at 100% 100%, rgba(249, 115, 22, 0.06) 0%, transparent 55%);
}

/* Mobile (compact) */
@media (max-width: 639px) {
  :root {
    --rail-w: 0px;
    --header-h: 40px;
    --bottom-nav-h: 52px;
  }
  html, body { font-size: 12px; }
}

/* Tablet */
@media (min-width: 640px) and (max-width: 1023px) {
  :root {
    --rail-w: 52px;
    --header-h: 44px;
  }
}

/* ═══════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--theme-bg);
  font-family: var(--font);
  color: var(--theme-text);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

body {
  background: var(--bg-gradient-1), var(--bg-gradient-2), var(--theme-bg);
  background-attachment: fixed;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; border: none; background: none; padding: 0; }
a { color: var(--theme-primary); text-decoration: none; }
svg { display: block; }
.hidden { display: none !important; }
.mono { font-family: var(--font-mono); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

:focus-visible {
  outline: 2px solid var(--theme-primary);
  outline-offset: 2px;
  border-radius: 6px;
}

/* ═══════════════════════════════════════════════════════════
   SHELL
   ═══════════════════════════════════════════════════════════ */
.app {
  display: flex;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
}

.rail {
  display: none;
  width: var(--rail-w);
  background: var(--theme-surface);
  border-right: 1px solid var(--theme-glass-border);
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: calc(10px + var(--safe-top)) 0 calc(10px + var(--safe-bottom));
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  flex-shrink: 0;
  z-index: 90;
}
@media (min-width: 1024px) { .rail { display: flex; } }

.rail-top, .rail-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.rail-logo {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
  background: var(--theme-surface-elevated);
  border: 1px solid var(--theme-glass-border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-primary);
  text-decoration: none;
}
.rail-logo img { width: 100%; height: 100%; object-fit: cover; }
.rail-logo svg { width: 18px; height: 18px; stroke-width: 2; }

.rail-btn {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  color: var(--theme-text-tertiary);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s var(--ease);
  position: relative;
}
.rail-btn svg { width: 16px; height: 16px; stroke-width: 2; stroke: currentColor; fill: none; }
.rail-btn:hover { color: var(--theme-text-secondary); background: var(--theme-glass-bg); }
.rail-btn.active {
  color: var(--theme-primary);
  background: var(--theme-primary-soft);
}
.rail-btn.active::before {
  content: '';
  position: absolute;
  left: -7px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 18px;
  border-radius: 0 3px 3px 0;
  background: var(--theme-primary);
}

.rail-divider {
  width: 22px;
  height: 1px;
  background: var(--theme-divider);
  margin: 5px 0;
}

/* ═══════════════════════════════════════════════════════════
   MAIN
   ═══════════════════════════════════════════════════════════ */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 8px);
}
@media (min-width: 1024px) {
  .main { padding-bottom: calc(16px + var(--safe-bottom)); }
}

.main-inner {
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  padding: calc(12px + var(--safe-top)) 12px 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
@media (min-width: 1024px) {
  .main-inner { padding: 20px 20px 0; gap: 14px; }
}

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
.page-header {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.header-logo {
  display: none;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  color: var(--theme-text);
}
@media (max-width: 1023px) {
  .header-logo { display: flex; }
}

.header-logo-badge {
  width: 28px;
  height: 28px;
  flex-shrink: 0;          /* don't shrink in a flex row */
  border-radius: 8px;
  background: var(--theme-surface-elevated);
  border: 1px solid var(--theme-glass-border);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-primary);
}

.header-logo-badge img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;          /* remove inline baseline gap */
}

.header-logo-badge svg {
  width: 16px;
  height: 16px;
  stroke-width: 2;
}
.page-title {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.4px;
  color: var(--theme-text);
  margin: 0;
}
@media (min-width: 640px) { .page-title { font-size: 20px; } }

.page-count {
  font-size: 11px;
  font-weight: 600;
  color: var(--theme-text-tertiary);
  padding: 2px 7px;
  background: var(--theme-glass-bg);
  border-radius: 6px;
}

.header-spacer { flex: 1; }

.search-wrap {
  display: none;
  flex: 1;
  max-width: 320px;
  min-width: 180px;
  position: relative;
  align-items: center;
}
@media (min-width: 900px) {
  .search-wrap { display: flex; }
}
.search-trigger {
  display: none;
}
@media (max-width: 899px) {
  .search-trigger { display: flex; }
}
.search-icon {
  position: absolute;
  left: 10px;
  width: 13px;
  height: 13px;
  stroke: var(--theme-text-tertiary);
  fill: none;
  stroke-width: 2.2;
  pointer-events: none;
}

.search-input {
  width: 100%;
  height: 32px;
  padding: 0 28px 0 30px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 8px;
  color: var(--theme-text);
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  outline: none;
  transition: all 0.2s var(--ease);
}
.search-input:focus {
  border-color: var(--theme-primary);
  background: var(--input-bg);
}
.search-input::placeholder { color: var(--theme-text-tertiary); }

.search-clear {
  position: absolute;
  right: 4px;
  width: 22px;
  height: 22px;
  border-radius: 5px;
  display: none;
  align-items: center;
  justify-content: center;
  color: var(--theme-text-tertiary);
}
.search-clear.visible { display: flex; }
.search-clear:hover { color: var(--theme-text); background: var(--theme-divider); }
.search-clear svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.4; }

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  color: var(--theme-text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s var(--ease);
  flex-shrink: 0;
  position: relative;
}
.icon-btn:hover { color: var(--theme-text); border-color: var(--theme-primary-glow); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.icon-btn.filter-active {
  color: var(--theme-primary);
  border-color: var(--theme-primary);
  background: var(--theme-primary-soft);
}
.icon-btn .filter-badge {
  position: absolute;
  top: -3px;
  right: -3px;
  min-width: 14px;
  height: 14px;
  border-radius: 7px;
  background: var(--theme-primary);
  color: #0a0c10;
  font-size: 8px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
}

.btn-new {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 32px;
  padding: 0 11px;
  background: var(--theme-primary);
  color: #0a0c10;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  transition: all 0.2s var(--ease);
  flex-shrink: 0;
}
.btn-new svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.4; }
.btn-new:hover { background: var(--theme-primary-hover); }
.btn-new:active { transform: scale(0.97); }
.btn-new .label { display: none; }
@media (min-width: 640px) { .btn-new .label { display: inline; } }

/* ═══════════════════════════════════════════════════════════
   TABS
   ═══════════════════════════════════════════════════════════ */
.tabs-bar {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--theme-divider);
  padding-bottom: 0;
  margin-bottom: -4px;
}
.tabs-bar::-webkit-scrollbar { display: none; }

.tab {
  padding: 7px 10px 9px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  white-space: nowrap;
  flex-shrink: 0;
  position: relative;
  transition: color 0.2s var(--ease);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.tab:hover { color: var(--theme-text); }
.tab.active { color: var(--theme-primary); }
.tab.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 8px;
  right: 8px;
  height: 2px;
  background: var(--theme-primary);
  border-radius: 2px 2px 0 0;
}
.tab-count {
  padding: 0 5px;
  border-radius: 4px;
  background: var(--theme-glass-bg);
  font-size: 9px;
  font-weight: 800;
  color: var(--theme-text-tertiary);
}
.tab.active .tab-count {
  background: var(--theme-primary-soft);
  color: var(--theme-primary);
}

/* ═══════════════════════════════════════════════════════════
   ACTIVE FILTERS ROW
   ═══════════════════════════════════════════════════════════ */
.active-filters {
  display: none;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  padding: 4px 0;
}
.active-filters.visible { display: flex; }

.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--theme-primary-soft);
  border: 1px solid var(--theme-primary-glow);
  color: var(--theme-primary);
  font-size: 10.5px;
  font-weight: 700;
}
.filter-chip button {
  color: currentColor;
  display: flex;
  align-items: center;
}
.filter-chip svg { width: 9px; height: 9px; stroke-width: 2.4; }

.clear-filters-btn {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  padding: 3px 6px;
  border-radius: 5px;
}
.clear-filters-btn:hover { color: var(--theme-text); background: var(--theme-glass-bg); }

/* ═══════════════════════════════════════════════════════════
   PROJECT GRID / LIST
   ═══════════════════════════════════════════════════════════ */
.projects-container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  padding-bottom: 12px;
}
@media (min-width: 640px) {
  .projects-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
}
@media (min-width: 1024px) {
  .projects-container { grid-template-columns: repeat(3, 1fr); gap: 12px; }
}

.project-card {
  background: var(--theme-surface-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--theme-card-border);
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  display: flex;
  flex-direction: column;
  gap: 7px;
  position: relative;
  min-width: 0;
}
.project-card:hover {
  border-color: var(--theme-primary-glow);
  transform: translateY(-1px);
}
.project-card:active { transform: scale(0.99); }

.project-card-header {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.project-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--theme-surface-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-primary);
  font-weight: 800;
  font-size: 11px;
  border: 1px solid var(--theme-glass-border);
}
.project-icon img { width: 100%; height: 100%; object-fit: cover; }

.project-header-info { flex: 1; min-width: 0; }

.project-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--theme-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 2px;
  line-height: 1.3;
}

.project-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  font-size: 9.5px;
  color: var(--theme-text-tertiary);
  font-weight: 600;
}
.project-meta .sep { opacity: 0.5; }

.role-badge {
  padding: 0px 5px;
  border-radius: 3px;
  font-size: 8.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  background: var(--theme-glass-bg);
  color: var(--theme-text-tertiary);
}
.role-badge.owner { background: var(--theme-primary-soft); color: var(--theme-primary); }
.role-badge.editor { background: var(--theme-info-soft); color: var(--theme-info); }

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-weight: 800;
}
.live-badge .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--theme-success);
}
.live-badge.offline { color: var(--theme-text-tertiary); }
.live-badge.offline .dot { background: var(--theme-text-tertiary); }

.project-more-btn {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-text-tertiary);
  flex-shrink: 0;
  transition: all 0.2s var(--ease);
  margin-top: -2px;
  margin-right: -3px;
}
.project-more-btn:hover { color: var(--theme-text); background: var(--theme-glass-bg); }
.project-more-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; }

.project-desc {
  font-size: 10.5px;
  color: var(--theme-text-secondary);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 0;
}

.lang-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}
.lang-badge {
  font-size: 8.5px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--theme-glass-bg);
  color: var(--theme-text-tertiary);
}

.project-stats {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 9.5px;
  color: var(--theme-text-tertiary);
  font-weight: 600;
  flex-wrap: wrap;
  margin-top: auto;
}
.project-stats .stat-item {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}
.project-stats svg { width: 9px; height: 9px; stroke: currentColor; fill: none; stroke-width: 2.2; }
/* ═══════════════════════════════════════════════════════════
   CARD LAYOUT — row alignment + edit button
   ═══════════════════════════════════════════════════════════ */
.projects-container {
  grid-auto-rows: min-content;
}
.project-card {
  min-height: 96px;
}
.project-card-actions {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
  align-self: center;
  margin-right: -4px;
}
.project-edit-btn {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-text-tertiary);
  transition: all 0.15s var(--ease);
  flex-shrink: 0;
}
.project-edit-btn:hover {
  color: var(--theme-primary);
  background: var(--theme-primary-soft);
}
.project-edit-btn svg {
  width: 12px;
  height: 12px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
}
.project-name {
  font-size: 13px;
  line-height: 1.3;
}
@media (max-width: 639px) {
  .project-card-actions {
    gap: 0;
    margin-right: -6px;
  }
}
/* Mobile list mode */
@media (max-width: 639px) {
  .project-card {
    padding: 10px;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    min-height: 0; 
  }
  .project-card-header {
    flex: 1;
    min-width: 0;
  }
  .project-desc, .lang-badges, .project-stats { display: none; }
  .project-name { margin-bottom: 1px; font-size: 12px; }
  .project-meta { font-size: 9px; }
  .project-more-btn { margin-top: 0; margin-right: 0; }
}

/* ═══════════════════════════════════════════════════════════
   SKELETON
   ═══════════════════════════════════════════════════════════ */
.skeleton {
  background: linear-gradient(90deg, var(--theme-divider) 0%, var(--theme-glass-border) 50%, var(--theme-divider) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite linear;
  border-radius: 5px;
}
@keyframes shimmer {
  from { background-position: 200% 0; }
  to { background-position: -200% 0; }
}

.skeleton-card {
  background: var(--theme-surface-card);
  border: 1px solid var(--theme-card-border);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.skeleton-card-row { display: flex; align-items: flex-start; gap: 8px; }
.skeleton-icon { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; }
.skeleton-title { width: 60%; height: 12px; }
.skeleton-sub { width: 40%; height: 8px; margin-top: 3px; }
.skeleton-line { height: 9px; }
.skeleton-line.short { width: 50%; }

/* ═══════════════════════════════════════════════════════════
   EMPTY STATE
   ═══════════════════════════════════════════════════════════ */
.empty-state {
  padding: 40px 16px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  grid-column: 1 / -1;
}
.empty-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--theme-primary-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-primary);
  margin-bottom: 4px;
}
.empty-icon svg { width: 22px; height: 22px; stroke-width: 2; }
.empty-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--theme-text);
}
.empty-desc {
  font-size: 11.5px;
  color: var(--theme-text-tertiary);
  line-height: 1.45;
  max-width: 320px;
  margin-bottom: 4px;
}
.empty-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

/* ═══════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 7px 12px;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 700;
  border: 1px solid transparent;
  transition: all 0.2s var(--ease);
  white-space: nowrap;
  min-height: 30px;
  font-family: inherit;
}
.btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; flex-shrink: 0; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-primary { background: var(--theme-primary); color: #0a0c10; }
[data-theme="light"] .btn-primary { color: #ffffff; }
.btn-primary:hover:not(:disabled) { background: var(--theme-primary-hover); }

.btn-secondary { background: var(--theme-glass-bg); color: var(--theme-text); border-color: var(--theme-card-border); }
.btn-secondary:hover:not(:disabled) { background: var(--theme-surface-elevated); border-color: var(--theme-primary-glow); }

.btn-ghost { background: transparent; color: var(--theme-text-secondary); border-color: transparent; }
.btn-ghost:hover:not(:disabled) { color: var(--theme-text); background: var(--theme-glass-bg); }

.btn-danger { background: var(--theme-danger); color: #ffffff; }
.btn-danger:hover:not(:disabled) { background: #dc2626; }

.btn-outline-danger { background: transparent; color: var(--theme-danger); border-color: rgba(239, 68, 68, 0.3); }
.btn-outline-danger:hover:not(:disabled) { background: var(--theme-danger-soft); }

.btn-sm { padding: 4px 9px; font-size: 10.5px; min-height: 24px; border-radius: 6px; }
.btn-sm svg { width: 10px; height: 10px; }
.btn-block { width: 100%; }

/* ═══════════════════════════════════════════════════════════
   FULLSCREEN OVERLAY (filters / stats / storage)
   ═══════════════════════════════════════════════════════════ */
.fullscreen-overlay {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: var(--theme-bg);
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.35s var(--ease), opacity 0.25s var(--ease);
  overflow: hidden;
}
.fullscreen-overlay.active {
  transform: translateY(0);
  opacity: 1;
  pointer-events: all;
}
@media (min-width: 640px) {
  .fullscreen-overlay {
    transform: scale(0.97);
    background: var(--theme-overlay);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 20px;
    align-items: center;
    justify-content: center;
  }
  .fullscreen-overlay.active { transform: scale(1); }
}

.overlay-inner {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  background: var(--theme-bg);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  height: 100%;
}
@media (min-width: 640px) {
  .overlay-inner {
    background: var(--theme-surface-card-solid);
    border: 1px solid var(--theme-glass-border);
    border-radius: 16px;
    max-height: 88vh;
    height: auto;
  }
}

.overlay-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(10px + var(--safe-top)) 12px 10px;
  border-bottom: 1px solid var(--theme-divider);
  flex-shrink: 0;
  background: var(--theme-bg);
}
@media (min-width: 640px) {
  .overlay-header { padding: 12px 16px; background: transparent; }
}

.overlay-title {
  flex: 1;
  font-size: 14px;
  font-weight: 800;
  color: var(--theme-text);
  letter-spacing: -0.2px;
}
.overlay-sub {
  font-size: 10.5px;
  color: var(--theme-text-tertiary);
  font-weight: 600;
  margin-top: 1px;
}
.overlay-close {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  color: var(--theme-text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.overlay-close:hover { color: var(--theme-text); border-color: var(--theme-primary-glow); }
.overlay-close svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; }

.overlay-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}
@media (min-width: 640px) { .overlay-body { padding: 16px; } }

.overlay-footer {
  padding: 10px 12px calc(10px + var(--safe-bottom));
  border-top: 1px solid var(--theme-divider);
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  background: var(--theme-bg);
}
@media (min-width: 640px) {
  .overlay-footer { padding: 12px 16px; background: transparent; }
}
.overlay-footer .btn { flex: 1; }

/* ═══════════════════════════════════════════════════════════
   FILTER / STATS BLOCKS
   ═══════════════════════════════════════════════════════════ */
.filter-section {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.filter-label {
  font-size: 9.5px;
  font-weight: 800;
  color: var(--theme-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.filter-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.filter-pill {
  padding: 5px 10px;
  border-radius: 7px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  color: var(--theme-text-secondary);
  font-size: 11px;
  font-weight: 700;
  transition: all 0.2s var(--ease);
}
.filter-pill:hover { border-color: var(--theme-primary-glow); color: var(--theme-text); }
.filter-pill.active {
  background: var(--theme-primary);
  color: #0a0c10;
  border-color: var(--theme-primary);
}
[data-theme="light"] .filter-pill.active { color: #ffffff; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.stat-tile {
  padding: 8px 10px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 8px;
}
.stat-label {
  font-size: 9px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 2px;
}
.stat-value {
  font-size: 15px;
  font-weight: 800;
  color: var(--theme-text);
  letter-spacing: -0.3px;
  line-height: 1.1;
}
.stat-value.warn { color: var(--theme-warning); }
.stat-value.danger { color: var(--theme-danger); }
.stat-value.success { color: var(--theme-success); }

.storage-block {
  padding: 10px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 10px;
}
.storage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.storage-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--theme-text);
}
.storage-amount {
  font-size: 10px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  font-family: var(--font-mono);
}
.storage-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--theme-divider);
  overflow: hidden;
  margin-bottom: 5px;
}
.storage-bar-fill {
  height: 100%;
  background: var(--theme-success);
  transition: width 0.3s var(--ease), background 0.3s var(--ease);
}
.storage-bar-fill.warn { background: var(--theme-warning); }
.storage-bar-fill.danger { background: var(--theme-danger); }
.storage-note {
  font-size: 10px;
  color: var(--theme-text-tertiary);
  line-height: 1.4;
}

.cleanup-block {
  padding: 10px;
  background: var(--theme-warning-soft);
  border: 1px solid rgba(217, 119, 6, 0.3);
  border-radius: 10px;
}
.cleanup-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.cleanup-header svg { width: 13px; height: 13px; stroke: var(--theme-warning); fill: none; stroke-width: 2.2; flex-shrink: 0; }
.cleanup-title {
  flex: 1;
  font-size: 11px;
  font-weight: 800;
  color: var(--theme-warning);
}
.cleanup-desc {
  font-size: 10px;
  color: var(--theme-text-secondary);
  line-height: 1.45;
  margin-bottom: 8px;
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
}
.toggle-info { flex: 1; min-width: 0; }
.toggle-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--theme-text);
  margin-bottom: 1px;
}
.toggle-desc {
  font-size: 10px;
  color: var(--theme-text-tertiary);
  line-height: 1.4;
}
.switch {
  position: relative;
  width: 36px;
  height: 20px;
  border-radius: 10px;
  background: var(--theme-divider);
  cursor: pointer;
  transition: background 0.2s var(--ease);
  flex-shrink: 0;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ffffff;
  transition: transform 0.22s var(--ease);
  box-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.switch.on { background: var(--theme-primary); }
.switch.on::after { transform: translateX(16px); }

/* ═══════════════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 700;
  background: var(--theme-overlay);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s var(--ease);
  padding: 0;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }
@media (min-width: 640px) {
  .modal-overlay { align-items: center; padding: 20px; }
}

.modal {
  background: var(--theme-surface-card-solid);
  border: 1px solid var(--theme-glass-border);
  border-radius: 20px 20px 0 0;
  padding: 14px 14px calc(14px + var(--safe-bottom));
  max-width: 100%;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.28s var(--ease);
}
.modal-overlay.active .modal { transform: translateY(0); }

@media (min-width: 640px) {
  .modal {
    border-radius: 16px;
    max-width: 440px;
    padding: 20px;
    transform: scale(0.94);
  }
  .modal-overlay.active .modal { transform: scale(1); }
}

.modal-handle {
  width: 32px;
  height: 3px;
  border-radius: 2px;
  background: var(--theme-glass-border);
  margin: 0 auto 12px;
}
@media (min-width: 640px) { .modal-handle { display: none; } }

.modal-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--theme-text);
  letter-spacing: -0.2px;
  margin-bottom: 3px;
}
.modal-desc {
  font-size: 11.5px;
  color: var(--theme-text-secondary);
  line-height: 1.5;
  margin-bottom: 12px;
}
.modal-actions {
  display: flex;
  gap: 6px;
  margin-top: 14px;
}
.modal-actions .btn { flex: 1; }

/* ═══════════════════════════════════════════════════════════
   FIELDS
   ═══════════════════════════════════════════════════════════ */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.field-hint { font-size: 10px; color: var(--theme-text-tertiary); line-height: 1.4; }

.input, .textarea {
  width: 100%;
  padding: 8px 10px;
  background: var(--input-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 7px;
  color: var(--theme-text);
  font-size: 12px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s var(--ease);
}
.input:focus, .textarea:focus { border-color: var(--theme-primary); }
.input::placeholder, .textarea::placeholder { color: var(--theme-text-tertiary); }
.textarea { min-height: 64px; resize: vertical; line-height: 1.5; }

/* ═══════════════════════════════════════════════════════════
   STEPPER / CREATE FLOW
   ═══════════════════════════════════════════════════════════ */
.stepper {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 12px;
}
.step {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--theme-divider);
  transition: background 0.25s var(--ease);
}
.step.active, .step.done { background: var(--theme-primary); }

.step-label {
  font-size: 9.5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  margin-bottom: 10px;
}

/* ═══════════════════════════════════════════════════════════
   ICON PICKER
   ═══════════════════════════════════════════════════════════ */
.icon-tabs {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--theme-glass-bg);
  border-radius: 8px;
  margin-bottom: 10px;
}
.icon-tab {
  flex: 1;
  padding: 6px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  transition: all 0.2s var(--ease);
}
.icon-tab.active {
  background: var(--theme-surface-elevated);
  color: var(--theme-text);
}

.icon-mode-panel { display: none; }
.icon-mode-panel.active { display: block; }

.icon-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 10px;
  min-height: 50px;
}
@media (max-width: 480px) {
  .icon-grid { grid-template-columns: repeat(3, 1fr); }
}

.icon-option {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  background: var(--theme-surface-elevated);
  border: 2px solid transparent;
  overflow: hidden;
  transition: border-color 0.2s var(--ease), transform 0.15s var(--ease);
  cursor: pointer;
  padding: 0;
}
.icon-option:hover { transform: scale(1.04); }
.icon-option.selected {
  border-color: var(--theme-primary);
  box-shadow: 0 0 0 2px var(--theme-primary-soft);
}
.icon-option img { width: 100%; height: 100%; object-fit: cover; display: block; }

.icon-skeleton {
  aspect-ratio: 1;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--theme-divider) 0%, var(--theme-glass-border) 50%, var(--theme-divider) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite linear;
}

.icon-placeholder {
  aspect-ratio: 1;
  border-radius: 8px;
  background: var(--theme-glass-bg);
  border: 1px dashed var(--theme-card-border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-text-tertiary);
  font-size: 9px;
  text-align: center;
  padding: 3px;
  line-height: 1.2;
}

.icon-generate-btn {
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  color: var(--theme-text-secondary);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: all 0.2s var(--ease);
}
.icon-generate-btn:hover { border-color: var(--theme-primary-glow); color: var(--theme-primary); }
.icon-generate-btn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.icon-generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.icon-upload-btn {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  background: var(--theme-glass-bg);
  border: 1.5px dashed var(--theme-card-border);
  color: var(--theme-text-secondary);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
}
.icon-upload-btn:hover { border-color: var(--theme-primary); color: var(--theme-primary); }
.icon-upload-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
.icon-upload-btn .sub { font-size: 9.5px; font-weight: 500; color: var(--theme-text-tertiary); }

/* ═══════════════════════════════════════════════════════════
   ACTION MENU
   ═══════════════════════════════════════════════════════════ */
.action-menu {
  position: fixed;
  inset: 0;
  z-index: 800;
  display: none;
  align-items: flex-end;
  justify-content: center;
  background: var(--theme-overlay);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  opacity: 0;
  transition: opacity 0.25s var(--ease);
}
.action-menu.active { display: flex; opacity: 1; }
@media (min-width: 640px) {
  .action-menu { align-items: center; padding: 20px; }
}

.action-sheet {
  background: var(--theme-surface-card-solid);
  border: 1px solid var(--theme-glass-border);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 400px;
  transform: translateY(100%);
  transition: transform 0.28s var(--ease);
  overflow: hidden;
}
.action-menu.active .action-sheet { transform: translateY(0); }

@media (min-width: 640px) {
  .action-sheet { border-radius: 14px; transform: scale(0.94); }
  .action-menu.active .action-sheet { transform: scale(1); }
}

.action-sheet-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 12px 10px;
  border-bottom: 1px solid var(--theme-divider);
  background: var(--theme-glass-bg);
}
.action-sheet-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--theme-surface-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-primary);
  font-weight: 800;
  font-size: 12px;
  border: 1px solid var(--theme-glass-border);
}
.action-sheet-icon img { width: 100%; height: 100%; object-fit: cover; }
.action-sheet-title { flex: 1; min-width: 0; }
.action-sheet-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--theme-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.action-sheet-meta {
  font-size: 10px;
  color: var(--theme-text-tertiary);
  font-weight: 600;
}

.action-list { padding: 4px; }
.action-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border-radius: 6px;
  color: var(--theme-text);
  font-size: 12px;
  font-weight: 600;
  width: 100%;
  text-align: left;
  transition: background 0.15s var(--ease);
}
.action-item:hover { background: var(--theme-glass-bg); }
.action-item svg { width: 14px; height: 14px; stroke: var(--theme-text-tertiary); fill: none; stroke-width: 2.2; flex-shrink: 0; }
.action-item:hover svg { stroke: var(--theme-primary); }
.action-item.danger { color: var(--theme-danger); }
.action-item.danger svg { stroke: var(--theme-danger); }
.action-item.danger:hover { background: var(--theme-danger-soft); }

.action-divider {
  height: 1px;
  background: var(--theme-divider);
  margin: 4px 10px;
}

/* ═══════════════════════════════════════════════════════════
   LOADING / TOAST
   ═══════════════════════════════════════════════════════════ */
.loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 900;
  background: var(--theme-overlay);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  padding: 20px;
}
.loading-overlay.active { display: flex; }
.loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--theme-primary-soft);
  border-top-color: var(--theme-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--theme-text);
  text-align: center;
}
.loading-desc {
  font-size: 11.5px;
  color: var(--theme-text-secondary);
  text-align: center;
  line-height: 1.5;
  max-width: 280px;
}

.toast-container {
  position: fixed;
  bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 10px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 950;
  width: calc(100% - 20px);
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  pointer-events: none;
}
@media (min-width: 1024px) {
  .toast-container {
    left: auto;
    right: 16px;
    transform: none;
    bottom: 16px;
  }
}

.toast {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: var(--theme-surface-card-solid);
  border: 1px solid var(--theme-card-border);
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--theme-text);
  transform: translateY(20px);
  opacity: 0;
  transition: all 0.28s var(--ease-spring);
  pointer-events: all;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast svg { width: 12px; height: 12px; flex-shrink: 0; }
.toast.success svg { stroke: var(--theme-success); }
.toast.error svg { stroke: var(--theme-danger); }
.toast.info svg { stroke: var(--theme-primary); }
.toast.warning svg { stroke: var(--theme-warning); }

/* ═══════════════════════════════════════════════════════════
   CELEBRATION
   ═══════════════════════════════════════════════════════════ */
.celebration {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: var(--theme-overlay);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.3s var(--ease);
}
.celebration.active { display: flex; opacity: 1; }

.celebration-card {
  background: var(--theme-surface-card-solid);
  border: 1px solid var(--theme-glass-border);
  border-radius: 18px;
  padding: 24px 20px;
  width: 100%;
  max-width: 340px;
  text-align: center;
  transform: scale(0.92);
  transition: transform 0.4s var(--ease-spring);
}
.celebration.active .celebration-card { transform: scale(1); }

.celebration-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  margin: 0 auto 12px;
  background: var(--theme-primary-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-primary);
  animation: popIn 0.6s var(--ease-spring);
}
@keyframes popIn {
  0% { transform: scale(0.4); opacity: 0; }
  60% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.celebration-icon svg { width: 26px; height: 26px; stroke-width: 2.4; }

.celebration-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--theme-text);
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}
.celebration-desc {
  font-size: 11.5px;
  color: var(--theme-text-secondary);
  line-height: 1.5;
  margin-bottom: 16px;
}
.celebration-actions { display: flex; flex-direction: column; gap: 6px; }

/* ═══════════════════════════════════════════════════════════
   BOTTOM NAV
   ═══════════════════════════════════════════════════════════ */
.bottom-nav {

  left: 0;
  right: 0;

.nav-btn {

<script>
(function () {
  'use strict';
function wireThemeSync() {
  window.addEventListener('storage', function (e) {
    try {
      // Theme changed in another tab
      if (e.key === 'folio.theme') {
        var pref = e.newValue || 'dark';
        var resolved = pref;
        if (pref === 'auto' || pref === 'system') {
          resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
            ? 'light' : 'dark';
        }
        if (resolved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');

        var meta = document.getElementById('themeColorMeta') || document.getElementById('metaThemeColor');
        if (meta) meta.setAttribute('content', resolved === 'light' ? '#f7f8fa' : '#0a0c10');
      }

      // Reduced-motion toggled in another tab
      if (e.key === 'folio.reducedMotion') {
        if (e.newValue === 'true') document.documentElement.setAttribute('data-reduced-motion', 'true');
        else document.documentElement.removeAttribute('data-reduced-motion');

  function timeAgo(ts) {
    if (!ts) return '—';
    const diff = Date.now() - ts;
    if (diff < 60000) return 'now';
    const m = Math.floor(diff / 60000);
    if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h`;
    const d = Math.floor(h / 24);
    if (d < 30) return `${d}d`;

  function formatBytes(n) {

    return `${n < 10 ? n.toFixed(1) : Math.round(n)} ${u[i]}`;
  }
  function formatNumber(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';

    const colors = [
      'linear-gradient(135deg, #F59E0B, #f97316)',
      'linear-gradient(135deg, #0284c7, #0369a1)',
      'linear-gradient(135deg, #a855f7, #6d28d9)',
      'linear-gradient(135deg, #10B981, #059669)',
      'linear-gradient(135deg, #ec4899, #be185d)',
      'linear-gradient(135deg, #06b6d4, #0891b2)',
    ];
    let hash = 0;
    const s = String(seed || '');
    for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);

  // LOAD PROJECTS — IDB first, then server (hydrate into IDB)
  // ═══════════════════════════════════════════════════════════

  async function loadProjects() {
    renderSkeletons();

    // 1. Local IDB
    let local = [];
    try { local = await IDB.listProjects(); } catch {}

    // 2. Server (signed in + online) — merge server metadata into IDB
    let serverMap = new Map();
    if (S.session && S.online) {
      try {
        const res = await apiFetch(API_HOST + '?action=projects/list');
        if (res.ok && res.data?.success) {
          const serverProjects = res.data.projects || [];
          serverMap = new Map(serverProjects.map(p => [p.pid, p]));
          await hydrateProjectsFromServer(serverProjects);
          local = await IDB.listProjects();
        } else if (res.status === 401) {
          S.session = null;
          try { localStorage.removeItem(STORAGE.session); } catch {}
        }
      } catch {}
    }

    // Merge: local wins on timestamps, server adds deployment/role/etc.
    S.projects = local.map(lp => {
      const server = serverMap.get(lp.pid);
      return {
        ...(server || {}),
        ...lp,
        _serverData: server || null,
      };
    });

    if (S.user && S.user.settings && typeof S.user.settings.globalLimit === 'number') {
      S.storageLimit = S.user.settings.globalLimit;
    }
    if (navigator.storage && navigator.storage.estimate) {
      try { S.storageEstimate = await navigator.storage.estimate(); } catch {}
    }
    try {
      const ac = localStorage.getItem(STORAGE.autoClean);
      S.autoCleanEnabled = ac === null ? true : ac === 'true';
    } catch {}

    const serverBacked = S.projects.filter(p => p._serverData);
    if (serverBacked.length > 0) {
      await loadDeploymentHistoriesFor(serverBacked);
      computeExpiredDeployments();
    }

    if (S.autoCleanEnabled && S.expiredDeployments.length > 0 && S.online) {
      setTimeout(() => autoCleanExpired(), 1200);
    }

    updateHeaderCount();
    applyFiltersAndRender();
  }

  async function loadDeploymentHistoriesFor(projects) {
    const queue = projects.slice();
    const workers = [];
    async function worker() {
      while (queue.length) {
        const p = queue.shift();
        try {
          const res = await apiFetch(API_HOST + '?action=deployment/history&pid=' + encodeURIComponent(p.pid));
          if (res.ok && res.data?.success) {
            S.deploymentCache.set(p.pid, {
              deployments: res.data.deployments || [],
              currentId: res.data.currentDeploymentId || null,
            });
          }
        } catch {}
      }
    }
    for (let i = 0; i < 4; i++) workers.push(worker());
    await Promise.all(workers);
  }

  function computeExpiredDeployments() {
    S.expiredDeployments = [];
    const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
    const now = Date.now();
    for (const [pid, cache] of S.deploymentCache.entries()) {
      for (const d of cache.deployments) {
        if (d.id === cache.currentId) continue;
        if (!d.deployedAt) continue;
        if (now - d.deployedAt < THIRTY_DAYS) continue;
        S.expiredDeployments.push({ pid, deploymentId: d.id, deployedAt: d.deployedAt });
      }
    }
  }

  async function autoCleanExpired() {
    if (S.expiredDeployments.length === 0) return;
    const count = S.expiredDeployments.length;
    try {
      for (const d of S.expiredDeployments) {
        await apiFetch(API_HOST + '?action=deployment/delete', {
          method: 'POST', body: JSON.stringify({ pid: d.pid, deploymentId: d.deploymentId }),
        });

      S.expiredDeployments = [];
      toast(`Cleaned ${count} expired deployment${count === 1 ? '' : 's'}`, 'success', 2000);
      updateHeaderCount();
      applyFiltersAndRender();
    } catch {}
  }
