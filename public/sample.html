<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Folio AI — API Test Console</title>
<style>
  :root {
    --bg: #0e0f12;
    --surface: #16181d;
    --surface-2: #1e2128;
    --border: #2a2e37;
    --text: #e6e8ee;
    --text-dim: #8b909c;
    --accent: #6ea8ff;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 800px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 12px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  input, select, textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea {
    font-family: var(--mono);
    font-size: 12px;
    resize: vertical;
    min-height: 100px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .row > * { flex: 1; }
  .row > button { flex: 0 0 auto; }
  button {
    background: var(--accent);
    color: #0e0f12;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled {
    background: var(--surface-2);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 400;
  }
  button.ghost:hover:not(:disabled) {
    background: var(--surface-2);
    filter: none;
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .actions button { flex: 1; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .status::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
  }
  .status.ok::before { background: var(--green); }
  .status.err::before { background: var(--red); }
  .status.busy::before { background: var(--yellow); animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .kv {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 12px;
    font-size: 12px;
    margin-top: 10px;
  }
  .kv dt { color: var(--text-dim); }
  .kv dd { margin: 0; font-family: var(--mono); }
  .out {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 400px;
    overflow: auto;
    line-height: 1.45;
  }
  .out.empty { color: var(--text-dim); font-style: italic; }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    margin-right: 6px;
  }
  .badge.green { color: var(--green); border-color: rgba(74,222,128,0.3); }
  .badge.red { color: var(--red); border-color: rgba(248,113,113,0.3); }
  .badge.yellow { color: var(--yellow); border-color: rgba(251,191,36,0.3); }
  .badge.accent { color: var(--accent); border-color: rgba(110,168,255,0.3); }
  .artifacts {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .artifact {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-family: var(--mono);
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 200px;
    overflow: auto;
  }
  .hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    line-height: 1.4;
  }
  code {
    font-family: var(--mono);
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
  }
  .full { grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Folio AI — API Test Console</h1>
  <div class="sub">Test your <code>/api/ai</code> endpoint directly from the browser.</div>

  <div class="grid">
    <!-- LEFT: Request -->
    <div class="card">
      <h2>Request</h2>

      <label>Base URL</label>
      <input id="baseUrl" value="https://foliostudios.vercel.app/api/ai" placeholder="https://foliostudios.vercel.app" />

      <label>Task</label>
      <select id="task">
        <option value="explain">explain</option>
        <option value="debug">debug</option>
        <option value="codefix">codefix</option>
        <option value="optimize">optimize</option>
        <option value="suggest">suggest</option>
        <option value="brainstorm">brainstorm</option>
        <option value="metatags">metatags</option>
        <option value="scaffold">scaffold</option>
        <option value="docs">docs</option>
        <option value="findFn">findFn</option>
        <option value="commitMsg">commitMsg</option>
        <option value="logExplain">logExplain</option>
        <option value="diagram">diagram</option>
        <option value="simulate">simulate</option>
        <option value="designExplain">designExplain</option>
        <option value="translate">translate</option>
        <option value="docstrings">docstrings</option>
        <option value="struggle">struggle</option>
        <option value="audit">audit</option>
        <option value="readProject">readProject</option>
        <option value="commitChanges">commitChanges</option>
        <option value="writeDeploy">writeDeploy</option>
      </select>

      <label>Session token (optional — for authed tasks)</label>
      <input id="token" type="password" placeholder="Bearer token (leave blank for guest)" />

      <label>Project ID (optional — for host tasks)</label>
      <input id="pid" placeholder="pid (leave blank if not needed)" />

      <label>Payload (JSON)</label>
      <textarea id="payload" spellcheck="false"></textarea>

      <div class="hint">
        Presets load a sample payload for the chosen task. Edit freely.
      </div>

      <div class="actions">
        <button class="ghost" id="loadPreset">Load preset</button>
        <button id="send">Send →</button>
      </div>
    </div>

    <!-- RIGHT: Response -->
    <div class="card">
      <h2>
        Response
        <span id="status" class="status" style="float:right;">idle</span>
      </h2>

      <dl class="kv" id="meta">
        <dt>status</dt><dd>—</dd>
        <dt>time</dt><dd>—</dd>
        <dt>cached</dt><dd>—</dd>
        <dt>guest</dt><dd>—</dd>
        <dt>words</dt><dd>—</dd>
        <dt>credits</dt><dd>—</dd>
        <dt>tokens</dt><dd>—</dd>
      </dl>

      <div class="out empty" id="out">Send a request to see the response.</div>
      <div class="artifacts" id="artifacts"></div>

      <div class="actions">
        <button class="ghost" id="copy">Copy JSON</button>
        <button class="ghost" id="clear">Clear</button>
      </div>
    </div>

    <!-- BOTTOM: Raw request -->
    <div class="card full">
      <h2>Raw request (curl)</h2>
      <div class="out" id="curl" style="margin-top:0;">—</div>
    </div>
  </div>
</div>

<script>
// ── Presets ───────────────────────────────────────────────────────────
const PRESETS = {
  explain: {
    payload: {
      file: "index.html",
      content: `<!DOCTYPE html>
<html>
<head><title>Hello</title></head>
<body>
  <script>
    function greet(name) {
      return "Hello, " + name + "!";
    }
    console.log(greet("World"));
  <\/script>
</body>
</html>`
    }
  },
  debug: {
    payload: {
      file: "main.js",
      content: `function sum(arr) {
  let total = 0;
  for (let i = 0; i <= arr.length; i++) {
    total += arr[i];
  }
  return total;
}
console.log(sum([1,2,3]));`
    }
  },
  codefix: {
    payload: {
      file: "main.js",
      content: `function divide(a, b) {
  return a / b;
}
console.log(divide(10, 0));`,
      hint: "handle division by zero"
    }
  },
  optimize: {
    payload: {
      file: "main.js",
      content: `function findDuplicates(arr) {
  const out = [];
  for (let i = 0; i < arr.length; i++) {
    for (let j = 0; j < arr.length; j++) {
      if (i !== j && arr[i] === arr[j] && !out.includes(arr[i])) {
        out.push(arr[i]);
      }
    }
  }
  return out;
}`
    }
  },
  suggest: {
    payload: {
      file: "main.js",
      content: "const items = [1,2,3];\nitems.",
      cursorLine: "items."
    }
  },
  brainstorm: {
    payload: {
      name: "Habit tracker",
      description: "A minimal daily habit tracker PWA.",
      fileList: ["index.html", "app.js", "styles.css", "manifest.json"]
    }
  },
  metatags: {
    payload: {
      name: "Portfolio",
      description: "A personal portfolio site for a frontend developer.",
      indexExcerpt: `<head>
  <title>Portfolio</title>
</head>`
    }
  },
  scaffold: {
    payload: {
      name: "Todo App",
      description: "A tiny todo list with local storage.",
      concept: "Single-page, dark mode, no build step.",
      stack: "html+css+js"
    }
  },
  docs: {
    payload: {
      name: "Calculator",
      description: "A basic calculator in vanilla JS.",
      files: {
        "index.html": "<div id='app'></div>",
        "app.js": "console.log('calc');"
      }
    }
  },
  findFn: {
    payload: {
      fnName: "greet",
      files: {
        "main.js": "function greet(n){return 'hi '+n}\ngreet('a');",
        "util.js": "export const greet = n => 'hi ' + n;"
      }
    }
  },
  commitMsg: {
    payload: {
      diff: `diff --git a/main.js b/main.js
+function greet(name) {
+  return "hi " + name;
+}
-console.log("x");`
    }
  },
  logExplain: {
    payload: {
      log: "TypeError: Cannot read properties of undefined (reading 'id') at main.js:42"
    }
  },
  diagram: {
    payload: {
      kind: "flow",
      file: "checkout.js",
      content: "function checkout(cart) { if (!cart.items.length) throw Error('empty'); return pay(cart.total); }"
    }
  },
  simulate: {
    payload: {
      file: "swap.js",
      content: "function swap(a,b){const t=a;a=b;b=t;return [a,b];}",
      inputs: { a: 1, b: 2 }
    }
  },
  designExplain: {
    payload: {
      files: {
        "index.html": "<div id='root'></div>",
        "app.js": "render();",
        "state.js": "export const state = { count: 0 };"
      }
    }
  },
  translate: {
    payload: {
      from: "javascript",
      to: "python",
      code: "const add = (a, b) => a + b;"
    }
  },
  docstrings: {
    payload: {
      file: "main.js",
      content: "function add(a, b) { return a + b; }"
    }
  },
  struggle: {
    payload: {
      files: {
        "main.js": "function big() {\n  // TODO: refactor\n  return 1;\n}"
      }
    }
  },
  audit: {
    payload: {
      file: "index.html",
      content: "<div onclick='go()'>Click</div><img src='x.png'>"
    }
  },
  readProject: { payload: {} },
  commitChanges: { payload: {} },
  writeDeploy: { payload: {} }
};

// ── Elements ──────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const baseUrlEl = $("baseUrl");
const taskEl = $("task");
const tokenEl = $("token");
const pidEl = $("pid");
const payloadEl = $("payload");
const sendBtn = $("send");
const loadPresetBtn = $("loadPreset");
const statusEl = $("status");
const metaEl = $("meta");
const outEl = $("out");
const artifactsEl = $("artifacts");
const curlEl = $("curl");
const copyBtn = $("copy");
const clearBtn = $("clear");

// ── State ─────────────────────────────────────────────────────────────
let lastResponse = null;

// ── Presets ───────────────────────────────────────────────────────────
function loadPreset() {
  const task = taskEl.value;
  const preset = PRESETS[task];
  payloadEl.value = preset
    ? JSON.stringify(preset.payload, null, 2)
    : "{}";
}

// ── Status ────────────────────────────────────────────────────────────
function setStatus(kind, text) {
  statusEl.className = "status " + kind;
  statusEl.textContent = text;
}

// ── Meta display ──────────────────────────────────────────────────────
function setMeta(rows) {
  metaEl.innerHTML = "";
  for (const [k, v] of rows) {
    const dt = document.createElement("dt");
    dt.textContent = k;
    const dd = document.createElement("dd");
    dd.textContent = v;
    metaEl.append(dt, dd);
  }
}

// ── Curl preview ──────────────────────────────────────────────────────
function updateCurl() {
  const url = baseUrlEl.value.replace(/\/$/, "") + "/api/ai";
  let body;
  try {
    body = JSON.parse(payloadEl.value || "{}");
  } catch {
    body = {};
  }
  const full = {
    task: taskEl.value,
    ...(pidEl.value ? { pid: pidEl.value } : {}),
    payload: body
  };
  const headers = ["-H 'Content-Type: application/json'"];
  if (tokenEl.value) headers.push(`-H 'Authorization: Bearer ${tokenEl.value}'`);
  curlEl.textContent = `curl -X POST '${url}' \\\n  ${headers.join(" \\\n  ")} \\\n  -d '${JSON.stringify(full, null, 2)}'`;
}

// ── Artifacts rendering ───────────────────────────────────────────────
function renderArtifacts(artifacts) {
  artifactsEl.innerHTML = "";
  if (!Array.isArray(artifacts) || artifacts.length === 0) return;

  const header = document.createElement("div");
  header.innerHTML = `<span class="badge accent">${artifacts.length}</span> artifact${artifacts.length === 1 ? "" : "s"}`;
  header.style.marginBottom = "8px";
  header.style.color = "var(--text-dim)";
  header.style.fontSize = "12px";
  artifactsEl.appendChild(header);

  artifacts.forEach((a, i) => {
    const div = document.createElement("div");
    div.className = "artifact";

    const kind = a.type || "unknown";
    let preview;
    try {
      preview = JSON.stringify(a, null, 2);
    } catch {
      preview = String(a);
    }
    if (preview.length > 600) preview = preview.slice(0, 600) + "\n…";

    div.innerHTML = `<span class="badge">#${i}</span><span class="badge green">${kind}</span>\n${escapeHtml(preview)}`;
    artifactsEl.appendChild(div);
  });
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// ── Send ──────────────────────────────────────────────────────────────
async function send() {
  const baseUrl = baseUrlEl.value.replace(/\/$/, "");
  const task = taskEl.value;

  let payload;
  try {
    payload = JSON.parse(payloadEl.value || "{}");
  } catch (e) {
    setStatus("err", "bad JSON");
    outEl.className = "out";
    outEl.textContent = "Payload is not valid JSON:\n" + e.message;
    return;
  }

  const body = { task, payload };
  if (pidEl.value) body.pid = pidEl.value;

  const headers = { "Content-Type": "application/json" };
  if (tokenEl.value) headers["Authorization"] = "Bearer " + tokenEl.value;

  sendBtn.disabled = true;
  setStatus("busy", "sending…");
  outEl.className = "out empty";
  outEl.textContent = "…";
  artifactsEl.innerHTML = "";
  const t0 = performance.now();

  try {
    const res = await fetch(baseUrl + "/api/ai", {
      method: "POST",
      headers,
      body: JSON.stringify(body)
    });
    const ms = Math.round(performance.now() - t0);
    const json = await res.json().catch(() => ({}));

    lastResponse = json;

    setStatus(res.ok ? "ok" : "err", `${res.status} ${res.statusText || ""}`.trim());

    const usage = json.usage || {};
    const quota = json.quota || {};
    setMeta([
      ["status", String(res.status)],
      ["time", `${ms}ms`],
      ["cached", String(!!json.cached)],
      ["guest", String(!!json.guest)],
      ["words", usage.totalWords != null ? String(usage.totalWords) : "—"],
      ["credits", quota.creditsUsed != null ? `${quota.creditsUsed}/${quota.creditsLimit}` : "—"],
      ["tokens", usage.totalTokens != null ? String(usage.totalTokens) : "—"]
    ]);

    outEl.className = "out";
    if (json.success) {
      outEl.textContent = json.text || "(no explanation)";
    } else {
      outEl.textContent = "ERROR: " + (json.error || "unknown");
    }

    renderArtifacts(json.artifacts || []);
  } catch (err) {
    setStatus("err", "network");
    setMeta([
      ["status", "—"],
      ["time", "—"],
      ["cached", "—"],
      ["guest", "—"],
      ["words", "—"],
      ["credits", "—"],
      ["tokens", "—"]
    ]);
    outEl.className = "out";
    outEl.textContent = "Network error: " + err.message + "\n\nCheck the Base URL and CORS configuration.";
    artifactsEl.innerHTML = "";
  } finally {
    sendBtn.disabled = false;
    updateCurl();
  }
}

// ── Copy / clear ──────────────────────────────────────────────────────
copyBtn.addEventListener("click", async () => {
  if (!lastResponse) return;
  try {
    await navigator.clipboard.writeText(JSON.stringify(lastResponse, null, 2));
    copyBtn.textContent = "Copied!";
    setTimeout(() => (copyBtn.textContent = "Copy JSON"), 1200);
  } catch {}
});

clearBtn.addEventListener("click", () => {
  outEl.className = "out empty";
  outEl.textContent = "Send a request to see the response.";
  artifactsEl.innerHTML = "";
  setStatus("", "idle");
  setMeta([
    ["status", "—"],
    ["time", "—"],
    ["cached", "—"],
    ["guest", "—"],
    ["words", "—"],
    ["credits", "—"],
    ["tokens", "—"]
  ]);
  lastResponse = null;
});

// ── Wiring ────────────────────────────────────────────────────────────
taskEl.addEventListener("change", () => {
  loadPreset();
  updateCurl();
});
payloadEl.addEventListener("input", updateCurl);
baseUrlEl.addEventListener("input", updateCurl);
tokenEl.addEventListener("input", updateCurl);
pidEl.addEventListener("input", updateCurl);

loadPresetBtn.addEventListener("click", () => {
  loadPreset();
  updateCurl();
});
sendBtn.addEventListener("click", send);

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    send();
  }
});

// ── Init ──────────────────────────────────────────────────────────────
loadPreset();
updateCurl();
setMeta([
  ["status", "—"],
  ["time", "—"],
  ["cached", "—"],
  ["guest", "—"],
  ["words", "—"],
  ["credits", "—"],
  ["tokens", "—"]
]);
</script>
</body>
</html>
