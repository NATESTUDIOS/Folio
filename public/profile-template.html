<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{DISPLAY_NAME}} (@{{USERNAME}}) — Folio</title>
<meta name="description" content="{{BIO}}">
<link rel="canonical" href="{{CANONICAL_URL}}">

<!-- Open Graph -->
<meta property="og:type" content="profile">
<meta property="og:site_name" content="Folio">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
{{OG_IMAGE_META}}

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{OG_DESCRIPTION}}">
{{TWITTER_IMAGE_META}}

<meta name="theme-color" content="#0b0e14">
<meta name="robots" content="index, follow">
<link rel="icon" href="/icons/icon-192.png" type="image/png">

<style>
  :root {
    --bg: #0b0e14;
    --bg-soft: #10141c;
    --bg-card: #161b25;
    --bg-card-hover: #1c2230;
    --border: #262d3a;
    --border-soft: #1c2230;
    --text: #e6edf3;
    --text-soft: #adbac7;
    --text-muted: #7d8590;
    --accent: #7c5cff;
    --accent-soft: rgba(124, 92, 255, 0.14);
    --radius: 14px;
    --radius-sm: 8px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 20px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--border-soft);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: var(--text);
    font-size: 18px;
    letter-spacing: -0.01em;
  }
  .brand img { width: 24px; height: 24px; border-radius: 6px; }
  .topbar-link {
    color: var(--text-soft);
    font-size: 14px;
  }

  /* Profile header */
  .profile-head {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    margin-bottom: 40px;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, #4a3aaa 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 700;
    color: #ffffff;
    flex-shrink: 0;
    border: 2px solid var(--border);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-info { flex: 1; min-width: 0; }
  h1.display-name {
    margin: 0 0 4px;
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    word-break: break-word;
  }
  .username {
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 15px;
    margin-bottom: 12px;
  }
  .bio {
    color: var(--text-soft);
    font-size: 16px;
    line-height: 1.55;
    margin: 12px 0 16px;
    max-width: 640px;
    white-space: pre-line;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
  }
  .links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--text-soft);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
  }
  .links a:hover { color: var(--text); background: var(--bg-card-hover); text-decoration: none; }

  /* Owner controls */
  .owner-controls {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.15s ease;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    cursor: pointer;
  }
  .btn:hover { text-decoration: none; background: var(--bg-soft); border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
  .btn.primary:hover { background: #6a4eeb; }

  /* Section heading */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 40px 0 20px;
  }
  h2.section-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .section-count {
    font-size: 13px;
    color: var(--text-muted);
    font-family: var(--mono);
  }

  /* Project grid */
  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .project-card {
    display: block;
    padding: 20px;
    border-radius: var(--radius);
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    color: var(--text);
    transition: all 0.15s ease;
    text-decoration: none;
  }
  .project-card:hover {
    text-decoration: none;
    border-color: var(--accent);
    background: var(--bg-card-hover);
    transform: translateY(-2px);
  }
  .project-card h3 {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    word-break: break-word;
  }
  .project-card p {
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .lang-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    font-size: 12px;
    color: var(--text-soft);
    font-family: var(--mono);
  }
  .lang-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* Empty state */
  .empty-state {
    padding: 48px 20px;
    text-align: center;
    background: var(--bg-card);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text-muted);
  }
  .empty-state h3 {
    margin: 0 0 8px;
    font-size: 18px;
    color: var(--text-soft);
    font-weight: 600;
  }
  .empty-state p {
    margin: 0;
    font-size: 14px;
  }

  /* Footer */
  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    color: var(--text-muted);
    font-size: 13px;
  }
  footer a { color: var(--text-soft); }
  footer a:hover { color: var(--text); }

  @media (max-width: 640px) {
    .container { padding: 20px 16px 48px; }
    .profile-head { flex-direction: column; gap: 16px; }
    .avatar { width: 80px; height: 80px; font-size: 32px; }
    .project-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <nav class="topbar">
    <a href="/" class="brand">
      <img src="/icons/icon-192.png" alt="" aria-hidden="true">
      <span>Folio</span>
    </a>
    <a href="/app" class="topbar-link">Open editor →</a>
  </nav>

  <main>
    <header class="profile-head">
      <div class="avatar">
        {{AVATAR}}
      </div>
      <div class="profile-info">
        <h1 class="display-name">{{DISPLAY_NAME}}</h1>
        <div class="username">@{{USERNAME}}</div>
        {{BIO_BLOCK}}
        {{LINKS_BLOCK}}
        {{OWNER_CONTROLS}}
      </div>
    </header>

    <div class="section-head">
      <h2 class="section-title">Projects</h2>
      <span class="section-count">{{PROJECT_COUNT}} public</span>
    </div>

    {{PROJECT_GRID}}
  </main>

  <footer>
    <span>Built with <a href="/">Folio</a> — code in your pocket.</span>
    <span id="folio-view-counter"></span>
  </footer>
</div>

<script>
// View counter — posts to /api/host?action=view.
(function(){
  try {
    fetch("/api/host?action=view", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ username: "{{USERNAME}}" }),
      credentials: "omit",
      keepalive: true,
    }).catch(function(){});
  } catch (e) {}
})();
</script>
</body>
</html>
