<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Folio — Tools</title>
    <meta name="theme-color" content="#0a0c10" id="themeColorMeta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Folio" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --theme-primary: #F59E0B;
        --theme-primary-hover: #fbbf24;
        --theme-primary-glow: rgba(245, 158, 11, 0.32);
        --theme-primary-soft: rgba(245, 158, 11, 0.12);
        --theme-accent: #f97316;
        --theme-bg: #0a0c10;
        --theme-surface: #0f1218;
        --theme-surface-card: rgba(21, 25, 34, 0.62);
        --theme-surface-card-solid: #151922;
        --theme-surface-elevated: #1a1f2a;
        --theme-text: #e8ecf1;
        --theme-text-secondary: rgba(232, 236, 241, 0.72);
        --theme-text-tertiary: rgba(232, 236, 241, 0.44);
        --theme-glass-bg: rgba(255, 255, 255, 0.05);
        --theme-glass-border: rgba(255, 255, 255, 0.09);
        --theme-overlay: rgba(10, 12, 16, 0.82);
        --theme-card-border: rgba(255, 255, 255, 0.07);
        --theme-divider: rgba(255, 255, 255, 0.07);
        --input-bg: rgba(26, 31, 42, 0.88);
        --theme-success: #10B981;
        --theme-success-soft: rgba(16, 185, 129, 0.14);
        --theme-danger: #EF4444;
        --theme-danger-soft: rgba(239, 68, 68, 0.12);
        --theme-warning: #D97706;
        --theme-warning-soft: rgba(217, 119, 6, 0.14);
        --bg-tint-1: radial-gradient(circle at 50% -10%, rgba(245, 158, 11, 0.08) 0%, transparent 60%);
        --bg-tint-2: radial-gradient(circle at 100% 100%, rgba(249, 115, 22, 0.05) 0%, transparent 55%);
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --rail-w: 60px;
        --sidebar-w: 264px;
        --sidebar-collapsed-w: 52px;
        --header-h: 52px;
        --content-max: 1240px;
        --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, Monaco, monospace;
      }
      [data-theme="light"] {
        --theme-primary: #D97706;
        --theme-primary-hover: #B45309;
        --theme-primary-glow: rgba(217, 119, 6, 0.24);
        --theme-primary-soft: rgba(217, 119, 6, 0.09);
        --theme-accent: #ea580c;
        --theme-bg: #f7f8fa;
        --theme-surface: #ffffff;
        --theme-surface-card: rgba(255, 255, 255, 0.85);
        --theme-surface-card-solid: #ffffff;
        --theme-surface-elevated: #ffffff;
        --theme-text: #121316;
        --theme-text-secondary: rgba(18, 19, 22, 0.72);
        --theme-text-tertiary: rgba(18, 19, 22, 0.48);
        --theme-glass-bg: rgba(255, 255, 255, 0.75);
        --theme-glass-border: rgba(0, 0, 0, 0.08);
        --theme-overlay: rgba(18, 19, 22, 0.55);
        --theme-card-border: rgba(0, 0, 0, 0.07);
        --theme-divider: rgba(0, 0, 0, 0.06);
        --input-bg: #ffffff;
        --theme-success: #059669;
        --theme-danger: #DC2626;
        --theme-warning: #B45309;
        --bg-tint-1: radial-gradient(circle at 50% -10%, rgba(217, 119, 6, 0.05) 0%, transparent 60%);
        --bg-tint-2: radial-gradient(circle at 100% 100%, rgba(249, 115, 22, 0.03) 0%, transparent 55%);
      }
      @media (max-width: 1023px) {
        :root { --rail-w: 0px; --header-h: 48px; }
      }
      @media (max-width: 639px) {
        :root { --header-h: 44px; --sidebar-w: 100vw; }
        html, body { font-size: 12px; }
      }
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%; width: 100%;
        background: var(--theme-bg);
        font-family: var(--font);
        color: var(--theme-text);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        background: var(--bg-tint-1), var(--bg-tint-2), var(--theme-bg);
        background-attachment: fixed;
      }
      button, input, textarea, select { font: inherit; color: inherit; }
      button {
        cursor: pointer; background: none; border: none; padding: 0;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      a { color: var(--theme-primary); text-decoration: none; touch-action: manipulation; }
      svg { display: block; }
      [hidden] { display: none !important; }
      .mono { font-family: var(--font-mono); }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      [data-reduced-motion="true"] *,
      [data-reduced-motion="true"] *::before,
      [data-reduced-motion="true"] *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      :focus-visible { outline: 2px solid var(--theme-primary); outline-offset: 2px; border-radius: 6px; }

      .app {
        display: grid;
        grid-template-columns: var(--rail-w) var(--sidebar-w) minmax(0, 1fr);
        grid-template-rows: var(--header-h) minmax(0, 1fr);
        grid-template-areas:
          "rail header header"
          "rail sidebar body";
        width: 100vw; height: 100vh; height: 100dvh;
        overflow: hidden;
        transition: grid-template-columns 0.28s var(--ease);
      }
      .app.sidebar-collapsed {
        grid-template-columns: var(--rail-w) var(--sidebar-collapsed-w) minmax(0, 1fr);
      }
      @media (max-width: 1023px) {
        .app {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: var(--header-h) minmax(0, 1fr);
          grid-template-areas: "header" "body";
        }
        .app.sidebar-collapsed { grid-template-columns: minmax(0, 1fr); }
      }

      /* RAIL */
      .rail {
        grid-area: rail;
        background: var(--theme-surface);
        border-right: 1px solid var(--theme-glass-border);
        display: flex; flex-direction: column;
        align-items: center; justify-content: space-between;
        padding: calc(10px + var(--safe-top)) 0 calc(10px + var(--safe-bottom));
        z-index: 30;
      }
      @media (max-width: 1023px) { .rail { display: none; } }
      .rail-top, .rail-bottom { display: flex; flex-direction: column; align-items: center; gap: 3px; }
      .rail-logo {
        width: 36px; height: 36px; border-radius: 10px;
        overflow: hidden; margin-bottom: 10px;
        background: var(--theme-surface-elevated);
        border: 1px solid var(--theme-glass-border);
        display: flex; align-items: center; justify-content: center;
        color: var(--theme-primary);
      }
      .rail-logo img { width: 100%; height: 100%; object-fit: cover; }
      .rail-logo svg { width: 18px; height: 18px; stroke-width: 2; }
      .rail-item {
        width: 36px; height: 36px; border-radius: 9px;
        color: var(--theme-text-tertiary);
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s var(--ease);
        position: relative; text-decoration: none;
      }
      .rail-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
      .rail-item:hover { color: var(--theme-text-secondary); background: var(--theme-glass-bg); }
      .rail-item.active { color: var(--theme-primary); background: var(--theme-primary-soft); }
      .rail-item.active::before {
        content: ''; position: absolute; left: -7px; top: 50%;
        transform: translateY(-50%);
        width: 3px; height: 18px; border-radius: 0 3px 3px 0;
        background: var(--theme-primary);
      }
      .rail-divider { width: 22px; height: 1px; background: var(--theme-divider); margin: 5px 0; }

      /* HEADER */
      .header {
        grid-area: header;
        display: flex; align-items: center; gap: 6px;
        padding: 0 10px;
        padding-left: calc(10px + var(--safe-left));
        padding-right: calc(10px + var(--safe-right));
        background: var(--theme-surface);
        border-bottom: 1px solid var(--theme-glass-border);
        position: relative; z-index: 20;
        min-width: 0;
      }
      @media (max-width: 639px) { .header { padding: 0 6px; gap: 4px; } }
      .header-icon-btn {
        width: 30px; height: 30px; border-radius: 7px;
        display: flex; align-items: center; justify-content: center;
        color: var(--theme-text-secondary);
        transition: all 0.15s var(--ease); flex-shrink: 0;
      }
      .header-icon-btn:hover { background: var(--theme-glass-bg); color: var(--theme-text); }
      .header-icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }
      @media (max-width: 639px) {
        .header-icon-btn { width: 28px; height: 28px; }
        .header-icon-btn svg { width: 15px; height: 15px; }
      }
      .header-brand {
        display: flex; align-items: center; gap: 7px;
        text-decoration: none; color: inherit; flex-shrink: 0;
        padding: 2px 4px; border-radius: 6px;
      }
      .header-brand-icon {
        width: 26px; height: 26px; border-radius: 7px;
        background: var(--theme-surface-elevated);
        border: 1px solid var(--theme-glass-border);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; flex-shrink: 0;
        color: var(--theme-primary);
      }
      .header-brand-icon img { width: 100%; height: 100%; object-fit: cover; }
      .header-brand-icon svg { width: 14px; height: 14px; stroke-width: 2; }
      .header-brand-text { display: flex; flex-direction: column; line-height: 1; min-width: 0; }
      .header-brand-title { font-size: 12.5px; font-weight: 800; letter-spacing: -0.2px; }
      .header-brand-sub {
        font-size: 8px; font-weight: 800; color: var(--theme-primary);
        letter-spacing: 0.6px; text-transform: uppercase; margin-top: 1px;
      }
      @media (max-width: 400px) { .header-brand-text { display: none; } }
      .header-crumb {
        display: flex; align-items: center; gap: 4px;
        font-size: 11.5px; font-weight: 600;
        color: var(--theme-text-tertiary);
        min-width: 0; flex: 1; overflow: hidden;
        padding-left: 6px; border-left: 1px solid var(--theme-divider);
        margin-left: 4px;
      }
      .header-crumb .seg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
      .header-crumb .seg.current { color: var(--theme-text); font-weight: 700; }
      .header-crumb .sep { color: var(--theme-text-tertiary); opacity: 0.5; }
      @media (max-width: 400px) { .header-crumb { display: none; } }
      .header-right { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
      .header-usage-badge {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 9px; border-radius: 7px;
        background: var(--theme-glass-bg);
        border: 1px solid var(--theme-card-border);
        color: var(--theme-text-secondary);
        font-size: 10.5px; font-weight: 700;
        transition: all 0.15s var(--ease);
        flex-shrink: 0;
      }
      .header-usage-badge:hover {
        border-color: var(--theme-primary-glow);
        color: var(--theme-text);
        background: var(--theme-surface-elevated);
      }
      .usage-ring {
        width: 14px; height: 14px; flex-shrink: 0;
        position: relative;
      }
      .usage-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .usage-ring circle { fill: none; stroke-width: 2.5; stroke-linecap: round; }
      .usage-ring .usage-track { stroke: var(--theme-divider); }
      .usage-ring .usage-fill { stroke: var(--theme-success); transition: stroke 0.3s; }
      .usage-ring.warn .usage-fill { stroke: var(--theme-warning); }
      .usage-ring.danger .usage-fill { stroke: var(--theme-danger); }
      @media (max-width: 639px) {
        .header-usage-badge { padding: 4px 6px; gap: 4px; }
        .header-usage-badge .usage-label { display: none; }
        .usage-ring { width: 13px; height: 13px; }
      }

      /* SIDEBAR */
      .sidebar {
        grid-area: sidebar;
        background: var(--theme-surface);
        border-right: 1px solid var(--theme-glass-border);
        display: flex; flex-direction: column;
        overflow: hidden;
        min-height: 0;
        z-index: 25;
      }
      @media (max-width: 1023px) {
        .sidebar {
          position: fixed; top: 0; left: 0; bottom: 0;
          width: min(88vw, 320px);
          transform: translateX(-100%);
          transition: transform 0.28s var(--ease);
          z-index: 860;
          box-shadow: 6px 0 40px rgba(0, 0, 0, 0.4);
          background: var(--theme-surface-card-solid);
          padding-top: var(--safe-top);
          padding-bottom: var(--safe-bottom);
        }
        .sidebar.open { transform: translateX(0); }
      }
      .sidebar-backdrop {
        display: none;
        position: fixed; inset: 0; z-index: 855;
        background: rgba(10, 12, 16, 0.55);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
      }
      .sidebar-backdrop.open { display: block; }
      @media (min-width: 1024px) { .sidebar-backdrop { display: none !important; } }
      .app.sidebar-collapsed .sidebar-expanded { display: none; }
      .app:not(.sidebar-collapsed) .sidebar-collapsed-rail { display: none; }
      .sidebar-expanded {
        display: flex; flex-direction: column;
        min-height: 0; height: 100%;
      }
      .sidebar-head {
        display: flex; align-items: center; gap: 6px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--theme-glass-border);
        flex-shrink: 0;
      }
      .sidebar-title {
        font-size: 11px; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.6px;
        color: var(--theme-text-tertiary);
        flex: 1; min-width: 0;
      }
      .sidebar-head-btn {
        width: 26px; height: 26px; border-radius: 6px;
        display: flex; align-items: center; justify-content: center;
        color: var(--theme-text-tertiary);
        transition: all 0.15s var(--ease);
        flex-shrink: 0;
      }
      .sidebar-head-btn:hover { background: var(--theme-glass-bg); color: var(--theme-text); }
      .sidebar-head-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; }
      .sidebar-body {
        flex: 1; overflow-y: auto; overflow-x: hidden;
        padding: 10px 8px 12px;
        min-height: 0;
        scrollbar-width: thin;
        scrollbar-color: var(--theme-divider) transparent;
        overscroll-behavior: contain;
      }
      .sidebar-body::-webkit-scrollbar { width: 5px; }
      .sidebar-body::-webkit-scrollbar-thumb { background: var(--theme-divider); border-radius: 3px; }
      .usage-tip {
        background: var(--theme-glass-bg);
        border: 1px solid var(--theme-card-border);
        border-radius: 10px;
        padding: 10px 11px;
        display: flex; flex-direction: column; gap: 8px;
        margin-bottom: 4px;
      }
      .usage-tip-head {
        display: flex; align-items: center; justify-content: space-between; gap: 6px;
      }
      .usage-tip-label {
        font-size: 9px; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.5px;
        color: var(--theme-text-tertiary);
      }
      .usage-tip-reset {
        font-size: 9px; font-family: var(--font-mono);
        color: var(--theme-text-tertiary);
        padding: 1px 5px; border-radius: 4px;
        background: var(--theme-divider);
      }
      .usage-row { display: flex; flex-direction: column; gap: 3px; }
      .usage-row-head {
        display: flex; align-items: center; justify-content: space-between; gap: 6px;
      }
      .usage-row-label {
        font-size: 10px; font-weight: 700;
        color: var(--theme-text-secondary);
        text-transform: uppercase; letter-spacing: 0.3px;
      }
      .usage-row-val {
        font-size: 10px; font-family: var(--font-mono);
        color: var(--theme-text-tertiary);
        font-variant-numeric: tabular-nums;
      }
      .usage-bar {
        height: 4px; border-radius: 2px;
        background: var(--theme-divider);
        overflow: hidden;
      }
      .usage-bar-fill {
        height: 100%; background: var(--theme-success);
        border-radius: inherit;
        transition: width 0.4s var(--ease), background 0.4s var(--ease);
      }
      .usage-bar-fill.warn { background: var(--theme-warning); }
      .usage-bar-fill.danger { background: var(--theme-danger); }
      .usage-tip-meta {
        font-size: 9.5px; color: var(--theme-text-tertiary);
        font-family: var(--font-mono);
        padding-top: 2px;
        border-top: 1px dashed var(--theme-divider);
        margin-top: 2px;
      }
      .sidebar-section {
        display: flex; flex-direction: column; gap: 3px;
        margin-top: 10px;
      }
      .sidebar-section:first-child { margin-top: 0; }
      .sidebar-section-label {
        font-size: 9px; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.5px;
        color: var(--theme-text-tertiary);
        padding: 4px 6px 2px;
      }
      .tool-list-item {
        display: flex; align-items: center; gap: 8px;
        padding: 7px 8px; border-radius: 7px;
        background: transparent; border: none;
        color: var(--theme-text-secondary);
        width: 100%; text-align: left;
        transition: all 0.15s var(--ease);
        position: relative;
        min-height: 34px;
      }
      .tool-list-item:hover { background: var(--theme-glass-bg); color: var(--theme-text); }
      .tool-list-item.active {
        background: var(--theme-primary-soft);
        color: var(--theme-primary);
      }
      .tool-list-item.active::before {
        content: ''; position: absolute;
        left: 0; top: 50%; transform: translateY(-50%);
        width: 2.5px; height: 18px; border-radius: 0 2px 2px 0;
        background: var(--theme-primary);
      }
      .tool-list-icon {
        width: 24px; height: 24px; border-radius: 6px;
        display: flex; align-items: center; justify-content: center;
        background: var(--theme-glass-bg);
        flex-shrink: 0;
        color: inherit;
      }
      .tool-list-item.active .tool-list-icon {
        background: var(--theme-primary-soft);
        color: var(--theme-primary);
      }
      .tool-list-icon svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; }
      .tool-list-name {
        flex: 1; min-width: 0;
        font-size: 11.5px; font-weight: 600;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .tool-list-cat {
        font-size: 8px; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.3px;
        padding: 1px 5px; border-radius: 3px;
        background: var(--theme-divider);
        color: var(--theme-text-tertiary);
        flex-shrink: 0;
      }
      .tool-list-item.active .tool-list-cat {
        background: var(--theme-primary-glow);
        color: var(--theme-primary);
      }
      .sidebar-collapsed-rail {
        display: flex; flex-direction: column;
        align-items: center;
        padding: 10px 0;
        height: 100%;
        gap: 3px;
        overflow-y: auto;
        scrollbar-width: none;
      }
      .sidebar-collapsed-rail::-webkit-scrollbar { display: none; }
      .collapsed-quota {
        width: 30px; height: 30px;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 6px;
        position: relative;
        cursor: pointer;
      }
      .collapsed-quota .usage-ring { width: 22px; height: 22px; }
      .collapsed-quota .usage-ring circle { stroke-width: 3; }
      .rail-tool-btn {
        width: 34px; height: 34px;
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        color: var(--theme-text-tertiary);
        background: transparent;
        transition: all 0.15s var(--ease);
        flex-shrink: 0;
        position: relative;
      }
      .rail-tool-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.2; }
      .rail-tool-btn:hover { background: var(--theme-glass-bg); color: var(--theme-text); }
      .rail-tool-btn.active { color: var(--theme-primary); background: var(--theme-primary-soft); }
      .rail-tool-btn.active::before {
        content: ''; position: absolute;
        left: -7px; top: 50%; transform: translateY(-50%);
        width: 2.5px; height: 16px; border-radius: 0 2px 2px 0;
        background: var(--theme-primary);
      }
      .rail-cat-sep {
        width: 18px; height: 1px;
        background: var(--theme-divider);
        margin: 4px 0;
        flex-shrink: 0;
      }
      .collapsed-expand-btn {
        width: 34px; height: 34px;
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        color: var(--theme-text-tertiary);
        background: transparent;
        transition: all 0.15s var(--ease);
        flex-shrink: 0;
        margin-top: auto;
      }
      .collapsed-expand-btn:hover { background: var(--theme-glass-bg); color: var(--theme-primary); }
      .collapsed-expand-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.4; }

      /* BODY */
      .body {
        grid-area: body;
        overflow-y: auto; overflow-x: hidden;
        -webkit-overflow-scrolling: touch;

      .input, .textarea, .select {

      .btn {

      .flier-frame {

  width: 100%;

}

function checkEditorHandoff() {
  const params = new URLSearchParams(location.search);
  if (params.get('from') !== 'editor') return null;

  const pid = params.get('pid');
  if (!pid) return null;

  const handoff = {
    pid,
    slot: params.get('slot') || 'icon',
    returnUrl: params.get('return') || '/?pid=' + encodeURIComponent(pid),
    projectName: params.get('name') || 'Project',
    projectDesc: params.get('desc') || '',
  };
  window.__EDITOR_HANDOFF__ = handoff;
  return handoff;
}

function showEditorHandoffBanner(handoff) {
  if (!handoff) return;
  const banner = document.createElement('div');
  banner.className = 'editor-handoff-banner';
  banner.innerHTML = `
    <div class="editor-handoff-text">
      <strong>Generating ${handoff.slot === 'icon' ? 'icon' : handoff.slot}</strong> for "${escapeHtml(handoff.projectName)}"
    </div>
    <button class="editor-handoff-return" type="button">← Return to editor</button>
  `;
  banner.querySelector('.editor-handoff-return').addEventListener('click', () => {
    window.location.href = handoff.returnUrl;
  });

  const bodyEl = document.querySelector('.body-inner') || document.querySelector('.body');
  if (bodyEl) bodyEl.insertBefore(banner, bodyEl.firstChild);
}

async function saveImageToProject() {
  const handoff = window.__EDITOR_HANDOFF__;
  if (!handoff) return;
  if (!S.isAuthed) { toast('Sign in to save', 'warning'); return; }
  if (!S.flier.preview) { toast('Render an image first', 'warning'); return; }

  showLoading('Saving', 'Uploading to project…');
  try {
    // 1. Upload the rendered image to the CDN
    const payload = {
      mode: 'upload',
      type: 'template',
      template: S.flier.template,
      size: '512x512',
      data: {
        text: S.flier.text,
        style: S.flier.style,
        images: S.flier.images,
      },
      upload: { name: `icon_${handoff.pid}_${Date.now()}` },
    };

    const res = await api(API_FLIER + '?action=generate', {
      method: 'POST',
      body: JSON.stringify(payload),
    });

    if (!res.ok || !res.data || !res.data.url) {
      throw new Error((res.data && res.data.error) || 'Upload failed');
    }

    const imageUrl = res.data.url;

    // 2. Save to project as iconUrl (only slot host.js supports)
    if (handoff.slot === 'icon') {
      const saveRes = await api(API_HOST + '?action=projects/update', {
        method: 'POST',
        body: JSON.stringify({ pid: handoff.pid, iconUrl: imageUrl }),
      });
      if (!saveRes.ok || !saveRes.data?.success) {
        throw new Error((saveRes.data && saveRes.data.error) || 'Could not save icon');
      }
    }

    hideLoading();
    toast('Saved — returning to editor', 'success', 1500);

    const returnUrl = handoff.returnUrl;
    const sep = returnUrl.indexOf('?') >= 0 ? '&' : '?';
    const finalUrl = returnUrl + sep + 'generated=' + encodeURIComponent(handoff.slot) +
                     '&url=' + encodeURIComponent(imageUrl);

    setTimeout(() => { window.location.href = finalUrl; }, 700);
  } catch (err) {
    hideLoading();
    toast(err.message || 'Save failed', 'error');
  }
}

          var genBucket = (S.usage && S.usage.buckets && S.usage.buckets.generate) || S.rateCache.generate;
          var pct = (genBucket && genBucket.limit && genBucket.remaining != null) ? Math.max(0, Math.min(100, (genBucket.remaining / genBucket.limit) * 100)) : 0;

        function loadFlierConfig() {
          var saved = readJSON(STORAGE.flierConfig, null);

          if (saved) {
            if (saved.template) S.flier.template = saved.template;
            if (saved.size) S.flier.size = saved.size;

            if (saved.images) S.flier.images = Object.assign({}, S.flier.images, saved.images);
            if (saved.mode) S.flier.mode = saved.mode;
          }
        }
        function saveFlierConfig() {
          writeJSON(STORAGE.flierConfig, {
            template: S.flier.template, size: S.flier.size, mode: S.flier.mode,
            text: S.flier.text, style: S.flier.style, images: S.flier.images
          });
        }

        function buildFlierBody() {
          var t = S.flier.text;
          var text = {};
          if (t.kicker) text.kicker = t.kicker;
          if (t.headline) text.headline = t.headline;
          if (t.subheadline) text.subheadline = t.subheadline;
          if (t.body) text.body = t.body;
          if (t.footer) text.footer = t.footer;
          if (t.metric) text.metric = t.metric;
          if (t.metricLabel) text.metricLabel = t.metricLabel;
          if (!Object.keys(text).length) text.headline = 'Your image';
          var st = S.flier.style;
          var style = {
            variant: st.variant, pattern: st.pattern, align: st.align, headlineCase: st.headlineCase, radius: st.radius,
            colors: { primary: st.primary, accent: st.accent },
            scene: st.scene, sceneNight: st.sceneNight, sceneOpacity: st.sceneOpacity, scenePalette: st.scenePalette
          };
          if (st.bgType === 'gradient') style.background = { type: 'gradient', from: st.bgFrom, to: st.bgTo, angle: st.bgAngle };
          else style.background = { type: 'solid', color: st.bgSolid };
          var images = {};
          var keys = ['background','primary','secondary','logo'];
          for (var i = 0; i < keys.length; i++) {
            var k = keys[i];
            var v = S.flier.images[k];
            if (v && v.url) images[k] = { url: v.url };
          }
          return { template: S.flier.template, size: S.flier.size, mode: S.flier.mode, data: { text: text, style: style, images: images } };

        function wireFlier(mount) {
          var modes = mount.querySelectorAll('[data-mode]');
          for (var i = 0; i < modes.length; i++) {
            (function (b) {
              b.addEventListener('click', function () {
                S.flier.mode = b.dataset.mode;
                saveFlierConfig();
                var all = mount.querySelectorAll('[data-mode]');
                for (var j = 0; j < all.length; j++) all[j].classList.toggle('active', all[j] === b);
              });
            })(modes[i]);
          }
          var auto = $('flierAuto');
          if (auto) auto.addEventListener('change', function (e) { S.flier.auto = e.target.checked; saveFlierConfig(); });
          var ftabs = mount.querySelectorAll('[data-ftab]');
          for (var k = 0; k < ftabs.length; k++) {
            (function (b) {
              b.addEventListener('click', function () {
                S.flier.tab = b.dataset.ftab;
                var all = mount.querySelectorAll('[data-ftab]');
                for (var m = 0; m < all.length; m++) all[m].classList.toggle('active', all[m] === b);
                renderFlierPanel();
              });
            })(ftabs[k]);
          }
          var dtabs = mount.querySelectorAll('[data-dtab]');
          for (var n = 0; n < dtabs.length; n++) {
            (function (b) {
              b.addEventListener('click', function () {
                var all = mount.querySelectorAll('[data-dtab]');
                for (var m = 0; m < all.length; m++) all[m].classList.toggle('active', all[m] === b);
                renderFlierDrawer(b.dataset.dtab);
              });
            })(dtabs[n]);
          }
          var rb = $('flierRenderBtn'); if (rb) rb.addEventListener('click', function () { refreshFlierPreview(true); });
          var db = $('flierDownloadBtn'); if (db) db.addEventListener('click', flierDownload);
          var cb = $('flierCopyUrlBtn'); if (cb) cb.addEventListener('click', flierCopyUrl);
        }

        function renderFlierDrawer(tab) {
        var body = $('flierDrawerBody');
        if (!body) return;
        var last = S.flier.lastResponse;

        if (tab === 'Output') {
          body.innerHTML = last
            ? '<div class="drawer-code">' + esc(JSON.stringify({
                mode: last.mode,
                width: last.width,
                height: last.height,
                template: last.template,
                scene: last.scene,
                url: last.url || null,
                remaining: last.remaining,
                limit: last.limit
              }, null, 2)) + '</div>'
            : '<div class="drawer-empty">Render once to see the output.</div>';
          return;
        }

        if (tab === 'Request') {
          body.innerHTML =
            '<div class="drawer-code">' + esc(JSON.stringify(buildFlierBody(), null, 2)) + '</div>' +
            '<button class="btn btn-sm btn-secondary drawer-copy" type="button" id="dCopyReq">' + icon('copy', 10, 2.4) + ' Copy</button>';
          var c1 = $('dCopyReq');
          if (c1) c1.addEventListener('click', function () {
            copyText(JSON.stringify(buildFlierBody(), null, 2)).then(function () {
              toast('Copied', 'success');
            });
          });
          return;
        }

        if (tab === 'cURL') {
          var parts = [];
          parts.push("curl -X POST '" + API_FLIER + "?action=generate'");
          parts.push("-H 'Content-Type: application/json'");
          if (S.session) parts.push("-H 'Authorization: Bearer " + S.session + "'");
          parts.push("-d '" + JSON.stringify(buildFlierBody()) + "'");
          var cmd = parts.join(' ');
          body.innerHTML =
            '<div class="drawer-code">' + esc(cmd) + '</div>' +
            '<button class="btn btn-sm btn-secondary drawer-copy" type="button" id="dCopyCurl">' + icon('copy', 10, 2.4) + ' Copy</button>';
          var c2 = $('dCopyCurl');
          if (c2) c2.addEventListener('click', function () {
            copyText(cmd).then(function () { toast('Copied', 'success'); });
          });
          return;
        }

        if (tab === 'Diagnostics') {
          var ir = (last && last.imageReport) || {};
          var keys = ['background', 'primary', 'secondary', 'logo'];
          var rowsHtml = '';
          for (var i = 0; i < keys.length; i++) {
            var k = keys[i];
            var r = ir[k];
            var statusClass = r && r.ok ? 'good' : r ? 'bad' : '';
            var statusText = r && r.ok ? 'OK' : (r && r.code ? r.code : '—');
            var smallText = (r && r.bytes ? bytesFmt(r.bytes) : '') + ' ' + (r && r.mime ? r.mime : '') + ' ' + (r && r.cached ? '· cached' : '');
            rowsHtml += '<div class="diag-row">' +
              '<b>' + k + '</b>' +
              '<span class="' + statusClass + '">' + statusText + '</span>' +
              '<small>' + smallText + '</small>' +
            '</div>';
          }
          body.innerHTML =
            '<div class="diag-grid">' + rowsHtml + '</div>' +
            '<div class="drawer-empty">Rate: ' + (last && last.remaining != null ? last.remaining : '—') + '/' + (last && last.limit != null ? last.limit : '—') + '</div>';
          return;
        }
      }

        function maybeAutoRender() {

        async function refreshFlierPreview(force) {
  if (!S.isAuthed) { toast('Sign in to render', 'warning'); return; }
  if (!S.online) { toast('Offline - cannot render', 'warning'); return; }
  if (S.flier.rendering) return;

  var payload = buildFlierBody();
  payload.mode = 'preview';
  var key = JSON.stringify(payload);

  if (!force && key === S.flier.lastRender) return;

  S.flier.rendering = true;
  var load = $('flierFrameLoading');
  if (load) load.classList.add('visible');

  try {
    var res = await api(API_FLIER + '?action=generate', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    rememberRateHeaders(res.headers);
    updateHeaderUsage();

    if (!res.ok || !res.data || !res.data.preview) {
      throw new Error((res.data && res.data.error) || 'Render failed');
    }

    S.flier.preview = res.data.preview;
    S.flier.lastRender = key;
    S.flier.lastResponse = res.data;

    var frame = $('flierFrame');
    if (frame) {
      // Remove the empty state if present
      var empty = frame.querySelector('.flier-empty');
      if (empty) empty.remove();

      // Reuse existing img or create one
      var img = frame.querySelector('img');
      if (img) {
        img.src = res.data.preview;
      } else {
        var newImg = document.createElement('img');
        newImg.src = res.data.preview;
        newImg.alt = '';
        // Insert before the loading overlay so the overlay stays on top
        frame.insertBefore(newImg, frame.firstChild);
      }
    }

    var meta = $('flierMeta');
    if (meta) {
      meta.textContent =
        (res.data.scene || 'no scene') + ' | ' +
        (res.data.template || '') + ' | ' +
        res.data.width + 'x' + res.data.height;
    }

    renderFlierDrawer('Output');
    addActivity({ text: 'Rendered ' + (res.data.template || 'flier'), ok: true });
  } catch (err) {
    console.warn(err);
    toast(err.message || 'Render failed', 'error');
    addActivity({ text: 'Render failed: ' + (err.message || 'error'), ok: false });
  } finally {
    S.flier.rendering = false;
    var l2 = $('flierFrameLoading');
    if (l2) l2.classList.remove('visible');
  }
}

        async function flierDownload() {
        if (!S.isAuthed) { toast('Sign in to download', 'warning'); return; }
        if (!S.online) { toast('Offline', 'warning'); return; }
        try {
          var payload = buildFlierBody();
          payload.mode = 'upload';
          payload.upload = { name: 'flier_' + Date.now() };
          var res = await api(API_FLIER + '?action=generate', {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          rememberRateHeaders(res.headers);
          updateHeaderUsage();
          if (!res.ok || !res.data || !res.data.url) {
            throw new Error((res.data && res.data.error) || 'Upload failed');
          }
          var blob = await (await fetch(res.data.url)).blob();
          var u = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = u;
          a.download = 'flier_' + Date.now() + '.png';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(u); }, 1000);
          addActivity({ text: 'Downloaded flier', ok: true });
          toast('Downloaded', 'success');
        } catch (err) {
          toast(err.message || 'Download failed', 'error');
        }
      }

        async function uploadImage(slot) {
        if (!S.isAuthed) { toast('Sign in to upload', 'warning'); return; }

        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';

        input.addEventListener('change', async function () {
          var file = input.files && input.files[0];
          if (!file) return;
          if (file.size > 1024 * 1024) {
            toast('Max 1 MB', 'error');
            return;
          }

          var dataUrl = await new Promise(function (resolve, reject) {
            var r = new FileReader();
            r.onload = function () { resolve(r.result); };
            r.onerror = reject;
            r.readAsDataURL(file);
          });

          try {
            showLoading('Uploading', 'Sending image…');
            var r = await api(API_FLIER + '?action=upload', {
              method: 'POST',
              body: JSON.stringify({ dataUrl: dataUrl, kind: 'image' })
            });
            hideLoading();
            rememberRateHeaders(r.headers);
            updateHeaderUsage();

            if (!r.ok || !r.data || !r.data.url) {
              throw new Error((r.data && r.data.error) || 'Upload failed');
            }

            S.flier.images[slot] = { url: r.data.url };
            saveFlierConfig();
            addStorage(r.data.bytes || file.size);
            addActivity({ text: 'Uploaded ' + slot + ' image (' + bytesFmt(r.data.bytes || file.size) + ')', ok: true });
            renderFlierPanel();
            maybeAutoRender();
            toast('Uploaded', 'success');
          } catch (err) {
            hideLoading();
            toast(err.message || 'Upload failed', 'error');
            addActivity({ text: 'Upload failed: ' + slot, ok: false });
          }
        });

        input.click();
      }

        var send = $('apiSend');
        if (send) send.addEventListener('click', async function () {
          if (!st.url) { toast('URL required', 'error'); return; }

          var qs = st.form.params
            .filter(function (r) { return r.key; })
            .map(function (r) { return encodeURIComponent(r.key) + '=' + encodeURIComponent(r.value); })
            .join('&');
          var url = st.url + (qs ? (st.url.indexOf('?') >= 0 ? '&' : '?') + qs : '');

          var headers = {};
          for (var h = 0; h < st.form.headers.length; h++) {
            var hdr = st.form.headers[h];
            if (hdr.key) headers[hdr.key] = hdr.value;
          }
          if (st.auth.kind === 'bearer') headers['Authorization'] = 'Bearer ' + st.auth.token;
          else if (st.auth.kind === 'basic') headers['Authorization'] = 'Basic ' + btoa(st.auth.user + ':' + st.auth.pass);
          else if (st.auth.kind === 'apikey') headers[st.auth.header] = st.auth.value;

          var opts = { method: st.method, headers: headers };
          if (['POST','PUT','PATCH'].indexOf(st.method) >= 0 && st.bodyKind !== 'none' && st.bodyText) {
            opts.body = st.bodyText;
            if (st.bodyKind === 'json') headers['Content-Type'] = headers['Content-Type'] || 'application/json';
          }

          var start = performance.now();
          var respEl = $('apiResponse');
          if (respEl) respEl.innerHTML = '<div class="drawer-empty">Sending…</div>';

          try {
            var r = await fetch(url, opts);
            var ms = Math.round(performance.now() - start);
            var text = await r.text();
            var pretty = text;
            try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (ignore) {}

            var box = $('apiResponse');

                '</div>' +
                '<pre class="drawer-code">' + esc(pretty) + '</pre>' +

              var cp = $('apiCopyRes');
              if (cp) cp.addEventListener('click', function () {
                copyText(pretty).then(function () { toast('Copied', 'success'); });
              });
            }
          } catch (err) {
            var box2 = $('apiResponse');
            if (box2) {
              var msg = err && err.message ? err.message : 'Network error';
              box2.innerHTML =
                '<div class="api-status"><span class="status-pill bad">Network error</span></div>' +
                '<pre class="drawer-code">' + esc(msg) + '</pre>';
            }
          }
        });
      }

        function renderFormJsonTool(mount) {
          var st = { rows: [{ key: 'name', type: 'string', value: '' }] };
          var compute = function () {
            var out = {};
            for (var i = 0; i < st.rows.length; i++) {
              var r = st.rows[i];
              if (!r.key) continue;
              var v = r.value;
              if (r.type === 'number') v = v === '' ? 0 : +v;
              else if (r.type === 'boolean') v = r.value === 'true' || r.value === true;
              else if (r.type === 'null') v = null;
              else if (r.type === 'array') v = String(v || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
              out[r.key] = v;
            }
            return out;
          };
          var render = function () {
            mount.innerHTML =
              '<div class="fj">' +
                '<div class="fj-form">' +
                  st.rows.map(function (r, i) {

                      '<input class="input" placeholder="key" data-k="' + i + '" value="' + attr(r.key) + '">' +
                      '<select class="select" data-t="' + i + '">' +
                        ['string','number','boolean','array','null'].map(function (t) { return '<option ' + (r.type === t ? 'selected' : '') + '>' + t + '</option>'; }).join('') +
                      '</select>' +
                      '<input class="input" placeholder="value" data-v="' + i + '" value="' + attr(r.value) + '">' +
                      '<button class="btn btn-sm btn-ghost" data-del="' + i + '" type="button">' + icon('x', 10, 2.4) + '</button>' +
                    '</div>';

                  '<button class="btn btn-sm btn-secondary" id="fjAdd" type="button">' + icon('plus', 10, 2.4) + ' Add field</button>' +
                '</div>' +
                '<div class="fj-json">' +
                  '<pre class="drawer-code">' + esc(JSON.stringify(compute(), null, 2)) + '</pre>' +
                  '<button class="btn btn-sm btn-secondary" id="fjCopy" type="button">' + icon('copy', 10, 2.4) + ' Copy JSON</button>' +
                '</div>' +
              '</div>';
            var ks = mount.querySelectorAll('[data-k]');
            for (var a = 0; a < ks.length; a++) {
              (function (el) { el.addEventListener('input', function () { st.rows[+el.dataset.k].key = el.value; render(); }); })(ks[a]);
            }
            var ts = mount.querySelectorAll('[data-t]');
            for (var b = 0; b < ts.length; b++) {
              (function (el) { el.addEventListener('change', function () { st.rows[+el.dataset.t].type = el.value; render(); }); })(ts[b]);

            var vs = mount.querySelectorAll('[data-v]');

            }
            var ds = mount.querySelectorAll('[data-del]');
            for (var d = 0; d < ds.length; d++) {
              (function (btn) { btn.addEventListener('click', function () { st.rows.splice(+btn.dataset.del, 1); render(); }); })(ds[d]);

            if (add) add.addEventListener('click', function () { st.rows.push({ key: '', type: 'string', value: '' }); render(); });
            var cp = $('fjCopy');
            if (cp) cp.addEventListener('click', function () { copyText(JSON.stringify(compute(), null, 2)).then(function () { toast('Copied', 'success'); }); });
          };
          render();
        }

          var wireGrid = function () {

        function renderMarkdownTool(mount) {
        mount.innerHTML =

              '<button class="md-btn" data-cmd="quote" title="Quote" type="button">' + icon('quote', 12, 2.2) + '</button>' +
              '<span class="md-sep"></span>' +
              '<button class="md-btn" data-cmd="link" title="Link" type="button">' + icon('link', 12, 2.2) + '</button>' +

            '</div>' +
            '<div class="md-output">' +
              '<div class="md-output-tabs">' +
                '<button class="md-otab active" data-otab="md" type="button">Markdown</button>' +
                '<button class="md-otab" data-otab="html" type="button">HTML</button>' +
                '<button class="md-otab" data-otab="text" type="button">Plain text</button>' +

                '<button class="btn btn-sm btn-secondary" id="mdCopy" type="button">' + icon('copy', 10, 2.4) + ' Copy</button>' +
                '<button class="btn btn-sm btn-secondary" id="mdDownloadMd" type="button">' + icon('download', 10, 2.4) + ' .md</button>' +
                '<button class="btn btn-sm btn-secondary" id="mdDownloadHtml" type="button">' + icon('download', 10, 2.4) + ' .html</button>' +
              '</div>' +

        var editor = $('mdEditor');
        var rendered = $('mdRendered');
        var out = $('mdOut');
        if (!editor || !rendered || !out) return;

        var lastMd = '';
        var lastHtml = '';
        var lastText = '';
        var mode = 'md';

        var simpleMarkdown = function (md) {
          var html = esc(md);
          html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
          html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
          html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
          html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
          html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
          html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
          html = html.replace(/\n\n/g, '</p><p>');
          html = '<p>' + html + '</p>';
          return html;
        };

        var recompute = function () {
          var html = editor.innerHTML || '';
          try {
            if (window.TurndownService) {
              var td = new window.TurndownService({ headingStyle: 'atx', bulletListMarker: '-', codeBlockStyle: 'fenced' });
              lastMd = td.turndown(html);
            } else {
              lastMd = html.replace(/<[^>]+>/g, '');
            }
          } catch (e) {
            lastMd = html.replace(/<[^>]+>/g, '');
          }
          try {
            if (window.marked) {
              lastHtml = window.marked.parse(lastMd);
            } else {
              lastHtml = simpleMarkdown(lastMd);
            }
          } catch (e) {
            lastHtml = html;
          }
          lastText = editor.innerText || '';
          rendered.innerHTML = lastHtml;
          out.textContent = mode === 'md' ? lastMd : mode === 'html' ? lastHtml : lastText;
        };

        var loadLibs = function () {
          var s1 = document.createElement('script');
          s1.src = 'https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js';
          s1.onload = recompute;
          s1.onerror = recompute;
          document.head.appendChild(s1);

          var s2 = document.createElement('script');
          s2.src = 'https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js';
          s2.onload = recompute;
          s2.onerror = function () {};
          document.head.appendChild(s2);
        };
        loadLibs();

        editor.addEventListener('input', debounce(recompute, 200));

        var exec = function (cmd) {
          editor.focus();
          if (cmd === 'h1') document.execCommand('formatBlock', false, 'h1');
          else if (cmd === 'h2') document.execCommand('formatBlock', false, 'h2');
          else if (cmd === 'ul') document.execCommand('insertUnorderedList');
          else if (cmd === 'ol') document.execCommand('insertOrderedList');
          else if (cmd === 'quote') document.execCommand('formatBlock', false, 'blockquote');
          else if (cmd === 'bold') document.execCommand('bold');
          else if (cmd === 'italic') document.execCommand('italic');
          else if (cmd === 'underline') document.execCommand('underline');
          else if (cmd === 'clear') document.execCommand('removeFormat');
          else if (cmd === 'link') {
            var url = prompt('URL:');
            if (url) document.execCommand('createLink', false, url);
          } else if (cmd === 'image') {

            if (imgUrl) document.execCommand('insertImage', false, imgUrl);

        var cmdBtns = mount.querySelectorAll('[data-cmd]');

        editor.addEventListener('keydown', function (e) {

              recompute();

        }

        $('mdCopy').addEventListener('click', function () {

        });

        recompute();
      }

        function hexToRgb(hex) {
          var m = hex.replace('#', '').match(/.{1,2}/g);
          if (!m) return { r: 0, g: 0, b: 0 };
          return { r: parseInt(m[0], 16), g: parseInt(m[1], 16), b: parseInt(m[2], 16) };
        }
        function rgbToHsl(r, g, b) {
          r /= 255; g /= 255; b /= 255;
          var max = Math.max(r, g, b), min = Math.min(r, g, b);
          var h = 0, s = 0, l = (max + min) / 2;
          if (max !== min) {
            var d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h /= 6;
          }
          return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }
        function luminance(r, g, b) {
          var rs = r / 255, gs = g / 255, bs = b / 255;
          rs = rs <= 0.03928 ? rs / 12.92 : Math.pow((rs + 0.055) / 1.055, 2.4);
          gs = gs <= 0.03928 ? gs / 12.92 : Math.pow((gs + 0.055) / 1.055, 2.4);
          bs = bs <= 0.03928 ? bs / 12.92 : Math.pow((bs + 0.055) / 1.055, 2.4);
          return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
        }
        function contrast(a, b) {
          var c1 = hexToRgb(a), c2 = hexToRgb(b);
          var l1 = luminance(c1.r, c1.g, c1.b), l2 = luminance(c2.r, c2.g, c2.b);
          return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
        }

          var update = function (hex) {

          var updateContrast = function () {

        // ═══════════════════════════════════════════════════════════
        // TOOL: BASE64
        // ═══════════════════════════════════════════════════════════
        function renderBase64Tool(mount) {
          mount.innerHTML =
            '<div class="tool-pair">' +
              '<div class="tool-pair-left">' +
                '<div class="fg-pills" id="b64Mode">' +
                  '<button class="pill active" data-mode="encode" type="button">Encode</button>' +
                  '<button class="pill" data-mode="decode" type="button">Decode</button>' +
                '</div>' +
                '<div class="fg-field"><label>Input</label><textarea id="b64In" class="textarea mono" rows="8"></textarea></div>' +
                '<div class="fg-field"><label><input type="checkbox" id="b64UrlSafe"> URL-safe</label></div>' +
              '</div>' +
              '<div class="tool-pair-right">' +
                '<div class="fg-field"><label>Output</label><textarea id="b64Out" class="textarea mono" rows="8" readonly></textarea></div>' +
                '<div class="preview-actions">' +
                  '<button class="btn btn-primary btn-sm" id="b64Copy" type="button">' + icon('copy', 10, 2.4) + ' Copy</button>' +
                  '<button class="btn btn-secondary btn-sm" id="b64Clear" type="button">' + icon('trash', 10, 2.4) + ' Clear</button>' +
                '</div>' +
              '</div>' +
            '</div>';
          var mode = 'encode';
          var convert = function () {
            var input = $('b64In').value, urlSafe = $('b64UrlSafe').checked;
            try {
              var output = '';
              if (mode === 'encode') {
                var b64 = btoa(unescape(encodeURIComponent(input)));
                if (urlSafe) b64 = b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
                output = b64;
              } else {
                var prep = input;
                if (urlSafe) prep = prep.replace(/-/g, '+').replace(/_/g, '/');
                while (prep.length % 4) prep += '=';
                output = decodeURIComponent(escape(atob(prep)));
              }
              $('b64Out').value = output;
            } catch (e) {
              $('b64Out').value = '⚠ Invalid input for ' + mode;
            }
          };
          var modes = mount.querySelectorAll('[data-mode]');
          for (var i = 0; i < modes.length; i++) {
            (function (b) {
              b.addEventListener('click', function () {
                mode = b.dataset.mode;
                var all = mount.querySelectorAll('[data-mode]');
                for (var k = 0; k < all.length; k++) all[k].classList.toggle('active', all[k] === b);
                convert();
              });
            })(modes[i]);
          }
          $('b64In').addEventListener('input', debounce(convert, 150));
          $('b64UrlSafe').addEventListener('change', convert);
          $('b64Copy').addEventListener('click', function () { copyText($('b64Out').value).then(function () { toast('Copied', 'success'); }); });
          $('b64Clear').addEventListener('click', function () { $('b64In').value = ''; $('b64Out').value = ''; });
        }

        // ═══════════════════════════════════════════════════════════
        // SEARCH
        // ═══════════════════════════════════════════════════════════
        function openSearchOverlay() {
          S.searchOverlayOpen = true;
          S.searchSelectedIndex = 0;
          var o = $('searchOverlay'); if (o) o.classList.add('active');
          var i = $('searchInput'); if (i) i.value = '';
          updateSearchResults('');
          setTimeout(function () { var inp = $('searchInput'); if (inp) inp.focus(); }, 80);
        }
        function closeSearchOverlay() {
          S.searchOverlayOpen = false;
          var o = $('searchOverlay'); if (o) o.classList.remove('active');
        }
        function updateSearchResults(query) {
          var q = String(query || '').trim().toLowerCase();
          var list;
          if (q) {
            list = TOOLS.filter(function (t) {
              if (t.name.toLowerCase().indexOf(q) >= 0) return true;
              if (t.id.indexOf(q) >= 0) return true;
              if (t.aliases && t.aliases.some(function (a) { return a.indexOf(q) >= 0; })) return true;
              if (t.tags && t.tags.some(function (tag) { return tag.indexOf(q) >= 0; })) return true;
              return false;
            });
          } else {
            list = TOOLS.slice(0, 8);
          }
          S.searchMatches = list;
          S.searchSelectedIndex = Math.min(S.searchSelectedIndex, Math.max(0, list.length - 1));
          var el = $('searchResults');
          if (!el) return;
          if (!list.length) { el.innerHTML = '<div class="search-empty">No matches for "' + esc(query) + '"</div>'; return; }
          el.innerHTML = list.map(function (t, i) {
            return '<div class="search-result ' + (i === S.searchSelectedIndex ? 'selected' : '') + '" data-sid="' + attr(t.id) + '">' +
              '<div class="search-result-icon">' + icon(t.icon, 13, 2.2) + '</div>' +
              '<div class="search-result-text">' +
                '<div class="search-result-title">' + esc(t.name) + '</div>' +
                '<div class="search-result-sub">' + esc(t.desc || '') + '</div>' +
              '</div>' +
              '<div class="search-result-arrow">' + icon('chevronRight', 11, 2.4) + '</div>' +
            '</div>';
          }).join('');
          var rows = el.querySelectorAll('[data-sid]');
          for (var k = 0; k < rows.length; k++) {
            (function (r) {
              r.addEventListener('click', function () { closeSearchOverlay(); openTool(r.dataset.sid); });
            })(rows[k]);
          }
        }

        // ═══════════════════════════════════════════════════════════
        // BOOT
        // ═══════════════════════════════════════════════════════════
        function boot() {
          readSession();
           // Check for editor handoff
  const handoff = checkEditorHandoff();
  if (handoff) {
    showEditorHandoffBanner(handoff);
    // Force image-generator tool to be active
    setTimeout(() => {
      if (typeof openTool === 'function') openTool('image-generator');
    }, 100);
  }
          S.recentTools = readJSON(STORAGE.recentTools, []);
          S.sidebarCollapsed = readJSON(STORAGE.sidebarCollapsed, false) === true;
          loadActivity();
          loadStorage();
          wireOffline();

          var id = currentId();
          if (id) {
            var tool = toolBySlugOrAlias(id);
            if (tool) { S.activeTool = tool.id; setId(tool.id, { replace: true }); }
            else { toast('Tool "' + id + '" not found', 'warning'); S.activeTool = null; }
          }

          applySidebarState();
          renderAll();

          window.addEventListener('popstate', function () {
            var t = toolBySlugOrAlias(currentId());
            S.activeTool = t ? t.id : null;
            renderAll();
          });

          var btnSidebar = $('btnSidebar'); if (btnSidebar) btnSidebar.addEventListener('click', toggleSidebar);
          var btnCollapse = $('btnCollapseSidebar'); if (btnCollapse) btnCollapse.addEventListener('click', function () {
            if (window.innerWidth >= 1024) {
              S.sidebarCollapsed = true;
              writeJSON(STORAGE.sidebarCollapsed, true);
              applySidebarState();
              renderSidebar();
            } else {
              closeSidebarDrawer();
            }
          });
          var btnUsage = $('btnUsage'); if (btnUsage) btnUsage.addEventListener('click', function () {
            if (window.innerWidth >= 1024 && S.sidebarCollapsed) {
              S.sidebarCollapsed = false;
              writeJSON(STORAGE.sidebarCollapsed, false);
              applySidebarState();
              renderSidebar();
            } else if (window.innerWidth < 1024) {
              S.sidebarOpen = true;
              applySidebarState();
              renderSidebar();
            }
            var sb = $('sidebarBody'); if (sb) sb.scrollTop = 0;
          });
          var btnSearch = $('btnSearch'); if (btnSearch) btnSearch.addEventListener('click', openSearchOverlay);

          var bd = $('sidebarBackdrop'); if (bd) bd.addEventListener('click', closeSidebarDrawer);

          var so = $('searchOverlay');
          if (so) so.addEventListener('click', function (e) { if (e.target === so) closeSearchOverlay(); });
          var si = $('searchInput');
          if (si) {
            si.addEventListener('input', function (e) { S.searchSelectedIndex = 0; updateSearchResults(e.target.value); });
            si.addEventListener('keydown', function (e) {
              if (e.key === 'ArrowDown') { e.preventDefault(); S.searchSelectedIndex = Math.min(S.searchSelectedIndex + 1, S.searchMatches.length - 1); updateSearchResults(si.value); }
              else if (e.key === 'ArrowUp') { e.preventDefault(); S.searchSelectedIndex = Math.max(0, S.searchSelectedIndex - 1); updateSearchResults(si.value); }
              else if (e.key === 'Enter') { var t = S.searchMatches[S.searchSelectedIndex]; if (t) { closeSearchOverlay(); openTool(t.id); } }
              else if (e.key === 'Escape') closeSearchOverlay();
            });
          }

          var mo = $('modalOverlay');
          if (mo) mo.addEventListener('click', function (e) { if (e.target === mo) closeModal(); });

          document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
              var mo2 = $('modalOverlay');
              if (mo2 && mo2.classList.contains('active')) { closeModal(); return; }
              if (S.searchOverlayOpen) { closeSearchOverlay(); return; }
              if (S.sidebarOpen && window.innerWidth < 1024) { closeSidebarDrawer(); return; }
            }
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearchOverlay(); }
          });

          window.addEventListener('resize', function () { applySidebarState(); renderSidebar(); });

          if (navigator.onLine) fetchUsage().then(function () { updateHeaderUsage(); renderSidebar(); }).catch(function () {});
        }

        window.FolioTools = { openTool: openTool, closeTool: closeTool, toast: toast };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            try { boot(); } catch (err) { window.__folioBootError(err); }
          });
        } else {
          try { boot(); } catch (err) { window.__folioBootError(err); }
        }

        } catch (outerErr) {
          console.error('[tools] Fatal:', outerErr);
          window.__folioBootError(outerErr);
        }
      })();
    </script>
