<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>AI — Folio</title>
<meta name="theme-color" content="#0a0c10" id="themeColorMeta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png" id="pageFavicon">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
(function () {
  try {
    var pref = localStorage.getItem("folio.theme") || "dark";
    var resolved = pref;
    if (pref === "auto" || pref === "system") {
      resolved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    }
    if (resolved === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");
    if (localStorage.getItem("folio.reducedMotion") === "true") {
      document.documentElement.setAttribute("data-reduced-motion", "true");
    }
    var meta = document.getElementById("themeColorMeta");
    if (meta) meta.setAttribute("content", resolved === "light" ? "#f7f8fa" : "#0a0c10");
  } catch (e) {}
})();
</script>

<script type="importmap">
{
  "imports": {
    "codemirror/": "https://deno.land/x/codemirror_esm@v6.0.1/esm/"
  }
}
</script>

<link rel="stylesheet" href="/css/ai.css">
</head>
<body>

<div class="ai-app" id="aiApp">

  <!-- ═══════════════ HEADER ═══════════════ -->
  <header class="ai-header" id="aiHeader">
    <button class="ai-rail-toggle" id="railToggle" aria-label="Toggle sidebar" title="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <button class="ai-header-identity" id="headerIdentity" type="button" aria-label="Switch project">
      <div class="ai-header-icon" id="headerIcon">—</div>
      <div class="ai-header-text">
        <h1 class="ai-header-title" id="headerTitle">Loading…</h1>
        <div class="ai-header-sub" id="headerSub"></div>
      </div>
    </button>

    <div class="ai-header-actions">
      <button class="ai-header-btn ai-header-btn-primary" id="btnAskAI" type="button" title="Focus AI bar (⌘K)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7L19.7 10l-5.8 1.3L12 17l-1.9-5.7L4.3 10l5.8-1.3z"/></svg>
        <span>Ask AI</span>
      </button>
      <button class="ai-header-btn" id="btnMore" aria-label="More" title="More">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>
  </header>

  <!-- ═══════════════ MODE BANNER ═══════════════ -->
  <div class="ai-banner" id="modeBanner" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span class="ai-banner-text" id="modeBannerText"></span>
    <button class="ai-banner-action" id="modeBannerAction" type="button">Sync</button>
  </div>

  <!-- ═══════════════ BODY ═══════════════ -->
  <div class="ai-body" id="aiBody">

    <!-- SIDEBAR -->
    <aside class="sb" id="sb" aria-label="Sidebar">
      <header class="sb-header">
        <span class="sb-title" id="sbTitle">Files</span>
        <button class="sb-close" id="sbClose" aria-label="Close">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <nav class="sb-tabs" id="sbTabs" role="tablist"></nav>
      <div class="sb-body" id="sbBody"></div>
    </aside>
    <div class="sb-backdrop" id="sbBackdrop"></div>

    <!-- MAIN AREA -->
    <main class="ai-main" id="aiMain">

      <!-- AI COMMAND BAR -->
      <div class="ai-commandbar" id="aiCommandBar">
        <div class="ai-commandbar-row">
          <span class="ai-commandbar-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7L19.7 10l-5.8 1.3L12 17l-1.9-5.7L4.3 10l5.8-1.3z"/></svg>
          </span>
          <input
            type="text"
            class="ai-commandbar-input"
            id="aiCommandInput"
            placeholder="Ask, or type @ to add a file…"
            autocomplete="off"
            spellcheck="false"
          >
          <button class="ai-commandbar-submit" id="aiCommandSubmit" aria-label="Run" title="Run (⌘↵)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
        </div>
        <div class="ai-commandbar-chips" id="aiCommandChips"></div>
        <div class="ai-commandbar-suggest" id="aiCommandSuggest"></div>
      </div>

      <!-- Files -->
      <section class="ai-view" data-view="files" hidden>
        <div class="files-layout">
          <div class="editor-pane" id="editorPane">
            <div class="editor-tabs" id="editorTabs" style="display:none;"></div>
            <div class="editor-container" id="editorContainer"></div>
            <div class="editor-empty" id="editorEmpty">
              <div class="editor-empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              </div>
              <div class="editor-empty-title">No file open</div>
              <div class="editor-empty-desc">Pick a file from the sidebar to start editing.</div>
            </div>
            <div class="editor-loading" id="editorLoading" hidden>
              <div class="spinner"></div>
              <div>Loading editor…</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Docs -->
      <section class="ai-view" data-view="docs" hidden>
        <div class="docs-layout">
          <div class="docs-main">
            <div class="docs-head">
              <div class="docs-active-file">
                <span id="docsActivePath">—</span>
              </div>
              <div class="docs-mode-switch" role="radiogroup">
                <button type="button" data-mode="edit" class="active">Edit</button>
                <button type="button" data-mode="preview">Preview</button>
                <button type="button" data-mode="focus">Focus</button>
              </div>
              <button class="btn btn-primary btn-sm" id="docsSave" type="button" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                Save
              </button>
            </div>
            <div class="docs-toolbar" id="docsToolbar"></div>
            <div class="docs-panes" id="docsPanes" data-mode="edit">
              <div class="docs-pane">
                <textarea class="docs-source" id="docsSource" spellcheck="false" placeholder="Start writing markdown…"></textarea>
              </div>
              <div class="docs-pane">
                <div class="docs-preview ai-markdown" id="docsPreview"></div>
              </div>
            </div>
            <div class="docs-review" id="docsReview" hidden></div>
          </div>
        </div>
      </section>

      <!-- History -->
      <section class="ai-view" data-view="history" hidden></section>

      <!-- Commits -->
      <section class="ai-view" data-view="commits" hidden></section>

      <!-- Notes -->
      <section class="ai-view" data-view="notes" hidden></section>

      <!-- Info -->
      <section class="ai-view" data-view="info" hidden></section>
    </main>

    <!-- AI DRAWER -->
    <aside class="ai-drawer" id="aiDrawer" aria-label="Ask AI">
      <div class="ai-drawer-head">
        <div class="ai-drawer-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7L19.7 10l-5.8 1.3L12 17l-1.9-5.7L4.3 10l5.8-1.3z"/></svg>
          <span>Ask AI</span>
        </div>
        <button class="icon-btn" id="drawerClose" aria-label="Close AI panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="ai-drawer-body">
        <div class="ai-drawer-controls">
          <div class="ai-chips" id="drawerChips"></div>
          <div class="ai-detected-task" id="drawerDetectedTask" hidden></div>
          <div class="ai-info-bar" id="infoBar" hidden></div>
          <button class="ai-run-btn" id="btnRun" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span id="btnRunLabel">Run</span>
          </button>
        </div>

        <div class="ai-drawer-result" id="drawerResult">
          <div class="ai-result-empty" id="resultEmpty">
            <div class="ai-result-empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7L19.7 10l-5.8 1.3L12 17l-1.9-5.7L4.3 10l5.8-1.3z"/></svg>
            </div>
            <div class="ai-result-empty-title">Ask anything</div>
            <div class="ai-result-empty-hint">Type a prompt in the AI bar.</div>
          </div>
          <div class="ai-result-loading" id="resultLoading" hidden>
            <div class="spinner"></div>
            <div class="ai-result-loading-text" id="resultLoadingText">Running…</div>
          </div>
          <div class="ai-result-content" id="resultContent" hidden></div>
        </div>

        <div class="ai-drawer-footer">
          <div class="ai-quota-hud" id="quotaHud"></div>
        </div>
      </div>
    </aside>

    <div class="ai-drawer-backdrop" id="drawerBackdrop"></div>
  </div>

  <!-- ═══════════════ STATUS BAR ═══════════════ -->
  <footer class="ai-status" id="statusBar">
    <div class="ai-status-left">
      <span id="statusFile">—</span>
      <span class="ai-status-sep">·</span>
      <span id="statusSize">0 B</span>
    </div>
    <div class="ai-status-right">
      <button class="ai-status-pending" id="statusPending" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="statusPendingText">0 staged</span>
      </button>
      <span id="statusSync">Idle</span>
    </div>
  </footer>
</div>

<!-- CONFIRM DIALOG -->
<div class="ai-sheet" id="confirmDialog" role="alertdialog" aria-modal="true">
  <div class="ai-sheet-handle"></div>
  <div class="ai-sheet-body" style="padding:20px 16px;text-align:center;">
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <h2 class="ai-sheet-title" id="confirmTitle" style="margin-bottom:6px;">Confirm</h2>
    <p class="confirm-message" id="confirmMessage">Are you sure?</p>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="confirmCancel" type="button">Cancel</button>
      <button class="btn btn-danger" id="confirmOk" type="button">Delete</button>
    </div>
  </div>
</div>

<!-- PENDING SHEET -->
<div class="ai-sheet" id="pendingSheet" role="dialog" aria-modal="true">
  <div class="ai-sheet-handle"></div>
  <div class="ai-sheet-header">
    <h2 class="ai-sheet-title">Staged proposals</h2>
    <button class="ai-sheet-close" id="pendingClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="ai-sheet-body" id="pendingBody"></div>
</div>

<!-- OVERLAYS -->
<div class="ai-backdrop" id="backdrop"></div>
<div class="ai-toast-container" id="toastContainer" aria-live="polite"></div>

<!-- @-PICKER POPOVER -->
<div class="ai-at-popover" id="atPopover" hidden>
  <div class="ai-at-popover-head">
    <span>Add context</span>
    <button type="button" class="ai-at-popover-close" id="atPopoverClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <input type="text" class="ai-at-popover-input" id="atPopoverFilter" placeholder="Filter files…" autocomplete="off" spellcheck="false">
  <div class="ai-at-popover-list" id="atPopoverList"></div>
</div>

<!-- EMPTY STATE -->
<div class="empty-project-state hidden" id="emptyState" role="dialog" aria-modal="true">
  <div class="empty-project-card">
    <div class="empty-project-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <h2 class="empty-project-title" id="emptyStateTitle">No project selected</h2>
    <p class="empty-project-desc" id="emptyStateDesc">Pick a project to start.</p>
    <div class="empty-project-actions">
      <button class="btn btn-primary" id="emptyPickProject" type="button">Choose project</button>
      <button class="btn btn-secondary" id="emptyNewProject" type="button">New project</button>
    </div>
  </div>
</div>

<!-- SVG SPRITE -->

  <defs>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>

    <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 12h18"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
    <symbol id="i-file-code" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="10 13 8 15 10 17"/><polyline points="14 13 16 15 14 17"/></symbol>
    <symbol id="i-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>

    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.9 5.7L19.7 10l-5.8 1.3L12 17l-1.9-5.7L4.3 10l5.8-1.3z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></symbol>
    <symbol id="i-wifi-off" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/></symbol>

    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></symbol>
    <symbol id="i-bold" viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 0 8H6z"/><path d="M6 12h9a4 4 0 0 1 0 8H6z"/></symbol>
    <symbol id="i-italic" viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></symbol>
    <symbol id="i-strike" viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></symbol>
    <symbol id="i-h1" viewBox="0 0 24 24"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="M17 10l2-2v10"/></symbol>
    <symbol id="i-h2" viewBox="0 0 24 24"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="M21 18h-4c0-4 4-3 4-6 0-1.5-2-2.5-4-1"/></symbol>

// ─── Helpers ─────────────────────────────────────────────────────

function formatRelativeReset(resetAt) {
  if (!resetAt) return "";
  const ms = new Date(resetAt).getTime() - Date.now();
  if (!Number.isFinite(ms) || ms <= 0) return "now";
  const mins = Math.round(ms / 60000);
  if (mins < 60) return `in ${mins}m`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `in ${hours}h`;
  return `in ${Math.round(hours / 24)}d`;
}

// ─── Config ──────────────────────────────────────────────────────

const DB_NAME = "folio";
const DB_VERSION = 3;

  "linear-gradient(135deg, #0284c7, #0369a1)",
  "linear-gradient(135deg, #a855f7, #6d28d9)",

];

  { task: "simulate",   match: /\b(trace|simulate|step through|walk through|execution)\b/i },
  { task: "diagram",    match: /\b(diagram|draw|visualize|flowchart|visualize|visuali[sz]e)\b/i },

// ─── DOM / utils ────────────────────────────────────────────────

const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(node.style, v);
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else if (k === "dataset" && typeof v === "object") Object.assign(node.dataset, v);
    else if (k === "html") node.innerHTML = String(v);
    else if (v === true) node.setAttribute(k, "");
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    if (typeof c === "string" || typeof c === "number") node.appendChild(document.createTextNode(String(c)));
    else if (c instanceof Node) node.appendChild(c);
  }
  return node;
}

function icon(name, size = 12) {
  const NS = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("width", String(size));
  s.setAttribute("height", String(size));
  s.setAttribute("fill", "none");
  s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "2");
  s.setAttribute("stroke-linecap", "round");
  s.setAttribute("stroke-linejoin", "round");
  s.setAttribute("aria-hidden", "true");
  const u = document.createElementNS(NS, "use");
  u.setAttribute("href", `#i-${name}`);
  s.appendChild(u);
  return s;
}

function iconHTML(name, size = 12) {
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function getInitials(name) {
  const s = String(name || "").trim();
  if (!s) return "?";
  const parts = s.split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function getAvatarColor(seed) {
  const s = String(seed || "");
  let hash = 0;
  for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_GRADIENTS[Math.abs(hash) % AVATAR_GRADIENTS.length];
}

function isSystemFile(path) {
  return path === NOTES_PATH
    || /(^|\/)\.gitkeep$/i.test(path)
    || /(^|\/)\.keep$/i.test(path);
}

function isDocsFile(path) {
  return DOCS_PATH_RE.test(path) && !isSystemFile(path);
}

function isTextFile(path) {
  return /\.(html?|css|js|mjs|cjs|jsx|tsx?|py|json|md|txt|ya?ml)$/i.test(path);
}

function fileIconName(path) {
  const ext = (path.split(".").pop() || "").toLowerCase();
  if (["html","htm","css","scss","less","js","mjs","cjs","jsx","ts","tsx"].includes(ext)) return "file-code";
  if (ext === "json") return "file";
  if (["md","markdown","txt"].includes(ext)) return "file-text";
  if (["png","jpg","jpeg","gif","svg","webp"].includes(ext)) return "image";
  return "file";
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function relativeTime(ts) {
  if (!ts) return "";
  const d = Date.now() - ts;
  if (d < 60000) return "just now";
  const m = Math.floor(d / 60000);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return new Date(ts).toLocaleDateString();
}

function estimateSize(v) {
  if (typeof v === "string") return v.length;
  try { return JSON.stringify(v).length; } catch { return 0; }
}

function formatBytes(n) {
  if (!n || n < 0) return "0 B";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n < 10 ? n.toFixed(1) : Math.round(n)} ${u[i]}`;
}

// ─── Intent classifier ──────────────────────────────────────────

function classifyIntent(prompt, chips) {
  const text = String(prompt || "").trim();

  // Empty prompt with chips → decide based on what's chipped
  if (!text) {
    const hasProject = chips.some(c => c.type === "project");
    const hasSelection = chips.some(c => c.type === "selection");
    if (hasSelection) return "explain";
    if (hasProject) return "explain";
    return "explain";
  }

  for (const rule of INTENT_RULES) {
    if (rule.match.test(text)) return rule.task;
  }
  return "explain";
}

function taskLabel(taskId) {
  const meta = getTaskMeta(taskId);
  return meta?.label || taskId;
}

// ─── IndexedDB ──────────────────────────────────────────────────

let dbConn = null;

function openDB() {
  if (dbConn) return Promise.resolve(dbConn);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onblocked = () => {
      setTimeout(() => {
        try { req.result?.close?.(); } catch {}
        dbConn = null;
        openDB().then(resolve, reject);
      }, 800);
    };
    req.onsuccess = () => { dbConn = req.result; resolve(dbConn); };
    req.onupgradeneeded = (event) => {
      const conn = event.target.result;
      if (!conn.objectStoreNames.contains("projects")) conn.createObjectStore("projects", { keyPath: "pid" });
      if (!conn.objectStoreNames.contains("files")) {
        const store = conn.createObjectStore("files", { keyPath: ["pid", "path"] });
        store.createIndex("pid", "pid");
      }
      if (!conn.objectStoreNames.contains("versions")) {
        const store = conn.createObjectStore("versions", { keyPath: "vid" });
        store.createIndex("pid", "pid");
      }
      if (!conn.objectStoreNames.contains("projectMeta")) conn.createObjectStore("projectMeta", { keyPath: "pid" });
      if (!conn.objectStoreNames.contains("syncQueue")) conn.createObjectStore("syncQueue", { keyPath: "id", autoIncrement: true });
      if (!conn.objectStoreNames.contains("folders")) {
        const store = conn.createObjectStore("folders", { keyPath: ["pid", "path"] });
        store.createIndex("pid", "pid");
      }
    };
  });
}

function dbWrap(req) {
  return new Promise((res, rej) => {
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

function dbTx(store, mode = "readonly") { return dbConn.transaction(store, mode).objectStore(store); }

const idb = {
  getProject: (pid) => dbWrap(dbTx("projects").get(pid)),
  putProject: (p) => dbWrap(dbTx("projects", "readwrite").put(p)),
  listProjects: () => dbWrap(dbTx("projects").getAll()),
  listFiles: (pid) => dbWrap(dbTx("files").index("pid").getAll(pid)),
  getFile: (pid, path) => dbWrap(dbTx("files").get([pid, path])),
  putFile: (pid, path, content) => dbWrap(dbTx("files", "readwrite").put({ pid, path, content, updatedAt: Date.now() })),
  deleteFile: (pid, path) => dbWrap(dbTx("files", "readwrite").delete([pid, path])),
  listVersions: async (pid) => {
    const all = await dbWrap(dbTx("versions").index("pid").getAll(pid));
    return all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  },
  getProjectMeta: async (pid) => {
    const m = await dbWrap(dbTx("projectMeta").get(pid));
    return m || { pid, notepad: "", meta: {}, coverMeta: {}, docs: { version: 1, entries: {} } };
  },
  setProjectMeta: async (pid, patch) => {
    const current = await idb.getProjectMeta(pid);
    return dbWrap(dbTx("projectMeta", "readwrite").put({ ...current, ...patch, pid }));
  },
};

// ─── Session / API ──────────────────────────────────────────────

function readSession() {
  try { STATE.session = localStorage.getItem(STORAGE.session); } catch {}
  try {
    const raw = localStorage.getItem(STORAGE.user);
    STATE.user = raw ? JSON.parse(raw) : null;
  } catch {}
  STATE.isGuest = !STATE.session;
}

async function apiFetch(url, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (STATE.session) headers["Authorization"] = `Bearer ${STATE.session}`;
  try {
    const res = await fetch(url, { ...opts, headers });
    let data = {};
    try { data = await res.json(); } catch {}
    return { ok: res.ok, status: res.status, data, headers: res.headers };
  } catch (err) {
    return { ok: false, status: 0, data: { error: String(err?.message || "Network error") }, headers: null };
  }
}

// ─── Toast / confirm ────────────────────────────────────────────

function toast(message, type = "info", duration = 2400) {
  const node = el("div", { class: `ai-toast ai-toast-${type}` }, el("span", {}, message));
  $("toastContainer").appendChild(node);
  requestAnimationFrame(() => node.classList.add("show"));
  setTimeout(() => {
    node.classList.remove("show");
    setTimeout(() => node.remove(), 300);
  }, duration);
}
window.toast = toast;

let confirmResolve = null;

function confirmDialog({ title, message, confirmLabel = "Confirm", danger = false }) {
  return new Promise((resolve) => {
    confirmResolve = resolve;
    $("confirmTitle").textContent = title || "Are you sure?";
    $("confirmMessage").textContent = message || "";
    $("confirmOk").textContent = confirmLabel;
    $("confirmOk").className = danger ? "btn btn-danger" : "btn btn-primary";
    $("backdrop").classList.add("visible");
    $("confirmDialog").classList.add("open");
    setTimeout(() => $("confirmCancel")?.focus(), 50);
  });
}

function resolveConfirm(value) {
  $("confirmDialog").classList.remove("open");
  if (!anySheetOpen()) $("backdrop").classList.remove("visible");
  const r = confirmResolve;
  confirmResolve = null;
  if (r) r(value);
}

function anySheetOpen() {
  return !!document.querySelector(".ai-sheet.open");
}

// ─── CodeMirror ─────────────────────────────────────────────────

const cm = {
  async loadModules() {
    if (STATE.editorModules) return STATE.editorModules;
    const [core, oneDark, viewMod, stateMod, langMod] = await Promise.all([
      import("codemirror/codemirror/dist/index.js"),
      import("codemirror/theme-one-dark/dist/index.js"),
      import("codemirror/view/dist/index.js"),
      import("codemirror/state/dist/index.js"),
      import("codemirror/language/dist/index.js"),
    ]);
    STATE.editorModules = {
      basicSetup: core.basicSetup,
      EditorView: viewMod.EditorView,
      EditorState: stateMod.EditorState,
      keymap: viewMod.keymap,
      oneDark: oneDark.oneDark,
      foldGutter: langMod.foldGutter,
      foldKeymap: langMod.foldKeymap,
    };
    return STATE.editorModules;
  },

  async getLangExt(path) {
    if (!path) return null;
    const ext = (path.split(".").pop() || "").toLowerCase();
    try {
      if (["html","htm","xhtml"].includes(ext)) { const m = await import("codemirror/lang-html/dist/index.js"); return m.html(); }
      if (["css","scss","less"].includes(ext)) { const m = await import("codemirror/lang-css/dist/index.js"); return m.css(); }
      if (["js","mjs","cjs","jsx","ts","tsx"].includes(ext)) {
        const m = await import("codemirror/lang-javascript/dist/index.js");
        return m.javascript({ jsx: true, typescript: ext === "ts" || ext === "tsx" });
      }
      if (["json","jsonc"].includes(ext)) { const m = await import("codemirror/lang-json/dist/index.js"); return m.json(); }
      if (["md","markdown"].includes(ext)) { const m = await import("codemirror/lang-markdown/dist/index.js"); return m.markdown(); }
      if (["py"].includes(ext)) { const m = await import("codemirror/lang-python/dist/index.js"); return m.python(); }
    } catch (e) { console.warn("[CM]", ext, e); }
    return null;
  },

  async mount(container, content, path) {
    const m = await this.loadModules();
    this.destroy();

    const langExt = await this.getLangExt(path);
    const extensions = [
      m.basicSetup,
      m.oneDark,
      m.foldGutter(),
      m.keymap.of(m.foldKeymap),
      m.EditorView.theme({
        "&": { fontSize: "13px", height: "100%" },
        ".cm-content": { fontSize: "13px", lineHeight: "1.55" },
        ".cm-gutters": { fontSize: "11px" },
      }),
      m.EditorView.updateListener.of((update) => {
        if (update.docChanged) { markDirty(); scheduleAutosave(); }
      }),
    ];
    if (langExt) extensions.push(langExt);

    const state = m.EditorState.create({ doc: content || "", extensions });
    STATE.editorView = new m.EditorView({ state, parent: container });
  },

  getContent() { return STATE.editorView?.state.doc.toString() || ""; },
  getSelection() {
    if (!STATE.editorView) return "";
    const sel = STATE.editorView.state.selection.main;
    return STATE.editorView.state.sliceDoc(sel.from, sel.to);
  },
  destroy() {
    if (STATE.editorView) { try { STATE.editorView.destroy(); } catch {} STATE.editorView = null; }
  },
};

function markDirty() {
  if (!STATE.activeFile) return;
  const was = STATE.dirtyFiles.size;
  STATE.dirtyFiles.add(STATE.activeFile);
  if (STATE.dirtyFiles.size !== was) renderEditorTabs();
  updateStatusBar();
}

function scheduleAutosave() {
  if (STATE.editorDirtyTimer) clearTimeout(STATE.editorDirtyTimer);
  STATE.editorDirtyTimer = setTimeout(() => {
    if (STATE.activeFile && STATE.dirtyFiles.has(STATE.activeFile)) saveActiveFile({ silent: true });
  }, 2000);
}

function updateStatusBar() {
  $("statusFile").textContent = STATE.activeFile || "—";
  const content = STATE.editorView ? cm.getContent() : "";
  $("statusSize").textContent = formatBytes(estimateSize(content));

  const pending = STATE.aiState?.pending || [];
  if (pending.length) {
    $("statusPending").hidden = false;
    $("statusPendingText").textContent = `${pending.length} staged`;
  } else {
    $("statusPending").hidden = true;
  }

  let sync = "Idle";
  if (STATE.syncState === "local") sync = "Local";
  else if (STATE.syncState === "cached" || !STATE.online) sync = "Offline";
  else if (STATE.session) sync = "Synced";
  else sync = "Guest";
  $("statusSync").textContent = sync;
}

// ─── create-project deps ────────────────────────────────────────

function buildCreateProjectDeps() {
  return {
    apiFetch, db: idb, toast,
    workspace: {
      openProject: async (project) => {
        if (project && project.pid) location.href = "/ai.html?pid=" + encodeURIComponent(project.pid);
      },
    },
    setPidInUrl: (pid) => {
      if (!pid) return;
      try {
        const url = new URL(location.href);
        url.searchParams.set("pid", pid);
        history.replaceState(null, "", url.toString());
      } catch {}
    },
    getAvatarColor, getInitials,
    renderSidebar: () => {}, renderEmptyRecent: () => {},
    DEFAULT_PROJECT_STORAGE_LIMIT, API_HOST, API_FLIER,
    isGuest: () => STATE.isGuest,
    isOnline: () => STATE.online,
    getUsername: () => STATE.user?.profile?.username || STATE.user?.username || null,
    getSession: () => STATE.session,
    getUid: () => STATE.user?.uid || null,
  };
}

// ─── Sidebar controller ─────────────────────────────────────────

class Sidebar {
  constructor(opts) {
    this.root = $(opts.id || "sb");
    this.tabsEl = $("sbTabs");
    this.bodyEl = $("sbBody");
    this.titleEl = $("sbTitle");
    this.backdropEl = $("sbBackdrop");
    this.closeBtn = $("sbClose");

    this.panels = opts.panels || [];
    this.current = opts.initial || this.panels[0]?.id;
    this.isOpen = false;
    this.ctx = opts.ctx || {};
    this._token = 0;

    this._bind();
    this.render();
  }

  open(panel) {
    if (panel) this.current = panel;
    this.isOpen = true;
    this.root.classList.add("open");
    if (this.backdropEl && window.innerWidth < 1024) this.backdropEl.classList.add("open");
    this.render();
  }

  close() {
    this.isOpen = false;
    this.root.classList.remove("open");
    this.backdropEl?.classList.remove("open");
  }

  toggle(panel) {
    this.isOpen ? this.close() : this.open(panel);
  }

  switchTo(panel) {
    if (!this.panels.find(p => p.id === panel)) return;
    this.current = panel;
    STATE.activeTab = panel;
    try { localStorage.setItem(STORAGE.lastTab, panel); } catch {}
    this.render();
    showMainView(panel);
  }

  refresh() { this.render(); }

  _bind() {
    this.closeBtn?.addEventListener("click", () => this.close());
    this.backdropEl?.addEventListener("click", () => this.close());

    window.addEventListener("resize", () => {
      if (window.innerWidth >= 1024) {
        this.backdropEl?.classList.remove("open");
      } else if (this.isOpen) {
        this.backdropEl?.classList.add("open");
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && this.isOpen && window.innerWidth < 1024) {
        this.close();
      }
    });
  }

  render() {
    if (!this.tabsEl || !this.bodyEl) return;
    const token = ++this._token;

    this.tabsEl.innerHTML = "";
    for (const panel of this.panels) {
      const btn = document.createElement("button");
      btn.className = "sb-tab" + (panel.id === this.current ? " active" : "");
      btn.type = "button";
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", panel.id === this.current);
      btn.textContent = panel.label;
      btn.addEventListener("click", () => this.switchTo(panel.id));
      this.tabsEl.appendChild(btn);
    }

    const cur = this.panels.find(p => p.id === this.current);
    if (this.titleEl) this.titleEl.textContent = cur?.label || "Panel";

    this.bodyEl.innerHTML = "";
    this.bodyEl.scrollTop = 0;
    if (!cur || typeof cur.render !== "function") return;

    const self = this;
    Promise.resolve()
      .then(() => cur.render(self.bodyEl, self.ctx))
      .catch(err => {
        if (token !== self._token) return;
        console.error("[Sidebar] render failed:", err);
        self.bodyEl.innerHTML = "";
        self.bodyEl.appendChild(self._empty("Panel failed to load", String(err?.message || err)));
      });
  }

  _empty(title, desc) {
    const wrap = el("div", { class: "sb-empty" });
    wrap.innerHTML = `
      <div class="sb-empty-title">${escapeHtml(title || "")}</div>
      ${desc ? `<div class="sb-empty-desc">${escapeHtml(desc)}</div>` : ""}
    `;
    return wrap;
  }
}

async function boot() {
  readSession();
  STATE.pid = new URLSearchParams(location.search).get("pid");

  await openDB().catch(err => {
    console.error("[AI] openDB failed:", err);
    throw new Error("Storage unavailable");
  });

  initCreateProject(buildCreateProjectDeps());

  if (handleNewProjectImageReturn()) return;

  wireStaticListeners();
  wireEmptyState();

  if (STATE.pid) await loadProject();

  if (!STATE.project) { showEmptyState(); return; }

  await loadAiState();
  await loadNotes();

  hideEmptyState();
  mountHeader();
  mountRailToggle();
  wireDrawer();
  wireDocs();
  wireCommandBar();
  mountSidebar();

  let lastTab = "files";
  try {
    const saved = localStorage.getItem(STORAGE.lastTab);
    if (saved && ["files","docs","history","commits","notes","info"].includes(saved)) {
      lastTab = saved;
    }
  } catch {}

  showMainView(lastTab);
  sidebar.switchTo(lastTab);

  let toOpen = null;
  try {
    const lastFile = localStorage.getItem(STORAGE.lastFile + "." + STATE.pid);
    if (lastFile && STATE.files.some(f => f.path === lastFile)) toOpen = lastFile;
  } catch {}
  if (!toOpen) {
    toOpen = STATE.files.find(f => /index\.html?$/i.test(f.path))?.path
      || STATE.files.find(f => isTextFile(f.path))?.path
      || STATE.files[0]?.path
      || null;
  }
  if (toOpen) await openFile(toOpen);

  updateStatusBar();
  renderModeBanner();

  if (!STATE.isGuest && STATE.online) promoteQueuedLocalProjects().catch(() => {});
}

// ─── Static listeners ───────────────────────────────────────────

function wireStaticListeners() {
  $("confirmOk").addEventListener("click", () => resolveConfirm(true));
  $("confirmCancel").addEventListener("click", () => resolveConfirm(false));
  $("pendingClose").addEventListener("click", closePendingSheet);
  $("atPopoverClose").addEventListener("click", closeAtPicker);

  $("backdrop").addEventListener("click", () => {
    if ($("confirmDialog").classList.contains("open")) { resolveConfirm(false); return; }
    if ($("pendingSheet").classList.contains("open")) { closePendingSheet(); return; }
    if (STATE.aiOpen && window.innerWidth < 1024) { closeDrawer(); return; }
  });

  document.addEventListener("keydown", (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key === "Enter") {
      const activeId = document.activeElement?.id;
      if (activeId === "aiCommandInput" && !STATE.running) {
        e.preventDefault(); submitCommand(); return;
      }
      if (STATE.aiOpen && !$("btnRun").disabled) { e.preventDefault(); runCurrentTask(); return; }
    }
    if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); saveActiveFile(); return; }
    if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); focusCommand(); return; }
    if (e.key === "Escape") {
      if ($("confirmDialog").classList.contains("open")) { resolveConfirm(false); return; }
      if ($("pendingSheet").classList.contains("open")) { closePendingSheet(); return; }
      if (STATE.atOpen) { closeAtPicker(); return; }
      if (STATE.aiOpen) { closeDrawer(); return; }
    }
  });

  window.addEventListener("online", () => {
    STATE.online = true;
    if (STATE.syncState === "cached") STATE.syncState = "synced";
    renderModeBanner(); renderHeader(); updateStatusBar();
    if (STATE.project && !STATE.isGuest) promoteQueuedLocalProjects().catch(() => {});
  });
  window.addEventListener("offline", () => {
    STATE.online = false;
    if (STATE.syncState === "synced") STATE.syncState = "cached";
    renderModeBanner(); renderHeader(); updateStatusBar();
  });
  window.addEventListener("beforeunload", (e) => {
    if (STATE.activeFile && STATE.dirtyFiles.has(STATE.activeFile)) saveActiveFile({ silent: true }).catch(() => {});
    if (STATE.dirtyFiles.size > 0 || STATE.docsDirty) { e.preventDefault(); e.returnValue = ""; return ""; }
  });
}

// ─── Data loaders ───────────────────────────────────────────────

async function loadProject() {
  let project = null;
  try { project = await idb.getProject(STATE.pid); } catch {}
  if (!project && STATE.session && STATE.online && !/^local_/.test(STATE.pid)) {
    const res = await apiFetch(API_HOST + "?action=projects/get&pid=" + encodeURIComponent(STATE.pid));
    if (res.ok && res.data?.success) {
      project = res.data.project;
      try { await idb.putProject(project); } catch {}
    }
  }
  if (!project) { STATE.project = null; return; }
  STATE.project = project;
  try { STATE.files = (await idb.listFiles(STATE.pid) || []).filter(f => !isSystemFile(f.path)); }
  catch { STATE.files = []; }
  if (STATE.syncState === "unknown") {
    if (/^local_/.test(STATE.pid)) STATE.syncState = "local";
    else if (!STATE.online) STATE.syncState = "cached";
    else if (STATE.session) STATE.syncState = "synced";
    else STATE.syncState = "cached";
  }
}

async function loadAiState() {
  try { STATE.aiState = await readAiState(STATE.pid, { idb }); }
  catch { STATE.aiState = { version: 1, runs: [], pending: [], quota: null }; }
  if (STATE.aiState?.quota) writeQuotaCache(STATE.aiState.quota);
}

async function loadNotes() {
  try {
    const file = await idb.getFile(STATE.pid, NOTES_PATH);
    const content = typeof file === "string" ? file : (file?.content || "");
    if (!content) { STATE.notes = { version: 1, notes: [] }; return; }
    const parsed = JSON.parse(content);
    STATE.notes = { version: parsed.version || 1, notes: parsed.notes || [] };
  } catch { STATE.notes = { version: 1, notes: [] }; }
}

// ─── Files panel ────────────────────────────────────────────────

function renderFilesPanel(root) {
  root.innerHTML = "";

  const totalBytes = STATE.files.reduce((s, f) => s + estimateSize(f.content || ""), 0);
  const limit = STATE.project.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT;
  const pct = Math.min(100, (totalBytes / limit) * 100);
  const barClass = pct > 90 ? "danger" : pct > 70 ? "warn" : "";

  const pinned = el("div", { class: "sb-pinned" });
  const pinnedIcon = el("div", { class: "sb-pinned-icon" });
  if (STATE.project.iconUrl) {
    const img = document.createElement("img"); img.src = STATE.project.iconUrl; img.alt = "";
    pinnedIcon.appendChild(img);
  } else {
    pinnedIcon.textContent = getInitials(STATE.project.name);
    pinnedIcon.style.background = getAvatarColor(STATE.project.name);
    pinnedIcon.style.color = "#0a0c10";
  }
  pinned.appendChild(pinnedIcon);

  const pinnedInfo = el("div", { class: "sb-pinned-info" });
  pinnedInfo.appendChild(el("div", { class: "sb-pinned-name" }, STATE.project.name || "Untitled"));
  const bar = el("div", { class: "sb-storage-mini" });
  bar.appendChild(el("div", { class: `sb-storage-mini-fill ${barClass}`, style: { width: pct + "%" } }));
  pinnedInfo.appendChild(bar);
  pinnedInfo.appendChild(el("div", { class: "sb-storage-label" }, `${formatBytes(totalBytes)} / ${formatBytes(limit)}`));
  pinned.appendChild(pinnedInfo);
  root.appendChild(pinned);

  const section = el("div", { class: "sb-section" },
    el("span", {}, `Files (${STATE.files.length})`),
    el("div", { class: "sb-section-actions" },
      el("button", { class: "sb-icon-btn", title: "New file", type: "button", onclick: createNewFile }, icon("plus", 12)),
      el("button", { class: "sb-icon-btn", title: "Reload", type: "button", onclick: reloadFiles }, icon("refresh", 12)),
    )
  );
  root.appendChild(section);

  const filter = el("input", {
    class: "sb-filter", type: "search", placeholder: "Filter files…",
    value: STATE.fileFilter,
    oninput: debounce((e) => {
      STATE.fileFilter = e.target.value.toLowerCase();
      renderFilesPanel(root);
    }, 120),
  });
  root.appendChild(filter);

  const tree = el("div");
  root.appendChild(tree);

  const allFiles = STATE.fileFilter
    ? STATE.files.filter(f => f.path.toLowerCase().includes(STATE.fileFilter))
    : STATE.files;

  if (!allFiles.length) {
    root.appendChild(el("div", { class: "sb-empty" },
      el("div", { class: "sb-empty-title" }, STATE.fileFilter ? "No matches" : "No files yet"),
      el("div", { class: "sb-empty-desc" }, STATE.fileFilter ? "Try a different search." : "Create a file to get started."),
    ));
    return;
  }

  const treeData = buildTree(allFiles.map(f => f.path));

  const renderNode = (node, depth) => {
    for (const [name, child] of Object.entries(node.children).sort(([a], [b]) => a.localeCompare(b))) {
      const expanded = STATE.expandedFolders.has(child.path) || !!STATE.fileFilter;
      const row = el("div", {
        class: `sb-tree-node ${expanded ? "expanded" : ""}`,
        style: { "--depth": String(depth) },
        onclick: () => {
          if (STATE.expandedFolders.has(child.path)) STATE.expandedFolders.delete(child.path);
          else STATE.expandedFolders.add(child.path);
          renderFilesPanel(root);
        },
      },
        el("span", { class: "sb-tree-chevron" }, icon("chevron-right", 9)),
        el("span", { class: "sb-tree-icon" }, icon(expanded ? "folder-open" : "folder", 12)),
        el("span", { class: "sb-tree-name" }, name),
      );
      tree.appendChild(row);
      if (expanded) renderNode(child, depth + 1);
    }
    for (const file of node.files.sort((a, b) => a.name.localeCompare(b.name))) {
      const active = STATE.activeFile === file.path;
      const row = el("div", {
        class: `sb-tree-node ${active ? "active" : ""}`,
        style: { "--depth": String(depth) },
        onclick: () => openFile(file.path),
        oncontextmenu: (e) => { e.preventDefault(); openFileContextMenu(e, file.path); },
      },
        el("span", { class: "sb-tree-chevron" }),
        el("span", { class: "sb-tree-icon" }, icon(fileIconName(file.path), 12)),
        el("span", { class: "sb-tree-name", title: file.path }, file.name),
        el("div", { class: "sb-tree-actions" },
          el("button", {
            class: "sb-icon-btn", type: "button", title: "Ask AI",
            onclick: (e) => {
              e.stopPropagation();
              addChip({ type: "file", value: file.path, label: file.name });
              focusCommand();
            },
          }, icon("sparkles", 10)),
          el("button", {
            class: "sb-icon-btn danger", type: "button", title: "Delete",
            onclick: (e) => { e.stopPropagation(); deleteFileConfirm(file.path); },
          }, icon("trash", 10)),
        ),
      );
      tree.appendChild(row);
    }
  };

  renderNode(treeData, 0);
}

function buildTree(paths) {
  const root = { children: {}, files: [] };
  for (const path of paths) {
    const parts = path.split("/");
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!node.children[parts[i]]) node.children[parts[i]] = { children: {}, files: [], path: parts.slice(0, i + 1).join("/") };
      node = node.children[parts[i]];
    }
    node.files.push({ name: parts[parts.length - 1], path });
  }
  return root;
}

async function reloadFiles() {
  try { STATE.files = (await idb.listFiles(STATE.pid) || []).filter(f => !isSystemFile(f.path)); } catch {}
  renderFilesPanel($("sbBody"));
  renderHeader();

async function createNewFile() {
  const name = window.prompt("New file path (e.g. index.html):");
  if (!name) return;
  const path = name.trim();
  if (!path) return;
  const existing = await idb.getFile(STATE.pid, path);
  if (existing) { toast("File exists", "warning"); return; }
  await idb.putFile(STATE.pid, path, "");
  STATE.files = (await idb.listFiles(STATE.pid) || []).filter(f => !isSystemFile(f.path));
  renderFilesPanel($("sbBody"));
  await openFile(path);
}

async function deleteFileConfirm(path) {
  const ok = await confirmDialog({ title: `Delete ${path.split("/").pop()}?`, message: "This cannot be undone.", confirmLabel: "Delete", danger: true });
  if (!ok) return;
  await idb.deleteFile(STATE.pid, path);
  STATE.files = (await idb.listFiles(STATE.pid) || []).filter(f => !isSystemFile(f.path));
  if (STATE.activeFile === path) {
    STATE.activeFile = null;
    cm.destroy();
    $("editorContainer").innerHTML = "";
    $("editorEmpty").style.display = "";
    renderEditorTabs();
  }
  renderFilesPanel($("sbBody"));
  toast("Deleted", "info");
}

      onmouseout: (ev) => { ev.currentTarget.style.background = "transparent"; },
      onclick: () => {
        menu.remove();

        STATE.prompt = `${{ explain: "Explain this file", debug: "Find bugs in this file", codefix: "Fix this file", optimize: "Optimize this file", audit: "Audit this file", docstrings: "Add docstrings to this file", diagram: "Draw a diagram of this file", simulate: "Simulate this file" }[t.id]}`;
        STATE.detectedTask = t.id;
        if (path !== STATE.activeFile) openFile(path);
        openDrawer();
        autoRunNow();
      },
    }, icon("sparkles", 12), el("span", {}, t.label)));
  }

  document.body.appendChild(menu);
  setTimeout(() => {
    document.addEventListener("click", function close(ev) {
      if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener("click", close); }
    });
  }, 0);
}

async function openFile(path) {
  if (!STATE.project) return;
  if (STATE.activeFile === path && STATE.editorView) return;
  if (STATE.activeFile && STATE.dirtyFiles.has(STATE.activeFile) && STATE.activeFile !== path) {
    await saveActiveFile({ silent: true });
  }
  const file = await idb.getFile(STATE.pid, path);
  if (!file) { toast("File not found", "error"); return; }
  if (!isTextFile(path)) { toast("Binary preview not supported", "info"); return; }

  if (!STATE.openFiles.includes(path)) STATE.openFiles.push(path);
  STATE.activeFile = path;
  try { localStorage.setItem(STORAGE.lastFile + "." + STATE.pid, path); } catch {}

  // Auto-chip the active file if it's not already chipped
  if (!STATE.chips.some(c => c.type === "file" && c.value === path)) {
    // Only auto-chip if no explicit chips and nothing else open
    if (STATE.chips.length === 0) {
      addChip({ type: "file", value: path, label: path.split("/").pop() }, { silent: true });
    }
  }

  $("editorEmpty").style.display = "none";
  $("editorLoading").hidden = false;

  try {
    $("editorContainer").innerHTML = "";
    await cm.mount($("editorContainer"), file.content || "", path);
    $("editorLoading").hidden = true;
    renderEditorTabs();
    updateStatusBar();
    if (sidebar) renderFilesPanel($("sbBody"));
  } catch (err) {
    console.error("[openFile]", err);
    $("editorLoading").hidden = true;
    $("editorEmpty").style.display = "";
  }
}

async function saveActiveFile({ silent = false } = {}) {
  if (!STATE.activeFile || !STATE.editorView) { if (!silent) toast("No file open", "info"); return; }
  try {
    const content = cm.getContent();
    await idb.putFile(STATE.pid, STATE.activeFile, content);
    try {
      const p = await idb.getProject(STATE.pid);
      if (p) { p.updatedAt = Date.now(); await idb.putProject(p); }
    } catch {}
    STATE.dirtyFiles.delete(STATE.activeFile);
    renderEditorTabs();
    updateStatusBar();
    if (!silent) toast("Saved", "success");
  } catch (err) {
    console.error("[save]", err);
    toast("Save failed", "error");
  }
}

function renderEditorTabs() {
  const tabs = $("editorTabs");
  if (!tabs) return;
  if (!STATE.openFiles.length) { tabs.style.display = "none"; tabs.innerHTML = ""; return; }
  tabs.style.display = "flex";
  tabs.innerHTML = "";
  for (const path of STATE.openFiles) {
    const active = path === STATE.activeFile;
    const dirty = STATE.dirtyFiles.has(path);
    const tab = el("button", {
      class: `editor-tab ${active ? "active" : ""}`,
      type: "button",
      onclick: () => openFile(path),
    },
      el("span", { class: "editor-tab-name" }, path.split("/").pop()),
      dirty ? el("span", { class: "editor-tab-dot" }) : null,
      el("button", {
        class: "editor-tab-close", type: "button", "aria-label": "Close",
        onclick: (e) => { e.stopPropagation(); closeFile(path); },
      }, icon("x", 10)),
    );
    tabs.appendChild(tab);
  }
}

async function closeFile(path) {
  if (STATE.dirtyFiles.has(path)) {
    const ok = await confirmDialog({ title: "Discard changes?", message: `${path.split("/").pop()} has unsaved changes.`, confirmLabel: "Discard", danger: true });
    if (!ok) return;
    STATE.dirtyFiles.delete(path);
  }
  const idx = STATE.openFiles.indexOf(path);
  if (idx >= 0) STATE.openFiles.splice(idx, 1);
  if (STATE.activeFile === path) {
    if (STATE.openFiles.length) await openFile(STATE.openFiles[STATE.openFiles.length - 1]);
    else {
      STATE.activeFile = null;
      cm.destroy();
      $("editorContainer").innerHTML = "";
      $("editorEmpty").style.display = "";
    }
  }
  renderEditorTabs();
  updateStatusBar();
}

function renderDocsToolbar() {
  const tools = [
    { icon: "h1", prefix: "# ", block: true },
    { icon: "h2", prefix: "## ", block: true },
    { icon: "h3", prefix: "### ", block: true },
    { sep: true },
    { icon: "bold", wrap: ["**", "**"] },
    { icon: "italic", wrap: ["*", "*"] },
    { icon: "strike", wrap: ["~~", "~~"] },
    { sep: true },
    { icon: "list", prefix: "- ", block: true },
    { icon: "list-ol", prefix: "1. ", block: true },
    { icon: "quote", prefix: "> ", block: true },
    { sep: true },
    { icon: "link", wrap: ["[", "](https://)"] },
    { icon: "code", wrap: ["`", "`"] },
  ];
  const bar = $("docsToolbar");
  if (!bar) return;
  bar.innerHTML = "";
  for (const t of tools) {
    if (t.sep) { bar.appendChild(el("span", { class: "docs-toolbar-sep" })); continue; }
    bar.appendChild(el("button", {
      class: "docs-toolbar-btn", type: "button", "aria-label": t.icon, title: t.icon,
      onmousedown: (e) => e.preventDefault(),
      onclick: () => applyDocFormat(t),
    }, icon(t.icon, 13)));
  }
}

function applyDocFormat(action) {
  const ta = $("docsSource");
  if (!ta) return;
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const value = ta.value;
  const selected = value.slice(start, end);
  let nv, ns, ne;

  if (action.block) {
    const lineStart = value.lastIndexOf("\n", start - 1) + 1;
    const line = value.slice(lineStart, start);
    if (line.startsWith(action.prefix)) {
      nv = value.slice(0, lineStart) + line.slice(action.prefix.length) + value.slice(start);
      ns = Math.max(lineStart, start - action.prefix.length);
      ne = Math.max(lineStart, end - action.prefix.length);
    } else {
      nv = value.slice(0, lineStart) + action.prefix + value.slice(lineStart);
      ns = start + action.prefix.length;
      ne = end + action.prefix.length;
    }
  } else if (action.wrap) {
    const [b, a] = action.wrap;
    nv = value.slice(0, start) + b + selected + a + value.slice(end);
    ns = start + b.length;
    ne = start + b.length + selected.length;
  }

  ta.value = nv;
  ta.selectionStart = ns;
  ta.selectionEnd = ne;
  ta.focus();

  STATE.docsDirty = true;
  updateDocsSaveState();
  const preview = $("docsPreview");
  if (preview) { preview.innerHTML = renderMarkdown(nv); hydrateMarkdown(preview).catch(() => {}); }
  if (STATE.docsSaveTimer) clearTimeout(STATE.docsSaveTimer);
  STATE.docsSaveTimer = setTimeout(() => saveDoc(), 800);
}

async function loadDoc(path) {
  if (STATE.docsDirty && STATE.docsActivePath && STATE.docsActivePath !== path) await saveDoc();
  if (STATE.docsSaveTimer) { clearTimeout(STATE.docsSaveTimer); STATE.docsSaveTimer = null; }

  const file = await idb.getFile(STATE.pid, path);
  if (!file) { toast("Doc not found", "error"); return; }

  STATE.docsActivePath = path;
  STATE.docsDirty = false;

  const src = $("docsSource");
  const preview = $("docsPreview");
  const pathEl = $("docsActivePath");
  if (src) src.value = file.content || "";
  if (pathEl) pathEl.textContent = path;
  if (preview) {
    preview.innerHTML = renderMarkdown(file.content || "");
    hydrateMarkdown(preview).catch(() => {});
  }
  updateDocsSaveState();
}

function updateDocsSaveState() {
  const save = $("docsSave");
  if (save) save.disabled = !STATE.docsDirty;
}

async function saveDoc() {
  if (!STATE.docsActivePath) return;
  const src = $("docsSource");
  if (!src) return;
  try {
    await idb.putFile(STATE.pid, STATE.docsActivePath, src.value);
    STATE.docsDirty = false;
    updateDocsSaveState();
    STATE.files = (await idb.listFiles(STATE.pid) || []).filter(f => !isSystemFile(f.path));
  } catch (err) {
    console.error("[docs save]", err);
    toast("Save failed", "error");
  }
}

function setDocsMode(mode) {
  STATE.docsMode = mode;
  try { localStorage.setItem("folio.docs.mode", mode); } catch {}
  const panes = $("docsPanes");
  if (panes) panes.dataset.mode = mode;
  document.querySelectorAll(".docs-mode-switch button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });
}

async function createNewDoc() {
  const name = window.prompt("New doc path (e.g. docs/guide.md):", "docs/untitled.md");
  if (!name) return;
  const path = name.trim();
  if (!path) return;
  const existing = await idb.getFile(STATE.pid, path);
  if (existing) { toast("Doc exists", "warning"); return; }
  await idb.putFile(STATE.pid, path, `# ${path.split("/").pop().replace(/\.mdx?$/, "")}\n\n`);
  STATE.files = (await idb.listFiles(STATE.pid) || []).filter(f => !isSystemFile(f.path));
  renderDocsPanel($("sbBody"));
  await loadDoc(path);
  if (STATE.activeTab !== "docs") sidebar.switchTo("docs");
  toast("Created " + path, "success");
}

function wireCommandBar() {
  const input = $("aiCommandInput");
  const submit = $("aiCommandSubmit");

  input.addEventListener("input", () => {
    STATE.prompt = input.value;
    updateCommandChips();
    updateDetectedTask();
    renderSuggestions();
    if (input.value.includes("@")) openAtPicker();
    else closeAtPicker();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitCommand();
    }
  });

  input.addEventListener("focus", () => {
    renderSuggestions();
  });

  submit.addEventListener("click", submitCommand);

  $("atPopoverFilter").addEventListener("input", () => {
    STATE.atFilter = $("atPopoverFilter").value.toLowerCase();
    renderAtList();
  });

  updateCommandChips();
  updateDetectedTask();
  renderSuggestions();
}

function focusCommand() {
  $("aiCommandInput").focus();
  $("aiCommandInput").select();
}

function submitCommand() {
  if (STATE.running) return;
  const input = $("aiCommandInput");
  STATE.prompt = input.value.trim();
  if (!STATE.prompt && STATE.chips.length === 0) {
    toast("Type a prompt first", "warning");
    return;
  }
  STATE.detectedTask = classifyIntent(STATE.prompt, STATE.chips);
  openDrawer();
  runCurrentTask();
}

function addChip(chip, opts = {}) {
  const key = `${chip.type}:${chip.value || ""}`;
  if (STATE.chips.some(c => `${c.type}:${c.value || ""}` === key)) return;
  STATE.chips.push(chip);
  if (!opts.silent) {
    updateCommandChips();
    updateDetectedTask();
  }
}

function removeChip(chip) {
  const key = `${chip.type}:${chip.value || ""}`;
  STATE.chips = STATE.chips.filter(c => `${c.type}:${c.value || ""}` !== key);
  updateCommandChips();
  updateDetectedTask();
}

function updateCommandChips() {
  const wrap = $("aiCommandChips");
  if (!wrap) return;
  wrap.innerHTML = "";
  if (STATE.chips.length === 0) {
    wrap.hidden = true;
    return;
  }
  wrap.hidden = false;
  for (const chip of STATE.chips) {
    wrap.appendChild(el("span", { class: "ai-chip", style: { display: "inline-flex" } },
      el("span", { class: "ai-chip-icon" }, icon(chip.type === "project" ? "folder" : chip.type === "selection" ? "hash" : "file", 10)),
      el("span", { class: "ai-chip-label" }, chip.label || chip.value || chip.type),
      el("button", {
        class: "ai-chip-remove", type: "button", "aria-label": "Remove",
        onclick: (e) => { e.stopPropagation(); removeChip(chip); },
      }, icon("x", 9)),
    ));
  }
  wrap.appendChild(el("button", {
    class: "ai-chip-add", type: "button", title: "Add context",
    onclick: () => openAtPicker(),
  }, icon("plus", 10), " Add"));
}

function updateDetectedTask() {
  const labelEl = $("drawerDetectedTask");
  if (!labelEl) return;
  if (!STATE.prompt && STATE.chips.length === 0) {
    labelEl.hidden = true;

function updateRunButtonState() {

    return;

  btn.classList.remove("running");

  const quota = readQuotaCache();
  const exhausted = quota &&
    ((quota.wordsUsed ?? 0) >= (quota.wordsLimit ?? Infinity)
     || (quota.creditsUsed ?? 0) >= (quota.creditsLimit ?? Infinity));
  btn.disabled = !STATE.online || exhausted || STATE.running || !STATE.prompt && STATE.chips.length === 0;
}

async function autoRunNow() {
  await runCurrentTask();
}

async function runCurrentTask() {
  if (STATE.running) return;
  if (!STATE.prompt && STATE.chips.length === 0) {
    toast("Type a prompt first", "warning");
    return;
  }

  const task = STATE.detectedTask || classifyIntent(STATE.prompt, STATE.chips);
  const payload = buildPayload(task);
  if (!payload) return;

  STATE.running = true;
  STATE.abort = new AbortController();
  updateRunButtonState();
  showResultLoading(`Running ${taskLabel(task)}…`);

  try {
    const res = await runTask({
      task, pid: STATE.pid, payload,
      signal: STATE.abort.signal,
      deps: { idb, apiFetch },
    });

    if (!res.ok || !res.data?.success) {
      if (res.data?.quotaExceeded) showResultError(res.data.error || "Quota exceeded");
      else showResultError(res.data?.error || `AI error (${res.status})`);
      return;
    }

    const fileChips = STATE.chips.filter(c => c.type === "file").map(c => c.value);
    const primaryFile = fileChips[0] || null;

    const run = await appendAiRun(STATE.pid, {
      task, pid: STATE.pid,
      file: primaryFile,
      scope: STATE.chips.some(c => c.type === "project") ? "project" : STATE.chips.some(c => c.type === "selection") ? "selection" : "file",
      text: res.data.text,
      artifacts: res.data.artifacts || [],
      usage: res.data.usage || null,
      quota: res.data.quota || null,
      cached: !!res.data.cached,
    }, { idb });

    if (res.data.quota) { writeQuotaCache(res.data.quota); renderQuotaHud(); }
    STATE.aiState = await readAiState(STATE.pid, { idb });
    updateStatusBar();

    if (res.data.artifacts?.length) {
      await stageArtifactsFromRun(STATE.pid, run, { idb });
      STATE.aiState = await readAiState(STATE.pid, { idb });
    }

    renderDrawerResult(res.data, run);
    if (STATE.activeTab === "history") renderHistoryPanel($("sbBody"));
  } catch (err) {
    if (err?.name === "AbortError") showResultError("Cancelled");
    else showResultError(err?.message || "AI call failed");
  } finally {
    STATE.running = false;
    STATE.abort = null;
    updateRunButtonState();
    updateInfoBar();
  }
}

function buildPayload(task) {
  const payload = {};
  const meta = getTaskMeta(task);
  if (!meta) return null;

  const fileChips = STATE.chips.filter(c => c.type === "file");
  const hasProject = STATE.chips.some(c => c.type === "project");
  const hasSelection = STATE.chips.some(c => c.type === "selection");

  // Selection
  if (hasSelection && STATE.editorView) {
    const sel = cm.getSelection();
    if (sel) {
      payload.selection = sel;
      const file = STATE.files.find(f => f.path === STATE.activeFile);
      payload.content = file?.content || "";
      payload.file = STATE.activeFile;
    }
  }

  // File chips
  if (fileChips.length && !hasSelection) {
    const primary = fileChips[0].value;
    const primaryFile = STATE.files.find(f => f.path === primary);
    if (primaryFile) {
      payload.file = primary;
      payload.content = primaryFile.content || "";
    }
    if (fileChips.length > 1) {
      payload.files = Object.fromEntries(
        fileChips
          .map(c => STATE.files.find(f => f.path === c.value))
          .filter(Boolean)
          .map(f => [f.path, f.content])
      );
    }
  }

  // Whole project
  if (hasProject) {
    payload.name = STATE.project.name || "Untitled";
    payload.description = STATE.project.description || "";
    payload.files = Object.fromEntries(STATE.files.map(f => [f.path, f.content]));
  }

  // No chips at all → fall back to current file or project based on task
  if (!fileChips.length && !hasProject && !hasSelection) {
    const projectTasks = new Set(["readProject", "designExplain", "brainstorm", "scaffold", "struggle", "findFn", "docs"]);
    if (projectTasks.has(task)) {
      payload.name = STATE.project.name || "Untitled";
      payload.description = STATE.project.description || "";
      payload.files = Object.fromEntries(STATE.files.map(f => [f.path, f.content]));
    } else if (STATE.activeFile) {
      const f = STATE.files.find(x => x.path === STATE.activeFile);
      if (f) {
        payload.file = f.path;
        payload.content = f.content || "";
      }
    }
  }

  // Task-specific extras
  if (task === "findFn") {
    const name = window.prompt("Function name?");
    if (!name) return null;
    payload.fnName = name;
    if (!payload.files) payload.files = Object.fromEntries(STATE.files.map(f => [f.path, f.content]));
  }
  if (task === "translate") {
    const to = window.prompt("Target language?", "python");
    if (!to) return null;
    payload.to = to.toLowerCase();
    payload.code = payload.selection || payload.content || STATE.files.map(f => f.content).join("\n\n");
    payload.from = payload.file ? (payload.file.split(".").pop() || "unknown") : "mixed";
  }
  if (task === "diagram") {
    payload.kind = payload.kind || "flow";
  }
  if (task === "commitMsg") {
    const diff = window.prompt("Paste the diff or leave blank for project diff:");
    payload.diff = diff || "";
  }
  if (task === "logExplain") {
    const log = window.prompt("Paste the log:");
    if (!log) return null;
    payload.log = log;
  }

  return payload;
}

function showResultLoading(text) {
  $("resultEmpty").hidden = true;
  $("resultContent").hidden = true;
  $("resultLoading").hidden = false;
  $("resultLoadingText").textContent = text;
}

function showResultError(message) {
  $("resultEmpty").hidden = true;
  $("resultLoading").hidden = true;
  $("resultContent").hidden = false;
  $("resultContent").innerHTML = `<div class="ai-result-error">${iconHTML("alert", 14)} <span>${escapeHtml(message)}</span></div>`;
}

function renderDrawerResult(data, run) {
  $("resultEmpty").hidden = true;
  $("resultLoading").hidden = true;
  $("resultContent").hidden = false;
  $("resultContent").innerHTML = "";

  if (data.text) {
    const md = el("div", { class: "ai-markdown" });
    md.innerHTML = renderMarkdown(data.text);
    $("resultContent").appendChild(md);
    hydrateMarkdown(md).catch(() => {});
  }

  if (Array.isArray(data.artifacts) && data.artifacts.length) {
    const arts = el("div", { class: "ai-artifacts" });
    $("resultContent").appendChild(arts);
    renderArtifacts(arts, data.artifacts, {
      task: run.task,
      onAccept: (artifact, idx) => handleAccept(artifact, idx, run),
      onReject: (artifact, idx) => handleReject(artifact, idx, run),
      onOpenFile: (path, line) => { switchToFiles(); openFile(path); },
    });
  }

  if (data.usage) {
    const footer = el("div", { class: "ai-result-usage" });
    if (data.usage.promptWords != null) footer.appendChild(el("span", {}, `${data.usage.promptWords}w in · ${data.usage.completionWords || 0}w out`));
    if (data.cached) footer.appendChild(el("span", { class: "cached" }, "cached"));
    if (data.quota) footer.appendChild(el("span", {}, `${data.quota.creditsUsed ?? 0}/${data.quota.creditsLimit ?? "?"} credits`));
    $("resultContent").appendChild(footer);
  }
}

async function handleAccept(artifact, index, run) {
  if (!run) return;
  const result = artifact.type === "diff"
    ? await applyPatch({ artifact, pid: STATE.pid, deps: { idb } })
    : await applyFiles({ artifact, pid: STATE.pid, deps: { idb } });
  if (!result.ok) { toast(result.error || "Apply failed", "error"); return; }

  await markRunArtifactAccepted(STATE.pid, run.id, index, { idb });
  STATE.aiState = await readAiState(STATE.pid, { idb });
  updateStatusBar();

  try { STATE.files = (await idb.listFiles(STATE.pid) || []).filter(f => !isSystemFile(f.path)); } catch {}
  if (artifact.file && STATE.activeFile === artifact.file) await openFile(artifact.file);
  if (STATE.activeTab === "files") renderFilesPanel($("sbBody"));

  toast(`Applied ${artifact.file || (artifact.files?.length + " files")}`, "success");
}

async function handleReject(artifact, index, run) {
  if (!run) return;
  await markRunArtifactRejected(STATE.pid, run.id, index, { idb });
  STATE.aiState = await readAiState(STATE.pid, { idb });
  updateStatusBar();
  toast("Rejected", "info");
}

// ─── Quota HUD ──────────────────────────────────────────────────

function renderQuotaHud() {
  const hud = $("quotaHud");
  if (!hud) return;
  const quota = readQuotaCache();
  if (!quota) { hud.innerHTML = ""; return; }
  const wUsed = quota.wordsUsed ?? 0, wLimit = quota.wordsLimit ?? 1;
  const cUsed = quota.creditsUsed ?? 0, cLimit = quota.creditsLimit ?? 1;
  const wp = Math.min(100, Math.round((wUsed / wLimit) * 100));
  const cp = Math.min(100, Math.round((cUsed / cLimit) * 100));
  hud.innerHTML = `
    <div class="quota-row">
      <div class="quota-label"><span>Words</span><span>${formatCompact(wUsed)} / ${formatCompact(wLimit)}</span></div>
      <div class="quota-bar"><div class="quota-fill words" style="width:${wp}%"></div></div>
    </div>
    <div class="quota-row">
      <div class="quota-label"><span>Credits</span><span>${formatCompact(cUsed)} / ${formatCompact(cLimit)}</span></div>
      <div class="quota-bar"><div class="quota-fill credits" style="width:${cp}%"></div></div>
    </div>
  `;
}

function openPendingSheet() {
  const pending = STATE.aiState?.pending || [];
  const body = $("pendingBody");
  body.innerHTML = "";
  if (!pending.length) {
    body.innerHTML = `<div class="sb-empty"><div class="sb-empty-title">No staged proposals</div></div>`;
  } else {
    for (const item of pending) {
      const meta = getTaskMeta(item.task) || { label: item.task };
      const art = item.artifact || {};
      const file = art.file || (art.files ? `${art.files.length} files` : "");
      body.appendChild(el("div", { class: "pending-item" },
        el("div", { class: "pending-item-meta" },
          el("span", { class: "pending-item-task" }, meta.label),
          el("span", { class: "pending-item-file" }, file),
          el("span", { class: "pending-item-time" }, relativeTime(item.createdAt)),
        ),
        el("div", { class: "pending-item-actions" },
          el("button", { class: "btn btn-primary btn-sm", type: "button", onclick: async () => {
            const r = STATE.aiState.runs.find(x => x.id === item.runId);
            if (r) await handleAccept(item.artifact, item.artifactIndex, r);
            closePendingSheet();
          } }, "Accept"),
          el("button", { class: "btn btn-ghost btn-sm", type: "button", onclick: async () => {
            await removePendingItem(STATE.pid, item.id, { idb });
            STATE.aiState = await readAiState(STATE.pid, { idb });
            updateStatusBar();
            openPendingSheet();
          } }, "Discard"),
        ),
      ));
    }
  }
  $("backdrop").classList.add("visible");
  $("pendingSheet").classList.add("open");
}

function closePendingSheet() {
  $("pendingSheet").classList.remove("open");
  if (!anySheetOpen()) $("backdrop").classList.remove("visible");
}

async function confirmClearPending() {
  const ok = await confirmDialog({ title: "Clear all staged proposals?", message: "You can re-run the AI to regenerate them.", confirmLabel: "Clear all", danger: true });
  if (!ok) return;
  await clearPending(STATE.pid, { idb });
  STATE.aiState = await readAiState(STATE.pid, { idb });
  updateStatusBar();
  toast("Cleared", "success");
}

// ─── Mode banner ────────────────────────────────────────────────

function renderModeBanner() {
  const banner = $("modeBanner");
  const text = $("modeBannerText");
  const action = $("modeBannerAction");

  if (STATE.syncState === "local" && !STATE.session) {
    banner.hidden = false;
    text.textContent = "Local project. Sign in to back it up.";
    action.hidden = false;
    action.textContent = "Sign in";
    action.onclick = () => { location.href = "/register?next=" + encodeURIComponent(location.pathname + location.search); };
    return;
  }
  if (STATE.syncState === "local" && STATE.session) {
    banner.hidden = false;
    text.textContent = "Local project. Sync to your account.";
    action.hidden = false;
    action.textContent = "Sync";
    action.onclick = () => promoteQueuedLocalProjects().then(() => location.reload()).catch(() => {});
    return;
  }
  if (STATE.syncState === "cached" || !STATE.online) {
    banner.hidden = false;
    text.textContent = "Offline — showing cached data.";
    action.hidden = true;
    return;
  }
  banner.hidden = true;
}

// ─── Boot ───────────────────────────────────────────────────────

boot().catch(err => {
  console.error("[AI] boot failed:", err);
  const errEl = document.createElement("div");
  errEl.className = "boot-error";
  errEl.innerHTML = `<div class="boot-error-title">Couldn't load the page</div><div class="boot-error-desc">${escapeHtml(String(err?.message || err))}</div><button class="btn btn-primary" onclick="location.reload()">Retry</button>`;
  document.body.appendChild(errEl);
});
</script>

</body>
