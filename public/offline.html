<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>You're offline — Folio</title>
<meta name="description" content="You're offline. Check your connection and try again.">
<meta name="theme-color" content="#0a0c10" id="metaThemeColor">
<meta name="robots" content="noindex,nofollow">

<link rel="icon" type="image/png" href="/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/theme.css">

<script>
(function() {
  try {
    var pref = localStorage.getItem("folio.theme") || "dark";
    var resolved = pref;
    if (pref === "auto") {
      resolved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    }
    if (resolved === "light") document.documentElement.setAttribute("data-theme", "light");
  } catch (e) {}
})();
</script>

<style>
.page {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
  padding-top: calc(var(--space-4) + var(--safe-top));
  padding-bottom: calc(var(--space-4) + var(--safe-bottom));
  background:
    radial-gradient(ellipse at 50% 0%, rgba(245, 158, 11, 0.05) 0%, transparent 50%),
    var(--bg);
  text-align: center;
}

[data-theme="light"] .page {
  background:
    radial-gradient(ellipse at 50% 0%, rgba(217, 119, 6, 0.04) 0%, transparent 50%),
    var(--bg);
}

.card {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-5);
}

.icon-wrap {
  position: relative;
  width: 96px;
  height: 96px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--border-faint);
  transition: border-color var(--duration-base) var(--ease-out);
}

.icon-ring--outer {
  inset: -8px;
  border-color: var(--border-faint);
  opacity: 0.5;
}

.icon-badge {
  position: relative;
  width: 72px;
  height: 72px;
  border-radius: 22px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--warning);
  transition: color var(--duration-base) var(--ease-out),
              border-color var(--duration-base) var(--ease-out);
}

.icon-badge svg {
  width: 32px;
  height: 32px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon-badge--online {
  color: var(--success);
  border-color: rgba(16, 185, 129, 0.3);
}

.icon-badge--online .icon-bolt { display: none; }
.icon-badge--online .icon-check { display: block; }
.icon-badge .icon-check { display: none; }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: 6px var(--space-3);
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1px;
  background: var(--warning-soft);
  color: var(--warning);
  border: 1px solid rgba(217, 119, 6, 0.3);
  transition: background var(--duration-base) var(--ease-out),
              color var(--duration-base) var(--ease-out),
              border-color var(--duration-base) var(--ease-out);
}

.status-pill--online {
  background: var(--success-soft);
  color: var(--success);
  border-color: rgba(16, 185, 129, 0.3);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 2s ease-in-out infinite;
}

.status-pill--online .status-dot {
  animation: none;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
  line-height: 1.2;
}

.desc {
  font-size: 14px;
  color: var(--text-soft);
  line-height: 1.55;
  max-width: 340px;
}

.actions {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  width: 100%;
  max-width: 280px;
}

.btn {
  width: 100%;
  height: 44px;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  transition: background var(--duration-base) var(--ease-out),
              border-color var(--duration-base) var(--ease-out);
}

.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.btn-primary {
  background: var(--accent);
  color: var(--bg);
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
}

.btn-ghost {
  background: transparent;
  color: var(--text-soft);
  border: 1px solid var(--border);
}

.btn-ghost:hover:not(:disabled) {
  background: var(--bg-card);
  color: var(--text);
  border-color: var(--border-faint);
}

.btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.btn.loading {
  color: transparent;
  pointer-events: none;
  position: relative;
}

.btn.loading::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 16px;
  height: 16px;
  margin: -8px 0 0 -8px;
  border: 2px solid var(--bg);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.footnote {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
  max-width: 340px;
  margin-top: var(--space-3);
}

.footnote strong {
  color: var(--text-soft);
  font-weight: 600;
}

.reconnect-banner {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--success-soft);
  border: 1px solid rgba(16, 185, 129, 0.3);
  color: var(--success);
  font-size: 13px;
  font-weight: 500;
  max-width: 340px;
  width: 100%;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity var(--duration-base) var(--ease-out),
              transform var(--duration-base) var(--ease-out);
  pointer-events: none;
}

.reconnect-banner.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.reconnect-banner svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
</style>
</head>
<body>

<main class="page">
  <div class="card">

    <div class="icon-wrap">
      <div class="icon-ring icon-ring--outer"></div>
      <div class="icon-ring"></div>
      <div class="icon-badge" id="iconBadge">
        <svg class="icon-bolt" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M1 1l22 22"/>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
        <svg class="icon-check" viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
    </div>

    <div class="status-pill" id="statusPill">
      <span class="status-dot"></span>
      <span id="statusText">You're offline</span>
    </div>

    <h1 class="title" id="title">Check your connection</h1>
    <p class="desc" id="desc">
      Folio couldn't reach the internet. Your local projects are safe on this device — reconnect to sync cloud features.
    </p>

    <div class="actions">
      <button class="btn btn-primary" id="retryBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>Try again</span>
      </button>
      <button class="btn btn-ghost" id="homeBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Go to projects</span>
      </button>
    </div>

    <div class="reconnect-banner" id="reconnectBanner" role="status">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      <span>Back online. Opening Folio…</span>
    </div>

    <p class="footnote">
      <strong>Tip:</strong> Files you were editing are saved locally. Once you're back online, cloud features will work again.
    </p>

  </div>
</main>

<script>
(function () {
  "use strict";

  const statusPill = document.getElementById("statusPill");
  const statusText = document.getElementById("statusText");
  const title = document.getElementById("title");
  const desc = document.getElementById("desc");
  const iconBadge = document.getElementById("iconBadge");
  const reconnectBanner = document.getElementById("reconnectBanner");
  const retryBtn = document.getElementById("retryBtn");
  const homeBtn = document.getElementById("homeBtn");

  let autoReloadTimer = null;
  let isReloading = false;

  function setOnline() {
    statusPill.classList.add("status-pill--online");
    statusText.textContent = "Back online";
    title.textContent = "Connection restored";
    desc.textContent = "Opening Folio in a moment. If nothing happens, tap the button below.";
    iconBadge.classList.add("icon-badge--online");
    reconnectBanner.classList.add("visible");

    if (autoReloadTimer) clearTimeout(autoReloadTimer);
    autoReloadTimer = setTimeout(reload, 800);
  }

  function setOffline() {
    statusPill.classList.remove("status-pill--online");
    statusText.textContent = "You're offline";
    title.textContent = "Check your connection";
    desc.textContent = "Folio couldn't reach the internet. Your local projects are safe on this device — reconnect to sync cloud features.";
    iconBadge.classList.remove("icon-badge--online");
    reconnectBanner.classList.remove("visible");

    if (autoReloadTimer) {
      clearTimeout(autoReloadTimer);
      autoReloadTimer = null;
    }
  }

  function reload() {
    if (isReloading) return;
    isReloading = true;
    retryBtn.classList.add("loading");
    retryBtn.disabled = true;

    if (navigator.onLine) {
      window.location.href = "/projects";
    } else {
      window.location.reload();
    }
  }

  function tryReconnect() {
    if (navigator.onLine) {
      setOnline();
      setTimeout(reload, 400);
      return;
    }

    retryBtn.classList.add("loading");
    retryBtn.disabled = true;
    setTimeout(() => window.location.reload(), 300);
  }

  window.addEventListener("online", setOnline);
  window.addEventListener("offline", setOffline);

  retryBtn.addEventListener("click", tryReconnect);
  homeBtn.addEventListener("click", () => {
    window.location.href = "/projects";
  });

  if (navigator.onLine) {
    statusPill.classList.add("status-pill--online");
    statusText.textContent = "Connection available";
    title.textContent = "Ready to reconnect";
    desc.textContent = "Looks like you're back online. Tap below to open Folio.";
    iconBadge.classList.add("icon-badge--online");
  }
})();
</script>

</body>
</html>
