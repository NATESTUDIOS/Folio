            <div class="upload-url-input">
              <input class="input mono" id="coverUrlInput" placeholder="https://..." type="url">
              <button class="btn btn-primary btn-icon" id="coverUrlLoad">${svg('check', 12, 2.4)}</button>
            </div>
          </div>
          <div class="upload-url-preview" id="coverUrlPreview"><div class="placeholder">Paste URL, click Load</div></div>
          <div class="upload-url-status" id="coverUrlStatus"></div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="coverCancel">Cancel</button>
        <button class="btn btn-primary" id="coverGenerate">Generate</button>
        <button class="btn btn-primary" id="coverSave" disabled>Save</button>
      </div>
    `);

    const preview = $('coverPreview');
    const saveBtn = $('coverSave');
    const genBtn = $('coverGenerate');

    document.querySelectorAll('[data-cover-tab]').forEach(tab => {
      tab.addEventListener('click', () => {
        currentTab = tab.dataset.coverTab;
        document.querySelectorAll('[data-cover-tab]').forEach(t => t.classList.toggle('active', t === tab));
        document.querySelectorAll('[data-cover-panel]').forEach(p => {
          p.style.display = p.dataset.coverPanel === currentTab ? '' : 'none';
        });
        genBtn.style.display = currentTab === 'generate' ? '' : 'none';
        updateSave();
      });
    });

    function renderPrev(url) {
      if (url) {
        preview.innerHTML = '';
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'Preview';
        preview.appendChild(img);
      } else {
        preview.innerHTML = '<div class="cover-preview-empty">Pick a template and click Generate</div>';
      }
    }

    function updateSave() {
      saveBtn.disabled = generating || saving || !pendingUrl;
    }

    document.querySelectorAll('#coverTemplates .filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#coverTemplates .filter-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTemplate = btn.dataset.tpl;
        draft.template = selectedTemplate;
        pendingUrl = null;
        renderPrev(null);
        updateSave();
      });
    });

    genBtn.addEventListener('click', async () => {
      if (generating) return;
      generating = true;
      genBtn.disabled = true;
      genBtn.textContent = 'Generating…';
      updateSave();

      try {
        pendingUrl = await generateCoverViaFlier({
          template: selectedTemplate,
          scene: $('coverScene').value,
          primary: draft.primary,
          accent: draft.accent,
          headline: $('coverHeadline').value,
          subheadline: $('coverSub').value,
          seed: S.pid,
          iconUrl: S.project?.iconUrl || null,
        });
        renderPrev(pendingUrl);
        toast('Cover generated', 'success');
      } catch (err) {
        toast(err.message || 'Generation failed', 'error');
      } finally {
        generating = false;
        genBtn.disabled = false;
        genBtn.textContent = 'Generate';
        updateSave();
      }
    });

    $('coverFileBtn')?.addEventListener('click', () => $('coverFile')?.click());
    $('coverFile')?.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      if (file.size > 1024 * 1024) { toast('Max 1 MB', 'error'); return; }
      const statusEl = $('coverFileStatus');
      statusEl.textContent = 'Uploading…';
      statusEl.className = 'upload-url-status';

      try {
        const dataUrl = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = rej;
          r.readAsDataURL(file);
        });

        const res = await apiFetch(API_FLIER + '?action=upload', {
          method: 'POST',
          body: JSON.stringify({ dataUrl, kind: 'image' }),
        });
        if (!res.ok || !res.data?.success || !res.data.url) {
          throw new Error(res.data?.error || 'Upload failed');
        }

        pendingUrl = res.data.url;
        renderPrev(res.data.url);
        statusEl.textContent = 'Ready — click Save';
        statusEl.className = 'upload-url-status success';
        updateSave();
      } catch (err) {
        statusEl.textContent = err.message || 'Upload failed';
        statusEl.className = 'upload-url-status error';
      }
    });

    $('coverUrlLoad')?.addEventListener('click', async () => {
      const url = $('coverUrlInput').value.trim();
      const statusEl = $('coverUrlStatus');
      if (!/^https:\/\//i.test(url)) {
        statusEl.textContent = 'Must be HTTPS';
        statusEl.className = 'upload-url-status error';
        return;
      }
      statusEl.textContent = 'Loading…';
      statusEl.className = 'upload-url-status';

      const img = new Image();
      const ok = await new Promise(res => {
        img.onload = () => res(true);
        img.onerror = () => res(false);
        img.src = url;
        setTimeout(() => res(false), 8000);
      });

      if (!ok) {
        statusEl.textContent = 'Failed to load';
        statusEl.className = 'upload-url-status error';
        $('coverUrlPreview').innerHTML = '<div class="placeholder">Preview unavailable</div>';
        return;
      }

      const previewBox = $('coverUrlPreview');
      previewBox.innerHTML = '';
      const pi = document.createElement('img');
      pi.src = url;
      previewBox.appendChild(pi);

      pendingUrl = url;
      statusEl.textContent = 'Ready — click Save';
      statusEl.className = 'upload-url-status success';
      updateSave();
    });

    $('coverCancel')?.addEventListener('click', closeModal);
    saveBtn.addEventListener('click', async () => {
      if (!pendingUrl) return;
      saving = true;
      saveBtn.textContent = 'Saving…';
      updateSave();

      try {
        const metaNext = { ...(S.project.metaTags || {}), ogImage: pendingUrl };

        if (S.session && S.online && !S.isLocalOnly && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=metatags/save', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, metaTags: metaNext }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Save failed');
        } else {
          await enqueueSync('metatags-save', { metaTags: metaNext });
        }

        S.project.metaTags = metaNext;
        S.project.iconUrl = pendingUrl;

        try {
          await IDB.putProject({
            ...(await IDB.getProject(S.pid)),
            metaTags: metaNext,
            iconUrl: pendingUrl,
            updatedAt: Date.now(),
          });
        } catch {}

        cacheProject(S.project);
        closeModal();
        toast('Cover saved', 'success');
        updateHeader();
        updateProjectIcons();
        renderPanel();
      } catch (err) {
        toast(err.message || 'Save failed', 'error');
      } finally {
        saving = false;
        saveBtn.textContent = 'Save';
        updateSave();
      }
    });

    updateSave();
  }

  async function generateCoverViaFlier({
    template = 'browser-frame',
    scene = 'auto',
    primary = '#F59E0B',
    accent = '#fbbf24',
    headline = '',
    subheadline = '',
    seed = null,
    iconUrl = null,
  }) {
    if (!S.online) throw new Error('Requires internet');
    if (!S.session) throw new Error('Sign in to generate covers');

    const payload = {
      mode: 'upload', type: 'template', template, size: '1200x630',
      seed: seed || S.pid,
      data: {
        text: {
          kicker: S.project?.slug ? `@${S.project.slug}` : '',
          headline: headline || S.project?.name || 'Untitled',
          subheadline: subheadline || (S.project?.description || '').slice(0, 160),
        },
        style: {
          variant: 'dark',
          colors: { primary, accent },
          scene,
          scenePalette: 'auto',
          sceneOpacity: 0.85,
          watermark: true,
        },
        images: iconUrl ? { primary: { url: iconUrl } } : {},
      },
      upload: { name: `og_${S.pid}_${Date.now()}` },
    };

    const res = await apiFetch(API_FLIER + '?action=generate', {
      method: 'POST',
      body: JSON.stringify(payload),
    });

    if (!res.ok || !res.data?.success) {
      const err = res.data?.error || `HTTP ${res.status}`;
      if (res.status === 429) throw new Error(`Daily limit reached. Try tomorrow.`);
      throw new Error(`Image generation failed: ${err}`);
    }

    const url = res.data.url || res.data.display_url;
    if (!url) throw new Error('No URL returned');
    return url;
  }

  async function clearCoverDirect() {
    if (!S.isEditor && !S.isLocalOnly) return;
    confirmModal('Clear project image?', 'The auto-generated cover will be used instead.', 'Clear', true, async () => {
      try {
        const metaNext = { ...(S.project.metaTags || {}), ogImage: null };
        if (S.session && S.online && !S.isLocalOnly && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=metatags/save', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, metaTags: metaNext }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        S.project.metaTags = metaNext;
        S.project.iconUrl = null;
        try {
          await IDB.putProject({ ...(await IDB.getProject(S.pid)), metaTags: metaNext, iconUrl: null, updatedAt: Date.now() });
        } catch {}
        cacheProject(S.project);
        toast('Cover cleared', 'success');
        updateHeader();
        updateProjectIcons();
        renderPanel();
      } catch (err) {
        toast(err.message || 'Failed', 'error');
      }
    });
  }

    const isAuthed = !!S.session;

    openModal(`

    document.querySelectorAll('[data-icon-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-icon-tab]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('[data-icon-panel]').forEach(p => {
          p.classList.toggle('active', p.dataset.iconPanel === btn.dataset.iconTab);
        });
      });
    });

    const grid = $('iconPickerGrid');
    grid.innerHTML = Array.from({ length: 5 }, () => '<div class="icon-skeleton"></div>').join('');

    try {
      const res = await apiFetch(API_FLIER + '?action=avatar/preview', {
        method: 'POST',
        body: JSON.stringify({
          username: (S.project.slug || S.pid || 'project').replace(/[^a-z0-9]/gi, '').toLowerCase(),
          displayName: S.project.name || 'Project',
        }),
      });

      grid.innerHTML = '';

      if (res.ok && res.data?.success && Array.isArray(res.data.variants)) {
        res.data.variants.forEach(v => {
          const btn = document.createElement('button');
          btn.className = 'icon-option';
          btn.type = 'button';
          btn.innerHTML = `<img src="${escapeAttr(v.dataUrl)}" alt=""><span class="icon-label">${escapeHTML(v.label || v.id)}</span>`;
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            try {
              const up = await apiFetch(API_FLIER + '?action=upload', {
                method: 'POST',
                body: JSON.stringify({ dataUrl: v.dataUrl, kind: 'icon' }),
              });
              if (!up.ok || !up.data?.success || !up.data.url) {
                throw new Error(up.data?.error || 'Upload failed');
              }
              selectedUrl = up.data.url;
              grid.querySelectorAll('.icon-option').forEach(o => o.classList.remove('selected'));
              btn.classList.add('selected');
              $('iconPickerSave').disabled = false;
            } catch (err) {
              toast(err.message || 'Upload failed', 'error');
            } finally {
              btn.disabled = false;
            }
          });
          grid.appendChild(btn);
        });
      } else {
        grid.innerHTML = '<div class="icon-placeholder" style="grid-column:1/-1;">Could not load presets</div>';
      }
    } catch (err) {
      console.error('[IconPicker]', err);
      grid.innerHTML = '<div class="icon-placeholder" style="grid-column:1/-1;">Could not load</div>';
    }

    $('iconUploadFromFile')?.addEventListener('click', () => $('iconUploadFile')?.click());
    $('iconUploadFile')?.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      if (file.size > 1024 * 1024) { toast('Max 1 MB', 'error'); return; }

      const statusEl = $('iconUploadStatus');
      statusEl.textContent = 'Uploading…';
      statusEl.className = 'upload-url-status';

      try {
        const dataUrl = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = rej;
          r.readAsDataURL(file);
        });

        const res = await apiFetch(API_FLIER + '?action=upload', {
          method: 'POST',
          body: JSON.stringify({ dataUrl, kind: 'icon' }),
        });

        if (!res.ok || !res.data?.success || !res.data.url) {
          throw new Error(res.data?.error || 'Upload failed');
        }

        selectedUrl = res.data.url;
        statusEl.textContent = 'Uploaded — click Save';
        statusEl.className = 'upload-url-status success';
        $('iconPickerSave').disabled = false;
      } catch (err) {
        statusEl.textContent = err.message || 'Upload failed';
        statusEl.className = 'upload-url-status error';
      }
    });

    $('iconPickerCancel')?.addEventListener('click', closeModal);
    $('iconPickerSave')?.addEventListener('click', () => {
      if (!selectedUrl) return;
      closeModal();
      if (typeof onSelect === 'function') onSelect(selectedUrl);
    });
  }

  function gate(panel, { requiresAuth = true, requiresOnline = true, label }) {
    if (S.isLocalOnly && (requiresAuth || requiresOnline)) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('upload', `${label} needs an account`,
          'This is a local project. Sync it to your Folio account to unlock this tab.',
          `<button class="btn btn-primary" id="btnSyncNow" style="margin-top:8px;">${svg('upload', 12, 2.4)} Sync to account</button>`)}
      </div></div>`;
      $('btnSyncNow')?.addEventListener('click', () => promoteLocalProject());
      return false;
    }
    if (requiresAuth && !S.session) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('key', `${label} needs an account`, 'Sign in to access this tab.',
          `<a class="btn btn-primary" href="/register?next=${encodeURIComponent(location.pathname + location.search)}" style="margin-top:8px;">Sign in</a>`)}
      </div></div>`;
      return false;
    }
    if (requiresOnline && !S.online) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('alertCircle', `${label} needs internet`, 'Reconnect to load this data.')}
      </div></div>`;
      return false;
    }
    return true;
  }

  let _docsActiveSection = 'getting-started';

  function openDocsOverlay(section = null) {
    const overlay = $('docsOverlay');
    if (!overlay) return;
    if (section && DOCS_CONTENT[section]) _docsActiveSection = section;
    overlay.hidden = false;
    overlay.classList.add('visible');
    document.body.style.overflow = 'hidden';
    renderDocsSidebar();
    renderDocsContent(_docsActiveSection);
    setTimeout(() => $('docsClose')?.focus(), 50);
  }

  function closeDocsOverlay() {
    const overlay = $('docsOverlay');
    if (!overlay) return;
    overlay.classList.remove('visible');
    overlay.hidden = true;
    document.body.style.overflow = '';
    // Return focus to docs tab
    const docsTab = document.querySelector('[data-top-tab="docs"]');
    if (docsTab) docsTab.focus();
  }

  function renderDocsSidebar() {
    const sidebar = $('docsSidebar');
    if (!sidebar) return;
    sidebar.innerHTML = DOCS_SECTIONS.map(s => `
      <button class="docs-sidebar-item ${s.id === _docsActiveSection ? 'active' : ''}" data-docs-section="${escapeAttr(s.id)}" type="button">
        ${svg(s.icon, 13, 2.2)}
        <span>${escapeHTML(s.title)}</span>
      </button>
    `).join('');
    sidebar.querySelectorAll('[data-docs-section]').forEach(btn => {
      btn.addEventListener('click', () => {
        _docsActiveSection = btn.dataset.docsSection;
        renderDocsSidebar();
        renderDocsContent(_docsActiveSection);
      });
    });
  }

  function renderDocsContent(sectionId) {
    const main = $('docsMain');
    if (!main) return;
    const content = DOCS_CONTENT[sectionId];
    if (!content) return;

    main.innerHTML = `
      <div class="docs-content" data-docs-content>
        <h1 class="docs-content-title">${escapeHTML(content.title)}</h1>
        <div class="docs-content-body">${content.body}</div>
      </div>
    `;

    // Wrap each <pre> in a copy-button container
    main.querySelectorAll('pre').forEach(pre => {
      const wrap = document.createElement('div');
      wrap.className = 'docs-code-block';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);

      const copyBtn = document.createElement('button');
      copyBtn.className = 'docs-copy-btn';
      copyBtn.type = 'button';
      copyBtn.innerHTML = `${svg('copy', 11, 2.2)} <span>Copy</span>`;
      copyBtn.addEventListener('click', () => {
        const code = pre.querySelector('code')?.textContent || pre.textContent || '';
        if (copyToClipboard(code)) {
          copyBtn.innerHTML = `${svg('check', 11, 2.4)} <span>Copied</span>`;
          setTimeout(() => {
            copyBtn.innerHTML = `${svg('copy', 11, 2.2)} <span>Copy</span>`;
          }, 1400);
        } else {
          toast('Copy failed', 'error');
        }
      });
      wrap.appendChild(copyBtn);
    });

    main.scrollTop = 0;
  }

  function copyAllDocs() {
    const content = DOCS_CONTENT[_docsActiveSection];
    if (!content) return;

    // Extract text from the body div
    const container = document.createElement('div');
    container.innerHTML = content.body;
    container.querySelectorAll('pre').forEach(pre => {
      const code = pre.querySelector('code')?.textContent || pre.textContent || '';
      const newPre = document.createElement('pre');
      newPre.textContent = '```\n' + code + '\n```';
      pre.replaceWith(newPre);
    });
    container.querySelectorAll('h2').forEach(h => {
      const newH = document.createElement('h2');
      newH.textContent = '## ' + h.textContent;
      h.replaceWith(newH);
    });
    container.querySelectorAll('li').forEach(li => {
      const newLi = document.createElement('li');
      newLi.textContent = '- ' + li.textContent;
      li.replaceWith(newLi);
    });

    const markdown = '# ' + content.title + '\n\n' + container.textContent.replace(/\n{3,}/g, '\n\n').trim();

    if (copyToClipboard(markdown)) {
      toast('Copied to clipboard', 'success');
    } else {
      toast('Copy failed', 'error');
    }
  }

  function wireGlobal() {
    // Modal close on backdrop
    $('modalOverlay').addEventListener('click', (e) => {
      if (e.target === $('modalOverlay')) closeModal();
    });
    document.addEventListener('click', (e) => {
      if (e.target.matches('[data-modal-close]')) closeModal();
    });

    // Docs overlay
    $('docsClose')?.addEventListener('click', closeDocsOverlay);
    $('docsCopyAll')?.addEventListener('click', copyAllDocs);

    // Header buttons
    $('btnDeploy')?.addEventListener('click', () => {
      if (S.project?.deployment?.url) window.open(S.project.deployment.url, '_blank', 'noopener');
      else deployNow();
    });
    $('btnBell')?.addEventListener('click', () => window.open('/notifications', '_blank', 'noopener'));
    $('btnMore')?.addEventListener('click', openMoreMenu);
    $('headerIdentity')?.addEventListener('click', openEditProjectModal);
    $('emptyProjectRetry')?.addEventListener('click', () => location.reload());

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Esc closes docs or modal
      if (e.key === 'Escape') {
        if (!$('docsOverlay').hidden) {
          closeDocsOverlay();
          return;
        }
        if ($('modalOverlay').classList.contains('active')) {
          closeModal();
          return;
        }
      }
      // Arrow navigation in tabs
      if (!e.target.closest || !e.target.closest('#topTabsBar')) return;
      const idx = S.tabs.findIndex(t => t.id === S.activeTab);
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        switchTab(S.tabs[Math.min(idx + 1, S.tabs.length - 1)].id);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        switchTab(S.tabs[Math.max(idx - 1, 0)].id);
      }
    });

    // Online/offline
    const updateOnline = () => {
      S.online = navigator.onLine;
      $('offlineBanner').classList.toggle('visible', !S.online);
      updateModeBanner();
      if (S.online) flushSyncQueue();
    };
    window.addEventListener('online', updateOnline);
    window.addEventListener('offline', updateOnline);
    updateOnline();

    // Notification polling
    if (S.bellTimer) clearInterval(S.bellTimer);
    S.bellTimer = setInterval(() => {
      if (document.visibilityState === 'visible') loadNotificationStats();
    }, 60000);

    // Note editor history
    window.addEventListener('beforeunload', (e) => {
      const noteOverlay = document.querySelector('.note-editor-overlay.open');
      if (noteOverlay) {
        e.preventDefault();
        e.returnValue = '';
        return '';
      }
    });

    window.addEventListener('popstate', () => {
      const noteOverlay = document.querySelector('.note-editor-overlay.open');
      if (noteOverlay && S._noteHistoryPushed) {
        S._noteHistoryPushed = false;
        noteOverlay.querySelector('.note-editor-back')?.click();
      }
    });

    startSyncFlushLoop();
  }

  async function boot() {
    wireThemeSync();
    wireThemeMediaQuery();
    readSession();
    S.pid = getPid();

    if (!S.pid) {
      showEmptyState('empty', 'No project selected', 'Open a project to see this dashboard.', null);
      wireGlobal();
      return;
    }

    try { await openDB(); } catch (err) {
      showEmptyState('notfound', 'Storage unavailable', 'Close other tabs and reload.', S.pid);
      wireGlobal();
      return;
    }
    try { await navigator.storage?.persist?.(); } catch {}

    initCreateProject({
      apiFetch,
      db: {
        putProject: IDB.putProject,
        getProject: IDB.getProject,
        listProjects: async () => dbWrap(dbTx('projects').getAll()),
        putFile: IDB.putFile,
        listFiles: IDB.listFiles,
        setProjectMeta: IDB.setProjectMeta,
      },
      toast,
      workspace: { openProject: async (p) => { window.location.href = '/project?pid=' + encodeURIComponent(p.pid) + '&welcome=1'; } },
      setPidInUrl: (pid) => {
        const url = new URL(location.href);
        if (pid) url.searchParams.set('pid', pid);
        else url.searchParams.delete('pid');
        history.replaceState(null, '', url.toString());
      },
      getAvatarColor, getInitials,
      renderSidebar: () => {},
      renderEmptyRecent: () => {},
      DEFAULT_PROJECT_STORAGE_LIMIT,
      API_HOST, API_FLIER,
      isGuest: () => !S.session,
      isOnline: () => S.online,
      getUsername: () => S.user?.profile?.username || null,
      getSession: () => S.session,
      getUid: () => S.user?.uid || null,
    });
    window.createNewProject = createNewProject;

    const handledImage = handleNewProjectImageReturn();
    if (handledImage) return;

    const hashTab = getHashTab();
    const lastTab = shouldRememberTab() ? getLastTab() : null;
    S.activeTab = hashTab || lastTab || 'overview';
    // If someone lands on #/docs, open the docs overlay
    if (S.activeTab === 'docs') S.activeTab = 'overview';

    const ok = await loadProject();
    if (!ok) {
      wireGlobal();
      return;
    }

    if (!S.tabs.some(t => t.id === S.activeTab)) S.activeTab = 'overview';
    renderTopTabs();
    renderPanel();
    wireGlobal();

    // If arriving at #/docs directly, open docs
    if (hashTab === 'docs') {
      setTimeout(() => openDocsOverlay(), 200);
    }

    loadNotificationStats().catch(() => {});
    refreshSyncQueueCount().catch(() => {});
    if (S.online && S.syncQueueCount > 0) flushSyncQueue();

    if (S.session && S.online && !S.isLocalOnly) {
      import('/js/create-project.js').then(mod => {
        if (typeof mod.promoteQueuedLocalProjects === 'function') {
          mod.promoteQueuedLocalProjects().catch(() => {});
        }
      }).catch(() => {});
    }

    window.addEventListener('online', () => {
      if (S.session && !S.isLocalOnly) {
        import('/js/create-project.js').then(mod => {
          if (typeof mod.promoteQueuedLocalProjects === 'function') {
            mod.promoteQueuedLocalProjects().catch(() => {});
          }
        }).catch(() => {});
      }
    });
  }

  document.addEventListener('DOMContentLoaded', boot);

})();
</script>

</body>
</html>
