  async function renderCommitsPanel(panel) {
  if (!gate(panel, { label: 'Commits', requiresOnline: false })) return;
  panel.innerHTML = skeletonCard(4);

  let versions = [];
  let files = [];
  try { [versions, files] = await Promise.all([IDB.listVersions(S.pid), IDB.listFiles(S.pid)]); } catch {}
  bumpTabCount('commits', versions.length);

  const canEdit = S.isEditor && !S.isLocalOnly;
  const realFiles = files.filter(f => !isSystemFile(f.path));

  let changeCount = 0;
  if (versions.length > 0) {
    const lastFiles = versions[0].files || {};
    for (const f of realFiles) {
      if (lastFiles[f.path] !== (f.content || '')) changeCount++;
    }
    for (const p of Object.keys(lastFiles)) {
      if (!realFiles.find(f => f.path === p) && p !== NOTES_PATH) changeCount++;
    }
  } else if (realFiles.length > 0) {
    changeCount = realFiles.length;
  }

  const emptyDesc = canEdit
    ? "Commit a snapshot of your current files to start tracking history."
    : "Owner hasn't committed any versions yet.";

  panel.innerHTML = `
    ${changeCount > 0 && canEdit ? `
      <div class="card" style="border-color:var(--theme-primary);">
        <div class="card-body" style="display:flex;align-items:center;gap:10px;">
          <div style="color:var(--theme-primary);">${svg('git-commit', 18, 2.2)}</div>
          <div style="flex:1;font-size:11.5px;color:var(--theme-text-secondary);">
            ${changeCount} file${changeCount === 1 ? '' : 's'} changed since last commit
          </div>
          <button class="btn btn-sm btn-primary" id="btnCommitNow">Commit now</button>
        </div>
      </div>
    ` : ''}

    ${versions.length === 0 ? `
      <div class="card"><div class="card-body">
        ${emptyState('git-commit', 'No commits yet', emptyDesc,
          canEdit ? `<button class="btn btn-primary btn-sm" id="btnFirstCommit" style="margin-top:8px;">${svg('git-commit', 10, 2.4)} Commit now</button>` : '')}
      </div></div>
    ` : `
      <div class="commits-list">
        ${versions.map((v, idx) => {
          const prev = versions[idx + 1];
          const isDeploy = v.kind === 'deploy';
          const fileCount = Object.keys(v.files || {}).length;
          let add = 0, rem = 0;
          if (prev) {
            for (const [p, content] of Object.entries(v.files || {})) {
              const before = (prev.files || {})[p] || '';
              const beforeLines = before.split('\n').length;
              const afterLines = String(content || '').split('\n').length;
              if (afterLines > beforeLines) add += afterLines - beforeLines;
              if (beforeLines > afterLines) rem += beforeLines - afterLines;
            }
          }
          return `
            <div class="commit-row ${isDeploy ? 'commit-deploy' : ''}">
              <div class="commit-header">
                <div class="commit-icon">${svg(isDeploy ? 'rocket' : 'git-commit', 13, 2.2)}</div>
                <div class="commit-info">
                  <div class="commit-message">${escapeHTML(v.message || 'Untitled')}</div>
                  <div class="commit-meta">
                    ${isDeploy ? '<span class="vis-badge private" style="font-size:8px;">DEPLOY</span>' : ''}
                    <span>${timeAgo(v.createdAt)}</span>
                    <span>·</span>
                    <span>${fileCount} file${fileCount === 1 ? '' : 's'}</span>
                    ${add || rem ? `<span>·</span><span style="color:var(--theme-success);">+${add}</span><span style="color:var(--theme-danger);">−${rem}</span>` : ''}
                  </div>
                </div>
              </div>
              <div class="commit-actions">
                ${S.isEditor && S.online && S.syncState === 'synced' && v.kind !== 'deploy' ? `
                  <button class="btn btn-sm btn-secondary" data-commit-redeploy="${escapeAttr(v.vid)}">${svg('rocket', 10, 2.2)} Redeploy</button>
                ` : ''}
                ${canEdit ? `<button class="btn btn-sm btn-secondary" data-commit-restore="${escapeAttr(v.vid)}">${svg('refresh', 10, 2.2)} Restore</button>` : ''}
                ${prev ? `<button class="btn btn-sm btn-ghost" data-commit-diff="${escapeAttr(prev.vid)}|${escapeAttr(v.vid)}">${svg('code', 10, 2.2)} Diff</button>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;

  panel.querySelectorAll('[data-commit-redeploy]').forEach(btn => {
    btn.addEventListener('click', () => redeployVersion(btn.dataset.commitRedeploy));
  });
  panel.querySelectorAll('[data-commit-restore]').forEach(btn => {
    btn.addEventListener('click', () => restoreCommit(btn.dataset.commitRestore));
  });
  $('btnCommitNow')?.addEventListener('click', openCommitDialog);
  $('btnFirstCommit')?.addEventListener('click', openCommitDialog);
}

  async function restoreCommit(versionId) {
    const version = await IDB.getVersion(versionId);
    if (!version) { toast('Version not found', 'error'); return; }
    confirmModal('Restore this commit?', 'Current files will be replaced.', 'Restore', true, async () => {
      showLoading('Restoring', '');
      try {
        const currentFiles = await IDB.listFiles(S.pid);
        const snapshot = {};
        for (const f of currentFiles) {
          if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
          snapshot[f.path] = f.content || '';
        }
        await IDB.putVersion({
          vid: `v_auto_${Date.now()}`,
          pid: S.pid,
          message: `Auto-snapshot before restore`,
          files: snapshot,
          createdAt: Date.now(),
        });

        for (const f of currentFiles) await IDB.deleteFile(S.pid, f.path);
        for (const [path, content] of Object.entries(version.files || {})) {
          await IDB.putFile(S.pid, path, content);
        }

        if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
          await apiFetch(API_HOST + '?action=project/sync-back', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, files: version.files }),
          }).catch(() => {});
        }

        // Prune old auto-snapshots beyond 5
        const allVersions = await IDB.listVersions(S.pid);
        const autos = allVersions.filter(v => v.vid?.startsWith('v_auto_')).slice(5);
        for (const v of autos) {
          await dbWrap(dbTx('versions', 'readwrite').delete(v.vid));
        }

        hideLoading();
        toast('Commit restored', 'success');
        await refreshFileCount();
        renderPanel();
      } catch (err) {
        hideLoading();
        toast(err.message || 'Restore failed', 'error');
      }
    });
  }

  async function openCommitDialog() {
  if (!S.isEditor) { toast('Read-only', 'warning'); return; }

  let files = [], versions = [];
  try {
    [files, versions] = await Promise.all([IDB.listFiles(S.pid), IDB.listVersions(S.pid)]);
  } catch (err) {
    toast('Could not read project files', 'error');
    return;
  }

  // ✅ FIX: compare against the last *user* commit, not deploy snapshots.
  // Deploy snapshots have kind === 'deploy' and shouldn't be the diff baseline.
  const lastUserCommit = versions.find(v => v.kind !== 'deploy') || null;
  const baselineFiles = lastUserCommit?.files || {};

  const changes = [];
  for (const f of files) {
    if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
    const before = baselineFiles[f.path] || '';
    const after = f.content || '';
    if (before === after) continue;
    const beforeLines = before.split('\n').length;
    const afterLines = after.split('\n').length;
    changes.push({
      path: f.path,
      add: Math.max(0, afterLines - beforeLines),
      rem: Math.max(0, beforeLines - afterLines),
    });
  }

  // ✅ FIX: if no changes, still show the dialog with a clear message and
  // an option to force-commit the current state (useful as a manual checkpoint).
  const totalAdd = changes.reduce((s, c) => s + c.add, 0);
  const totalRem = changes.reduce((s, c) => s + c.rem, 0);
  const autoMsg = changes.length === 0
    ? `checkpoint: snapshot at ${new Date().toLocaleTimeString()}`
    : changes.length === 1
      ? `edit: ${changes[0].path.split('/').pop()} (+${changes[0].add}, −${changes[0].rem})`
      : `edit: ${changes.length} files (+${totalAdd}, −${totalRem})`;

  const changesHtml = changes.length === 0
    ? `<div style="padding:14px;background:var(--theme-glass-bg);border-radius:8px;font-size:11.5px;color:var(--theme-text-tertiary);text-align:center;">
        No file changes since last commit.<br>
        <span style="font-size:10.5px;">You can still commit a checkpoint of the current state.</span>
      </div>`
    : `<div class="commit-changes">
        ${changes.map(c => `
          <div class="commit-change-row">
            <span class="icon">${svg(fileIconName(c.path), 10, 2.2)}</span>
            <span class="name">${escapeHTML(c.path)}</span>
            <span class="stat">
              <span class="add">+${c.add}</span> <span class="rem">−${c.rem}</span>
            </span>
          </div>
        `).join('')}
      </div>`;

  openModal(`
    <div class="modal-title">Commit ${changes.length === 0 ? 'checkpoint' : `${changes.length} file${changes.length === 1 ? '' : 's'}`}</div>
    <div class="modal-desc">Snapshot the current state as a commit.</div>
    <div class="field">
      <label class="field-label">Message</label>
      <input class="input" id="commitMsg" value="${escapeAttr(autoMsg)}" maxlength="200">
    </div>
    <div class="field">
      <label class="field-label">${changes.length === 0 ? 'No changes' : 'Changes'}</label>
      ${changesHtml}
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="commitSubmit">${svg('check', 10, 2.4)} Commit</button>
    </div>
  `);

  $('commitSubmit').addEventListener('click', async () => {
    const message = ($('commitMsg').value || autoMsg).trim();
    const btn = $('commitSubmit');
    btn.disabled = true;
    btn.innerHTML = 'Committing…';

    try {
      const snapshot = {};
      for (const f of files) {
        if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
        snapshot[f.path] = f.content || '';
      }
      const vid = `v_${Date.now()}`;
      const versionData = { message, files: snapshot, createdAt: Date.now() };

      // ✅ FIX: ALWAYS write locally first. This guarantees the commit appears
      // in the UI regardless of network/server availability.
      await IDB.putVersion({ vid, pid: S.pid, ...versionData });

      // ✅ FIX: attempt server sync as a best-effort. If it fails, queue for later.
      // Never throw after the local write succeeded.
      let serverSynced = false;
      if (S.online && S.session && !S.isLocalOnly) {
        try {
          const res = await apiFetch(API_HOST + '?action=project/sync-back', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, versions: { [vid]: versionData } }),
          });
          serverSynced = res.ok && res.data?.success;
        } catch {
          serverSynced = false;
        }
      }

      if (!serverSynced) {
        await enqueueSync('version-commit', { vid, data: versionData });
      }

      closeModal();
      toast(serverSynced ? 'Committed' : 'Committed locally — will sync when online', 'success');
      bumpTabCount('commits', versions.length + 1);
      if (S.activeTab === 'commits') renderPanel();
    } catch (err) {
      console.error('[Commit]', err);
      toast(err.message || 'Commit failed', 'error');
      btn.disabled = false;
      btn.innerHTML = `${svg('check', 10, 2.4)} Commit`;
    }
  });
}

  async function toggleVisibility(axis, btn) {
    if (!S.isOwner) { toast('Only owner can change', 'warning'); return; }
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    if (S.syncState !== 'synced') { toast('Push to server first', 'warning'); return; }
    const current = S.project.visibility?.[axis];
    const next = current === 'public' ? 'private' : 'public';
    btn.classList.toggle('on', next === 'public');
    try {
      const res = await apiFetch(API_HOST + '?action=visibility', {
        method: 'POST',
        body: JSON.stringify({ pid: S.pid, visibility: { [axis]: next } }),
      });
      if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
      S.project.visibility = { ...S.project.visibility, [axis]: next };
      cacheProject(S.project);
      toast(next, 'success', 1200);
    } catch (err) {
      btn.classList.toggle('on', current === 'public');

fetch('${API_HOST}?action=db/get&pid=${S.pid}')

// Write a value

    document.querySelectorAll('[data-db-tab]').forEach(btn => {

  function renderDbTree() {
    const wrap = $('dbTreeWrap');
    if (!wrap) return;
    wrap.innerHTML = '';
    const tree = document.createElement('div');
    tree.className = 'db-tree';
    const data = S.dbData;

    function matchesFilter(path, val) {
      if (!S.dbSearch) return true;
      const q = S.dbSearch.toLowerCase();
      if (path.toLowerCase().includes(q)) return true;
      try { return JSON.stringify(val).toLowerCase().includes(q); } catch { return false; }
    }

    function renderNode(value, key, path, depth, parentIsArray) {
      const hasChildren = value !== null && typeof value === 'object';
      const isArray = Array.isArray(value);
      const isExpanded = S.dbExpanded.has(path);
      const filtered = matchesFilter(path, value);
      if (!filtered && !hasChildren) return null;

      const row = document.createElement('div');
      row.className = `tree-row ${depth > 0 ? 'child' : ''}`;
      row.style.setProperty('--depth', String(depth));

      if (hasChildren) {
        const toggle = document.createElement('span');
        toggle.className = `tree-toggle ${isExpanded ? 'open' : ''}`;
        toggle.innerHTML = svg('chevronRight', 10, 2.4);
        toggle.addEventListener('click', () => {
          if (isExpanded) S.dbExpanded.delete(path);
          else S.dbExpanded.add(path);
          renderDbTree();
        });
        row.appendChild(toggle);
      } else {
        const spacer = document.createElement('span');
        spacer.className = 'tree-toggle';
        row.appendChild(spacer);
      }

      if (key !== '') {
        const k = document.createElement('span');
        k.className = 'tree-key';
        k.textContent = key;
        k.addEventListener('click', () => {
          copyToClipboard(path);
          toast(`Copied: ${path}`, 'info', 1400);
        });
        row.appendChild(k);
        const colon = document.createElement('span');
        colon.className = 'tree-colon';
        colon.textContent = ':';
        row.appendChild(colon);
      }

      if (hasChildren) {
        const size = isArray ? value.length : Object.keys(value).length;
        const badge = document.createElement('span');
        badge.className = 'tree-badge';
        badge.textContent = isArray ? `[${size}]` : `{${size}}`;
        row.appendChild(badge);
      } else {
        const type = value === null ? 'null' : typeof value;
        const display = value === null ? 'null' : typeof value === 'string' ? `"${value}"` : String(value);
        const valEl = document.createElement('span');
        valEl.className = `tree-value ${type}`;
        valEl.textContent = display;
        valEl.title = display;
        if (!S.dbReadOnly) {
          valEl.addEventListener('dblclick', () => startEditValue(valEl, value, path));
        }
        row.appendChild(valEl);
      }

      if (!S.dbReadOnly) {
        const actions = document.createElement('div');
        actions.className = 'tree-actions';

        if (hasChildren) {
          const addBtn = document.createElement('button');
          addBtn.className = 'tree-act';
          addBtn.innerHTML = svg('plus', 10, 2.4);
          addBtn.title = 'Add';
          addBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const newKey = isArray ? String(value.length) : prompt('New key:');
            if (newKey === null) return;
            if (!isArray && (!newKey || !newKey.trim())) return;
            const childKey = isArray ? value.length : newKey.trim();
            const childPath = path ? `${path}/${childKey}` : String(childKey);
            setAtPath(S.dbData, childPath, '');
            S.dbExpanded.add(path);
            S.dbDirty = true;
            renderDbTree();
            updateDbSaveBtn();
          });
          actions.appendChild(addBtn);
        }

        const copyBtn = document.createElement('button');
        copyBtn.className = 'tree-act';
        copyBtn.innerHTML = svg('copy', 10, 2.2);
        copyBtn.title = 'Copy path';
        copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          copyToClipboard(path);
          toast(`Copied: ${path}`, 'success', 1200);
        });
        actions.appendChild(copyBtn);

        if (!parentIsArray && key !== '') {
          const renameBtn = document.createElement('button');
          renameBtn.className = 'tree-act';
          renameBtn.innerHTML = svg('edit', 10, 2.2);
          renameBtn.title = 'Rename';
          renameBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const parts = path.split('/');
            const oldKey = parts[parts.length - 1];
            const newKey = prompt('New key name:', oldKey);
            if (!newKey || newKey === oldKey || !newKey.trim()) return;
            const parentPath = parts.slice(0, -1).join('/');
            const parent = parentPath ? getAtPath(S.dbData, parentPath) : S.dbData;
            if (parent && parent[newKey.trim()] !== undefined) { toast('Key exists', 'error'); return; }
            const v = getAtPath(S.dbData, path);
            deleteAtPath(S.dbData, path);
            const newPath = parentPath ? `${parentPath}/${newKey.trim()}` : newKey.trim();
            setAtPath(S.dbData, newPath, v);
            S.dbDirty = true;
            renderDbTree();
            updateDbSaveBtn();
          });
          actions.appendChild(renameBtn);
        }

        const delBtn = document.createElement('button');
        delBtn.className = 'tree-act danger';
        delBtn.innerHTML = svg('trash', 10, 2.2);
        delBtn.title = 'Delete';
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const doDelete = () => {
            deleteAtPath(S.dbData, path);
            S.dbDirty = true;
            toast(`Deleted "${key || path}"`, 'info');
            renderDbTree();
            updateDbSaveBtn();
          };
          if (hasChildren && ((isArray ? value.length : Object.keys(value).length) > 0)) {
            confirmModal(`Delete "${key}"?`, `Removes ${isArray ? value.length + ' items' : Object.keys(value).length + ' keys'}.`, 'Delete', true, doDelete);
          } else {
            doDelete();
          }
        });
        actions.appendChild(delBtn);

        row.appendChild(actions);
      }

      const frag = document.createDocumentFragment();
      frag.appendChild(row);

      if (hasChildren && isExpanded) {
        const keys = isArray ? value.map((_, i) => i) : Object.keys(value).sort();
        for (const k of keys) {
          const child = renderNode(value[k], String(k), path ? `${path}/${k}` : String(k), depth + 1, isArray);
          if (child) frag.appendChild(child);
        }
      }

      return frag;
    }

    function startEditValue(valEl, oldValue, path) {
      const input = document.createElement('input');
      input.className = 'tree-value editing';
      input.type = typeof oldValue === 'number' ? 'number' : 'text';
      input.value = oldValue === null ? '' : String(oldValue);
      valEl.replaceWith(input);
      input.focus();
      input.select();

      const commit = () => {
        let newVal;
        const raw = input.value;
        if (typeof oldValue === 'number') newVal = Number(raw);
        else if (typeof oldValue === 'boolean') newVal = raw === 'true' || raw === '1' || raw === 'yes';
        else if (raw === 'null') newVal = null;
        else newVal = raw;
        setAtPath(S.dbData, path, newVal);
        S.dbDirty = true;
        toast(`Updated ${path}`, 'success', 1200);
        renderDbTree();
        updateDbSaveBtn();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { e.preventDefault(); renderDbTree(); }
      });
      input.addEventListener('blur', () => setTimeout(commit, 100));
    }

    const rootKeys = Object.keys(data).sort();
    if (rootKeys.length === 0) {
      tree.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="empty-state-title">Empty database</div><div class="empty-state-desc">Use "Add key" to create your first entry.</div></div>';
    } else {
      for (const k of rootKeys) {
        const node = renderNode(data[k], k, k, 0, false);
        if (node) tree.appendChild(node);
      }
      if (!S.dbReadOnly) {
        const addRow = document.createElement('div');
        addRow.className = 'tree-add';
        addRow.innerHTML = svg('plus', 10, 2.4) + ' Add top-level key';
        addRow.addEventListener('click', () => {
          const key = prompt('New top-level key:');
          if (!key || !key.trim()) return;
          if (S.dbData[key.trim()] !== undefined) { toast('Key exists', 'error'); return; }
          S.dbData[key.trim()] = '';
          S.dbExpanded.add(key.trim());
          S.dbDirty = true;
          renderDbTree();
          updateDbSaveBtn();
        });
        tree.appendChild(addRow);
      }
    }

    wrap.appendChild(tree);
  }

  function updateDbSaveBtn() {
    const btn = $('btnDbSave');
    if (!btn) return;
    if (S.dbDirty) {
      btn.disabled = false;
      btn.innerHTML = svg('check', 10, 2.4) + ' Save';
    }
  }

  function getAtPath(obj, path) {
    const parts = path.split('/').filter(Boolean);
    let cur = obj;
    for (const p of parts) {
      if (cur == null) return undefined;
      cur = cur[p];
    }
    return cur;
  }
  function setAtPath(obj, path, value) {
    const parts = path.split('/').filter(Boolean);
    if (parts.length === 0) return;
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      if (cur[parts[i]] == null || typeof cur[parts[i]] !== 'object') cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = value;
  }
  function deleteAtPath(obj, path) {
    const parts = path.split('/').filter(Boolean);
    if (parts.length === 0) return;
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      if (cur[parts[i]] == null) return;
      cur = cur[parts[i]];
    }
    if (Array.isArray(cur)) cur.splice(Number(parts[parts.length - 1]), 1);
    else delete cur[parts[parts.length - 1]];
  }

  async function readNotes() {
    try {
      const file = await IDB.getFile(S.pid, NOTES_PATH);
      if (!file || !file.content) return { version: 1, notes: [] };
      const parsed = JSON.parse(file.content);
      if (!parsed || !Array.isArray(parsed.notes)) return { version: 1, notes: [] };
      return { version: parsed.version || 1, notes: parsed.notes };
    } catch {
      return { version: 1, notes: [] };
    }
  }

  async function writeNotes(data) {
    if (data.notes.length > NOTES_MAX_COUNT) throw new Error(`Too many notes (max ${NOTES_MAX_COUNT}).`);
    for (const n of data.notes) {
      if (estimateBytes(n.body || '') > NOTES_MAX_BODY_BYTES) {
        throw new Error(`Note "${n.title || 'Untitled'}" exceeds ${formatBytes(NOTES_MAX_BODY_BYTES)}.`);
      }
    }
    const json = JSON.stringify(data, null, 2);
    await IDB.putFile(S.pid, NOTES_PATH, json);
    try {
      const project = await IDB.getProject(S.pid);
      if (project) { project.updatedAt = Date.now(); await IDB.putProject(project); }
    } catch {}
    if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
      apiFetch(API_HOST + '?action=project/sync-back', {
        method: 'POST',
        body: JSON.stringify({ pid: S.pid, files: { [NOTES_PATH]: json } }),
      }).catch(() => {});
    }
  }

  function renderMarkdownSafe(text) {
    let src = String(text ?? '');
    const codeBlocks = [];
    src = src.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (m, lang, body) => {
      const idx = codeBlocks.length;
      codeBlocks.push({ lang, body });
      return `\u0000CODE${idx}\u0000`;
    });
    src = src
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    const lines = src.split('\n');
    const out = [];
    let inUl = false, inOl = false, inBq = false;

    const closeLists = () => {
      if (inUl) { out.push('</ul>'); inUl = false; }
      if (inOl) { out.push('</ol>'); inOl = false; }
    };
    const closeBq = () => {
      if (inBq) { out.push('</blockquote>'); inBq = false; }
    };

    const inlineFmt = (s) => {
      s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">');
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      return s;
    };

    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i];
      if (/^\s*\u0000CODE\d+\u0000\s*$/.test(raw)) {
        closeLists(); closeBq();
        const match = raw.match(/\u0000CODE(\d+)\u0000/);
        const cb = codeBlocks[+match[1]];
        out.push(`<pre><code${cb.lang ? ` class="language-${cb.lang}"` : ''}>${cb.body.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`);
        continue;
      }
      if (/^\s*$/.test(raw)) { closeLists(); closeBq(); continue; }
      const h = raw.match(/^(#{1,6})\s+(.*)$/);
      if (h) { closeLists(); closeBq(); const lvl = h[1].length; out.push(`<h${lvl}>${inlineFmt(h[2])}</h${lvl}>`); continue; }
      if (/^---+$/.test(raw.trim())) { closeLists(); closeBq(); out.push('<hr>'); continue; }
      const bq = raw.match(/^>\s?(.*)$/);
      if (bq) { closeLists(); if (!inBq) { out.push('<blockquote>'); inBq = true; } out.push(`<p>${inlineFmt(bq[1])}</p>`); continue; }
      else closeBq();
      const ul = raw.match(/^\s*[-*]\s+(.*)$/);
      if (ul) { closeLists(); if (!inUl) { out.push('<ul>'); inUl = true; } out.push(`<li>${inlineFmt(ul[1])}</li>`); continue; }
      else if (inUl) { out.push('</ul>'); inUl = false; }
      const ol = raw.match(/^\s*\d+\.\s+(.*)$/);
      if (ol) { if (!inOl) { out.push('<ol>'); inOl = true; } out.push(`<li>${inlineFmt(ol[1])}</li>`); continue; }
      else if (inOl) { out.push('</ol>'); inOl = false; }
      out.push(`<p>${inlineFmt(raw)}</p>`);
    }
    closeLists(); closeBq();
    return out.join('\n');
  }

  async function openNoteEditor(noteId) {
    const data = await readNotes();
    const existing = noteId ? data.notes.find(n => n.id === noteId) : null;
    const note = existing || {
      id: `n_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
      title: '', body: '', color: 'amber', pinned: false,
      createdAt: Date.now(), updatedAt: Date.now(),
    };
    const startInEdit = !existing || !(note.body || '').trim();

    // ═══ Back-button support via history.pushState ═══
    S._noteHistoryPushed = true;
    try {
      history.pushState({ noteOpen: true }, '', location.href);
    } catch {}

    const overlay = document.createElement('div');
    overlay.className = 'note-editor-overlay';
    overlay.innerHTML = `
      <div class="note-editor-header">
        <button class="note-editor-back" type="button" aria-label="Back">${svg('chevron-left', 16, 2.4)}</button>
        <input class="note-editor-title" type="text" placeholder="Note title" maxlength="120" value="${escapeAttr(note.title || '')}">
        <div class="note-editor-title-readonly hidden">${escapeHTML(note.title || 'Untitled')}</div>
        <div class="note-editor-actions">
          <button class="note-editor-action note-mode-btn" data-act="mode" type="button" aria-label="Edit">${svg('edit', 14, 2.2)}</button>
          <button class="note-editor-action ${note.pinned ? 'active' : ''}" data-act="pin" type="button" aria-label="Pin">${svg('bookmark', 14, 2.2)}</button>
          <button class="note-editor-action" data-act="color" type="button" aria-label="Color" style="color:${noteAccentColor(note.color)}">${svg('droplet', 14, 2.2)}</button>
          ${existing ? `<button class="note-editor-action danger" data-act="delete" type="button" aria-label="Delete">${svg('trash', 14, 2.2)}</button>` : ''}
        </div>
      </div>
      <div class="note-format-bar hidden"></div>
      <textarea class="note-editor-body" placeholder="Start writing… Markdown supported." spellcheck="false">${escapeHTML(note.body || '')}</textarea>
      <div class="note-editor-body-readonly hidden"></div>
      <div class="note-editor-status">
        <span class="note-editor-words">0 words</span>
        <span class="note-editor-save">Saved</span>
      </div>
    `;

    const titleEl = overlay.querySelector('.note-editor-title');
    const titleReadonly = overlay.querySelector('.note-editor-title-readonly');
    const bodyEl = overlay.querySelector('.note-editor-body');
    const bodyReadonly = overlay.querySelector('.note-editor-body-readonly');
    const wordsEl = overlay.querySelector('.note-editor-words');
    const saveEl = overlay.querySelector('.note-editor-save');
    const modeBtn = overlay.querySelector('[data-act="mode"]');
    const formatBar = overlay.querySelector('.note-format-bar');

    let currentMode = startInEdit ? 'edit' : 'read';
    let autosaveTimer = null;
    let dirty = false;
    let isDeleted = false;

    function updateWords() {
      const words = (bodyEl.value.trim().match(/\S+/g) || []).length;
      wordsEl.textContent = `${words} word${words === 1 ? '' : 's'}`;
    }

    function setMode(mode) {
      currentMode = mode;
      const isEdit = mode === 'edit';
      titleEl.classList.toggle('hidden', !isEdit);
      titleReadonly.classList.toggle('hidden', isEdit);
      bodyEl.classList.toggle('hidden', !isEdit);
      bodyReadonly.classList.toggle('hidden', isEdit);
      formatBar.classList.toggle('hidden', !isEdit);
      modeBtn.innerHTML = svg(isEdit ? 'check' : 'edit', 14, 2.2);
      modeBtn.classList.toggle('active', isEdit);
      modeBtn.setAttribute('aria-label', isEdit ? 'Done' : 'Edit');
      if (isEdit) {
        setTimeout(() => bodyEl.focus(), 50);
      } else {
        titleReadonly.textContent = titleEl.value || 'Untitled';
        bodyReadonly.innerHTML = renderMarkdownSafe(bodyEl.value || '');
        if (dirty) doSave();
      }
    }

    function buildFormatBar() {
      const groups = [
        [{ id: 'h1', prefix: '# ', block: true }, { id: 'h2', prefix: '## ', block: true }, { id: 'h3', prefix: '### ', block: true }],
        [{ id: 'bold', wrap: ['**', '**'] }, { id: 'italic', wrap: ['*', '*'] }, { id: 'strike', wrap: ['~~', '~~'] }],
        [{ id: 'ul', prefix: '- ', block: true }, { id: 'ol', prefix: '1. ', block: true }, { id: 'quote', prefix: '> ', block: true }],
        [{ id: 'link', wrap: ['[', '](https://)'] }, { id: 'image', wrap: ['![', '](https://)'] }, { id: 'code', wrap: ['`', '`'] }],
      ];
      formatBar.innerHTML = groups.map(group => `<div class="note-format-group">${group.map(btn => `<button class="note-format-btn" type="button" data-fmt='${JSON.stringify(btn)}' title="${btn.id}">${svg(btn.id === 'ul' ? 'list' : btn.id === 'ol' ? 'list' : btn.id === 'quote' ? 'quote' : btn.id === 'link' ? 'link' : btn.id === 'image' ? 'image' : btn.id === 'code' ? 'code' : btn.id === 'h1' ? 'h1' : btn.id === 'h2' ? 'h2' : btn.id === 'h3' ? 'h3' : btn.id === 'bold' ? 'bold' : btn.id === 'italic' ? 'italic' : btn.id === 'strike' ? 'strike' : 'hash', 13, 2.2)}</button>`).join('')}</div>`).join('');
      formatBar.querySelectorAll('.note-format-btn').forEach(btn => {
        btn.addEventListener('mousedown', (e) => e.preventDefault());
        btn.addEventListener('click', () => applyMarkdown(JSON.parse(btn.dataset.fmt)));
      });
    }

    function applyMarkdown(action) {
      const start = bodyEl.selectionStart;
      const end = bodyEl.selectionEnd;
      const value = bodyEl.value;
      const selected = value.slice(start, end);

      if (action.block) {
        const lineStart = value.lastIndexOf('\n', start - 1) + 1;
        bodyEl.value = value.slice(0, lineStart) + action.prefix + value.slice(lineStart);
        bodyEl.selectionStart = start + action.prefix.length;
        bodyEl.selectionEnd = end + action.prefix.length;
      } else if (action.wrap) {
        const [before, after] = action.wrap;
        bodyEl.value = value.slice(0, start) + before + selected + after + value.slice(end);
        bodyEl.selectionStart = start + before.length;
        bodyEl.selectionEnd = start + before.length + selected.length;
      }
      note.body = bodyEl.value;
      updateWords();
      markDirty();
      bodyEl.focus();
    }

    function markDirty() {
      if (!dirty) { dirty = true; saveEl.textContent = 'Editing…'; saveEl.classList.add('dirty'); }
      if (autosaveTimer) clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(doSave, 800);
    }

    async function doSave() {
      if (!dirty || isDeleted) return;
      try {
        if (!note.title.trim()) {
          const m = bodyEl.value.match(/^#{1,6}\s+(.+)$/m);
          if (m) { note.title = m[1].trim().slice(0, 120); titleEl.value = note.title; }
        }
        note.title = titleEl.value.trim();
        note.body = bodyEl.value;
        note.updatedAt = Date.now();
        const fresh = await readNotes();
        const idx = fresh.notes.findIndex(n => n.id === note.id);
        if (idx >= 0) fresh.notes[idx] = note;
        else fresh.notes.push(note);
        await writeNotes(fresh);
        dirty = false;
        saveEl.textContent = 'Saved';
        saveEl.classList.remove('dirty');
        if (S.activeTab === 'notes') renderPanel();
      } catch (err) {
        saveEl.textContent = 'Save failed';
        saveEl.classList.add('error');
        toast(err.message || "Couldn't save", 'error', 4000);
      }
    }

    function teardown() {
      if (autosaveTimer) clearTimeout(autosaveTimer);
      overlay.classList.remove('open');
      setTimeout(() => overlay.remove(), 320);
      if (S._noteHistoryPushed) {
        S._noteHistoryPushed = false;
        try { history.back(); } catch {}
      }
    }

    async function closeMe() {
      if (dirty && !isDeleted) await doSave();
      teardown();
    }

    async function deleteMe() {
      confirmModal('Delete this note?', "Can't be undone.", 'Delete', true, async () => {
        isDeleted = true;
        const fresh = await readNotes();
        fresh.notes = fresh.notes.filter(n => n.id !== note.id);
        await writeNotes(fresh);
        toast('Note deleted', 'info');
        teardown();
        if (S.activeTab === 'notes') renderPanel();
      });
    }

    overlay.querySelector('.note-editor-back').addEventListener('click', closeMe);
    titleEl.addEventListener('input', () => { note.title = titleEl.value; markDirty(); });
    bodyEl.addEventListener('input', () => { note.body = bodyEl.value; updateWords(); markDirty(); });
    modeBtn.addEventListener('click', () => setMode(currentMode === 'read' ? 'edit' : 'read'));
    overlay.querySelector('[data-act="pin"]')?.addEventListener('click', (e) => {
      note.pinned = !note.pinned;
      e.currentTarget.classList.toggle('active', note.pinned);
      markDirty();
    });
    overlay.querySelector('[data-act="color"]')?.addEventListener('click', (e) => {
      const pop = document.createElement('div');
      pop.className = 'note-color-popover';
      Object.entries(NOTE_COLORS).forEach(([name, hex]) => {
        const sw = document.createElement('button');
        sw.className = 'note-color-swatch' + (note.color === name ? ' active' : '');
        sw.type = 'button';
        sw.style.background = hex;
        sw.addEventListener('click', () => {
          note.color = name;
          e.currentTarget.style.color = hex;
          markDirty();
          pop.remove();
        });
        pop.appendChild(sw);
      });
      const rect = e.currentTarget.getBoundingClientRect();
      pop.style.top = (rect.bottom + 4) + 'px';
      pop.style.right = (window.innerWidth - rect.right) + 'px';
      document.body.appendChild(pop);
      setTimeout(() => {
        document.addEventListener('click', function handler(ev) {
          if (!pop.contains(ev.target) && ev.target !== e.currentTarget) {
            pop.remove();
            document.removeEventListener('click', handler);
          }
        });
      }, 50);
    });
    overlay.querySelector('[data-act="delete"]')?.addEventListener('click', deleteMe);

    document.body.appendChild(overlay);
    buildFormatBar();
    requestAnimationFrame(() => {
      overlay.classList.add('open');
      setMode(currentMode);
      updateWords();
    });
    setTimeout(() => {
      if (currentMode === 'edit') {
        if (!note.title) titleEl.focus();
        else bodyEl.focus();
      }
    }, 150);

    const escHandler = (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeMe();
        document.removeEventListener('keydown', escHandler);
      }
    };
    document.addEventListener('keydown', escHandler);
  }

  async function renderLogsPanel(panel) {
    if (!gate(panel, { label: 'Logs' })) return;
    if (S.syncState !== 'synced') {
      panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('list', 'Logs need a server project', 'Push this project to the server first to see activity.')}</div></div>`;
      return;
    }
    panel.innerHTML = skeletonCard(6);
    S.logsOffset = 0;
    const res = await apiFetch(API_HOST + '?action=logs&pid=' + encodeURIComponent(S.pid) + '&limit=50');
    if (!res.ok || !res.data?.success) {
      panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('list', "Couldn't load logs", 'Try refreshing.')}</div></div>`;
      return;
    }
    S.logsData = res.data;
    bumpTabCount('logs', res.data.total || 0);

    panel.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="card-title">${svg('list', 13, 2.2)} Activity (${res.data.total || 0})</div>
          <button class="btn btn-sm btn-ghost btn-icon" id="btnRefreshLogs">${svg('refresh', 10, 2.2)}</button>
        </div>
        <div class="card-body tight">
          ${(res.data.logs || []).length === 0
            ? emptyState('list', 'No activity', 'Actions will appear here.')
            : `<div class="row-list" id="logList">${res.data.logs.map(renderLogRow).join('')}</div>
              ${res.data.hasMore ? `<button class="btn btn-secondary btn-block" id="btnLoadMoreLogs" style="margin-top:8px;">Load more</button>` : ''}`}
        </div>
      </div>
    `;
    $('btnRefreshLogs')?.addEventListener('click', () => renderPanel());
    $('btnLoadMoreLogs')?.addEventListener('click', loadMoreLogs);
  }

  function renderLogRow(l) {
    return `<div class="log-entry">
      <div class="log-time">${timeAgo(l.ts)}</div>
      <div class="log-body">
        <div class="log-type">${escapeHTML(l.type || 'event')}</div>
        <div class="log-action">${escapeHTML(l.action || '')}</div>
      </div>
    </div>`;
  }

  async function loadMoreLogs() {
    const newOffset = (S.logsData?.logs || []).length;
    const res = await apiFetch(API_HOST + '?action=logs&pid=' + encodeURIComponent(S.pid) + '&limit=50&offset=' + newOffset);
    if (!res.ok || !res.data?.success) return;
    const list = $('logList');
    if (!list) return;
    (res.data.logs || []).forEach(l => list.insertAdjacentHTML('beforeend', renderLogRow(l)));
    if (!res.data.hasMore) $('btnLoadMoreLogs')?.remove();
  }

  async function renderDownloadsPanel(panel) {
    panel.innerHTML = `
      <div class="card">
        <div class="card-header"><div class="card-title">${svg('download', 13, 2.2)} Export</div></div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:8px;">
          <button class="btn btn-primary btn-block" id="btnDownloadFolio">${svg('download', 12, 2.4)} .folio backup</button>
          <div class="field-hint">Files, versions${S.syncState === 'synced' ? ', JSON DB' : ''}.</div>
          <button class="btn btn-secondary btn-block" id="btnDownloadZip">${svg('download', 12, 2.4)} .zip (files)</button>
          <div class="field-hint">Current files only.</div>
          ${S.syncState === 'synced' ? `<button class="btn btn-secondary btn-block" id="btnDownloadDb">${svg('download', 12, 2.4)} JSON database</button>` : ''}
        </div>
      </div>
    `;
    $('btnDownloadFolio')?.addEventListener('click', async () => {
      if (S.isLocalOnly || !S.session || S.syncState !== 'synced') await exportLocalFolio();
      else await downloadProject('folio');
    });
    $('btnDownloadZip')?.addEventListener('click', async () => {
      if (S.isLocalOnly || !S.session || S.syncState !== 'synced') await exportLocalJson();
      else await downloadProject('zip');
    });
    $('btnDownloadDb')?.addEventListener('click', downloadJsonDb);
  }

  async function exportLocalFolio() {
    try {
      const files = await IDB.listFiles(S.pid);
      const versions = await IDB.listVersions(S.pid);
      const payload = {
        folioVersion: 1, exportedAt: new Date().toISOString(),
        pid: S.pid, name: S.project.name || '', slug: S.project.slug || '',
        files: Object.fromEntries(files.map(f => [f.path, f.content])),
        versions: versions.map(v => ({ message: v.message, files: v.files, createdAt: v.createdAt, kind: v.kind || null })),
      };
      triggerDownload(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), `${S.project.slug || 'project'}-local.folio`);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Export failed', 'error'); }
  }

  async function exportLocalJson() {
    try {
      const files = await IDB.listFiles(S.pid);
      const payload = Object.fromEntries(files.map(f => [f.path, f.content]));
      triggerDownload(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), `${S.project.slug || 'project'}-files.json`);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Export failed', 'error'); }
  }

  async function downloadProject(format) {
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    try {
      const url = `${API_HOST}?action=project/export&pid=${encodeURIComponent(S.pid)}&format=${format}`;
      const res = await fetch(url, { headers: { Authorization: `Bearer ${S.session}` } });
      if (!res.ok) throw new Error('Download failed');
      const blob = await res.blob();
      triggerDownload(blob, `${S.project.slug || 'project'}-${S.pid.slice(-6)}.${format === 'folio' ? 'folio' : 'zip'}`);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Download failed', 'error'); }
  }

  async function downloadJsonDb() {
    if (!S.online || S.syncState !== 'synced') { toast('Requires internet', 'warning'); return; }
    try {
      const res = await apiFetch(API_HOST + '?action=db/get&pid=' + encodeURIComponent(S.pid));
      if (!res.ok || !res.data?.success) throw new Error('Failed');
      triggerDownload(new Blob([JSON.stringify(res.data.data || {}, null, 2)], { type: 'application/json' }), `${S.project.slug || 'project'}-db.json`);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Download failed', 'error'); }
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

        </div>

    $('btnDownloadPublicZip')?.addEventListener('click', () => toast('Download .zip (simulated)', 'info'));

  function confirmClearVersions() {
    confirmModal('Clear manual commits?', 'Deploy snapshots are kept.', 'Clear', true, async () => {
      showLoading('Clearing', '');
      try {
        if (!S.isLocalOnly && S.session && S.online && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=versions/clear', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        const versions = await IDB.listVersions(S.pid);
        for (const v of versions) {
          if (v.kind === 'deploy') continue;
          await dbWrap(dbTx('versions', 'readwrite').delete(v.vid));
        }
        hideLoading();
        toast('Versions cleared', 'success');
        renderPanel();
      } catch (err) { hideLoading(); toast(err.message || 'Failed', 'error'); }
    });
  }

  function clearLocalCache() {
    try {
      localStorage.removeItem(STORAGE.cache + '.' + S.pid);
      sessionStorage.removeItem(STORAGE.expanded + '.' + S.pid);
      toast('Local cache cleared', 'success');
    } catch { toast('Could not clear cache', 'error'); }
  }

  function confirmDeleteProject() {
    openModal(`
      <div class="modal-title">Delete project?</div>
      <div class="modal-desc">Type the project name to confirm. Cannot be undone.</div>
      <div class="field">
        <label class="field-label">Type "${escapeHTML(S.project.name)}"</label>
        <input class="input" id="deleteConfirmInput" placeholder="Project name">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" id="deleteConfirmBtn" disabled>Delete</button>
      </div>
    `);
    $('deleteConfirmInput').addEventListener('input', (e) => {
      $('deleteConfirmBtn').disabled = e.target.value !== S.project.name;
    });
    $('deleteConfirmBtn').addEventListener('click', async () => {
      showLoading('Deleting', '');
      try {
        if (S.session && !S.isLocalOnly && S.online && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=projects/delete', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        await IDB.deleteProject(S.pid);
        try {
          localStorage.removeItem(STORAGE.cache + '.' + S.pid);
          localStorage.removeItem(STORAGE.lastTab + '.' + S.pid);
          sessionStorage.removeItem(STORAGE.expanded + '.' + S.pid);
        } catch {}
        hideLoading();
        toast('Deleted', 'success');
        setTimeout(() => { window.location.href = '/projects'; }, 800);
      } catch (err) { hideLoading(); toast(err.message || 'Delete failed', 'error'); }
    });
  }

  function gate(panel, { requiresAuth = true, requiresOnline = true, label }) {
    if (S.isLocalOnly && (requiresAuth || requiresOnline)) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('upload', `${label} needs an account`,
          'This is a local project. Sync it to your Folio account to unlock this tab.',
          `<button class="btn btn-primary" id="btnSyncNow" style="margin-top:8px;">${svg('upload', 12, 2.4)} Sync to account</button>`)}
      </div></div>`;
      $('btnSyncNow')?.addEventListener('click', () => promoteLocalProject());
      return false;
    }
    if (requiresAuth && !S.session) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('key', `${label} needs an account`, 'Sign in to access this tab.',
          `<a class="btn btn-primary" href="/register?next=${encodeURIComponent(location.pathname + location.search)}" style="margin-top:8px;">Sign in</a>`)}
      </div></div>`;
      return false;
    }
    if (requiresOnline && !S.online) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('alertCircle', `${label} needs internet`, 'Reconnect to load this data.')}
      </div></div>`;
      return false;
    }
    return true;
  }

  function openMoreMenu() {
    const items = [
      { label: 'Edit project', icon: 'edit3', action: openEditProjectModal },
      { label: 'Share', icon: 'share', action: () => { switchTab('sharing'); const url = buildProjectShareUrl(); if (url && copyToClipboard(url)) toast('Link copied', 'success', 1200); } },
      { label: 'Refresh', icon: 'refresh', action: () => { S.deployCache = { history: null, currentId: null, total: 0, at: 0, maxDeployments: 5 }; loadDeployState(); S.analyticsCache = null; loadLogs({ force: true }); renderPanel(); } },
      { label: 'Download', icon: 'download', action: () => switchTab('downloads') },
      { label: 'Open in editor', icon: 'code', action: () => openInEditor() },
      ...(S.project?.deployment?.url ? [{ label: 'Copy live URL', icon: 'copy', action: () => { if (copyToClipboard(S.project.deployment.url)) toast('Copied', 'success', 1200); } }] : []),
      ...(S.isOwner ? [{ label: 'Danger zone', icon: 'alert', action: () => switchTab('danger'), danger: true }] : []),
    ];
    openModal(`
      <div class="modal-title">Actions</div>
      <div style="display:flex;flex-direction:column;gap:2px;margin-top:8px;">
        ${items.map((it, i) => `<button class="action-item ${it.danger ? 'danger' : ''}" data-action-idx="${i}" type="button">${svg(it.icon, 14, 2.2)}<span>${escapeHTML(it.label)}</span></button>`).join('')}
      </div>
      <div class="modal-actions"><button class="btn btn-secondary btn-block" onclick="closeModal()">Close</button></div>
    `);
    $('modalBody').querySelectorAll('[data-action-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.actionIdx, 10);
        const it = items[idx];
        if (it?.action) { closeModal(); setTimeout(it.action, 100); }
      });
    });
  }

  // ═══════════════════════════════════════════════════════════
  // WIRE GLOBAL
  // ═══════════════════════════════════════════════════════════

  function wireGlobal() {
    $('modalOverlay').addEventListener('click', (e) => {
      if (e.target === $('modalOverlay')) closeModal();
    });
    document.addEventListener('click', (e) => {
      if (e.target.matches('[data-modal-close]')) closeModal();
    });

    $('btnDeploy')?.addEventListener('click', () => {
      if (S.project?.deployment?.url) window.open(S.project.deployment.url, '_blank', 'noopener');
      else deployNow();
    });
    $('btnBell')?.addEventListener('click', () => window.open('/notifications', '_blank', 'noopener'));
    $('btnMore')?.addEventListener('click', openMoreMenu);
    $('headerIdentity')?.addEventListener('click', openEditProjectModal);
    $('emptyProjectRetry')?.addEventListener('click', () => location.reload());

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if ($('modalOverlay').classList.contains('active')) { closeModal(); return; }
      }
      if (!e.target.closest || !e.target.closest('#topTabsBar')) return;
      const idx = S.tabs.findIndex(t => t.id === S.activeTab);
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        switchTab(S.tabs[Math.min(idx + 1, S.tabs.length - 1)].id);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        switchTab(S.tabs[Math.max(idx - 1, 0)].id);
      }
    });

    const updateOnline = () => {
      S.online = navigator.onLine;
      $('offlineBanner').classList.toggle('visible', !S.online);
      updateModeBanner();
      if (S.online) flushSyncQueue();
    };
    window.addEventListener('online', updateOnline);
    window.addEventListener('offline', updateOnline);
    updateOnline();

    if (S.bellTimer) clearInterval(S.bellTimer);
    S.bellTimer = setInterval(() => {
      if (document.visibilityState === 'visible') loadNotificationStats();
    }, 60000);

    // Flush note editor on unload
    window.addEventListener('beforeunload', (e) => {
      const noteOverlay = document.querySelector('.note-editor-overlay.open');
      if (noteOverlay) {
        e.preventDefault();
        e.returnValue = '';
        return '';
      }
    });

    // Popstate — for note editor back button
    window.addEventListener('popstate', (e) => {
      const noteOverlay = document.querySelector('.note-editor-overlay.open');
      if (noteOverlay && S._noteHistoryPushed) {
        // User pressed back while note editor open — close it
        S._noteHistoryPushed = false;
        noteOverlay.querySelector('.note-editor-back')?.click();
      }
    });

    startSyncFlushLoop();
  }

  // ═══════════════════════════════════════════════════════════
  // BOOT
  // ═══════════════════════════════════════════════════════════

  async function boot() {
    wireThemeSync();
    wireThemeMediaQuery();
    readSession();
    S.pid = getPid();

    if (!S.pid) {
      showEmptyState('empty', 'No project selected', 'Open a project to see this dashboard.', null);
      wireGlobal();
      return;
    }

    try { await openDB(); } catch (err) {
      showEmptyState('notfound', 'Storage unavailable', 'Close other tabs and reload.', S.pid);
      wireGlobal();
      return;
    }
    try { await navigator.storage?.persist?.(); } catch {}

    initCreateProject({
      apiFetch,
      db: {
        putProject: IDB.putProject,
        getProject: IDB.getProject,
        listProjects: async () => dbWrap(dbTx('projects').getAll()),
        putFile: IDB.putFile,
        listFiles: IDB.listFiles,
        setProjectMeta: IDB.setProjectMeta,
      },
      toast,
      workspace: { openProject: async (p) => { window.location.href = '/project?pid=' + encodeURIComponent(p.pid) + '&welcome=1'; } },
      setPidInUrl: (pid) => {
        const url = new URL(location.href);
        if (pid) url.searchParams.set('pid', pid);
        else url.searchParams.delete('pid');
        history.replaceState(null, '', url.toString());
      },
      getAvatarColor, getInitials,
      renderSidebar: () => {},
      renderEmptyRecent: () => {},
      DEFAULT_PROJECT_STORAGE_LIMIT,
      API_HOST, API_FLIER,
      isGuest: () => !S.session,
      isOnline: () => S.online,
      getUsername: () => S.user?.profile?.username || null,
      getSession: () => S.session,
      getUid: () => S.user?.uid || null,
    });
    window.createNewProject = createNewProject;

    const handledImage = handleNewProjectImageReturn();
    if (handledImage) return;

    const hashTab = getHashTab();
    const lastTab = shouldRememberTab() ? getLastTab() : null;
    S.activeTab = hashTab || lastTab || 'overview';

    const ok = await loadProject();
    if (!ok) {
      wireGlobal();
      return;
    }

    if (!S.tabs.some(t => t.id === S.activeTab)) S.activeTab = 'overview';
    renderTopTabs();
    renderPanel();
    wireGlobal();

        loadNotificationStats().catch(() => {});
    refreshSyncQueueCount().catch(() => {});
    if (S.online && S.syncQueueCount > 0) flushSyncQueue();

    // ─── OFFLINE-FIRST: auto-promote local projects ─────────────
    // When the dashboard is opened while signed in and online, promote
    // any local_* projects so their "not synced" badge disappears without
    // the user having to visit the editor first.
    if (S.session && S.online && !S.isLocalOnly) {
      import('/js/create-project.js').then(mod => {
        if (typeof mod.promoteQueuedLocalProjects === 'function') {
          mod.promoteQueuedLocalProjects().catch(() => {});
        }
      }).catch(() => {});
    }

    // Also promote when the network comes back online mid-session.
    // Register once at boot so we don't stack listeners on re-renders.
    window.addEventListener('online', () => {
      if (S.session && !S.isLocalOnly) {
        import('/js/create-project.js').then(mod => {
          if (typeof mod.promoteQueuedLocalProjects === 'function') {
            mod.promoteQueuedLocalProjects().catch(() => {});
          }
        }).catch(() => {});
      }
    });
    // ─── END offline-first promotion ────────────────────────────
  }

  document.addEventListener('DOMContentLoaded', boot);

})();
</script>
