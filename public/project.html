<h2>Call your API from the frontend</h2>
<p>Your HTML is deployed at <code class="mono">foliosites.vercel.app/{username}/project/{slug}/</code>. Call your own routes with a relative path:</p>
<pre><code>// In your deployed frontend
const res = await fetch("/{username}/project/{slug}/api/chat", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ message: "Hello" }),
});
const { reply } = await res.json();</code></pre>

<h2>Call your API from anywhere</h2>
<p>From a different origin (a bookmarklet, another website, curl), use the full URL:</p>
<pre><code>const res = await fetch("https://foliosites.vercel.app/{username}/project/{slug}/api/chat", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ message: "Hello" }),
});</code></pre>

<h2>uuid() — sandbox-safe</h2>
<p><code class="mono">crypto.randomUUID()</code> isn't available in the sandbox. This pure-JS version works:</p>
<pre><code>function uuid() {
  const b = new Uint8Array(16);
  crypto.getRandomValues(b);
  b[6] = (b[6] &amp; 0x0f) | 0x40;
  b[8] = (b[8] &amp; 0x3f) | 0x80;
  const h = [];
  for (let i = 0; i &lt; 16; i++) h.push(b[i].toString(16).padStart(2, "0"));
  return h.slice(0,4).join("") + "-" + h.slice(4,6).join("") + "-" + h.slice(6,8).join("") + "-" + h.slice(8,10).join("") + "-" + h.slice(10,16).join("");
}</code></pre>

<h2>sha256Hex() — sandbox-safe</h2>
<p><code class="mono">crypto.subtle.digest</code> isn't available in the sandbox. This pure-JS SHA-256 works for hashing passwords and building session tokens:</p>
<pre><code>function sha256Hex(str) {
  function rightRotate(v, n) { return (v >>> n) | (v << (32 - n)); }
  const bytes = new TextEncoder().encode(String(str));
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const data = Array.from(bytes); const l = data.length;
  data.push(0x80); while (data.length % 64 !== 56) data.push(0);
  const bitLen = l * 8;
  for (let i = 7; i &gt;= 0; i--) data.push(Math.floor(bitLen / Math.pow(2, i * 8)) &amp; 0xff);
  const w = new Array(64);
  for (let i = 0; i &lt; data.length; i += 64) {
    for (let j = 0; j &lt; 16; j++) w[j] = (data[i+j*4]&lt;&lt;24)|(data[i+j*4+1]&lt;&lt;16)|(data[i+j*4+2]&lt;&lt;8)|data[i+j*4+3];
    for (let j = 16; j &lt; 64; j++) { const s0 = rightRotate(w[j-15],7)^rightRotate(w[j-15],18)^(w[j-15]&gt;&gt;&gt;3); const s1 = rightRotate(w[j-2],17)^rightRotate(w[j-2],19)^(w[j-2]&gt;&gt;&gt;10); w[j] = (w[j-16]+s0+w[j-7]+s1)|0; }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (let j = 0; j &lt; 64; j++) { const S1=rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25); const ch=(e&amp;f)^(~e&amp;g); const t1=(h+S1+ch+K[j]+w[j])|0; const S0=rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22); const maj=(a&amp;b)^(a&amp;c)^(b&amp;c); const t2=(S0+maj)|0; h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0; }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x =&gt; (x&gt;&gt;&gt;0).toString(16).padStart(8,"0")).join("");
}</code></pre>

<h2>Password hashing</h2>
<pre><code>function hashPassword(password) {
  const SALT = ENV.PASSWORD_SALT;
  if (!SALT || SALT.length &lt; 16) throw new Error("PASSWORD_SALT not configured");
  return sha256Hex(SALT + "|" + password + "|" + SALT);
}</code></pre>

<h2>Session tokens</h2>
<pre><code>const SESSION_TTL_MS = 30 * 24 * 60 * 60 * 1000;
function createSessionToken(userId) {
  const expiry = Date.now() + SESSION_TTL_MS;
  const payload = userId + "|" + expiry;
  const sig = sha256Hex(payload + ENV.SESSION_SECRET);
  return btoa(payload).replace(/=+$/, "").replace(/\\+/g, "-").replace(/\\//g, "_") + "." + sig;
}</code></pre>

  }
  function copyAllDocs(all) {
    const sections = all ? DOCS_SECTIONS : DOCS_SECTIONS.filter(s => s.id === _docsActiveSection);
    let md = '';
    for (const s of sections) {
      const c = DOCS_CONTENT[s.id]; if (!c) continue;
      const div = document.createElement('div'); div.innerHTML = c.body;
      div.querySelectorAll('pre').forEach(pre => { const code = pre.querySelector('code')?.textContent || pre.textContent || ''; const n = document.createElement('pre'); n.textContent = '```\n' + code + '\n```'; pre.replaceWith(n); });
      div.querySelectorAll('h2').forEach(h => { const n = document.createElement('h2'); n.textContent = '## ' + h.textContent; h.replaceWith(n); });
      div.querySelectorAll('h3').forEach(h => { const n = document.createElement('h3'); n.textContent = '### ' + h.textContent; h.replaceWith(n); });
      div.querySelectorAll('li').forEach(li => { const n = document.createElement('li'); n.textContent = '- ' + li.textContent; li.replaceWith(n); });
      md += `# ${c.title}\n\n${div.textContent.replace(/\n{3,}/g, '\n\n').trim()}\n\n---\n\n`;
    }
    if (copyToClipboard(md)) toast(all ? `Copied all ${sections.length} sections` : 'Copied section', 'success');
    else toast('Copy failed', 'error');
  }

  // ═══════════════════════════════════════════════════════════
  // MORE MENU
  // ═══════════════════════════════════════════════════════════
  function openMoreMenu() {
    const items = [
      { label: 'Edit project', icon: 'edit', action: openEditProjectModal },
      { label: 'Refresh', icon: 'refresh', action: () => { S.deployCache = { history: null, currentId: null, total: 0, at: 0, maxDeployments: 5 }; S.analyticsCache = null; S.shortlink = null; S.notesCache = null; loadDeployState(); loadLogs({ force: true }); renderPanel(); } },
      { label: 'Deploy', icon: 'rocket', action: () => switchTab('deploy') },
      { label: 'Open docs', icon: 'book', action: () => openDocsOverlay() },
      ...(S.project?.deployment?.url ? [{ label: 'Copy live URL', icon: 'copy', action: () => { if (copyToClipboard(S.project.deployment.url)) toast('Copied', 'success', 1200); } }] : []),
      ...(S.isOwner ? [{ label: 'Settings', icon: 'settings', action: () => switchTab('settings') }] : []),
    ];
    openModal(`<div class="modal-title">Actions</div><div style="display:flex;flex-direction:column;gap:2px;margin-top:8px;">${items.map((it, i) => `<button class="action-item" data-action-idx="${i}" type="button">${svg(it.icon, 14, 2.2)}<span>${escapeHTML(it.label)}</span></button>`).join('')}</div><div class="modal-actions"><button class="btn btn-secondary btn-block" onclick="closeModal()">Close</button></div>`);
    document.querySelectorAll('[data-action-idx]').forEach(btn => btn.addEventListener('click', () => { const idx = parseInt(btn.dataset.actionIdx, 10); const it = items[idx]; if (it?.action) { closeModal(); setTimeout(it.action, 100); } }));
  }

  // ═══════════════════════════════════════════════════════════
  // WIRE GLOBAL
  // ═══════════════════════════════════════════════════════════
  function wireGlobal() {
  // ── Modal / overlay close ───────────────────────────────
  $('modalOverlay').addEventListener('click', (e) => { if (e.target === $('modalOverlay')) closeModal(); });
  document.addEventListener('click', (e) => { if (e.target.matches('[data-modal-close]')) closeModal(); });

  // ── Docs overlay ────────────────────────────────────────
  $('docsClose')?.addEventListener('click', closeDocsOverlay);
  $('docsCopySection')?.addEventListener('click', () => copyAllDocs(false));
  $('docsCopyAll')?.addEventListener('click', () => copyAllDocs(true));

  // ── Header buttons ──────────────────────────────────────
  $('btnDeploy')?.addEventListener('click', () => { if (S.project?.deployment?.url) window.open(S.project.deployment.url, '_blank', 'noopener'); else deployNow(); });
  $('btnBell')?.addEventListener('click', () => window.open('/notifications', '_blank', 'noopener'));
  $('btnMore')?.addEventListener('click', openMoreMenu);
  $('headerIdentity')?.addEventListener('click', openEditProjectModal);
  $('emptyProjectRetry')?.addEventListener('click', () => location.reload());

  // ── Keyboard shortcuts ──────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!$('docsOverlay').hidden) { closeDocsOverlay(); return; }
      if ($('modalOverlay').classList.contains('active')) { closeModal(); return; }
    }
    if (!e.target.closest || !e.target.closest('#topTabsBar')) return;
    const idx = S.tabs.findIndex(t => t.id === S.activeTab);
    if (e.key === 'ArrowRight') { e.preventDefault(); switchTab(S.tabs[Math.min(idx + 1, S.tabs.length - 1)].id); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); switchTab(S.tabs[Math.max(idx - 1, 0)].id); }
  });

  // ── Copy delegation — handles every [data-copy-text] button ─
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-copy-text]');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    const text = btn.getAttribute('data-copy-text');
    if (!text) return;
    const ok = await copyToClipboard(text);
    if (ok) {
      btn.classList.add('copied');
      toast('Copied', 'success', 1200);
      setTimeout(() => btn.classList.remove('copied'), 1400);
    } else {
      toast('Copy failed', 'error', 2000);
    }
  });

  // ── Deploy / upload in-flight unload guard ──────────────
  window.addEventListener('beforeunload', (e) => {
    if (S._deployInFlight || S._uploadInFlight) {
      e.preventDefault();
      e.returnValue = 'A deploy or upload is still running. Leave anyway?';
      return e.returnValue;
    }
  });

  // ── Online / offline transitions ────────────────────────
  const updateOnline = () => {
    S.online = navigator.onLine;
    updateOfflineUI();
    updateModeBanner();
    if (S.online) {
      flushSyncQueue().catch(() => {});
      toast('Back online', 'success', 1800);
      if (['overview','deploy','insights','data','settings','api'].includes(S.activeTab)) renderPanel();
    } else {
      toast('Offline — changes will sync when you reconnect', 'warning', 3000);
    }
  };
  window.addEventListener('online', updateOnline);
  window.addEventListener('offline', updateOnline);
  updateOnline();

  // ── Notification poll ───────────────────────────────────
  if (S.bellTimer) clearInterval(S.bellTimer);
  S.bellTimer = setInterval(() => {
    if (document.visibilityState === 'visible' && S.online) loadNotificationStats();
  }, 60000);

  // ── Sync queue flush loop ───────────────────────────────
  startSyncFlushLoop();
}

  // ═══════════════════════════════════════════════════════════
  // BOOT
  // ═══════════════════════════════════════════════════════════
  async function boot() {
    wireThemeSync(); wireThemeMediaQuery(); readSession();
    S.pid = getPid();
    if (!S.pid) { showEmptyState('empty', 'No project selected', 'Open a project to see this dashboard.', null); wireGlobal(); return; }
    try { await openDB(); } catch { showEmptyState('notfound', 'Storage unavailable', 'Close other tabs and reload.', S.pid); wireGlobal(); return; }
    try { await navigator.storage?.persist?.(); } catch {}
    initCreateProject({
      apiFetch,
      db: { putProject: IDB.putProject, getProject: IDB.getProject, listProjects: async () => dbWrap(dbTx('projects').getAll()), putFile: IDB.putFile, listFiles: IDB.listFiles, setProjectMeta: IDB.setProjectMeta },
      toast,
      workspace: { openProject: async (p) => { window.location.href = '/project?pid=' + encodeURIComponent(p.pid) + '&welcome=1'; } },
      setPidInUrl: (pid) => { const url = new URL(location.href); if (pid) url.searchParams.set('pid', pid); else url.searchParams.delete('pid'); history.replaceState(null, '', url.toString()); },
      getAvatarColor, getInitials,
      renderSidebar: () => {}, renderEmptyRecent: () => {},
      DEFAULT_PROJECT_STORAGE_LIMIT, API_HOST, API_FLIER,
      isGuest: () => !S.session, isOnline: () => S.online,
      getUsername: () => S.user?.profile?.username || null,
      getSession: () => S.session, getUid: () => S.user?.uid || null,
    });
    window.createNewProject = createNewProject;
    const handledImage = handleNewProjectImageReturn();
    if (handledImage) return;
    const hashTab = getHashTab();
    const lastTab = shouldRememberTab() ? getLastTab() : null;
    S.activeTab = hashTab || lastTab || 'overview';
    if (S.activeTab === 'docs') S.activeTab = 'overview';
    const ok = await loadProject();
    if (!ok) { wireGlobal(); return; }
    if (!S.tabs.some(t => t.id === S.activeTab)) S.activeTab = 'overview';
    renderTopTabs(); renderPanel(); wireGlobal();
    if (hashTab === 'docs') setTimeout(() => openDocsOverlay(), 200);
    loadNotificationStats().catch(() => {});
    refreshSyncQueueCount().catch(() => {});
    if (S.online && S.syncQueueCount > 0) flushSyncQueue();
  }

  document.addEventListener('DOMContentLoaded', boot);

})();
</script>
