  async function renderDeployPanel(panel) {
    if (!gate(panel, { label: 'Deploy' })) return;
    panel.innerHTML = skeletonCard(3) + skeletonCard(6);

    const now = Date.now();
    let current, history, currentId, total, maxDeployments;
    if (S.deployCache.history && (now - S.deployCache.at) < DEPLOY_HISTORY_CACHE_TTL) {
      current = S.deployState;
      history = S.deployCache.history;
      currentId = S.deployCache.currentId;
      total = S.deployCache.total;
      maxDeployments = S.deployCache.maxDeployments;
    } else {
      const [statusRes, historyRes, routesRes] = await Promise.all([
        apiFetch(API_HOST + '?action=status&pid=' + encodeURIComponent(S.pid)),
        apiFetch(API_HOST + '?action=deployment/history&pid=' + encodeURIComponent(S.pid)),
        apiFetch(API_HOST + '?action=api-routes&pid=' + encodeURIComponent(S.pid)),
      ]);
      current = statusRes.ok ? statusRes.data?.deployment : null;
      history = historyRes.ok ? (historyRes.data?.deployments || []) : [];
      currentId = historyRes.ok ? historyRes.data?.currentDeploymentId : null;
      total = historyRes.ok ? historyRes.data?.total : history.length;
      maxDeployments = historyRes.ok ? historyRes.data?.maxDeployments : 5;
      if (routesRes.ok && routesRes.data?.success) {
        S.apiRoutesCache = routesRes.data;
      }
      S.deployCache = { history, currentId, total, maxDeployments, at: now };
    }

    S.deployState = current;
    S.project.deployment = current || S.project.deployment;
    bumpTabCount('deployments', history.length);

    const isLive = current?.url && current.state !== 'OFFLINE';
    const isOffline = current?.state === 'OFFLINE';
    const needsRedeploy = current && !current.url && !isOffline;
    const canDeploy = S.isEditor && S.online && S.syncState === 'synced';

    const currentBlock = (() => {
      if (isLive) {
        return `
          <div class="deploy-row current">
            <div class="deploy-icon">${svg('check', 13, 2.2)}</div>
            <div class="deploy-info">
              <div class="deploy-title">Current deploy <span class="badge success" style="font-size:8px">CURRENT</span></div>
              <div class="deploy-sub mono" style="font-size:10px;overflow-wrap:anywhere;">${escapeHTML(current.url)}</div>

            </div>
            <div class="deploy-actions">
              <button class="btn btn-ghost btn-icon" id="btnCopyLiveUrl" title="Copy URL">${svg('copy', 10, 2.2)}</button>
              <a class="btn btn-ghost btn-icon" href="${escapeAttr(current.url)}" target="_blank" rel="noopener" title="Open">${svg('external', 10, 2.2)}</a>
              ${S.isEditor ? `<button class="btn btn-ghost btn-icon" id="btnTakeOffline" title="Take offline">${svg('eyeOff', 10, 2.2)}</button>` : ''}
            </div>
          </div>
        `;
      }
      if (needsRedeploy) {
        return `
          <div class="deploy-row">
            <div class="deploy-icon" style="color:var(--theme-warning)">${svg('alert', 13, 2.2)}</div>
            <div class="deploy-info">
              <div class="deploy-title">Needs redeploy <span class="badge warning" style="font-size:8px">NO URL</span></div>
              <div class="deploy-sub">Deployment record exists but has no live URL</div>
            </div>
            ${canDeploy ? `<button class="btn btn-primary btn-sm" id="btnRedeployNow">Redeploy</button>` : ''}
          </div>
        `;
      }
      if (isOffline) {
        return `
          <div class="deploy-row">
            <div class="deploy-icon" style="color:var(--theme-text-tertiary)">${svg('eyeOff', 13, 2.2)}</div>
            <div class="deploy-info">
              <div class="deploy-title">Offline</div>
              <div class="deploy-sub">${current.previousUrl ? 'Last live at: ' + escapeHTML(current.previousUrl) : 'Taken offline'}</div>
            </div>
            ${canDeploy ? `<button class="btn btn-primary btn-sm" id="btnDeployNow">Deploy</button>` : ''}
          </div>
        `;
      }
      if (S.syncState === 'local' || S.syncState === 'orphan') {
        const hint = S.syncState === 'orphan' ? "This project isn't on the server yet." : "Local projects can't be deployed.";
        return `
          <div style="padding:14px;">
            <div style="font-size:11.5px;color:var(--theme-text-tertiary);margin-bottom:8px;">${hint}</div>
            <button class="btn btn-primary btn-sm" id="btnPushFirst">Push to server</button>

      }
      return `

          <div class="deploy-icon">${svg('rocket', 13, 2.2)}</div>
          <div class="deploy-info">
            <div class="deploy-title">Never deployed</div>
            <div class="deploy-sub">Deploy to start building history</div>
          </div>
          ${canDeploy ? `<button class="btn btn-sm btn-primary" id="btnDeployNow">Deploy</button>` : ''}
        </div>
      `;
    })();

    const apiRoutes = S.apiRoutesCache || null;

    panel.innerHTML = `
      <div class="panel-section">
        ${panelSectionHeader('Deployments', 'rocket', `${history.length}${maxDeployments ? ` of ${maxDeployments}` : ''} kept`)}

        <div class="card">
          <div class="card-header">
            <div class="card-title">${svg('rocket', 13, 2.2)} Current</div>
            ${canDeploy ? `<button class="btn btn-sm btn-primary" id="btnDeployNow">${svg('rocket', 10, 2.4)} Deploy</button>` : ''}
          </div>
          <div class="card-body flush">
            ${currentBlock}
          </div>
        </div>

        <div class="card">

            <div class="card-title">${svg('clock', 13, 2.2)} History</div>
            <button class="btn btn-sm btn-ghost btn-icon" id="btnRefreshHistory" aria-label="Refresh">${svg('refresh', 10, 2.2)}</button>
          </div>
          <div class="card-body tight">
            ${history.length === 0
              ? emptyState('clock', 'No deployments', 'Deploy your project to start building history.')
              : `<div class="row-list" id="deployHistoryList">${history.map(d => renderDeploymentRow(d, currentId)).join('')}</div>
                 <div class="field-hint" style="margin-top:8px;">Deploys keep the ${maxDeployments || 5} most recent snapshots.</div>`}
          </div>
        </div>
      </div>

      ${apiRoutes ? `
        <div class="panel-section">
          ${panelSectionHeader('API routes', 'terminal', `${(apiRoutes.user?.length || 0) + (apiRoutes.system?.length || 0)} routes · ${apiRoutes.maxFiles || 10}-file limit`)}
          <div class="card">
            <div class="card-body">
              <div class="api-base-url">
                <code class="mono">${escapeHTML(apiRoutes.baseUrl || '')}</code>
                <button class="btn btn-ghost btn-icon" data-copy-text="${escapeAttr(apiRoutes.baseUrl || '')}" aria-label="Copy base URL">${svg('copy', 12, 2.2)}</button>
              </div>

              ${(apiRoutes.system?.length || 0) > 0 ? `
                <div class="api-section-title">System routes</div>
                <div class="api-route-list">
                  ${apiRoutes.system.map(r => `
                    <div class="api-route-row">
                      <span class="api-method">GET</span>
                      <code class="api-route mono">/api/${escapeHTML(S.pid)}/${escapeHTML(r)}</code>
                      <span class="api-source">_system.js</span>
                      <button class="btn btn-ghost btn-icon" data-copy-text="${escapeAttr(`${API_BASE}/${S.pid}/${r}`)}" aria-label="Copy route URL">${svg('copy', 10, 2.2)}</button>
                    </div>
                  `).join('')}
                </div>
              ` : ''}

              ${(apiRoutes.user?.length || 0) > 0 ? `
                <div class="api-section-title" style="margin-top:12px;">User routes</div>
                <div class="api-route-list">
                  ${apiRoutes.user.map(r => `
                    <div class="api-route-row">
                      <span class="api-method post">POST</span>
                      <code class="api-route mono">/api/${escapeHTML(S.pid)}/${escapeHTML(r)}</code>
                      <span class="api-source">${escapeHTML(r)}.js</span>
                      <button class="btn btn-ghost btn-icon" data-copy-text="${escapeAttr(`${API_BASE}/${S.pid}/${r}`)}" aria-label="Copy route URL">${svg('copy', 10, 2.2)}</button>
                    </div>
                  `).join('')}
                </div>
              ` : `
                <div class="empty-state" style="padding:20px 8px;">
                  <div class="empty-state-icon">${svg('terminal', 18, 2)}</div>
                  <div class="empty-state-title">No user routes yet</div>
                  <div class="empty-state-desc">Create your first <code class="mono">api/*.js</code> file in the Code tab to add a route.</div>
                </div>
              `}

              ${apiRoutes.allowedHosts ? `
                <details class="api-hosts-details">
                  <summary>
                    ${svg('globe', 11, 2.2)}
                    Allowed hosts
                    (${(apiRoutes.allowedHosts.builtin?.length || 0) + (apiRoutes.allowedHosts.declared?.length || 0)})
                  </summary>
                  <div class="api-hosts-list">
                    <div class="api-hosts-group">
                      <div class="api-hosts-group-label">Built-in</div>
                      ${(apiRoutes.allowedHosts.builtin || []).map(h => `
                        <div class="api-host-row">
                          <code class="mono">${escapeHTML(h)}</code>
                          <span class="badge neutral">built-in</span>
                        </div>
                      `).join('')}
                    </div>
                    ${(apiRoutes.allowedHosts.declared || []).length > 0 ? `
                      <div class="api-hosts-group">
                        <div class="api-hosts-group-label">Declared via @allow</div>

                          <div class="api-host-row">
                            <code class="mono">${escapeHTML(h.host)}</code>
                            ${h.validatedOk
                              ? `<span class="badge success">verified</span>`
                              : `<span class="badge danger">failed check</span>`}
                            <span class="api-hosts-files">${escapeHTML((h.declaredBy || []).join(', '))}</span>
                          </div>
                        `).join('')}
                      </div>
                    ` : ''}
                  </div>
                </details>
              ` : ''}

              <div class="field-hint" style="margin-top:10px;">
                See <button type="button" class="link-btn" id="btnDeployDocs">Docs → Private API</button> for the full reference.

      <div class="panel-section">
        ${panelSectionHeader('Export', 'download', 'Download your project')}
        <div class="card">
          <div class="card-body" style="display:flex;flex-direction:column;gap:8px;">
            <button class="btn btn-primary btn-block" id="btnDownloadFolio">${svg('download', 12, 2.4)} .folio backup</button>
            <div class="field-hint">Files, versions${S.syncState === 'synced' ? ', JSON DB' : ''}.</div>
            <button class="btn btn-secondary btn-block" id="btnDownloadZip">${svg('download', 12, 2.4)} .zip (files)</button>
            <div class="field-hint">Current files only.</div>
            ${S.syncState === 'synced' ? `<button class="btn btn-secondary btn-block" id="btnDownloadDb">${svg('download', 12, 2.4)} JSON database</button>` : ''}
          </div>
        </div>
      </div>
    `;

    // ── Wire deployment ────────────────────────────────────────
    $('btnDeployNow')?.addEventListener('click', deployNow);
    $('btnRedeployNow')?.addEventListener('click', deployNow);
    $('btnPushFirst')?.addEventListener('click', () => {
      if (S.syncState === 'orphan') pushOrphanToServer();
      else if (S.syncState === 'local') promoteLocalProject();
    });
    $('btnRefreshHistory')?.addEventListener('click', () => {
      S.deployCache = { history: null, currentId: null, total: 0, at: 0, maxDeployments: 5 };
      renderPanel();
    });
    $('btnTakeOffline')?.addEventListener('click', takeOffline);
    $('btnCopyLiveUrl')?.addEventListener('click', () => {
      const url = current?.url || '';
      if (!url) return;
      if (copyToClipboard(url)) toast('URL copied', 'success', 1200);
      else toast('Copy failed', 'error');
    });

    // ── Wire export ────────────────────────────────────────────
    $('btnDownloadFolio')?.addEventListener('click', async () => {
      if (S.isLocalOnly || !S.session || S.syncState !== 'synced') await exportLocalFolio();
      else await downloadProject('folio');
    });
    $('btnDownloadZip')?.addEventListener('click', async () => {
      if (S.isLocalOnly || !S.session || S.syncState !== 'synced') await exportLocalJson();
      else await downloadProject('zip');
    });
    $('btnDownloadDb')?.addEventListener('click', downloadJsonDb);

    // ── Wire docs link ─────────────────────────────────────────
    $('btnDeployDocs')?.addEventListener('click', () => {
      openDocsOverlay('private-api');
    });

    // ── Copy buttons ───────────────────────────────────────────
    panel.querySelectorAll('[data-copy-text]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (copyToClipboard(btn.dataset.copyText)) toast('Copied', 'success', 1200);
        else toast('Copy failed', 'error');
      });
    });

    // ── Deployment row toggle ─────────────────────────────────
    panel.addEventListener('click', (e) => {
      const toggleBtn = e.target.closest('[data-deploy-toggle]');
      if (toggleBtn) {
        e.stopPropagation();
        toggleDeploymentRow(toggleBtn.getAttribute('data-deploy-toggle'));
        return;
      }

      const rowEl = e.target.closest('[data-deploy-row]');
      if (rowEl && !e.target.closest('a, button[data-redeploy], button[data-delete-deploy]')) {
        toggleDeploymentRow(rowEl.getAttribute('data-deploy-row'));
        return;
      }

      const redeployBtn = e.target.closest('[data-redeploy]');
      if (redeployBtn) {
        e.stopPropagation();
        redeployVersion(redeployBtn.getAttribute('data-redeploy'));
        return;
      }

      const deleteBtn = e.target.closest('[data-delete-deploy]');
      if (deleteBtn) {
        e.stopPropagation();
        confirmDeleteDeployment(deleteBtn.getAttribute('data-delete-deploy'));
        return;
      }
    });
  }

  function toggleDeploymentRow(deploymentId) {
    if (!S._expandedDeployments) S._expandedDeployments = new Set();
    if (S._expandedDeployments.has(deploymentId)) S._expandedDeployments.delete(deploymentId);
    else S._expandedDeployments.add(deploymentId);

    const list = document.getElementById('deployHistoryList');
    if (!list) return;

    const cached = S.deployCache.history || [];
    const currentId = S.deployCache.currentId;
    list.innerHTML = cached.map(d => renderDeploymentRow(d, currentId)).join('');
  }

    const directUrl = urls?.serve || null;

    const timeStr = at ? at.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
    }) : '—';

    const versionShort = d.versionId ? String(d.versionId).slice(-8) : null;

    const rowHtml = `
      <div class="deploy-row ${isExpanded ? 'expanded' : ''} ${isCurrent ? 'current' : ''}" data-deploy-row="${escapeAttr(d.id)}">
        <button class="deploy-chevron" type="button" data-deploy-toggle="${escapeAttr(d.id)}" aria-label="Toggle details" aria-expanded="${isExpanded}">

        </button>
        <div class="deploy-icon">${svg(isCurrent ? 'check' : isLegacy ? 'file' : 'rocket', 13, 2.2)}</div>
        <div class="deploy-info">
          <div class="deploy-title">
            ${versionShort ? `v${escapeHTML(versionShort)}` : 'Legacy deploy'}
            ${isCurrent ? '<span class="badge success" style="font-size:8px;">CURRENT</span>' : ''}
            ${!hasSnapshot ? '<span class="badge neutral" style="font-size:8px;">NO SNAPSHOT</span>' : ''}
          </div>
          <div class="deploy-sub">${timeAgo(d.deployedAt)} · ${escapeHTML(d.state || 'READY')}</div>
        </div>
        <div class="deploy-actions">
          ${cleanUrl ? `<button class="btn btn-ghost btn-icon" data-copy-text="${escapeAttr(cleanUrl)}" title="Copy clean URL" type="button">${svg('copy', 10, 2.2)}</button>` : ''}
          ${cleanUrl ? `<a class="btn btn-ghost btn-icon" href="${escapeAttr(cleanUrl)}" target="_blank" rel="noopener" title="Open preview" type="button">${svg('external', 10, 2.2)}</a>` : ''}
          ${S.isEditor && !isCurrent && hasSnapshot && d.versionId
            ? `<button class="btn btn-ghost btn-icon" data-redeploy="${escapeAttr(d.versionId)}" title="Redeploy this version" type="button">${svg('refresh', 10, 2.2)}</button>`

            ? `<button class="btn btn-ghost btn-icon" data-delete-deploy="${escapeAttr(d.id)}" title="Delete" type="button" style="color:var(--theme-danger);">${svg('trash', 10, 2.2)}</button>`
            : ''}
        </div>
      </div>
    `;

    const detailHtml = isExpanded ? `
      <div class="deploy-detail" data-deploy-detail="${escapeAttr(d.id)}">
        ${!hasSnapshot ? `
          <div class="deploy-detail-note">
            ${svg('alert', 12, 2.4)}
            <span>This deployment was created before snapshots were captured. Historic preview is unavailable.</span>
          </div>
        ` : ''}

        <div class="deploy-detail-row">
          <span class="deploy-detail-label">Deployed</span>
          <span class="deploy-detail-value">${escapeHTML(timeStr)}</span>
          <span></span>
        </div>

        <div class="deploy-detail-row">
          <span class="deploy-detail-label">State</span>
          <span class="deploy-detail-value">${escapeHTML(d.state || 'READY')}</span>
          <span></span>
        </div>

        <div class="deploy-detail-row">
          <span class="deploy-detail-label">Version</span>
          <span class="deploy-detail-value ${!d.versionId ? 'empty' : ''}">${escapeHTML(d.versionId || 'not recorded')}</span>
          ${d.versionId ? `<button class="deploy-detail-copy" type="button" data-copy-text="${escapeAttr(d.versionId)}" title="Copy version ID">${svg('copy', 10, 2.4)}</button>` : '<span></span>'}

  async function confirmDeleteDeployment(deploymentId) {

    confirmModal('Delete deployment?', 'Removes from history and deletes its snapshot.', 'Delete', true, async () => {
      showLoading('Deleting', '');

        const res = await apiFetch(API_HOST + '?action=deployment/delete', {
          method: 'POST',
          body: JSON.stringify({ pid: S.pid, deploymentId }),
        });
        hideLoading();
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        toast('Deleted', 'success');
        S.deployCache = { history: null, currentId: null, total: 0, at: 0, maxDeployments: 5 };

  async function pollDeployStatus(pid) {
    for (let attempt = 0; attempt < 3; attempt++) {
      await new Promise(r => setTimeout(r, 1500));
      try {
        const st = await apiFetch(API_HOST + '?action=status&pid=' + encodeURIComponent(pid));
        if (st.ok && st.data?.success && st.data.deployment?.url) {
          return st.data.deployment;
        }
      } catch {}
    }
    return null;
  }

  async function deployNow() {
    if (!S.isEditor || !S.online) { toast('Requires internet', 'warning'); return; }
    if (S.isLocalOnly) { toast("Local projects can't be deployed — sync to account first", 'warning'); return; }
    if (S.syncState === 'needs-pull') {
      toast('Sync files first before deploying', 'warning', 4000);
      return;
    }

    let files = [];
    try { files = await IDB.listFiles(S.pid); } catch {}
    const fileMap = {};
    for (const f of files) {
      if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
      if (typeof f.content !== 'string') continue;
      fileMap[f.path] = f.content;
    }
    if (Object.keys(fileMap).length === 0) { toast('No files to deploy', 'warning'); return; }

    // Client-side API folder pre-checks
    const apiFiles = Object.entries(fileMap).filter(([p]) => p.startsWith('api/') && p.endsWith('.js'));
    if (apiFiles.length > 10) {
      toast(`You have ${apiFiles.length} API files. Limit is 10.`, 'error', 5000);
      return;
    }
    for (const [p, c] of apiFiles) {
      if (c.length > 50 * 1024) {
        toast(`${p} is ${formatBytes(c.length)}. Limit is 50 KB.`, 'error', 5000);
        return;
      }
    }
    const totalApiBytes = apiFiles.reduce((s, [, c]) => s + c.length, 0);
    if (totalApiBytes > 200 * 1024) {
      toast(`API folder is ${formatBytes(totalApiBytes)}. Limit is 200 KB.`, 'error', 5000);
      return;
    }

    confirmModal(
      `Deploy ${Object.keys(fileMap).length} file${Object.keys(fileMap).length === 1 ? '' : 's'}?`,
      'This will build and deploy to a live URL.',
      'Deploy',
      false,
      async () => {
        showLoading('Deploying', 'Uploading files…');
        try {
          $('loadingDesc').textContent = 'Deploying…';
          const res = await apiFetch(API_HOST + '?action=deploy', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, files: fileMap }),
          });

          if (!res.ok || !res.data?.success) {
            let msg = res.data?.error || 'Deploy failed';
            if (res.status === 403) msg = "You don't have permission to deploy this project";
            if (res.status === 404) msg = 'Project not found on server';
            if (res.data?.violations?.length) {
              msg = `${msg}: ${res.data.violations.map(v => `${v.host || v.name} (${v.reason})`).join(', ')}`;
            }
            throw new Error(msg);
          }

          const returnedUrl = res.data.url || null;
          if (returnedUrl) {
            const liveDeployment = {
              url: returnedUrl,
              serveUrl: res.data.serveUrl || null,
              versionId: res.data.versionId || null,
              deploymentId: res.data.deploymentId,
              deployedAt: Date.now(),
              state: 'READY',
            };
            S.deployState = liveDeployment;
            S.project.deployment = liveDeployment;
          }

          markSynced(S.pid);

          $('loadingDesc').textContent = 'Confirming…';
          const live = await pollDeployStatus(S.pid);
          if (live) {
            S.deployState = live;
            S.project.deployment = live;
          }

          hideLoading();

          toast('Deployed successfully', 'success', 2400);
          if (res.data.filesSkipped > 0) {
            toast(`${res.data.filesSkipped} file(s) skipped`, 'warning', 4000);
          }

          S.deployCache = { history: null, currentId: null, total: 0, at: 0, maxDeployments: 5 };
          S.apiRoutesCache = null;
          await loadDeployState();
          await new Promise(r => setTimeout(r, 800));

          if (['deploy', 'overview', 'code'].includes(S.activeTab)) renderPanel();
          updateHeader();
        } catch (err) {
          hideLoading();
          toast(err.message || 'Deploy failed', 'error', 5000);
        }
      }
    );
  }

  async function exportLocalFolio() {

      const payload = {
        folioVersion: 1, exportedAt: new Date().toISOString(),
        pid: S.pid, name: S.project.name || '', slug: S.project.slug || '',

  async function downloadProject(format) {
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    try {
      const url = `${API_HOST}?action=project/export&pid=${encodeURIComponent(S.pid)}&format=${format}`;
      const res = await fetch(url, { headers: { Authorization: `Bearer ${S.session}` } });
      if (!res.ok) throw new Error('Download failed');
      const blob = await res.blob();
      triggerDownload(blob, `${S.project.slug || 'project'}-${S.pid.slice(-6)}.${format === 'folio' ? 'folio' : 'zip'}`);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Download failed', 'error'); }

  async function downloadJsonDb() {
    if (!S.online || S.syncState !== 'synced') { toast('Requires internet', 'warning'); return; }
    try {
      const res = await apiFetch(API_HOST + '?action=db/get&pid=' + encodeURIComponent(S.pid));
      if (!res.ok || !res.data?.success) throw new Error('Failed');
      triggerDownload(new Blob([JSON.stringify(res.data.data || {}, null, 2)], { type: 'application/json' }), `${S.project.slug || 'project'}-db.json`);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Download failed', 'error'); }
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function loadMoreLogs() {
    const newOffset = (S.logsData?.logs || []).length;
    const res = await apiFetch(API_HOST + '?action=logs&pid=' + encodeURIComponent(S.pid) + '&limit=50&offset=' + newOffset);
    if (!res.ok || !res.data?.success) return;
    const list = $('logList');

    (res.data.logs || []).forEach(l => list.insertAdjacentHTML('beforeend', renderLogRow(l)));

            via <code class="mono">fetch("https://folio/api/host?action=db/...")</code>.
            <br><br>
            <strong>Looking for secrets?</strong> API keys and tokens belong in the

      ${pct > 80 ? `
        <div class="card" style="border-color:var(--theme-warning);">

    document.querySelectorAll('[data-db-tab]').forEach(btn => {

      renderDataPanelContent(panel, schema);
    });

    $('btnDbUndo')?.addEventListener('click', () => {

      S.dbSearch = e.target.value;

      else Object.keys(S.dbData).forEach(k => S.dbExpanded.add(k));
      renderDbTree();
    });

      const key = prompt('New top-level key:');
      if (!key || !key.trim()) return;

        toast('Key exists', 'error');
        return;

      S.dbData[key.trim()] = '';
      S.dbExpanded.add(key.trim());
      S.dbDirty = true;
      renderDataPanelContent(panel, schema);
    });

    $('btnDbCopy')?.addEventListener('click', () => {
      if (copyToClipboard(JSON.stringify(S.dbData, null, 2))) toast('Copied', 'success', 1200);
    });

      const blob = new Blob([JSON.stringify(S.dbData, null, 2)], { type: 'application/json' });

      a.download = `db_${S.pid}.json`;
      a.click();
      toast('Exported', 'success');

    $('dbRawEditor')?.addEventListener('input', (e) => {
      try {
        S.dbData = JSON.parse(e.target.value);
        S.dbDirty = true;
        const saveBtn = $('btnDbSave');
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = svg('check', 10, 2.4) + ' Save';

    });

    if (S.dbTab === 'tree') renderDbTree();

  function renderDbTree() {
    const wrap = $('dbTreeWrap');
    if (!wrap) return;
    wrap.innerHTML = '';
    const tree = document.createElement('div');
    tree.className = 'db-tree';
    const data = S.dbData;

    function matchesFilter(path, val) {
      if (!S.dbSearch) return true;
      const q = S.dbSearch.toLowerCase();
      if (path.toLowerCase().includes(q)) return true;
      try { return JSON.stringify(val).toLowerCase().includes(q); } catch { return false; }
    }

    function renderNode(value, key, path, depth, parentIsArray) {
      const hasChildren = value !== null && typeof value === 'object';
      const isArray = Array.isArray(value);
      const isExpanded = S.dbExpanded.has(path);
      const filtered = matchesFilter(path, value);
      if (!filtered && !hasChildren) return null;

      const row = document.createElement('div');
      row.className = `tree-row ${depth > 0 ? 'child' : ''}`;
      row.style.setProperty('--depth', String(depth));

      if (hasChildren) {
        const toggle = document.createElement('span');
        toggle.className = `tree-toggle ${isExpanded ? 'open' : ''}`;
        toggle.innerHTML = svg('chevronRight', 10, 2.4);
        toggle.addEventListener('click', () => {
          if (isExpanded) S.dbExpanded.delete(path);
          else S.dbExpanded.add(path);
          renderDbTree();
        });
        row.appendChild(toggle);
      } else {
        const spacer = document.createElement('span');
        spacer.className = 'tree-toggle';
        row.appendChild(spacer);
      }

      if (key !== '') {
        const k = document.createElement('span');
        k.className = 'tree-key';
        k.textContent = key;
        k.addEventListener('click', () => {
          copyToClipboard(path);
          toast(`Copied: ${path}`, 'info', 1400);
        });
        row.appendChild(k);
        const colon = document.createElement('span');
        colon.className = 'tree-colon';
        colon.textContent = ':';
        row.appendChild(colon);
      }

      if (hasChildren) {
        const size = isArray ? value.length : Object.keys(value).length;
        const badge = document.createElement('span');
        badge.className = 'tree-badge';
        badge.textContent = isArray ? `[${size}]` : `{${size}}`;
        row.appendChild(badge);
      } else {
        const type = value === null ? 'null' : typeof value;
        const display = value === null ? 'null' : typeof value === 'string' ? `"${value}"` : String(value);
        const valEl = document.createElement('span');
        valEl.className = `tree-value ${type}`;
        valEl.textContent = display;
        valEl.title = display;
        if (!S.dbReadOnly) {
          valEl.addEventListener('dblclick', () => startEditValue(valEl, value, path));
        }
        row.appendChild(valEl);
      }

      if (!S.dbReadOnly) {
        const actions = document.createElement('div');
        actions.className = 'tree-actions';

        if (hasChildren) {
          const addBtn = document.createElement('button');
          addBtn.className = 'tree-act';
          addBtn.innerHTML = svg('plus', 10, 2.4);
          addBtn.title = 'Add';
          addBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const newKey = isArray ? String(value.length) : prompt('New key:');
            if (newKey === null) return;
            if (!isArray && (!newKey || !newKey.trim())) return;
            const childKey = isArray ? value.length : newKey.trim();
            const childPath = path ? `${path}/${childKey}` : String(childKey);
            setAtPath(S.dbData, childPath, '');
            S.dbExpanded.add(path);
            S.dbDirty = true;
            renderDbTree();
            updateDbSaveBtn();
          });
          actions.appendChild(addBtn);
        }

        const copyBtn = document.createElement('button');
        copyBtn.className = 'tree-act';
        copyBtn.innerHTML = svg('copy', 10, 2.2);
        copyBtn.title = 'Copy path';
        copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          copyToClipboard(path);
          toast(`Copied: ${path}`, 'success', 1200);
        });
        actions.appendChild(copyBtn);

        if (!parentIsArray && key !== '') {
          const renameBtn = document.createElement('button');
          renameBtn.className = 'tree-act';
          renameBtn.innerHTML = svg('edit', 10, 2.2);
          renameBtn.title = 'Rename';
          renameBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const parts = path.split('/');
            const oldKey = parts[parts.length - 1];
            const newKey = prompt('New key name:', oldKey);
            if (!newKey || newKey === oldKey || !newKey.trim()) return;
            const parentPath = parts.slice(0, -1).join('/');
            const parent = parentPath ? getAtPath(S.dbData, parentPath) : S.dbData;
            if (parent && parent[newKey.trim()] !== undefined) { toast('Key exists', 'error'); return; }
            const v = getAtPath(S.dbData, path);
            deleteAtPath(S.dbData, path);
            const newPath = parentPath ? `${parentPath}/${newKey.trim()}` : newKey.trim();
            setAtPath(S.dbData, newPath, v);
            S.dbDirty = true;
            renderDbTree();
            updateDbSaveBtn();
          });
          actions.appendChild(renameBtn);
        }

        const delBtn = document.createElement('button');
        delBtn.className = 'tree-act danger';
        delBtn.innerHTML = svg('trash', 10, 2.2);
        delBtn.title = 'Delete';
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const doDelete = () => {
            deleteAtPath(S.dbData, path);
            S.dbDirty = true;
            toast(`Deleted "${key || path}"`, 'info');
            renderDbTree();
            updateDbSaveBtn();
          };
          if (hasChildren && ((isArray ? value.length : Object.keys(value).length) > 0)) {
            confirmModal(`Delete "${key}"?`, `Removes ${isArray ? value.length + ' items' : Object.keys(value).length + ' keys'}.`, 'Delete', true, doDelete);
          } else {
            doDelete();
          }
        });
        actions.appendChild(delBtn);

        row.appendChild(actions);
      }

      const frag = document.createDocumentFragment();
      frag.appendChild(row);

      if (hasChildren && isExpanded) {
        const keys = isArray ? value.map((_, i) => i) : Object.keys(value).sort();
        for (const k of keys) {
          const child = renderNode(value[k], String(k), path ? `${path}/${k}` : String(k), depth + 1, isArray);
          if (child) frag.appendChild(child);
        }
      }

      return frag;
    }

    function startEditValue(valEl, oldValue, path) {
      const input = document.createElement('input');
      input.className = 'tree-value editing';
      input.type = typeof oldValue === 'number' ? 'number' : 'text';
      input.value = oldValue === null ? '' : String(oldValue);
      valEl.replaceWith(input);
      input.focus();
      input.select();

      const commit = () => {
        let newVal;
        const raw = input.value;
        if (typeof oldValue === 'number') newVal = Number(raw);
        else if (typeof oldValue === 'boolean') newVal = raw === 'true' || raw === '1' || raw === 'yes';
        else if (raw === 'null') newVal = null;
        else newVal = raw;
        setAtPath(S.dbData, path, newVal);
        S.dbDirty = true;
        toast(`Updated ${path}`, 'success', 1200);
        renderDbTree();
        updateDbSaveBtn();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { e.preventDefault(); renderDbTree(); }
      });
      input.addEventListener('blur', () => setTimeout(commit, 100));
    }

    const rootKeys = Object.keys(data).sort();
    if (rootKeys.length === 0) {
      tree.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="empty-state-title">Empty database</div><div class="empty-state-desc">Use "Add key" to create your first entry.</div></div>';
    } else {
      for (const k of rootKeys) {
        const node = renderNode(data[k], k, k, 0, false);
        if (node) tree.appendChild(node);
      }
      if (!S.dbReadOnly) {
        const addRow = document.createElement('div');
        addRow.className = 'tree-add';
        addRow.innerHTML = svg('plus', 10, 2.4) + ' Add top-level key';
        addRow.addEventListener('click', () => {
          const key = prompt('New top-level key:');
          if (!key || !key.trim()) return;
          if (S.dbData[key.trim()] !== undefined) { toast('Key exists', 'error'); return; }
          S.dbData[key.trim()] = '';
          S.dbExpanded.add(key.trim());
          S.dbDirty = true;
          renderDbTree();
          updateDbSaveBtn();
        });
        tree.appendChild(addRow);
      }
    }

    wrap.appendChild(tree);
  }

  function updateDbSaveBtn() {
    const btn = $('btnDbSave');
    if (!btn) return;
    if (S.dbDirty) {
      btn.disabled = false;
      btn.innerHTML = svg('check', 10, 2.4) + ' Save';
    }
  }

  function getAtPath(obj, path) {
    const parts = path.split('/').filter(Boolean);
    let cur = obj;
    for (const p of parts) {
      if (cur == null) return undefined;
      cur = cur[p];
    }
    return cur;
  }
  function setAtPath(obj, path, value) {
    const parts = path.split('/').filter(Boolean);
    if (parts.length === 0) return;
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      if (cur[parts[i]] == null || typeof cur[parts[i]] !== 'object') cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = value;
  }
  function deleteAtPath(obj, path) {
    const parts = path.split('/').filter(Boolean);
    if (parts.length === 0) return;
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      if (cur[parts[i]] == null) return;
      cur = cur[parts[i]];
    }
    if (Array.isArray(cur)) cur.splice(Number(parts[parts.length - 1]), 1);
    else delete cur[parts[parts.length - 1]];
  }

  async function toggleSecretVisibility(key, current) {
    const next = current === 'public' ? 'private' : 'public';
    if (next === 'public') {
      const ok = await new Promise((resolve) => {
        openModal(`
          <div class="modal-title" style="color:var(--theme-warning);">${svg('alert', 16, 2.4)} Make "${escapeHTML(key)}" public?</div>
          <div class="modal-desc" style="line-height:1.6;">
            Public secrets are injected into your served HTML as <code class="mono">window.__SECRETS__</code>.
            <strong>Anyone visiting your site can read this value.</strong>
            <br><br>
            Only use this for public keys (Stripe publishable, Supabase anon, etc.).
          </div>
          <div class="modal-actions">
            <button class="btn btn-secondary" id="visCancelBtn" type="button">Cancel</button>
            <button class="btn btn-danger" id="visConfirmBtn" type="button">Make public</button>
          </div>
        `);
        $('visCancelBtn').addEventListener('click', () => { closeModal(); resolve(false); });
        $('visConfirmBtn').addEventListener('click', () => { closeModal(); resolve(true); });
      });
      if (!ok) return;
    }

    const res = await apiFetch(API_HOST + '?action=secrets/visibility', {
      method: 'POST',
      body: JSON.stringify({ pid: S.pid, key, visibility: next }),
    });
    if (!res.ok || !res.data?.success) {
      toast(res.data?.error || 'Failed to update visibility', 'error');
      return;
    }
    toast(`Visibility: ${next}`, 'success');
    renderPanel();
  }

  async function openSecretEditor(keyToEdit) {
    const isEdit = !!keyToEdit;
    let currentNote = '';
    let currentValue = '';
    let currentVisibility = 'private';

    if (isEdit) {
      const res = await apiFetch(API_HOST + '?action=secrets/get&pid=' + encodeURIComponent(S.pid));
      if (res.ok && res.data?.success && res.data.entries?.[keyToEdit]) {
        const entry = res.data.entries[keyToEdit];
        currentValue = entry.value || '';
        currentNote = entry.note || '';
        currentVisibility = entry.visibility || 'private';
      }
    }

    openModal(`
      <div class="modal-title">${isEdit ? 'Edit secret' : 'New secret'}</div>
      <div class="modal-desc">Encrypted at rest. Never served through the file system.</div>
      <div class="field">
        <label class="field-label">Key (UPPER_SNAKE_CASE)</label>
        <input class="input mono" id="secretKey" value="${escapeAttr(keyToEdit || '')}" ${isEdit ? 'readonly' : ''} placeholder="OPENAI_API_KEY" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label class="field-label">Value</label>
        <div class="secret-value-row">
          <input class="input mono" id="secretValue" type="password" value="${escapeAttr(currentValue)}" placeholder="sk-..." autocomplete="new-password" spellcheck="false">
          <button class="btn btn-secondary btn-icon" type="button" id="toggleSecretValue" aria-label="Show value">${svg('eye', 12, 2.2)}</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Note (optional)</label>
        <input class="input" id="secretNote" value="${escapeAttr(currentNote)}" placeholder="What is this for?" maxlength="200">
      </div>
      <div class="field">
        <label class="field-label">Visibility</label>
        <div style="display:flex;gap:6px;">
          <label style="flex:1;padding:8px;border:1px solid var(--theme-card-border);border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;${currentVisibility === 'private' ? 'border-color:var(--theme-primary);background:var(--theme-primary-soft);' : ''}">
            <input type="radio" name="secretVis" value="private" ${currentVisibility === 'private' ? 'checked' : ''}>
            <div>
              <div style="font-size:11px;font-weight:700;">Private</div>
              <div style="font-size:10px;color:var(--theme-text-tertiary);">ENV only</div>
            </div>
          </label>
          <label style="flex:1;padding:8px;border:1px solid var(--theme-card-border);border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;${currentVisibility === 'public' ? 'border-color:var(--theme-primary);background:var(--theme-primary-soft);' : ''}">
            <input type="radio" name="secretVis" value="public" ${currentVisibility === 'public' ? 'checked' : ''}>
            <div>
              <div style="font-size:11px;font-weight:700;">Public</div>
              <div style="font-size:10px;color:var(--theme-text-tertiary);">Also in browser</div>
            </div>
          </label>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()" type="button">Cancel</button>
        <button class="btn btn-primary" id="secretSave" type="button">${isEdit ? 'Update' : 'Create'}</button>
      </div>
    `);

    $('toggleSecretValue')?.addEventListener('click', () => {
      const input = $('secretValue');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    // Update radio styling on change
    document.querySelectorAll('input[name="secretVis"]').forEach(radio => {
      radio.addEventListener('change', () => {
        document.querySelectorAll('input[name="secretVis"]').forEach(r => {
          const label = r.closest('label');
          if (r.checked) {
            label.style.borderColor = 'var(--theme-primary)';
            label.style.background = 'var(--theme-primary-soft)';
          } else {
            label.style.borderColor = 'var(--theme-card-border)';
            label.style.background = 'transparent';
          }
        });
      });
    });

    $('secretSave')?.addEventListener('click', async () => {
      const btn = $('secretSave');
      const key = $('secretKey').value.trim();
      const value = $('secretValue').value;
      const note = $('secretNote').value.trim();
      const visibility = document.querySelector('input[name="secretVis"]:checked')?.value || 'private';

      if (!key) { toast('Key is required', 'error'); return; }
      if (!/^[A-Z][A-Z0-9_]{0,127}$/.test(key)) {
        toast('Key must be UPPER_SNAKE_CASE', 'error');
        return;
      }
      if (!value) { toast('Value is required', 'error'); return; }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      const res = await apiFetch(API_HOST + '?action=secrets/set', {
        method: 'POST',
        body: JSON.stringify({ pid: S.pid, key, value, note: note || null, visibility }),
      });

      if (!res.ok || !res.data?.success) {
        toast(res.data?.error || 'Failed to save secret', 'error');
        btn.disabled = false;
        btn.textContent = isEdit ? 'Update' : 'Create';
        return;
      }

      closeModal();
      toast(isEdit ? 'Secret updated' : 'Secret created', 'success');
      renderPanel();
    });
  }

  function axisLabel(axis) {
    return { profile: 'Show in profile', liveSite: 'Live site link', code: 'Code viewer', languages: 'Language breakdown', db: 'JSON database API' }[axis] || axis;
  }
  function axisDesc(axis) {
    return { profile: 'Profile page lists this project', liveSite: 'Show "Visit live site"', code: 'Allow viewing source', languages: 'Show language %', db: 'Allow external DB reads' }[axis] || '';
  }

  async function toggleVisibility(axis, btn) {
    if (!S.isOwner) { toast('Only owner can change', 'warning'); return; }
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    if (S.syncState !== 'synced') { toast('Push to server first', 'warning'); return; }
    const current = S.project.visibility?.[axis];
    const next = current === 'public' ? 'private' : 'public';
    btn.classList.toggle('on', next === 'public');
    try {
      const res = await apiFetch(API_HOST + '?action=visibility', {
        method: 'POST',
        body: JSON.stringify({ pid: S.pid, visibility: { [axis]: next } }),
      });
      if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
      S.project.visibility = { ...S.project.visibility, [axis]: next };
      cacheProject(S.project);
      toast(next, 'success', 1200);
    } catch (err) {
      btn.classList.toggle('on', current === 'public');
      toast(err.message || 'Update failed', 'error');
    }
  }

        <label class="field-label">Username</label>

              </div>

        const res = await apiFetch(API_HOST + '?action=apikey/generate', {
          method: 'POST',
          body: JSON.stringify({ pid: S.pid }),

        openModal(`

  function confirmClearVersions() {
    confirmModal('Clear manual commits?', 'Deploy snapshots are kept.', 'Clear', true, async () => {
      showLoading('Clearing', '');
      try {
        if (!S.isLocalOnly && S.session && S.online && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=versions/clear', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        const versions = await IDB.listVersions(S.pid);
        for (const v of versions) {
          if (v.kind === 'deploy') continue;
          await dbWrap(dbTx('versions', 'readwrite').delete(v.vid));
        }
        hideLoading();
        toast('Versions cleared', 'success');
        renderPanel();
      } catch (err) { hideLoading(); toast(err.message || 'Failed', 'error'); }
    });
  }

  function clearLocalCache() {
    try {
      localStorage.removeItem(STORAGE.cache + '.' + S.pid);
      sessionStorage.removeItem(STORAGE.expanded + '.' + S.pid);
      toast('Local cache cleared', 'success');
    } catch { toast('Could not clear cache', 'error'); }
  }

  function confirmDeleteProject() {
    openModal(`
      <div class="modal-title">Delete project?</div>
      <div class="modal-desc">Type the project name to confirm. Cannot be undone.</div>
      <div class="field">
        <label class="field-label">Type "${escapeHTML(S.project.name)}"</label>

      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" id="deleteConfirmBtn" disabled>Delete</button>
      </div>
    `);
    $('deleteConfirmInput').addEventListener('input', (e) => {
      $('deleteConfirmBtn').disabled = e.target.value !== S.project.name;
    });
    $('deleteConfirmBtn').addEventListener('click', async () => {
      showLoading('Deleting', '');
      try {
        if (S.session && !S.isLocalOnly && S.online && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=projects/delete', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        await IDB.deleteProject(S.pid);
        try {
          localStorage.removeItem(STORAGE.cache + '.' + S.pid);
          localStorage.removeItem(STORAGE.lastTab + '.' + S.pid);
          sessionStorage.removeItem(STORAGE.expanded + '.' + S.pid);
        } catch {}
        hideLoading();
        toast('Deleted', 'success');
        setTimeout(() => { window.location.href = '/projects'; }, 800);
      } catch (err) { hideLoading(); toast(err.message || 'Delete failed', 'error'); }
    });
  }

  async function readNotes() {
    try {
      const file = await IDB.getFile(S.pid, NOTES_PATH);
      if (!file || !file.content) return { version: 1, notes: [] };
      const parsed = JSON.parse(file.content);
      if (!parsed || !Array.isArray(parsed.notes)) return { version: 1, notes: [] };
      return { version: parsed.version || 1, notes: parsed.notes };
    } catch {
      return { version: 1, notes: [] };
    }
  }

  async function writeNotes(data) {
    if (data.notes.length > NOTES_MAX_COUNT) throw new Error(`Too many notes (max ${NOTES_MAX_COUNT}).`);
    for (const n of data.notes) {
      if (estimateBytes(n.body || '') > NOTES_MAX_BODY_BYTES) {
        throw new Error(`Note "${n.title || 'Untitled'}" exceeds ${formatBytes(NOTES_MAX_BODY_BYTES)}.`);
      }
    }
    const json = JSON.stringify(data, null, 2);
    await IDB.putFile(S.pid, NOTES_PATH, json);
    try {
      const project = await IDB.getProject(S.pid);
      if (project) { project.updatedAt = Date.now(); await IDB.putProject(project); }
    } catch {}
    if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
      apiFetch(API_HOST + '?action=project/sync-back', {
        method: 'POST',
        body: JSON.stringify({ pid: S.pid, files: { [NOTES_PATH]: json } }),
      }).catch(() => {});
    }
  }

  function renderMarkdownSafe(text) {
    let src = String(text ?? '');
    const codeBlocks = [];
    src = src.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (m, lang, body) => {
      const idx = codeBlocks.length;
      codeBlocks.push({ lang, body });
      return `\u0000CODE${idx}\u0000`;
    });
    src = src
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    const lines = src.split('\n');
    const out = [];
    let inUl = false, inOl = false, inBq = false;

    const closeLists = () => {
      if (inUl) { out.push('</ul>'); inUl = false; }
      if (inOl) { out.push('</ol>'); inOl = false; }
    };
    const closeBq = () => {
      if (inBq) { out.push('</blockquote>'); inBq = false; }
    };

    const inlineFmt = (s) => {
      s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">');
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      return s;
    };

    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i];
      if (/^\s*\u0000CODE\d+\u0000\s*$/.test(raw)) {
        closeLists(); closeBq();
        const match = raw.match(/\u0000CODE(\d+)\u0000/);
        const cb = codeBlocks[+match[1]];
        out.push(`<pre><code${cb.lang ? ` class="language-${cb.lang}"` : ''}>${cb.body.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`);
        continue;
      }
      if (/^\s*$/.test(raw)) { closeLists(); closeBq(); continue; }
      const h = raw.match(/^(#{1,6})\s+(.*)$/);
      if (h) { closeLists(); closeBq(); const lvl = h[1].length; out.push(`<h${lvl}>${inlineFmt(h[2])}</h${lvl}>`); continue; }
      if (/^---+$/.test(raw.trim())) { closeLists(); closeBq(); out.push('<hr>'); continue; }
      const bq = raw.match(/^>\s?(.*)$/);
      if (bq) { closeLists(); if (!inBq) { out.push('<blockquote>'); inBq = true; } out.push(`<p>${inlineFmt(bq[1])}</p>`); continue; }
      else closeBq();
      const ul = raw.match(/^\s*[-*]\s+(.*)$/);
      if (ul) { closeLists(); if (!inUl) { out.push('<ul>'); inUl = true; } out.push(`<li>${inlineFmt(ul[1])}</li>`); continue; }
      else if (inUl) { out.push('</ul>'); inUl = false; }
      const ol = raw.match(/^\s*\d+\.\s+(.*)$/);
      if (ol) { if (!inOl) { out.push('<ol>'); inOl = true; } out.push(`<li>${inlineFmt(ol[1])}</li>`); continue; }
      else if (inOl) { out.push('</ol>'); inOl = false; }
      out.push(`<p>${inlineFmt(raw)}</p>`);
    }
    closeLists(); closeBq();
    return out.join('\n');
  }

  async function openNoteEditor(noteId) {
    const data = await readNotes();
    const existing = noteId ? data.notes.find(n => n.id === noteId) : null;
    const note = existing || {
      id: `n_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
      title: '', body: '', color: 'amber', pinned: false,
      createdAt: Date.now(), updatedAt: Date.now(),
    };
    const startInEdit = !existing || !(note.body || '').trim();

    S._noteHistoryPushed = true;
    try {
      history.pushState({ noteOpen: true }, '', location.href);
    } catch {}

    const overlay = document.createElement('div');
    overlay.className = 'note-editor-overlay';
    overlay.innerHTML = `
      <div class="note-editor-header">
        <button class="note-editor-back" type="button" aria-label="Back">${svg('chevron-left', 16, 2.4)}</button>
        <input class="note-editor-title" type="text" placeholder="Note title" maxlength="120" value="${escapeAttr(note.title || '')}">
        <div class="note-editor-title-readonly hidden">${escapeHTML(note.title || 'Untitled')}</div>
        <div class="note-editor-actions">
          <button class="note-editor-action note-mode-btn" data-act="mode" type="button" aria-label="Edit">${svg('edit', 14, 2.2)}</button>
          <button class="note-editor-action ${note.pinned ? 'active' : ''}" data-act="pin" type="button" aria-label="Pin">${svg('bookmark', 14, 2.2)}</button>
          <button class="note-editor-action" data-act="color" type="button" aria-label="Color" style="color:${noteAccentColor(note.color)}">${svg('droplet', 14, 2.2)}</button>
          ${existing ? `<button class="note-editor-action danger" data-act="delete" type="button" aria-label="Delete">${svg('trash', 14, 2.2)}</button>` : ''}
        </div>
      </div>
      <div class="note-format-bar hidden"></div>
      <textarea class="note-editor-body" placeholder="Start writing… Markdown supported." spellcheck="false">${escapeHTML(note.body || '')}</textarea>
      <div class="note-editor-body-readonly hidden"></div>
      <div class="note-editor-status">
        <span class="note-editor-words">0 words</span>
        <span class="note-editor-save">Saved</span>
      </div>
    `;

    const titleEl = overlay.querySelector('.note-editor-title');
    const titleReadonly = overlay.querySelector('.note-editor-title-readonly');
    const bodyEl = overlay.querySelector('.note-editor-body');
    const bodyReadonly = overlay.querySelector('.note-editor-body-readonly');
    const wordsEl = overlay.querySelector('.note-editor-words');
    const saveEl = overlay.querySelector('.note-editor-save');
    const modeBtn = overlay.querySelector('[data-act="mode"]');
    const formatBar = overlay.querySelector('.note-format-bar');

    let currentMode = startInEdit ? 'edit' : 'read';
    let autosaveTimer = null;
    let dirty = false;
    let isDeleted = false;

    function updateWords() {
      const words = (bodyEl.value.trim().match(/\S+/g) || []).length;
      wordsEl.textContent = `${words} word${words === 1 ? '' : 's'}`;
    }

    function setMode(mode) {
      currentMode = mode;
      const isEdit = mode === 'edit';
      titleEl.classList.toggle('hidden', !isEdit);
      titleReadonly.classList.toggle('hidden', isEdit);
      bodyEl.classList.toggle('hidden', !isEdit);
      bodyReadonly.classList.toggle('hidden', isEdit);
      formatBar.classList.toggle('hidden', !isEdit);
      modeBtn.innerHTML = svg(isEdit ? 'check' : 'edit', 14, 2.2);
      modeBtn.classList.toggle('active', isEdit);
      modeBtn.setAttribute('aria-label', isEdit ? 'Done' : 'Edit');
      if (isEdit) {
        setTimeout(() => bodyEl.focus(), 50);
      } else {
        titleReadonly.textContent = titleEl.value || 'Untitled';
        bodyReadonly.innerHTML = renderMarkdownSafe(bodyEl.value || '');
        if (dirty) doSave();
      }
    }

    function buildFormatBar() {
      const groups = [
        [{ id: 'h1', prefix: '# ', block: true }, { id: 'h2', prefix: '## ', block: true }, { id: 'h3', prefix: '### ', block: true }],
        [{ id: 'bold', wrap: ['**', '**'] }, { id: 'italic', wrap: ['*', '*'] }, { id: 'strike', wrap: ['~~', '~~'] }],
        [{ id: 'ul', prefix: '- ', block: true }, { id: 'ol', prefix: '1. ', block: true }, { id: 'quote', prefix: '> ', block: true }],
        [{ id: 'link', wrap: ['[', '](https://)'] }, { id: 'image', wrap: ['![', '](https://)'] }, { id: 'code', wrap: ['`', '`'] }],
      ];
      formatBar.innerHTML = groups.map(group => `<div class="note-format-group">${group.map(btn => `<button class="note-format-btn" type="button" data-fmt='${JSON.stringify(btn)}' title="${btn.id}">${svg(btn.id === 'ul' ? 'list' : btn.id === 'ol' ? 'list' : btn.id === 'quote' ? 'quote' : btn.id === 'link' ? 'link' : btn.id === 'image' ? 'image' : btn.id === 'code' ? 'code' : btn.id === 'h1' ? 'h1' : btn.id === 'h2' ? 'h2' : btn.id === 'h3' ? 'h3' : btn.id === 'bold' ? 'bold' : btn.id === 'italic' ? 'italic' : btn.id === 'strike' ? 'strike' : 'hash', 13, 2.2)}</button>`).join('')}</div>`).join('');
      formatBar.querySelectorAll('.note-format-btn').forEach(btn => {
        btn.addEventListener('mousedown', (e) => e.preventDefault());
        btn.addEventListener('click', () => applyMarkdown(JSON.parse(btn.dataset.fmt)));
      });
    }

    function applyMarkdown(action) {
      const start = bodyEl.selectionStart;
      const end = bodyEl.selectionEnd;
      const value = bodyEl.value;
      const selected = value.slice(start, end);

      if (action.block) {
        const lineStart = value.lastIndexOf('\n', start - 1) + 1;
        bodyEl.value = value.slice(0, lineStart) + action.prefix + value.slice(lineStart);
        bodyEl.selectionStart = start + action.prefix.length;
        bodyEl.selectionEnd = end + action.prefix.length;
      } else if (action.wrap) {
        const [before, after] = action.wrap;
        bodyEl.value = value.slice(0, start) + before + selected + after + value.slice(end);
        bodyEl.selectionStart = start + before.length;
        bodyEl.selectionEnd = start + before.length + selected.length;
      }
      note.body = bodyEl.value;
      updateWords();
      markDirty();
      bodyEl.focus();
    }

    function markDirty() {
      if (!dirty) { dirty = true; saveEl.textContent = 'Editing…'; saveEl.classList.add('dirty'); }
      if (autosaveTimer) clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(doSave, 800);
    }

    async function doSave() {
      if (!dirty || isDeleted) return;
      try {
        if (!note.title.trim()) {
          const m = bodyEl.value.match(/^#{1,6}\s+(.+)$/m);
          if (m) { note.title = m[1].trim().slice(0, 120); titleEl.value = note.title; }
        }
        note.title = titleEl.value.trim();
        note.body = bodyEl.value;
        note.updatedAt = Date.now();
        const fresh = await readNotes();
        const idx = fresh.notes.findIndex(n => n.id === note.id);
        if (idx >= 0) fresh.notes[idx] = note;
        else fresh.notes.push(note);
        await writeNotes(fresh);
        dirty = false;
        saveEl.textContent = 'Saved';
        saveEl.classList.remove('dirty');
      } catch (err) {
        saveEl.textContent = 'Save failed';
        saveEl.classList.add('error');
        toast(err.message || "Couldn't save", 'error', 4000);
      }
    }

    function teardown() {
      if (autosaveTimer) clearTimeout(autosaveTimer);
      overlay.classList.remove('open');
      setTimeout(() => overlay.remove(), 320);
      if (S._noteHistoryPushed) {
        S._noteHistoryPushed = false;
        try { history.back(); } catch {}
      }
    }

    async function closeMe() {
      if (dirty && !isDeleted) await doSave();
      teardown();
    }

    async function deleteMe() {
      confirmModal('Delete this note?', "Can't be undone.", 'Delete', true, async () => {
        isDeleted = true;
        const fresh = await readNotes();
        fresh.notes = fresh.notes.filter(n => n.id !== note.id);
        await writeNotes(fresh);
        toast('Note deleted', 'info');
        teardown();
        if (S.activeTab === 'overview') renderPanel();
      });
    }

    overlay.querySelector('.note-editor-back').addEventListener('click', closeMe);
    titleEl.addEventListener('input', () => { note.title = titleEl.value; markDirty(); });
    bodyEl.addEventListener('input', () => { note.body = bodyEl.value; updateWords(); markDirty(); });
    modeBtn.addEventListener('click', () => setMode(currentMode === 'read' ? 'edit' : 'read'));
    overlay.querySelector('[data-act="pin"]')?.addEventListener('click', (e) => {
      note.pinned = !note.pinned;
      e.currentTarget.classList.toggle('active', note.pinned);
      markDirty();
    });
    overlay.querySelector('[data-act="color"]')?.addEventListener('click', (e) => {
      const pop = document.createElement('div');
      pop.className = 'note-color-popover';
      Object.entries(NOTE_COLORS).forEach(([name, hex]) => {
        const sw = document.createElement('button');
        sw.className = 'note-color-swatch' + (note.color === name ? ' active' : '');
        sw.type = 'button';
        sw.style.background = hex;
        sw.addEventListener('click', () => {
          note.color = name;
          e.currentTarget.style.color = hex;
          markDirty();
          pop.remove();
        });
        pop.appendChild(sw);
      });
      const rect = e.currentTarget.getBoundingClientRect();
      pop.style.top = (rect.bottom + 4) + 'px';
      pop.style.right = (window.innerWidth - rect.right) + 'px';
      document.body.appendChild(pop);
      setTimeout(() => {
        document.addEventListener('click', function handler(ev) {
          if (!pop.contains(ev.target) && ev.target !== e.currentTarget) {
            pop.remove();
            document.removeEventListener('click', handler);
          }
        });
      }, 50);
    });
    overlay.querySelector('[data-act="delete"]')?.addEventListener('click', deleteMe);

    document.body.appendChild(overlay);
    buildFormatBar();
    requestAnimationFrame(() => {
      overlay.classList.add('open');
      setMode(currentMode);
      updateWords();
    });
    setTimeout(() => {
      if (currentMode === 'edit') {
        if (!note.title) titleEl.focus();
        else bodyEl.focus();
      }
    }, 150);

    const escHandler = (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeMe();
        document.removeEventListener('keydown', escHandler);
      }
    };
    document.addEventListener('keydown', escHandler);
  }

  async function openEditProjectModal() {
    if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }
    let files = [];
    try { files = await IDB.listFiles(S.pid); } catch {}
    const htmlFiles = getHtmlFiles(files.filter(f => !isSystemFile(f.path)));
    const p = S.project;
    const state = {
      iconUrl: p.iconUrl || null,
      name: p.name || '',
      description: p.description || '',
      primaryFile: p.primaryFile || '',
    };
    const iconHtml = state.iconUrl
      ? `<img src="${escapeAttr(state.iconUrl)}" alt="">`
      : `<span style="background:${getAvatarColor(p.name)};color:#0a0c10;">${escapeHTML(getInitials(p.name))}</span>`;

    openModal(`
      <div class="edit-project-modal">
        <div class="modal-title">Edit project</div>
        <div class="modal-desc">Update project identity.</div>
        <div class="edit-project-icon-row">
          <button class="edit-project-icon-preview project-icon-box" id="editProjectIcon" type="button" aria-label="Change icon">${iconHtml}</button>
          <div class="edit-project-icon-actions">
            <div style="font-size:11px;font-weight:700;">Project icon</div>
            <div style="font-size:10.5px;color:var(--theme-text-tertiary);margin-top:2px;">Tap to change</div>
            <button class="btn btn-sm btn-secondary" id="btnChangeProjectIcon" type="button" style="margin-top:6px;">${svg('image', 10, 2.2)} Change</button>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Name</label>
          <input class="input" id="editProjectName" maxlength="100" value="${escapeAttr(state.name)}">
        </div>
        <div class="field">
          <label class="field-label">Description</label>
          <textarea class="textarea" id="editProjectDesc" maxlength="500">${escapeHTML(state.description)}</textarea>
        </div>
        <div class="field">
          <label class="field-label">Primary file</label>
          <select class="select" id="editProjectPrimary">
            <option value="">Auto-detect</option>
            ${htmlFiles.map(f => `<option value="${escapeAttr(f)}" ${state.primaryFile === f ? 'selected' : ''}>${escapeHTML(f)}</option>`).join('')}
          </select>
        </div>
        <div class="edit-project-footer">
          <button class="btn btn-secondary" id="editProjectCancel" type="button">Cancel</button>
          <button class="btn btn-primary" id="editProjectSave" type="button" disabled>${svg('check', 10, 2.4)} Save</button>
        </div>
      </div>
    `);

    const saveBtn = $('editProjectSave');
    const nameInput = $('editProjectName');
    const descInput = $('editProjectDesc');
    const primarySelect = $('editProjectPrimary');

    function checkDirty() {
      const changed =
        nameInput.value.trim() !== (p.name || '') ||
        descInput.value.trim() !== (p.description || '') ||
        (primarySelect.value || '') !== (p.primaryFile || '') ||
        state.iconUrl !== (p.iconUrl || null);
      saveBtn.disabled = !changed || !nameInput.value.trim();
    }
    nameInput.addEventListener('input', checkDirty);
    descInput.addEventListener('input', checkDirty);
    primarySelect.addEventListener('change', checkDirty);

    $('btnChangeProjectIcon')?.addEventListener('click', () => {
      openIconPicker(async (newUrl) => {
        state.iconUrl = newUrl;
        const el = $('editProjectIcon');
        if (el) {
          el.innerHTML = newUrl
            ? `<img src="${escapeAttr(newUrl)}" alt="">`
            : `<span style="background:${getAvatarColor(nameInput.value)};color:#0a0c10;">${escapeHTML(getInitials(nameInput.value))}</span>`;
        }
        checkDirty();
      });
    });

    $('editProjectCancel')?.addEventListener('click', () => {
      if (saveBtn.disabled) { closeModal(); return; }
      confirmModal('Discard changes?', 'Your edits will not be saved.', 'Discard', true, closeModal);
    });

    saveBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const description = descInput.value.trim();
      const primaryFile = primarySelect.value || null;
      if (!name) { toast('Name required', 'error'); return; }
      saveBtn.disabled = true;
      const prev = saveBtn.innerHTML;
      saveBtn.innerHTML = 'Saving…';

      try {
        const patch = { name, description, iconUrl: state.iconUrl };
        if (S.session && S.online && !S.isLocalOnly && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=projects/update', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, ...patch }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Save failed');

          const metaTags = { ...(S.project.metaTags || {}) };
          metaTags.title = name;
          if (description) metaTags.description = description;
          await apiFetch(API_HOST + '?action=metatags/save', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, metaTags }),
          }).catch(() => {});
          S.project.metaTags = metaTags;
        } else {
          await enqueueSync('project-update', patch);
        }

        S.project.name = name;
        S.project.description = description;
        S.project.iconUrl = state.iconUrl;
        S.project.primaryFile = primaryFile;
        S.project.updatedAt = Date.now();

        try {
          await IDB.putProject({
            pid: S.pid,
            name, description,
            slug: S.project.slug || '',
            iconUrl: state.iconUrl,
            primaryFile,
            createdAt: S.project.createdAt || Date.now(),
            updatedAt: Date.now(),
            storageLimit: S.project.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT,
            myRole: S.project.myRole || 'owner',
            _server: S.project._server !== false,
            ownerUsername: S.project.ownerUsername || null,
          });
        } catch {}
        cacheProject(S.project);

        closeModal();
        toast('Saved', 'success');
        updateHeader();
        updateProjectIcons();
        renderPanel();
      } catch (err) {
        toast(err.message || 'Save failed', 'error');
        saveBtn.disabled = false;
        saveBtn.innerHTML = prev;
      }
    });
  }

              <div class="cover-swatch" style="background:${draft.accent}"><input type="color" id="coverAccent" value="${draft.accent}"></div>
              <input class="input" id="coverAccentHex" value="${draft.accent}">

        <div class="field-hint">PNG, JPG, WebP. Max 1 MB.</div>

        <div class="upload-url-panel">
          <div class="cover-field-row">
