<script>
(function () {
  try {
    var pref = localStorage.getItem("folio.theme") || "dark";
    var resolved = pref;
    if (pref === "auto" || pref === "system") {
      resolved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
        ? "light" : "dark";
    }
    if (resolved === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");

    if (localStorage.getItem("folio.reducedMotion") === "true") {
      document.documentElement.setAttribute("data-reduced-motion", "true");
    }

    var scale = Number(localStorage.getItem("folio.pageScale") || 1);
    if (!Number.isFinite(scale) || scale < 0.85) scale = 1;
    if (scale > 1.35) scale = 1.35;
    document.documentElement.style.setProperty("--page-scale", String(scale));

    var meta = document.getElementById("themeColorMeta") || document.getElementById("metaThemeColor");
    if (meta) meta.setAttribute("content", resolved === "light" ? "#f7f8fa" : "#0a0c10");
  } catch (e) {}
})();
</script>

  // ═══════════════════════════════════════════════════════════
  // THEME SYNC
  // ═══════════════════════════════════════════════════════════

  function wireThemeSync() {
    window.addEventListener('storage', function (e) {
      try {
        if (e.key === 'folio.theme') {
          var pref = e.newValue || 'dark';
          var resolved = pref;
          if (pref === 'auto' || pref === 'system') {
            resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
              ? 'light' : 'dark';
          }
          if (resolved === 'light') document.documentElement.setAttribute('data-theme', 'light');
          else document.documentElement.removeAttribute('data-theme');
          var meta = document.getElementById('themeColorMeta');
          if (meta) meta.setAttribute('content', resolved === 'light' ? '#f7f8fa' : '#0a0c10');
        }
        if (e.key === 'folio.reducedMotion') {
          if (e.newValue === 'true') document.documentElement.setAttribute('data-reduced-motion', 'true');
          else document.documentElement.removeAttribute('data-reduced-motion');
        }
        if (e.key === 'folio.pageScale') {
          var scale = Number(e.newValue || 1);
          if (!Number.isFinite(scale) || scale < 0.85) scale = 1;
          if (scale > 1.35) scale = 1.35;
          document.documentElement.style.setProperty('--page-scale', String(scale));
        }
      } catch (err) {}
    });
  }

  function wireThemeMediaQuery() {
    if (!window.matchMedia) return;
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    var handler = function () {
      try {
        var pref = localStorage.getItem('folio.theme') || 'dark';
        if (pref !== 'auto' && pref !== 'system') return;
        var resolved = mq.matches ? 'light' : 'dark';
        if (resolved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
        var meta = document.getElementById('themeColorMeta');
        if (meta) meta.setAttribute('content', resolved === 'light' ? '#f7f8fa' : '#0a0c10');
      } catch (e) {}
    };
    if (mq.addEventListener) mq.addEventListener('change', handler);
    else if (mq.addListener) mq.addListener(handler);
  }

  function svg(name, size = 14, sw = 2.2) {
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${TAB_ICONS[name] || ''}</svg>`;

  // ═══════════════════════════════════════════════════════════
  // IDB — v3 with folders store
  // ═══════════════════════════════════════════════════════════

  let dbConn = null;
  function openDB() {
    if (dbConn) return Promise.resolve(dbConn);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => { dbConn = req.result; resolve(dbConn); };
      req.onupgradeneeded = (event) => {
        const conn = event.target.result;
        if (!conn.objectStoreNames.contains('projects')) conn.createObjectStore('projects', { keyPath: 'pid' });
        if (!conn.objectStoreNames.contains('files')) {
          const store = conn.createObjectStore('files', { keyPath: ['pid', 'path'] });
          store.createIndex('pid', 'pid');
        }
        if (!conn.objectStoreNames.contains('versions')) {
          const store = conn.createObjectStore('versions', { keyPath: 'vid' });
          store.createIndex('pid', 'pid');
        }
        if (!conn.objectStoreNames.contains('projectMeta')) conn.createObjectStore('projectMeta', { keyPath: 'pid' });
        if (!conn.objectStoreNames.contains('syncQueue')) conn.createObjectStore('syncQueue', { keyPath: 'id', autoIncrement: true });
        if (!conn.objectStoreNames.contains('folders')) {
          const store = conn.createObjectStore('folders', { keyPath: ['pid', 'path'] });
          store.createIndex('pid', 'pid');
        }
      };
    });
  }

  function dbWrap(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
  function dbTx(store, mode = 'readonly') { return dbConn.transaction(store, mode).objectStore(store); }

  const IDB = {
    async getProject(pid) { return dbWrap(dbTx('projects').get(pid)); },
    async putProject(p) { return dbWrap(dbTx('projects', 'readwrite').put(p)); },
    async deleteProject(pid) {
      await dbWrap(dbTx('projects', 'readwrite').delete(pid));
      const files = await dbWrap(dbTx('files').index('pid').getAll(pid));
      for (const f of files) await dbWrap(dbTx('files', 'readwrite').delete([f.pid, f.path]));
      const versions = await dbWrap(dbTx('versions').index('pid').getAll(pid));
      for (const v of versions) await dbWrap(dbTx('versions', 'readwrite').delete(v.vid));
      const folders = await dbWrap(dbTx('folders').index('pid').getAll(pid));
      for (const f of folders) await dbWrap(dbTx('folders', 'readwrite').delete([f.pid, f.path]));
    },
    async listFiles(pid) { return dbWrap(dbTx('files').index('pid').getAll(pid)); },
    async getFile(pid, path) { return dbWrap(dbTx('files').get([pid, path])); },
    async putFile(pid, path, content) {
      return dbWrap(dbTx('files', 'readwrite').put({ pid, path, content, updatedAt: Date.now() }));
    },
    async deleteFile(pid, path) { return dbWrap(dbTx('files', 'readwrite').delete([pid, path])); },
    async listVersions(pid) {
      const all = await dbWrap(dbTx('versions').index('pid').getAll(pid));
      return all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    },
    async getVersion(vid) { return dbWrap(dbTx('versions').get(vid)); },
    async putVersion(v) { return dbWrap(dbTx('versions', 'readwrite').put(v)); },
    async listFolders(pid) { return dbWrap(dbTx('folders').index('pid').getAll(pid)); },
    async putFolder(pid, path) {
      return dbWrap(dbTx('folders', 'readwrite').put({ pid, path, createdAt: Date.now() }));
    },
  };

    activeTab: 'overview', tabs: OWNER_TABS, tabCounts: {},

  const $ = id => document.getElementById(id);
  const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const escapeAttr = s => String(s ?? '').replace(/"/g, '&quot;');

  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }

  // ═══════════════════════════════════════════════════════════
  // UTILS
  // ═══════════════════════════════════════════════════════════

  function timeAgo(ts) {
    if (!ts) return '—';
    const diff = Date.now() - ts;
    if (diff < 60000) return 'just now';
    const m = Math.floor(diff / 60000);
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h / 24);
    if (d < 30) return `${d}d ago`;
    return new Date(ts).toLocaleDateString();
  }

  function formatBytes(n) {
    if (!n || n < 0) return '0 B';
    const u = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${n < 10 ? n.toFixed(1) : Math.round(n)} ${u[i]}`;
  }

  function formatNumber(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n || 0);
  }

  function formatDate(ts, { withDay = false } = {}) {
    if (!ts) return '—';
    return new Date(ts).toLocaleDateString('en-US', withDay
      ? { month: 'short', day: 'numeric', year: 'numeric' }
      : { month: 'short', year: 'numeric' });
  }

  function getInitials(name) {
    const s = String(name || '').trim();
    if (!s) return '?';
    const parts = s.split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  const AVATAR_GRADIENTS = [
    'linear-gradient(135deg, #F59E0B, #f97316)',
    'linear-gradient(135deg, #0284c7, #0369a1)',
    'linear-gradient(135deg, #a855f7, #6d28d9)',
    'linear-gradient(135deg, #10B981, #059669)',
    'linear-gradient(135deg, #ec4899, #be185d)',
    'linear-gradient(135deg, #06b6d4, #0891b2)',
  ];

  function getAvatarColor(seed) {
    const s = String(seed || '');
    let hash = 0;
    for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_GRADIENTS[Math.abs(hash) % AVATAR_GRADIENTS.length];
  }

  function estimateBytes(content) {
    if (!content) return 0;
    if (typeof content !== 'string') content = String(content);
    if (content.startsWith('data:')) {
      const comma = content.indexOf(',');
      const b64 = comma >= 0 ? content.slice(comma + 1) : content;
      return Math.floor(b64.length * 0.75);
    }
    try { return new Blob([content]).size; } catch { return content.length; }
  }

  function fileIconName(path) {
    const ext = (path.split('.').pop() || '').toLowerCase();
    if (['html','htm','css','scss','less','js','mjs','cjs','jsx','ts','tsx'].includes(ext)) return 'code';
    if (ext === 'json') return 'file';
    if (['md','markdown','txt'].includes(ext)) return 'file-text';
    if (['png','jpg','jpeg','gif','svg','webp'].includes(ext)) return 'image';
    return 'file';
  }

  function isTextFile(path) {
    return /\.(html?|css|js|mjs|cjs|jsx|tsx?|py|json|md|txt|ya?ml|svg|xml)$/i.test(path);
  }

  function isSystemFile(path) {
    return path === NOTES_PATH
      || /(^|\/)\.gitkeep$/i.test(path)
      || /(^|\/)\.keep$/i.test(path);
  }

  function noteAccentColor(color) {
    return NOTE_COLORS[color] || NOTE_COLORS.amber;
  }

  function copyToClipboard(text) {
    try {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
        return true;
      }
    } catch {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch { return false; }
  }

  // ═══════════════════════════════════════════════════════════
  // SESSION / API
  // ═══════════════════════════════════════════════════════════

  function readSession() {
    try { S.session = localStorage.getItem(STORAGE.session); } catch {}
    try {
      const raw = localStorage.getItem(STORAGE.user);
      S.user = raw ? JSON.parse(raw) : null;
    } catch {}
    if (S.user) S.uid = S.user.uid || null;
  }

  async function apiFetch(url, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    if (S.session) headers['Authorization'] = `Bearer ${S.session}`;
    try {
      const res = await fetch(url, { ...opts, headers });
      let data = {};
      try { data = await res.json(); } catch {}
      return { ok: res.ok, status: res.status, data, headers: res.headers };
    } catch (err) {
      return { ok: false, status: 0, data: { error: 'NETWORK_ERROR' }, headers: null };
    }
  }

  // ═══════════════════════════════════════════════════════════
  // TOAST / MODAL / LOADING
  // ═══════════════════════════════════════════════════════════

  function toast(msg, type = 'info', duration = 2400) {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const ic = type === 'success' ? 'checkCircle' : type === 'error' ? 'alertCircle' : type === 'warning' ? 'alert' : 'info';
    el.innerHTML = svg(ic, 13, 2.4) + '<span></span>';
    el.querySelector('span').textContent = msg;
    $('toastContainer').appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, duration);
  }

  function showLoading(title = 'Working…', desc = '') {
    $('loadingTitle').textContent = title;
    $('loadingDesc').textContent = desc;
    $('loadingOverlay').classList.add('active');
  }
  function setLoadingDesc(desc) { const el = $('loadingDesc'); if (el) el.textContent = desc || ''; }
  function hideLoading() { $('loadingOverlay').classList.remove('active'); }

  function openModal(html) {
    $('modalBody').innerHTML = html;
    $('modalOverlay').classList.add('active');
  }
  function closeModal() {
    $('modalOverlay').classList.remove('active');
    setTimeout(() => { $('modalBody').innerHTML = ''; }, 250);
  }
  window.closeModal = closeModal;

  function confirmModal(title, desc, confirmLabel, danger, onConfirm) {
    openModal(`
      <div class="modal-title">${escapeHTML(title)}</div>
      <div class="modal-desc">${escapeHTML(desc)}</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-modal-close>Cancel</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="modalConfirmBtn">${escapeHTML(confirmLabel)}</button>
      </div>
    `);
    $('modalConfirmBtn').addEventListener('click', () => { closeModal(); onConfirm(); });
  }

  // ═══════════════════════════════════════════════════════════
  // CACHE
  // ═══════════════════════════════════════════════════════════

  function cacheProject(project) {
    try {
      localStorage.setItem(STORAGE.cache + '.' + S.pid, JSON.stringify({ project, cachedAt: Date.now() }));
    } catch {}
  }
  function readCachedProject() {
    try {
      const raw = localStorage.getItem(STORAGE.cache + '.' + S.pid);
      return raw ? JSON.parse(raw).project : null;
    } catch { return null; }
  }

  // ═══════════════════════════════════════════════════════════
  // ROUTING
  // ═══════════════════════════════════════════════════════════

  function getPid() {
    const params = new URLSearchParams(location.search);
    return params.get('pid') || null;
  }
  function getHashTab() { return location.hash.replace(/^#\/?/, '') || null; }
  function setHashTab(tabId) {
    const newHash = `#/${tabId}`;
    if (location.hash !== newHash) history.replaceState(null, '', newHash);
  }
  function getLastTab() {
    try { return localStorage.getItem(STORAGE.lastTab + '.' + S.pid) || null; } catch { return null; }
  }
  function saveLastTab(tabId) {
    try { localStorage.setItem(STORAGE.lastTab + '.' + S.pid, tabId); } catch {}
  }
  function shouldRememberTab() {
    try { const v = localStorage.getItem(STORAGE.rememberTab); return v === null ? true : v === 'true'; }
    catch { return true; }
  }
  function loadExpanded() {
    try {
      const raw = sessionStorage.getItem(STORAGE.expanded + '.' + S.pid);
      if (raw) S.expandedFolders = new Set(JSON.parse(raw));
    } catch {}
  }
  function saveExpanded() {
    try {
      sessionStorage.setItem(STORAGE.expanded + '.' + S.pid, JSON.stringify([...S.expandedFolders]));
    } catch {}
  }

  // ═══════════════════════════════════════════════════════════
  // MODE BANNER
  // ═══════════════════════════════════════════════════════════

  function updateModeBanner() {
    const banner = $('modeBanner');
    const text = $('modeBannerText');
    const action = $('modeBannerAction');
    if (!banner || !text || !action) return;

    const state = S.syncState;

    if (state === 'local' && !S.session) {
      banner.hidden = false;
      banner.classList.add('visible');
      text.textContent = 'Saved only on this device. Sign in to back it up and deploy.';
      action.textContent = 'Sign in';
      action.disabled = false;
      action.onclick = () => {
        window.location.href = '/register?next=' + encodeURIComponent(location.pathname + location.search);
      };
      return;
    }
    if (state === 'local' && S.session) {
      banner.hidden = false;
      banner.classList.add('visible');
      text.textContent = 'Saved only on this device. Sync to your account to back it up and enable deploys.';
      action.textContent = 'Sync to account';
      action.disabled = false;
      action.onclick = () => promoteLocalProject();
      return;
    }
    if (state === 'orphan') {
      banner.hidden = false;
      banner.classList.add('visible');
      text.textContent = 'This project isn\'t on the server yet. Push it to keep your files safe and enable sharing.';
      action.textContent = 'Push to server';
      action.disabled = false;
      action.onclick = () => pushOrphanToServer();
      return;
    }
    if (state === 'cached' || !S.online) {
      banner.hidden = false;
      banner.classList.add('visible');
      text.textContent = 'Offline — showing cached data. Changes will sync when you reconnect.';
      action.textContent = 'Retry';
      action.disabled = false;
      action.onclick = () => location.reload();
      return;
    }

    banner.hidden = true;
    banner.classList.remove('visible');
  }

  // ═══════════════════════════════════════════════════════════
  // ICON
  // ═══════════════════════════════════════════════════════════

  function renderProjectIcon(el, project, { editable = false } = {}) {
    if (!el) return;
    const url = project?.iconUrl;
    const name = project?.name || '?';
    const initials = getInitials(name);
    if (url) el.innerHTML = `<img src="${escapeAttr(url)}" alt="${escapeAttr(name)}">`;
    else {
      el.textContent = initials;
      el.style.background = getAvatarColor(name);
      el.style.color = '#0a0c10';
    }
    el.classList.add('project-icon-box');
  }

  function updateFavicon(project) {
    const fav = $('pageFavicon');
    if (fav && project?.iconUrl) fav.href = project.iconUrl;
  }

  function updateProjectIcons() {
    renderProjectIcon($('headerProjectIcon'), S.project, { editable: true });
    updateFavicon(S.project);
  }

  // ═══════════════════════════════════════════════════════════
  // LOAD PROJECT
  // ═══════════════════════════════════════════════════════════

  async function loadProject() {
    let localProject = null;
    try { localProject = await IDB.getProject(S.pid); } catch {}

    if (/^local_/.test(S.pid)) {
      if (!localProject) {
        showEmptyState('Not found', 'This local project no longer exists.');
        return false;
      }
      S.project = {
        ...localProject,
        myRole: 'owner',
        visibility: localProject.visibility || { profile: 'private' },
      };
      S.isLocalOnly = true;
      S.syncState = 'local';
      applyProjectMeta();
      return true;
    }

    if (S.session && S.online) {
      let res;
      try {
        res = await apiFetch(API_HOST + '?action=projects/get&pid=' + encodeURIComponent(S.pid));
      } catch (err) {
        res = { ok: false, status: 0, data: { error: 'NETWORK_ERROR' } };
      }

      if (res.ok && res.data?.success) {
        const norm = normalizeServerProject(res.data.project);
        try { await IDB.putProject(norm); } catch {}
        S.project = { ...res.data.project, ...norm };
        S.isLocalOnly = false;
        S.syncState = 'synced';
        cacheProject(S.project);
        applyProjectMeta();
        return true;
      }

      if (res.status === 401) {
        toast('Session expired — signing in again', 'warning', 3200);
        setTimeout(() => {
          window.location.href = '/register?next=' + encodeURIComponent(location.pathname + location.search);
        }, 1200);
        return false;
      }

      if (res.status === 404 || res.status === 403) {
        if (localProject) {
          const inferredRole = localProject.myRole
            || (localProject._server ? 'viewer' : 'owner');
          S.project = {
            ...localProject,
            myRole: inferredRole,
            visibility: localProject.visibility || { profile: 'private' },
          };
          S.isLocalOnly = false;
          S.syncState = 'orphan';
          applyProjectMeta();
          return true;
        }
        showEmptyState('Project not found', 'This project may have been deleted, or you don\'t have access.');
        return false;
      }
    }

    if (localProject) {
      const inferredRole = localProject.myRole
        || (localProject._server ? 'viewer' : 'owner');
      S.project = {
        ...localProject,
        myRole: inferredRole,
        visibility: localProject.visibility || { profile: 'private' },
      };
      S.isLocalOnly = false;
      S.syncState = 'cached';
      applyProjectMeta();
      return true;
    }

    const cached = readCachedProject();
    if (cached) {
      S.project = { ...cached, myRole: cached.myRole || 'viewer' };
      S.syncState = 'cached';
      applyProjectMeta();
      return true;
    }

    showEmptyState('Couldn\'t load project', 'Check your connection and try again.');
    return false;
  }

  function showEmptyState(title, desc) {
    S.isFatal = true;
    $('emptyProjectTitle').textContent = title;
    $('emptyProjectDesc').textContent = desc;
    $('emptyProjectState').classList.remove('hidden');
    // Hide irrelevant chrome
    const tabsBar = $('topTabsBar');
    if (tabsBar) tabsBar.style.display = 'none';
    const badgesRow = $('headerBadgesRow');
    if (badgesRow) badgesRow.style.display = 'none';
    const headerSub = $('headerProjectSub');
    if (headerSub) headerSub.textContent = '';
    const headerName = $('headerProjectName');
    if (headerName) headerName.textContent = 'Project';
    const icon = $('headerProjectIcon');
    if (icon) icon.hidden = true;
    ['btnDeploy', 'btnOpenEditor', 'btnBell', 'btnMore', 'headerIdentity'].forEach(id => {
      const el = $(id);
      if (el) el.style.display = 'none';
    });
    const menuBtn = $('menuBtn');
    if (menuBtn) menuBtn.style.display = 'none';
    const backBtn = $('btnBackToProjects');
    if (backBtn) backBtn.style.display = 'flex';
    const contentInner = $('contentInner');
    if (contentInner) contentInner.innerHTML = '';
  }

  function applyProjectMeta() {
    S.role = S.project.myRole || (S.isLocalOnly ? 'owner' : 'viewer');
    S.isOwner = S.role === 'owner';
    S.isEditor = S.role === 'owner' || S.role === 'editor';
    S.isSharedMode = !S.isOwner && !S.isEditor;
    S.tabs = S.isSharedMode ? SHARED_TABS : OWNER_TABS;
    if (!S.tabs.some(t => t.id === S.activeTab)) S.activeTab = 'overview';

    loadExpanded();
    updateHeader();
    updateModeBanner();
    renderSidebar();
    renderTopTabs();
    updateProjectIcons();

    if (S.isEditor || S.project.visibility?.liveSite === 'public') loadDeployState();
  }

  function updateHeader() {
    $('headerProjectName').textContent = S.project.name || 'Untitled project';

    const slugPart = S.project.slug ? `@${escapeHTML(S.project.slug)}` : '';
    const updatedPart = S.project.updatedAt ? ` · ${timeAgo(S.project.updatedAt)}` : '';
    const roleBadge = `<span class="header-role-badge">${S.isOwner ? 'Owner' : escapeHTML(S.role || 'Viewer')}</span>`;
    const syncBadge = (() => {
      if (S.syncState === 'local' || S.syncState === 'orphan') return '<span class="header-sync-badge">Not synced</span>';
      if (S.syncState === 'cached') return '<span class="header-sync-badge cached">Cached</span>';
      return '';
    })();
    const deployBadge = S.project.deployment?.url
      ? `<span class="header-deploy-badge"><span class="dot"></span>Live</span>`
      : S.project.deployment?.state === 'OFFLINE'
        ? `<span class="header-deploy-badge offline">Offline</span>`
        : '';

    $('headerProjectSub').innerHTML = `<span class="sub-slug">${slugPart}</span><span class="sub-sep">·</span>${roleBadge}${syncBadge}${deployBadge}<span class="sub-updated">${updatedPart}</span>`;

    // Mobile badges row mirrors the same info
    const badgesRow = $('headerBadgesRow');
    if (badgesRow) {
      badgesRow.innerHTML = `
        <span class="header-mobile-slug">${slugPart}</span>
        ${roleBadge}${deployBadge}
      `;
    }

    document.title = `${S.project.name || 'Project'} — Folio`;

    // Deploy button state
    const deployBtn = $('btnDeploy');
    if (deployBtn) {
      if (S.project.deployment?.url) {
        deployBtn.classList.add('is-live');
        deployBtn.querySelector('.lbl').textContent = 'Live';
      } else {
        deployBtn.classList.remove('is-live');
        deployBtn.querySelector('.lbl').textContent = 'Deploy';
      }
    }

    const canEdit = S.isEditor && !S.isLocalOnly;
    $('btnDeploy').style.display = (canEdit || S.isLocalOnly) ? '' : 'none';
    $('btnOpenEditor').style.display = '';
    $('btnBell').style.display = S.session ? '' : 'none';
    $('btnMore').style.display = '';
  }

  // ═══════════════════════════════════════════════════════════
  // TOP TABS
  // ═══════════════════════════════════════════════════════════

  function renderTopTabs() {
    const bar = $('topTabsBar');
    if (!bar) return;

    bar.innerHTML = S.tabs.map(t => {
      const isActive = t.id === S.activeTab;
      const count = t.countKey && S.tabCounts[t.countKey] != null ? S.tabCounts[t.countKey] : null;
      return `
        <button class="top-tab-btn ${isActive ? 'active' : ''}"
                data-top-tab="${escapeAttr(t.id)}"
                type="button"
                role="tab"
                aria-selected="${isActive}"
                aria-label="${escapeAttr(t.label)}">
          ${svg(t.icon, 13, 2.2)}
          <span>${escapeHTML(t.label)}</span>
          ${count != null ? `<span class="top-tab-badge">${count}</span>` : ''}
        </button>
      `;
    }).join('');

    bar.querySelectorAll('[data-top-tab]').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.topTab));
    });
  }

  // ═══════════════════════════════════════════════════════════
  // SIDEBAR
  // ═══════════════════════════════════════════════════════════

  function renderSidebar() {
    const body = $('sidebarBody');
    const brand = $('sidebarBrand');
    if (!body) return;

    if (brand && S.project) {
      const icon = S.project.iconUrl
        ? `<img src="${escapeAttr(S.project.iconUrl)}" alt="">`
        : `<span style="background:${getAvatarColor(S.project.name)};color:#0a0c10;">${escapeHTML(getInitials(S.project.name))}</span>`;
      brand.innerHTML = `
        <div class="sidebar-brand-icon project-icon-box">${icon}</div>
        <div class="sidebar-brand-text">
          <div class="sidebar-brand-name">${escapeHTML(S.project.name || 'Untitled')}</div>
          <div class="sidebar-brand-slug">${escapeHTML(S.project.slug ? '@' + S.project.slug : S.pid.slice(-8))}</div>
        </div>
      `;
    }

    body.innerHTML = '';
    const section = document.createElement('div');
    section.className = 'sidebar-section';
    const title = document.createElement('div');
    title.className = 'sidebar-section-title';
    title.textContent = 'Sections';
    section.appendChild(title);

    S.tabs.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'sidebar-tab' + (t.id === S.activeTab ? ' active' : '');
      btn.type = 'button';
      const badge = t.countKey && S.tabCounts[t.countKey] != null
        ? `<span class="sidebar-tab-badge">${S.tabCounts[t.countKey]}</span>` : '';
      btn.innerHTML = svg(t.icon, 13, 2.2) + `<span>${escapeHTML(t.label)}</span>` + badge;
      btn.addEventListener('click', () => { switchTab(t.id); closeSidebar(); });
      section.appendChild(btn);
    });
    body.appendChild(section);
  }

  function openSidebar() { $('sidebar').classList.add('open'); $('sidebarBackdrop').classList.add('open'); }
  function closeSidebar() { $('sidebar').classList.remove('open'); $('sidebarBackdrop').classList.remove('open'); }

  function switchTab(tabId) {
    if (!S.tabs.some(t => t.id === tabId)) return;
    S.activeTab = tabId;
    setHashTab(tabId);
    saveLastTab(tabId);
    renderSidebar();
    renderTopTabs();
    renderPanel();

    const activeBtn = document.querySelector(`[data-top-tab="${tabId}"]`);
    activeBtn?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

    setTimeout(() => {
      const main = $('mainContent');
      if (main) main.scrollTo({ top: 0, behavior: 'smooth' });
    }, 20);
  }

  // ═══════════════════════════════════════════════════════════
  // PANEL ROUTER
  // ═══════════════════════════════════════════════════════════

  function renderPanel() {
    const inner = $('contentInner');
    const tab = S.activeTab;
    inner.innerHTML = `<div class="panel active" id="panel-${tab}"></div>`;
    const panel = $('panel-' + tab);
    const loaders = {
      overview: renderOverviewPanel,
      files: renderFilesPanel,
      deployments: renderDeploymentsPanel,
      commits: renderCommitsPanel,
      analytics: renderAnalyticsPanel,
      sharing: renderSharingPanel,
      data: renderDataPanel,
      notes: renderNotesPanel,
      logs: renderLogsPanel,
      downloads: renderDownloadsPanel,
      download: renderDownloadSharedPanel,
      danger: renderDangerPanel,
    };
    const loader = loaders[tab];
    if (loader) {
      try {
        const r = loader(panel);
        if (r && r.catch) r.catch(err => {
          console.error('[Panel]', tab, err);
          panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('alertCircle', 'Panel failed to load', String(err?.message || err))}</div></div>`;
        });
      } catch (err) {
        console.error('[Panel sync]', tab, err);
      }
    }
  }

  function skeletonCard(lines = 3) {
    let html = '<div class="card"><div class="card-body">';
    html += '<div class="skeleton sk-title"></div>';
    for (let i = 0; i < lines; i++) html += `<div class="skeleton sk-line" style="width:${60 + Math.random() * 35}%;"></div>`;
    html += '</div></div>';
    return html;
  }

  function emptyState(icon, title, desc, actionHtml = '') {
    return `<div class="empty-state">
      <div class="empty-state-icon">${svg(icon, 18, 2)}</div>
      <div class="empty-state-title">${escapeHTML(title)}</div>
      <div class="empty-state-desc">${escapeHTML(desc)}</div>
      ${actionHtml}
    </div>`;
  }

  // ═══════════════════════════════════════════════════════════
  // DEPLOY STATE / ANALYTICS / NOTIFS / LOGS CACHE
  // ═══════════════════════════════════════════════════════════

  async function loadDeployState() {
    if (!S.online || S.isLocalOnly || S.syncState !== 'synced') return;
    try {
      const res = await apiFetch(API_HOST + '?action=status&pid=' + encodeURIComponent(S.pid));
      if (res.ok && res.data?.success) {
        S.deployState = res.data.deployment;
        if (S.deployState) {
          S.project.deployment = S.deployState;
          updateHeader();
        }
      }
    } catch {}
  }

  async function loadAnalytics({ force = false } = {}) {
    if (!S.session || !S.online || S.isLocalOnly) return null;
    const now = Date.now();
    if (!force && S.analyticsCache && (now - S.analyticsCache.at) < ANALYTICS_CACHE_TTL) {
      return S.analyticsCache.data;
    }
    try {
      const res = await apiFetch(API_ANALYTICS + '?action=project&pid=' + encodeURIComponent(S.pid));
      if (res.ok && res.data?.success) {
        S.analyticsCache = { data: res.data, at: now };
        return res.data;
      }
    } catch {}
    return null;
  }

  async function loadNotificationStats({ force = false } = {}) {
    if (!S.session || !S.online) return null;
    if (!force && S.notifStats) return S.notifStats;
    try {
      const res = await apiFetch(API_NOTIFY + '?action=stats');
      if (res.ok && res.data?.success && res.data.stats) {
        S.notifStats = res.data.stats;
        updateBellBadge(S.notifStats.unread || 0);
        return S.notifStats;
      }
    } catch {}
    return null;
  }

  function updateBellBadge(count) {
    const badge = $('bellBadge');
    if (!badge) return;
    if (count > 0) {
      badge.textContent = count > 99 ? '99+' : String(count);
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  async function loadLogs({ force = false } = {}) {
    if (!S.session || !S.online) return null;
    if (!force && S.logsData) return S.logsData;
    try {
      const res = await apiFetch(API_HOST + '?action=logs&pid=' + encodeURIComponent(S.pid) + '&limit=10');
      if (res.ok && res.data?.success) {
        S.logsData = res.data;
        return res.data;
      }
    } catch {}
    return null;
  }

  // ═══════════════════════════════════════════════════════════
  // PROMOTE LOCAL → SERVER
  // ═══════════════════════════════════════════════════════════

  async function promoteLocalProject() {
    if (!S.session) {
      window.location.href = '/register?next=' + encodeURIComponent(location.pathname + location.search);
      return;
    }
    if (!S.isLocalOnly) { toast('Already on server', 'info'); return; }
    if (!S.online) { toast('Requires internet', 'warning'); return; }

    showLoading('Syncing project', 'Creating server project…');
    try {
      const createRes = await apiFetch(API_HOST + '?action=projects/create', {
        method: 'POST',
        body: JSON.stringify({
          name: S.project.name || 'Imported project',
          description: S.project.description || '',
        }),
      });
      if (!createRes.ok || !createRes.data?.success) throw new Error(createRes.data?.error || 'Create failed');
      const newPid = createRes.data.pid;

      const files = await IDB.listFiles(S.pid);
      const versions = await IDB.listVersions(S.pid);
      const fileMap = {};
      for (const f of files) {
        if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
        fileMap[f.path] = f.content || '';
      }

      setLoadingDesc(`Uploading ${Object.keys(fileMap).length} file${Object.keys(fileMap).length === 1 ? '' : 's'}…`);
      const syncRes = await apiFetch(API_HOST + '?action=project/sync-back', {
        method: 'POST',
        body: JSON.stringify({
          pid: newPid,
          files: fileMap,
          versions: versions.length ? Object.fromEntries(
            versions.map(v => [v.vid, { message: v.message || '', files: v.files || {}, createdAt: v.createdAt }])
          ) : null,
        }),
      });
      if (!syncRes.ok || !syncRes.data?.success) throw new Error(syncRes.data?.error || 'Sync failed');

      const project = {
        pid: newPid,
        name: S.project.name || 'Imported project',
        slug: createRes.data.project?.slug || S.project.slug || '',
        description: S.project.description || '',
        iconUrl: S.project.iconUrl || null,
        createdAt: S.project.createdAt || Date.now(),
        updatedAt: Date.now(),
        storageLimit: S.project.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT,
        myRole: 'owner',
        _server: true,
      };
      await IDB.putProject(project);
      for (const f of files) await IDB.putFile(newPid, f.path, f.content);
      for (const v of versions) await IDB.putVersion({ ...v, pid: newPid });
      await IDB.deleteProject(S.pid);

      try {
        if (localStorage.getItem(STORAGE.lastProject) === S.pid) {
          localStorage.setItem(STORAGE.lastProject, newPid);
        }
      } catch {}

      hideLoading();
      toast('Project synced to your account', 'success');
      setTimeout(() => {
        window.location.href = '/project?pid=' + encodeURIComponent(newPid);
      }, 400);
    } catch (err) {
      hideLoading();
      toast(err.message || 'Sync failed', 'error');
    }
  }

  async function pushOrphanToServer() {
    if (!S.session) {
      window.location.href = '/register?next=' + encodeURIComponent(location.pathname + location.search);
      return;
    }
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    if (S.syncState !== 'orphan') { toast('Nothing to push', 'info'); return; }

    const oldPid = S.pid;
    showLoading('Pushing to server', 'Creating project…');

    try {
      const create = await apiFetch(API_HOST + '?action=projects/create', {
        method: 'POST',
        body: JSON.stringify({
          name: S.project.name || 'Untitled project',
          description: S.project.description || '',
        }),
      });
      if (!create.ok || !create.data?.success) throw new Error(create.data?.error || 'Create failed');
      const newPid = create.data.pid;

      const files = await IDB.listFiles(oldPid);
      const fileMap = {};
      for (const f of files) {
        if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
        if (typeof f.content === 'string') fileMap[f.path] = f.content;
      }
      if (Object.keys(fileMap).length === 0) throw new Error('No files to push');

      setLoadingDesc(`Uploading ${Object.keys(fileMap).length} files…`);
      const sync = await apiFetch(API_HOST + '?action=project/sync-back', {
        method: 'POST',
        body: JSON.stringify({ pid: newPid, files: fileMap }),
      });
      if (!sync.ok || !sync.data?.success) throw new Error(sync.data?.error || 'Sync failed');

      const versions = await IDB.listVersions(oldPid);
      if (versions.length > 0) {
        const vMap = Object.fromEntries(versions.map(v => [
          v.vid,
          { message: v.message || '', files: v.files || {}, createdAt: v.createdAt },
        ]));
        await apiFetch(API_HOST + '?action=project/sync-back', {
          method: 'POST',
          body: JSON.stringify({ pid: newPid, versions: vMap }),
        }).catch(() => {});
      }

      for (const f of files) await IDB.putFile(newPid, f.path, f.content);
      await IDB.putProject({
        ...S.project,
        pid: newPid,
        myRole: 'owner',
        _server: true,
        updatedAt: Date.now(),
      });
      await IDB.deleteProject(oldPid);

      hideLoading();
      toast('Project pushed to server', 'success');
      setTimeout(() => {
        window.location.href = '/project?pid=' + encodeURIComponent(newPid);
      }, 400);
    } catch (err) {
      hideLoading();
      toast(err.message || 'Push failed', 'error', 5000);
    }
  }

  // ═══════════════════════════════════════════════════════════
  // HELPERS — normalize project
  // ═══════════════════════════════════════════════════════════

  function normalizeServerProject(p) {
    return {
      pid: p.pid,
      name: p.name || 'Untitled project',
      slug: p.slug || '',
      description: p.description || '',
      iconUrl: p.iconUrl || null,
      primaryFile: p.primaryFile || null,
      createdAt: p.createdAt ? new Date(p.createdAt).getTime() : Date.now(),
      updatedAt: p.updatedAt ? new Date(p.updatedAt).getTime() : Date.now(),
      storageLimit: p.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT,
      deployment: p.deployment || null,
      metaTags: p.metaTags || {},
      myRole: p.myRole || 'viewer',
      _server: true,
    };
  }

  // ═══════════════════════════════════════════════════════════
  // HELPERS — HTML file list
  // ═══════════════════════════════════════════════════════════

  function getHtmlFiles(files) {
    return files
      .filter(f => /\.html?$/i.test(f.path) && !isSystemFile(f.path))
      .map(f => f.path)
      .sort((a, b) => {
        const aIdx = a === 'index.html' ? 0 : 1;
        const bIdx = b === 'index.html' ? 0 : 1;
        if (aIdx !== bIdx) return aIdx - bIdx;
        return a.localeCompare(b);
      });
  }

  function buildLiveUrl(base, path) {
    const clean = String(base || '').replace(/\/$/, '');
    if (!path || path === 'index.html') return clean;
    return clean + '/' + path.replace(/^\//, '');
  }

  // ═══════════════════════════════════════════════════════════
  // HELPERS — Notes
  // ═══════════════════════════════════════════════════════════

  async function readNotes() {
    try {
      const file = await IDB.getFile(S.pid, NOTES_PATH);
      if (!file || !file.content) return { version: 1, notes: [] };
      const parsed = JSON.parse(file.content);
      if (!parsed || !Array.isArray(parsed.notes)) return { version: 1, notes: [] };
      return { version: parsed.version || 1, notes: parsed.notes };
    } catch {
      return { version: 1, notes: [] };
    }
  }

  async function writeNotes(data) {
    if (data.notes.length > NOTES_MAX_COUNT) {
      throw new Error(`Too many notes (max ${NOTES_MAX_COUNT}).`);
    }
    for (const n of data.notes) {
      if (estimateBytes(n.body || '') > NOTES_MAX_BODY_BYTES) {
        throw new Error(`Note "${n.title || 'Untitled'}" exceeds ${formatBytes(NOTES_MAX_BODY_BYTES)}.`);
      }
    }
    const json = JSON.stringify(data, null, 2);
    await IDB.putFile(S.pid, NOTES_PATH, json);
    try {
      const project = await IDB.getProject(S.pid);
      if (project) { project.updatedAt = Date.now(); await IDB.putProject(project); }
    } catch {}
    if (S.online && S.session && !S.isLocalOnly) {
      apiFetch(API_HOST + '?action=project/sync-back', {
        method: 'POST',
        body: JSON.stringify({ pid: S.pid, files: { [NOTES_PATH]: json } }),
      }).catch(() => {});
    }
  }

  async function renderNotesPanel(panel) {
    if (!S.isEditor) {
      panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('lock', 'Owner or editor only', 'You don\'t have permission to view notes.')}</div></div>`;
      return;
    }
    panel.innerHTML = skeletonCard(3);

    const data = await readNotes();
    const sorted = [...data.notes].sort((a, b) => {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });

    S.tabCounts.notes = sorted.length;
    renderTopTabs();
    renderSidebar();

    if (sorted.length === 0) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('file-text', 'No notes yet', 'Jot down ideas, snippets, or TODOs.',
          `<button class="btn btn-primary btn-sm" id="btnNewNote" style="margin-top:8px;">${svg('plus', 12, 2.4)} New note</button>`)}
      </div></div>`;
      $('btnNewNote')?.addEventListener('click', () => openNoteEditor(null));
      return;
    }

    panel.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="card-title">${svg('file-text', 13, 2.2)} Notes (${sorted.length})</div>
          <button class="btn btn-sm btn-primary" id="btnNewNote">${svg('plus', 10, 2.4)} New note</button>
        </div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:6px;">
          ${sorted.map(note => `
            <button class="note-card" data-note-id="${escapeAttr(note.id)}" type="button" style="--note-accent:${noteAccentColor(note.color)};">
              <div class="note-card-title">${escapeHTML(note.title || 'Untitled')}</div>
              <div class="note-card-preview">${escapeHTML((note.body || '').slice(0, 140) || 'Empty note')}</div>
              <div class="note-card-meta">
                ${note.pinned ? `<span class="note-pin">${svg('bookmark', 9, 2.4)}</span>` : ''}
                <span>${timeAgo(note.updatedAt || note.createdAt || 0)}</span>
              </div>
            </button>
          `).join('')}
        </div>
      </div>
    `;

    panel.querySelectorAll('[data-note-id]').forEach(btn => {
      btn.addEventListener('click', () => openNoteEditor(btn.dataset.noteId));
    });
    $('btnNewNote')?.addEventListener('click', () => openNoteEditor(null));
  }

  async function openNoteEditor(noteId) {
    const data = await readNotes();
    const existing = noteId ? data.notes.find(n => n.id === noteId) : null;
    const note = existing || {
      id: `n_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
      title: '',
      body: '',
      color: 'amber',
      pinned: false,
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };

    const overlay = document.createElement('div');
    overlay.className = 'note-editor-overlay';
    overlay.innerHTML = `
      <div class="note-editor-header">
        <button class="note-editor-back" type="button" aria-label="Back">${svg('arrow-left', 16, 2.4)}</button>
        <input class="note-editor-title" type="text" placeholder="Note title" maxlength="120" value="${escapeAttr(note.title || '')}">
        <div class="note-editor-actions">
          <button class="note-editor-action ${note.pinned ? 'active' : ''}" data-act="pin" type="button" aria-label="Pin">${svg('bookmark', 14, 2.2)}</button>
          <button class="note-editor-action" data-act="color" type="button" aria-label="Color" style="color:${noteAccentColor(note.color)}">${svg('droplet', 14, 2.2)}</button>
          ${existing ? `<button class="note-editor-action danger" data-act="delete" type="button" aria-label="Delete">${svg('trash', 14, 2.2)}</button>` : ''}
        </div>
      </div>
      <textarea class="note-editor-body" placeholder="Start writing…" spellcheck="false">${escapeHTML(note.body || '')}</textarea>
      <div class="note-editor-status">
        <span class="note-editor-words">0 words</span>
        <span class="note-editor-save">Saved</span>
      </div>
    `;

    const titleEl = overlay.querySelector('.note-editor-title');
    const bodyEl = overlay.querySelector('.note-editor-body');
    const wordsEl = overlay.querySelector('.note-editor-words');
    const saveEl = overlay.querySelector('.note-editor-save');

    function updateWords() {
      const words = (bodyEl.value.trim().match(/\S+/g) || []).length;
      wordsEl.textContent = `${words} word${words === 1 ? '' : 's'}`;
    }
    updateWords();

    let autosaveTimer = null;
    let dirty = false;
    let isDeleted = false;

    function markDirty() {
      if (!dirty) {
        dirty = true;
        saveEl.textContent = 'Editing…';
        saveEl.classList.add('dirty');
      }
      if (autosaveTimer) clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(doSave, 800);
    }

    async function doSave() {
      if (!dirty || isDeleted) return;
      try {
        if (!note.title.trim()) {
          const m = bodyEl.value.match(/^#\s+(.+)$/m);
          if (m) {
            note.title = m[1].trim().slice(0, 120);
            titleEl.value = note.title;
          }
        }
        note.title = titleEl.value.trim();
        note.body = bodyEl.value;
        note.updatedAt = Date.now();

        const fresh = await readNotes();
        const idx = fresh.notes.findIndex(n => n.id === note.id);
        if (idx >= 0) fresh.notes[idx] = note;
        else fresh.notes.push(note);

        await writeNotes(fresh);
        dirty = false;
        saveEl.textContent = 'Saved';
        saveEl.classList.remove('dirty');

        if (S.activeTab === 'notes') renderPanel();
      } catch (err) {
        saveEl.textContent = 'Save failed';
        saveEl.classList.add('error');
        toast(err.message || "Couldn't save note", 'error', 4000);
      }
    }

    function teardown() {
      if (autosaveTimer) clearTimeout(autosaveTimer);
      overlay.classList.remove('open');
      setTimeout(() => overlay.remove(), 320);
    }

    async function closeMe() {
      if (dirty && !isDeleted) await doSave();
      teardown();
    }

    async function deleteMe() {
      confirmModal('Delete this note?', "This can't be undone.", 'Delete', true, async () => {
        isDeleted = true;
        const fresh = await readNotes();
        fresh.notes = fresh.notes.filter(n => n.id !== note.id);
        await writeNotes(fresh);
        toast('Note deleted', 'info');
        teardown();
        if (S.activeTab === 'notes') renderPanel();
      });
    }

    overlay.querySelector('.note-editor-back').addEventListener('click', closeMe);
    titleEl.addEventListener('input', () => { note.title = titleEl.value; markDirty(); });
    bodyEl.addEventListener('input', () => { note.body = bodyEl.value; updateWords(); markDirty(); });

    overlay.querySelector('[data-act="pin"]')?.addEventListener('click', (e) => {
      note.pinned = !note.pinned;
      e.currentTarget.classList.toggle('active', note.pinned);
      markDirty();
    });

    overlay.querySelector('[data-act="color"]')?.addEventListener('click', (e) => {
      const existing = overlay.querySelector('.note-color-popover');
      if (existing) { existing.remove(); return; }
      const pop = document.createElement('div');
      pop.className = 'note-color-popover';
      Object.entries(NOTE_COLORS).forEach(([name, hex]) => {
        const sw = document.createElement('button');
        sw.className = 'note-color-swatch' + (note.color === name ? ' active' : '');
        sw.type = 'button';
        sw.style.background = hex;
        sw.setAttribute('aria-label', name);
        sw.addEventListener('click', () => {
          note.color = name;
          e.currentTarget.style.color = hex;
          markDirty();
          pop.remove();
        });
        pop.appendChild(sw);
      });
      const rect = e.currentTarget.getBoundingClientRect();
      pop.style.top = (rect.bottom + 4) + 'px';
      pop.style.right = (window.innerWidth - rect.right) + 'px';
      document.body.appendChild(pop);
      setTimeout(() => {
        document.addEventListener('click', function handler(ev) {
          if (!pop.contains(ev.target) && ev.target !== e.currentTarget) {
            pop.remove();
            document.removeEventListener('click', handler);
          }
        });
      }, 50);
    });

    overlay.querySelector('[data-act="delete"]')?.addEventListener('click', deleteMe);

    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('open'));
    setTimeout(() => {
      if (!note.title) titleEl.focus();
      else bodyEl.focus();
    }, 100);

    // Escape closes
    const escHandler = (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeMe();
        document.removeEventListener('keydown', escHandler);
      }
    };
    document.addEventListener('keydown', escHandler);
  }

  function computeHealth({ syncState, deployed, isOffline, storagePct, todayCount, totalCount, deployAge }) {
    const items = [];
    const issues = [];

    if (syncState === 'synced') {
      items.push({ ok: true, label: 'Synced to server' });
    } else if (syncState === 'local') {
      items.push({ ok: false, label: 'Not synced (local only)' });
      issues.push('sync');
    } else if (syncState === 'orphan') {
      items.push({ ok: false, label: 'Not on server' });
      issues.push('orphan');
    } else if (syncState === 'cached') {
      items.push({ ok: false, label: 'Cached (offline)' });
      issues.push('offline');
    } else {
      items.push({ ok: false, label: 'Sync unknown' });
    }

    if (deployed && !isOffline) {
      items.push({ ok: true, label: 'Live' });
    } else if (isOffline) {
      items.push({ ok: false, label: 'Deployment offline' });
      issues.push('deploy');
    } else {
      items.push({ ok: false, label: 'Not deployed' });
      issues.push('deploy');
    }

    if (storagePct > 90) {
      items.push({ ok: false, label: `Storage ${Math.round(storagePct)}%` });
      issues.push('storage');
    } else if (storagePct > 70) {
      items.push({ ok: false, label: `Storage ${Math.round(storagePct)}%` });
      issues.push('storage-warn');
    } else {
      items.push({ ok: true, label: `Storage ${Math.round(storagePct)}%` });
    }

    if (deployAge != null) {
      items.push({ ok: true, label: `Deployed ${timeAgo(Date.now() - deployAge)}` });
    }

    if (totalCount > 0 && todayCount === 0) {
      items.push({ ok: true, label: `${formatNumber(totalCount)} visits total` });
    } else if (todayCount > 0) {
      items.push({ ok: true, label: `${formatNumber(todayCount)} today` });
    }

    let level = 'healthy';
    if (issues.includes('storage') || issues.includes('orphan')) level = 'critical';
    else if (issues.length > 0) level = 'warning';

    const label = level === 'healthy' ? 'Healthy' : level === 'warning' ? 'Attention' : 'Issues';

    return { level, label, items };
  }

  function logIconFor(type) {
    return {
      deploy: 'rocket', project: 'info', invite: 'user',
      version: 'git-commit', db: 'database', file: 'file',
    }[type] || 'info';
  }

  function shouldShowNotifBanner() {
    if (!S.session) return false;
    if (!('Notification' in window)) return false;
    if (Notification.permission !== 'default') return false;
    try {

    } catch {}

  }

  async function enableNotifications() {

      if (window.FOLIO?.fcm?.subscribe) {

  function wireMetaTagsForm(panel) {
    const toggle = panel.querySelector('[data-meta-toggle]');
    const body = panel.querySelector('#metaBody');
    if (toggle && body) {
      toggle.addEventListener('click', () => {
        body.classList.toggle('hidden');
        const icon = toggle.querySelector('.meta-toggle-icon');
        if (icon) icon.style.transform = body.classList.contains('hidden') ? '' : 'rotate(180deg)';
      });
    }

    const saveBtn = panel.querySelector('#btnSaveMeta');
    if (!saveBtn) return;
    saveBtn.addEventListener('click', async () => {
      const fields = panel.querySelectorAll('[data-meta-field]');
      const metaTags = {};
      fields.forEach(f => {
        const k = f.dataset.metaField;
        const v = String(f.value || '').trim();
        if (k === 'ogImage') {
          if (v && !/^https:\/\//.test(v)) {
            toast('OG image must be HTTPS', 'error');
            throw new Error('invalid');
          }
          metaTags[k] = v || null;
        } else {
          metaTags[k] = v;
        }
      });
      saveBtn.disabled = true;
      const prev = saveBtn.innerHTML;
      saveBtn.innerHTML = 'Saving…';
      try {
        const res = await apiFetch(API_HOST + '?action=metatags/save', {
          method: 'POST',
          body: JSON.stringify({ pid: S.pid, metaTags }),
        });
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Save failed');
        S.project.metaTags = metaTags;
        await IDB.putProject({ ...(await IDB.getProject(S.pid)), metaTags });
        toast('Meta tags saved', 'success');
      } catch (err) {
        toast(err.message || 'Save failed', 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = prev;
      }
    });
  }

          <input class="input" id="editProjectName" maxlength="100" value="${escapeAttr(state.name)}">
        </div>
        <div class="field">
          <label class="field-label">Description</label>
          <textarea class="textarea" id="editProjectDesc" maxlength="500">${escapeHTML(state.description)}</textarea>
        </div>
        <div class="field">
          <label class="field-label">Primary file (for previews)</label>
          <select class="select" id="editProjectPrimary">
            <option value="">Auto-detect</option>
            ${htmlFiles.map(f => `<option value="${escapeAttr(f)}" ${state.primaryFile === f ? 'selected' : ''}>${escapeHTML(f)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field-label">Slug</label>
          <div style="display:flex;gap:5px;">
            <input class="input mono" value="${escapeAttr(p.slug || '')}" readonly>
            <button class="btn btn-secondary btn-icon" data-copy-text="${escapeAttr(p.slug || '')}" type="button" aria-label="Copy slug">${svg('copy', 12, 2.2)}</button>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Project ID</label>
          <div style="display:flex;gap:5px;">
            <input class="input mono" value="${escapeAttr(S.pid)}" readonly>
            <button class="btn btn-secondary btn-icon" data-copy-text="${escapeAttr(S.pid)}" type="button" aria-label="Copy ID">${svg('copy', 12, 2.2)}</button>
          </div>
        </div>

        <div class="edit-project-footer">
          <button class="btn btn-secondary" id="editProjectCancel" type="button">Cancel</button>
          <button class="btn btn-primary" id="editProjectSave" type="button" disabled>${svg('check', 10, 2.4)} Save</button>
        </div>
      </div>
    `);

    const saveBtn = $('editProjectSave');
    const nameInput = $('editProjectName');
    const descInput = $('editProjectDesc');
    const primarySelect = $('editProjectPrimary');

    function checkDirty() {
      const changed =
        nameInput.value.trim() !== (p.name || '') ||
        descInput.value.trim() !== (p.description || '') ||
        (primarySelect.value || '') !== (p.primaryFile || '') ||
        state.iconUrl !== (p.iconUrl || null);
      saveBtn.disabled = !changed || !nameInput.value.trim();
    }
    nameInput.addEventListener('input', checkDirty);
    descInput.addEventListener('input', checkDirty);
    primarySelect.addEventListener('change', checkDirty);

    // Copy buttons
    document.querySelectorAll('[data-copy-text]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (copyToClipboard(btn.dataset.copyText)) toast('Copied', 'success', 1200);
        else toast('Copy failed', 'error');
      });
    });

    // Icon change
    $('btnChangeProjectIcon')?.addEventListener('click', () => {
      openIconPicker(async (newUrl) => {
        state.iconUrl = newUrl;
        const el = $('editProjectIcon');
        if (el) {
          el.innerHTML = newUrl
            ? `<img src="${escapeAttr(newUrl)}" alt="">`
            : `<span style="background:${getAvatarColor(nameInput.value)};color:#0a0c10;">${escapeHTML(getInitials(nameInput.value))}</span>`;
        }
        checkDirty();
      });
    });

    $('editProjectCancel')?.addEventListener('click', () => {
      if (saveBtn.disabled) { closeModal(); return; }
      confirmModal('Discard changes?', 'Your edits will not be saved.', 'Discard', true, closeModal);
    });

    saveBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const description = descInput.value.trim();
      const primaryFile = primarySelect.value || null;
      if (!name) { toast('Name required', 'error'); return; }
      saveBtn.disabled = true;
      const prev = saveBtn.innerHTML;
      saveBtn.innerHTML = 'Saving…';
      try {
        if (S.session && S.online && !S.isLocalOnly && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=projects/update', {
            method: 'POST',
            body: JSON.stringify({
              pid: S.pid,
              name,
              description,
              iconUrl: state.iconUrl,
            }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Save failed');

          // Sync meta tags if title/description changed
          const metaTags = { ...(S.project.metaTags || {}) };
          if (metaTags.title !== name) metaTags.title = name;
          if (metaTags.description !== description) metaTags.description = description;
          await apiFetch(API_HOST + '?action=metatags/save', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, metaTags }),
          }).catch(() => {});
          S.project.metaTags = metaTags;
        }

        // Update local project
        S.project.name = name;
        S.project.description = description;
        S.project.iconUrl = state.iconUrl;
        S.project.primaryFile = primaryFile;
        S.project.updatedAt = Date.now();

        await IDB.putProject({
          pid: S.pid,
          name,
          description,
          slug: S.project.slug || '',
          iconUrl: state.iconUrl,
          primaryFile,
          createdAt: S.project.createdAt || Date.now(),
          updatedAt: Date.now(),
          storageLimit: S.project.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT,
          myRole: S.project.myRole || 'owner',
          _server: S.project._server !== false,
        });
        cacheProject(S.project);

        closeModal();
        toast('Saved', 'success');
        updateHeader();
        updateProjectIcons();
        renderPanel();
      } catch (err) {
        toast(err.message || 'Save failed', 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = prev;
      }
    });
  }

    // Tab switching

        document.querySelectorAll('[data-icon-tab]').forEach(b => b.classList.remove('active'));

    // Load presets
    async function loadPresets(shuffle = false) {
      const grid = $('iconPickerGrid');
      if (!grid) return;
      grid.innerHTML = Array.from({ length: 5 }, () => '<div class="icon-skeleton"></div>').join('');
      try {
        const res = await fetch(API_FLIER + '?action=avatar/preview', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: (S.project.slug || 'project').replace(/[^a-z0-9]/gi, '').toLowerCase() + (shuffle ? Math.random().toString(36).slice(2, 6) : ''),
            displayName: S.project.name || 'Project',
          }),
        });
        const data = await res.json();
        if (!data.success || !Array.isArray(data.variants)) throw new Error('Failed');
        S.iconVariants = data.variants;
        grid.innerHTML = '';
        S.iconVariants.forEach(v => {
          const btn = document.createElement('button');
          btn.className = 'icon-option';
          btn.type = 'button';
          btn.innerHTML = `<img src="${escapeAttr(v.dataUrl)}" alt="${escapeAttr(v.label || '')}"><span class="icon-label">${escapeHTML(v.label || v.id)}</span>`;
          btn.addEventListener('click', () => {
            selectedUrl = v.dataUrl;
            grid.querySelectorAll('.icon-option').forEach(o => o.classList.remove('selected'));
            btn.classList.add('selected');

          grid.appendChild(btn);

    document.querySelectorAll('[data-color]').forEach(btn => {

        if (inp) inp.value = btn.dataset.color;

    // Generate custom
    $('iconCustomGenerate')?.addEventListener('click', async () => {
      const btn = $('iconCustomGenerate');
      btn.disabled = true;
      const prev = btn.innerHTML;
      btn.innerHTML = 'Generating…';
      try {
        const text = ($('iconCustomText').value || '').trim() || getInitials(S.project?.name || 'P');
        const primary = $('iconCustomColor').value.trim() || '#F59E0B';
        const accent = $('iconCustomAccent').value.trim() || '#f97316';

        const templateMap = {
          solid: 'hero-short',
          gradient: 'hero-short',
          pattern: 'random-lines-top',
          badge: 'image-badge-overlay',
          poster: 'poster-centered',
        };
        const template = templateMap[currentStyle] || 'hero-short';
        const background = currentStyle === 'solid'
          ? { type: 'solid', color: primary }
          : { type: 'gradient', from: primary, to: accent, angle: 135 };

        const res = await fetch(API_FLIER + '?action=avatar/custom', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${S.session}`,

            mode: 'preview', type: 'template', template, size: '512x512',
            data: {
              text: { headline: text },
              style: {
                variant: 'dark',
                pattern: currentStyle === 'pattern' ? 'dots' : 'none',
                colors: { primary, accent },
                background,
              },
              images: {},
            },
          }),
        });
        if (res.status === 429) {
          const retry = (await res.json().catch(() => ({})))?.retryAfter || 60;
          toast(`Rate limited — wait ${Math.ceil(retry / 60)} min`, 'warning', 4000);
          return;
        }
        const data = await res.json();
        if (!data.success || !data.preview) throw new Error(data.error || 'Generation failed');

      const status = $('iconUploadStatus');
      if (status) status.textContent = 'Uploading…';
      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = reject;
          r.readAsDataURL(file);
        });
        const res = await fetch(API_FLIER + '?action=avatar/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dataUrl, username: S.project.slug || 'project' }),

      }

    // Upload from URL
    $('iconUploadFromUrl')?.addEventListener('click', async () => {
      const url = $('iconUploadUrl').value.trim();
      if (!url || !/^https?:\/\//i.test(url)) { toast('Enter a valid HTTPS URL', 'error'); return; }
      const status = $('iconUploadStatus');
      if (status) status.textContent = 'Fetching…';
      try {
        const res = await fetch(url, { mode: 'cors' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const blob = await res.blob();
        if (!blob.type.startsWith('image/')) throw new Error('Not an image');
        if (blob.size > 1024 * 1024) throw new Error('Too large');
        const dataUrl = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = reject;
          r.readAsDataURL(blob);
        });
        const upRes = await fetch(API_FLIER + '?action=avatar/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dataUrl, username: S.project.slug || 'project' }),
        });
        const upData = await upRes.json();
        if (!upData.success || !upData.url) throw new Error(upData.error || 'Upload failed');
        selectedUrl = upData.url;
        if (status) status.textContent = 'Uploaded';
        updateSave();
        toast('Icon ready — click Save', 'success');
      } catch (err) {
        if (status) status.textContent = '';
        toast(err.message || 'Fetch failed', 'error', 4000);
      }
    });

    // Remove
    $('btnRemoveIcon')?.addEventListener('click', () => {
      confirmModal('Remove icon?', 'Project will show initials instead.', 'Remove', true, async () => {
        try {
          if (S.session && S.online && !S.isLocalOnly) {

    // Cancel / Save

    $('iconPickerSave')?.addEventListener('click', () => {
      if (!selectedUrl) return;
      closeModal();
      if (typeof onSelect === 'function') onSelect(selectedUrl);
    });
  }
