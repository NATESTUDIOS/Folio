<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Folio — Project</title>
<meta name="theme-color" content="#0a0c10" id="themeColorMeta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="robots" content="noindex">

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png" id="pageFavicon">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
(function(){
  try {
    var pref = localStorage.getItem('folio.theme') || 'dark';
    if (pref === 'light') document.documentElement.setAttribute('data-theme','light');
  } catch(e){}
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════
   THEME
   ═══════════════════════════════════════════════════════════ */
:root {
  --theme-primary: #F59E0B;
  --theme-primary-hover: #fbbf24;
  --theme-primary-glow: rgba(245, 158, 11, 0.40);
  --theme-primary-soft: rgba(245, 158, 11, 0.14);

  --theme-bg: #0a0c10;
  --theme-surface: #0f1218;
  --theme-surface-card: rgba(21, 25, 34, 0.72);
  --theme-surface-card-solid: #151922;
  --theme-surface-elevated: #1a1f2a;
  --theme-text: #e8ecf1;
  --theme-text-secondary: rgba(232, 236, 241, 0.72);
  --theme-text-tertiary: rgba(232, 236, 241, 0.44);

  --theme-glass-bg: rgba(255, 255, 255, 0.05);
  --theme-glass-border: rgba(255, 255, 255, 0.09);
  --theme-overlay: rgba(10, 12, 16, 0.85);
  --theme-card-border: rgba(255, 255, 255, 0.08);
  --theme-divider: rgba(255, 255, 255, 0.08);
  --input-bg: rgba(26, 31, 42, 0.88);

  --theme-success: #10B981;
  --theme-success-soft: rgba(16, 185, 129, 0.14);
  --theme-danger: #EF4444;
  --theme-danger-soft: rgba(239, 68, 68, 0.12);
  --theme-warning: #D97706;
  --theme-warning-soft: rgba(217, 119, 6, 0.14);
  --theme-info: #3B82F6;

  --bg-gradient-1: radial-gradient(circle at 50% -10%, rgba(245, 158, 11, 0.14) 0%, transparent 60%);
  --bg-gradient-2: radial-gradient(circle at 100% 100%, rgba(249, 115, 22, 0.10) 0%, transparent 55%);

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  --rail-w: 60px;
  --sidebar-w: 240px;
  --header-h: 48px;
  --bottom-nav-h: 56px;
  --content-max: 1080px;

  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, Monaco, monospace;
}

[data-theme="light"] {
  --theme-primary: #D97706;
  --theme-primary-hover: #B45309;
  --theme-primary-glow: rgba(217, 119, 6, 0.28);
  --theme-primary-soft: rgba(217, 119, 6, 0.10);
  --theme-bg: #f7f8fa;
  --theme-surface: #ffffff;
  --theme-surface-card: rgba(255, 255, 255, 0.85);
  --theme-surface-card-solid: #ffffff;
  --theme-surface-elevated: #ffffff;
  --theme-text: #121316;
  --theme-text-secondary: rgba(18, 19, 22, 0.72);
  --theme-text-tertiary: rgba(18, 19, 22, 0.48);
  --theme-glass-bg: rgba(255, 255, 255, 0.75);
  --theme-glass-border: rgba(0, 0, 0, 0.08);
  --theme-overlay: rgba(18, 19, 22, 0.55);
  --theme-card-border: rgba(0, 0, 0, 0.07);
  --theme-divider: rgba(0, 0, 0, 0.06);
  --input-bg: #ffffff;
  --theme-success: #059669;
  --theme-success-soft: rgba(5, 150, 105, 0.12);
  --theme-danger: #DC2626;
  --theme-danger-soft: rgba(220, 38, 38, 0.10);
  --theme-warning: #B45309;
  --theme-warning-soft: rgba(180, 83, 9, 0.10);
  --bg-gradient-1: radial-gradient(circle at 50% -10%, rgba(217, 119, 6, 0.08) 0%, transparent 60%);
  --bg-gradient-2: radial-gradient(circle at 100% 100%, rgba(249, 115, 22, 0.06) 0%, transparent 55%);
}

@media (max-width: 639px) {
  :root {
    --rail-w: 0px;
    --sidebar-w: 100vw;
    --header-h: 40px;
    --bottom-nav-h: 52px;
  }
  html, body { font-size: 12px; }
}

@media (min-width: 640px) and (max-width: 1023px) {
  :root {
    --rail-w: 52px;
    --header-h: 44px;
  }
}

/* ═══════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  width: 100%;
  background: var(--theme-bg);
  font-family: var(--font);
  color: var(--theme-text);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  overscroll-behavior: none;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; border: none; background: none; padding: 0; }
a { color: var(--theme-primary); text-decoration: none; }
svg { display: block; }
.hidden { display: none !important; }
.mono { font-family: var(--font-mono); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

:focus-visible {
  outline: 2px solid var(--theme-primary);
  outline-offset: 2px;
  border-radius: 6px;
}

/* ═══════════════════════════════════════════════════════════
   SHELL (grid rows: header / tabs / body)
   ═══════════════════════════════════════════════════════════ */
.app-shell {
  display: grid;
  grid-template-columns: var(--rail-w) 1fr;
  grid-template-rows: var(--header-h) auto 1fr;
  grid-template-areas:
    "rail header"
    "rail tabs"
    "rail body";
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

@media (max-width: 1023px) {
  .app-shell {
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "tabs"
      "body";
  }
}

/* ═══════════════════════════════════════════════════════════
   RAIL
   ═══════════════════════════════════════════════════════════ */
.rail {
  grid-area: rail;
  background: var(--theme-surface);
  border-right: 1px solid var(--theme-glass-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: calc(10px + var(--safe-top)) 0 calc(10px + var(--safe-bottom));
  overflow-y: auto;
  scrollbar-width: none;
  z-index: 30;
}
.rail::-webkit-scrollbar { display: none; }
@media (max-width: 1023px) { .rail { display: none; } }

.rail-top, .rail-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.rail-logo {
  width: 36px; height: 36px;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
  background: var(--theme-surface-elevated);
  border: 1px solid var(--theme-glass-border);
  display: flex; align-items: center; justify-content: center;
  color: var(--theme-primary);
}
.rail-logo img { width: 100%; height: 100%; object-fit: cover; }
.rail-logo svg { width: 18px; height: 18px; stroke-width: 2; }

.rail-item {
  width: 36px; height: 36px;
  border-radius: 9px;
  color: var(--theme-text-tertiary);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s var(--ease);
  position: relative;
  text-decoration: none;
}
.rail-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.rail-item:hover { color: var(--theme-text-secondary); background: var(--theme-glass-bg); }
.rail-item.active {
  color: var(--theme-primary);
  background: var(--theme-primary-soft);
}
.rail-item.active::before {
  content: '';
  position: absolute;
  left: -7px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 18px;
  border-radius: 0 3px 3px 0;
  background: var(--theme-primary);
}
.rail-divider { width: 22px; height: 1px; background: var(--theme-divider); margin: 5px 0; }

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
.header {
  grid-area: header;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  padding-left: calc(10px + var(--safe-left));
  padding-right: calc(10px + var(--safe-right));
  background: var(--theme-surface);
  border-bottom: 1px solid var(--theme-glass-border);
  position: relative;
  z-index: 20;
  min-width: 0;
}
@media (max-width: 639px) { .header { padding: 0 6px; gap: 4px; } }

.header-back-btn {
  width: 28px; height: 28px;
  border-radius: 7px;
  color: var(--theme-text-secondary);
  display: flex;
  align-items: center; justify-content: center;
  flex-shrink: 0;
  text-decoration: none;
  transition: all 0.15s var(--ease);
}
.header-back-btn:hover { background: var(--theme-glass-bg); color: var(--theme-text); }
.header-back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; }
@media (min-width: 1024px) { .header-back-btn { display: none; } }

.header-menu-btn {
  width: 28px; height: 28px;
  border-radius: 7px;
  color: var(--theme-text-secondary);
  display: none;
  align-items: center; justify-content: center;
  flex-shrink: 0;
}
.header-menu-btn:hover { background: var(--theme-glass-bg); color: var(--theme-text); }
.header-menu-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }
@media (max-width: 1023px) { .header-menu-btn { display: flex; } }

.header-left {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  flex: 1;
}

.header-project-icon {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--theme-surface-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-primary);
  font-weight: 800;
  font-size: 12px;
  border: 1px solid var(--theme-glass-border);
  position: relative;
}
.header-project-icon img { width: 100%; height: 100%; object-fit: cover; }
.header-project-icon .edit-icon-hint {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
  cursor: pointer;
  border-radius: inherit;
}
.header-project-icon:hover .edit-icon-hint { opacity: 1; }
.header-project-icon .edit-icon-hint svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.4; }

.header-title-wrap {
  min-width: 0;
  flex: 1;
  display: flex;
  align-items: baseline;
  gap: 6px;
  overflow: hidden;
}

.header-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--theme-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}
@media (max-width: 639px) { .header-title { font-size: 12px; } }

.header-sub {
  font-size: 10.5px;
  color: var(--theme-text-tertiary);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  flex-shrink: 0;
}

.header-role-badge {
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--theme-primary-soft);
  color: var(--theme-primary);
  font-size: 8.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.header-deploy-badge {
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--theme-success-soft);
  color: var(--theme-success);
  font-size: 8.5px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.header-deploy-badge .dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: currentColor;
}
.header-deploy-badge.offline {
  background: var(--theme-divider);
  color: var(--theme-text-tertiary);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}

.header-btn {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-text-secondary);
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  transition: all 0.15s var(--ease);
  flex-shrink: 0;
}
.header-btn:hover { color: var(--theme-text); border-color: var(--theme-primary-glow); }
.header-btn:active { transform: scale(0.94); }
.header-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; }
@media (max-width: 639px) {
  .header-btn { width: 26px; height: 26px; }
  .header-btn svg { width: 12px; height: 12px; }
}

/* ═══════════════════════════════════════════════════════════
   TOP TABS BAR (screen switcher — KOFA X pattern)
   ═══════════════════════════════════════════════════════════ */
.top-tabs-bar {
  grid-area: tabs;
  display: flex;
  align-items: center;
  gap: 20px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  width: 100%;
  padding: 0 12px;
  background: var(--theme-surface);
  border-bottom: 1px solid var(--theme-glass-border);
  z-index: 18;
  flex-shrink: 0;
  transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
}
.top-tabs-bar::-webkit-scrollbar { display: none; }
@media (min-width: 640px) { .top-tabs-bar { padding: 0 20px; gap: 24px; } }

.top-tab-btn {
  background: transparent;
  border: none;
  outline: none;
  padding: 12px 4px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  cursor: pointer;
  white-space: nowrap;
  position: relative;
  font-family: inherit;
  transition: color 0.2s var(--ease);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.top-tab-btn:hover { color: var(--theme-text); }
.top-tab-btn:active { transform: scale(0.96); }
.top-tab-btn.active {
  color: var(--theme-primary);
  font-weight: 800;
}
.top-tab-btn::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2.5px;
  background: var(--theme-primary);
  border-radius: 4px 4px 0 0;
  box-shadow: 0 -1px 8px var(--theme-primary-glow);
  transform: scaleX(0);
  transform-origin: center;
  transition: transform 0.25s var(--ease);
}
.top-tab-btn.active::after { transform: scaleX(1); }

.top-tab-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
  flex-shrink: 0;
}

.top-tab-badge {
  font-size: 9px;
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--theme-divider);
  color: var(--theme-text-tertiary);
  min-width: 16px;
  text-align: center;
  line-height: 1.4;
}
.top-tab-btn.active .top-tab-badge {
  background: var(--theme-primary);
  color: #0a0c10;
}

@media (max-width: 639px) {
  .top-tab-btn { font-size: 12px; padding: 11px 3px; }
  .top-tab-btn svg { width: 13px; height: 13px; }
}

/* Hide the old mobile pill row — top bar replaces it */
@media (max-width: 1023px) {
  .mobile-tabs-bar { display: none !important; }
}

/* Mode banner (local project / offline notice) */
.mode-banner {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--theme-warning-soft);
  border-bottom: 1px solid rgba(217, 119, 6, 0.25);
  color: var(--theme-warning);
  font-size: 10.5px;
  font-weight: 700;
  grid-column: 1 / -1;
}
.mode-banner.visible { display: flex; }
.mode-banner svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; flex-shrink: 0; }
.mode-banner .mb-text { flex: 1; line-height: 1.35; }
.mode-banner .mb-action {
  padding: 3px 8px;
  border-radius: 5px;
  background: var(--theme-warning);
  color: #0a0c10;
  font-size: 10px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  border: none;
}

/* ═══════════════════════════════════════════════════════════
   BODY
   ═══════════════════════════════════════════════════════════ */
.app-body {
  grid-area: body;
  display: flex;
  overflow: hidden;
  position: relative;
  min-height: 0;
}
@media (max-width: 1023px) {
  .app-body { padding-bottom: var(--bottom-nav-h); padding-bottom: calc(var(--bottom-nav-h) + var(--safe-bottom)); }
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--theme-surface);
  border-right: 1px solid var(--theme-glass-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
  transition: transform 0.28s var(--ease);
  z-index: 25;
}
@media (max-width: 1023px) {
  .sidebar {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: min(88vw, 300px);
    transform: translateX(-100%);
    box-shadow: 6px 0 40px rgba(0,0,0,0.35);
  }
  .sidebar.open { transform: translateX(0); }
}

.sidebar-backdrop {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(10, 12, 16, 0.6);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  z-index: 24;
}
@media (max-width: 1023px) {
  .sidebar-backdrop.open { display: block; }
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-bottom: 1px solid var(--theme-glass-border);
  flex-shrink: 0;
}
.sidebar-title {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--theme-text-tertiary);
}
.sidebar-close {
  width: 22px; height: 22px;
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  color: var(--theme-text-tertiary);
}
.sidebar-close:hover { color: var(--theme-text); background: var(--theme-glass-bg); }
.sidebar-close svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.4; }
@media (min-width: 1024px) { .sidebar-close { display: none; } }

.sidebar-body {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  padding: 6px;
  min-height: 0;
  overscroll-behavior: contain;
}
.sidebar-body::-webkit-scrollbar { width: 5px; }
.sidebar-body::-webkit-scrollbar-thumb { background: var(--theme-divider); border-radius: 3px; }

.sidebar-section {
  margin-bottom: 8px;
}

.sidebar-section-title {
  padding: 6px 8px 4px;
  font-size: 9.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--theme-text-tertiary);
}

.sidebar-tab {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 9px;
  border-radius: 7px;
  color: var(--theme-text-secondary);
  font-size: 11.5px;
  font-weight: 600;
  width: 100%;
  text-align: left;
  transition: all 0.15s var(--ease);
}
.sidebar-tab svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; flex-shrink: 0; }
.sidebar-tab:hover { color: var(--theme-text); background: var(--theme-glass-bg); }
.sidebar-tab.active {
  color: var(--theme-primary);
  background: var(--theme-primary-soft);
}
.sidebar-tab-badge {
  margin-left: auto;
  font-size: 9px;
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--theme-divider);
  color: var(--theme-text-tertiary);
}
.sidebar-tab.active .sidebar-tab-badge {
  background: var(--theme-primary);
  color: #0a0c10;
}

/* ── Main content ── */
.main-content {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  padding: 12px;
}
@media (min-width: 1024px) { .main-content { padding: 20px; } }
.main-content::-webkit-scrollbar { width: 6px; }
.main-content::-webkit-scrollbar-thumb { background: var(--theme-divider); border-radius: 3px; }

.content-inner {
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
}

/* ═══════════════════════════════════════════════════════════
   PANELS
   ═══════════════════════════════════════════════════════════ */
.panel {
  display: none;
  flex-direction: column;
  gap: 10px;
  animation: panelIn 0.25s var(--ease);
}
.panel.active { display: flex; }
@keyframes panelIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════════════════════════
   CARDS
   ═══════════════════════════════════════════════════════════ */
.card {
  background: var(--theme-surface-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--theme-card-border);
  border-radius: 12px;
  overflow: hidden;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--theme-divider);
}
.card-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--theme-text);
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-title svg { width: 13px; height: 13px; stroke: var(--theme-primary); fill: none; stroke-width: 2.2; }
.card-body { padding: 12px; }
.card-body.tight { padding: 8px 12px; }
.card-danger { border-color: rgba(239, 68, 68, 0.3); }
.card-danger .card-header { border-bottom-color: rgba(239, 68, 68, 0.2); }
.card-danger .card-title svg { stroke: var(--theme-danger); }

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
@media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }

.stat-tile {
  padding: 10px 12px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 9px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.stat-label {
  font-size: 9.5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.stat-value {
  font-size: 17px;
  font-weight: 800;
  color: var(--theme-text);
  letter-spacing: -0.4px;
  line-height: 1.1;
}
.stat-value.warn { color: var(--theme-warning); }
.stat-value.danger { color: var(--theme-danger); }
.stat-value.success { color: var(--theme-success); }
.stat-hint {
  font-size: 10px;
  color: var(--theme-text-tertiary);
  font-weight: 500;
}

/* ═══════════════════════════════════════════════════════════
   FILES PANEL (tree)
   ═══════════════════════════════════════════════════════════ */
.file-tree-wrap {
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 10px;
  padding: 6px;
}
.tree-node {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 6px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  color: var(--theme-text-secondary);
  transition: background 0.12s var(--ease);
  user-select: none;
}
.tree-node:hover { background: var(--theme-divider); color: var(--theme-text); }
.tree-node .chevron { width: 9px; height: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--theme-text-tertiary); transition: transform 0.15s; }
.tree-node.is-folder.expanded .chevron { transform: rotate(90deg); }
.tree-node .icon { width: 12px; height: 12px; flex-shrink: 0; }
.tree-node .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.tree-node .open-btn { opacity: 0.5; display: flex; align-items: center; justify-content: center; padding: 2px; border-radius: 3px; }
.tree-node .open-btn:hover { opacity: 1; background: var(--theme-glass-bg); }
.tree-node .open-btn svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.2; }

/* ═══════════════════════════════════════════════════════════
   FORMS
   ═══════════════════════════════════════════════════════════ */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field:last-child { margin-bottom: 0; }
.field-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.field-hint { font-size: 10px; color: var(--theme-text-tertiary); line-height: 1.4; }

.input, .textarea, .select {
  width: 100%;
  padding: 8px 10px;
  background: var(--input-bg);
  border: 1px solid var(--theme-card-border);
  border-radius: 7px;
  color: var(--theme-text);
  font-size: 12px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s var(--ease);
}
.input:focus, .textarea:focus, .select:focus { border-color: var(--theme-primary); }
.input::placeholder, .textarea::placeholder { color: var(--theme-text-tertiary); }
.textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
.select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; padding-right: 28px; }
.input.mono { font-family: var(--font-mono); font-size: 11px; }
.input[readonly] { opacity: 0.7; cursor: not-allowed; }
.input:disabled { opacity: 0.5; cursor: not-allowed; }

/* ═══════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 7px 12px;
  border-radius: 7px;
  font-size: 11.5px;
  font-weight: 700;
  border: 1px solid transparent;
  transition: all 0.15s var(--ease);
  white-space: nowrap;
  min-height: 30px;
  font-family: inherit;
  flex-shrink: 0;
}
.btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; flex-shrink: 0; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-primary { background: var(--theme-primary); color: #0a0c10; }
[data-theme="light"] .btn-primary { color: #ffffff; }
.btn-primary:hover:not(:disabled) { background: var(--theme-primary-hover); }

.btn-secondary { background: var(--theme-glass-bg); color: var(--theme-text); border-color: var(--theme-card-border); }
.btn-secondary:hover:not(:disabled) { background: var(--theme-surface-elevated); border-color: var(--theme-primary-glow); }

.btn-ghost { background: transparent; color: var(--theme-text-secondary); border-color: transparent; }
.btn-ghost:hover:not(:disabled) { color: var(--theme-text); background: var(--theme-glass-bg); }

.btn-danger { background: var(--theme-danger); color: #ffffff; }
.btn-danger:hover:not(:disabled) { background: #dc2626; }

.btn-outline-danger { background: transparent; color: var(--theme-danger); border-color: rgba(239, 68, 68, 0.3); }
.btn-outline-danger:hover:not(:disabled) { background: var(--theme-danger-soft); }

.btn-sm { padding: 4px 9px; font-size: 10.5px; min-height: 24px; border-radius: 6px; }
.btn-sm svg { width: 10px; height: 10px; }
.btn-block { width: 100%; }
.btn-icon { padding: 6px; min-width: 26px; }

/* ═══════════════════════════════════════════════════════════
   ROWS
   ═══════════════════════════════════════════════════════════ */
.row-list { display: flex; flex-direction: column; }
.row-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--theme-divider);
  transition: background 0.12s var(--ease);
}
.row-item:last-child { border-bottom: none; }
.row-item:hover { background: var(--theme-glass-bg); }

.row-icon {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  background: var(--theme-glass-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-text-secondary);
  flex-shrink: 0;
}
.row-icon svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.2; }

.row-content { flex: 1; min-width: 0; }
.row-title {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--theme-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.3;
  margin-bottom: 1px;
}
.row-sub {
  font-size: 10px;
  color: var(--theme-text-tertiary);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.row-actions { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }

/* ═══════════════════════════════════════════════════════════
   TOGGLE
   ═══════════════════════════════════════════════════════════ */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--theme-divider);
}
.toggle-row:last-child { border-bottom: none; }
.toggle-info { min-width: 0; flex: 1; }
.toggle-title { font-size: 11.5px; font-weight: 700; color: var(--theme-text); margin-bottom: 1px; }
.toggle-desc { font-size: 10px; color: var(--theme-text-tertiary); line-height: 1.4; }

.switch {
  position: relative;
  width: 36px;
  height: 21px;
  border-radius: 11px;
  background: var(--theme-divider);
  cursor: pointer;
  transition: background 0.2s var(--ease);
  flex-shrink: 0;
  border: none;
}
.switch::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #ffffff;
  transition: transform 0.22s var(--ease);
  box-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.switch.on { background: var(--theme-primary); }
.switch.on::after { transform: translateX(15px); }

/* ═══════════════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: var(--theme-overlay);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s var(--ease);
}
.modal-overlay.active { opacity: 1; pointer-events: all; }
@media (min-width: 640px) { .modal-overlay { align-items: center; padding: 20px; } }

.modal {
  background: var(--theme-surface-card-solid);
  border: 1px solid var(--theme-glass-border);
  border-radius: 20px 20px 0 0;
  padding: 16px 16px calc(16px + var(--safe-bottom));
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.28s var(--ease);
}
.modal-overlay.active .modal { transform: translateY(0); }
@media (min-width: 640px) {
  .modal {
    border-radius: 16px;
    max-width: 420px;
    padding: 20px;
    transform: scale(0.94);
  }
  .modal-overlay.active .modal { transform: scale(1); }
}

.modal-handle {
  width: 32px; height: 3px;
  border-radius: 2px;
  background: var(--theme-glass-border);
  margin: 0 auto 12px;
}
@media (min-width: 640px) { .modal-handle { display: none; } }

.modal-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--theme-text);
  letter-spacing: -0.2px;
  margin-bottom: 3px;
}
.modal-desc {
  font-size: 11.5px;
  color: var(--theme-text-secondary);
  line-height: 1.5;
  margin-bottom: 14px;
}
.modal-actions { display: flex; gap: 6px; margin-top: 16px; }
.modal-actions .btn { flex: 1; }

/* ═══════════════════════════════════════════════════════════
   SKELETONS
   ═══════════════════════════════════════════════════════════ */
.skeleton {
  background: linear-gradient(90deg, var(--theme-divider) 0%, var(--theme-glass-border) 50%, var(--theme-divider) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite linear;
  border-radius: 6px;
}
@keyframes shimmer {
  from { background-position: 200% 0; }
  to { background-position: -200% 0; }
}
.sk-line { height: 10px; margin-bottom: 5px; }
.sk-title { height: 14px; width: 60%; margin-bottom: 8px; }

/* ═══════════════════════════════════════════════════════════
   EMPTY STATE
   ═══════════════════════════════════════════════════════════ */
.empty-state {
  padding: 32px 16px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.empty-state-icon {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  background: var(--theme-glass-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-text-tertiary);
  margin-bottom: 3px;
}
.empty-state-icon svg { width: 18px; height: 18px; stroke-width: 2; }
.empty-state-title { font-size: 12px; font-weight: 700; color: var(--theme-text); }
.empty-state-desc { font-size: 10.5px; color: var(--theme-text-tertiary); line-height: 1.45; max-width: 300px; }

/* ═══════════════════════════════════════════════════════════
   LOADING
   ═══════════════════════════════════════════════════════════ */
.loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 800;
  background: var(--theme-overlay);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  padding: 20px;
}
.loading-overlay.active { display: flex; }
.loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--theme-primary-soft);
  border-top-color: var(--theme-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title { font-size: 13px; font-weight: 700; color: var(--theme-text); }
.loading-desc { font-size: 11.5px; color: var(--theme-text-secondary); text-align: center; max-width: 280px; line-height: 1.5; }

/* ═══════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════ */
.toast-container {
  position: fixed;
  bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 10px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  width: calc(100% - 20px);
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  pointer-events: none;
}
@media (min-width: 1024px) {
  .toast-container { left: auto; right: 16px; transform: none; bottom: 16px; }
}
.toast {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px;
  background: var(--theme-surface-card-solid);
  border: 1px solid var(--theme-card-border);
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--theme-text);
  transform: translateY(20px);
  opacity: 0;
  transition: all 0.28s var(--ease-spring);
  pointer-events: all;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  overflow-wrap: break-word;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast svg { width: 12px; height: 12px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2.2; }
.toast.success { color: var(--theme-success); }
.toast.error { color: var(--theme-danger); }
.toast.warning { color: var(--theme-warning); }
.toast.info { color: var(--theme-primary); }
.toast span { color: var(--theme-text); flex: 1; }

/* ═══════════════════════════════════════════════════════════
   ICON PICKER
   ═══════════════════════════════════════════════════════════ */
.icon-tabs {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--theme-glass-bg);
  border-radius: 8px;
  margin-bottom: 12px;
}
.icon-tab {
  flex: 1;
  padding: 6px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  transition: all 0.2s var(--ease);
  font-family: inherit;
  border: none;
  cursor: pointer;
}
.icon-tab.active {
  background: var(--theme-surface-elevated);
  color: var(--theme-text);
}

.icon-mode-panel { display: none; }
.icon-mode-panel.active { display: block; }

.icon-picker-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-top: 10px;
}
.icon-option {
  position: relative;
  aspect-ratio: 1;
  border-radius: 9px;
  background: var(--theme-surface-elevated);
  border: 2px solid transparent;
  overflow: hidden;
  transition: border-color 0.15s var(--ease), transform 0.12s var(--ease);
  cursor: pointer;
  padding: 0;
}
.icon-option:hover { transform: scale(1.04); }
.icon-option.selected {
  border-color: var(--theme-primary);
  box-shadow: 0 0 0 2px var(--theme-primary-soft);
}
.icon-option img { width: 100%; height: 100%; object-fit: cover; display: block; }
.icon-option .icon-label {
  position: absolute;
  bottom: 3px;
  left: 3px;
  right: 3px;
  font-size: 8px;
  font-weight: 800;
  color: #fff;
  background: rgba(0,0,0,0.6);
  border-radius: 4px;
  padding: 1px 4px;
  text-align: center;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  pointer-events: none;
}
.icon-skeleton {
  aspect-ratio: 1;
  border-radius: 9px;
  background: linear-gradient(90deg, var(--theme-divider) 0%, var(--theme-glass-border) 50%, var(--theme-divider) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite linear;
}
.icon-placeholder {
  aspect-ratio: 1;
  border-radius: 9px;
  background: var(--theme-glass-bg);
  border: 1px dashed var(--theme-card-border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--theme-text-tertiary);
  font-size: 9px;
  text-align: center;
  padding: 3px;
  line-height: 1.2;
}

.filter-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.filter-pill {
  padding: 5px 10px;
  border-radius: 7px;
  background: var(--theme-glass-bg);
  border: 1px solid var(--theme-card-border);
  color: var(--theme-text-secondary);
  font-size: 11px;
  font-weight: 700;
  transition: all 0.2s var(--ease);
  cursor: pointer;
  font-family: inherit;
}
.filter-pill:hover { border-color: var(--theme-primary-glow); color: var(--theme-text); }
.filter-pill.active {
  background: var(--theme-primary);
  color: #0a0c10;
  border-color: var(--theme-primary);
}
[data-theme="light"] .filter-pill.active { color: #ffffff; }

/* ═══════════════════════════════════════════════════════════
   LOGS
   ═══════════════════════════════════════════════════════════ */
.log-entry {
  display: flex;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--theme-divider);
  font-size: 11px;
}
.log-entry:last-child { border-bottom: none; }
.log-time {
  flex-shrink: 0;
  width: 55px;
  font-size: 9px;
  color: var(--theme-text-tertiary);
  font-family: var(--font-mono);
  padding-top: 1px;
}
.log-body { flex: 1; min-width: 0; }
.log-type {
  font-size: 8.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: var(--theme-primary);
  margin-bottom: 1px;
}
.log-action {
  font-size: 11px;
  color: var(--theme-text);
  font-weight: 600;
  line-height: 1.4;
  word-break: break-word;
}

/* ═══════════════════════════════════════════════════════════
   JSON VIEWER
   ═══════════════════════════════════════════════════════════ */
.db-tabs {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--theme-glass-bg);
  border-radius: 8px;
  margin-bottom: 10px;
}
.db-tab {
  flex: 1;
  padding: 5px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--theme-text-tertiary);
  transition: all 0.15s var(--ease);
  font-family: inherit;
  border: none;
  cursor: pointer;
  background: transparent;
}
.db-tab.active {
  background: var(--theme-surface-elevated);
  color: var(--theme-text);
}
.db-json {
  background: var(--theme-surface-elevated);
  border: 1px solid var(--theme-card-border);
  border-radius: 8px;
  padding: 10px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--theme-text-secondary);
  overflow-x: auto;
  max-height: 360px;
  overflow-y: auto;
  white-space: pre;
}

    checkCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
    alertCircle: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
    external: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
    code: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
    expand: '<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>',
    collapse: '<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/>',
    chevronRight: '<polyline points="9 18 15 12 9 6"/>',
  };

  function svg(name, size = 14, sw = 2.2) {
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${TAB_ICONS[name] || ''}</svg>`;
  }

  // ═══════════════════════════════════════════════════════════
  // IDB
  // ═══════════════════════════════════════════════════════════

  let dbConn = null;
  function openDB() {
    if (dbConn) return Promise.resolve(dbConn);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => { dbConn = req.result; resolve(dbConn); };
      req.onupgradeneeded = (event) => {
        const conn = event.target.result;
        if (!conn.objectStoreNames.contains('projects')) conn.createObjectStore('projects', { keyPath: 'pid' });
        if (!conn.objectStoreNames.contains('files')) {
          const store = conn.createObjectStore('files', { keyPath: ['pid', 'path'] });
          store.createIndex('pid', 'pid');
        }
        if (!conn.objectStoreNames.contains('versions')) {
          const store = conn.createObjectStore('versions', { keyPath: 'vid' });
          store.createIndex('pid', 'pid');
        }
        if (!conn.objectStoreNames.contains('projectMeta')) conn.createObjectStore('projectMeta', { keyPath: 'pid' });
        if (!conn.objectStoreNames.contains('syncQueue')) conn.createObjectStore('syncQueue', { keyPath: 'id', autoIncrement: true });
      };
    });
  }
  function dbWrap(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
  function dbTx(store, mode = 'readonly') { return dbConn.transaction(store, mode).objectStore(store); }

  const IDB = {
    async getProject(pid) { return dbWrap(dbTx('projects').get(pid)); },
    async putProject(p) { return dbWrap(dbTx('projects', 'readwrite').put(p)); },
    async deleteProject(pid) {
      await dbWrap(dbTx('projects', 'readwrite').delete(pid));
      const files = await dbWrap(dbTx('files').index('pid').getAll(pid));
      for (const f of files) await dbWrap(dbTx('files', 'readwrite').delete([f.pid, f.path]));
      const versions = await dbWrap(dbTx('versions').index('pid').getAll(pid));
      for (const v of versions) await dbWrap(dbTx('versions', 'readwrite').delete(v.vid));
    },
    async listFiles(pid) { return dbWrap(dbTx('files').index('pid').getAll(pid)); },
    async getFile(pid, path) { return dbWrap(dbTx('files').get([pid, path])); },
    async putFile(pid, path, content) {
      return dbWrap(dbTx('files', 'readwrite').put({ pid, path, content, updatedAt: Date.now() }));
    },
    async listVersions(pid) {
      const all = await dbWrap(dbTx('versions').index('pid').getAll(pid));
      return all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    },
  };

  function normalizeServerProject(p) {
    return {
      pid: p.pid, name: p.name || 'Untitled project', slug: p.slug || '',
      description: p.description || '', iconUrl: p.iconUrl || null,
      primaryFile: p.primaryFile || null,
      createdAt: p.createdAt ? new Date(p.createdAt).getTime() : Date.now(),
      updatedAt: p.updatedAt ? new Date(p.updatedAt).getTime() : Date.now(),
      _server: true,
    };
  }

  // ═══════════════════════════════════════════════════════════
  // STATE
  // ═══════════════════════════════════════════════════════════

  const S = {
    session: null, user: null, uid: null,
    pid: null, project: null, role: null,
    isOwner: false, isEditor: false, isSharedMode: false,
    activeTab: 'overview', tabs: OWNER_TABS, tabCounts: {},
    deployState: null, analyticsData: null, logsData: null, logsOffset: 0,
    dbData: null, iconVariants: [], selectedIconUrl: null,
    online: navigator.onLine,
    expandedFolders: new Set(),
    fileFilter: '',
    isLocalOnly: false,
  };

  const $ = id => document.getElementById(id);
  const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const escapeAttr = s => String(s ?? '').replace(/"/g, '&quot;');

  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }

  // ═══════════════════════════════════════════════════════════
  // UTILS
  // ═══════════════════════════════════════════════════════════

  function timeAgo(ts) {
    if (!ts) return '—';
    const diff = Date.now() - ts;
    if (diff < 60000) return 'just now';
    const m = Math.floor(diff / 60000);
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h / 24);
    if (d < 30) return `${d}d ago`;
    return new Date(ts).toLocaleDateString();
  }
  function formatBytes(n) {
    if (!n || n < 0) return '0 B';
    const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${n < 10 ? n.toFixed(1) : Math.round(n)} ${u[i]}`;
  }
  function formatNumber(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n || 0);
  }
  function getInitials(name) {
    const s = String(name || '').trim();
    if (!s) return '?';
    const parts = s.split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  function fileIconName(path) {
    const ext = (path.split('.').pop() || '').toLowerCase();
    if (['html','htm','css','scss','less','js','mjs','cjs','jsx','ts','tsx'].includes(ext)) return 'code';
    if (ext === 'json') return 'file';
    if (['md','markdown','txt'].includes(ext)) return 'file';
    if (['png','jpg','jpeg','gif','svg','webp'].includes(ext)) return 'image';
    return 'file';
  }
  function isTextFile(path) {
    return /\.(html?|css|js|mjs|cjs|jsx|tsx?|py|json|md|txt|ya?ml|svg|xml)$/i.test(path);
  }

  function toast(msg, type = 'info', duration = 2500) {
    const container = $('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const ic = type === 'success' ? 'checkCircle' : type === 'error' ? 'alertCircle' : type === 'warning' ? 'alert' : 'info';
    el.innerHTML = svg(ic, 13, 2.4) + '<span></span>';
    el.querySelector('span').textContent = msg;
    container.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, duration);
  }

  function showLoading(title = 'Working…', desc = '') {
    $('loadingTitle').textContent = title;
    $('loadingDesc').textContent = desc;
    $('loadingOverlay').classList.add('active');
  }
  function setLoadingDesc(desc) {
    const el = $('loadingDesc');
    if (el) el.textContent = desc || '';
  }
  function hideLoading() { $('loadingOverlay').classList.remove('active'); }

  function openModal(html) {
    $('modalBody').innerHTML = html;
    $('modalOverlay').classList.add('active');
  }
  function closeModal() {
    $('modalOverlay').classList.remove('active');
    setTimeout(() => { $('modalBody').innerHTML = ''; }, 250);
  }
  window.closeModal = closeModal;

  function confirmModal(title, desc, confirmLabel, danger, onConfirm) {
    openModal(`
      <div class="modal-title">${escapeHTML(title)}</div>
      <div class="modal-desc">${escapeHTML(desc)}</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="modalConfirmBtn">${escapeHTML(confirmLabel)}</button>
      </div>
    `);
    $('modalConfirmBtn').addEventListener('click', () => { closeModal(); onConfirm(); });
  }

  function copyToClipboard(text) {
    try {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
        return true;
      }
    } catch {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch { return false; }
  }

  // ═══════════════════════════════════════════════════════════
  // SESSION / API
  // ═══════════════════════════════════════════════════════════

  function readSession() {
    try { S.session = localStorage.getItem(STORAGE.session); } catch {}
    try {
      const raw = localStorage.getItem(STORAGE.user);
      S.user = raw ? JSON.parse(raw) : null;
    } catch {}
    if (S.user) S.uid = S.user.uid || null;
  }

  async function apiFetch(url, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    if (S.session) headers['Authorization'] = `Bearer ${S.session}`;
    const res = await fetch(url, { ...opts, headers });
    let data = {};
    try { data = await res.json(); } catch {}
    return { ok: res.ok, status: res.status, data };
  }

  // ═══════════════════════════════════════════════════════════
  // CACHE
  // ═══════════════════════════════════════════════════════════

  function cacheProject(project) {
    try {
      localStorage.setItem(STORAGE.cache + '.' + S.pid, JSON.stringify({ project, cachedAt: Date.now() }));
    } catch {}
  }
  function readCachedProject() {
    try {
      const raw = localStorage.getItem(STORAGE.cache + '.' + S.pid);
      return raw ? JSON.parse(raw).project : null;
    } catch { return null; }
  }

  // ═══════════════════════════════════════════════════════════
  // ROUTING
  // ═══════════════════════════════════════════════════════════

  function getPid() {
    const params = new URLSearchParams(location.search);
    return params.get('pid') || null;
  }
  function getHashTab() { return location.hash.replace(/^#\/?/, '') || null; }
  function setHashTab(tabId) {
    const newHash = `#/${tabId}`;
    if (location.hash !== newHash) history.replaceState(null, '', newHash);
  }
  function getLastTab() {
    try { return localStorage.getItem(STORAGE.lastTab + '.' + S.pid) || null; } catch { return null; }
  }
  function saveLastTab(tabId) {
    try { localStorage.setItem(STORAGE.lastTab + '.' + S.pid, tabId); } catch {}
  }
  function shouldRememberTab() {
    try { const v = localStorage.getItem(STORAGE.rememberTab); return v === null ? true : v === 'true'; }
    catch { return true; }
  }
  function loadExpanded() {
    try {
      const raw = sessionStorage.getItem(STORAGE.expanded + '.' + S.pid);
      if (raw) S.expandedFolders = new Set(JSON.parse(raw));
    } catch {}
  }
  function saveExpanded() {
    try {
      sessionStorage.setItem(STORAGE.expanded + '.' + S.pid, JSON.stringify([...S.expandedFolders]));
    } catch {}
  }

  // ═══════════════════════════════════════════════════════════
  // MODE BANNER
  // ═══════════════════════════════════════════════════════════

  function updateModeBanner() {
    const banner = $('modeBanner');
    const text = $('modeBannerText');
    const action = $('modeBannerAction');
    if (!banner) return;

    if (S.isLocalOnly) {
      banner.hidden = false;
      banner.classList.add('visible');
      text.textContent = S.session
        ? 'Local project — files live only on this device. Sync to your account to unlock deploys, analytics, and sharing.'
        : 'Local project — files live only on this device. Sign in to sync and unlock deploys.';
      action.textContent = S.session ? 'Sync now' : 'Sign in';
      action.onclick = () => promoteLocalProject();
    } else if (!S.online) {
      banner.hidden = false;
      banner.classList.add('visible');
      text.textContent = 'You\'re offline — showing cached data.';
      action.textContent = 'Retry';
      action.onclick = () => location.reload();
    } else {
      banner.hidden = true;
      banner.classList.remove('visible');
    }
  }

  function renderProjectIcon(el, project, { editable = false } = {}) {
    if (!el) return;
    const url = project?.iconUrl;
    const name = project?.name || '?';
    const initials = getInitials(name);
    if (url) el.innerHTML = `<img src="${escapeAttr(url)}" alt="${escapeAttr(name)}">`;
    else el.textContent = initials;
    if (editable && !S.isSharedMode && !S.isLocalOnly) {
      const btn = document.createElement('button');
      btn.className = 'edit-icon-hint';
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Change project icon');
      btn.innerHTML = svg('edit', 12, 2.4);
      btn.addEventListener('click', openIconPicker);
      el.appendChild(btn);
    }
  }

  function updateFavicon(project) {
    const fav = $('pageFavicon');
    if (fav && project?.iconUrl) fav.href = project.iconUrl;
  }

  function updateProjectIcons() {
    renderProjectIcon($('headerProjectIcon'), S.project, { editable: true });
    updateFavicon(S.project);
  }

            <div style="display:flex;gap:6px;align-items:center;">
              <div style="display:flex;gap:4px;">
                ${['#F59E0B','#10B981','#3B82F6','#a855f7','#ec4899','#06b6d4'].map((c, i) => `

                    style="width:22px;height:22px;border-radius:6px;background:${c};border:2px solid ${i===0?'var(--theme-text)':'transparent'};cursor:pointer;padding:0;"></button>

          },

              images: {},
            },
          }),
        });

        if (!json.success || !json.preview) throw new Error(json.error || 'Generation failed');

        const grid = $('iconCustomResult');
        grid.innerHTML = '';
        const wrapBtn = document.createElement('button');
        wrapBtn.className = 'icon-option';
        wrapBtn.type = 'button';
        wrapBtn.style.gridColumn = '1 / -1';

        btn.disabled = false;
        btn.innerHTML = original;
      }

  async function generateIcons({ shuffle = false } = {}) {
    const grid = $('iconPickerGrid');
    if (!grid) return;
    if (S.iconVariants.length > 0 && !shuffle) { renderIconOptions(); return; }

    grid.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      const sk = document.createElement('div');
      sk.className = 'icon-skeleton';
      grid.appendChild(sk);
    }

    const projectName = S.project?.name || 'Project';
    const baseSeed = (S.project?.slug || 'project').replace(/[^a-z0-9]/gi, '').toLowerCase();
    const seedSuffix = shuffle ? Math.random().toString(36).slice(2, 6) : '';
    const username = (baseSeed + seedSuffix).slice(0, 30) || 'folio';

    try {
      const res = await fetch(API_FLIER + '?action=avatar/preview', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, displayName: projectName }),
      });
      const data = await res.json();
      if (!data.success || !Array.isArray(data.variants) || data.variants.length === 0) {
        throw new Error(data.error || 'Failed');
      }
      S.iconVariants = data.variants;
      renderIconOptions();
    } catch {
      toast('Icon generation failed', 'error');
      grid.innerHTML = `<div class="icon-placeholder" style="grid-column:1/-1; aspect-ratio:auto; padding:16px;">Could not generate. Check connection and try again.</div>`;
    }
  }

  function renderIconOptions() {
    const grid = $('iconPickerGrid');
    if (!grid) return;
    grid.innerHTML = '';
    if (S.iconVariants.length === 0) {
      grid.innerHTML = `<div class="icon-placeholder" style="grid-column:1/-1; aspect-ratio:auto; padding:16px;">No presets generated. Tap Shuffle.</div>`;
      return;
    }
    S.iconVariants.forEach(v => {
      const btn = document.createElement('button');
      btn.className = 'icon-option';
      btn.type = 'button';
      btn.dataset.avatarId = v.id;
      const img = document.createElement('img');
      img.src = v.dataUrl; img.alt = v.label || 'Icon';
      btn.appendChild(img);
      const label = document.createElement('span');
      label.className = 'icon-label';
      label.textContent = v.label || v.id;
      btn.appendChild(label);
      btn.addEventListener('click', async () => {
        S.selectedIconUrl = v.dataUrl;
        grid.querySelectorAll('.icon-option').forEach(o => o.classList.remove('selected'));
        btn.classList.add('selected');
        await saveIcon();
      });
      grid.appendChild(btn);
    });
  }

  async function saveIcon() {
    if (!S.selectedIconUrl) return;
    showLoading('Uploading icon', '');
    try {
      const uploadRes = await fetch(API_FLIER + '?action=avatar/upload', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dataUrl: S.selectedIconUrl, username: S.project?.slug || 'project' }),
      });
      const uploadData = await uploadRes.json();
      if (!uploadData.success || !uploadData.url) throw new Error(uploadData.error || 'Upload failed');

      if (S.session && S.online && !S.isLocalOnly) {
        const updateRes = await apiFetch(API_HOST + '?action=projects/update', {
          method: 'POST', body: JSON.stringify({ pid: S.pid, iconUrl: uploadData.url }),
        });
        if (!updateRes.ok || !updateRes.data?.success) throw new Error(updateRes.data?.error || 'Update failed');
      }
      S.project.iconUrl = uploadData.url;
      await IDB.putProject({
        pid: S.pid, name: S.project.name, slug: S.project.slug || '',
        description: S.project.description || '', iconUrl: uploadData.url,
        createdAt: S.project.createdAt || Date.now(), updatedAt: Date.now(),
      });
      updateProjectIcons();
      closeModal();
      hideLoading();
      toast('Icon saved', 'success');
      if (S.activeTab === 'overview') {
        const card = document.getElementById('overviewIcon');
        if (card) renderProjectIcon(card, S.project);
      }
    } catch (err) {
      hideLoading();
      toast(err.message || 'Could not save icon', 'error');
    }
  }

  // ═══════════════════════════════════════════════════════════
  // GATE HELPER
  // ═══════════════════════════════════════════════════════════

  function gate(panel, { requiresAuth = true, requiresOnline = true, label }) {
    if (S.isLocalOnly && (requiresAuth || requiresOnline)) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('upload', `${label} needs an account`,
          'This is a local project. Sync it to your Folio account to unlock this tab.',
          `<button class="btn btn-primary" id="btnSyncNow">${svg('upload', 12, 2.4)} Sync to account</button>`)}
      </div></div>`;
      $('btnSyncNow')?.addEventListener('click', () => promoteLocalProject());
      return false;
    }
    if (requiresAuth && !S.session) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('key', `${label} needs an account`, 'Sign in to access this tab.',
          `<a class="btn btn-primary" href="/register.html?next=${encodeURIComponent(location.pathname + location.search)}">Sign in</a>`)}
      </div></div>`;
      return false;
    }
    if (requiresOnline && !S.online) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('alertCircle', `${label} needs internet`, 'Reconnect to load this data.')}
      </div></div>`;
      return false;
    }
    return true;
  }

  // ═══════════════════════════════════════════════════════════
  // LOAD PROJECT
  // ═══════════════════════════════════════════════════════════

  async function loadProject() {
    let localProject = null;
    try { localProject = await IDB.getProject(S.pid); } catch {}

    if (/^local_/.test(S.pid)) {
      if (!localProject) { showFatal('Not found', 'This local project no longer exists.'); return false; }
      S.project = { ...localProject, myRole: 'owner', visibility: { profile: 'private' } };
      S.isLocalOnly = true;
      applyProjectMeta();
      return true;
    }

    if (S.session && S.online) {
      const res = await apiFetch(API_HOST + '?action=projects/get&pid=' + encodeURIComponent(S.pid));
      if (res.ok && res.data?.success) {
        const norm = normalizeServerProject(res.data.project);
        await IDB.putProject(norm);
        S.project = { ...res.data.project, ...norm };
        S.isLocalOnly = false;
        cacheProject(S.project);
        applyProjectMeta();
        return true;
      }
      if (res.status === 401) {
        toast('Session expired — signing in again', 'warning', 3200);
        setTimeout(() => {
          window.location.href = '/register.html?next=' + encodeURIComponent(location.pathname + location.search);
        }, 1200);
        return false;
      }
      if (res.status === 404 || res.status === 403) {
        if (localProject) { S.project = localProject; applyProjectMeta(); toast('Showing cached data', 'warning'); return true; }
        showFatal('Project not found', 'This project may have been deleted or you don\'t have access.');
        return false;
      }
    }

    if (localProject) {
      S.project = localProject;
      S.isLocalOnly = true;
      applyProjectMeta();
      if (!S.online) toast('Showing cached data', 'warning');
      return true;
    }
    const cached = readCachedProject();
    if (cached) { S.project = cached; applyProjectMeta(); toast('Showing cached data', 'warning'); return true; }

    showFatal('Couldn\'t load project', 'Check your connection and try again.');
    return false;
  }

  function applyProjectMeta() {
    S.role = S.project.myRole || (S.isLocalOnly ? 'owner' : 'viewer');
    S.isOwner = S.role === 'owner';
    S.isEditor = S.role === 'owner' || S.role === 'editor';
    S.isSharedMode = !S.isOwner && !S.isEditor;
    S.tabs = S.isSharedMode ? SHARED_TABS : OWNER_TABS;
    if (!S.tabs.some(t => t.id === S.activeTab)) S.activeTab = 'overview';

    loadExpanded();
    updateHeader();
    updateModeBanner();
    renderSidebar();
    renderTopTabs();
    updateProjectIcons();

    if (S.isEditor || S.project.visibility?.liveSite === 'public') loadDeployState();
  }

  function updateHeader() {
    $('headerProjectName').textContent = S.project.name || 'Untitled project';
    const parts = [];
    if (S.project.slug) parts.push(`@${escapeHTML(S.project.slug)}`);
    const roleBadge = `<span class="header-role-badge">${S.isOwner ? 'Owner' : S.role || 'Viewer'}</span>`;
    const deployBadge = S.project.deployment?.url
      ? `<span class="header-deploy-badge"><span class="dot"></span>Live</span>`
      : S.project.deployment?.state === 'OFFLINE'
      ? `<span class="header-deploy-badge offline">Offline</span>`
      : '';
    $('headerProjectSub').innerHTML = parts.join('') + roleBadge + deployBadge;
    document.title = `${S.project.name || 'Project'} — Folio`;
  }

  // ═══════════════════════════════════════════════════════════
  // TOP TABS
  // ═══════════════════════════════════════════════════════════

  function renderTopTabs() {
    const bar = $('topTabsBar');
    if (!bar) return;

    bar.innerHTML = S.tabs.map(t => {
      const isActive = t.id === S.activeTab;
      const count = t.countKey && S.tabCounts[t.countKey] != null ? S.tabCounts[t.countKey] : null;
      return `
        <button class="top-tab-btn ${isActive ? 'active' : ''}"
                data-top-tab="${escapeAttr(t.id)}"
                type="button"
                role="tab"
                aria-selected="${isActive}">
          ${svg(t.icon, 13, 2.2)}
          <span>${escapeHTML(t.label)}</span>
          ${count != null ? `<span class="top-tab-badge">${count}</span>` : ''}
        </button>
      `;
    }).join('');

    bar.querySelectorAll('[data-top-tab]').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.topTab));
    });
  }

  // ═══════════════════════════════════════════════════════════
  // SIDEBAR
  // ═══════════════════════════════════════════════════════════

  function renderSidebar() {
    const body = $('sidebarBody'); if (!body) return;
    body.innerHTML = '';
    const section = document.createElement('div');
    section.className = 'sidebar-section';
    const title = document.createElement('div');
    title.className = 'sidebar-section-title';
    title.textContent = 'Sections';
    section.appendChild(title);
    S.tabs.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'sidebar-tab' + (t.id === S.activeTab ? ' active' : '');
      btn.type = 'button';
      const badge = t.countKey && S.tabCounts[t.countKey] != null
        ? `<span class="sidebar-tab-badge">${S.tabCounts[t.countKey]}</span>` : '';
      btn.innerHTML = svg(t.icon, 13, 2.2) + `<span>${escapeHTML(t.label)}</span>` + badge;
      btn.addEventListener('click', () => { switchTab(t.id); closeSidebar(); });
      section.appendChild(btn);
    });
    body.appendChild(section);
  }

  function openSidebar() { $('sidebar').classList.add('open'); $('sidebarBackdrop').classList.add('open'); }
  function closeSidebar() { $('sidebar').classList.remove('open'); $('sidebarBackdrop').classList.remove('open'); }

  function switchTab(tabId) {
    if (!S.tabs.some(t => t.id === tabId)) return;
    S.activeTab = tabId;
    setHashTab(tabId);
    saveLastTab(tabId);
    renderSidebar();
    renderTopTabs();
    renderPanel();

    const activeBtn = document.querySelector(`[data-top-tab="${tabId}"]`);
    activeBtn?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

    setTimeout(() => {
      const main = $('mainContent');
      if (main) main.scrollTo({ top: 0, behavior: 'smooth' });
    }, 20);
  }

  // ═══════════════════════════════════════════════════════════
  // PANEL ROUTER
  // ═══════════════════════════════════════════════════════════

  function renderPanel() {
    const inner = $('contentInner');
    const tab = S.activeTab;
    inner.innerHTML = `<div class="panel active" id="panel-${tab}"></div>`;
    const panel = $('panel-' + tab);
    const loaders = {
      overview: renderOverviewPanel,
      files: renderFilesPanel,
      deployments: renderDeploymentsPanel,
      analytics: renderAnalyticsPanel,
      sharing: renderSharingPanel,
      data: renderDataPanel,
      logs: renderLogsPanel,
      downloads: renderDownloadsPanel,
      download: renderDownloadSharedPanel,
      danger: renderDangerPanel,
    };
    const loader = loaders[tab];
    if (loader) loader(panel);
  }

  function skeletonCard(lines = 3) {
    let html = '<div class="card"><div class="card-body">';
    html += '<div class="skeleton sk-title"></div>';
    for (let i = 0; i < lines; i++) html += `<div class="skeleton sk-line" style="width:${60 + Math.random() * 35}%;"></div>`;
    html += '</div></div>';
    return html;
  }

  function emptyState(icon, title, desc, actionHtml = '') {
    return `<div class="empty-state">
      <div class="empty-state-icon">${svg(icon, 18, 2)}</div>
      <div class="empty-state-title">${escapeHTML(title)}</div>
      <div class="empty-state-desc">${escapeHTML(desc)}</div>
      ${actionHtml}
    </div>`;
  }

  function showFatal(title, desc) {
    $('contentInner').innerHTML = `<div class="panel active"><div class="card"><div class="card-body">
      ${emptyState('alertCircle', title, desc, `<button class="btn btn-secondary" onclick="location.reload()">${svg('refresh', 12, 2.2)} Try again</button>
      <a class="btn btn-ghost" href="/projects.html" style="margin-top:6px;">Back to projects</a>`)}

  // DEPLOY STATE
  // ═══════════════════════════════════════════════════════════

  async function loadDeployState() {
    if (!S.online || S.isLocalOnly) return;
    try {
      const res = await apiFetch(API_HOST + '?action=status&pid=' + encodeURIComponent(S.pid));
      if (res.ok && res.data?.success) {
        S.deployState = res.data.deployment;
        if (S.deployState) { S.project.deployment = S.deployState; updateHeader(); }
      }
    } catch {}
  }

  // ═══════════════════════════════════════════════════════════
  // PROMOTE LOCAL → SERVER
  // ═══════════════════════════════════════════════════════════

  async function promoteLocalProject() {
    if (!S.session) {
      window.location.href = '/register.html?next=' + encodeURIComponent(location.pathname + location.search);
      return;
    }
    if (!S.isLocalOnly) { toast('Already on server', 'info'); return; }
    if (!S.online) { toast('Requires internet', 'warning'); return; }

    showLoading('Syncing project', 'Creating server project…');
    try {
      const createRes = await apiFetch(API_HOST + '?action=projects/create', {
        method: 'POST',
        body: JSON.stringify({
          name: S.project.name || 'Imported project',
          description: S.project.description || '',
        }),
      });
      if (!createRes.ok || !createRes.data?.success) {
        throw new Error(createRes.data?.error || 'Create failed');
      }
      const newPid = createRes.data.pid;

      const files = await IDB.listFiles(S.pid);
      const versions = await IDB.listVersions(S.pid);
      const fileMap = {};
      for (const f of files) fileMap[f.path] = f.content || '';

      setLoadingDesc(`Uploading ${files.length} file${files.length === 1 ? '' : 's'}…`);
      const syncRes = await apiFetch(API_HOST + '?action=project/sync-back', {
        method: 'POST',
        body: JSON.stringify({
          pid: newPid,
          files: fileMap,
          versions: versions.length ? Object.fromEntries(
            versions.map(v => [
              v.vid,
              { message: v.message || '', files: v.files || {}, createdAt: v.createdAt }
            ])
          ) : null,
        }),
      });
      if (!syncRes.ok || !syncRes.data?.success) {
        throw new Error(syncRes.data?.error || 'Sync failed');
      }

      const project = {
        pid: newPid,
        name: S.project.name || 'Imported project',
        slug: createRes.data.project?.slug || S.project.slug || '',
        description: S.project.description || '',
        iconUrl: S.project.iconUrl || null,
        createdAt: S.project.createdAt || Date.now(),
        updatedAt: Date.now(),
      };
      await IDB.putProject(project);
      for (const f of files) await IDB.putFile(newPid, f.path, f.content);
      for (const v of versions) {
        await dbWrap(dbTx('versions', 'readwrite').put({
          vid: v.vid, pid: newPid, message: v.message,
          files: v.files, createdAt: v.createdAt,
        }));
      }
      await IDB.deleteProject(S.pid);

      try {
        if (localStorage.getItem(STORAGE.lastProject) === S.pid) {
          localStorage.setItem(STORAGE.lastProject, newPid);
        }
      } catch {}

      S.pid = newPid;
      S.project = project;
      S.isLocalOnly = false;
      const url = new URL(location.href);
      url.searchParams.set('pid', newPid);
      history.replaceState(null, '', url.toString());

      hideLoading();
      toast('Project synced to your account', 'success');
      await loadProject();
      renderSidebar();
      renderTopTabs();
      renderPanel();
    } catch (err) {
      hideLoading();
      toast(err.message || 'Sync failed', 'error');
    }
  }

  async function saveProjectDetails() {
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    const name = $('fieldProjectName')?.value?.trim();
    const description = $('fieldProjectDesc')?.value?.trim();
    const primaryFile = $('fieldPrimaryFile')?.value || '';

    const btn = $('btnSaveDetails');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    try {
      if (S.session && !S.isLocalOnly) {
        const res = await apiFetch(API_HOST + '?action=projects/update', {
          method: 'POST', body: JSON.stringify({ pid: S.pid, name, description }),
        });
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
      }
      S.project.name = name;
      S.project.description = description;
      S.project.primaryFile = primaryFile || null;
      await IDB.putProject({
        pid: S.pid, name, description, slug: S.project.slug || '',
        iconUrl: S.project.iconUrl || null, primaryFile: S.project.primaryFile,
        createdAt: S.project.createdAt || Date.now(), updatedAt: Date.now(),
      });
      cacheProject(S.project);
      updateHeader();
      toast('Saved', 'success');
