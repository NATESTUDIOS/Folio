async function renderDataPanel(panel) {
  if (!gate(panel, { label: 'Data' })) return;
  if (S.isLocalOnly || S.syncState !== 'synced') {
    panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('upload', 'Data needs a server project', 'Push this project to the server first to enable the JSON database.', `<button class="btn btn-primary" id="btnPushForData" style="margin-top:8px;">${svg('upload', 12, 2.4)} Sync to account</button>`)}</div></div>`;
    $('btnPushForData')?.addEventListener('click', () => { if (S.syncState === 'orphan') pushOrphanToServer(); else if (S.syncState === 'local') promoteLocalProject(); });
    return;
  }
  const now = Date.now();
  if (S._dbCache.pid === S.pid && (now - S._dbCache.at) < DB_CLIENT_CACHE_TTL && S._dbCache.data) {
    S.dbData = S._dbCache.data.data;
    S.dbStats = S._dbCache.data.stats;
    renderDataPanelContent(panel, S._dbCache.data.schema);
    return;
  }
  panel.innerHTML = skeletonCard(4);
  try {
    const res = await apiFetch(API_HOST + '?action=db/get&pid=' + encodeURIComponent(S.pid));
    if (!res.ok || !res.data?.success) { panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('database', "Couldn't load data", res.data?.error || 'Try refreshing.')}</div></div>`; return; }
    const { data, schema } = res.data;
    S.dbData = data || {};
    S.dbStats = { calls: res.data.calls || null, rateLimit: res.data.rateLimit || null, space: res.data.space || null };
    if (!S.dbSnapshot) S.dbSnapshot = JSON.parse(JSON.stringify(S.dbData));
    S.dbDirty = false;
    S._dbCache = { pid: S.pid, at: now, data: { data: S.dbData, stats: S.dbStats, schema } };
    renderDataPanelContent(panel, schema);
  } catch (err) {
    panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('database', "Couldn't load data", err.message)}</div></div>`;
  }
}

function renderDataPanelContent(panel, schema) {
  const d = S.dbStats;
  const used = d.space?.used || JSON.stringify(S.dbData).length;
  const limit = d.space?.limit || 15 * 1024 * 1024;
  const pct = d.space?.percentUsed || Math.min(100, (used / limit) * 100);
  const barClass = pct > 85 ? 'danger' : pct > 60 ? 'warn' : '';
  const offline = !S.online;
  panel.innerHTML = `
    <div class="card"><div class="card-header"><div class="card-title">${svg('database', 13, 2.2)} JSON database</div><span class="vis-badge ${S.project.visibility?.db === 'public' ? 'public' : 'private'}">${S.project.visibility?.db === 'public' ? 'Public reads' : 'Private'}</span></div><div class="card-body"><div class="field-hint" style="line-height:1.6;">Per-project key/value store. Up to 15 MB per project. Accessible from <code class="mono">api/*.js</code> via <code class="mono">fetch(ENV.FOLIO_BASE_URL + "/api/host?action=db/...")</code>.<br><br><strong>Looking for secrets?</strong> API keys belong in the <strong>Secrets</strong> tab. See <button type="button" class="link-btn" id="btnDataDocs">Docs → Data API</button>.</div></div></div>
    ${offline ? `<div class="card" style="border-color:var(--theme-warning);"><div class="card-body" style="display:flex;gap:8px;align-items:flex-start;"><div style="color:var(--theme-warning);flex-shrink:0;">${svg('wifi', 16, 2.2)}</div><div style="font-size:11.5px;color:var(--theme-text-secondary);line-height:1.5;"><strong>Offline — editing disabled.</strong> Showing last cached copy.</div></div></div>` : ''}
    <div class="db-stats-grid"><div class="db-stat-tile"><div class="db-stat-label">Storage</div><div class="db-stat-value ${pct > 85 ? 'danger' : pct > 60 ? 'warn' : ''}">${formatBytes(used)}</div><div class="db-stat-subtext">of ${formatBytes(limit)}</div><div class="db-stat-bar"><div class="db-stat-bar-fill ${barClass}" style="width:${pct}%"></div></div></div><div class="db-stat-tile"><div class="db-stat-label">Writes</div><div class="db-stat-value">${d.calls ? formatNumber(d.calls.total || 0) : '—'}</div><div class="db-stat-subtext">${d.calls ? formatNumber(d.calls.today || 0) + ' today' : 'updates after first save'}</div></div><div class="db-stat-tile"><div class="db-stat-label">Rate limit</div><div class="db-stat-value">${d.rateLimit ? `${d.rateLimit.remaining}/${d.rateLimit.limit}` : '—'}</div><div class="db-stat-subtext">per minute</div></div></div>
    <div class="card"><div class="card-header"><div class="card-title">${svg('database', 13, 2.2)} Database editor</div><div style="display:flex;gap:4px;flex-wrap:wrap;"><button class="btn btn-sm btn-ghost" id="btnDbReadOnlyToggle" style="color:${S.dbReadOnly || offline ? 'var(--theme-warning)' : 'var(--theme-text-tertiary)'};">${svg(S.dbReadOnly || offline ? 'lock' : 'edit', 10, 2.2)} ${S.dbReadOnly || offline ? 'Read-only' : 'Edit'}</button>${S.dbDirty ? `<button class="btn btn-sm btn-ghost" id="btnDbUndo">${svg('refresh', 10, 2.2)} Undo</button>` : ''}</div></div>
    <div class="card-body"><div class="db-tabs"><button class="db-tab ${S.dbTab === 'tree' ? 'active' : ''}" data-db-tab="tree">Tree</button><button class="db-tab ${S.dbTab === 'raw' ? 'active' : ''}" data-db-tab="raw">Raw</button><button class="db-tab ${S.dbTab === 'schema' ? 'active' : ''}" data-db-tab="schema">Schema</button></div>
    ${(S.dbTab === 'tree' || S.dbTab === 'raw') ? `<div class="db-toolbar"><input class="input db-search" id="dbSearch" placeholder="Search keys or values…" value="${escapeAttr(S.dbSearch)}">${S.dbTab === 'tree' && !S.dbReadOnly && !offline ? `<button class="btn btn-sm btn-ghost" id="btnDbExpand">${svg('chevron-down', 10, 2.2)} ${S.dbExpanded.size > 0 ? 'Collapse' : 'Expand'}</button><button class="btn btn-sm btn-ghost" id="btnDbAddKey">${svg('plus', 10, 2.4)} Add key</button>` : ''}${S.dbTab === 'raw' ? `<button class="btn btn-sm btn-ghost" id="btnDbCopy">${svg('copy', 10, 2.2)} Copy</button><button class="btn btn-sm btn-ghost" id="btnDbExport">${svg('download', 10, 2.2)} Export</button>` : ''}</div>` : ''}
    <div id="dbTreeWrap" ${S.dbTab === 'tree' ? '' : 'style="display:none;"'}></div>
    <div id="dbRawWrap" ${S.dbTab === 'raw' ? '' : 'style="display:none;"'}><textarea class="textarea mono" id="dbRawEditor" style="min-height:300px;font-family:var(--font-mono);font-size:11px;" ${S.dbReadOnly || offline ? 'readonly' : ''}>${escapeHTML(JSON.stringify(S.dbData, null, 2))}</textarea></div>
    <div id="dbSchemaWrap" ${S.dbTab === 'schema' ? '' : 'style="display:none;"'}><div class="db-json">${schema ? escapeHTML(JSON.stringify(schema, null, 2)) : 'No schema defined.'}</div></div>
    <div class="db-byte-row ${pct > 80 ? 'warn' : ''}"><span>${formatBytes(used)} / ${formatBytes(limit)} · ${pct.toFixed(1)}%</span><span>${S.dbDirty ? '● Unsaved changes' : 'Saved'}</span></div></div></div>
    ${pct > 80 ? `<div class="card" style="border-color:var(--theme-warning);"><div class="card-body" style="display:flex;gap:10px;align-items:flex-start;"><div style="color:var(--theme-warning);flex-shrink:0;">${svg('alert', 16, 2.4)}</div><div style="font-size:11.5px;color:var(--theme-text-secondary);line-height:1.55;"><strong>Storage is ${pct.toFixed(0)}% full.</strong> Consider cleaning up unused keys.</div></div></div>` : ''}
  `;
  document.querySelectorAll('[data-db-tab]').forEach(btn => btn.addEventListener('click', () => { S.dbTab = btn.dataset.dbTab; renderDataPanelContent(panel, schema); }));
  $('btnDataDocs')?.addEventListener('click', () => openDocsOverlay('data-api'));
  $('btnDbReadOnlyToggle')?.addEventListener('click', () => { if (offline) { toast('Requires internet to edit', 'warning'); return; } S.dbReadOnly = !S.dbReadOnly; renderDataPanelContent(panel, schema); });
  $('btnDbUndo')?.addEventListener('click', () => { S.dbData = JSON.parse(JSON.stringify(S.dbSnapshot)); S.dbDirty = false; toast('Reverted', 'info'); renderDataPanelContent(panel, schema); });
  $('dbSearch')?.addEventListener('input', debounce((e) => { S.dbSearch = e.target.value; renderDbTree(); }, 150));
  $('btnDbExpand')?.addEventListener('click', () => { if (S.dbExpanded.size > 0) S.dbExpanded.clear(); else Object.keys(S.dbData).forEach(k => S.dbExpanded.add(k)); renderDbTree(); });
  $('btnDbAddKey')?.addEventListener('click', () => {
    const key = prompt('New top-level key:'); if (!key || !key.trim()) return;
    if (S.dbData[key.trim()] !== undefined) { toast('Key exists', 'error'); return; }
    S.dbData[key.trim()] = ''; S.dbExpanded.add(key.trim()); S.dbDirty = true;
    queueDbWrite(key.trim(), ''); renderDataPanelContent(panel, schema);
  });
  $('btnDbCopy')?.addEventListener('click', () => { if (copyToClipboard(JSON.stringify(S.dbData, null, 2))) toast('Copied', 'success', 1200); });
  $('btnDbExport')?.addEventListener('click', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S.dbData, null, 2)], { type: 'application/json' })); a.download = `db_${S.pid}.json`; a.click(); toast('Exported', 'success'); });
  $('dbRawEditor')?.addEventListener('input', (e) => {
    if (offline) return;
    try { S.dbData = JSON.parse(e.target.value); S.dbDirty = true; } catch {}
  });
  if (S.dbTab === 'tree') renderDbTree();
  updateOfflineUI();
}

function renderDbTree() {
  const wrap = $('dbTreeWrap'); if (!wrap) return;
  wrap.innerHTML = '';
  const tree = document.createElement('div');
  tree.className = 'db-tree';
  const data = S.dbData;
  function matchesFilter(path, val) { if (!S.dbSearch) return true; const q = S.dbSearch.toLowerCase(); if (path.toLowerCase().includes(q)) return true; try { return JSON.stringify(val).toLowerCase().includes(q); } catch { return false; } }
  function renderNode(value, key, path, depth, parentIsArray) {
    const hasChildren = value !== null && typeof value === 'object';
    const isArray = Array.isArray(value);
    const isExpanded = S.dbExpanded.has(path);
    const filtered = matchesFilter(path, value);
    if (!filtered && !hasChildren) return null;
    const row = document.createElement('div');
    row.className = `tree-row ${depth > 0 ? 'child' : ''}`;
    row.style.setProperty('--depth', String(depth));
    if (hasChildren) { const toggle = document.createElement('span'); toggle.className = `tree-toggle ${isExpanded ? 'open' : ''}`; toggle.innerHTML = svg('chevronRight', 10, 2.4); toggle.addEventListener('click', () => { if (isExpanded) S.dbExpanded.delete(path); else S.dbExpanded.add(path); renderDbTree(); }); row.appendChild(toggle); }
    else { const sp = document.createElement('span'); sp.className = 'tree-toggle'; row.appendChild(sp); }
    if (key !== '') { const k = document.createElement('span'); k.className = 'tree-key'; k.textContent = key; k.addEventListener('click', () => { copyToClipboard(path); toast(`Copied: ${path}`, 'info', 1400); }); row.appendChild(k); const colon = document.createElement('span'); colon.className = 'tree-colon'; colon.textContent = ':'; row.appendChild(colon); }
    if (hasChildren) { const size = isArray ? value.length : Object.keys(value).length; const badge = document.createElement('span'); badge.className = 'tree-badge'; badge.textContent = isArray ? `[${size}]` : `{${size}}`; row.appendChild(badge); }
    else {
      const type = value === null ? 'null' : typeof value;
      const display = value === null ? 'null' : typeof value === 'string' ? `"${value}"` : String(value);
      const valEl = document.createElement('span'); valEl.className = `tree-value ${type}`; valEl.textContent = display; valEl.title = display;
      if (!S.dbReadOnly && S.online) valEl.addEventListener('dblclick', () => startEditValue(valEl, value, path));
      row.appendChild(valEl);
    }
    if (!S.dbReadOnly && S.online) {
      const actions = document.createElement('div'); actions.className = 'tree-actions';
      if (hasChildren) { const addBtn = document.createElement('button'); addBtn.className = 'tree-act'; addBtn.innerHTML = svg('plus', 10, 2.4); addBtn.title = 'Add'; addBtn.addEventListener('click', (e) => { e.stopPropagation(); const newKey = isArray ? String(value.length) : prompt('New key:'); if (newKey === null) return; if (!isArray && (!newKey || !newKey.trim())) return; const childKey = isArray ? value.length : newKey.trim(); const childPath = path ? `${path}/${childKey}` : String(childKey); setAtPath(S.dbData, childPath, ''); S.dbExpanded.add(path); S.dbDirty = true; queueDbWrite(childPath, ''); renderDbTree(); }); actions.appendChild(addBtn); }
      const copyBtn = document.createElement('button'); copyBtn.className = 'tree-act'; copyBtn.innerHTML = svg('copy', 10, 2.2); copyBtn.title = 'Copy path'; copyBtn.addEventListener('click', (e) => { e.stopPropagation(); copyToClipboard(path); toast(`Copied: ${path}`, 'success', 1200); }); actions.appendChild(copyBtn);
      if (!parentIsArray && key !== '') { const rb = document.createElement('button'); rb.className = 'tree-act'; rb.innerHTML = svg('edit', 10, 2.2); rb.title = 'Rename'; rb.addEventListener('click', (e) => { e.stopPropagation(); const parts = path.split('/'); const oldKey = parts[parts.length - 1]; const newKey = prompt('New key name:', oldKey); if (!newKey || newKey === oldKey || !newKey.trim()) return; const parentPath = parts.slice(0, -1).join('/'); const parent = parentPath ? getAtPath(S.dbData, parentPath) : S.dbData; if (parent && parent[newKey.trim()] !== undefined) { toast('Key exists', 'error'); return; } const v = getAtPath(S.dbData, path); deleteAtPath(S.dbData, path); const newPath = parentPath ? `${parentPath}/${newKey.trim()}` : newKey.trim(); setAtPath(S.dbData, newPath, v); S.dbDirty = true; queueDbWrite(path, null); queueDbWrite(newPath, v); renderDbTree(); }); actions.appendChild(rb); }
      const delBtn = document.createElement('button'); delBtn.className = 'tree-act danger'; delBtn.innerHTML = svg('trash', 10, 2.2); delBtn.title = 'Delete'; delBtn.addEventListener('click', (e) => { e.stopPropagation(); const doDel = () => { deleteAtPath(S.dbData, path); S.dbDirty = true; queueDbWrite(path, null); toast(`Deleted "${key || path}"`, 'info'); renderDbTree(); }; if (hasChildren && ((isArray ? value.length : Object.keys(value).length) > 0)) confirmModal(`Delete "${key}"?`, 'This will remove the whole subtree.', 'Delete', true, doDel); else doDel(); }); actions.appendChild(delBtn);
      row.appendChild(actions);
    }
    const frag = document.createDocumentFragment(); frag.appendChild(row);
    if (hasChildren && isExpanded) { const keys = isArray ? value.map((_, i) => i) : Object.keys(value).sort(); for (const k of keys) { const child = renderNode(value[k], String(k), path ? `${path}/${k}` : String(k), depth + 1, isArray); if (child) frag.appendChild(child); } }
    return frag;
  }
  function startEditValue(valEl, oldValue, path) {
    const input = document.createElement('input');
    input.className = 'tree-value editing';
    input.type = typeof oldValue === 'number' ? 'number' : 'text';
    input.value = oldValue === null ? '' : String(oldValue);
    valEl.replaceWith(input); input.focus(); input.select();
    const commit = () => { let newVal; const raw = input.value; if (typeof oldValue === 'number') newVal = Number(raw); else if (typeof oldValue === 'boolean') newVal = raw === 'true' || raw === '1'; else if (raw === 'null') newVal = null; else newVal = raw; setAtPath(S.dbData, path, newVal); S.dbDirty = true; queueDbWrite(path, newVal); toast(`Updated ${path}`, 'success', 1200); renderDbTree(); };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') { e.preventDefault(); renderDbTree(); } });
    input.addEventListener('blur', () => setTimeout(commit, 100));
  }
  const rootKeys = Object.keys(data).sort();
  if (rootKeys.length === 0) tree.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="empty-state-title">Empty database</div><div class="empty-state-desc">Use "Add key" to create your first entry.</div></div>';
  else {
    for (const k of rootKeys) { const node = renderNode(data[k], k, k, 0, false); if (node) tree.appendChild(node); }
    if (!S.dbReadOnly && S.online) { const addRow = document.createElement('div'); addRow.className = 'tree-add'; addRow.innerHTML = svg('plus', 10, 2.4) + ' Add top-level key'; addRow.addEventListener('click', () => { const key = prompt('New top-level key:'); if (!key || !key.trim()) return; if (S.dbData[key.trim()] !== undefined) { toast('Key exists', 'error'); return; } S.dbData[key.trim()] = ''; S.dbExpanded.add(key.trim()); S.dbDirty = true; queueDbWrite(key.trim(), ''); renderDbTree(); }); tree.appendChild(addRow); }
  }
  wrap.appendChild(tree);
}

function queueDbWrite(path, value) {
  S._dbWriteQueue.set(path, value);
  if (S._dbWriteTimer) clearTimeout(S._dbWriteTimer);
  S._dbWriteTimer = setTimeout(async () => {
    const updates = Array.from(S._dbWriteQueue.entries()).map(([key, value]) => ({ key, value }));
    S._dbWriteQueue.clear();
    if (!updates.length) return;
    try {
      const res = updates.length === 1
        ? await apiFetch(API_HOST + '?action=db/set', { method: 'POST', body: JSON.stringify({ pid: S.pid, key: updates[0].key, value: updates[0].value }) })
        : await apiFetch(API_HOST + '?action=db/batch', { method: 'POST', body: JSON.stringify({ pid: S.pid, updates }) });
      if (res.ok) { S._dbCache = { pid: null, at: 0, data: null }; S.dbSnapshot = JSON.parse(JSON.stringify(S.dbData)); S.dbDirty = false; toast(`Saved ${updates.length} change${updates.length === 1 ? '' : 's'}`, 'success', 800); }
      else toast(res.data?.error || 'Save failed', 'error', 3000);
    } catch { toast('Save failed — check connection', 'error', 3000); }
  }, 800);
}

function getAtPath(obj, path) { const parts = path.split('/').filter(Boolean); let cur = obj; for (const p of parts) { if (cur == null) return undefined; cur = cur[p]; } return cur; }
function setAtPath(obj, path, value) { const parts = path.split('/').filter(Boolean); if (parts.length === 0) return; let cur = obj; for (let i = 0; i < parts.length - 1; i++) { if (cur[parts[i]] == null || typeof cur[parts[i]] !== 'object') cur[parts[i]] = {}; cur = cur[parts[i]]; } cur[parts[parts.length - 1]] = value; }
function deleteAtPath(obj, path) { const parts = path.split('/').filter(Boolean); if (parts.length === 0) return; let cur = obj; for (let i = 0; i < parts.length - 1; i++) { if (cur[parts[i]] == null) return; cur = cur[parts[i]]; } if (Array.isArray(cur)) cur.splice(Number(parts[parts.length - 1]), 1); else delete cur[parts[parts.length - 1]]; }

// ═══════════════════════════════════════════════════════════
// SECRETS PANEL
// ═══════════════════════════════════════════════════════════
async function renderSecretsPanel(panel) {
  if (!gate(panel, { label: 'Secrets' })) return;
  if (!S.isOwner) { panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('lock', 'Owner only', 'Only the project owner can view and manage secrets.')}</div></div>`; return; }
  panel.innerHTML = skeletonCard(4);
  if (!S.online) {
    try {
      const meta = await IDB.getProjectMeta(S.pid);
      const cached = meta.cachedSecretsList;
      if (cached) {
        renderSecretsCached(panel, cached);
        return;
      }
    } catch {}
  }
  const res = await apiFetch(API_HOST + '?action=secrets/list&pid=' + encodeURIComponent(S.pid));
  if (!res.ok || !res.data?.success) { panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('alertCircle', "Couldn't load secrets", res.data?.error || 'Try refreshing.')}</div></div>`; return; }
  try { await IDB.setProjectMeta(S.pid, { cachedSecretsList: { keys: res.data.keys || [], count: res.data.count || 0, at: Date.now() } }); } catch {}
  renderSecretsContent(panel, res.data);
}

function renderSecretsCached(panel, cached) {

}

async function toggleSecretVisibility(key, current) {
  const next = current === 'public' ? 'private' : 'public';
  if (next === 'public') {
    const ok = await new Promise((resolve) => {
      openModal(`<div class="modal-title" style="color:var(--theme-warning);">${svg('alert', 16, 2.4)} Make "${escapeHTML(key)}" public?</div><div class="modal-desc" style="line-height:1.6;">Public secrets are injected as <code class="mono">window.__SECRETS__</code>. <strong>Anyone can read this value.</strong><br><br>Only use for publishable keys.</div><div class="modal-actions"><button class="btn btn-secondary" id="visCancelBtn" type="button">Cancel</button><button class="btn btn-danger" id="visConfirmBtn" type="button">Make public</button></div>`);
      $('visCancelBtn').addEventListener('click', () => { closeModal(); resolve(false); });
      $('visConfirmBtn').addEventListener('click', () => { closeModal(); resolve(true); });
    });
    if (!ok) return;
  }
  const res = await apiFetch(API_HOST + '?action=secrets/visibility', { method: 'POST', body: JSON.stringify({ pid: S.pid, key, visibility: next }) });
  if (!res.ok || !res.data?.success) { toast(res.data?.error || 'Failed', 'error'); return; }
  toast(`Visibility: ${next}`, 'success'); renderPanel();
}

async function openSecretEditor(keyToEdit) {
  const isEdit = !!keyToEdit;
  let currentNote = '', currentValue = '', currentVisibility = 'private';
  if (isEdit) {
    const res = await apiFetch(API_HOST + '?action=secrets/get&pid=' + encodeURIComponent(S.pid));
    if (res.ok && res.data?.success && res.data.entries?.[keyToEdit]) {
      const e = res.data.entries[keyToEdit];
      currentValue = e.value || ''; currentNote = e.note || ''; currentVisibility = e.visibility || 'private';
    }
  }
  openModal(`
    <div class="modal-title">${isEdit ? 'Edit secret' : 'New secret'}</div>
    <div class="modal-desc">Encrypted at rest.</div>
    <div class="field"><label class="field-label">Key (UPPER_SNAKE_CASE)</label><input class="input mono" id="secretKey" value="${escapeAttr(keyToEdit || '')}" ${isEdit ? 'readonly' : ''} placeholder="OPENAI_API_KEY"></div>
    <div class="field"><label class="field-label">Value</label><div class="secret-value-row"><input class="input mono" id="secretValue" type="password" value="${escapeAttr(currentValue)}" placeholder="sk-..."><button class="btn btn-secondary btn-icon" type="button" id="toggleSecretValue">${svg('eye', 12, 2.2)}</button></div></div>
    <div class="field"><label class="field-label">Note (optional)</label><input class="input" id="secretNote" value="${escapeAttr(currentNote)}" maxlength="200"></div>
    <div class="field"><label class="field-label">Visibility</label><div style="display:flex;gap:6px;"><label style="flex:1;padding:8px;border:1px solid var(--theme-card-border);border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;${currentVisibility === 'private' ? 'border-color:var(--theme-primary);background:var(--theme-primary-soft);' : ''}"><input type="radio" name="secretVis" value="private" ${currentVisibility === 'private' ? 'checked' : ''}><div><div style="font-size:11px;font-weight:700;">Private</div><div style="font-size:10px;color:var(--theme-text-tertiary);">ENV only</div></div></label><label style="flex:1;padding:8px;border:1px solid var(--theme-card-border);border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;${currentVisibility === 'public' ? 'border-color:var(--theme-primary);background:var(--theme-primary-soft);' : ''}"><input type="radio" name="secretVis" value="public" ${currentVisibility === 'public' ? 'checked' : ''}><div><div style="font-size:11px;font-weight:700;">Public</div><div style="font-size:10px;color:var(--theme-text-tertiary);">Also browser</div></div></label></div></div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="secretSave">${isEdit ? 'Update' : 'Create'}</button></div>
  `);
  $('toggleSecretValue')?.addEventListener('click', () => { const i = $('secretValue'); i.type = i.type === 'password' ? 'text' : 'password'; });
  document.querySelectorAll('input[name="secretVis"]').forEach(radio => {
    radio.addEventListener('change', () => {
      document.querySelectorAll('input[name="secretVis"]').forEach(r => {
        const label = r.closest('label');
        if (r.checked) { label.style.borderColor = 'var(--theme-primary)'; label.style.background = 'var(--theme-primary-soft)'; }
        else { label.style.borderColor = 'var(--theme-card-border)'; label.style.background = 'transparent'; }
      });
    });
  });
  $('secretSave')?.addEventListener('click', async () => {
    const btn = $('secretSave');
    const key = $('secretKey').value.trim();
    const value = $('secretValue').value;
    const note = $('secretNote').value.trim();
    const visibility = document.querySelector('input[name="secretVis"]:checked')?.value || 'private';
    if (!key) { toast('Key required', 'error'); return; }
    if (!/^[A-Z][A-Z0-9_]{0,127}$/.test(key)) { toast('UPPER_SNAKE_CASE required', 'error'); return; }
    if (!value && !isEdit) { toast('Value required', 'error'); return; }
    await withButtonLoader(btn, async () => {
      const res = await apiFetch(API_HOST + '?action=secrets/set', { method: 'POST', body: JSON.stringify({ pid: S.pid, key, value, note: note || null, visibility }) });
      if (!res.ok || !res.data?.success) { toast(res.data?.error || 'Failed', 'error'); return; }
      closeModal(); toast(isEdit ? 'Secret updated' : 'Secret created', 'success'); renderPanel();
    });
  });
}

function confirmDeleteSecret(key) {
  confirmModal(`Delete ${key}?`, 'The deployed site will lose access immediately.', 'Delete', true, async () => {
    const res = await apiFetch(API_HOST + '?action=secrets/delete', { method: 'POST', body: JSON.stringify({ pid: S.pid, key }) });

}

async function toggleSecretInjection() {
  const current = S.project?.visibility?.secrets || 'off';
  const next = current === 'inject' ? 'private' : 'inject';
  if (next === 'inject') {
    const ok = await new Promise(resolve => {

async function readNotes() {
  if (S.notesCache) return S.notesCache;
  try {
    const file = await IDB.getFile(S.pid, NOTES_PATH);
    if (!file || !file.content) { S.notesCache = { version: 1, notes: [] }; return S.notesCache; }
    const parsed = JSON.parse(file.content);
    if (!parsed || !Array.isArray(parsed.notes)) { S.notesCache = { version: 1, notes: [] }; return S.notesCache; }
    S.notesCache = { version: parsed.version || 1, notes: parsed.notes };
    return S.notesCache;
  } catch { S.notesCache = { version: 1, notes: [] }; return S.notesCache; }
}

async function writeNotes(data) {
  if (data.notes.length > NOTES_MAX_COUNT) throw new Error(`Too many notes (max ${NOTES_MAX_COUNT}).`);
  for (const n of data.notes) {
    if (estimateBytes(n.body || '') > NOTES_MAX_BODY_BYTES) throw new Error(`Note "${n.title || 'Untitled'}" exceeds ${formatBytes(NOTES_MAX_BODY_BYTES)}.`);
  }
  const json = JSON.stringify(data, null, 2);
  await IDB.putFile(S.pid, NOTES_PATH, json);
  S.notesCache = data;
  try { const project = await IDB.getProject(S.pid); if (project) { project.updatedAt = Date.now(); await IDB.putProject(project); } } catch {}
  if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
    apiFetch(API_HOST + '?action=project/sync-back', { method: 'POST', body: JSON.stringify({ pid: S.pid, files: { [NOTES_PATH]: json } }) }).catch(() => {});
  } else {
    await enqueueSync('file-save', { path: NOTES_PATH, content: json });
  }
  bumpTabCount('notes', data.notes.length);
}

async function renderNotesPanel(panel) {
  if (!gate(panel, { label: 'Notes' })) return;
  panel.innerHTML = skeletonCard(4);
  await new Promise(r => setTimeout(r, 30));
  const data = await readNotes();
  bumpTabCount('notes', data.notes.length);
  const sorted = [...data.notes].sort((a, b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  });
  panel.innerHTML = `
    <div class="panel-section">
      ${panelSectionHeader('Notes', 'file-text', `${sorted.length} note${sorted.length === 1 ? '' : 's'}`)}
      <div class="card">
        <div class="card-header">
          <div class="card-title">${svg('file-text', 13, 2.2)} All notes</div>
          ${S.isEditor ? `<button class="btn btn-sm btn-primary" id="btnNewNote">${svg('plus', 10, 2.4)} New</button>` : ''}
        </div>
        <div class="card-body tight">
          ${sorted.length === 0
            ? emptyState('file-text', 'No notes yet', S.isEditor ? 'Jot down ideas, snippets, or TODOs.' : 'The owner hasn\'t added any notes.', S.isEditor ? `<button class="btn btn-primary btn-sm" id="btnFirstNote" style="margin-top:8px;">${svg('plus', 10, 2.4)} New note</button>` : '')
            : `<div class="row-list">${sorted.map(n => `<div class="row-item" data-note-row="${escapeAttr(n.id)}" style="cursor:pointer;"><div class="row-icon" style="background:${noteAccentColor(n.color)}22;color:${noteAccentColor(n.color)};">${svg('file-text', 13, 2.2)}</div><div class="row-content"><div class="row-title">${n.pinned ? `<span style="color:var(--theme-primary);margin-right:4px;">${svg('bookmark', 10, 2.4)}</span>` : ''}${escapeHTML(n.title || 'Untitled')}</div><div class="row-sub">${escapeHTML((n.body || '').slice(0, 100).replace(/\s+/g, ' ') || 'Empty note')} · ${timeAgo(n.updatedAt || n.createdAt || 0)}</div></div></div>`).join('')}</div>`}
        </div>
      </div>
    </div>
  `;
  $('btnNewNote')?.addEventListener('click', () => openNoteEditor(null));
  $('btnFirstNote')?.addEventListener('click', () => openNoteEditor(null));
  panel.querySelectorAll('[data-note-row]').forEach(el => el.addEventListener('click', () => openNoteEditor(el.dataset.noteRow)));
}

async function openNoteEditor(noteId) {
  if (!S.currentProject && !S.pid) return;
  if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }
  const data = await readNotes();
  const existing = noteId ? data.notes.find(n => n.id === noteId) : null;
  const note = existing || {
    id: `n_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
    title: '', body: '', color: 'amber', pinned: false,
    createdAt: Date.now(), updatedAt: Date.now(),
  };
  S._activeNoteId = note.id;
  const startInEdit = !existing || !(note.body || '').trim();
  const overlay = document.createElement('div');
  overlay.className = 'note-editor-overlay';
  overlay.innerHTML = `
    <div class="note-editor-header">
      <button class="note-editor-back" type="button" aria-label="Back">${svg('chevron-left', 16, 2.4)}</button>
      <input class="note-editor-title" type="text" placeholder="Note title" maxlength="120" value="${escapeAttr(note.title || '')}">
      <div class="note-editor-title-readonly hidden">${escapeHTML(note.title || 'Untitled')}</div>
      <div class="note-editor-actions">
        <button class="note-editor-action note-mode-btn" data-act="mode" type="button" aria-label="Edit">${svg('edit', 14, 2.2)}</button>
        <button class="note-editor-action ${note.pinned ? 'active' : ''}" data-act="pin" type="button" aria-label="Pin">${svg('bookmark', 14, 2.2)}</button>
        <button class="note-editor-action" data-act="color" type="button" aria-label="Color" style="color:${noteAccentColor(note.color)}">${svg('droplet', 14, 2.2)}</button>
        ${existing ? `<button class="note-editor-action danger" data-act="delete" type="button" aria-label="Delete">${svg('trash', 14, 2.2)}</button>` : ''}
      </div>
    </div>
    <div class="note-format-bar hidden"></div>
    <textarea class="note-editor-body" placeholder="Start writing… Markdown supported." spellcheck="false">${escapeHTML(note.body || '')}</textarea>
    <div class="note-editor-body-readonly hidden"></div>
    <div class="note-editor-status">
      <span class="note-editor-words">0 words</span>
      <span class="note-editor-save">Saved</span>
    </div>
  `;
  const titleEl = overlay.querySelector('.note-editor-title');
  const titleReadonly = overlay.querySelector('.note-editor-title-readonly');
  const bodyEl = overlay.querySelector('.note-editor-body');
  const bodyReadonly = overlay.querySelector('.note-editor-body-readonly');
  const wordsEl = overlay.querySelector('.note-editor-words');
  const saveEl = overlay.querySelector('.note-editor-save');
  const modeBtn = overlay.querySelector('[data-act="mode"]');
  const formatBar = overlay.querySelector('.note-format-bar');
  let currentMode = startInEdit ? 'edit' : 'read';
  let autosaveTimer = null;
  let dirty = false;
  let isDeleted = false;

  function updateWords() {
    const words = (bodyEl.value.trim().match(/\S+/g) || []).length;
    wordsEl.textContent = `${words} word${words === 1 ? '' : 's'}`;
  }

  function setMode(mode) {
    currentMode = mode;
    const isEdit = mode === 'edit';
    titleEl.classList.toggle('hidden', !isEdit);
    titleReadonly.classList.toggle('hidden', isEdit);
    bodyEl.classList.toggle('hidden', !isEdit);
    bodyReadonly.classList.toggle('hidden', isEdit);
    formatBar.classList.toggle('hidden', !isEdit);
    modeBtn.innerHTML = svg(isEdit ? 'check' : 'edit', 14, 2.2);
    modeBtn.classList.toggle('active', isEdit);
    if (isEdit) { setTimeout(() => bodyEl.focus(), 50); }
    else {
      titleReadonly.textContent = titleEl.value || 'Untitled';
      bodyReadonly.innerHTML = renderMarkdownSafe(bodyEl.value || '');
      if (dirty) doSave();
    }
  }

  function buildFormatBar() {
    const groups = [
      [{ id: 'h1', prefix: '# ', block: true }, { id: 'h2', prefix: '## ', block: true }, { id: 'h3', prefix: '### ', block: true }],
      [{ id: 'bold', wrap: ['**', '**'] }, { id: 'italic', wrap: ['*', '*'] }, { id: 'strike', wrap: ['~~', '~~'] }],
      [{ id: 'ul', prefix: '- ', block: true }, { id: 'ol', prefix: '1. ', block: true }, { id: 'quote', prefix: '> ', block: true }],
      [{ id: 'link', wrap: ['[', '](https://)'] }, { id: 'image', wrap: ['![', '](https://)'] }, { id: 'code', wrap: ['`', '`'] }],
    ];
    const iconMap = { h1: 'file-text', h2: 'file-text', h3: 'file-text', bold: 'edit', italic: 'edit', strike: 'edit', ul: 'list', ol: 'list', quote: 'file-text', link: 'link', image: 'image', code: 'code' };
    formatBar.innerHTML = groups.map(group => `<div class="note-format-group">${group.map(btn => `<button class="note-format-btn" type="button" data-fmt='${JSON.stringify(btn)}' title="${btn.id}">${svg(iconMap[btn.id] || 'code', 13, 2.2)}</button>`).join('')}</div>`).join('');
    formatBar.querySelectorAll('.note-format-btn').forEach(btn => {
      btn.addEventListener('mousedown', (e) => e.preventDefault());
      btn.addEventListener('click', () => applyMarkdown(JSON.parse(btn.dataset.fmt)));
    });
  }

  function applyMarkdown(action) {
    const start = bodyEl.selectionStart;
    const end = bodyEl.selectionEnd;
    const value = bodyEl.value;
    const selected = value.slice(start, end);
    if (action.block) {
      const lineStart = value.lastIndexOf('\n', start - 1) + 1;
      bodyEl.value = value.slice(0, lineStart) + action.prefix + value.slice(lineStart);
      bodyEl.selectionStart = start + action.prefix.length;
      bodyEl.selectionEnd = end + action.prefix.length;
    } else if (action.wrap) {
      const [before, after] = action.wrap;
      bodyEl.value = value.slice(0, start) + before + selected + after + value.slice(end);
      bodyEl.selectionStart = start + before.length;
      bodyEl.selectionEnd = start + before.length + selected.length;
    }
    note.body = bodyEl.value;
    updateWords();
    markDirty();
    bodyEl.focus();
  }

  function markDirty() {
    if (!dirty) { dirty = true; saveEl.textContent = 'Editing…'; saveEl.classList.add('dirty'); }
    if (autosaveTimer) clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(doSave, 800);
  }

  async function doSave() {
    if (!dirty || isDeleted) return;
    try {
      if (!note.title.trim()) {
        const m = bodyEl.value.match(/^#{1,6}\s+(.+)$/m);
        if (m) { note.title = m[1].trim().slice(0, 120); titleEl.value = note.title; }
      }
      note.title = titleEl.value.trim();
      note.body = bodyEl.value;
      note.updatedAt = Date.now();
      const fresh = await readNotes();
      const idx = fresh.notes.findIndex(n => n.id === note.id);
      if (idx >= 0) fresh.notes[idx] = { ...note };
      else fresh.notes.push({ ...note });
      await writeNotes(fresh);
      dirty = false;
      saveEl.textContent = 'Saved';
      saveEl.classList.remove('dirty');
    } catch (err) {
      saveEl.textContent = 'Save failed';
      saveEl.classList.add('error');
      toast(err.message || "Couldn't save", 'error', 4000);
    }
  }

  function teardown() {
    if (autosaveTimer) clearTimeout(autosaveTimer);
    overlay.classList.remove('open');
    setTimeout(() => overlay.remove(), 320);
    S._activeNoteId = null;
  }

  async function closeMe() {
    if (dirty && !isDeleted) await doSave();
    teardown();
    if (S.activeTab === 'overview' || S.activeTab === 'notes') renderPanel();
  }

  async function deleteMe() {
    confirmModal('Delete this note?', "Can't be undone.", 'Delete', true, async () => {
      isDeleted = true;
      const fresh = await readNotes();
      fresh.notes = fresh.notes.filter(n => n.id !== note.id);
      await writeNotes(fresh);
      toast('Note deleted', 'info');
      teardown();
      renderPanel();
    });
  }

  overlay.querySelector('.note-editor-back').addEventListener('click', closeMe);
  titleEl.addEventListener('input', () => { note.title = titleEl.value; markDirty(); });
  bodyEl.addEventListener('input', () => { note.body = bodyEl.value; updateWords(); markDirty(); });
  modeBtn.addEventListener('click', () => setMode(currentMode === 'read' ? 'edit' : 'read'));
  overlay.querySelector('[data-act="pin"]')?.addEventListener('click', (e) => { note.pinned = !note.pinned; e.currentTarget.classList.toggle('active', note.pinned); markDirty(); });
  overlay.querySelector('[data-act="color"]')?.addEventListener('click', (e) => {
    const pop = document.createElement('div');
    pop.className = 'note-color-popover';
    Object.entries(NOTE_COLORS).forEach(([name, hex]) => {
      const sw = document.createElement('button');
      sw.className = 'note-color-swatch' + (note.color === name ? ' active' : '');
      sw.type = 'button';
      sw.style.background = hex;
      sw.addEventListener('click', () => { note.color = name; e.currentTarget.style.color = hex; markDirty(); pop.remove(); });
      pop.appendChild(sw);
    });
    const rect = e.currentTarget.getBoundingClientRect();
    pop.style.top = (rect.bottom + 4) + 'px';
    pop.style.right = (window.innerWidth - rect.right) + 'px';
    document.body.appendChild(pop);
    setTimeout(() => {
      document.addEventListener('click', function handler(ev) {
        if (!pop.contains(ev.target) && ev.target !== e.currentTarget) { pop.remove(); document.removeEventListener('click', handler); }
      });
    }, 50);
  });
  overlay.querySelector('[data-act="delete"]')?.addEventListener('click', deleteMe);
  document.body.appendChild(overlay);
  buildFormatBar();
  requestAnimationFrame(() => { overlay.classList.add('open'); setMode(currentMode); updateWords(); });
  setTimeout(() => { if (currentMode === 'edit') { if (!note.title) titleEl.focus(); else bodyEl.focus(); } }, 150);
  const escHandler = (e) => { if (e.key === 'Escape') { e.preventDefault(); closeMe(); document.removeEventListener('keydown', escHandler); } };
  document.addEventListener('keydown', escHandler);
}

function renderMarkdownSafe(text) {
  let src = String(text ?? '');
  const codeBlocks = [];
  src = src.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (m, lang, body) => { const idx = codeBlocks.length; codeBlocks.push({ lang, body }); return `\u0000CODE${idx}\u0000`; });
  src = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const lines = src.split('\n');
  const out = [];
  let inUl = false, inOl = false, inBq = false;
  const closeLists = () => { if (inUl) { out.push('</ul>'); inUl = false; } if (inOl) { out.push('</ol>'); inOl = false; } };
  const closeBq = () => { if (inBq) { out.push('</blockquote>'); inBq = false; } };
  const inlineFmt = (s) => {
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    return s;
  };
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    if (/^\s*\u0000CODE\d+\u0000\s*$/.test(raw)) { closeLists(); closeBq(); const match = raw.match(/\u0000CODE(\d+)\u0000/); const cb = codeBlocks[+match[1]]; out.push(`<pre><code${cb.lang ? ` class="language-${cb.lang}"` : ''}>${cb.body.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`); continue; }
    if (/^\s*$/.test(raw)) { closeLists(); closeBq(); continue; }
    const h = raw.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeLists(); closeBq(); out.push(`<h${h[1].length}>${inlineFmt(h[2])}</h${h[1].length}>`); continue; }
    if (/^---+$/.test(raw.trim())) { closeLists(); closeBq(); out.push('<hr>'); continue; }
    const bq = raw.match(/^>\s?(.*)$/);
    if (bq) { closeLists(); if (!inBq) { out.push('<blockquote>'); inBq = true; } out.push(`<p>${inlineFmt(bq[1])}</p>`); continue; }
    else closeBq();
    const ul = raw.match(/^\s*[-*]\s+(.*)$/);
    if (ul) { closeLists(); if (!inUl) { out.push('<ul>'); inUl = true; } out.push(`<li>${inlineFmt(ul[1])}</li>`); continue; }
    else if (inUl) { out.push('</ul>'); inUl = false; }
    const ol = raw.match(/^\s*\d+\.\s+(.*)$/);
    if (ol) { if (!inOl) { out.push('<ol>'); inOl = true; } out.push(`<li>${inlineFmt(ol[1])}</li>`); continue; }
    else if (inOl) { out.push('</ol>'); inOl = false; }
    out.push(`<p>${inlineFmt(raw)}</p>`);
  }
  closeLists(); closeBq();
  return out.join('\n');
}

function axisLabel(axis) { return { profile: 'Show in profile', liveSite: 'Live site link', code: 'Code viewer', languages: 'Language breakdown', db: 'JSON database API' }[axis] || axis; }
function axisDesc(axis) { return { profile: 'Profile page lists this project', liveSite: 'Show "Visit live site"', code: 'Allow viewing source', languages: 'Show language %', db: 'Allow external DB reads' }[axis] || ''; }

async function toggleVisibility(axis, btn) {
  if (!S.isOwner) { toast('Owner only', 'warning'); return; }
  if (!S.online) { toast('Requires internet', 'warning'); return; }
  if (S.syncState !== 'synced') { toast('Push to server first', 'warning'); return; }
  const current = S.project.visibility?.[axis];
  const next = current === 'public' ? 'private' : 'public';
  btn.classList.toggle('on', next === 'public');
  try {
    const res = await apiFetch(API_HOST + '?action=visibility', { method: 'POST', body: JSON.stringify({ pid: S.pid, visibility: { [axis]: next } }) });
    if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
    S.project.visibility = { ...S.project.visibility, [axis]: next };
    cacheProject(S.project);
    toast(next, 'success', 1200);
  } catch (err) { btn.classList.toggle('on', current === 'public'); toast(err.message || 'Update failed', 'error'); }
}

async function generateApiKey() {

function confirmClearVersions() {
  confirmModal('Clear manual commits?', 'Deploy snapshots are kept.', 'Clear', true, async () => {
    showLoading('Clearing', '');
    try {
      if (!S.isLocalOnly && S.session && S.online && S.syncState === 'synced') {
        const res = await apiFetch(API_HOST + '?action=versions/clear', { method: 'POST', body: JSON.stringify({ pid: S.pid }) });
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
      }
      const versions = await IDB.listVersions(S.pid);
      for (const v of versions) { if (v.kind === 'deploy') continue; await dbWrap(dbTx('versions', 'readwrite').delete(v.vid)); }
      hideLoading(); toast('Versions cleared', 'success'); renderPanel();
    } catch (err) { hideLoading(); toast(err.message || 'Failed', 'error'); }
  });
}

function clearLocalCache() {
  try { localStorage.removeItem(STORAGE.cache + '.' + S.pid); sessionStorage.removeItem(STORAGE.expanded + '.' + S.pid); S._dbCache = { pid: null, at: 0, data: null }; S.notesCache = null; toast('Cache cleared', 'success'); }
  catch { toast('Could not clear', 'error'); }
}

function confirmDeleteProject() {
  openModal(`<div class="modal-title">Delete project?</div><div class="modal-desc">Type "${escapeHTML(S.project.name)}" to confirm.</div><div class="field"><input class="input" id="deleteConfirmInput" placeholder="Project name"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-danger" id="deleteConfirmBtn" disabled>Delete</button></div>`);
  $('deleteConfirmInput').addEventListener('input', (e) => { $('deleteConfirmBtn').disabled = e.target.value !== S.project.name; });
  $('deleteConfirmBtn').addEventListener('click', async () => {
    showLoading('Deleting', '');
    try {
      if (S.session && !S.isLocalOnly && S.online && S.syncState === 'synced') {
        const res = await apiFetch(API_HOST + '?action=projects/delete', { method: 'POST', body: JSON.stringify({ pid: S.pid }) });
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
      }
      await IDB.deleteProject(S.pid);
      try { localStorage.removeItem(STORAGE.cache + '.' + S.pid); localStorage.removeItem(STORAGE.lastTab + '.' + S.pid); sessionStorage.removeItem(STORAGE.expanded + '.' + S.pid); } catch {}
      hideLoading(); toast('Deleted', 'success');
      setTimeout(() => { window.location.href = '/projects'; }, 800);
    } catch (err) { hideLoading(); toast(err.message || 'Delete failed', 'error'); }
  });
}

    <div style="margin-bottom:8px;">${renderUrlDisplay(`${SHORT_URL}/${shortlink.key}`, { label: 'short' })}</div>

function wireShortlinkHandlers(panel) {
  $('btnClaimShortlink')?.addEventListener('click', () => {
    const input = $('shortlinkInput');
    const value = (input?.value || '').trim().toLowerCase();
    if (!value) { toast('Enter a short link name', 'error'); return; }
    if (!/^[a-z][a-z0-9]{2,29}$/.test(value)) { toast('3-30 chars, lowercase, starts with letter', 'error'); return; }
    claimShortlink(value);
  });
  $('shortlinkInput')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnClaimShortlink')?.click(); });
  $('btnChangeShortlink')?.addEventListener('click', () => {
    const cur = (S.shortlink?.key || '').slice(0, 30);
    openModal(`
      <div class="modal-title">Change short link</div>
      <div class="modal-desc">Current: ${escapeHTML(SHORT_URL.replace(/^https?:\/\//, ''))}/${escapeHTML(cur)}</div>
      <div class="field"><label class="field-label">New name</label><input class="input mono" id="shortlinkNewInput" value="${escapeAttr(cur)}" maxlength="30"></div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="shortlinkNewSubmit">Change</button></div>
    `);
    $('shortlinkNewSubmit')?.addEventListener('click', () => {
      const v = ($('shortlinkNewInput')?.value || '').trim().toLowerCase();
      if (!/^[a-z][a-z0-9]{2,29}$/.test(v)) { toast('Invalid name', 'error'); return; }
      closeModal();
      claimShortlink(v, true);
    });
  });
  $('btnReleaseShortlink')?.addEventListener('click', releaseShortlink);
}

async function claimShortlink(baseName, confirmed = false) {
  if (!S.online) { toast('Requires internet', 'warning'); return; }
  if (!S.session) { toast('Sign in first', 'warning'); return; }
  const payload = {
    pid: S.pid,
    baseName,
    strategy: 'custom',
    confirmed: !!confirmed,
  };
  const res = await apiFetch(API_HOST + '?action=shortlink/claim', { method: 'POST', body: JSON.stringify(payload) });
  if (res.status === 409 && Array.isArray(res.data?.suggestions)) {
    showShortlinkCollisionModal(baseName, res.data.suggestions, confirmed);
    return;
  }
  if (!res.ok || !res.data?.success) {
    toast(res.data?.error || 'Claim failed', 'error', 4000);
    return;
  }
  S.shortlink = { ...res.data, hasShortlink: true, key: res.data.key, _at: Date.now() };
  S.project.shortKey = res.data.key;
  S.project.shortUrl = res.data.shortUrl;
  try { await IDB.setProjectMeta(S.pid, { cachedShortlink: S.shortlink }); } catch {}
  toast(`Short link: ${res.data.shortUrl}`, 'success', 3000);
  renderPanel();
}

function showShortlinkCollisionModal(baseName, suggestions, confirmed) {
  const picked = suggestions.slice(0, 3);
  openModal(`
    <div class="modal-title">Short link taken</div>
    <div class="modal-desc">"${escapeHTML(baseName)}" is already in use. Pick one of these:</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;">
      ${picked.map(s => `<button class="btn btn-secondary" data-pick="${escapeAttr(s)}" style="justify-content:flex-start;font-family:var(--font-mono);font-size:12px;">${svg('link', 12, 2.2)} ${escapeHTML(SHORT_URL.replace(/^https?:\/\//, ''))}/${escapeHTML(s)}</button>`).join('')}
      <button class="btn btn-ghost" id="shortlinkTryAnother" style="justify-content:flex-start;font-size:12px;">Try a different name</button>
    </div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>
  `);
  document.querySelectorAll('[data-pick]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.pick;
      closeModal();
      claimShortlink(name, true);
    });
  });
  $('shortlinkTryAnother')?.addEventListener('click', () => {
    closeModal();
    setTimeout(() => { $('shortlinkInput')?.focus(); }, 300);
  });
}

async function releaseShortlink() {
  if (!S.online) { toast('Requires internet', 'warning'); return; }
  const cur = S.shortlink?.key || S.project.shortKey;
  if (!cur) { toast('No short link', 'info'); return; }
  confirmModal(
    `Release ${SHORT_URL.replace(/^https?:\/\//, '')}/${cur}?`,
    'The short link will stop working immediately. Anyone visiting it will see a 404.',
    'Release',
    true,
    async () => {
      showLoading('Releasing', '');
      try {
        const res = await apiFetch(API_HOST + '?action=shortlink/release&pid=' + encodeURIComponent(S.pid), { method: 'DELETE' });
        hideLoading();
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Release failed');
        S.shortlink = null;
        S.project.shortKey = null;
        S.project.shortUrl = null;
        try { await IDB.setProjectMeta(S.pid, { cachedShortlink: null }); } catch {}
        toast('Short link released', 'success');
        renderPanel();
      } catch (err) { hideLoading(); toast(err.message || 'Release failed', 'error'); }
    }
  );
}

  async function generateCoverViaFlier({ template = 'browser-frame', headline = '', subheadline = '', seed = null, iconUrl = null }) {
    if (!S.online) throw new Error('Requires internet');
    if (!S.session) throw new Error('Sign in to generate covers');
    const palette = pickPaletteSeed(seed || S.pid);
    const payload = {
      mode: 'upload', type: 'template', template, size: '1200x630', seed: seed || S.pid,
      data: { text: { kicker: S.project?.slug ? `@${S.project.slug}` : '', headline: headline || S.project?.name || 'Untitled', subheadline: subheadline || (S.project?.description || '').slice(0, 160) }, style: { variant: 'dark', colors: { primary: palette.primary, accent: palette.accent }, scene: 'auto', scenePalette: 'auto', sceneOpacity: 0.85, watermark: true }, images: iconUrl ? { primary: { url: iconUrl } } : {} },
      upload: { name: `og_${S.pid}_${Date.now()}` },
    };
    const res = await apiFetch(API_FLIER + '?action=generate', { method: 'POST', body: JSON.stringify(payload) });
    if (!res.ok || !res.data?.success) { if (res.status === 429) throw new Error('Daily limit reached'); throw new Error(`Image generation failed: ${res.data?.error || res.status}`); }
    const url = res.data.url || res.data.display_url;
    if (!url) throw new Error('No URL returned');
    return url;
  }

      $('btnSyncNow')?.addEventListener('click', () => promoteLocalProject());
      return false;
    }
    if (requiresAuth && !S.session) {
      panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('key', `${label} needs an account`, 'Sign in to access this tab.', `<a class="btn btn-primary" href="/register?next=${encodeURIComponent(location.pathname + location.search)}" style="margin-top:8px;">Sign in</a>`)}</div></div>`;
      return false;
    }

      panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('wifi', `${label} needs internet`, 'Reconnect to load this data.')}</div></div>`;

  'getting-started': { title: 'Getting started', body: `
<h2>What is Folio?</h2>
<p>Mobile-first code editor with real deployment. Write files, deploy, and get a live URL plus a short link in one tap. Your project runs on its own domain, installs as a PWA, and can call external APIs from a sandboxed server runtime.</p>
<h2>Your project URLs</h2>
<table class="db-table">
  <thead><tr><th>What</th><th>URL</th><th>Used for</th></tr></thead>
  <tbody>
    <tr><td>Live site</td><td><code class="mono">foliosites.vercel.app/{username}/project/{slug}/</code></td><td>The actual deployed website</td></tr>
    <tr><td>Share page</td><td><code class="mono">foliosites.vercel.app/{username}/{slug}</code></td><td>Info card to share — name, description, "Visit live site" button</td></tr>
    <tr><td>Short link</td><td><code class="mono">folio.xo.je/{key}</code></td><td>Redirects straight to the live site</td></tr>
    <tr><td>Your profile</td><td><code class="mono">foliosites.vercel.app/{username}</code></td><td>Public page listing your projects</td></tr>
  </tbody>
</table>
<p>The share page and live site are controlled separately in <strong>Settings → Visibility</strong>. The short link is auto-created on your first deploy. All three keep working across re-deploys — only the destination updates.</p>
<h2>Your first deploy</h2>
<ol>
  <li>Create a project</li>
  <li>Add an <code class="mono">index.html</code> file</li>
  <li>Click <strong>Deploy</strong></li>
  <li>Copy your live URL + short link from the result bar</li>
</ol>
<h2>Calling your API</h2>
<p>Any file in <code class="mono">api/</code> becomes a callable route. There is one URL form to remember:</p>
<pre><code>https://foliosites.vercel.app/{username}/project/{slug}/api/{route}</code></pre>
<p>If your HTML is served from your own live site, use the relative form:</p>
<pre><code>const res = await fetch("/{username}/project/{slug}/api/hello", { method: "POST" });
const { message } = await res.json();</code></pre>
<p>Same route, no full URL needed. Works from your deployed frontend and from any external tool.</p>
<h2>First API route</h2>
<pre><code>// api/hello.js
return { message: "Hello from the server!" };</code></pre>
<p>Deploy, then call it. Whatever your script returns becomes the response body. No handler, no <code class="mono">res.json()</code> — just <code class="mono">return</code>.</p>
<h2>Wrap every script</h2>
<p>Always close with a fallback return. If a branch falls through without returning, the response body is the string <code class="mono">"null"</code>.</p>
<pre><code>const body = (REQ.body && typeof REQ.body === "object") ? REQ.body : {};
const action = typeof body.action === "string" ? body.action : "";
try {
  if (action === "hello") return { message: "hi" };
  return { __status: 400, error: "Unknown action: " + action };
} catch (e) {
  return { __status: 500, error: "Script error: " + e.message };
}</code></pre>
` },

  'project-setup': { title: 'Project setup', body: `
<h2>Visibility</h2>
<p>Five independent switches in <strong>Settings</strong>. Each controls a different surface — turning one off doesn't affect the others.</p>
<table class="db-table">
  <thead><tr><th>Switch</th><th>Controls</th></tr></thead>
  <tbody>
    <tr><td><strong>Profile</strong></td><td>Whether your share page (<code class="mono">foliosites.vercel.app/{username}/{slug}</code>) renders. When off, visitors get a 404.</td></tr>
    <tr><td><strong>Live site</strong></td><td>Whether your deployed site (<code class="mono">foliosites.vercel.app/{username}/project/{slug}/</code>) is reachable. When off, visitors get a 404.</td></tr>
    <tr><td><strong>Code</strong></td><td>Whether visitors can browse your source files.</td></tr>
    <tr><td><strong>Languages</strong></td><td>Whether the language breakdown is shown on the share page and profile.</td></tr>
    <tr><td><strong>DB</strong></td><td>Whether external clients can read your JSON database.</td></tr>
  </tbody>
</table>
<h2>Metadata</h2>
<p>Used for share cards, social previews, and search engines. Set from <strong>Overview → Identity</strong> or the <strong>Settings</strong> page.</p>
<ul>
  <li>Title and description</li>
  <li>OG image (auto-generated, or paste your own HTTPS URL)</li>
  <li>Icon (preset, upload, or from a URL)</li>
  <li>Primary file — which HTML is the entry point</li>
</ul>
<h2>Short link</h2>
<p>Claim a custom name from <strong>Settings → Short link</strong>. 3-30 lowercase letters and digits, must start with a letter. If the name is taken, you'll be shown three numbered alternatives. You can change or release it at any time. Released names become available to other projects.</p>
<h2>Collaborators</h2>
<p>Invite by username. Three roles:</p>
<ul>
  <li><strong>Viewer</strong> — can see the project but not edit</li>
  <li><strong>Commenter</strong> — can see and comment</li>
  <li><strong>Editor</strong> — can edit files, deploy, manage settings</li>
</ul>
<p>Only the owner can invite, remove collaborators, change visibility, or delete the project.</p>
<h2>API key</h2>
<p>Generate from <strong>Settings → API key</strong>. The key is shown once — copy it immediately. It's also auto-stored as <code class="mono">ENV.FOLIO_API_KEY</code> in your secrets so your <code class="mono">api/*.js</code> scripts can call Folio's own endpoints. Regenerate it if it ever leaks.</p>
` },

  'deploying': { title: 'Deploying', body: `
<h2>What a deploy does</h2>
<ol>
  <li>Uploads all your files</li>
  <li>Creates a version snapshot</li>
  <li>Writes a deployment record</li>
  <li>Creates or updates your short link</li>
  <li>Regenerates your OG image and thumbnail</li>
</ol>
<h2>What gets deployed</h2>
<ul>
  <li>Every file under your project, except system files like <code class="mono">notes.json</code></li>
  <li><code class="mono">api/*.js</code> files become private API routes</li>
  <li>A default <code class="mono">api/_system.js</code> is auto-injected if you don't have one</li>
</ul>
<h2>Deployment limit</h2>
<p>Only the <strong>5 most recent</strong> deployments are kept. Older ones — and their snapshots — are deleted automatically.</p>
<h2>Preview URLs</h2>
<p>Every deployment has its own snapshot. You can preview a specific deploy by appending <code class="mono">?from={deploymentId}</code> to your live URL. This is useful for comparing a new deploy against an older one before deciding to roll back.</p>
<p><strong>Preview URLs require editor access.</strong> Signed-out visitors get a 404. Only you and your collaborators can open them.</p>
<h2>Taking a site offline</h2>
<p>From the Deploy tab you can take the current deployment offline. Your live URL stops working immediately. The last live URL is kept on the record so you can see what it used to be. Redeploy at any time to bring it back.</p>
<h2>Deploy progress</h2>
<p>A progress card shows percentage and elapsed time. You can navigate the dashboard while a deploy is running. If you try to leave the page mid-deploy, you'll get a confirmation dialog.</p>
<h2>Redeploying a previous version</h2>
<p>From the Deploy tab → History, click any past deployment to see details, or use the Redeploy button to roll back. The live site switches to that version immediately.</p>
` },

<h2>Size limits</h2>

  'secrets': { title: 'Secrets', body: `
<h2>What secrets are for</h2>
<p>API keys, tokens, and config values that should never appear in your source. Store them once, use them from <code class="mono">api/*.js</code> as <code class="mono">ENV.NAME</code>. Encrypted at rest.</p>
<h2>Private vs public</h2>
<ul>
  <li><strong>Private</strong> — only visible inside <code class="mono">api/*.js</code> as <code class="mono">ENV.NAME</code></li>
  <li><strong>Public</strong> — also injected into served HTML as <code class="mono">window.__SECRETS__.NAME</code> (only if injection is enabled in Settings)</li>
</ul>
<p>Use private for anything sensitive (OpenAI keys, session secrets). Use public only for values that are safe to expose in page source (Stripe publishable key, public API base URLs).</p>
<h2>Access from API</h2>
<pre><code>const key = ENV.OPENAI_API_KEY;</code></pre>
<h2>Access from frontend</h2>
<p>Only for secrets marked <strong>public</strong>, and only when injection is on:</p>
<pre><code>const k = window.__SECRETS__ && window.__SECRETS__.STRIPE_PUBLISHABLE_KEY;</code></pre>
<h2>Reserved ENV names</h2>
<p>These are auto-injected at runtime. You can't create secrets with these names.</p>
<ul>
  <li><code class="mono">PROJECT_ID</code>, <code class="mono">PROJECT_NAME</code>, <code class="mono">PROJECT_SLUG</code>, <code class="mono">PROJECT_URL</code></li>
  <li><code class="mono">OWNER_USERNAME</code>, <code class="mono">OWNER_UID</code></li>
  <li><code class="mono">DEPLOYMENT_ID</code>, <code class="mono">DEPLOYMENT_URL</code></li>
  <li><code class="mono">FOLIO_BASE_URL</code>, <code class="mono">FOLIO_API_URL</code></li>
  <li><code class="mono">API_ROUTE</code>, <code class="mono">REQUEST_ID</code>, <code class="mono">FOLIO_API_KEY</code></li>
</ul>
<h2>Limits</h2>
<ul>
  <li>16 KB per value</li>
  <li>512 KB total per project</li>
  <li>50 secrets max</li>
</ul>
<h2>For user-account apps</h2>
<p>If your project has its own user login, store these as secrets:</p>
<ul>
  <li><code class="mono">PASSWORD_SALT</code> — 16+ chars. <strong>Never change after users register</strong> or their passwords stop working.</li>
  <li><code class="mono">SESSION_SECRET</code> — 16+ chars. Rotating this signs everyone out.</li>
</ul>
<pre><code>if (!ENV.PASSWORD_SALT || ENV.PASSWORD_SALT.length < 16) {
  return { __status: 500, error: "PASSWORD_SALT not configured" };
}</code></pre>
<h2>Never return ENV directly</h2>
<p>Your whole <code class="mono">ENV</code> object contains private secrets. If you want to debug which secrets exist, return only the names:</p>
<pre><code>return { envKeys: Object.keys(ENV || {}) };</code></pre>
` },

  'data-api': { title: 'Data API', body: `
<h2>What it is</h2>
<p>Per-project key/value database. Up to <strong>15 MB</strong> per project. Accessible from <code class="mono">api/*.js</code> via <code class="mono">fetch</code> — the runtime handles the calls in-process, so no external network round-trip.</p>
<p>Firebase Realtime Database under the hood. That means no native arrays (they become <code class="mono">{"0":…,"1":…}</code>) and writing <code class="mono">null</code> deletes a path.</p>
<h2>Reading from your API route</h2>
<p><strong>The DB is only accessible from <code class="mono">api/*.js</code>.</strong> Your frontend can't read it directly — you need to write a route that reads it and returns JSON. This is intentional: it lets you gate access on auth, rate limits, or any logic you want.</p>
<pre><code>// api/load-todos.js
const BASE = ENV.FOLIO_BASE_URL;
const r = await fetch(BASE + "/api/host?action=db/get&pid=" + ENV.PROJECT_ID);
const { data } = await r.json();
return { todos: data.todos || {} };</code></pre>
<p>Then call it from your frontend:</p>
<pre><code>const { todos } = await (await fetch("/{username}/project/{slug}/api/load-todos", { method: "POST" })).json();</code></pre>
<p><strong>Always use an absolute URL</strong> built from <code class="mono">ENV.FOLIO_BASE_URL</code>. Relative URLs throw inside the sandbox.</p>
<h2>Write a single path</h2>
<pre><code>await fetch(BASE + "/api/host?action=db/set", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ pid: ENV.PROJECT_ID, key: "todos/123", value: { text: "Buy milk", done: false } }),
});</code></pre>
<h2>Delete a path</h2>
<p>Write <code class="mono">null</code>:</p>
<pre><code>await fetch(BASE + "/api/host?action=db/set", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ pid: ENV.PROJECT_ID, key: "todos/123", value: null }),
});</code></pre>
<h2>Atomic multi-write</h2>
<p>Update several paths in one round-trip. Either all succeed or all fail.</p>
<pre><code>await fetch(BASE + "/api/host?action=db/batch", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    pid: ENV.PROJECT_ID,
    updates: [
      { key: "todos/123/done", value: true },
      { key: "counters/done", value: 5 },
    ],
  }),
});</code></pre>
<h2>Atomic increment</h2>
<p>Safe for concurrent counters — two calls arriving at the same time both land correctly.</p>
<pre><code>await fetch(BASE + "/api/host?action=db/increment", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ pid: ENV.PROJECT_ID, key: "counters/views", by: 1 }),
});</code></pre>
<h2>Compare-and-swap</h2>
<p>Safe for concurrent edits. Only writes if the current value matches what you expected — otherwise returns a 409 with the current value so you can retry.</p>
<pre><code>await fetch(BASE + "/api/host?action=db/cas", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ pid: ENV.PROJECT_ID, key: "todos/123", expected: oldValue, value: newValue }),
});</code></pre>
<h2>Cache external API responses</h2>
<p>Save on external API calls by caching the response in your DB with a timestamp:</p>
<pre><code>const cacheUrl = BASE + "/api/host?action=db/get&pid=" + ENV.PROJECT_ID;
const cached = await (await fetch(cacheUrl)).json();
const hit = cached.data?.cache?.weather;
if (hit && Date.now() - hit.at &lt; 60000) return { data: hit.data, cached: true };
const fresh = await (await fetch("https://api.open-meteo.com/v1/forecast?latitude=52.52&amp;longitude=13.41")).json();
await fetch(BASE + "/api/host?action=db/set", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ pid: ENV.PROJECT_ID, key: "cache/weather", value: { data: fresh, at: Date.now() } }),
});
return { data: fresh, cached: false };</code></pre>
<h2>Rules</h2>
<ul>
  <li>Arrays become objects with numeric keys — always check with <code class="mono">Array.isArray()</code> or use <code class="mono">Object.values()</code></li>
  <li>Writing <code class="mono">null</code> deletes the path</li>
  <li>Key segments can't contain <code class="mono">. # $ / [ ]</code></li>
  <li>Only <code class="mono">action=db/*</code> endpoints are allowed from <code class="mono">api/*.js</code></li>
  <li>Max 15 MB per project, 100 writes per minute</li>
</ul>
` },

  'private-api': { title: 'Private API', body: `
<h2>What it is</h2>
<p>Files in <code class="mono">api/</code> become private routes. They're never served as files — only executed when called. Your script runs in an isolated browser sandbox, not on the raw server.</p>
<h2>How to call your routes</h2>
<p>Every <code class="mono">api/name.js</code> file is reachable at:</p>
<pre><code>https://foliosites.vercel.app/{username}/project/{slug}/api/{name}</code></pre>
<p>From your own frontend, use the relative form:</p>
<pre><code>const res = await fetch("/{username}/project/{slug}/api/{name}", { method: "POST" });</code></pre>
<p>From any external tool (curl, Postman, a backend server), use the full URL. Same route, same script, same response.</p>
<h2>Sandbox restrictions</h2>
<p>Your script runs in a browser sandbox, not a full Node.js environment. A few things you might expect aren't available:</p>
<table class="db-table">
  <thead><tr><th>Unavailable</th><th>Use instead</th></tr></thead>
  <tbody>
    <tr><td><code class="mono">crypto.subtle</code></td><td>Pure-JS SHA-256 (see Examples)</td></tr>
    <tr><td><code class="mono">crypto.randomUUID</code></td><td><code class="mono">crypto.getRandomValues</code>-based UUID (see Examples)</td></tr>
    <tr><td>Relative fetch URLs</td><td><code class="mono">ENV.FOLIO_BASE_URL + "/api/…"</code></td></tr>
  </tbody>
</table>
<h2>External hosts you can reach</h2>
<p>By default you can call a curated list of well-known APIs and image hosts. Anything else needs to be allowed.</p>
<p><strong>Already trusted (no declaration needed):</strong> OpenAI, Groq, Anthropic, Stripe, Paystack, Supabase, Resend, GitHub, and a few image CDNs like picsum.photos, unsplash, pexels.</p>
<p><strong>Import CDNs (already trusted):</strong> <code class="mono">cdn.jsdelivr.net</code>, <code class="mono">esm.sh</code>, <code class="mono">unpkg.com</code>, <code class="mono">cdnjs.cloudflare.com</code>, <code class="mono">ga.jspm.io</code>, <code class="mono">cdn.skypack.dev</code>.</p>
<h2>Three ways to allow a host</h2>
<ol>
  <li><strong>Already trusted</strong> — just call it. No setup.</li>
  <li><strong>Literal URL in your script</strong> — auto-detected on deploy:
    <pre><code>const r = await fetch("https://api.weather.com/v1/today");</code></pre>
  </li>
  <li><strong>Dynamic host</strong> — must be declared with a comment:
    <pre><code>// @allow api.example.com
const host = REQ.body.host || "api.example.com";
const r = await fetch("https://" + host + "/v1/data");</code></pre>
  </li>
</ol>
<h2>What's detected automatically</h2>
<table class="db-table">
  <thead><tr><th>Pattern</th><th>Auto-detected?</th></tr></thead>
  <tbody>
    <tr><td><code class="mono">fetch("https://api.x.com/v1")</code></td><td>✅</td></tr>
    <tr><td><code class="mono">fetch("https://api.x.com/v1?id=" + id)</code></td><td>✅</td></tr>
    <tr><td><code class="mono">const u = "https://api.x.com/v1"; fetch(u)</code></td><td>✅</td></tr>
    <tr><td><code class="mono">fetch("https://" + H + "/v1")</code></td><td>❌ — needs <code class="mono">// @allow</code></td></tr>
    <tr><td><code class="mono">fetch(REQ.body.url)</code></td><td>❌ — user-controlled</td></tr>
  </tbody>
</table>
<h2>Importing from CDNs</h2>
<pre><code>import { marked } from "https://cdn.jsdelivr.net/npm/marked@12/marked.esm.js";
return { html: marked(REQ.body.md) };</code></pre>
<h2>How your return value becomes the response</h2>
<table class="db-table">
  <thead><tr><th>What you return</th><th>Status</th><th>Content-Type</th></tr></thead>
  <tbody>
    <tr><td><code class="mono">{ success: true }</code></td><td>200</td><td>application/json</td></tr>
    <tr><td><code class="mono">"hello"</code></td><td>200</td><td>text/plain</td></tr>
    <tr><td><code class="mono">{ __status: 404, __body: "x", error: "x" }</code></td><td>404</td><td>application/json</td></tr>
    <tr><td><code class="mono">{ __contentType: "text/html", __body: "&lt;h1&gt;Hi&lt;/h1&gt;" }</code></td><td>200</td><td>text/html</td></tr>
  </tbody>
</table>
<h2>_system.js — your free default routes</h2>
<p>Auto-created if you don't have one. Provides six routes you don't have to write:</p>
<ul>
  <li><code class="mono">GET /api/health</code> — <code class="mono">{ status, pid, deployed, responseMs }</code></li>
  <li><code class="mono">GET /api/whoami</code> — <code class="mono">{ pid, name, deployedAt, apiVersion }</code></li>
  <li><code class="mono">GET /api/files</code> — <code class="mono">{ files, count, totalBytes }</code></li>
  <li><code class="mono">GET /api/status</code> — richer health info</li>
  <li><code class="mono">GET /api/version</code> — <code class="mono">{ deploymentId, deployedAt, url }</code></li>
  <li><code class="mono">GET /api/robots</code> — plain text robots.txt</li>
</ul>
<p>Example: <code class="mono">GET https://foliosites.vercel.app/{username}/project/{slug}/api/health</code></p>
<h2>File rules for api/</h2>
<ul>
  <li>Flat folder — no subfolders</li>

  'shortlinks': { title: 'Short links', body: `
<h2>What it is</h2>
<p>A short, memorable URL on <code class="mono">folio.xo.je</code> that redirects to your <strong>live site</strong> — not the share page. So <code class="mono">folio.xo.je/portfolio</code> lands directly on your deployed website.</p>
<p>A short link is automatically created on your first deploy, based on your project slug. You can claim a custom name from Settings at any time.</p>
<h2>Claiming a name</h2>
<ol>
  <li>Open <strong>Settings → Short link</strong></li>
  <li>Enter 3-30 lowercase letters and digits, starting with a letter</li>
  <li>Click <strong>Claim</strong></li>
  <li>If taken, pick from three numbered suggestions or try another name</li>
</ol>
<h2>Changing and releasing</h2>
<p>From the same Settings section:</p>
<ul>
  <li><strong>Change</strong> — pick a new name for the same project. The old name is freed immediately.</li>
  <li><strong>Release</strong> — frees the name so another project can claim it. <strong>Your short link stops working immediately</strong> — anyone visiting it sees a 404.</li>
</ul>
<h2>Reserved names</h2>
<p>A short list of names is blocked because they'd conflict with real services: <code class="mono">api</code>, <code class="mono">www</code>, <code class="mono">admin</code>, <code class="mono">login</code>, <code class="mono">register</code>, <code class="mono">settings</code>, <code class="mono">dashboard</code>, <code class="mono">help</code>, <code class="mono">docs</code>, and similar.</p>
<h2>Click tracking</h2>
<p>Every visit through your short link is counted. Click totals and last-access time appear in Settings → Short link. Counts are batched — not real-time, but accurate within a few seconds.</p>
<h2>What happens on redeploy</h2>
<p>Your short link stays the same across re-deploys. Only the destination URL updates to the new live deployment. Nobody who bookmarked your short link has to do anything.</p>
` },

  'api-logs': { title: 'Logs & debugging', body: `
<h2>Where to find logs</h2>
<ul>
  <li><strong>API tab → Recent calls</strong> — last 50 requests to your API routes, with filters by route, status, and source</li>
  <li><strong>Insights tab → Logs</strong> — project event log (deploys, secret changes, DB writes)</li>
</ul>
<h2>What each log entry tells you</h2>
<table class="db-table">
  <thead><tr><th>Field</th><th>Meaning</th></tr></thead>
  <tbody>
    <tr><td><code class="mono">route</code></td><td>Which API route was called</td></tr>
    <tr><td><code class="mono">status</code></td><td>HTTP status code returned</td></tr>
    <tr><td><code class="mono">durationMs</code></td><td>Total wall time for the call</td></tr>
    <tr><td><code class="mono">via</code></td><td><code class="mono">anon</code>, <code class="mono">session</code>, or <code class="mono">api-key</code> — how the caller was authenticated</td></tr>
    <tr><td><code class="mono">requestId</code></td><td>Unique ID for this call — useful for correlating with client-side errors</td></tr>
    <tr><td><code class="mono">fetchHosts</code></td><td>External hosts your script actually called</td></tr>
    <tr><td><code class="mono">errorName</code> / <code class="mono">errorMessage</code></td><td>The error thrown, if any</td></tr>
    <tr><td><code class="mono">errorClass</code></td><td><code class="mono">timeout</code>, <code class="mono">rate_limit</code>, <code class="mono">syntax_error</code>, <code class="mono">blocked_host</code>, <code class="mono">network</code>, or <code class="mono">server_error</code></td></tr>
  </tbody>
</table>
<h2>Debugging a timeout</h2>
<p>Each function has 30 seconds total, and your script gets 7 seconds of that. If you see a <code class="mono">timeout</code> error, look at the last stage reached. Common culprits: an unresolved <code class="mono">await</code>, an external fetch that hangs, or a cold start that eats most of the budget.</p>
<p><strong>Fixes:</strong> batch DB calls, reduce the number of external fetches, and add <code class="mono">AbortSignal.timeout(ms)</code> to external fetches so they fail fast.</p>
<h2>Debugging a blocked fetch</h2>
<p>If your script throws <code class="mono">TypeError: Failed to fetch</code>, the host you tried to reach wasn't on your allow list. Check whether the host is on the trusted list, add <code class="mono">// @allow host.name</code> above the fetch, and redeploy.</p>
<h2>Debugging a null response</h2>
<p>If your response body is the string <code class="mono">"null"</code>, your script returned <code class="mono">undefined</code>. This happens when a code branch falls through without a return. Add a fallback return at the end of every script.</p>
<h2>Temporary debug action</h2>
<p>While debugging, add an action that returns useful internals:</p>
<pre><code>if (REQ.body && REQ.body.action === "__debug") {
  return {
    envKeys: Object.keys(ENV || {}),
    pid: ENV.PROJECT_ID,
    hasAuth: !!REQ.headers.authorization,
  };
}</code></pre>
<p><strong>Remove this before shipping.</strong> It leaks the names of your secrets (not their values, but still shouldn't ship).</p>
` },

  'examples': { title: 'Examples', body: `
<h2>AI chat with OpenAI</h2>

  }),
});

<h2>External weather API (auto-detected)</h2>

<h2>Read from your JSON DB — in an API route</h2>
<pre><code>// api/load-todos.js

<h2>Write to your JSON DB — in an API route</h2>
<pre><code>// api/add-todo.js
