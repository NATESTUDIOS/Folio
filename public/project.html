  async function renderFilesPanel(panel) {
    panel.innerHTML = skeletonCard(6);

    let files = [];
    try { files = await IDB.listFiles(S.pid); } catch (err) {
      panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('alertCircle', "Couldn't read files", String(err?.message || err))}</div></div>`;
      return;
    }

    const visibleFiles = files.filter(f => !isSystemFile(f.path));
    S.tabCounts.files = visibleFiles.length;
    renderTopTabs();
    renderSidebar();

    const canEdit = S.isEditor || S.isLocalOnly;

    if (visibleFiles.length === 0 && !canEdit) {
      panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('folder', 'No files yet', 'This project has no saved files yet.',
        `<button class="btn btn-primary" id="btnOpenEditorEmpty">${svg('edit3', 12, 2.4)} Open in editor</button>`)}</div></div>`;
      $('btnOpenEditorEmpty')?.addEventListener('click', () => openInEditor());
      return;
    }

    panel.innerHTML = `
      <div class="files-toolbar">
        ${canEdit ? `
          <button class="btn btn-sm btn-primary" id="btnNewFile">${svg('plus', 10, 2.4)} New</button>
          <button class="btn btn-sm btn-secondary" id="btnUploadFile">${svg('upload', 10, 2.2)} Upload</button>
        ` : ''}
        <button class="btn btn-sm btn-secondary" id="btnOpenEditor">${svg('edit3', 10, 2.4)} Editor</button>
        <button class="btn btn-sm btn-secondary btn-icon" id="btnExpandAll" aria-label="Expand all">${svg('expand', 10, 2.2)}</button>
        <button class="btn btn-sm btn-secondary btn-icon" id="btnCollapseAll" aria-label="Collapse all">${svg('collapse', 10, 2.2)}</button>
        <input class="input" id="fileFilter" placeholder="Filter…" style="flex:1;min-width:80px;height:26px;font-size:11px;">
      </div>
      ${visibleFiles.length === 0 ? `
        <div class="card"><div class="card-body">
          ${emptyState('folder', 'No files yet', 'Create your first file or upload one.')}
        </div></div>
      ` : `<div class="file-tree-wrap" id="fileTreeContainer"></div>`}
      <input type="file" id="fileUploadInput" multiple style="display:none;">
    `;

    const treeContainer = $('fileTreeContainer');
    const filterInput = $('fileFilter');
    if (filterInput) filterInput.value = S.fileFilter;
    const tree = buildFileTree(visibleFiles.map(f => f.path));

    const render = () => {
      if (!treeContainer) return;
      treeContainer.innerHTML = '';
      const filter = S.fileFilter.toLowerCase();
      const filtered = filter
        ? visibleFiles.filter(f => f.path.toLowerCase().includes(filter))
        : visibleFiles;
      if (filtered.length === 0) {
        treeContainer.innerHTML = `<div class="empty-state" style="padding:16px 8px;"><div class="empty-state-title" style="font-size:12px;">No matches</div></div>`;
        return;
      }
      const filteredTree = buildFileTree(filtered.map(f => f.path));
      renderFileTreeNodes(treeContainer, filteredTree, 0, filter ? true : false, render);
    };

    filterInput?.addEventListener('input', debounce((e) => {
      S.fileFilter = e.target.value;
      render();
    }, 150));

    $('btnNewFile')?.addEventListener('click', () => createNewFile(panel));
    $('btnUploadFile')?.addEventListener('click', () => $('fileUploadInput')?.click());
    $('fileUploadInput')?.addEventListener('change', (e) => handleFileUpload(e, panel));
    $('btnOpenEditor')?.addEventListener('click', () => openInEditor());
    $('btnExpandAll')?.addEventListener('click', () => {
      const addAll = (node) => {
        for (const [_, child] of Object.entries(node.children)) {
          S.expandedFolders.add(child.path);
          addAll(child);
        }
      };
      addAll(tree);
      saveExpanded();
      render();
    });
    $('btnCollapseAll')?.addEventListener('click', () => {
      S.expandedFolders.clear();
      saveExpanded();
      render();
    });

    render();
  }

  function buildFileTree(paths) {
    const root = { name: '', children: {}, files: [], path: '' };
    for (const path of paths) {
      const parts = path.split('/');
      let node = root;
      for (let i = 0; i < parts.length - 1; i++) {
        const part = parts[i];
        if (!node.children[part]) {
          node.children[part] = {
            name: part, children: {}, files: [],
            path: parts.slice(0, i + 1).join('/'),
          };
        }
        node = node.children[part];
      }
      node.files.push({ name: parts[parts.length - 1], path });
    }
    return root;
  }

  function renderFileTreeNodes(container, node, depth, forceExpand, rerender) {
    const canEdit = S.isEditor || S.isLocalOnly;
    const folderNames = Object.keys(node.children).sort();
    for (const folderName of folderNames) {
      const folder = node.children[folderName];
      const isExpanded = forceExpand || S.expandedFolders.has(folder.path);
      const row = document.createElement('div');
      row.className = 'tree-node is-folder' + (isExpanded ? ' expanded' : '');
      row.style.paddingLeft = (6 + depth * 12) + 'px';
      row.innerHTML = `
        <span class="chevron">${svg('chevronRight', 9, 2.4)}</span>
        <span class="icon" style="color:var(--theme-primary);">${svg('folder', 12, 2.2)}</span>
        <span class="name">${escapeHTML(folderName)}</span>
      `;
      row.addEventListener('click', () => {
        if (S.expandedFolders.has(folder.path)) S.expandedFolders.delete(folder.path);
        else S.expandedFolders.add(folder.path);
        saveExpanded();
        rerender();
      });
      container.appendChild(row);
      if (isExpanded) renderFileTreeNodes(container, folder, depth + 1, forceExpand, rerender);
    }

    const files = node.files.sort((a, b) => a.name.localeCompare(b.name));
    for (const file of files) {
      if (isSystemFile(file.path)) continue;
      const row = document.createElement('div');
      row.className = 'tree-node';
      row.style.paddingLeft = (6 + depth * 12) + 'px';
      row.innerHTML = `
        <span class="chevron" style="visibility:hidden;"></span>
        <span class="icon" style="color:var(--theme-text-tertiary);">${svg(fileIconName(file.path), 12, 2)}</span>
        <span class="name" title="${escapeAttr(file.path)}">${escapeHTML(file.name)}</span>
        ${canEdit ? `
          <button class="open-btn" data-file-edit title="Edit">${svg('edit', 10, 2.2)}</button>
          <button class="open-btn" data-file-delete title="Delete" style="color:var(--theme-danger);">${svg('trash', 10, 2.2)}</button>
        ` : ''}
        <button class="open-btn" data-file-open title="Open in editor">${svg('external', 10, 2.2)}</button>
      `;
      row.querySelector('[data-file-open]')?.addEventListener('click', (e) => { e.stopPropagation(); openInEditor(file.path); });
      row.querySelector('[data-file-edit]')?.addEventListener('click', (e) => { e.stopPropagation(); openFileEditor(file.path); });
      row.querySelector('[data-file-delete]')?.addEventListener('click', (e) => { e.stopPropagation(); confirmDeleteFile(file.path); });
      row.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        if (canEdit) openFileEditor(file.path);
        else openInEditor(file.path);
      });
      container.appendChild(row);
    }
  }

  async function createNewFile(panel) {
    if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }
    openModal(`
      <div class="modal-title">New file</div>
      <div class="modal-desc">Use a path like <code class="mono">src/app.js</code> for nested files.</div>
      <div class="field">
        <label class="field-label">File path</label>
        <input class="input mono" id="newFilePath" placeholder="app.js" autocomplete="off" spellcheck="false">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="newFileCreate">Create</button>
      </div>
    `);
    $('newFilePath').focus();
    $('newFilePath').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('newFileCreate').click(); });
    $('newFileCreate').addEventListener('click', async () => {
      const path = $('newFilePath').value.trim().replace(/^\/+/, '');
      if (!path) { toast('Path required', 'error'); return; }
      if (!/^[a-zA-Z0-9._\-\/]+$/.test(path)) { toast('Invalid characters', 'error'); return; }
      if (isSystemFile(path)) { toast('Reserved path', 'error'); return; }
      const existing = await IDB.getFile(S.pid, path);
      if (existing) { toast('File already exists', 'warning'); return; }
      try {
        await IDB.putFile(S.pid, path, '');
        if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
          await apiFetch(API_HOST + '?action=project/sync-back', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, files: { [path]: '' } }),
          });
        }
        closeModal();
        toast(`Created ${path}`, 'success');
        renderFilesPanel(panel);
        setTimeout(() => openFileEditor(path), 200);
      } catch (err) { toast(err.message || 'Create failed', 'error'); }
    });
  }

  async function openFileEditor(path) {
    let content = '';
    try { const file = await IDB.getFile(S.pid, path); content = file?.content || ''; } catch {}
    const isText = isTextFile(path);

    openModal(`
      <div class="modal-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(path)}</span>
        <button class="btn btn-ghost btn-sm btn-icon" id="fileEditorClose" aria-label="Close">${svg('x', 12, 2.4)}</button>
      </div>
      <div class="field" style="margin-bottom:6px;">
        ${isText
          ? `<textarea class="textarea mono" id="fileEditorContent" style="min-height:45vh;font-family:var(--font-mono);font-size:12px;line-height:1.5;">${escapeHTML(content)}</textarea>`
          : `<div style="font-size:11.5px;color:var(--theme-text-tertiary);padding:12px;background:var(--theme-glass-bg);border-radius:8px;text-align:center;">Binary file — use the editor to view or replace.</div>`}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
        <span style="font-size:10.5px;color:var(--theme-text-tertiary);" id="fileEditorSize">${isText ? content.length + ' chars' : ''}</span>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-ghost btn-sm" id="fileEditorOpenEditor">${svg('external', 10, 2.2)} Open in editor</button>
          ${isText ? `<button class="btn btn-primary btn-sm" id="fileEditorSave">${svg('check', 10, 2.4)} Save</button>` : ''}
        </div>
      </div>
    `);

    $('fileEditorClose').addEventListener('click', closeModal);
    $('fileEditorOpenEditor').addEventListener('click', () => { closeModal(); openInEditor(path); });
    const ta = $('fileEditorContent');
    if (ta) {
      ta.addEventListener('input', () => {
        const el = $('fileEditorSize');
        if (el) el.textContent = `${ta.value.length} chars`;
      });
    }
    $('fileEditorSave')?.addEventListener('click', async () => {
      const btn = $('fileEditorSave');
      btn.disabled = true;
      const prev = btn.innerHTML;
      btn.innerHTML = 'Saving…';
      try {
        const text = ta.value;
        await IDB.putFile(S.pid, path, text);
        if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=project/sync-back', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, files: { [path]: text } }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Save failed');
        }
        toast('Saved', 'success');
        if (S.activeTab === 'files') renderPanel();
      } catch (err) {
        toast(err.message || 'Save failed', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = prev;
      }
    });
  }

  function confirmDeleteFile(path) {
    if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }
    confirmModal(`Delete ${path.split('/').pop()}?`, 'This removes the file from the project.', 'Delete', true, async () => {
      showLoading('Deleting', '');
      try {
        await IDB.deleteFile(S.pid, path);
        if (S.online && S.session && !S.isLocalOnly) {
          // No file-delete endpoint; sync empty overwrite then note limitations
          try {
            await apiFetch(API_HOST + '?action=project/sync-back', {
              method: 'POST',
              body: JSON.stringify({ pid: S.pid, files: { [path]: '' } }),
            });
          } catch {}
        }
        hideLoading();
        toast('File deleted', 'success');
        renderPanel();
      } catch (err) {
        hideLoading();
        toast(err.message || 'Delete failed', 'error');
      }
    });
  }

  async function handleFileUpload(e, panel) {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (files.length === 0) return;
    if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }

    showLoading('Uploading', `0 / ${files.length}`);
    let uploaded = 0;
    const fileMap = {};
    for (const file of files) {
      try {
        const text = await file.text();
        await IDB.putFile(S.pid, file.name, text);
        fileMap[file.name] = text;
        uploaded++;
        setLoadingDesc(`${uploaded} / ${files.length}`);
      } catch (err) { console.warn('[Upload]', file.name, err); }
    }
    if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced' && Object.keys(fileMap).length > 0) {
      try {
        await apiFetch(API_HOST + '?action=project/sync-back', {
          method: 'POST',
          body: JSON.stringify({ pid: S.pid, files: fileMap }),
        });
      } catch {}
    }
    hideLoading();
    toast(`Uploaded ${uploaded} file${uploaded === 1 ? '' : 's'}`, 'success');
    renderFilesPanel(panel);
  }

  function openInEditor(filePath) {
    const url = new URL('/', location.origin);
    url.searchParams.set('pid', S.pid);
    if (filePath) url.searchParams.set('file', filePath);
    window.location.href = url.toString();
  }

  async function renderDeploymentsPanel(panel) {
    if (!gate(panel, { label: 'Deployments' })) return;
    panel.innerHTML = skeletonCard(3) + skeletonCard(6);
    const [statusRes, historyRes] = await Promise.all([
      apiFetch(API_HOST + '?action=status&pid=' + encodeURIComponent(S.pid)),
      apiFetch(API_HOST + '?action=deployment/history&pid=' + encodeURIComponent(S.pid)),
    ]);
    const current = statusRes.ok ? statusRes.data?.deployment : null;
    const history = historyRes.ok ? (historyRes.data?.deployments || []) : [];
    const currentId = historyRes.ok ? historyRes.data?.currentDeploymentId : null;

    S.deployState = current;
    S.tabCounts.deployments = history.length;
    renderSidebar();
    renderTopTabs();

    const isLive = current?.url && current.state !== 'OFFLINE';
    const isOffline = current?.state === 'OFFLINE';

    panel.innerHTML = `
      <div class="card">
        <div class="card-header"><div class="card-title">${svg('rocket', 13, 2.2)} Current</div>
          ${canDeploy ? `<button class="btn btn-sm btn-primary" id="btnDeployNow">${svg('rocket', 10, 2.4)} Deploy</button>`
            : (S.syncState === 'local' || S.syncState === 'orphan')
              ? `<button class="btn btn-sm btn-secondary" id="btnDeployPushFirst">${svg('upload', 10, 2.2)} Push to server first</button>`
              : ''}
        </div>
        <div class="card-body">
          ${S.syncState === 'local' || S.syncState === 'orphan' ? `
            <div style="font-size:11px;color:var(--theme-text-tertiary);">
              ${S.syncState === 'orphan' ? 'This project isn\'t on the server yet.' : 'Local projects can\'t be deployed.'}
              Push to server first to enable deploys.
            </div>
          ` : isLive ? `
            <div style="display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="vis-badge public">${svg('checkCircle', 9, 2.4)} Live</span>
                <span style="font-size:10px;color:var(--theme-text-tertiary);">${timeAgo(current.deployedAt)}</span>
              </div>
              <div style="display:flex;gap:5px;align-items:center;">
                <a href="${escapeAttr(current.url)}" target="_blank" rel="noopener" class="mono" style="font-size:10.5px;word-break:break-all;flex:1;min-width:0;">${escapeHTML(current.url)}</a>
                <button class="btn btn-secondary btn-icon" id="btnCopyDeployUrl" type="button" aria-label="Copy URL">${svg('copy', 11, 2.2)}</button>
              </div>
              ${S.isEditor ? `<button class="btn btn-secondary btn-sm" id="btnTakeOffline">${svg('eyeOff', 10, 2.2)} Take offline</button>` : ''}
            </div>
          ` : isOffline ? `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
              <span class="vis-badge private">${svg('eyeOff', 9, 2.2)} Offline</span>
              <span style="font-size:10px;color:var(--theme-text-tertiary);">${timeAgo(current.offlineAt)}</span>
            </div>
            ${S.isEditor ? `<button class="btn btn-primary btn-sm" id="btnDeployNow">${svg('rocket', 10, 2.4)} Deploy to go live</button>` : ''}
          ` : `<div style="font-size:11px;color:var(--theme-text-tertiary);">Never deployed</div>`}
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">${svg('clock', 13, 2.2)} History (${history.length})</div>
          <button class="btn btn-sm btn-ghost btn-icon" id="btnRefreshHistory">${svg('refresh', 10, 2.2)}</button>
        </div>
        <div class="card-body tight">
          ${history.length === 0 ? emptyState('clock', 'No deployments', 'Deploy your project to start building history.')

    $('btnDeployNow')?.addEventListener('click', deployNow);

    });
    $('btnRefreshHistory')?.addEventListener('click', () => renderPanel());
    $('btnTakeOffline')?.addEventListener('click', takeOffline);
    $('btnCopyDeployUrl')?.addEventListener('click', () => {
      const url = current?.url || '';

      if (copyToClipboard(url)) toast('URL copied', 'success', 1200);
      else toast('Copy failed', 'error');
    });
    document.querySelectorAll('[data-redeploy]').forEach(btn => {
      btn.addEventListener('click', () => redeployVersion(btn.dataset.redeploy));
    });

  async function deployNow() {
    if (!S.isEditor || !S.online) { toast('Requires internet', 'warning'); return; }
    if (S.syncState !== 'synced') { toast('Push project to server first', 'warning'); return; }

    let files = [];
    try { files = await IDB.listFiles(S.pid); } catch {}
    const fileMap = {};
    for (const f of files) {
      if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
      fileMap[f.path] = f.content || '';
    }
    if (Object.keys(fileMap).length === 0) { toast('No files to deploy', 'warning'); return; }

    confirmModal(`Deploy ${Object.keys(fileMap).length} file${Object.keys(fileMap).length === 1 ? '' : 's'}?`, 'This will build and deploy your project to a live URL.', 'Deploy', false, async () => {
      showLoading('Deploying', 'Building and deploying…');
      try {
        const res = await apiFetch(API_HOST + '?action=deploy', {
          method: 'POST',
          body: JSON.stringify({ pid: S.pid, files: fileMap }),
        });
        hideLoading();
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Deploy failed');
        toast('Deploy started', 'success');
        setTimeout(() => {
          loadDeployState().then(() => { if (S.activeTab === 'deployments' || S.activeTab === 'overview') renderPanel(); });
        }, 1500);
      } catch (err) { hideLoading(); toast(err.message || 'Deploy failed', 'error'); }
    });
  }

  async function renderCommitsPanel(panel) {
    if (!gate(panel, { label: 'Commits', requiresOnline: false })) return;
    panel.innerHTML = skeletonCard(4);

    let versions = [];
    let files = [];
    try {
      [versions, files] = await Promise.all([IDB.listVersions(S.pid), IDB.listFiles(S.pid)]);
    } catch {}

    S.tabCounts.commits = versions.length;
    renderSidebar();
    renderTopTabs();

    const canEdit = S.isEditor && !S.isLocalOnly;
    const realFiles = files.filter(f => !isSystemFile(f.path));

    // Diff vs last commit
    let changeCount = 0;
    if (versions.length > 0) {
      const lastFiles = versions[0].files || {};
      for (const f of realFiles) {
        if (lastFiles[f.path] !== (f.content || '')) changeCount++;
      }
      for (const p of Object.keys(lastFiles)) {
        if (!realFiles.find(f => f.path === p) && p !== NOTES_PATH) changeCount++;
      }
    } else if (realFiles.length > 0) {
      changeCount = realFiles.length;
    }

    panel.innerHTML = `
      ${changeCount > 0 && canEdit ? `
        <div class="card" style="border-color:var(--theme-primary);">
          <div class="card-body" style="display:flex;align-items:center;gap:10px;">
            <div style="color:var(--theme-primary);">${svg('git-commit', 18, 2.2)}</div>
            <div style="flex:1;font-size:11.5px;color:var(--theme-text-secondary);">
              ${changeCount} file${changeCount === 1 ? '' : 's'} changed since last commit
            </div>
            <button class="btn btn-sm btn-primary" id="btnCommitNow">Commit now</button>
          </div>
        </div>
      ` : ''}

      ${versions.length === 0 ? `
        <div class="card"><div class="card-body">
          ${emptyState('git-commit', 'No commits yet',
            canEdit ? 'Commit a snapshot of your current files to start tracking history.'
                    : 'The owner hasn\'t committed any versions yet.',
            canEdit ? `<button class="btn btn-primary btn-sm" id="btnFirstCommit" style="margin-top:8px;">${svg('git-commit', 10, 2.4)} Commit now</button>` : '')}
        </div></div>
      ` : `
        <div class="commits-list">
          ${versions.map((v, idx) => {
            const prev = versions[idx + 1];
            const isAuto = /^v_auto_/.test(v.vid);
            const fileCount = Object.keys(v.files || {}).length;
            let add = 0, rem = 0;
            if (prev) {
              for (const [p, content] of Object.entries(v.files || {})) {
                const before = (prev.files || {})[p] || '';
                const beforeLines = before.split('\n').length;
                const afterLines = String(content || '').split('\n').length;
                if (afterLines > beforeLines) add += afterLines - beforeLines;
                if (beforeLines > afterLines) rem += beforeLines - afterLines;
              }
            }
            return `
              <div class="commit-row ${isAuto ? 'commit-auto' : ''}">
                <div class="commit-header">
                  <div class="commit-icon">${svg(isAuto ? 'refresh' : 'git-commit', 13, 2.2)}</div>
                  <div class="commit-info">
                    <div class="commit-message">${escapeHTML(v.message || 'Untitled')}</div>
                    <div class="commit-meta">
                      ${isAuto ? '<span class="vis-badge private" style="font-size:8px;">Auto</span>' : ''}
                      <span>${timeAgo(v.createdAt)}</span>
                      <span>·</span>
                      <span>${fileCount} file${fileCount === 1 ? '' : 's'}</span>
                      ${add || rem ? `<span>·</span><span style="color:var(--theme-success);">+${add}</span><span style="color:var(--theme-danger);">−${rem}</span>` : ''}
                    </div>
                  </div>
                </div>
                <div class="commit-actions">
                  ${S.isEditor && S.online && S.syncState === 'synced' ? `
                    <button class="btn btn-sm btn-secondary" data-commit-redeploy="${escapeAttr(v.vid)}">${svg('rocket', 10, 2.2)} Redeploy</button>
                  ` : ''}
                  ${canEdit ? `
                    <button class="btn btn-sm btn-secondary" data-commit-restore="${escapeAttr(v.vid)}">${svg('refresh', 10, 2.2)} Restore</button>
                  ` : ''}
                  ${prev ? `
                    <button class="btn btn-sm btn-ghost" data-commit-diff="${escapeAttr(prev.vid)}|${escapeAttr(v.vid)}">${svg('code', 10, 2.2)} Diff</button>
                  ` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>

    panel.querySelectorAll('[data-commit-redeploy]').forEach(btn => {
      btn.addEventListener('click', () => redeployVersion(btn.dataset.commitRedeploy));

    panel.querySelectorAll('[data-commit-restore]').forEach(btn => {
      btn.addEventListener('click', () => restoreCommit(btn.dataset.commitRestore));
    });
    panel.querySelectorAll('[data-commit-diff]').forEach(btn => {
      btn.addEventListener('click', () => {
        const [prevVid, curVid] = btn.dataset.commitDiff.split('|');
        showCommitDiff(prevVid, curVid);
      });
    });
    $('btnCommitNow')?.addEventListener('click', openCommitDialog);
    $('btnFirstCommit')?.addEventListener('click', openCommitDialog);

  async function restoreCommit(versionId) {
    const version = await IDB.getVersion(versionId);
    if (!version) { toast('Version not found', 'error'); return; }

    confirmModal(
      'Restore this commit?',
      'Current files will be replaced. A snapshot is created first so you can undo.',
      'Restore',
      true,
      async () => {
        showLoading('Restoring', 'Snapshoting current state…');
        try {
          // 1. Auto-snapshot
          const currentFiles = await IDB.listFiles(S.pid);
          const snapshot = {};
          for (const f of currentFiles) {
            if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
            snapshot[f.path] = f.content || '';
          }
          await IDB.putVersion({
            vid: `v_auto_${Date.now()}`,
            pid: S.pid,
            message: `Auto-snapshot before restoring "${version.message}"`,
            files: snapshot,
            createdAt: Date.now(),
          });

          // 2. Delete current files
          setLoadingDesc('Removing current files…');
          for (const f of currentFiles) {
            await IDB.deleteFile(S.pid, f.path);
          }

          // 3. Write version files
          setLoadingDesc('Writing version files…');
          for (const [path, content] of Object.entries(version.files || {})) {
            await IDB.putFile(S.pid, path, content);
          }

          // 4. Sync to server
          if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
            setLoadingDesc('Syncing to server…');
            await apiFetch(API_HOST + '?action=project/sync-back', {
              method: 'POST',
              body: JSON.stringify({ pid: S.pid, files: version.files }),
            }).catch(() => {});
          }

          hideLoading();
          toast('Commit restored', 'success');
          renderPanel();
        } catch (err) {
          hideLoading();
          toast(err.message || 'Restore failed', 'error');
        }
      }
    );
  }

  async function showCommitDiff(prevVid, curVid) {
    const [prev, cur] = await Promise.all([IDB.getVersion(prevVid), IDB.getVersion(curVid)]);
    if (!prev || !cur) { toast('Version not found', 'error'); return; }
    const paths = new Set([...Object.keys(prev.files || {}), ...Object.keys(cur.files || {})]);
    const list = document.createElement('div');
    let any = false;
    for (const p of paths) {
      const before = prev.files[p] || '';
      const after = cur.files[p] || '';
      if (before === after) continue;
      any = true;
      const btn = document.createElement('button');
      btn.className = 'btn btn-secondary btn-block';
      btn.style.cssText = 'justify-content:flex-start;font-family:var(--font-mono);font-size:11px;margin-bottom:4px;';
      btn.innerHTML = `${svg('code', 12, 2.2)} ${escapeHTML(p)}`;
      btn.addEventListener('click', () => {
        closeModal();
        openTextDiff(before, after, p);
      });
      list.appendChild(btn);
    }
    if (!any) list.innerHTML = emptyState('check', 'No differences', 'Files are identical.');
    openModal(`
      <div class="modal-title">Compare commits</div>
      <div class="modal-desc">${escapeHTML(prev.message)} → ${escapeHTML(cur.message)}</div>
      ${list.outerHTML}
      <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>
    `);
    // Re-bind because outerHTML loses listeners
    const buttons = $('modalBody').querySelectorAll('.btn-secondary.btn-block');
    let idx = 0;
    for (const p of paths) {
      const before = prev.files[p] || '';
      const after = cur.files[p] || '';
      if (before === after) continue;
      if (buttons[idx]) {
        const b = buttons[idx];
        b.addEventListener('click', () => {
          closeModal();
          openTextDiff(before, after, p);
        });
      }
      idx++;
    }
  }

  function openTextDiff(before, after, title) {
    const beforeLines = String(before).split('\n');
    const afterLines = String(after).split('\n');
    const max = Math.max(beforeLines.length, afterLines.length);
    let html = '<div class="diff-view">';
    for (let i = 0; i < max; i++) {
      const b = beforeLines[i] ?? '';
      const a = afterLines[i] ?? '';
      const cls = b === a ? '' : (b && !a ? 'diff-rem' : (!b && a ? 'diff-add' : 'diff-change'));
      const lineNum = String(i + 1).padStart(3, ' ');
      html += `<div class="diff-line ${cls}"><span class="diff-num">${lineNum}</span><span class="diff-text">${escapeHTML(a || b || ' ')}</span></div>`;
    }
    html += '</div>';
    openModal(`
      <div class="modal-title">${escapeHTML(title)}</div>
      <div class="modal-desc">${beforeLines.length} → ${afterLines.length} lines</div>
      ${html}
      <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>
    `);
  }

  async function openCommitDialog() {
    if (!S.isEditor) { toast('Read-only', 'warning'); return; }

    const files = await IDB.listFiles(S.pid);
    const versions = await IDB.listVersions(S.pid);
    const last = versions[0];

    const changes = [];
    let totalAdd = 0, totalRem = 0;
    for (const f of files) {
      if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
      const before = last?.files?.[f.path] || '';
      const after = f.content || '';
      if (before === after) continue;
      const beforeLines = before.split('\n');
      const afterLines = after.split('\n');
      const add = Math.max(0, afterLines.length - beforeLines.length);
      const rem = Math.max(0, beforeLines.length - afterLines.length);
      changes.push({ path: f.path, add, rem });
      totalAdd += add;
      totalRem += rem;
    }

    if (changes.length === 0) {
      openModal(`
        <div class="modal-title">Commit</div>
        <div class="modal-desc">No changes to commit.</div>
        <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>
      `);
      return;
    }

    const autoMsg = generateCommitMessage(changes, totalAdd, totalRem);

    openModal(`
      <div class="modal-title">Commit ${changes.length} file${changes.length === 1 ? '' : 's'}</div>
      <div class="modal-desc">Snapshot the current state as a commit.</div>
      <div class="field">
        <label class="field-label">Message</label>
        <input class="input" id="commitMsg" value="${escapeAttr(autoMsg)}" maxlength="200">
      </div>
      <div class="field">
        <label class="field-label">Changes</label>
        <div class="commit-changes">
          ${changes.map(c => `
            <div class="commit-change-row">
              <span class="icon">${svg(fileIconName(c.path), 10, 2.2)}</span>
              <span class="name">${escapeHTML(c.path)}</span>
              <span class="stat"><span class="add">+${c.add}</span> <span class="rem">−${c.rem}</span></span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="commitSubmit">${svg('check', 10, 2.4)} Commit</button>
      </div>
    `);

    $('commitSubmit').addEventListener('click', async () => {
      const message = ($('commitMsg').value || autoMsg).trim();
      const btn = $('commitSubmit');
      btn.disabled = true;
      btn.innerHTML = 'Committing…';
      try {
        const snapshot = {};
        for (const f of files) {
          if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
          snapshot[f.path] = f.content || '';
        }
        const vid = `v_${Date.now()}`;
        await IDB.putVersion({
          vid, pid: S.pid, message, files: snapshot, createdAt: Date.now(),
        });

        if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
          await apiFetch(API_HOST + '?action=project/sync-back', {
            method: 'POST',
            body: JSON.stringify({
              pid: S.pid,
              versions: { [vid]: { message, files: snapshot, createdAt: Date.now() } },
            }),
          }).catch(() => {});
        }

        closeModal();
        toast('Committed', 'success');
        if (S.activeTab === 'commits') renderPanel();
      } catch (err) {
        toast(err.message || 'Commit failed', 'error');
        btn.disabled = false;
        btn.innerHTML = `${svg('check', 10, 2.4)} Commit`;
      }
    });
  }

  function generateCommitMessage(changes, add, rem) {
    if (changes.length === 1) {
      return `edit: ${changes[0].path.split('/').pop()} (+${add}, −${rem})`;
    }
    return `edit: ${changes.length} files (+${add}, −${rem})`;
  }

  async function toggleVisibility(axis, btn) {
    if (!S.isOwner) { toast('Only owner can change visibility', 'warning'); return; }
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    if (S.syncState !== 'synced') { toast('Push project to server first', 'warning'); return; }
    const current = S.project.visibility?.[axis];
    const next = current === 'public' ? 'private' : 'public';
    btn.classList.toggle('on', next === 'public');
    try {
      const res = await apiFetch(API_HOST + '?action=visibility', {
        method: 'POST', body: JSON.stringify({ pid: S.pid, visibility: { [axis]: next } }),
      });
      if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
      S.project.visibility = { ...S.project.visibility, [axis]: next };
      cacheProject(S.project);
      toast(next, 'success', 1200);
    } catch (err) {
      btn.classList.toggle('on', current === 'public');
      toast(err.message || 'Update failed', 'error');
    }
  }

    `);

    $('inviteSubmit').addEventListener('click', async () => {
      const raw = $('inviteUsernames').value.trim();
      const usernames = raw.split(',').map(u => u.trim().replace(/^@/, '')).filter(Boolean);
      const role = $('inviteRole').value;
      if (usernames.length === 0) { toast('Enter at least one username', 'error'); return; }

      $('inviteSubmit').disabled = true;
      const btn = $('inviteSubmit');
      const prev = btn.innerHTML;
      btn.innerHTML = 'Sending…';

      const results = { sent: [], failed: [] };
      for (const username of usernames) {
        try {
          const res = await apiFetch(API_HOST + '?action=invite/create', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, username, role }),
          });
          if (!res.ok || !res.data?.success) {
            results.failed.push({ username, error: res.data?.error || 'Failed' });
          } else {
            results.sent.push({ username, inviteUrl: res.data.inviteUrl });
          }
        } catch (err) {
          results.failed.push({ username, error: err.message });
        }
      }

      btn.disabled = false;
      btn.innerHTML = prev;

      if (results.failed.length === 0 && results.sent.length === 1) {
        const inviteUrl = results.sent[0].inviteUrl;
        openModal(`
          <div class="modal-title">Invite sent</div>
          <div class="modal-desc">
            <strong>@${escapeHTML(results.sent[0].username)}</strong> was invited as <strong>${escapeHTML(role)}</strong>.
          </div>
          <div class="field">
            <label class="field-label">Invite link</label>
            <div style="display:flex;gap:5px;">
              <input class="input mono" value="${escapeAttr(inviteUrl)}" readonly style="font-size:10.5px;" onclick="this.select()">
              <button class="btn btn-secondary btn-icon" id="copyInviteUrlBtn" aria-label="Copy">${svg('copy', 12, 2.2)}</button>
            </div>
            <div class="field-hint">Expires in 7 days.</div>
          </div>
          <div class="modal-actions"><button class="btn btn-primary btn-block" onclick="closeModal()">Done</button></div>
        `);
        $('copyInviteUrlBtn')?.addEventListener('click', () => {
          if (copyToClipboard(inviteUrl)) toast('Copied', 'success', 1200);
          else toast('Copy failed', 'error');
        });
      } else {
        openModal(`
          <div class="modal-title">Invite results</div>
          <div class="modal-desc">
            ${results.sent.length} sent · ${results.failed.length} failed
          </div>
          ${results.sent.length > 0 ? `
            <div class="field">
              <label class="field-label">Invited</label>
              <div class="row-list">
                ${results.sent.map(s => `
                  <div class="row-item">
                    <div class="row-icon">${svg('check', 12, 2.4)}</div>
                    <div class="row-content"><div class="row-title">@${escapeHTML(s.username)}</div></div>
                    <button class="btn btn-ghost btn-sm btn-icon" data-copy-url="${escapeAttr(s.inviteUrl)}">${svg('copy', 10, 2.2)}</button>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
          ${results.failed.length > 0 ? `
            <div class="field">
              <label class="field-label">Failed</label>
              <div class="row-list">
                ${results.failed.map(f => `
                  <div class="row-item">
                    <div class="row-icon" style="color:var(--theme-danger);">${svg('alertCircle', 12, 2.4)}</div>
                    <div class="row-content"><div class="row-title">@${escapeHTML(f.username)}</div>
                      <div class="row-sub">${escapeHTML(f.error)}</div></div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
          <div class="modal-actions"><button class="btn btn-primary btn-block" onclick="closeModal()">Done</button></div>
        `);
        $('modalBody').querySelectorAll('[data-copy-url]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (copyToClipboard(btn.dataset.copyUrl)) toast('Copied', 'success', 1200);
            else toast('Copy failed', 'error');
          });
        });
      }

      loadPendingInvites();
    });
  }

  async function renderDataPanel(panel) {
    if (!gate(panel, { label: 'Data' })) return;
    if (S.syncState !== 'synced') {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('upload', 'Data needs a server project',
          'Push this project to the server first to enable the JSON database.',
          `<button class="btn btn-primary" id="btnPushForData">${svg('upload', 12, 2.4)} ${S.syncState === 'orphan' ? 'Push to server' : 'Sync to account'}</button>`)}
      </div></div>`;
      $('btnPushForData')?.addEventListener('click', () => {
        if (S.syncState === 'orphan') pushOrphanToServer();
        else if (S.syncState === 'local') promoteLocalProject();
      });
      return;
    }
    panel.innerHTML = skeletonCard(4);
    try {
      const res = await apiFetch(API_HOST + '?action=db/get&pid=' + encodeURIComponent(S.pid));
      if (!res.ok || !res.data?.success) {
        panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('database', 'Couldn\'t load data', res.data?.error || 'Try refreshing.')}</div></div>`;
        return;
      }
      const { data, schema } = res.data;
      S.dbStats = {
        calls: res.data.calls || null,
        rateLimit: res.data.rateLimit || null,
        space: res.data.space || null,
      };

      const canEdit = S.isEditor;
      const serialized = JSON.stringify(data || {});
      const LIMIT = 15 * 1024 * 1024;
      const initialSpace = S.dbStats.space || {
        used: serialized.length,
        limit: LIMIT,
        remaining: Math.max(0, LIMIT - serialized.length),
        percentUsed: LIMIT > 0 ? Math.min(100, Math.round((serialized.length / LIMIT) * 1000) / 10) : 0,
      };

      panel.innerHTML = `
        <div class="db-stats-grid">
          ${renderDbStatTile('Storage', formatBytes(initialSpace.used), `of ${formatBytes(initialSpace.limit)}`, initialSpace.percentUsed, 'storage')}
          ${renderDbStatTile('Writes', S.dbStats.calls ? formatNumber(S.dbStats.calls.total || 0) : '—',
            S.dbStats.calls ? `${formatNumber(S.dbStats.calls.today || 0)} today` : 'updates after first save', null, 'calls')}
          ${renderDbStatTile('Rate limit', S.dbStats.rateLimit ? `${S.dbStats.rateLimit.remaining} / ${S.dbStats.rateLimit.limit}` : '—',
            S.dbStats.rateLimit?.reset ? `resets in ${Math.max(1, Math.ceil((new Date(S.dbStats.rateLimit.reset).getTime() - Date.now()) / 60000))}m` : 'per hour', null, 'rate')}
        </div>
        <div class="card">
          <div class="card-header">
            <div class="card-title">${svg('database', 13, 2.2)} JSON database</div>
            <div style="display:flex;gap:4px;">
              <button class="btn btn-sm btn-ghost btn-icon" id="btnRefreshDb" aria-label="Refresh">${svg('refresh', 10, 2.2)}</button>
              ${canEdit ? `<button class="btn btn-sm btn-primary" id="btnSaveDb">${svg('check', 10, 2.4)} Save</button>` : ''}
            </div>
          </div>
          <div class="card-body">
            <div class="db-tabs">
              <button class="db-tab active" data-db-view="raw">Raw</button>
              <button class="db-tab" data-db-view="schema">Schema</button>
            </div>
            <div id="dbViewRaw">
              ${canEdit
                ? `<textarea class="textarea mono" id="dbRawEditor" style="min-height:200px;font-family:var(--font-mono);font-size:11px;">${escapeHTML(JSON.stringify(data || {}, null, 2))}</textarea>`
                : `<div class="db-json">${renderJSONPretty(data)}</div>`}
            </div>
            <div id="dbViewSchema" class="db-json hidden">${schema ? renderJSONPretty(schema) : 'No schema defined'}</div>
          </div>
        </div>
      `;

      document.querySelectorAll('[data-db-view]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-db-view]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          $('dbViewRaw').classList.toggle('hidden', btn.dataset.dbView !== 'raw');
          $('dbViewSchema').classList.toggle('hidden', btn.dataset.dbView !== 'schema');
        });
      });
      $('btnRefreshDb')?.addEventListener('click', () => renderPanel());
      $('btnSaveDb')?.addEventListener('click', async () => {
        const raw = $('dbRawEditor')?.value || '';
        let parsed;
        try { parsed = JSON.parse(raw); } catch { toast('Invalid JSON', 'error'); return; }
        const btn = $('btnSaveDb');
        btn.disabled = true;
        btn.innerHTML = 'Saving…';
        try {
          const save = await apiFetch(API_HOST + '?action=db/set', {
            method: 'POST', body: JSON.stringify({ pid: S.pid, data: parsed }),
          });
          if (!save.ok || !save.data?.success) throw new Error(save.data?.error || 'Save failed');
          toast('Saved', 'success');
        } catch (err) {
          toast(err.message || 'Save failed', 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = `${svg('check', 10, 2.4)} Save`;
        }
      });
    } catch (err) {
      panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('database', 'Couldn\'t load data', err.message)}</div></div>`;
    }
  }

  function renderDbStatTile(label, value, subtext, percent, id) {
    let valueClass = 'db-stat-value';
    let barClass = 'db-stat-bar-fill';
    if (percent != null) {
      if (percent >= 85) { valueClass += ' danger'; barClass += ' danger'; }
      else if (percent >= 60) { valueClass += ' warn'; barClass += ' warn'; }
    }
    const bar = percent != null
      ? `<div class="db-stat-bar"><div class="${barClass}" style="width:${Math.min(100, percent)}%"></div></div>`
      : '';
    return `
      <div class="db-stat-tile" data-tile="${escapeAttr(id)}">
        <div class="db-stat-label">${escapeHTML(label)}</div>
        <div class="${valueClass}" data-tile-value>${escapeHTML(value)}</div>
        <div class="db-stat-subtext" data-tile-subtext>${escapeHTML(subtext)}</div>
        ${bar}
      </div>
    `;
  }

  function renderJSONPretty(obj) {
    if (!obj || typeof obj !== 'object') return escapeHTML(String(obj || ''));
    try { return escapeHTML(JSON.stringify(obj, null, 2)); }
    catch { return escapeHTML(String(obj)); }
  }

  function renderLogRow(l) {
    return `<div class="log-entry">
      <div class="log-time">${timeAgo(l.ts)}</div>
      <div class="log-body">
        <div class="log-type">${escapeHTML(l.type || 'event')}</div>
        <div class="log-action">${escapeHTML(l.action || '')}</div>
      </div>
    </div>`;
  }

  async function loadMoreLogs() {
    const newOffset = S.logsOffset + 50;
    const res = await apiFetch(API_HOST + '?action=logs&pid=' + encodeURIComponent(S.pid) + '&limit=50&offset=' + newOffset);
    if (!res.ok || !res.data?.success) return;
    S.logsOffset = newOffset;
    const list = $('logList');
    if (!list) return;
    (res.data.logs || []).forEach(l => list.insertAdjacentHTML('beforeend', renderLogRow(l)));
    if (!res.data.hasMore) $('btnLoadMoreLogs')?.remove();
  }

  async function exportLocalFolio() {
    try {
      const files = await IDB.listFiles(S.pid);
      const versions = await IDB.listVersions(S.pid);
      const payload = {
        folioVersion: 1,
        exportedAt: new Date().toISOString(),
        pid: S.pid,
        name: S.project.name || '',
        slug: S.project.slug || '',
        description: S.project.description || '',
        files: Object.fromEntries(files.map(f => [f.path, f.content])),
        versions: versions.map(v => ({ message: v.message, files: v.files, createdAt: v.createdAt })),
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      triggerDownload(blob, `${S.project.slug || 'project'}-local.folio`);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Export failed', 'error'); }
  }

  async function exportLocalJson() {
    try {
      const files = await IDB.listFiles(S.pid);
      const payload = Object.fromEntries(files.map(f => [f.path, f.content]));
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      triggerDownload(blob, `${S.project.slug || 'project'}-files.json`);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Export failed', 'error'); }
  }

  async function downloadProject(format) {
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    try {
      const url = `${API_HOST}?action=project/export&pid=${encodeURIComponent(S.pid)}&format=${format}`;
      const res = await fetch(url, { headers: { Authorization: `Bearer ${S.session}` } });
      if (!res.ok) throw new Error('Download failed');
      const blob = await res.blob();
      const filename = `${S.project.slug || 'project'}-${S.pid.slice(-6)}.${format === 'folio' ? 'folio' : 'zip'}`;
      triggerDownload(blob, filename);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Download failed', 'error'); }
  }

  async function downloadJsonDb() {
    if (!S.online || S.syncState !== 'synced') { toast('Requires internet', 'warning'); return; }
    try {
      const res = await apiFetch(API_HOST + '?action=db/get&pid=' + encodeURIComponent(S.pid));
      if (!res.ok || !res.data?.success) throw new Error('Failed');
      const blob = new Blob([JSON.stringify(res.data.data || {}, null, 2)], { type: 'application/json' });
      triggerDownload(blob, `${S.project.slug || 'project'}-db.json`);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Download failed', 'error'); }
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

          <div style="font-size:11px;color:var(--theme-text-secondary);line-height:1.5;margin-bottom:10px;">Permanently delete project, files, versions, data. Cannot be undone.</div>
          <button class="btn btn-danger btn-block" id="btnDeleteProject">${svg('trash', 12, 2.2)} Delete project</button>
        </div>
      </div>
    `;
    $('btnClearVersions')?.addEventListener('click', confirmClearVersions);
    $('btnClearCache')?.addEventListener('click', clearLocalCache);
    $('btnDeleteProject')?.addEventListener('click', confirmDeleteProject);
  }

  function confirmClearVersions() {
    confirmModal('Clear all versions?', 'All snapshots will be deleted.', 'Clear', true, async () => {
      showLoading('Clearing', '');
      try {
        if (!S.isLocalOnly && S.session && S.online && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=versions/clear', {
            method: 'POST', body: JSON.stringify({ pid: S.pid }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        const versions = await IDB.listVersions(S.pid);
        for (const v of versions) {
          await dbWrap(dbTx('versions', 'readwrite').delete(v.vid));
        }
        hideLoading();
        toast('Versions cleared', 'success');
        renderPanel();
      } catch (err) { hideLoading(); toast(err.message || 'Failed', 'error'); }
    });
  }

  function clearLocalCache() {
    try {
      localStorage.removeItem(STORAGE.cache + '.' + S.pid);
      sessionStorage.removeItem(STORAGE.expanded + '.' + S.pid);
      toast('Local cache cleared', 'success');
    } catch { toast('Could not clear cache', 'error'); }
  }

  function confirmDeleteProject() {
    openModal(`
      <div class="modal-title">Delete project?</div>
      <div class="modal-desc">Type the project name to confirm. Cannot be undone.</div>
      <div class="field">
        <label class="field-label">Type "${escapeHTML(S.project.name)}"</label>
        <input class="input" id="deleteConfirmInput" placeholder="Project name">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" id="deleteConfirmBtn" disabled>Delete</button>
      </div>
    `);
    $('deleteConfirmInput').addEventListener('input', (e) => {
      $('deleteConfirmBtn').disabled = e.target.value !== S.project.name;
    });
    $('deleteConfirmBtn').addEventListener('click', async () => {
      showLoading('Deleting', '');
      try {
        if (S.session && !S.isLocalOnly && S.online && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=projects/delete', {
            method: 'POST', body: JSON.stringify({ pid: S.pid }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        await IDB.deleteProject(S.pid);
        try {
          localStorage.removeItem(STORAGE.cache + '.' + S.pid);
          localStorage.removeItem(STORAGE.lastTab + '.' + S.pid);
          sessionStorage.removeItem(STORAGE.expanded + '.' + S.pid);
        } catch {}
        hideLoading();
        toast('Deleted', 'success');
        setTimeout(() => { window.location.href = '/projects'; }, 800);
      } catch (err) { hideLoading(); toast(err.message || 'Delete failed', 'error'); }
    });
  }

  // ═══════════════════════════════════════════════════════════
  // GATE HELPER
  // ═══════════════════════════════════════════════════════════

  function gate(panel, { requiresAuth = true, requiresOnline = true, label }) {
    if (S.isLocalOnly && (requiresAuth || requiresOnline)) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('upload', `${label} needs an account`,
          'This is a local project. Sync it to your Folio account to unlock this tab.',
          `<button class="btn btn-primary" id="btnSyncNow">${svg('upload', 12, 2.4)} Sync to account</button>`)}
      </div></div>`;
      $('btnSyncNow')?.addEventListener('click', () => promoteLocalProject());
      return false;
    }
    if (requiresAuth && !S.session) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('key', `${label} needs an account`, 'Sign in to access this tab.',
          `<a class="btn btn-primary" href="/register?next=${encodeURIComponent(location.pathname + location.search)}">Sign in</a>`)}
      </div></div>`;
      return false;
    }
    if (requiresOnline && !S.online) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState('alertCircle', `${label} needs internet`, 'Reconnect to load this data.')}
      </div></div>`;
      return false;
    }
    return true;
  }

  // ═══════════════════════════════════════════════════════════
  // WIRING
  // ═══════════════════════════════════════════════════════════

  function wireGlobal() {
    // Modal close
    $('modalOverlay').addEventListener('click', (e) => {
      if (e.target === $('modalOverlay')) closeModal();
    });
    document.addEventListener('click', (e) => {
      if (e.target.matches('[data-modal-close]')) closeModal();
    });

    // Menu
    $('menuBtn')?.addEventListener('click', openSidebar);
    $('sidebarClose')?.addEventListener('click', closeSidebar);
    $('sidebarBackdrop')?.addEventListener('click', closeSidebar);

    // Header actions
    $('btnDeploy')?.addEventListener('click', () => {
      if (S.project?.deployment?.url) {
        window.open(S.project.deployment.url, '_blank', 'noopener');
      } else {
        deployNow();
      }
    });
    $('btnOpenEditor')?.addEventListener('click', () => openInEditor());
    $('btnBell')?.addEventListener('click', () => window.open('/notifications', '_blank', 'noopener'));
    $('btnMore')?.addEventListener('click', openMoreMenu);
    $('headerIdentity')?.addEventListener('click', openEditProjectModal);

    // Empty project retry
    $('emptyProjectRetry')?.addEventListener('click', () => location.reload());

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if ($('modalOverlay').classList.contains('active')) { closeModal(); return; }
        if ($('sidebar').classList.contains('open')) { closeSidebar(); return; }
      }
      if (!e.target.closest || !e.target.closest('#topTabsBar')) return;
      const idx = S.tabs.findIndex(t => t.id === S.activeTab);
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        switchTab(S.tabs[Math.min(idx + 1, S.tabs.length - 1)].id);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        switchTab(S.tabs[Math.max(idx - 1, 0)].id);
      }
    });

    // Online/offline
    const updateOnline = () => {
      S.online = navigator.onLine;
      $('offlineBanner').classList.toggle('visible', !S.online);
      updateModeBanner();
    };
    window.addEventListener('online', updateOnline);
    window.addEventListener('offline', updateOnline);
    updateOnline();

    // Bell refresh timer
    if (S.bellTimer) clearInterval(S.bellTimer);
    S.bellTimer = setInterval(() => {
      if (document.visibilityState === 'visible') loadNotificationStats();
    }, 60000);
  }

  function openMoreMenu() {
    const items = [
      { label: 'Share', icon: 'share', action: () => { switchTab('sharing'); const url = buildPublicUrl(); if (copyToClipboard(url)) toast('Link copied', 'success', 1200); } },
      { label: 'Refresh', icon: 'refresh', action: () => { loadDeployState(); loadAnalytics({ force: true }); loadLogs({ force: true }); renderPanel(); } },
      { label: 'Download', icon: 'download', action: () => switchTab('downloads') },
      { label: 'Open in editor', icon: 'edit3', action: () => openInEditor() },
      ...(S.isOwner ? [{ label: 'Danger zone', icon: 'alert', action: () => switchTab('danger'), danger: true }] : []),
    ];
    openModal(`
      <div class="modal-title">Actions</div>
      <div style="display:flex;flex-direction:column;gap:2px;margin-top:8px;">
        ${items.map((it, i) => `
          <button class="action-item ${it.danger ? 'danger' : ''}" data-action-idx="${i}" type="button">
            ${svg(it.icon, 14, 2.2)}
            <span>${escapeHTML(it.label)}</span>
          </button>
        `).join('')}
      </div>
      <div class="modal-actions"><button class="btn btn-secondary btn-block" onclick="closeModal()">Close</button></div>
    `);
    $('modalBody').querySelectorAll('[data-action-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.actionIdx, 10);
        const it = items[idx];
        if (it?.action) { closeModal(); setTimeout(it.action, 100); }
      });
    });
  }

  // ═══════════════════════════════════════════════════════════
  // BOOT
  // ═══════════════════════════════════════════════════════════

  async function boot() {
    wireThemeSync();
    wireThemeMediaQuery();
    readSession();
    S.pid = getPid();

    if (!S.pid) {
      showEmptyState('Missing project', 'No project ID in the URL.');
      $('menuBtn')?.style.setProperty('display', 'none');
      return;
    }

    try { await openDB(); } catch (err) {
      console.error('[Project] DB failed:', err);
      showEmptyState('Storage unavailable', 'Your browser blocked local storage. Close other tabs and reload.');
      return;
    }

    const hashTab = getHashTab();
    const lastTab = shouldRememberTab() ? getLastTab() : null;
    S.activeTab = hashTab || lastTab || 'overview';

    const ok = await loadProject();
    if (!ok) return;

    if (!S.tabs.some(t => t.id === S.activeTab)) S.activeTab = 'overview';
    renderSidebar();
    renderTopTabs();
    renderPanel();
    wireGlobal();

    // Background fetches
    loadNotificationStats().catch(() => {});
  }

  document.addEventListener('DOMContentLoaded', boot);

})();
</script>
