  // ═══════════════════════════════════════════════════════════
  // PANEL: FILES (with create / edit / upload / delete)
  // ═══════════════════════════════════════════════════════════

  async function renderFilesPanel(panel) {
    panel.innerHTML = skeletonCard(6);

    let files = [];
    try { files = await IDB.listFiles(S.pid); } catch (err) {
      panel.innerHTML = `<div class="card"><div class="card-body">${emptyState(
        'alertCircle', "Couldn't read local files", String(err?.message || err)
      )}</div></div>`;
      return;
    }

    if (files.length === 0 && S.online && S.session && !S.isLocalOnly) {
      try {
        await pullFilesFromServer(false);
        files = await IDB.listFiles(S.pid);
      } catch {}
    }

    const visibleFiles = files.filter(f => !/(^|\/)\.gitkeep$/i.test(f.path) && !/(^|\/)\.keep$/i.test(f.path));

    S.tabCounts.files = visibleFiles.length;
    renderTopTabs();
    renderSidebar();

    const canEdit = S.isEditor || S.isLocalOnly;

    if (visibleFiles.length === 0 && !canEdit) {
      panel.innerHTML = `<div class="card"><div class="card-body">
        ${emptyState(
          'folder',
          'No files yet',
          'This project has no saved files yet.',
          `<button class="btn btn-primary" id="btnOpenEditorEmpty">${svg('edit3', 12, 2.4)} Open in editor</button>`
        )}
      </div></div>`;
      $('btnOpenEditorEmpty')?.addEventListener('click', () => openInEditor());
      return;
    }

    panel.innerHTML = `
      <div style="display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;">
        ${canEdit ? `
          <button class="btn btn-sm btn-primary" id="btnNewFile">${svg('plus', 10, 2.4)} New file</button>
          <button class="btn btn-sm btn-secondary" id="btnUploadFile">${svg('upload', 10, 2.2)} Upload</button>
        ` : ''}
        <button class="btn btn-sm btn-secondary" id="btnOpenEditor">${svg('edit3', 10, 2.4)} Editor</button>
        <button class="btn btn-sm btn-secondary" id="btnRefreshFiles">${svg('refresh', 10, 2.2)} Refresh</button>
        <button class="btn btn-sm btn-secondary" id="btnExpandAll">${svg('expand', 10, 2.2)}</button>
        <button class="btn btn-sm btn-secondary" id="btnCollapseAll">${svg('collapse', 10, 2.2)}</button>
        <input class="input" id="fileFilter" placeholder="Filter…" style="flex:1;min-width:100px;height:26px;font-size:11px;">
      </div>
      ${visibleFiles.length === 0 ? `
        <div class="card"><div class="card-body">
          <div class="empty-state" style="padding:24px 12px;">
            <div class="empty-state-icon">${svg('folder', 18, 2)}</div>
            <div class="empty-state-title">No files yet</div>
            <div class="empty-state-desc">Create your first file or upload one.</div>
          </div>
        </div>
      ` : `<div class="file-tree-wrap" id="fileTreeContainer"></div>`}
      <input type="file" id="fileUploadInput" multiple style="display:none;">
    `;

    const treeContainer = $('fileTreeContainer');
    const filterInput = $('fileFilter');
    if (filterInput) filterInput.value = S.fileFilter;

    const tree = buildFileTree(visibleFiles.map(f => f.path));

    const render = () => {
      if (!treeContainer) return;
      treeContainer.innerHTML = '';
      const filter = S.fileFilter.toLowerCase();
      const filtered = filter
        ? visibleFiles.filter(f => f.path.toLowerCase().includes(filter))
        : visibleFiles;

      if (filtered.length === 0) {
        treeContainer.innerHTML = `<div class="empty-state" style="padding:16px 8px;">
          <div class="empty-state-title" style="font-size:12px;">No matches</div>
        </div>`;
        return;
      }
      const filteredTree = buildFileTree(filtered.map(f => f.path));
      renderFileTreeNodes(treeContainer, filteredTree, 0, filter ? true : false, render);
    };

    filterInput?.addEventListener('input', debounce((e) => {
      S.fileFilter = e.target.value;
      render();
    }, 150));

    $('btnNewFile')?.addEventListener('click', () => createNewFile(panel));
    $('btnUploadFile')?.addEventListener('click', () => $('fileUploadInput')?.click());
    $('fileUploadInput')?.addEventListener('change', (e) => handleFileUpload(e, panel));
    $('btnOpenEditor')?.addEventListener('click', () => openInEditor());
    $('btnRefreshFiles')?.addEventListener('click', () => refreshFilesPanel(panel));
    $('btnExpandAll')?.addEventListener('click', () => {
      const addAll = (node) => {
        for (const [_, child] of Object.entries(node.children)) {
          S.expandedFolders.add(child.path);
          addAll(child);
        }
      };
      addAll(tree);
      saveExpanded();
      render();
    });
    $('btnCollapseAll')?.addEventListener('click', () => {
      S.expandedFolders.clear();
      saveExpanded();
      render();
    });

    render();
  }

  function buildFileTree(paths) {
    const root = { name: '', children: {}, files: [], path: '' };
    for (const path of paths) {
      const parts = path.split('/');
      let node = root;
      for (let i = 0; i < parts.length - 1; i++) {
        const part = parts[i];
        if (!node.children[part]) {
          node.children[part] = {
            name: part, children: {}, files: [],
            path: parts.slice(0, i + 1).join('/'),
          };
        }
        node = node.children[part];
      }
      node.files.push({ name: parts[parts.length - 1], path });
    }
    return root;
  }

  function renderFileTreeNodes(container, node, depth, forceExpand, rerender) {
    const canEdit = S.isEditor || S.isLocalOnly;
    const folderNames = Object.keys(node.children).sort();
    for (const folderName of folderNames) {
      const folder = node.children[folderName];
      const isExpanded = forceExpand || S.expandedFolders.has(folder.path);

      const row = document.createElement('div');
      row.className = 'tree-node is-folder' + (isExpanded ? ' expanded' : '');
      row.style.paddingLeft = (6 + depth * 12) + 'px';
      row.innerHTML = `
        <span class="chevron">${svg('chevronRight', 9, 2.4)}</span>
        <span class="icon" style="color:var(--theme-primary);">${svg('folder', 12, 2.2)}</span>
        <span class="name">${escapeHTML(folderName)}</span>
      `;
      row.addEventListener('click', () => {
        if (S.expandedFolders.has(folder.path)) S.expandedFolders.delete(folder.path);
        else S.expandedFolders.add(folder.path);
        saveExpanded();
        rerender();
      });
      container.appendChild(row);

      if (isExpanded) renderFileTreeNodes(container, folder, depth + 1, forceExpand, rerender);
    }

    const files = node.files.sort((a, b) => a.name.localeCompare(b.name));
    for (const file of files) {
      const row = document.createElement('div');
      row.className = 'tree-node';
      row.style.paddingLeft = (6 + depth * 12) + 'px';
      row.innerHTML = `
        <span class="chevron" style="visibility:hidden;"></span>
        <span class="icon" style="color:var(--theme-text-tertiary);">${svg(fileIconName(file.path), 12, 2)}</span>
        <span class="name" title="${escapeAttr(file.path)}">${escapeHTML(file.name)}</span>
        ${canEdit ? `
          <button class="open-btn" data-file-edit title="Edit">${svg('edit', 10, 2.2)}</button>
          <button class="open-btn" data-file-delete title="Delete" style="color:var(--theme-danger);">${svg('trash', 10, 2.2)}</button>
        ` : ''}
        <button class="open-btn" data-file-open title="Open in editor">${svg('external', 10, 2.2)}</button>
      `;

      row.querySelector('[data-file-open]')?.addEventListener('click', (e) => {
        e.stopPropagation();
        openInEditor(file.path);
      });
      row.querySelector('[data-file-edit]')?.addEventListener('click', (e) => {
        e.stopPropagation();
        openFileEditor(file.path);
      });
      row.querySelector('[data-file-delete]')?.addEventListener('click', (e) => {
        e.stopPropagation();
        confirmDeleteFile(file.path);
      });

      row.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        if (canEdit) openFileEditor(file.path);
        else openInEditor(file.path);
      });

      container.appendChild(row);
    }
  }

  async function createNewFile(panel) {
    if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }
    openModal(`
      <div class="modal-title">New file</div>
      <div class="modal-desc">Use a path like <code style="font-family:var(--font-mono);font-size:11px;">src/app.js</code> for nested files.</div>
      <div class="field">
        <label class="field-label">File path</label>
        <input class="input mono" id="newFilePath" placeholder="/" autocomplete="off" spellcheck="false">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="newFileCreate">Create</button>
      </div>
    `);
    $('newFilePath').focus();
    $('newFilePath').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') $('newFileCreate').click();
    });
    $('newFileCreate').addEventListener('click', async () => {
      const path = $('newFilePath').value.trim().replace(/^\/+/, '');
      if (!path) { toast('Path required', 'error'); return; }
      if (!/^[a-zA-Z0-9._\-\/]+$/.test(path)) {
        toast('Use letters, numbers, dots, dashes, underscores, slashes', 'error');
        return;
      }
      const existing = await IDB.getFile(S.pid, path);
      if (existing) { toast('File already exists', 'warning'); return; }
      try {
        await IDB.putFile(S.pid, path, '');
        if (S.online && S.session && !S.isLocalOnly) {
          await apiFetch(API_HOST + '?action=project/sync-back', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, files: { [path]: '' } }),
          });
        }
        closeModal();
        toast(`Created ${path}`, 'success');
        renderFilesPanel(panel);
        setTimeout(() => openFileEditor(path), 200);
      } catch (err) {
        toast(err.message || 'Create failed', 'error');
      }
    });
  }

  async function openFileEditor(path) {
    let content = '';
    try {
      const file = await IDB.getFile(S.pid, path);
      content = file?.content || '';
    } catch {}
    const ext = (path.split('.').pop() || '').toLowerCase();
    const isMono = ['html','htm','css','js','mjs','cjs','jsx','ts','tsx','json','md','txt','svg','xml','yml','yaml'].includes(ext);
    const isText = isTextFile(path) || isMono;

    openModal(`
      <div class="modal-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(path)}</span>
        <button class="btn btn-ghost btn-sm btn-icon" id="fileEditorClose" aria-label="Close">${svg('x', 12, 2.4)}</button>
      </div>
      <div class="field" style="margin-bottom:6px;">
        ${isText
          ? `<textarea class="textarea mono" id="fileEditorContent" style="min-height:45vh;font-family:var(--font-mono);font-size:12px;line-height:1.5;">${escapeHTML(content)}</textarea>`
          : `<div style="font-size:11.5px;color:var(--theme-text-tertiary);padding:12px;background:var(--theme-glass-bg);border-radius:8px;text-align:center;">Binary file — use the editor to view or replace.</div>`}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
        <span style="font-size:10.5px;color:var(--theme-text-tertiary);" id="fileEditorSize">${isText ? content.length + ' chars' : ''}</span>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-ghost btn-sm" id="fileEditorOpenEditor">${svg('external', 10, 2.2)} Open in editor</button>
          ${isText ? `<button class="btn btn-primary btn-sm" id="fileEditorSave">${svg('check', 10, 2.4)} Save</button>` : ''}
        </div>
      </div>
    `);

    $('fileEditorClose').addEventListener('click', closeModal);
    $('fileEditorOpenEditor').addEventListener('click', () => { closeModal(); openInEditor(path); });

    const ta = $('fileEditorContent');
    if (ta) {
      ta.addEventListener('input', () => {
        const el = $('fileEditorSize');
        if (el) el.textContent = `${ta.value.length} chars`;
      });
    }

    $('fileEditorSave')?.addEventListener('click', async () => {
      const btn = $('fileEditorSave');
      btn.disabled = true;
      const prev = btn.innerHTML;
      btn.innerHTML = 'Saving…';
      try {
        const text = ta.value;
        await IDB.putFile(S.pid, path, text);
        if (S.online && S.session && !S.isLocalOnly) {
          const res = await apiFetch(API_HOST + '?action=project/sync-back', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, files: { [path]: text } }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Server save failed');
        }
        toast('Saved', 'success');
        if (S.activeTab === 'files') renderPanel();
      } catch (err) {
        toast(err.message || 'Save failed', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = prev;
      }
    });
  }

  function confirmDeleteFile(path) {
    if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }
    confirmModal(
      `Delete ${path.split('/').pop()}?`,
      'This removes the file locally. Server deletion requires the file/delete API endpoint.',
      'Delete',
      true,
      async () => {
        showLoading('Deleting', '');
        try {
          await dbWrap(dbTx('files', 'readwrite').delete([S.pid, path]));
          if (S.online && S.session && !S.isLocalOnly) {
            // Best effort — server may not support this action
            try {
              await apiFetch(API_HOST + '?action=file/delete', {
                method: 'POST',
                body: JSON.stringify({ pid: S.pid, path }),
              });
            } catch {}
          }
          hideLoading();
          toast('File deleted', 'success');
          renderPanel();
        } catch (err) {
          hideLoading();
          toast(err.message || 'Delete failed', 'error');
        }
      }
    );
  }

  async function handleFileUpload(e, panel) {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (files.length === 0) return;
    if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }

    showLoading('Uploading', `0 / ${files.length}`);
    let uploaded = 0;
    const fileMap = {};
    for (const file of files) {
      try {
        const text = await file.text();
        await IDB.putFile(S.pid, file.name, text);
        fileMap[file.name] = text;
        uploaded++;
        setLoadingDesc(`${uploaded} / ${files.length}`);
      } catch (err) {
        console.warn('[Upload]', file.name, err);
      }
    }
    if (S.online && S.session && !S.isLocalOnly && Object.keys(fileMap).length > 0) {
      try {
        await apiFetch(API_HOST + '?action=project/sync-back', {
          method: 'POST',
          body: JSON.stringify({ pid: S.pid, files: fileMap }),
        });
      } catch {}
    }
    hideLoading();
    toast(`Uploaded ${uploaded} file${uploaded === 1 ? '' : 's'}`, 'success');
    renderFilesPanel(panel);
  }

  function openInEditor(filePath) {
    const url = new URL('/', location.origin);
    url.searchParams.set('pid', S.pid);
    if (filePath) url.searchParams.set('file', filePath);
    window.location.href = url.toString();
  }

  async function refreshFilesPanel(panel) {
    if (S.online && S.session && !S.isLocalOnly) {
      try { await pullFilesFromServer(false); } catch {}
    }
    renderFilesPanel(panel);
  }

  async function pullFilesFromServer(showToast) {
    try {
      if (showToast) toast('Files already in sync', 'info');
    } catch (err) {
      if (showToast) toast(err.message || 'Could not pull files', 'error');
      throw err;
    }
  }

              <a href="${escapeAttr(current.url)}" target="_blank" rel="noopener" class="mono" style="font-size:10.5px;word-break:break-all;">${escapeHTML(current.url)}</a>
              ${S.isEditor ? `<button class="btn btn-secondary btn-sm" id="btnTakeOffline">${svg('eyeOff', 10, 2.2)} Take offline</button>` : ''}
            </div>` : isOffline ? `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
              <span class="vis-badge private">${svg('eyeOff', 9, 2.2)} Offline</span>
              <span style="font-size:10px;color:var(--theme-text-tertiary);">${timeAgo(current.offlineAt)}</span>
            </div>
            ${S.isEditor ? `<button class="btn btn-primary btn-sm" id="btnDeployNow">${svg('rocket', 10, 2.4)} Deploy to go live</button>` : ''}

  function renderDeploymentRow(d, currentId) {
    const isCurrent = d.id === currentId;
    return `<div class="row-item">
      <div class="row-icon">${svg(isCurrent ? 'checkCircle' : 'rocket', 13, 2.2)}</div>
      <div class="row-content">
        <div class="row-title">${d.versionId ? `v${escapeHTML(d.versionId.slice(-6))}` : 'Current'}
          ${isCurrent ? '<span class="vis-badge public" style="margin-left:5px;font-size:8px;">Current</span>' : ''}</div>
        <div class="row-sub">${timeAgo(d.deployedAt)} · ${d.state || 'READY'}</div>
      </div>
      <div class="row-actions">
        ${d.url ? `<a class="btn btn-ghost btn-sm btn-icon" href="${escapeAttr(d.url)}" target="_blank" rel="noopener" aria-label="Open">${svg('external', 10, 2.2)}</a>` : ''}
        ${S.isEditor && !isCurrent && d.versionId ? `<button class="btn btn-ghost btn-sm btn-icon" data-redeploy="${escapeAttr(d.versionId)}" aria-label="Redeploy">${svg('refresh', 10, 2.2)}</button>` : ''}
        ${S.isOwner ? `<button class="btn btn-ghost btn-sm btn-icon" data-delete-deploy="${escapeAttr(d.id)}" aria-label="Delete" style="color:var(--theme-danger);">${svg('trash', 10, 2.2)}</button>` : ''}
      </div>
    </div>`;

  async function deployNow() {
    if (!S.isEditor || !S.online) { toast('Requires internet', 'warning'); return; }
    if (S.isLocalOnly) {
      confirmModal(
        'Sync project first?',
        'Local projects must be synced to your account before they can be deployed.',
        'Sync now',
        false,
        () => promoteLocalProject()
      );
      return;
    }

    let files = [];
    try { files = await IDB.listFiles(S.pid); } catch {}
    const fileMap = {};
    for (const f of files) {
      if (/(^|\/)\.gitkeep$/i.test(f.path) || /(^|\/)\.keep$/i.test(f.path)) continue;
      fileMap[f.path] = f.content || '';
    }
    if (Object.keys(fileMap).length === 0) {
      toast('No files to deploy', 'warning');
      return;
    }

    confirmModal(
      `Deploy ${Object.keys(fileMap).length} file${Object.keys(fileMap).length === 1 ? '' : 's'}?`,
      'This will build and deploy your project to a live URL.',
      'Deploy',
      false,
      async () => {
        showLoading('Deploying', 'Building and deploying…');
        try {
          const res = await apiFetch(API_HOST + '?action=deploy', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, files: fileMap }),
          });
          hideLoading();
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Deploy failed');
          toast('Deploy started', 'success');
          setTimeout(() => renderPanel(), 2000);
        } catch (err) { hideLoading(); toast(err.message || 'Deploy failed', 'error'); }
      }
    );
  }

  async function redeployVersion(versionId) {
    if (!S.isEditor || !S.online) { toast('Requires internet', 'warning'); return; }
    confirmModal('Redeploy this version?', 'This will redeploy the files from that version.', 'Redeploy', false, async () => {
      showLoading('Redeploying', '');
      try {
        const res = await apiFetch(API_HOST + '?action=redeploy', {
          method: 'POST', body: JSON.stringify({ pid: S.pid, versionId }),
        });
        hideLoading();
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Redeploy failed');
        toast('Redeploying', 'success');
        setTimeout(() => renderPanel(), 2000);
      } catch (err) { hideLoading(); toast(err.message || 'Redeploy failed', 'error'); }
    });
  }

  async function takeOffline() {

    confirmModal('Take offline?', 'The live URL will stop working. Files stay intact.', 'Take offline', true, async () => {

  async function renderAnalyticsPanel(panel) {
    if (!gate(panel, { label: 'Analytics' })) return;
    panel.innerHTML = skeletonCard(4) + skeletonCard(6);
    const [analyticsRes, activityRes] = await Promise.all([
      apiFetch(API_ANALYTICS + '?action=project&pid=' + encodeURIComponent(S.pid)),
      apiFetch(API_ANALYTICS + '?action=activity&pid=' + encodeURIComponent(S.pid) + '&limit=10'),

      panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('chart', 'Couldn\'t load analytics', 'Try refreshing.')}</div></div>`;
      return;
    }
    const data = analyticsRes.data;
    const topPages = data.topPages || [];
    const trend = data.trend7 || [];
    const maxTrend = Math.max(1, ...trend.map(t => t.count));

    panel.innerHTML = `
      <div class="stats-grid">
        <div class="stat-tile"><div class="stat-label">Today</div><div class="stat-value">${formatNumber(data.today || 0)}</div></div>
        <div class="stat-tile"><div class="stat-label">7-day</div><div class="stat-value">${formatNumber(trend.reduce((s, t) => s + t.count, 0))}</div></div>
        <div class="stat-tile"><div class="stat-label">Total</div><div class="stat-value">${formatNumber(data.total || 0)}</div></div>
        <div class="stat-tile"><div class="stat-label">DB ops</div><div class="stat-value">${formatNumber((data.db?.reads || 0) + (data.db?.writes || 0))}</div></div>

        <div class="card-body">
          <div style="display:flex;align-items:flex-end;gap:4px;height:60px;">
            ${trend.map(t => {
              const pct = (t.count / maxTrend) * 100;
              return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
                <div style="width:100%;height:${Math.max(3, pct)}%;background:var(--theme-primary);border-radius:3px 3px 0 0;min-height:3px;opacity:0.8;"></div>
                <div style="font-size:8px;color:var(--theme-text-tertiary);font-weight:700;">${t.date?.slice(-5) || ''}</div></div>`;

      <div class="card">
        <div class="card-header"><div class="card-title">${svg('eye', 13, 2.2)} Top pages</div></div>
        <div class="card-body tight">
          ${topPages.length === 0 ? emptyState('eye', 'No pages yet', 'Analytics will show once visitors land on your deployed site.')
            : `<div class="row-list">${topPages.map(t => `
              <div class="row-item">
                <div class="row-icon">${svg('file', 13, 2.2)}</div>
                <div class="row-content"><div class="row-title mono" style="font-size:10.5px;">${escapeHTML(t.path || '/')}</div>
                  <div class="row-sub">${formatNumber(t.count || 0)} views</div></div>
              </div>`).join('')}</div>`}
        </div>
      </div>
      ${activityRes.ok && activityRes.data?.activity?.length > 0 ? `
        <div class="card">
          <div class="card-header"><div class="card-title">${svg('clock', 13, 2.2)} Activity</div></div>

                  <div class="row-sub">${timeAgo(a.ts)}</div></div>
              </div>`).join('')}
          </div></div>
        </div>` : ''}
    `;
  }

  async function loadPendingInvites() {
  const card = $('pendingInvitesCard');
  const body = $('pendingInvitesBody');
  if (!card || !body) return;
  try {
    const res = await apiFetch(API_HOST + '?action=invite/list&pid=' + encodeURIComponent(S.pid));
    if (!res.ok || !res.data?.success) {
      body.innerHTML = `<div style="padding:12px;text-align:center;font-size:11px;color:var(--theme-text-tertiary);">Couldn't load invites.</div>`;
      return;
    }
    const invites = (res.data.invites || []).filter(i => !i.used);
    const now = Date.now();

    if (invites.length === 0) {
      card.style.display = 'none';
      return;
    }
    card.style.display = '';
    body.innerHTML = `<div class="row-list">
      ${invites.map(i => {
        const expired = i.expiresAt && i.expiresAt < now;
        const daysLeft = i.expiresAt ? Math.max(0, Math.ceil((i.expiresAt - now) / (24 * 60 * 60 * 1000))) : null;
        return `
          <div class="row-item">
            <div class="row-icon" style="${expired ? 'color:var(--theme-warning);' : ''}">
              ${svg(expired ? 'alert' : 'clock', 13, 2.2)}
            </div>
            <div class="row-content">
              <div class="row-title mono" style="font-size:10px;">${escapeHTML(i.invitedUid?.slice(0, 12) || 'invited user')}${i.invitedUid?.length > 12 ? '…' : ''}</div>
              <div class="row-sub">
                ${escapeHTML(i.role || 'viewer')} ·
                ${expired
                  ? '<span style="color:var(--theme-warning);">expired</span>'
                  : `${daysLeft}d left`}
              </div>
            </div>
            <div class="row-actions">
              <button class="btn btn-ghost btn-sm btn-icon" data-copy-invite="${escapeAttr(i.token)}" title="Copy link">
                ${svg('copy', 10, 2.2)}
              </button>
              <button class="btn btn-ghost btn-sm btn-icon" data-cancel-invite="${escapeAttr(i.token)}" title="Cancel" style="color:var(--theme-danger);">
                ${svg('trash', 10, 2.2)}
              </button>
            </div>
          </div>`;
      }).join('')}
    </div>`;

    body.querySelectorAll('[data-copy-invite]').forEach(btn => {
      btn.addEventListener('click', () => {
        const token = btn.dataset.copyInvite;
        const url = `${location.origin}/invite.html?token=${encodeURIComponent(token)}`;
        if (copyToClipboard(url)) toast('Invite link copied', 'success', 1400);
        else toast('Copy failed', 'error');
      });
    });

    body.querySelectorAll('[data-cancel-invite]').forEach(btn => {
      btn.addEventListener('click', () => {
        const token = btn.dataset.cancelInvite;
        confirmModal('Cancel this invite?', 'The recipient will no longer be able to use this link.', 'Cancel invite', true, async () => {
          try {
            const cancelRes = await apiFetch(API_HOST + '?action=invite/cancel', {
              method: 'POST',
              body: JSON.stringify({ token }),
            });
            if (!cancelRes.ok || !cancelRes.data?.success) {
              throw new Error(cancelRes.data?.error || 'Failed');
            }
            toast('Invite cancelled', 'success');
            loadPendingInvites();
          } catch (err) {
            toast(err.message || 'Could not cancel', 'error');
          }
        });
      });
    });
  } catch {
    body.innerHTML = `<div style="padding:12px;text-align:center;font-size:11px;color:var(--theme-text-tertiary);">Couldn't load invites.</div>`;
  }
}
  function axisLabel(axis) {
    return { profile: 'Show in profile', liveSite: 'Live site link', code: 'Code viewer', languages: 'Language breakdown', db: 'JSON database API' }[axis] || axis;
  }
  function axisDesc(axis) {

  async function toggleVisibility(axis, btn) {
    if (!S.isOwner) { toast('Only owner can change visibility', 'warning'); return; }
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    const current = S.project.visibility?.[axis];
    const next = current === 'public' ? 'private' : 'public';
    btn.classList.toggle('on', next === 'public');
    try {
      const res = await apiFetch(API_HOST + '?action=visibility', {
        method: 'POST', body: JSON.stringify({ pid: S.pid, visibility: { [axis]: next } }),
      });
      if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
      S.project.visibility = { ...S.project.visibility, [axis]: next };
      cacheProject(S.project);
      toast(next, 'success', 1200);
    } catch (err) {
      btn.classList.toggle('on', current === 'public');
      toast(err.message || 'Update failed', 'error');
    }
  }

  async function renderDataPanel(panel) {
    if (!gate(panel, { label: 'Data' })) return;
    panel.innerHTML = skeletonCard(4);
    try {
      const res = await apiFetch(API_HOST + '?action=db/get&pid=' + encodeURIComponent(S.pid));
      if (!res.ok || !res.data?.success) {
        panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('database', 'Couldn\'t load data', res.data?.error || 'Try refreshing.')}</div></div>`;
        return;
      }
      const { data, schema } = res.data;
      const canEdit = S.isEditor;
      panel.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="card-title">${svg('database', 13, 2.2)} JSON database</div>
            <div style="display:flex;gap:4px;">
              <button class="btn btn-sm btn-ghost btn-icon" id="btnRefreshDb" aria-label="Refresh">${svg('refresh', 10, 2.2)}</button>
              ${canEdit ? `<button class="btn btn-sm btn-primary" id="btnSaveDb">${svg('check', 10, 2.4)} Save</button>` : ''}
            </div>
          </div>
          <div class="card-body">
            <div class="db-tabs">
              <button class="db-tab active" data-db-view="raw">Raw</button>
              <button class="db-tab" data-db-view="schema">Schema</button>
            </div>
            <div id="dbViewRaw">
              ${canEdit
                ? `<textarea class="textarea mono" id="dbRawEditor" style="min-height:200px;font-family:var(--font-mono);font-size:11px;">${escapeHTML(JSON.stringify(data || {}, null, 2))}</textarea>`
                : `<div class="db-json">${renderJSONPretty(data)}</div>`}
            </div>
            <div id="dbViewSchema" class="db-json hidden">${schema ? renderJSONPretty(schema) : 'No schema defined'}</div>
          </div>
        </div>
      `;
      document.querySelectorAll('[data-db-view]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-db-view]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          $('dbViewRaw').classList.toggle('hidden', btn.dataset.dbView !== 'raw');
          $('dbViewSchema').classList.toggle('hidden', btn.dataset.dbView !== 'schema');
        });
      });
      $('btnRefreshDb')?.addEventListener('click', () => renderPanel());
      $('btnSaveDb')?.addEventListener('click', async () => {
        const raw = $('dbRawEditor')?.value || '';
        let parsed;
        try { parsed = JSON.parse(raw); }
        catch { toast('Invalid JSON', 'error'); return; }
        const btn = $('btnSaveDb');
        btn.disabled = true;
        const prev = btn.innerHTML;
        btn.innerHTML = 'Saving…';
        try {
          const save = await apiFetch(API_HOST + '?action=db/set', {
            method: 'POST', body: JSON.stringify({ pid: S.pid, data: parsed }),
          });
          if (!save.ok || !save.data?.success) throw new Error(save.data?.error || 'Save failed');
          toast('Saved', 'success');
        } catch (err) {
          toast(err.message || 'Save failed', 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = prev;
        }
      });
    } catch (err) {
      panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('database', 'Couldn\'t load data', err.message)}</div></div>`;
    }
  }

  function renderJSONPretty(obj) {
    if (!obj || typeof obj !== 'object') return escapeHTML(String(obj || ''));
    try { return escapeHTML(JSON.stringify(obj, null, 2)); }
    catch { return escapeHTML(String(obj)); }
  }

  async function loadMoreLogs() {
    const newOffset = S.logsOffset + 50;
    const res = await apiFetch(API_HOST + '?action=logs&pid=' + encodeURIComponent(S.pid) + '&limit=50&offset=' + newOffset);
    if (!res.ok || !res.data?.success) return;
    S.logsOffset = newOffset;

  async function exportLocalFolio() {
    try {
      const files = await IDB.listFiles(S.pid);
      const versions = await IDB.listVersions(S.pid);
      const payload = {
        folioVersion: 1,
        exportedAt: new Date().toISOString(),
        pid: S.pid,
        name: S.project.name || 'Untitled project',
        slug: S.project.slug || '',
        description: S.project.description || '',
        files: Object.fromEntries(files.map(f => [f.path, f.content])),
        versions: versions.map(v => ({ message: v.message, files: v.files, createdAt: v.createdAt })),
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      triggerDownload(blob, `${S.project.slug || 'project'}-local.folio`);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Export failed', 'error'); }
  }

  async function exportLocalJson() {
    try {
      const files = await IDB.listFiles(S.pid);
      const payload = Object.fromEntries(files.map(f => [f.path, f.content]));
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      triggerDownload(blob, `${S.project.slug || 'project'}-files.json`);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Export failed', 'error'); }
  }

  async function downloadProject(format) {
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    try {
      const url = `${API_HOST}?action=project/export&pid=${encodeURIComponent(S.pid)}&format=${format}`;
      const res = await fetch(url, { headers: { Authorization: `Bearer ${S.session}` } });
      if (!res.ok) throw new Error('Download failed');
      const blob = await res.blob();
      const filename = `${S.project.slug || 'project'}-${S.pid.slice(-6)}.${format === 'folio' ? 'folio' : 'zip'}`;
      triggerDownload(blob, filename);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Download failed', 'error'); }
  }

  async function downloadJsonDb() {
    if (!S.online || S.isLocalOnly) { toast('Requires internet', 'warning'); return; }
    try {
      const res = await apiFetch(API_HOST + '?action=db/get&pid=' + encodeURIComponent(S.pid));
      if (!res.ok || !res.data?.success) throw new Error('Failed');
      const blob = new Blob([JSON.stringify(res.data.data || {}, null, 2)], { type: 'application/json' });
      triggerDownload(blob, `${S.project.slug || 'project'}-db.json`);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Download failed', 'error'); }
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function handleImportFile(e) {
    const file = e.target.files?.[0]; if (!file) return;
    e.target.value = '';
    confirmModal('Import backup?', 'Files and DB will merge into this project.', 'Import', false, async () => {
      showLoading('Importing', '');
      try {
        const text = await file.text();
        let data = null;
        try { data = JSON.parse(text); } catch { hideLoading(); toast('Only JSON backups supported', 'info', 3000); return; }
        const res = await apiFetch(API_HOST + '?action=project/sync-back', {
          method: 'POST',
          body: JSON.stringify({
            pid: S.pid, files: data.files || null, versions: data.versions || null,
            db: data.db || null, schema: data.schema || null, manifest: data.manifest || null,
          }),
        });
        hideLoading();
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        toast('Imported', 'success');
        renderPanel();
      } catch (err) { hideLoading(); toast(err.message || 'Import failed', 'error'); }
    });
  }

    panel.innerHTML = `
      <div class="card">
        <div class="card-header"><div class="card-title">${svg('download', 13, 2.2)} Download</div></div>
        <div class="card-body">
          <p style="font-size:11px;color:var(--theme-text-secondary);line-height:1.5;margin-bottom:12px;">Download the public files from this project to work on them offline.</p>
          <button class="btn btn-primary btn-block" id="btnDownloadPublicFolio">${svg('download', 12, 2.4)} .folio</button>
          <div class="field-hint">Public files + metadata.</div>
          <button class="btn btn-secondary btn-block" id="btnDownloadPublicZip" style="margin-top:8px;">${svg('download', 12, 2.4)} .zip</button>
          <div class="field-hint">Raw files only.</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">${svg('folder', 13, 2.2)} Save to your account</div></div>
        <div class="card-body">
          <p style="font-size:11px;color:var(--theme-text-secondary);line-height:1.5;margin-bottom:12px;">Create your own copy of the public files.</p>
          <button class="btn btn-primary btn-block" id="btnCopyProject">${svg('copy', 12, 2.2)} Save as copy</button>
        </div>
      </div>
    `;
    $('btnDownloadPublicFolio')?.addEventListener('click', () => downloadProjectPublic('folio'));
    $('btnDownloadPublicZip')?.addEventListener('click', () => downloadProjectPublic('zip'));
    $('btnCopyProject')?.addEventListener('click', saveAsCopy);
  }

  async function downloadProjectPublic(format) {
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    try {
      const url = `${API_HOST}?action=project/export&pid=${encodeURIComponent(S.pid)}&format=${format}&publicOnly=true`;
      const res = await fetch(url, { headers: { Authorization: `Bearer ${S.session}` } });
      if (!res.ok) throw new Error('Download failed');
      const blob = await res.blob();
      const filename = `${S.project.slug || 'project'}-public.${format === 'folio' ? 'folio' : 'zip'}`;
      triggerDownload(blob, filename);
      toast('Downloaded', 'success');
    } catch (err) { toast(err.message || 'Download failed', 'error'); }
  }

  async function saveAsCopy() {
    confirmModal('Save as copy?', 'A new project will be created in your account.', 'Save', false, async () => {
      showLoading('Creating copy', '');
      try {
        const res = await apiFetch(API_HOST + '?action=project/copy', {
          method: 'POST', body: JSON.stringify({ pid: S.pid, newName: `${S.project.name} (copy)` }),
        });
        hideLoading();
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Copy failed');
        toast('Copy created', 'success');
        setTimeout(() => { window.location.href = '/project.html?pid=' + encodeURIComponent(res.data.pid); }, 800);
      } catch (err) { hideLoading(); toast(err.message || 'Copy failed', 'error'); }
    });
  }

  // ═══════════════════════════════════════════════════════════
  // PANEL: DANGER
  // ═══════════════════════════════════════════════════════════

  function renderDangerPanel(panel) {
    if (!S.isOwner) {
      panel.innerHTML = `<div class="card card-danger"><div class="card-body">${emptyState('alert', 'Owner only', 'Only the project owner can access danger zone.')}</div></div>`;
      return;
    }
    panel.innerHTML = `
      <div class="card card-danger">
        <div class="card-header"><div class="card-title">${svg('trash', 13, 2.2)} Clear versions</div></div>
        <div class="card-body">
          <div style="font-size:11px;color:var(--theme-text-secondary);line-height:1.5;margin-bottom:10px;">Delete all version snapshots. Files stay.</div>
          <button class="btn btn-outline-danger btn-block" id="btnClearVersions">${svg('trash', 12, 2.2)} Clear versions</button>
        </div>
      </div>
      <div class="card card-danger">
        <div class="card-header"><div class="card-title">${svg('refresh', 13, 2.2)} Clear cache</div></div>
        <div class="card-body">
          <div style="font-size:11px;color:var(--theme-text-secondary);line-height:1.5;margin-bottom:10px;">Clear local cache. No server data affected.</div>
          <button class="btn btn-outline-danger btn-block" id="btnClearCache">${svg('refresh', 12, 2.2)} Clear cache</button>
        </div>
      </div>
      <div class="card card-danger">
        <div class="card-header"><div class="card-title">${svg('alert', 13, 2.2)} Delete project</div></div>
        <div class="card-body">
          <div style="font-size:11px;color:var(--theme-text-secondary);line-height:1.5;margin-bottom:10px;">Permanently delete project, files, versions, data. Cannot be undone.</div>
          <button class="btn btn-danger btn-block" id="btnDeleteProject">${svg('trash', 12, 2.2)} Delete project</button>
        </div>
      </div>
    `;
    $('btnClearVersions')?.addEventListener('click', confirmClearVersions);
    $('btnClearCache')?.addEventListener('click', clearLocalCache);
    $('btnDeleteProject')?.addEventListener('click', confirmDeleteProject);
  }

  function confirmClearVersions() {
    confirmModal('Clear all versions?', 'All snapshots will be deleted.', 'Clear', true, async () => {
      showLoading('Clearing', '');
      try {
        if (!S.isLocalOnly && S.session && S.online) {
          const res = await apiFetch(API_HOST + '?action=versions/clear', {
            method: 'POST', body: JSON.stringify({ pid: S.pid }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        const versions = await IDB.listVersions(S.pid);
        for (const v of versions) {
          await dbWrap(dbTx('versions', 'readwrite').delete(v.vid));
        }
        hideLoading();
        toast('Versions cleared', 'success');
        renderPanel();
      } catch (err) { hideLoading(); toast(err.message || 'Failed', 'error'); }
    });
  }

  function clearLocalCache() {
    try {
      localStorage.removeItem(STORAGE.cache + '.' + S.pid);
      sessionStorage.removeItem(STORAGE.expanded + '.' + S.pid);
      toast('Local cache cleared', 'success');
    } catch { toast('Could not clear cache', 'error'); }
  }

  function confirmDeleteProject() {
    openModal(`
      <div class="modal-title">Delete project?</div>
      <div class="modal-desc">Type the project name to confirm. Cannot be undone.</div>
      <div class="field">
        <label class="field-label">Type "${escapeHTML(S.project.name)}"</label>
        <input class="input" id="deleteConfirmInput" placeholder="Project name">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" id="deleteConfirmBtn" disabled>Delete</button>
      </div>
    `);
    $('deleteConfirmInput').addEventListener('input', (e) => {
      $('deleteConfirmBtn').disabled = e.target.value !== S.project.name;
    });
    $('deleteConfirmBtn').addEventListener('click', async () => {
      showLoading('Deleting', '');
      try {
        if (S.session && !S.isLocalOnly && S.online) {
          const res = await apiFetch(API_HOST + '?action=projects/delete', {
            method: 'POST', body: JSON.stringify({ pid: S.pid }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
        }
        await IDB.deleteProject(S.pid);
        try {
          localStorage.removeItem(STORAGE.cache + '.' + S.pid);
          localStorage.removeItem(STORAGE.lastTab + '.' + S.pid);
          sessionStorage.removeItem(STORAGE.expanded + '.' + S.pid);
        } catch {}
        hideLoading();
        toast('Deleted', 'success');
        setTimeout(() => { window.location.href = '/projects.html'; }, 800);
      } catch (err) { hideLoading(); toast(err.message || 'Delete failed', 'error'); }
    });
  }

  // ═══════════════════════════════════════════════════════════
  // WIRING
  // ═══════════════════════════════════════════════════════════

  function wireGlobal() {
    $('modalOverlay').addEventListener('click', (e) => {
      if (e.target === $('modalOverlay')) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && $('modalOverlay').classList.contains('active')) closeModal();
    });

    $('menuBtn')?.addEventListener('click', openSidebar);
    $('sidebarClose')?.addEventListener('click', closeSidebar);
    $('sidebarBackdrop')?.addEventListener('click', closeSidebar);

    $('btnShare')?.addEventListener('click', () => {
      const url = buildPublicUrl();
      if (navigator.share) navigator.share({ title: S.project?.name, url }).catch(() => {});
      else if (copyToClipboard(url)) toast('Link copied', 'success', 1200);
      else toast('Copy failed', 'error');
    });

    $('btnRefresh')?.addEventListener('click', () => { renderPanel(); loadDeployState(); });

    document.addEventListener('keydown', (e) => {
      if (!e.target.closest || !e.target.closest('#topTabsBar')) return;
      const idx = S.tabs.findIndex(t => t.id === S.activeTab);
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        switchTab(S.tabs[Math.min(idx + 1, S.tabs.length - 1)].id);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        switchTab(S.tabs[Math.max(idx - 1, 0)].id);
      } else if (e.key === 'Home') {
        e.preventDefault();
        switchTab(S.tabs[0].id);
      } else if (e.key === 'End') {
        e.preventDefault();
        switchTab(S.tabs[S.tabs.length - 1].id);
      }
    });

    const updateOnline = () => {
      S.online = navigator.onLine;
      $('offlineBanner').classList.toggle('visible', !S.online);
      updateModeBanner();
    };
    window.addEventListener('online', updateOnline);
    window.addEventListener('offline', updateOnline);
    updateOnline();
  }

  // ═══════════════════════════════════════════════════════════
  // BOOT
  // ═══════════════════════════════════════════════════════════

  async function boot() {
    readSession();
    S.pid = getPid();
    if (!S.pid) { showFatal('Missing project', 'No project ID in URL.'); return; }
    try { await openDB(); } catch (err) { console.error('[Project] DB failed:', err); }

    const hashTab = getHashTab();
    const lastTab = shouldRememberTab() ? getLastTab() : null;
    S.activeTab = hashTab || lastTab || 'overview';

    const ok = await loadProject();
    if (!ok) return;

    if (!S.tabs.some(t => t.id === S.activeTab)) S.activeTab = 'overview';
    renderSidebar();
    renderTopTabs();
    renderPanel();
    wireGlobal();
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>

</body>
</html>
