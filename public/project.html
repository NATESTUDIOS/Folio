<script>
(function () {
  try {
    var pref = localStorage.getItem("folio.theme") || "dark";
    var resolved = pref;
    if (pref === "auto" || pref === "system") {
      resolved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
        ? "light" : "dark";
    }
    if (resolved === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");

    if (localStorage.getItem("folio.reducedMotion") === "true") {
      document.documentElement.setAttribute("data-reduced-motion", "true");
    }

    var scale = Number(localStorage.getItem("folio.pageScale") || 1);
    if (!Number.isFinite(scale) || scale < 0.85) scale = 1;
    if (scale > 1.35) scale = 1.35;
    document.documentElement.style.setProperty("--page-scale", String(scale));

    var meta = document.getElementById("themeColorMeta");
    if (meta) meta.setAttribute("content", resolved === "light" ? "#f7f8fa" : "#0a0c10");
  } catch (e) {}
})();
</script>

  function wireThemeSync() {
    window.addEventListener('storage', function (e) {
      try {
        if (e.key === 'folio.theme') {
          var pref = e.newValue || 'dark';
          var resolved = pref;
          if (pref === 'auto' || pref === 'system') {
            resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
              ? 'light' : 'dark';
          }
          if (resolved === 'light') document.documentElement.setAttribute('data-theme', 'light');
          else document.documentElement.removeAttribute('data-theme');
          var meta = document.getElementById('themeColorMeta');
          if (meta) meta.setAttribute('content', resolved === 'light' ? '#f7f8fa' : '#0a0c10');
        }
        if (e.key === 'folio.reducedMotion') {
          if (e.newValue === 'true') document.documentElement.setAttribute('data-reduced-motion', 'true');
          else document.documentElement.removeAttribute('data-reduced-motion');
        }
      } catch (err) {}
    });
  }

  function wireThemeMediaQuery() {
    if (!window.matchMedia) return;
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    var handler = function () {
      try {
        var pref = localStorage.getItem('folio.theme') || 'dark';
        if (pref !== 'auto' && pref !== 'system') return;
        var resolved = mq.matches ? 'light' : 'dark';
        if (resolved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
        var meta = document.getElementById('themeColorMeta');
        if (meta) meta.setAttribute('content', resolved === 'light' ? '#f7f8fa' : '#0a0c10');
      } catch (e) {}
    };
    if (mq.addEventListener) mq.addEventListener('change', handler);
    else if (mq.addListener) mq.addListener(handler);
  }

  // ═══════════════════════════════════════════════════════════
  // INDEXEDDB
  // ═══════════════════════════════════════════════════════════

  let dbConn = null;
  function openDB() {
    if (dbConn) return Promise.resolve(dbConn);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onblocked = () => {
        setTimeout(() => {
          try { req.result?.close?.(); } catch {}
          dbConn = null;
          openDB().then(resolve, reject);
        }, 800);
      };
      req.onsuccess = () => { dbConn = req.result; resolve(dbConn); };
      req.onupgradeneeded = (event) => {
        const conn = event.target.result;
        if (!conn.objectStoreNames.contains('projects')) conn.createObjectStore('projects', { keyPath: 'pid' });
        if (!conn.objectStoreNames.contains('files')) {
          const store = conn.createObjectStore('files', { keyPath: ['pid', 'path'] });
          store.createIndex('pid', 'pid');
        }
        if (!conn.objectStoreNames.contains('versions')) {
          const store = conn.createObjectStore('versions', { keyPath: 'vid' });
          store.createIndex('pid', 'pid');
        }
        if (!conn.objectStoreNames.contains('projectMeta')) conn.createObjectStore('projectMeta', { keyPath: 'pid' });
        if (!conn.objectStoreNames.contains('syncQueue')) conn.createObjectStore('syncQueue', { keyPath: 'id', autoIncrement: true });
        if (!conn.objectStoreNames.contains('folders')) {
          const store = conn.createObjectStore('folders', { keyPath: ['pid', 'path'] });
          store.createIndex('pid', 'pid');
        }
      };
    });
  }

  function dbWrap(req, retries = 1) {
    return new Promise((res, rej) => {
      req.onsuccess = () => res(req.result);
      req.onerror = () => {
        if (retries > 0) return dbWrap(req, retries - 1).then(res, rej);
        rej(req.error);
      };
    });
  }
  function dbTx(store, mode = 'readonly') { return dbConn.transaction(store, mode).objectStore(store); }

  const IDB = {
    async getProject(pid) { return dbWrap(dbTx('projects').get(pid)); },
    async putProject(p) { return dbWrap(dbTx('projects', 'readwrite').put(p)); },
    async deleteProject(pid) {
      await dbWrap(dbTx('projects', 'readwrite').delete(pid));
      const files = await dbWrap(dbTx('files').index('pid').getAll(pid));
      for (const f of files) await dbWrap(dbTx('files', 'readwrite').delete([f.pid, f.path]));
      const versions = await dbWrap(dbTx('versions').index('pid').getAll(pid));
      for (const v of versions) await dbWrap(dbTx('versions', 'readwrite').delete(v.vid));
      const folders = await dbWrap(dbTx('folders').index('pid').getAll(pid));
      for (const f of folders) await dbWrap(dbTx('folders', 'readwrite').delete([f.pid, f.path]));
    },
    async listFiles(pid) { return dbWrap(dbTx('files').index('pid').getAll(pid)); },
    async getFile(pid, path) { return dbWrap(dbTx('files').get([pid, path])); },
    async putFile(pid, path, content) {
      return dbWrap(dbTx('files', 'readwrite').put({ pid, path, content, updatedAt: Date.now() }));
    },
    async deleteFile(pid, path) { return dbWrap(dbTx('files', 'readwrite').delete([pid, path])); },
    async listVersions(pid) {
      const all = await dbWrap(dbTx('versions').index('pid').getAll(pid));
      return all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    },
    async getVersion(vid) { return dbWrap(dbTx('versions').get(vid)); },
    async putVersion(v) { return dbWrap(dbTx('versions', 'readwrite').put(v)); },
    async listFolders(pid) { return dbWrap(dbTx('folders').index('pid').getAll(pid)); },
    async putFolder(pid, path) {
      return dbWrap(dbTx('folders', 'readwrite').put({ pid, path, createdAt: Date.now() }));
    },
    async getProjectMeta(pid) {
      const m = await dbWrap(dbTx('projectMeta').get(pid));
      return m || { pid, notepad: '', meta: {}, coverMeta: {} };
    },
    async setProjectMeta(pid, patch) {
      const current = await this.getProjectMeta(pid);
      return dbWrap(dbTx('projectMeta', 'readwrite').put({ ...current, ...patch, pid }));
    },
    async enqueueSync(pid, type, payload) {
      return dbWrap(dbTx('syncQueue', 'readwrite').add({ pid, type, payload, createdAt: Date.now(), attempts: 0 }));
    },
    async listSyncQueue() { return dbWrap(dbTx('syncQueue').getAll()); },
    async deleteSyncQueue(id) { return dbWrap(dbTx('syncQueue', 'readwrite').delete(id)); },
    async updateSyncQueue(item) { return dbWrap(dbTx('syncQueue', 'readwrite').put(item)); },
  };

  function timeAgo(ts) {
    if (!ts) return '—';
    const diff = Date.now() - ts;
    if (diff < 60000) return 'just now';
    const m = Math.floor(diff / 60000);
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h / 24);
    if (d < 30) return `${d}d ago`;
    return new Date(ts).toLocaleDateString();
  }

  function formatBytes(n) {
    if (!n || n < 0) return '0 B';
    const u = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${n < 10 ? n.toFixed(1) : Math.round(n)} ${u[i]}`;
  }

  function formatNumber(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n || 0);
  }

  function getInitials(name) {
    const s = String(name || '').trim();
    if (!s) return '?';
    const parts = s.split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  const AVATAR_GRADIENTS = [
    'linear-gradient(135deg, #F59E0B, #f97316)',
    'linear-gradient(135deg, #0284c7, #0369a1)',
    'linear-gradient(135deg, #a855f7, #6d28d9)',
    'linear-gradient(135deg, #10B981, #059669)',
    'linear-gradient(135deg, #ec4899, #be185d)',
    'linear-gradient(135deg, #06b6d4, #0891b2)',
  ];
  function getAvatarColor(seed) {
    const s = String(seed || '');
    let hash = 0;
    for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_GRADIENTS[Math.abs(hash) % AVATAR_GRADIENTS.length];
  }

  function pickPaletteSeed(seed) {
    const s = String(seed || 'x');
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return PALETTE_SEEDS[Math.abs(h) % PALETTE_SEEDS.length];
  }

  function clampHex(v) {
    const s = String(v || '').trim();
    if (/^#[0-9a-fA-F]{6}$/.test(s)) return s;
    if (/^#[0-9a-fA-F]{3}$/.test(s)) return '#' + s.slice(1).split('').map(c => c + c).join('');
    return null;
  }

  function estimateBytes(content) {
    if (!content) return 0;
    if (typeof content !== 'string') content = String(content);
    if (content.startsWith('data:')) {
      const comma = content.indexOf(',');
      const b64 = comma >= 0 ? content.slice(comma + 1) : content;
      return Math.floor(b64.length * 0.75);
    }
    try { return new Blob([content]).size; } catch { return content.length; }
  }

  function fileIconName(path) {
    const ext = (path.split('.').pop() || '').toLowerCase();
    if (['html','htm','css','scss','less','js','mjs','cjs','jsx','ts','tsx'].includes(ext)) return 'code';
    if (ext === 'json') return 'file';
    if (['md','markdown','txt'].includes(ext)) return 'file-text';
    if (['png','jpg','jpeg','gif','svg','webp'].includes(ext)) return 'image';
    if (['pdf','mp4','webm','mp3','wav','zip'].includes(ext)) return 'file';
    return 'file';
  }

  function isTextFile(path) {
    return /\.(html?|css|js|mjs|cjs|jsx|tsx?|py|json|md|txt|ya?ml|svg|xml)$/i.test(path);
  }

  function isImagePath(path) {
    return /\.(png|jpe?g|gif|webp|svg|bmp|ico|avif)$/i.test(path);
  }

  function isSystemFile(path) {
    return path === NOTES_PATH
      || /(^|\/)\.gitkeep$/i.test(path)
      || /(^|\/)\.keep$/i.test(path);
  }

  function noteAccentColor(color) {
    return NOTE_COLORS[color] || NOTE_COLORS.amber;

  function copyToClipboard(text) {
    try {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
        return true;
      }
    } catch {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch { return false; }
  }

  function handle401() {
    try {
      localStorage.removeItem(STORAGE.session);
      localStorage.removeItem(STORAGE.user);
    } catch {}
    if (!sessionStorage.getItem('folio.authRedirectShown')) {
      sessionStorage.setItem('folio.authRedirectShown', '1');
      setTimeout(() => {
        const next = encodeURIComponent(location.pathname + location.search);
        location.href = '/register?next=' + next;
      }, 800);
    }
  }

  async function apiFetch(url, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (S.session) headers['Authorization'] = `Bearer ${S.session}`;
  try {
    const res = await fetch(url, { ...opts, headers });
    let data = {};
    try { data = await res.json(); } catch {}
    if (res.status === 401) {
      try {
        localStorage.removeItem(STORAGE.session);
        localStorage.removeItem(STORAGE.user);
      } catch {}
      if (!sessionStorage.getItem('folio.authRedirectShown')) {
        sessionStorage.setItem('folio.authRedirectShown', '1');
        setTimeout(() => {
          const next = encodeURIComponent(location.pathname + location.search);
          location.href = '/register?next=' + next;
        }, 800);
      }
    }
    return { ok: res.ok, status: res.status, data };
  } catch (err) {
    return { ok: false, status: 0, data: { error: 'NETWORK_ERROR' } };
  }
}

  // ═══════════════════════════════════════════════════════════
  // SYNC QUEUE
  // ═══════════════════════════════════════════════════════════

  async function enqueueSync(type, payload) {
    try {
      await IDB.enqueueSync(S.pid, type, payload);
      await refreshSyncQueueCount();
    } catch (err) {
      console.warn('[Sync] enqueue failed:', err);
    }
  }

  async function refreshSyncQueueCount() {
    try {
      const queue = await IDB.listSyncQueue();
      const mine = queue.filter(item => item.pid === S.pid);
      S.syncQueueCount = mine.length;
      const badge = $('syncBadge');
      if (badge) {
        if (mine.length > 0) {
          badge.textContent = String(mine.length);
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }
    } catch {}
  }

  async function flushSyncQueue() {
  if (S.syncFlushing || !S.online || !S.session || S.isLocalOnly) return;
  S.syncFlushing = true;
  try {
    const queue = await IDB.listSyncQueue();
    for (const item of queue) {
      if (item.pid !== S.pid) continue;
      try {
        let success = false;
        let body = null;
        let endpoint = API_HOST;

        if (item.type === 'file-save') {
          endpoint = API_HOST + '?action=project/sync-back';
          body = { pid: item.pid, files: { [item.payload.path]: item.payload.content } };
        } else if (item.type === 'file-delete') {
          endpoint = API_HOST + '?action=file/delete';
          body = { pid: item.pid, path: item.payload.path };
        } else if (item.type === 'version-commit') {
          endpoint = API_HOST + '?action=project/sync-back';
          // ✅ FIX: correctly pass versions map
          body = { pid: item.pid, versions: { [item.payload.vid]: item.payload.data } };
        } else if (item.type === 'metatags-save') {
          endpoint = API_HOST + '?action=metatags/save';
          body = { pid: item.pid, metaTags: item.payload.metaTags };
        } else if (item.type === 'project-update') {
          endpoint = API_HOST + '?action=projects/update';
          body = { pid: item.pid, ...item.payload };
        } else {
          success = true; // unknown types: discard
        }

        if (body) {
          const res = await apiFetch(endpoint, {
            method: 'POST',
            body: JSON.stringify(body),
          });
          success = res.ok && res.data?.success;
          // ✅ FIX: if the item is definitively rejected (400/403/404), don't retry forever
          if (!success && (res.status === 400 || res.status === 403 || res.status === 404)) {
            console.warn(`[Sync] Dropping ${item.type} — server rejected with ${res.status}:`, res.data?.error);
            await IDB.deleteSyncQueue(item.id);
            continue;
          }
        }

        if (success) {
          await IDB.deleteSyncQueue(item.id);
        } else {
          item.attempts = (item.attempts || 0) + 1;
          if (item.attempts >= SYNC_QUEUE_MAX_ATTEMPTS) {
            await IDB.deleteSyncQueue(item.id);
            toast('Some offline changes could not sync', 'warning', 4000);
          } else {
            await IDB.updateSyncQueue(item);
          }
        }
      } catch (err) {
        item.attempts = (item.attempts || 0) + 1;
        if (item.attempts >= SYNC_QUEUE_MAX_ATTEMPTS) {
          await IDB.deleteSyncQueue(item.id);
        } else {
          await IDB.updateSyncQueue(item);
        }
      }
    }
  } finally {
    S.syncFlushing = false;
    await refreshSyncQueueCount();
  }
}

  function startSyncFlushLoop() {
    if (S.syncTimer) clearInterval(S.syncTimer);
    S.syncTimer = setInterval(() => {
      if (S.online && S.syncQueueCount > 0) flushSyncQueue();
    }, SYNC_QUEUE_FLUSH_INTERVAL);
  }

  function getPid() {

  function getHashTab() { return location.hash.replace(/^#\/?/, '') || null; }

  // SYNC STATE / BANNER
  // ═══════════════════════════════════════════════════════════

  function setSyncState(next) {
    S.syncState = next;
    updateModeBanner();

  function updateModeBanner() {
  const banner = $('modeBanner');
  const text = $('modeBannerText');
  const action = $('modeBannerAction');
  if (!banner || !text || !action) return;

  const state = S.syncState;

  if (state === 'needs-pull') {
    banner.hidden = false;
    banner.classList.add('visible');
    banner.dataset.kind = 'pull';
    if (!S.online) {
      text.textContent = `Offline — ${S.serverFileCount || 0} files on your account. Will sync when you're online.`;
      action.textContent = 'Sync';
      action.disabled = true;
    } else {
      text.textContent = `${S.serverFileCount || 0} files on your account — not on this device yet.`;
      action.textContent = 'Sync now';
      action.disabled = false;
    }
    action.onclick = () => pullFromServer();
    return;
  }

  banner.dataset.kind = 'default';

  if (state === 'local' && !S.session) {
    banner.hidden = false;
    banner.classList.add('visible');
    text.textContent = 'Saved only on this device. Sign in to back it up and deploy.';
    action.textContent = 'Sign in';
    action.disabled = false;
    action.onclick = () => {
      window.location.href = '/register?next=' + encodeURIComponent(location.pathname + location.search);
    };
    return;
  }
  if (state === 'local' && S.session) {
    banner.hidden = false;
    banner.classList.add('visible');
    text.textContent = 'Saved only on this device. Sync to your account.';
    action.textContent = 'Sync to account';
    action.disabled = false;
    action.onclick = () => promoteLocalProject();
    return;
  }
  if (state === 'orphan') {
    banner.hidden = false;
    banner.classList.add('visible');
    text.textContent = "This project isn't on the server yet. Push it to keep your files safe.";
    action.textContent = 'Push to server';
    action.disabled = false;
    action.onclick = () => pushOrphanToServer();
    return;
  }
  if (state === 'cached' || !S.online) {
    banner.hidden = false;
    banner.classList.add('visible');
    text.textContent = 'Offline — showing cached data. Changes will sync when you reconnect.';
    action.textContent = 'Retry';
    action.disabled = false;
    action.onclick = () => location.reload();
    return;
  }

  banner.hidden = true;
  banner.classList.remove('visible');
}

// ── Pull handler (Scenario 1) ─────────────────────────────────────────
async function pullFromServer() {
  if (!S.online) { toast('Requires internet', 'warning'); return; }
  if (!S.session) {
    window.location.href = '/register?next=' + encodeURIComponent(location.pathname + location.search);
    return;
  }

  showLoading('Syncing', 'Pulling files from your account…');
  try {
    const result = await hydrateProjectFromServer(S.pid);
    hideLoading();
    if (!result.ok) {
      toast(result.reason || 'Sync failed', 'error', 4000);
      return;
    }
    S.syncState = 'synced';
    markSynced(S.pid);
    toast(
      `Synced ${result.filesWritten} file${result.filesWritten === 1 ? '' : 's'}` +
      (result.versionsWritten ? `, ${result.versionsWritten} version${result.versionsWritten === 1 ? '' : 's'}` : ''),
      'success',
      2400
    );
    updateModeBanner();
    updateHeader();
    renderPanel();
    refreshFileCount().catch(() => {});
    refreshSyncQueueCount().catch(() => {});
  } catch (err) {
    hideLoading();
    toast(err.message || 'Sync failed', 'error', 5000);
  }
}

  function getOwnerUsername() {
    return S.project?.ownerUsername || S.user?.profile?.username || S.user?.username || '';
  }

  function buildProjectUrl({ path = '', deploymentId = null, absolute = false } = {}) {
    const user = getOwnerUsername();
    const slug = S.project?.slug || '';
    if (!user || !slug) return S.project?.deployment?.url || null;
    let url = `${BASE_URL}/${encodeURIComponent(user)}/project/${encodeURIComponent(slug)}`;
    if (path) url += '/' + String(path).split('/').map(encodeURIComponent).join('/');
    const params = [];
    if (deploymentId) params.push('from=' + encodeURIComponent(deploymentId));
    if (params.length) url += '?' + params.join('&');
    return absolute ? url + '/' : url;
  }

  function buildProjectShareUrl() {
    const user = getOwnerUsername();
    const slug = S.project?.slug || '';
    if (!user || !slug) return null;
    return `${BASE_URL}/${encodeURIComponent(user)}/${encodeURIComponent(slug)}`;
  }

  function getHtmlFiles(files) {
    return (files || [])
      .filter(f => /\.html?$/i.test(f.path) && !isSystemFile(f.path))
      .map(f => f.path)
      .sort((a, b) => {
        const aIdx = a === 'index.html' ? 0 : 1;
        const bIdx = b === 'index.html' ? 0 : 1;
        if (aIdx !== bIdx) return aIdx - bIdx;
        return a.localeCompare(b);
      });
  }

  function buildLiveUrl(base, path) {
    const clean = String(base || '').replace(/\/$/, '');
    if (!path || path === 'index.html') return clean + '/';
    return clean + '/' + path.replace(/^\//, '');
  }

// ── Last-sync tracking ────────────────────────────────────────────────
// Stamps a per-project timestamp in localStorage every time we successfully
// pull or push. Rendered in the header as "Synced 2m ago".
function markSynced(pid) {
  if (!pid) return;
  try { localStorage.setItem('folio.lastSync.' + pid, String(Date.now())); } catch {}
}

// ── Hydrate IDB from server: files + versions ─────────────────────────
// Single API call. Used by the "Sync now" banner action when IDB has no
// files for this project (fresh device, cleared storage, new browser).
async function hydrateProjectFromServer(pid) {
  if (!pid || !S.online || !S.session) return { ok: false, reason: 'offline' };

  let res;
  try {
    res = await apiFetch(API_HOST + '?action=project/hydrate&pid=' + encodeURIComponent(pid));
  } catch {
    return { ok: false, reason: 'network' };
  }
  if (!res.ok || !res.data?.success) {
    return { ok: false, reason: res.data?.error || `HTTP ${res.status}` };
  }

  const files = res.data.files || {};
  const versions = res.data.versions || {};

  let filesWritten = 0;
  for (const [path, content] of Object.entries(files)) {
    if (typeof content !== 'string') continue;
    try {
      await IDB.putFile(pid, path, content);
      filesWritten++;
    } catch (err) {
      console.warn('[Hydrate] file write failed:', path, err);
    }
  }

  let versionsWritten = 0;
  for (const [vid, data] of Object.entries(versions)) {
    try {
      const existing = await IDB.getVersion(vid);
      if (existing) continue;
      await IDB.putVersion({ vid, pid, ...data });
      versionsWritten++;
    } catch (err) {
      console.warn('[Hydrate] version write failed:', vid, err);
    }
  }

  markSynced(pid);
  return { ok: true, filesWritten, versionsWritten };
}
  
  // ═══════════════════════════════════════════════════════════
  // LOAD PROJECT
  // ═══════════════════════════════════════════════════════════

  async function loadProject() {
  let localProject = null;
  try { localProject = await IDB.getProject(S.pid); } catch {}

  // Local-only project
  if (/^local_/.test(S.pid)) {
    if (!localProject) {
      showEmptyState('notfound', 'Not found', 'This local project no longer exists.', S.pid);
      return false;
    }
    S.project = {
      ...localProject,
      myRole: 'owner',
      visibility: localProject.visibility || { profile: 'private' },
    };
    S.isLocalOnly = true;
    setSyncState('local');
    applyProjectMeta();
    return true;
  }

  if (S.session && S.online) {
    let res = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        res = await apiFetch(API_HOST + '?action=projects/get&pid=' + encodeURIComponent(S.pid));
      } catch (err) {
        res = { ok: false, status: 0, data: { error: 'NETWORK_ERROR' } };
      }
      if (res.ok || res.status === 404 || res.status === 403) break;
      if (attempt < 2) await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
    }

    if (res.ok && res.data?.success) {
      const norm = normalizeServerProject(res.data.project);
      try { await IDB.putProject(norm); } catch {}
      S.project = { ...res.data.project, ...norm };
      S.isLocalOnly = false;
      cacheProject(S.project);

      // ✅ Scenario 1: server has files but this device doesn't. Prompt.
      // We do NOT auto-hydrate — the user clicks "Sync now".
      const serverFileCount = res.data.project.fileCount || 0;
      let localFileCount = 0;
      try {
        const localFiles = await IDB.listFiles(S.pid);
        localFileCount = localFiles.length;
      } catch {}

      if (serverFileCount > 0 && localFileCount === 0) {
        S.serverFileCount = serverFileCount;
        setSyncState('needs-pull');
      } else {
        S.serverFileCount = serverFileCount;
        setSyncState('synced');
      }

      applyProjectMeta();
      return true;
    }

    if (res.status === 404 || res.status === 403) {
      if (localProject) {
        const inferredRole = localProject.myRole || (localProject._server ? 'viewer' : 'owner');
        S.project = {
          ...localProject,
          myRole: inferredRole,
          visibility: localProject.visibility || { profile: 'private' },
        };
        S.isLocalOnly = false;
        setSyncState('orphan');
        applyProjectMeta();
        return true;
      }
      if (res.status === 403) {
        showEmptyState('denied', 'Access denied', "You don't have permission to view this project. Sign in with the right account, or ask the owner.", S.pid);
      } else {
        showEmptyState('notfound', 'Project not found', "This project may have been deleted, or the link is broken.", S.pid);
      }
      return false;
    }

    if (localProject) {
      const inferredRole = localProject.myRole || (localProject._server ? 'viewer' : 'owner');
      S.project = {
        ...localProject,
        myRole: inferredRole,
        visibility: localProject.visibility || { profile: 'private' },
      };
      S.isLocalOnly = false;
      setSyncState('cached');
      applyProjectMeta();
      return true;
    }
  }

  if (localProject) {
    const inferredRole = localProject.myRole || (localProject._server ? 'viewer' : 'owner');
    S.project = {
      ...localProject,
      myRole: inferredRole,
      visibility: localProject.visibility || { profile: 'private' },
    };
    S.isLocalOnly = false;
    setSyncState('cached');
    applyProjectMeta();
    return true;
  }

  const cached = readCachedProject();
  if (cached) {
    S.project = { ...cached, myRole: cached.myRole || 'viewer' };
    setSyncState('cached');
    applyProjectMeta();
    return true;
  }

  showEmptyState('notfound', "Couldn't load project", 'Check your connection and try again.', S.pid);
  return false;
}

  function applyProjectMeta() {
    S.role = S.project.myRole || (S.isLocalOnly ? 'owner' : 'viewer');
    S.isOwner = S.role === 'owner';
    S.isEditor = S.role === 'owner' || S.role === 'editor';
    S.isSharedMode = !S.isOwner && !S.isEditor;
    S.tabs = S.isSharedMode ? SHARED_TABS : OWNER_TABS;
    if (!S.tabs.some(t => t.id === S.activeTab)) S.activeTab = 'overview';

    loadExpanded();
    loadLastLivePage();
    updateHeader();
    updateModeBanner();
    renderTopTabs();
    updateProjectIcons();

    if (S.isEditor || S.project.visibility?.liveSite === 'public') loadDeployState();
  }

  function updateHeader() {
  $('headerProjectName').textContent = S.project.name || 'Untitled project';

  const slugPart = S.project.slug ? `@${escapeHTML(S.project.slug)}` : '';
  const updatedPart = S.project.updatedAt ? ` · ${timeAgo(S.project.updatedAt)}` : '';
  const roleBadge = `<span class="header-role-badge">${S.isOwner ? 'Owner' : escapeHTML(S.role || 'Viewer')}</span>`;

  // Sync indicator reflects the four-state model.
  const syncBadge = (() => {
    if (S.syncState === 'needs-pull') {
      return `<span class="header-sync-badge warn" title="Server has files this device doesn't">Pull needed</span>`;
    }
    if (S.syncState === 'local') return `<span class="header-sync-badge">Not synced</span>`;
    if (S.syncState === 'orphan') return `<span class="header-sync-badge">Not on server</span>`;
    if (S.syncState === 'cached' || !S.online) {
      return `<span class="header-sync-badge cached">Cached</span>`;
    }
    if (S.syncState === 'synced') {
      const ts = readLastSynced(S.pid);
      const label = ts ? `Synced ${timeAgo(ts)}` : 'Synced';
      return `<span class="header-sync-badge ok">${label}</span>`;
    }
    return '';
  })();

  const deployBadge = S.project.deployment?.url
    ? `<span class="header-deploy-badge"><span class="dot"></span>Live</span>`
    : S.project.deployment?.state === 'OFFLINE'
      ? `<span class="header-deploy-badge offline">Offline</span>`
      : '';

  $('headerProjectSub').innerHTML =
    `<span class="sub-slug">${slugPart}</span><span class="sub-sep">·</span>` +
    `${roleBadge}${syncBadge}${deployBadge}<span class="sub-updated">${updatedPart}</span>`;

  document.title = `${S.project.name || 'Project'} — Folio`;

  const deployBtn = $('btnDeploy');
  if (deployBtn) {
    if (S.project.deployment?.url) {
      deployBtn.classList.add('is-live');
      deployBtn.querySelector('.lbl').textContent = 'Live';
    } else {
      deployBtn.classList.remove('is-live');
      deployBtn.querySelector('.lbl').textContent = 'Deploy';
    }
  }

  $('btnBell').style.display = S.session ? '' : 'none';
}

  function renderTopTabs() {

  function bumpTabCount(key, value) {
    if (S.tabCounts[key] === value) return;

  function switchTab(tabId) {
    if (!S.tabs.some(t => t.id === tabId)) return;

    const activeBtn = document.querySelector(`[data-top-tab="${tabId}"]`);

  function renderPanel() {

      notes: renderNotesPanel,
      logs: renderLogsPanel,
      downloads: renderDownloadsPanel,
      download: renderDownloadSharedPanel,
      danger: renderDangerPanel,
    };

    if (!loader) return;
    try {
      const r = loader(panel);
      if (r && r.catch) r.catch(err => panelError(panel, err, tab));

  async function loadAnalytics({ force = false } = {}) {

  async function promoteLocalProject() {
    if (!S.session) {
      window.location.href = '/register?next=' + encodeURIComponent(location.pathname + location.search);
      return;
    }
    if (!S.isLocalOnly) { toast('Already on server', 'info'); return; }
    if (!S.online) { toast('Requires internet', 'warning'); return; }

    showLoading('Syncing project', 'Creating server project…');
    try {
      const createRes = await apiFetch(API_HOST + '?action=projects/create', {
        method: 'POST',
        body: JSON.stringify({ name: S.project.name || 'Imported project', description: S.project.description || '' }),
      });
      if (!createRes.ok || !createRes.data?.success) throw new Error(createRes.data?.error || 'Create failed');
      const newPid = createRes.data.pid;

      const files = await IDB.listFiles(S.pid);
      const versions = await IDB.listVersions(S.pid);
      const fileMap = {};
      for (const f of files) {
        if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
        fileMap[f.path] = f.content || '';
      }

      const syncRes = await apiFetch(API_HOST + '?action=project/sync-back', {
        method: 'POST',
        body: JSON.stringify({
          pid: newPid,
          files: fileMap,
          versions: versions.length ? Object.fromEntries(
            versions.map(v => [v.vid, { message: v.message || '', files: v.files || {}, createdAt: v.createdAt, kind: v.kind || null }])
          ) : null,
        }),
      });
      if (!syncRes.ok || !syncRes.data?.success) throw new Error(syncRes.data?.error || 'Sync failed');

      const project = {
        pid: newPid,
        name: S.project.name || 'Imported project',
        slug: createRes.data.project?.slug || S.project.slug || '',
        description: S.project.description || '',
        iconUrl: S.project.iconUrl || null,
        createdAt: S.project.createdAt || Date.now(),
        updatedAt: Date.now(),
        storageLimit: S.project.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT,
        myRole: 'owner',
        _server: true,
      };
      await IDB.putProject(project);
      for (const f of files) await IDB.putFile(newPid, f.path, f.content);
      for (const v of versions) await IDB.putVersion({ ...v, pid: newPid });
      await IDB.deleteProject(S.pid);

      hideLoading();
      toast('Project synced to your account', 'success');
      setTimeout(() => { window.location.href = '/project?pid=' + encodeURIComponent(newPid); }, 400);
    } catch (err) {
      hideLoading();
      toast(err.message || 'Sync failed', 'error');
    }
  }

  async function pushOrphanToServer() {
    if (!S.session) {
      window.location.href = '/register?next=' + encodeURIComponent(location.pathname + location.search);
      return;
    }
    if (!S.online) { toast('Requires internet', 'warning'); return; }
    if (S.syncState !== 'orphan') { toast('Nothing to push', 'info'); return; }

    const oldPid = S.pid;
    showLoading('Pushing to server', 'Creating project…');

    try {
      const create = await apiFetch(API_HOST + '?action=projects/create', {
        method: 'POST',
        body: JSON.stringify({ name: S.project.name || 'Untitled project', description: S.project.description || '' }),
      });
      if (!create.ok || !create.data?.success) throw new Error(create.data?.error || 'Create failed');
      const newPid = create.data.pid;

      const files = await IDB.listFiles(oldPid);
      const fileMap = {};
      for (const f of files) {
        if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
        if (typeof f.content === 'string') fileMap[f.path] = f.content;
      }
      if (Object.keys(fileMap).length === 0) throw new Error('No files to push');

      const sync = await apiFetch(API_HOST + '?action=project/sync-back', {
        method: 'POST',
        body: JSON.stringify({ pid: newPid, files: fileMap }),
      });
      if (!sync.ok || !sync.data?.success) throw new Error(sync.data?.error || 'Sync failed');

      for (const f of files) await IDB.putFile(newPid, f.path, f.content);
      await IDB.putProject({ ...S.project, pid: newPid, myRole: 'owner', _server: true, updatedAt: Date.now() });
      await IDB.deleteProject(oldPid);

      hideLoading();
      toast('Project pushed to server', 'success');
      setTimeout(() => { window.location.href = '/project?pid=' + encodeURIComponent(newPid); }, 400);
    } catch (err) {
      hideLoading();
      toast(err.message || 'Push failed', 'error', 5000);
    }
  }

        </div>

  function computeHealth({ syncState, deployed, isOffline, needsRedeploy, storagePct, todayCount, totalCount }) {
    const items = [];
    const issues = [];

    if (syncState === 'synced') items.push({ ok: true, label: 'Synced' });
    else if (syncState === 'local') { items.push({ ok: false, label: 'Local only' }); issues.push('sync'); }
    else if (syncState === 'orphan') { items.push({ ok: false, label: 'Not on server' }); issues.push('orphan'); }
    else if (syncState === 'cached') { items.push({ ok: false, label: 'Cached' }); issues.push('offline'); }
    else items.push({ ok: false, label: 'Unknown' });

    if (deployed) items.push({ ok: true, label: 'Live' });
    else if (isOffline) { items.push({ ok: false, label: 'Offline' }); issues.push('deploy'); }
    else if (needsRedeploy) { items.push({ ok: false, label: 'Needs redeploy' }); issues.push('deploy'); }
    else if (syncState === 'synced') { items.push({ ok: false, label: 'Not deployed' }); issues.push('deploy'); }
    else items.push({ ok: true, label: 'Not deployed' });

    if (storagePct > 90) { items.push({ ok: false, label: `Storage ${Math.round(storagePct)}%` }); issues.push('storage'); }
    else if (storagePct > 70) items.push({ ok: false, label: `Storage ${Math.round(storagePct)}%` });
    else items.push({ ok: true, label: `Storage ${Math.round(storagePct)}%` });

    if (totalCount > 0) items.push({ ok: true, label: `${formatNumber(totalCount)} visits` });
    else if (todayCount > 0) items.push({ ok: true, label: `${formatNumber(todayCount)} today` });

    let level = 'healthy';
    if (issues.includes('storage') || issues.includes('orphan')) level = 'critical';
    else if (issues.length > 0) level = 'warning';

    return {
      level,
      label: level === 'healthy' ? 'Healthy' : level === 'warning' ? 'Attention' : 'Issues',
      items,
    };
  }

  function logIconFor(type) {
    return { deploy: 'rocket', project: 'info', invite: 'user', version: 'git-commit', db: 'database', file: 'file' }[type] || 'info';
  }

      });
    });

    $('btnChangeProjectIcon')?.addEventListener('click', () => {
      openIconPicker(async (newUrl) => {
        state.iconUrl = newUrl;
        const el = $('editProjectIcon');
        if (el) {
          el.innerHTML = newUrl
            ? `<img src="${escapeAttr(newUrl)}" alt="">`
            : `<span style="background:${getAvatarColor(nameInput.value)};color:#0a0c10;">${escapeHTML(getInitials(nameInput.value))}</span>`;
        }
        checkDirty();
      });
    });

    $('editProjectCancel')?.addEventListener('click', () => {
      if (saveBtn.disabled) { closeModal(); return; }
      confirmModal('Discard changes?', 'Your edits will not be saved.', 'Discard', true, closeModal);
    });

    saveBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const description = descInput.value.trim();
      const primaryFile = primarySelect.value || null;
      if (!name) { toast('Name required', 'error'); return; }
      saveBtn.disabled = true;
      const prev = saveBtn.innerHTML;
      saveBtn.innerHTML = 'Saving…';

      try {
        const patch = { name, description, iconUrl: state.iconUrl };
        if (S.session && S.online && !S.isLocalOnly && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=projects/update', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, ...patch }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Save failed');

          const metaTags = { ...(S.project.metaTags || {}) };
          metaTags.title = name;
          if (description) metaTags.description = description;
          await apiFetch(API_HOST + '?action=metatags/save', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, metaTags }),
          }).catch(() => {});
          S.project.metaTags = metaTags;

          try {
            const fresh = await apiFetch(API_HOST + '?action=projects/get&pid=' + encodeURIComponent(S.pid));
            if (fresh.ok && fresh.data?.success) {
              const norm = normalizeServerProject(fresh.data.project);
              S.project = { ...S.project, ...norm };
            }
          } catch {}
        } else {
          await enqueueSync('project-update', patch);
        }

        S.project.name = name;
        S.project.description = description;
        S.project.iconUrl = state.iconUrl;
        S.project.primaryFile = primaryFile;
        S.project.updatedAt = Date.now();

        try {
          await IDB.putProject({
            pid: S.pid,
            name, description,
            slug: S.project.slug || '',
            iconUrl: state.iconUrl,
            primaryFile,
            createdAt: S.project.createdAt || Date.now(),
            updatedAt: Date.now(),
            storageLimit: S.project.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT,
            myRole: S.project.myRole || 'owner',
            _server: S.project._server !== false,
            ownerUsername: S.project.ownerUsername || null,
          });
        } catch {}
        cacheProject(S.project);

        closeModal();
        toast('Saved', 'success');
        updateHeader();
        updateProjectIcons();
        renderPanel();
      } catch (err) {
        toast(err.message || 'Save failed', 'error');
        saveBtn.disabled = false;
        saveBtn.innerHTML = prev;
      }
    });
  }

    saving = true;
    saveBtn.textContent = 'Saving…';
    updateSave();

    try {
      const finalUrl = pendingUrl || pendingPreview;

      if (S.session && S.online && !S.isLocalOnly && S.syncState === 'synced') {

          method: 'POST',
          body: JSON.stringify({ pid: S.pid, metaTags: metaNext }),
        });
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Save failed');

        await apiFetch(API_HOST + '?action=project/regenerate-preview', {
          method: 'POST',
          body: JSON.stringify({ pid: S.pid }),

      } else {
        await enqueueSync('metatags-save', { metaTags: metaNext });
      }

      S.project.metaTags = metaNext;
      S.project.iconUrl = finalUrl;

      try {
        await IDB.putProject({
          ...(await IDB.getProject(S.pid)),
          metaTags: metaNext,
          iconUrl: finalUrl,
          updatedAt: Date.now(),
        });
        await IDB.setProjectMeta(S.pid, {
          coverMeta: {
            template: selectedTemplate,
            scene: selectedScene,
            primary: draft.primary,
            accent: draft.accent,
            headline: draft.headline,
            subheadline: draft.subheadline,
          },
        });
      } catch {}

      cacheProject(S.project);
      closeModal();
      toast('Cover saved', 'success');
      updateHeader();
      updateProjectIcons();
      renderPanel();
    } catch (err) {
      toast(err.message || 'Save failed', 'error');
    } finally {
      saving = false;
      saveBtn.textContent = 'Save';
      updateSave();
    }
  });

  updateSave();
}

async function generateCoverViaFlier({
  template = 'browser-frame',
  scene = 'auto',
  palette = 'auto',
  primary = '#F59E0B',
  accent = '#fbbf24',
  headline = '',
  subheadline = '',
  seed = null,
  iconUrl = null,
}) {
  if (!S.online) throw new Error('Requires internet');
  if (!S.session) throw new Error('Sign in to generate covers');

  // Map the client template names to Flier template names.
  // COVER_TEMPLATES = browser-frame, hero-short, poster-centered, scene-poster, quote-card, split-image-side
  const flierTemplate = {
    'browser-frame': 'browser-frame',
    'hero-short': 'hero-short',
    'poster-centered': 'poster-centered',
    'scene-poster': 'scene-poster',
    'scene-card': 'scene-card',
    'quote-card': 'quote-card',
    'split-image-side': 'split-image-side',
    'event-poster': 'event-poster',
    'stat-hero': 'stat-hero',
    'newspaper-classic': 'newspaper-classic',
    'image-shadow-bottom': 'image-shadow-bottom',
    'image-blur-text': 'image-blur-text',
    'feature-image-top': 'feature-image-top',
    'image-badge-overlay': 'image-badge-overlay',
    'strip-bottom': 'strip-bottom',
    'product-grid-2': 'product-grid-2',
    'random-lines-top': 'random-lines-top',
    'image-card-side-text': 'image-card-side-text',
  }[template] || 'browser-frame';

  // Build a Flier-compatible payload. mode=upload → server renders PNG and returns URL.
  const payload = {
    mode: 'upload',
    type: 'template',
    template: flierTemplate,
    size: '1200x630',
    seed: seed || S.pid || (S.project?.slug || S.project?.name || 'project'),
    data: {
      text: {
        kicker: S.project?.slug ? `@${S.project.slug}` : '',
        headline: headline || S.project?.name || 'Untitled project',
        subheadline: subheadline || (S.project?.description || '').slice(0, 160),
      },
      style: {
        variant: 'dark',
        // Pass explicit primary + accent so we honor user choices
        colors: { primary, accent },
        scene,
        scenePalette: palette,
        sceneOpacity: 0.85,
        watermark: true,
      },
      images: iconUrl ? { primary: { url: iconUrl } } : {},
    },
    upload: {
      name: `og_${S.pid}_${Date.now()}`,
    },
  };

  const res = await apiFetch(API_FLIER + '?action=generate', {
    method: 'POST',
    body: JSON.stringify(payload),
  });

  if (!res.ok || !res.data?.success) {
    const err = res.data?.error || `HTTP ${res.status}`;
    if (res.status === 429) {
      throw new Error(`Daily limit reached (${err}). Try again tomorrow or use Upload/URL tab.`);
    }
    throw new Error(`Image generation failed: ${err}`);
  }

  const url = res.data.url || res.data.display_url;
  if (!url) throw new Error('No URL returned from generator');

  return url;
}
  function buildCoverSvg(draft) {
    const W = 1200, H = 630;
    const p = draft.primary, a = draft.accent, angle = draft.bgAngle;
    const h = String(draft.headline || '').replace(/[<>&"']/g, '');
    const s = String(draft.subheadline || '').replace(/[<>&"']/g, '');
    const rad = (angle * Math.PI) / 180;
    const x1 = (0.5 - Math.cos(rad) * 0.5).toFixed(3);
    const y1 = (0.5 - Math.sin(rad) * 0.5).toFixed(3);
    const x2 = (0.5 + Math.cos(rad) * 0.5).toFixed(3);
    const y2 = (0.5 + Math.sin(rad) * 0.5).toFixed(3);
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="bg" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">
        <stop offset="0" stop-color="${p}"/><stop offset="1" stop-color="${a}"/>
      </linearGradient></defs>
      <rect width="${W}" height="${H}" fill="url(#bg)"/>
      <rect x="60" y="60" width="${W-120}" height="${H-120}" rx="24" fill="rgba(0,0,0,0.35)"/>
      <text x="140" y="300" font-family="system-ui,sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-2">${h}</text>
      <text x="140" y="360" font-family="system-ui,sans-serif" font-size="24" font-weight="500" fill="rgba(255,255,255,0.8)">${s}</text>
      <rect x="140" y="410" width="180" height="52" rx="26" fill="${p}"/>
      <text x="230" y="443" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#0a0c10" text-anchor="middle">Visit project</text>
    </svg>`;
  }

  async function clearCoverDirect() {
    if (!S.isEditor && !S.isLocalOnly) return;
    confirmModal('Clear project image?', 'The auto-generated cover will be used instead.', 'Clear', true, async () => {
      try {
        const metaNext = { ...(S.project.metaTags || {}), ogImage: null };
        if (S.session && S.online && !S.isLocalOnly && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=metatags/save', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, metaTags: metaNext }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
          await apiFetch(API_HOST + '?action=project/regenerate-preview', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid }),
          }).catch(() => {});
        }
        S.project.metaTags = metaNext;
        S.project.iconUrl = null;
        try {
          await IDB.putProject({ ...(await IDB.getProject(S.pid)), metaTags: metaNext, iconUrl: null, updatedAt: Date.now() });
          await IDB.setProjectMeta(S.pid, { coverMeta: {} });
        } catch {}
        cacheProject(S.project);
        toast('Cover cleared', 'success');
        updateHeader();
        updateProjectIcons();
        renderPanel();
      } catch (err) {
        toast(err.message || 'Failed', 'error');
      }
    });
  }

  async function openIconPicker(onSelect) {
  const isAuthed = !!S.session;
  const currentUrl = S.project?.iconUrl || null;

  openModal(`
    <div class="icon-picker-modal">
      <div class="modal-title">Project icon</div>
      <div class="modal-desc">Pick a preset, customize, or upload.</div>
      ${currentUrl ? `<div class="icon-picker-current"><div class="project-icon-box icon-picker-current-img"><img src="${escapeAttr(currentUrl)}" alt=""></div><div style="flex:1;font-size:11px;color:var(--theme-text-tertiary);">Current icon</div></div>` : ''}
      ${isAuthed ? `<div class="icon-tabs"><button class="icon-tab active" data-icon-tab="presets">Presets</button><button class="icon-tab" data-icon-tab="upload">Upload</button></div>` : ''}
      <div class="icon-mode-panel active" data-icon-panel="presets">
        <div id="iconPickerGrid" class="icon-picker-grid"></div>
      </div>
      ${isAuthed ? `
        <div class="icon-mode-panel" data-icon-panel="upload">
          <input type="file" id="iconUploadFile" accept="image/*" style="display:none;">
          <button class="btn btn-secondary btn-block" id="iconUploadFromFile">${svg('upload', 12, 2.2)} Choose image</button>
          <div class="field-hint">PNG, JPG, WebP. Max 1 MB.</div>
          <div id="iconUploadStatus" class="upload-url-status"></div>
        </div>
      ` : ''}
      <div class="icon-picker-footer">
        <button class="btn btn-secondary" id="iconPickerCancel">Cancel</button>
        <button class="btn btn-primary" id="iconPickerSave" disabled>${svg('check', 10, 2.4)} Save</button>
      </div>
    </div>
  `);

  let selectedUrl = null;

  document.querySelectorAll('[data-icon-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-icon-tab]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('[data-icon-panel]').forEach(p => {
        p.classList.toggle('active', p.dataset.iconPanel === btn.dataset.iconTab);
      });
    });
  });

  const grid = $('iconPickerGrid');
  grid.innerHTML = Array.from({ length: 5 }, () => '<div class="icon-skeleton"></div>').join('');

  try {
    const res = await apiFetch(API_FLIER + '?action=avatar/preview', {
      method: 'POST',
      body: JSON.stringify({
        username: (S.project.slug || S.pid || 'project').replace(/[^a-z0-9]/gi, '').toLowerCase(),
        displayName: S.project.name || 'Project',
      }),
    });

    grid.innerHTML = '';

    if (res.ok && res.data?.success && Array.isArray(res.data.variants)) {
      res.data.variants.forEach(v => {
        const btn = document.createElement('button');
        btn.className = 'icon-option';
        btn.type = 'button';
        btn.innerHTML = `<img src="${escapeAttr(v.dataUrl)}" alt=""><span class="icon-label">${escapeHTML(v.label || v.id)}</span>`;
        btn.addEventListener('click', async () => {
          // Upload immediately so we store an HTTPS URL, not a data URI.
          // Data URIs inflate the project record and get served on every
          // projects/list response — this keeps the record ~200 bytes.
          btn.disabled = true;
          try {
            const up = await apiFetch(API_FLIER + '?action=upload', {
              method: 'POST',
              body: JSON.stringify({ dataUrl: v.dataUrl, kind: 'icon' }),
            });
            if (!up.ok || !up.data?.success || !up.data.url) {
              throw new Error(up.data?.error || 'Upload failed');
            }
            selectedUrl = up.data.url;
            grid.querySelectorAll('.icon-option').forEach(o => o.classList.remove('selected'));
            btn.classList.add('selected');
            $('iconPickerSave').disabled = false;
          } catch (err) {
            toast(err.message || 'Upload failed', 'error');
          } finally {
            btn.disabled = false;
          }
        });
        grid.appendChild(btn);
      });
    } else {
      grid.innerHTML = '<div class="icon-placeholder" style="grid-column:1/-1;">Could not load presets</div>';
    }
  } catch (err) {
    console.error('[IconPicker]', err);
    grid.innerHTML = '<div class="icon-placeholder" style="grid-column:1/-1;">Could not load</div>';
  }

  // Upload tab
  $('iconUploadFromFile')?.addEventListener('click', () => $('iconUploadFile')?.click());
  $('iconUploadFile')?.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    e.target.value = '';
    if (!file) return;
    if (file.size > 1024 * 1024) { toast('Max 1 MB', 'error'); return; }

    const statusEl = $('iconUploadStatus');
    statusEl.textContent = 'Uploading…';
    statusEl.className = 'upload-url-status';

    try {
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });

      const res = await apiFetch(API_FLIER + '?action=upload', {
        method: 'POST',
        body: JSON.stringify({ dataUrl, kind: 'icon' }),
      });

      if (!res.ok || !res.data?.success || !res.data.url) {
        throw new Error(res.data?.error || 'Upload failed');
      }

      selectedUrl = res.data.url;
      statusEl.textContent = 'Uploaded — click Save';
      statusEl.className = 'upload-url-status success';
      $('iconPickerSave').disabled = false;
    } catch (err) {
      statusEl.textContent = err.message || 'Upload failed';
      statusEl.className = 'upload-url-status error';
    }
  });

  $('iconPickerCancel')?.addEventListener('click', closeModal);
  $('iconPickerSave')?.addEventListener('click', () => {
    if (!selectedUrl) return;
    closeModal();
    if (typeof onSelect === 'function') onSelect(selectedUrl);
  });
}

  async function renderFilesPanel(panel) {
    panel.innerHTML = skeletonCard(6);
    let files = [];
    try { files = await IDB.listFiles(S.pid); } catch (err) {
      panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('alertCircle', "Couldn't read files", String(err?.message || err))}</div></div>`;
      return;
    }
    const visibleFiles = files.filter(f => !isSystemFile(f.path));
    bumpTabCount('files', visibleFiles.length);
    const totalSize = files.reduce((s, f) => s + estimateBytes(f.content), 0);
    const canEdit = S.isEditor || S.isLocalOnly;

    panel.innerHTML = `
      <div class="files-toolbar">
        ${canEdit ? `
          <button class="btn btn-sm btn-primary" id="btnNewFile">${svg('plus', 10, 2.4)} New</button>
          <button class="btn btn-sm btn-secondary" id="btnUploadFile">${svg('upload', 10, 2.2)} Upload</button>
        ` : ''}
        <button class="btn btn-sm btn-secondary btn-icon" id="btnExpandAll" aria-label="Expand all">${svg('expand', 10, 2.2)}</button>
        <button class="btn btn-sm btn-secondary btn-icon" id="btnCollapseAll" aria-label="Collapse all">${svg('collapse', 10, 2.2)}</button>
        <input class="input" id="fileFilter" placeholder="Filter…" style="flex:1;min-width:80px;height:26px;font-size:11px;">
        <span class="meta">${visibleFiles.length} files · ${formatBytes(totalSize)}</span>
      </div>
      ${visibleFiles.length === 0 ? `
        <div class="card"><div class="card-body">
          ${emptyState('folder', 'No files yet', canEdit ? 'Create your first file or upload one.' : 'This project has no files yet.')}
          ${canEdit ? `<button class="btn btn-primary btn-sm" id="btnFirstFile" style="margin-top:8px;">${svg('plus', 10, 2.4)} Create file</button>` : ''}
        </div></div>
      ` : `<div class="file-tree-wrap" id="fileTreeContainer"></div>`}
      <input type="file" id="fileUploadInput" multiple style="display:none;">
    `;

    const treeContainer = $('fileTreeContainer');
    const filterInput = $('fileFilter');
    if (filterInput) filterInput.value = S.fileFilter;

    const render = () => {
      if (!treeContainer) return;
      treeContainer.innerHTML = '';
      const filter = S.fileFilter.toLowerCase();
      const filtered = filter
        ? visibleFiles.filter(f => f.path.toLowerCase().includes(filter))
        : visibleFiles;
      if (filtered.length === 0) {
        treeContainer.innerHTML = `<div class="empty-state" style="padding:16px 8px;"><div class="empty-state-title" style="font-size:12px;">No matches</div></div>`;
        return;
      }
      const filteredTree = buildFileTree(filtered.map(f => f.path));
      renderFileTreeNodes(treeContainer, filteredTree, 0, !!filter, render);
    };

    filterInput?.addEventListener('input', debounce((e) => {
      S.fileFilter = e.target.value;
      render();
    }, 150));

    $('btnNewFile')?.addEventListener('click', () => createNewFile(panel));
    $('btnFirstFile')?.addEventListener('click', () => createNewFile(panel));
    $('btnUploadFile')?.addEventListener('click', () => $('fileUploadInput')?.click());
    $('fileUploadInput')?.addEventListener('change', (e) => handleFileUpload(e, panel));
    $('btnExpandAll')?.addEventListener('click', () => {
      const addAll = (node) => {
        for (const [_, child] of Object.entries(node.children)) {
          S.expandedFolders.add(child.path);
          addAll(child);
        }
      };
      addAll(buildFileTree(visibleFiles.map(f => f.path)));
      saveExpanded();
      render();
    });
    $('btnCollapseAll')?.addEventListener('click', () => {
      S.expandedFolders.clear();
      saveExpanded();
      render();
    });

    render();
  }

  function buildFileTree(paths) {
    const root = { name: '', children: {}, files: [], path: '' };
    for (const path of paths) {
      const parts = path.split('/');
      let node = root;
      for (let i = 0; i < parts.length - 1; i++) {
        const part = parts[i];
        if (!node.children[part]) {
          node.children[part] = { name: part, children: {}, files: [], path: parts.slice(0, i + 1).join('/') };
        }
        node = node.children[part];
      }
      node.files.push({ name: parts[parts.length - 1], path });
    }
    return root;
  }

  function renderFileTreeNodes(container, node, depth, forceExpand, rerender) {
    const canEdit = S.isEditor || S.isLocalOnly;
    const folderNames = Object.keys(node.children).sort();
    for (const folderName of folderNames) {
      const folder = node.children[folderName];
      const isExpanded = forceExpand || S.expandedFolders.has(folder.path);
      const row = document.createElement('div');
      row.className = 'tree-node is-folder' + (isExpanded ? ' expanded' : '');
      row.style.paddingLeft = (6 + depth * 12) + 'px';
      row.innerHTML = `
        <span class="chevron">${svg('chevronRight', 9, 2.4)}</span>
        <span class="icon" style="color:var(--theme-primary);">${svg('folder', 12, 2.2)}</span>
        <span class="name">${escapeHTML(folderName)}</span>
      `;
      row.addEventListener('click', () => {
        if (S.expandedFolders.has(folder.path)) S.expandedFolders.delete(folder.path);
        else S.expandedFolders.add(folder.path);
        saveExpanded();
        rerender();
      });
      container.appendChild(row);
      if (isExpanded) renderFileTreeNodes(container, folder, depth + 1, forceExpand, rerender);
    }

    const files = node.files.sort((a, b) => a.name.localeCompare(b.name));
    for (const file of files) {
      if (isSystemFile(file.path)) continue;
      const row = document.createElement('div');
      row.className = 'tree-node';
      row.style.paddingLeft = (6 + depth * 12) + 'px';
      row.innerHTML = `
        <span class="chevron" style="visibility:hidden;"></span>
        <span class="icon" style="color:var(--theme-text-tertiary);">${svg(fileIconName(file.path), 12, 2)}</span>
        <span class="name" title="${escapeAttr(file.path)}">${escapeHTML(file.name)}</span>
        ${canEdit ? `<button class="open-btn" data-file-delete title="Delete" style="color:var(--theme-danger);">${svg('trash', 10, 2.2)}</button>` : ''}
        <button class="open-btn" data-file-open title="Open">${svg('external', 10, 2.2)}</button>
      `;
      row.querySelector('[data-file-open]')?.addEventListener('click', (e) => { e.stopPropagation(); openInEditor(file.path); });
      row.querySelector('[data-file-delete]')?.addEventListener('click', (e) => { e.stopPropagation(); confirmDeleteFile(file.path); });
      row.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        if (canEdit) openFileEditor(file.path);
        else openInEditor(file.path);
      });
      container.appendChild(row);
    }
  }

  async function refreshFileCount() {
    try {
      const files = await IDB.listFiles(S.pid);
      const count = files.filter(f => !isSystemFile(f.path)).length;
      bumpTabCount('files', count);
    } catch {}
  }

  async function createNewFile(panel) {
    if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }
    openModal(`
      <div class="modal-title">New file</div>
      <div class="modal-desc">Path like <code class="mono">src/app.js</code> for nested.</div>
      <div class="field">
        <label class="field-label">File path</label>
        <input class="input mono" id="newFilePath" placeholder="app.js" autocomplete="off" spellcheck="false">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="newFileCreate">Create</button>
      </div>
    `);
    $('newFilePath').focus();
    $('newFilePath').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('newFileCreate').click(); });
    $('newFileCreate').addEventListener('click', async () => {
      const path = $('newFilePath').value.trim().replace(/^\/+/, '');
      if (!path) { toast('Path required', 'error'); return; }
      if (!/^[a-zA-Z0-9._\-\/]+$/.test(path)) { toast('Invalid characters', 'error'); return; }
      if (isSystemFile(path)) { toast('Reserved path', 'error'); return; }
      const existing = await IDB.getFile(S.pid, path);
      if (existing) { toast('File already exists', 'warning'); return; }
      try {
        await IDB.putFile(S.pid, path, '');
        if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
          await apiFetch(API_HOST + '?action=project/sync-back', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, files: { [path]: '' } }),
          });
        } else {
          await enqueueSync('file-save', { path, content: '' });
        }
        closeModal();
        toast(`Created ${path}`, 'success');
        await refreshFileCount();
        renderPanel();
        setTimeout(() => openFileEditor(path), 200);
      } catch (err) { toast(err.message || 'Create failed', 'error'); }
    });
  }

  async function openFileEditor(path) {
    let content = '';
    try { const file = await IDB.getFile(S.pid, path); content = file?.content || ''; } catch {}
    if (!content && S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
      try {
        const res = await apiFetch(API_HOST + '?action=file/get&pid=' + encodeURIComponent(S.pid) + '&path=' + encodeURIComponent(path));
        if (res.ok && res.data?.success) content = res.data.content || '';
      } catch {}
    }

    if (isImagePath(path) && content) {
      openModal(`
        <div class="modal-title">${escapeHTML(path)}</div>
        <div style="border-radius:10px;overflow:hidden;border:1px solid var(--theme-card-border);max-height:60vh;overflow:auto;margin-bottom:10px;">
          <img src="${escapeAttr(content)}" alt="" style="max-width:100%;display:block;">
        </div>
        <div class="modal-actions"><button class="btn btn-secondary btn-block" onclick="closeModal()">Close</button></div>
      `);
      return;
    }

    if (content.length > 512 * 1024) {
      openModal(`
        <div class="modal-title">${escapeHTML(path)}</div>
        <div class="modal-desc">File is ${formatBytes(content.length)} — too large to edit inline (max 500 KB).</div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="fileTooBigOpen">Open in editor</button>
        </div>
      `);
      $('fileTooBigOpen')?.addEventListener('click', () => { closeModal(); openInEditor(path); });
      return;
    }

    const isText = isTextFile(path);
    openModal(`
      <div class="modal-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(path)}</span>
        <button class="btn btn-ghost btn-sm btn-icon" id="fileEditorClose" aria-label="Close">${svg('x', 12, 2.4)}</button>
      </div>
      <div class="field" style="margin-bottom:6px;">
        ${isText
          ? `<textarea class="textarea mono" id="fileEditorContent" style="min-height:45vh;font-family:var(--font-mono);font-size:12px;line-height:1.5;">${escapeHTML(content)}</textarea>`
          : `<div style="font-size:11.5px;color:var(--theme-text-tertiary);padding:12px;background:var(--theme-glass-bg);border-radius:8px;text-align:center;">Binary file</div>`}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
        <span style="font-size:10.5px;color:var(--theme-text-tertiary);" id="fileEditorSize">${isText ? content.length + ' chars' : ''}</span>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-ghost btn-sm" id="fileEditorOpenEditor">${svg('external', 10, 2.2)} Open in editor</button>
          ${isText ? `<button class="btn btn-primary btn-sm" id="fileEditorSave">${svg('check', 10, 2.4)} Save</button>` : ''}
        </div>
      </div>
    `);

    $('fileEditorClose').addEventListener('click', closeModal);
    $('fileEditorOpenEditor').addEventListener('click', () => { closeModal(); openInEditor(path); });
    const ta = $('fileEditorContent');
    if (ta) ta.addEventListener('input', () => {
      const el = $('fileEditorSize');
      if (el) el.textContent = `${ta.value.length} chars`;
    });
    $('fileEditorSave')?.addEventListener('click', async () => {
      const btn = $('fileEditorSave');
      btn.disabled = true;
      const prev = btn.innerHTML;
      btn.innerHTML = 'Saving…';
      try {
        const text = ta.value;
        await IDB.putFile(S.pid, path, text);
        if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=project/sync-back', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, files: { [path]: text } }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Save failed');
        } else {
          await enqueueSync('file-save', { path, content: text });
        }
        toast('Saved', 'success');
        if (S.activeTab === 'files') renderPanel();
      } catch (err) {
        toast(err.message || 'Save failed', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = prev;
      }
    });
  }

  function confirmDeleteFile(path) {
    if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }
    confirmModal(`Delete ${path.split('/').pop()}?`, 'This removes the file from the project.', 'Delete', true, async () => {
      showLoading('Deleting', '');
      try {
        if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=file/delete', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, path }),
          });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Delete failed');
        } else {
          await enqueueSync('file-delete', { path });
        }
        await IDB.deleteFile(S.pid, path);
        hideLoading();
        toast('File deleted', 'success');
        await refreshFileCount();
        renderPanel();
      } catch (err) {
        hideLoading();
        toast(err.message || 'Delete failed', 'error');
      }
    });
  }

  async function handleFileUpload(e, panel) {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (files.length === 0) return;
    if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }

    showLoading('Uploading', `0 / ${files.length}`);
    let uploaded = 0;
    let skipped = 0;
    const fileMap = {};
    for (const file of files) {
      try {
        const text = await file.text();
        await IDB.putFile(S.pid, file.name, text);
        fileMap[file.name] = text;
        uploaded++;
        $('loadingDesc').textContent = `${uploaded} / ${files.length}`;
      } catch { skipped++; }
    }
    if (Object.keys(fileMap).length > 0) {
      if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
        try {
          await apiFetch(API_HOST + '?action=project/sync-back', {
            method: 'POST',
            body: JSON.stringify({ pid: S.pid, files: fileMap }),
          });
        } catch {}
      } else {
        for (const [path, content] of Object.entries(fileMap)) {
          await enqueueSync('file-save', { path, content });
        }
      }
    }
    hideLoading();
    toast(`Uploaded ${uploaded}${skipped ? ` (${skipped} skipped)` : ''}`, uploaded > 0 ? 'success' : 'warning');
    await refreshFileCount();
    renderPanel();
  }

  function openInEditor(filePath) {
    const url = new URL('/', location.origin);
    url.searchParams.set('pid', S.pid);
    if (filePath) url.searchParams.set('file', filePath);
    window.location.href = url.toString();
  }

  async function pollDeployStatus(pid) {
    for (let attempt = 0; attempt < 3; attempt++) {
      await new Promise(r => setTimeout(r, 1500));
      try {
        const st = await apiFetch(API_HOST + '?action=status&pid=' + encodeURIComponent(pid));
        if (st.ok && st.data?.success && st.data.deployment?.url) {
          return st.data.deployment;
        }
      } catch {}
    }
    return null;
  }

  async function deployNow() {
  if (!S.isEditor || !S.online) { toast('Requires internet', 'warning'); return; }
  if (S.isLocalOnly) { toast("Local projects can't be deployed — sync to account first", 'warning'); return; }
  if (S.syncState === 'needs-pull') {
    toast('Sync files first before deploying', 'warning', 4000);
    return;
  }

  let files = [];
  try { files = await IDB.listFiles(S.pid); } catch {}
  const fileMap = {};
  for (const f of files) {
    if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
    if (typeof f.content !== 'string') continue;
    fileMap[f.path] = f.content;
  }
  if (Object.keys(fileMap).length === 0) { toast('No files to deploy', 'warning'); return; }

  confirmModal(
    `Deploy ${Object.keys(fileMap).length} file${Object.keys(fileMap).length === 1 ? '' : 's'}?`,
    'This will build and deploy to a live URL.',
    'Deploy',
    false,
    async () => {
      showLoading('Deploying', 'Uploading files…');
      try {
        $('loadingDesc').textContent = 'Deploying…';
        const res = await apiFetch(API_HOST + '?action=deploy', {
          method: 'POST',
          body: JSON.stringify({ pid: S.pid, files: fileMap }),
        });

        if (!res.ok || !res.data?.success) {
          const msg = res.data?.error
            || (res.status === 403 ? 'You don\'t have permission to deploy this project'
              : res.status === 404 ? 'Project not found on server'
              : 'Deploy failed');
          throw new Error(msg);
        }

        const returnedUrl = res.data.url || null;
        if (returnedUrl) {
          const liveDeployment = {
            url: returnedUrl,
            serveUrl: res.data.serveUrl || null,
            versionId: res.data.versionId || null,
            deploymentId: res.data.deploymentId,
            deployedAt: Date.now(),
            state: 'READY',
          };
          S.deployState = liveDeployment;
          S.project.deployment = liveDeployment;
        }

        markSynced(S.pid);

        $('loadingDesc').textContent = 'Confirming…';
        const live = await pollDeployStatus(S.pid);
        if (live) {
          S.deployState = live;
          S.project.deployment = live;
        }

        hideLoading();
        toast('Deployed · ' + (live?.url || returnedUrl || 'live'), 'success');

        if (res.data.filesSkipped > 0) {
          toast(`${res.data.filesSkipped} file(s) skipped — usually size or invalid path`, 'warning', 4000);
        }

        // ✅ Invalidate cache and re-fetch history so (N/5) badges and
        // the history list refresh immediately after deploy.
        S.deployCache = { history: null, currentId: null, total: 0, at: 0, maxDeployments: 5 };
        await loadDeployState();
        await new Promise(r => setTimeout(r, 400));

        if (['deployments', 'overview', 'commits'].includes(S.activeTab)) renderPanel();
        updateHeader();
      } catch (err) {
        hideLoading();
        toast(err.message || 'Deploy failed', 'error', 5000);
      }
    }
  );
}

  async function renderDeploymentsPanel(panel) {

  const now = Date.now();
  let current, history, currentId, total, maxDeployments;
  if (S.deployCache.history && (now - S.deployCache.at) < DEPLOY_HISTORY_CACHE_TTL) {
    current = S.deployState;
    history = S.deployCache.history;
    currentId = S.deployCache.currentId;
    total = S.deployCache.total;
    maxDeployments = S.deployCache.maxDeployments;
  } else {
    const [statusRes, historyRes] = await Promise.all([
      apiFetch(API_HOST + '?action=status&pid=' + encodeURIComponent(S.pid)),
      apiFetch(API_HOST + '?action=deployment/history&pid=' + encodeURIComponent(S.pid)),
    ]);
    current = statusRes.ok ? statusRes.data?.deployment : null;
    history = historyRes.ok ? (historyRes.data?.deployments || []) : [];
    currentId = historyRes.ok ? historyRes.data?.currentDeploymentId : null;
    total = historyRes.ok ? historyRes.data?.total : history.length;
    maxDeployments = historyRes.ok ? historyRes.data?.maxDeployments : 5;
    S.deployCache = { history, currentId, total, maxDeployments, at: now };
  }

  S.deployState = current;
  S.project.deployment = current || S.project.deployment;
  bumpTabCount('deployments', history.length);

  const isLive = current?.url && current.state !== 'OFFLINE';
  const isOffline = current?.state === 'OFFLINE';
  const needsRedeploy = current && !current.url && !isOffline;
  const canDeploy = S.isEditor && S.online && S.syncState === 'synced';

  const previewIds = new Set(
    history.filter(d => d.hasSnapshot === true).slice(0, 3).map(d => d.id)
  );

  const currentBlock = (() => {
    if (isLive) {
      return `
        <div class="deploy-row current">
          <div class="deploy-icon">${svg('check', 13, 2.2)}</div>
          <div class="deploy-info">
            <div class="deploy-title">Current deploy <span class="badge success" style="font-size:8px">CURRENT</span></div>
            <div class="deploy-sub mono" style="font-size:10px;word-break:break-all;">${escapeHTML(current.url)}</div>
            <div class="deploy-sub">${timeAgo(current.deployedAt)} · ${escapeHTML(current.state || 'READY')}</div>
          </div>
          <div class="deploy-actions">
            <button class="btn btn-ghost btn-icon" id="btnCopyLiveUrl" title="Copy URL">${svg('copy', 10, 2.2)}</button>
            <a class="btn btn-ghost btn-icon" href="${escapeAttr(current.url)}" target="_blank" rel="noopener" title="Open">${svg('external', 10, 2.2)}</a>
            ${S.isEditor ? `<button class="btn btn-ghost btn-icon" id="btnTakeOffline" title="Take offline">${svg('eyeOff', 10, 2.2)}</button>` : ''}
          </div>
        </div>
      `;
    }
    if (needsRedeploy) {
      return `
        <div class="deploy-row">
          <div class="deploy-icon" style="color:var(--theme-warning)">${svg('alert', 13, 2.2)}</div>
          <div class="deploy-info">
            <div class="deploy-title">Needs redeploy <span class="badge warning" style="font-size:8px">NO URL</span></div>
            <div class="deploy-sub">Deployment record exists but has no live URL</div>
          </div>
          ${canDeploy ? `<button class="btn btn-primary btn-sm" id="btnRedeployNow">Redeploy</button>` : ''}
        </div>
      `;
    }
    if (isOffline) {
      return `
        <div class="deploy-row">
          <div class="deploy-icon" style="color:var(--theme-text-tertiary)">${svg('eyeOff', 13, 2.2)}</div>
          <div class="deploy-info">
            <div class="deploy-title">Offline</div>
            <div class="deploy-sub">${current.previousUrl ? 'Last live at: ' + escapeHTML(current.previousUrl) : 'Taken offline'}</div>

    panel.querySelectorAll('[data-preview-menu]').forEach(btn => {

function openDeploymentLinks(deploymentId, anchor) {
  const urls = buildDeploymentUrls(deploymentId);
  if (!urls) { toast('URLs unavailable — missing username or slug', 'warning'); return; }

  const existing = document.querySelector('.deployment-links-popover');
  if (existing) existing.remove();

  const pop = el('div', { class: 'deployment-links-popover' });
  const rows = [
    { label: 'Preview (clean URL)',   value: urls.clean, icon: 'eye' },
    { label: 'Preview (direct)',      value: urls.serve, icon: 'code' },
    { label: 'Open in new tab',       value: urls.clean, icon: 'external', open: true },
  ];
  for (const row of rows) {
    const btn = el('button', {
      class: 'deployment-links-item', type: 'button',
      onclick: () => {
        if (row.open) {
          window.open(row.value, '_blank', 'noopener');
        } else {
          if (copyToClipboard(row.value)) toast('Copied', 'success', 1000);
          else toast('Copy failed', 'error');
        }
        pop.remove();
      },
    },
      el('span', { class: 'deployment-links-icon' }, ''),
      el('span', { class: 'deployment-links-label' }, row.label),
      el('code', { class: 'deployment-links-value' }, row.value)
    );
    btn.querySelector('.deployment-links-icon').innerHTML = svg(row.icon, 12, 2.2);
    pop.appendChild(btn);
  }

  const rect = anchor.getBoundingClientRect();
  pop.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  pop.style.left = Math.max(8, rect.right - 300 + window.scrollX) + 'px';
  document.body.appendChild(pop);

  setTimeout(() => {
    document.addEventListener('click', function handler(ev) {
      if (!pop.contains(ev.target) && ev.target !== anchor) {
        pop.remove();
        document.removeEventListener('click', handler);
      }
    });
  }, 50);
}

  function buildDeploymentUrls(deploymentId) {
  const user = getOwnerUsername();
  const slug = S.project?.slug || '';
  if (!user || !slug) return null;
  const base = `${BASE_URL}/${encodeURIComponent(user)}/project/${encodeURIComponent(slug)}/`;
  return {
    clean: base + '?from=' + encodeURIComponent(deploymentId),
    serve: `${BASE_URL}/api/host?action=serve&pid=${encodeURIComponent(S.pid)}&path=index.html&from=${encodeURIComponent(deploymentId)}`,
    bare:  base,
  };
}
