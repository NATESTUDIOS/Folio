<script>
(function () {
  try {
    var pref = localStorage.getItem("folio.theme") || "dark";
    var resolved = pref;
    if (pref === "auto" || pref === "system") {
      resolved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    }
    if (resolved === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");
    if (localStorage.getItem("folio.reducedMotion") === "true") document.documentElement.setAttribute("data-reduced-motion", "true");
    var scale = Number(localStorage.getItem("folio.pageScale") || 1);
    if (!Number.isFinite(scale) || scale < 0.85) scale = 1;
    if (scale > 1.35) scale = 1.35;
    document.documentElement.style.setProperty("--page-scale", String(scale));
    var meta = document.getElementById("themeColorMeta");
    if (meta) meta.setAttribute("content", resolved === "light" ? "#f7f8fa" : "#0a0c10");
  } catch (e) {}
})();
</script>

(function () {
  'use strict';
  function wireThemeSync() {
  window.addEventListener('storage', function (e) {
    try {
      if (e.key === 'folio.theme') {
        var pref = e.newValue || 'dark';
        var resolved = pref;
        if (pref === 'auto' || pref === 'system') resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        if (resolved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
        var meta = document.getElementById('themeColorMeta');
        if (meta) meta.setAttribute('content', resolved === 'light' ? '#f7f8fa' : '#0a0c10');
      }
      if (e.key === 'folio.reducedMotion') {
        if (e.newValue === 'true') document.documentElement.setAttribute('data-reduced-motion', 'true');
        else document.documentElement.removeAttribute('data-reduced-motion');
      }
    } catch (err) {}
  });
}

function wireThemeMediaQuery() {
  if (!window.matchMedia) return;
  var mq = window.matchMedia('(prefers-color-scheme: light)');
  var handler = function () {
    try {
      var pref = localStorage.getItem('folio.theme') || 'dark';
      if (pref !== 'auto' && pref !== 'system') return;
      var resolved = mq.matches ? 'light' : 'dark';
      if (resolved === 'light') document.documentElement.setAttribute('data-theme', 'light');
      else document.documentElement.removeAttribute('data-theme');
      var meta = document.getElementById('themeColorMeta');
      if (meta) meta.setAttribute('content', resolved === 'light' ? '#f7f8fa' : '#0a0c10');
    } catch (e) {}
  };
  if (mq.addEventListener) mq.addEventListener('change', handler);
  else if (mq.addListener) mq.addListener(handler);
}

let dbConn = null;
function openDB() {
  if (dbConn) return Promise.resolve(dbConn);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onblocked = () => setTimeout(() => {
      try { req.result?.close?.(); } catch {}
      dbConn = null; openDB().then(resolve, reject);
    }, 800);
    req.onsuccess = () => { dbConn = req.result; resolve(dbConn); };
    req.onupgradeneeded = (event) => {
      const conn = event.target.result;
      if (!conn.objectStoreNames.contains('projects')) conn.createObjectStore('projects', { keyPath: 'pid' });
      if (!conn.objectStoreNames.contains('files')) {
        const store = conn.createObjectStore('files', { keyPath: ['pid', 'path'] });
        store.createIndex('pid', 'pid');
      }
      if (!conn.objectStoreNames.contains('versions')) {
        const store = conn.createObjectStore('versions', { keyPath: 'vid' });
        store.createIndex('pid', 'pid');
      }
      if (!conn.objectStoreNames.contains('projectMeta')) conn.createObjectStore('projectMeta', { keyPath: 'pid' });
      if (!conn.objectStoreNames.contains('syncQueue')) conn.createObjectStore('syncQueue', { keyPath: 'id', autoIncrement: true });
      if (!conn.objectStoreNames.contains('folders')) {
        const store = conn.createObjectStore('folders', { keyPath: ['pid', 'path'] });
        store.createIndex('pid', 'pid');
      }
    };
  });
}

function dbWrap(req, retries = 1) {
  return new Promise((res, rej) => {
    req.onsuccess = () => res(req.result);
    req.onerror = () => { if (retries > 0) return dbWrap(req, retries - 1).then(res, rej); rej(req.error); };
  });
}
function dbTx(store, mode = 'readonly') { return dbConn.transaction(store, mode).objectStore(store); }

const IDB = {
  async getProject(pid) { return dbWrap(dbTx('projects').get(pid)); },
  async putProject(p) { return dbWrap(dbTx('projects', 'readwrite').put(p)); },
  async deleteProject(pid) {
    await dbWrap(dbTx('projects', 'readwrite').delete(pid));
    const files = await dbWrap(dbTx('files').index('pid').getAll(pid));
    for (const f of files) await dbWrap(dbTx('files', 'readwrite').delete([f.pid, f.path]));
    const versions = await dbWrap(dbTx('versions').index('pid').getAll(pid));
    for (const v of versions) await dbWrap(dbTx('versions', 'readwrite').delete(v.vid));
    const folders = await dbWrap(dbTx('folders').index('pid').getAll(pid));
    for (const f of folders) await dbWrap(dbTx('folders', 'readwrite').delete([f.pid, f.path]));
  },
  async listFiles(pid) { return dbWrap(dbTx('files').index('pid').getAll(pid)); },
  async getFile(pid, path) { return dbWrap(dbTx('files').get([pid, path])); },
  async putFile(pid, path, content) { return dbWrap(dbTx('files', 'readwrite').put({ pid, path, content, updatedAt: Date.now() })); },
  async deleteFile(pid, path) { return dbWrap(dbTx('files', 'readwrite').delete([pid, path])); },
  async listVersions(pid) {

  async putFolder(pid, path) { return dbWrap(dbTx('folders', 'readwrite').put({ pid, path, createdAt: Date.now() })); },
  async getProjectMeta(pid) {

  },
  async listSyncQueue() { return dbWrap(dbTx('syncQueue').getAll()); },
  async deleteSyncQueue(id) { return dbWrap(dbTx('syncQueue', 'readwrite').delete(id)); },
  async updateSyncQueue(item) { return dbWrap(dbTx('syncQueue', 'readwrite').put(item)); },
};

function timeAgo(ts) {
  if (!ts) return '—';
  const diff = Date.now() - ts;
  if (diff < 60000) return 'just now';
  const m = Math.floor(diff / 60000);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  if (d < 30) return `${d}d ago`;
  return new Date(ts).toLocaleDateString();
}
function formatBytes(n) {
  if (!n || n < 0) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n < 10 ? n.toFixed(1) : Math.round(n)} ${u[i]}`;
}
function formatNumber(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n || 0);
}
function getInitials(name) {
  const s = String(name || '').trim();
  if (!s) return '?';
  const parts = s.split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function getAvatarColor(seed) {
  const s = String(seed || '');
  let hash = 0;
  for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_GRADIENTS[Math.abs(hash) % AVATAR_GRADIENTS.length];
}

  const s = String(seed || 'x');

  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;

function estimateBytes(content) {
  if (!content) return 0;
  if (typeof content !== 'string') content = String(content);
  if (/^https?:\/\//i.test(content)) return content.length;
  if (content.startsWith('data:')) {
    const comma = content.indexOf(',');
    const b64 = comma >= 0 ? content.slice(comma + 1) : content;
    return Math.floor(b64.length * 0.75);
  }

}

async function copyToClipboard(text) {
  if (!text) return false;
  if (navigator.clipboard?.writeText && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.left = '-9999px';
    ta.style.opacity = '1';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    document.body.removeChild(ta);
    return ok;
  } catch { return false; }
}

function handle401() {
  try { localStorage.removeItem(STORAGE.session); localStorage.removeItem(STORAGE.user); } catch {}
  if (!sessionStorage.getItem('folio.authRedirectShown')) {
    sessionStorage.setItem('folio.authRedirectShown', '1');
    setTimeout(() => { const next = encodeURIComponent(location.pathname + location.search); location.href = '/register?next=' + next; }, 800);
  }

async function apiFetch(url, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (S.session) headers['Authorization'] = `Bearer ${S.session}`;
  trackPending();
  try {
    const res = await fetch(url, { ...opts, headers });
    let data = {};
    try { data = await res.json(); } catch {}
    if (res.status === 401) handle401();
    return { ok: res.ok, status: res.status, data };
  } catch (err) {
    return { ok: false, status: 0, data: { error: 'NETWORK_ERROR' } };
  } finally { untrackPending(); }
}

async function refreshSyncQueueCount() {
  try {
    const queue = await IDB.listSyncQueue();
    const mine = queue.filter(item => item.pid === S.pid);
    S.syncQueueCount = mine.length;
    const badge = $('syncBadge');
    if (badge) {
      if (mine.length > 0) { badge.textContent = String(mine.length); badge.classList.remove('hidden'); }
      else badge.classList.add('hidden');

async function flushSyncQueue() {
  if (S.syncFlushing || !S.online || !S.session || S.isLocalOnly) return;
  S.syncFlushing = true;
  try {
    const queue = await IDB.listSyncQueue();
    for (const item of queue) {
      if (item.pid !== S.pid) continue;
      try {
        let success = false, body = null, endpoint = API_HOST;
        if (item.type === 'file-save') { endpoint = API_HOST + '?action=project/sync-back'; body = { pid: item.pid, files: { [item.payload.path]: item.payload.content } }; }
        else if (item.type === 'file-delete') { endpoint = API_HOST + '?action=file/delete'; body = { pid: item.pid, path: item.payload.path }; }
        else if (item.type === 'version-commit') { endpoint = API_HOST + '?action=project/sync-back'; body = { pid: item.pid, versions: { [item.payload.vid]: item.payload.data } }; }
        else if (item.type === 'metatags-save') { endpoint = API_HOST + '?action=metatags/save'; body = { pid: item.pid, metaTags: item.payload.metaTags }; }
        else if (item.type === 'project-update') { endpoint = API_HOST + '?action=projects/update'; body = { pid: item.pid, ...item.payload }; }
        else success = true;
        if (body) {
          const res = await apiFetch(endpoint, { method: 'POST', body: JSON.stringify(body) });
          success = res.ok && res.data?.success;
          if (!success && (res.status === 400 || res.status === 403 || res.status === 404)) { await IDB.deleteSyncQueue(item.id); continue; }
        }
        if (success) await IDB.deleteSyncQueue(item.id);
        else { item.attempts = (item.attempts || 0) + 1; if (item.attempts >= SYNC_QUEUE_MAX_ATTEMPTS) await IDB.deleteSyncQueue(item.id); else await IDB.updateSyncQueue(item); }
      } catch {
        item.attempts = (item.attempts || 0) + 1;
        if (item.attempts >= SYNC_QUEUE_MAX_ATTEMPTS) await IDB.deleteSyncQueue(item.id);
        else await IDB.updateSyncQueue(item);
      }
    }
  } finally { S.syncFlushing = false; await refreshSyncQueueCount(); }
}
function startSyncFlushLoop() {
  if (S.syncTimer) clearInterval(S.syncTimer);
  S.syncTimer = setInterval(() => { if (S.online && S.syncQueueCount > 0) flushSyncQueue(); }, SYNC_QUEUE_FLUSH_INTERVAL);
}

async function pullFromServer() {

    refreshFileCount().catch(() => {}); refreshSyncQueueCount().catch(() => {});
  } catch (err) { hideLoading(); toast(err.message || 'Sync failed', 'error', 5000); }
}

async function promoteLocalProject() {
  if (!S.session) { window.location.href = '/register?next=' + encodeURIComponent(location.pathname + location.search); return; }
  if (!S.isLocalOnly) { toast('Already on server', 'info'); return; }
  if (!S.online) { toast('Requires internet', 'warning'); return; }
  showLoading('Syncing project', 'Creating server project…');
  try {
    const createRes = await apiFetch(API_HOST + '?action=projects/create', {
      method: 'POST',
      body: JSON.stringify({ name: S.project.name || 'Imported project', description: S.project.description || '' }),
    });
    if (!createRes.ok || !createRes.data?.success) throw new Error(createRes.data?.error || 'Create failed');
    const newPid = createRes.data.pid;
    const files = await IDB.listFiles(S.pid);
    const fileMap = {};
    for (const f of files) { if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue; fileMap[f.path] = f.content || ''; }
    const syncRes = await apiFetch(API_HOST + '?action=project/sync-back', { method: 'POST', body: JSON.stringify({ pid: newPid, files: fileMap }) });
    if (!syncRes.ok || !syncRes.data?.success) throw new Error(syncRes.data?.error || 'Sync failed');
    const project = { pid: newPid, name: S.project.name || 'Imported', slug: createRes.data.project?.slug || S.project.slug || '', description: S.project.description || '', iconUrl: S.project.iconUrl || null, createdAt: S.project.createdAt || Date.now(), updatedAt: Date.now(), storageLimit: S.project.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT, myRole: 'owner', _server: true };
    await IDB.putProject(project);
    for (const f of files) await IDB.putFile(newPid, f.path, f.content);
    await IDB.deleteProject(S.pid);
    hideLoading(); toast('Project synced', 'success');
    setTimeout(() => { window.location.href = '/project?pid=' + encodeURIComponent(newPid); }, 400);
  } catch (err) { hideLoading(); toast(err.message || 'Sync failed', 'error'); }
}
async function pushOrphanToServer() {
  if (!S.session) { window.location.href = '/register?next=' + encodeURIComponent(location.pathname + location.search); return; }
  if (!S.online) { toast('Requires internet', 'warning'); return; }
  if (S.syncState !== 'orphan') { toast('Nothing to push', 'info'); return; }
  const oldPid = S.pid;
  showLoading('Pushing to server', 'Creating project…');
  try {
    const create = await apiFetch(API_HOST + '?action=projects/create', { method: 'POST', body: JSON.stringify({ name: S.project.name || 'Untitled', description: S.project.description || '' }) });
    if (!create.ok || !create.data?.success) throw new Error(create.data?.error || 'Create failed');
    const newPid = create.data.pid;
    const files = await IDB.listFiles(oldPid);
    const fileMap = {};
    for (const f of files) { if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue; if (typeof f.content === 'string') fileMap[f.path] = f.content; }
    if (Object.keys(fileMap).length === 0) throw new Error('No files to push');
    const sync = await apiFetch(API_HOST + '?action=project/sync-back', { method: 'POST', body: JSON.stringify({ pid: newPid, files: fileMap }) });
    if (!sync.ok || !sync.data?.success) throw new Error(sync.data?.error || 'Sync failed');
    for (const f of files) await IDB.putFile(newPid, f.path, f.content);
    await IDB.putProject({ ...S.project, pid: newPid, myRole: 'owner', _server: true, updatedAt: Date.now() });
    await IDB.deleteProject(oldPid);
    hideLoading(); toast('Project pushed', 'success');
    setTimeout(() => { window.location.href = '/project?pid=' + encodeURIComponent(newPid); }, 400);
  } catch (err) { hideLoading(); toast(err.message || 'Push failed', 'error', 5000); }
}

function readLastSynced(pid) { if (!pid) return 0; try { return Number(localStorage.getItem('folio.lastSync.' + pid) || 0); } catch { return 0; } }

async function hydrateProjectFromServer(pid) {
  if (!pid || !S.online || !S.session) return { ok: false, reason: 'offline' };
  let res;
  try { res = await apiFetch(API_HOST + '?action=project/hydrate&pid=' + encodeURIComponent(pid)); }
  catch { return { ok: false, reason: 'network' }; }
  if (!res.ok || !res.data?.success) return { ok: false, reason: res.data?.error || `HTTP ${res.status}` };
  const files = res.data.files || {}; const versions = res.data.versions || {};
  let filesWritten = 0;
  for (const [path, content] of Object.entries(files)) { if (typeof content !== 'string') continue; try { await IDB.putFile(pid, path, content); filesWritten++; } catch {} }
  let versionsWritten = 0;
  for (const [vid, data] of Object.entries(versions)) { try { const existing = await IDB.getVersion(vid); if (existing) continue; await IDB.putVersion({ vid, pid, ...data }); versionsWritten++; } catch {} }
  markSynced(pid); return { ok: true, filesWritten, versionsWritten };
}

function normalizeServerProject(p) {

    description: p.description || '', iconUrl: p.iconUrl || null, primaryFile: p.primaryFile || null,
    createdAt: p.createdAt ? new Date(p.createdAt).getTime() : Date.now(),
    updatedAt: p.updatedAt ? new Date(p.updatedAt).getTime() : Date.now(),
    storageLimit: p.storageLimit || DEFAULT_PROJECT_STORAGE_LIMIT,
    deployment: p.deployment || null, metaTags: p.metaTags || {}, roles: p.roles || {},
    ownerUsername: p.ownerUsername || null, myRole: p.myRole || 'viewer',
    hasApiKey: !!p.hasApiKey, shortKey: p.shortKey || null, shortUrl: p.shortUrl || null,
    visibility: p.visibility || { profile: 'private', liveSite: 'private', code: 'private', languages: 'private', db: 'private' },
    _server: true,
  };
}

async function loadProject() {
  let localProject = null;
  try { localProject = await IDB.getProject(S.pid); } catch {}
  if (/^local_/.test(S.pid)) {
    if (!localProject) { showEmptyState('notfound', 'Not found', 'This local project no longer exists.', S.pid); return false; }
    S.project = { ...localProject, myRole: 'owner', visibility: localProject.visibility || { profile: 'private' } };
    S.isLocalOnly = true; setSyncState('local'); applyProjectMeta(); return true;
  }
  if (S.session && S.online) {
    let res = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      try { res = await apiFetch(API_HOST + '?action=projects/get&pid=' + encodeURIComponent(S.pid)); }
      catch { res = { ok: false, status: 0, data: { error: 'NETWORK_ERROR' } }; }
      if (res.ok || res.status === 404 || res.status === 403) break;
      if (attempt < 2) await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
    }
    if (res.ok && res.data?.success) {
      const norm = normalizeServerProject(res.data.project);
      try { await IDB.putProject(norm); } catch {}
      S.project = { ...res.data.project, ...norm };
      S.isLocalOnly = false; cacheProject(S.project);
      const serverFileCount = res.data.project.fileCount || 0;
      let localFileCount = 0;
      try { const localFiles = await IDB.listFiles(S.pid); localFileCount = localFiles.length; } catch {}
      if (serverFileCount > 0 && localFileCount === 0) { S.serverFileCount = serverFileCount; setSyncState('needs-pull'); }
      else { S.serverFileCount = serverFileCount; setSyncState('synced'); }
      try { if (S.project.deployment) await IDB.setProjectMeta(S.pid, { cachedDeployment: { ...S.project.deployment, cachedAt: Date.now() } }); } catch {}
      applyProjectMeta(); return true;
    }
    if (res.status === 404 || res.status === 403) {
      if (localProject) { const inferredRole = localProject.myRole || (localProject._server ? 'viewer' : 'owner'); S.project = { ...localProject, myRole: inferredRole, visibility: localProject.visibility || { profile: 'private' } }; S.isLocalOnly = false; setSyncState('orphan'); applyProjectMeta(); return true; }
      if (res.status === 403) showEmptyState('denied', 'Access denied', "You don't have permission to view this project.", S.pid);
      else showEmptyState('notfound', 'Project not found', "This project may have been deleted, or the link is broken.", S.pid);
      return false;
    }
    if (localProject) {
      const inferredRole = localProject.myRole || (localProject._server ? 'viewer' : 'owner');
      S.project = { ...localProject, myRole: inferredRole, visibility: localProject.visibility || { profile: 'private' } };
      S.isLocalOnly = false; setSyncState('cached');
      try { const meta = await IDB.getProjectMeta(S.pid); if (meta.cachedDeployment) { S.deployState = meta.cachedDeployment; S.project.deployment = meta.cachedDeployment; } } catch {}
      applyProjectMeta(); return true;
    }
  }
  if (localProject) { const inferredRole = localProject.myRole || (localProject._server ? 'viewer' : 'owner'); S.project = { ...localProject, myRole: inferredRole, visibility: localProject.visibility || { profile: 'private' } }; S.isLocalOnly = false; setSyncState('cached'); applyProjectMeta(); return true; }
  const cached = readCachedProject();
  if (cached) { S.project = { ...cached, myRole: cached.myRole || 'viewer' }; setSyncState('cached'); applyProjectMeta(); return true; }
  showEmptyState('notfound', "Couldn't load project", 'Check your connection and try again.', S.pid);
  return false;
}

function applyProjectMeta() {
  S.role = S.project.myRole || (S.isLocalOnly ? 'owner' : 'viewer');
  S.isOwner = S.role === 'owner';
  S.isEditor = S.role === 'owner' || S.role === 'editor';
  S.isSharedMode = !S.isOwner && !S.isEditor;
  S.tabs = S.isSharedMode ? SHARED_TABS : OWNER_TABS;
  if (!S.tabs.some(t => t.id === S.activeTab)) S.activeTab = 'overview';
  loadExpanded(); loadLastLivePage();
  updateHeader(); updateModeBanner(); renderTopTabs(); updateProjectIcons();
  if (S.isEditor || S.project.visibility?.liveSite === 'public') loadDeployState();
  updateOfflineUI();
}

function renderTopTabs() {

    const isActive = t.id === S.activeTab;
    const count = t.countKey && S.tabCounts[t.countKey] != null ? S.tabCounts[t.countKey] : null;

function bumpTabCount(key, value) { if (S.tabCounts[key] === value) return; S.tabCounts[key] = value; renderTopTabs(); }
function switchTab(tabId) {

function renderPanel() {

async function loadDeployState() {
  if (!S.online || S.isLocalOnly || S.syncState !== 'synced') return;

        updateHeader();

  } catch {}
}
async function loadAnalytics({ force = false } = {}) {
  if (!S.session || !S.online || S.isLocalOnly) {
    try { const meta = await IDB.getProjectMeta(S.pid); return meta.cachedAnalytics?.data || null; } catch { return null; }
  }
  const now = Date.now();
  if (!force && S.analyticsCache && (now - S.analyticsCache.at) < ANALYTICS_CACHE_TTL) return S.analyticsCache.data;
  try {
    const res = await apiFetch(API_ANALYTICS + '?action=project&pid=' + encodeURIComponent(S.pid));
    if (res.ok && res.data?.success) {
      S.analyticsCache = { data: res.data, at: now };
      try { await IDB.setProjectMeta(S.pid, { cachedAnalytics: { data: res.data, cachedAt: now } }); } catch {}
      return res.data;
    }
  } catch {}
  return S.analyticsCache?.data || null;
}
async function loadNotificationStats({ force = false } = {}) {
  if (!S.session || !S.online) return null;

function updateBellBadge(count) {

async function loadLogs({ force = false } = {}) {
  if (!S.session || !S.online) return null;

async function loadShortlink({ force = false } = {}) {
  if (!S.online || !S.session) {

function buildFileTree(paths) {
  const root = { name: '', children: {}, files: [], path: '' };
  for (const path of paths) {
    const parts = path.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      const part = parts[i];
      if (!node.children[part]) node.children[part] = { name: part, children: {}, files: [], path: parts.slice(0, i + 1).join('/') };
      node = node.children[part];
    }
    node.files.push({ name: parts[parts.length - 1], path });
  }
  return root;
}

function renderFileTreeNodes(container, node, depth, forceExpand, rerender) {
  const canEdit = S.isEditor || S.isLocalOnly;
  const folderNames = Object.keys(node.children).sort();
  for (const folderName of folderNames) {
    const folder = node.children[folderName];
    const isExpanded = forceExpand || S.expandedFolders.has(folder.path);
    const row = document.createElement('div');
    row.className = 'tree-node is-folder' + (isExpanded ? ' expanded' : '');
    row.style.paddingLeft = (6 + depth * 12) + 'px';
    row.innerHTML = `<span class="chevron">${svg('chevronRight', 9, 2.4)}</span><span class="icon" style="color:var(--theme-primary);">${svg('folder', 12, 2.2)}</span><span class="name">${escapeHTML(folderName)}</span>`;
    row.addEventListener('click', () => {
      if (S.expandedFolders.has(folder.path)) S.expandedFolders.delete(folder.path);
      else S.expandedFolders.add(folder.path);
      saveExpanded(); rerender();
    });
    container.appendChild(row);
    if (isExpanded) renderFileTreeNodes(container, folder, depth + 1, forceExpand, rerender);
  }
  const files = node.files.sort((a, b) => a.name.localeCompare(b.name));
  for (const file of files) {
    if (isSystemFile(file.path)) continue;
    const isSystemApi = isSystemApiFile(file.path);
    const isPrivate = isApiFile(file.path);
    const fileRow = document.createElement('div');
    fileRow.className = 'tree-node';
    fileRow.style.paddingLeft = (6 + depth * 12) + 'px';
    let badge = '';
    if (isSystemApi) badge = `<span class="file-badge system">${svg('lock', 8, 2.4)} system</span>`;
    else if (isPrivate) badge = `<span class="file-badge private">${svg('lock', 8, 2.4)} private</span>`;
    fileRow.innerHTML = `<span class="chevron" style="visibility:hidden;"></span><span class="icon" style="color:var(--theme-text-tertiary);">${svg(fileIconName(file.path), 12, 2)}</span><span class="name" title="${escapeAttr(file.path)}">${escapeHTML(file.name)}</span>${badge}${canEdit && !isSystemApi ? `<button class="open-btn" data-file-delete title="Delete" style="color:var(--theme-danger);">${svg('trash', 10, 2.2)}</button>` : ''}<button class="open-btn" data-file-open title="Open">${svg('external', 10, 2.2)}</button>`;
    if (isPrivate) {
      IDB.getFile(S.pid, file.path).then(f => {
        if (!f?.content) return;
        const cnt = countAllowHosts(f.content);
        if (cnt > 0) { const b = document.createElement('span'); b.className = 'file-badge hosts'; b.textContent = `${cnt} host${cnt === 1 ? '' : 's'}`; fileRow.querySelector('.name')?.after(b); }
      }).catch(() => {});
    }
    fileRow.querySelector('[data-file-open]')?.addEventListener('click', (e) => { e.stopPropagation(); openInEditor(file.path); });
    fileRow.querySelector('[data-file-delete]')?.addEventListener('click', (e) => { e.stopPropagation(); confirmDeleteFile(file.path); });
    fileRow.addEventListener('click', (e) => { if (e.target.closest('button')) return; if (canEdit) openFileEditor(file.path); else openInEditor(file.path); });
    container.appendChild(fileRow);
  }
}

async function refreshFileCount() {
  try { const files = await IDB.listFiles(S.pid); const count = files.filter(f => !isSystemFile(f.path)).length; bumpTabCount('files', count); } catch {}
}

async function createNewFile() {
  if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }
  openModal(`
    <div class="modal-title">New file</div>
    <div class="modal-desc">Path like <code class="mono">src/app.js</code> for nested.</div>
    <div class="field"><label class="field-label">File path</label><input class="input mono" id="newFilePath" placeholder="app.js" autocomplete="off" spellcheck="false"></div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="newFileCreate">Create</button></div>
  `);
  $('newFilePath').focus();
  $('newFilePath').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('newFileCreate').click(); });
  $('newFileCreate').addEventListener('click', async () => {
    const path = $('newFilePath').value.trim().replace(/^\/+/, '');
    if (!path) { toast('Path required', 'error'); return; }
    if (!/^[a-zA-Z0-9._\-\/]+$/.test(path)) { toast('Invalid characters', 'error'); return; }
    if (isSystemFile(path)) { toast('Reserved path', 'error'); return; }
    const existing = await IDB.getFile(S.pid, path);
    if (existing) { toast('File already exists', 'warning'); return; }
    try {
      await IDB.putFile(S.pid, path, '');
      if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
        await apiFetch(API_HOST + '?action=project/sync-back', { method: 'POST', body: JSON.stringify({ pid: S.pid, files: { [path]: '' } }) });
      } else {
        await enqueueSync('file-save', { path, content: '' });

      await refreshFileCount();
      renderPanel();
      setTimeout(() => openFileEditor(path), 200);

}

async function openFileEditor(path) {
  let content = '';
  try { const f = await IDB.getFile(S.pid, path); content = f?.content || ''; } catch {}
  if (!content && S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
    try {
      const res = await apiFetch(API_HOST + '?action=file/get&pid=' + encodeURIComponent(S.pid) + '&path=' + encodeURIComponent(path));
      if (res.ok && res.data?.success) content = res.data.content || '';
    } catch {}
  }
  if (isImagePath(path) && content) {
    openModal(`<div class="modal-title">${escapeHTML(path)}</div><div style="border-radius:10px;overflow:hidden;border:1px solid var(--theme-card-border);max-height:60vh;overflow:auto;margin-bottom:10px;"><img src="${escapeAttr(content)}" alt="" style="max-width:100%;display:block;"></div><div class="modal-actions"><button class="btn btn-secondary btn-block" onclick="closeModal()">Close</button></div>`);
    return;
  }
  const isText = isTextFile(path);
  const isSystem = isSystemApiFile(path);
  openModal(`
    <div class="modal-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(path)}</span><button class="btn btn-ghost btn-sm btn-icon" id="fileEditorClose">${svg('x', 12, 2.4)}</button></div>
    ${isSystem ? `<div class="field-hint" style="margin-bottom:6px;">${svg('lock', 9, 2.2)} System file — provides the six default API routes.</div>` : ''}
    <div class="field" style="margin-bottom:6px;">${isText ? `<textarea class="textarea mono" id="fileEditorContent" style="min-height:45vh;font-family:var(--font-mono);font-size:12px;line-height:1.5;">${escapeHTML(content)}</textarea>` : `<div style="font-size:11.5px;color:var(--theme-text-tertiary);padding:12px;background:var(--theme-glass-bg);border-radius:8px;text-align:center;">Binary file</div>`}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
      <span style="font-size:10.5px;color:var(--theme-text-tertiary);" id="fileEditorSize">${isText ? content.length + ' chars' : ''}</span>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-ghost btn-sm" id="fileEditorOpenEditor">${svg('external', 10, 2.2)} Open in editor</button>
        ${isText ? `<button class="btn btn-primary btn-sm" id="fileEditorSave" data-requires-online>${svg('check', 10, 2.4)} Save</button>` : ''}
      </div>
    </div>
  `);
  $('fileEditorClose').addEventListener('click', closeModal);
  $('fileEditorOpenEditor').addEventListener('click', () => { closeModal(); openInEditor(path); });
  const ta = $('fileEditorContent');
  if (ta) ta.addEventListener('input', () => { const el = $('fileEditorSize'); if (el) el.textContent = `${ta.value.length} chars`; });
  $('fileEditorSave')?.addEventListener('click', async () => {
    const btn = $('fileEditorSave');
    await withButtonLoader(btn, async () => {
      try {
        const text = ta.value;
        await IDB.putFile(S.pid, path, text);
        if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
          const res = await apiFetch(API_HOST + '?action=project/sync-back', { method: 'POST', body: JSON.stringify({ pid: S.pid, files: { [path]: text } }) });
          if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Save failed');
          markSynced(S.pid); updateHeader();
        } else {
          await enqueueSync('file-save', { path, content: text });
        }
        toast('Saved', 'success');
        if (S.activeTab === 'code') renderPanel();
      } catch (err) { toast(err.message || 'Save failed', 'error'); }
    });
  });
}

function confirmDeleteFile(path) {
  if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }
  if (isSystemApiFile(path)) { toast('System file — cannot be deleted', 'warning'); return; }
  confirmModal(`Delete ${path.split('/').pop()}?`, 'This removes the file from the project.', 'Delete', true, async () => {
    showLoading('Deleting', '');
    try {
      if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
        const res = await apiFetch(API_HOST + '?action=file/delete', { method: 'POST', body: JSON.stringify({ pid: S.pid, path }) });
        if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Delete failed');
      } else { await enqueueSync('file-delete', { path }); }
      await IDB.deleteFile(S.pid, path);
      hideLoading(); toast('File deleted', 'success');
      await refreshFileCount(); renderPanel();
    } catch (err) { hideLoading(); toast(err.message || 'Delete failed', 'error'); }
  });
}

async function handleFileUpload(e) {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (files.length === 0) return;
  if (!S.isEditor && !S.isLocalOnly) { toast('Read-only', 'warning'); return; }
  S._uploadInFlight = true;
  showDeployProgress('Uploading');
  updateDeployProgress(5, 'Preparing');
  let uploaded = 0, skipped = 0;
  for (const file of files) {
    try {
      const isBinary = /\.(png|jpe?g|gif|webp|svg|bmp|ico|avif|pdf|woff2?|ttf|otf|mp4|webm|mp3|wav|ogg)$/i.test(file.name);
      let content;
      if (!isBinary) content = await file.text();
      else {
        if (file.size > 4 * 1024 * 1024) { toast(`${file.name} exceeds 4 MB`, 'error', 3000); skipped++; continue; }
        content = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
      }
      const pct = Math.round(((uploaded + skipped) / files.length) * 100);
      updateDeployProgress(pct, `Uploading ${file.name}`);
      const canServerSave = S.session && S.online && !S.isLocalOnly && S.syncState === 'synced';
      if (canServerSave) {
        const save = await apiFetch(API_HOST + '?action=file/save', { method: 'POST', body: JSON.stringify({ pid: S.pid, path: file.name, content }) });
        if (!save.ok || !save.data?.success) throw new Error(save.data?.error || 'Save failed');
        content = save.data.content || content;
      } else { await enqueueSync('file-save', { path: file.name, content }); }
      await IDB.putFile(S.pid, file.name, content);
      uploaded++;
    } catch (err) { skipped++; }
  }
  S._uploadInFlight = false;
  hideDeployProgress(uploaded > 0);
  toast(`Uploaded ${uploaded}${skipped ? ` (${skipped} skipped)` : ''}`, uploaded > 0 ? 'success' : 'warning');
  await refreshFileCount(); renderPanel();
}

function openInEditor(filePath) {
  const url = new URL('/', location.origin);
  url.searchParams.set('pid', S.pid);
  if (filePath) url.searchParams.set('file', filePath);
  window.location.href = url.toString();
}

async function restoreCommit(versionId) {
  const version = await IDB.getVersion(versionId);
  if (!version) { toast('Version not found', 'error'); return; }
  confirmModal('Restore this commit?', 'Current files will be replaced.', 'Restore', true, async () => {
    showLoading('Restoring', '');
    try {
      const currentFiles = await IDB.listFiles(S.pid);
      const snapshot = {};
      for (const f of currentFiles) { if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue; snapshot[f.path] = f.content || ''; }
      await IDB.putVersion({ vid: `v_auto_${Date.now()}`, pid: S.pid, message: `Auto-snapshot before restore`, files: snapshot, createdAt: Date.now() });
      for (const f of currentFiles) await IDB.deleteFile(S.pid, f.path);
      for (const [path, content] of Object.entries(version.files || {})) await IDB.putFile(S.pid, path, content);
      if (S.online && S.session && !S.isLocalOnly && S.syncState === 'synced') {
        await apiFetch(API_HOST + '?action=project/sync-back', { method: 'POST', body: JSON.stringify({ pid: S.pid, files: version.files }) }).catch(() => {});
      }
      hideLoading(); toast('Commit restored', 'success');
      await refreshFileCount(); renderPanel();
    } catch (err) { hideLoading(); toast(err.message || 'Restore failed', 'error'); }
  });
}

async function openCommitDialog() {
  if (!S.isEditor) { toast('Read-only', 'warning'); return; }
  let files = [], versions = [];
  try { [files, versions] = await Promise.all([IDB.listFiles(S.pid), IDB.listVersions(S.pid)]); }
  catch { toast('Could not read project files', 'error'); return; }
  const lastUserCommit = versions.find(v => v.kind !== 'deploy') || null;
  const baselineFiles = lastUserCommit?.files || {};
  const changes = [];
  for (const f of files) {
    if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue;
    const before = baselineFiles[f.path] || '';
    const after = f.content || '';
    if (before === after) continue;
    const beforeLines = before.split('\n').length;
    const afterLines = after.split('\n').length;
    changes.push({ path: f.path, add: Math.max(0, afterLines - beforeLines), rem: Math.max(0, beforeLines - afterLines) });
  }
  const totalAdd = changes.reduce((s, c) => s + c.add, 0);
  const totalRem = changes.reduce((s, c) => s + c.rem, 0);
  const autoMsg = changes.length === 0 ? `checkpoint: ${new Date().toLocaleTimeString()}` : changes.length === 1 ? `edit: ${changes[0].path.split('/').pop()} (+${changes[0].add}, −${changes[0].rem})` : `edit: ${changes.length} files (+${totalAdd}, −${totalRem})`;
  const changesHtml = changes.length === 0 ? `<div style="padding:14px;background:var(--theme-glass-bg);border-radius:8px;font-size:11.5px;color:var(--theme-text-tertiary);text-align:center;">No file changes since last commit.<br><span style="font-size:10.5px;">You can still commit a checkpoint.</span></div>` : `<div class="commit-changes">${changes.map(c => `<div class="commit-change-row"><span class="icon">${svg(fileIconName(c.path), 10, 2.2)}</span><span class="name">${escapeHTML(c.path)}</span><span class="stat"><span class="add">+${c.add}</span> <span class="rem">−${c.rem}</span></span></div>`).join('')}</div>`;
  openModal(`<div class="modal-title">Commit ${changes.length === 0 ? 'checkpoint' : `${changes.length} file${changes.length === 1 ? '' : 's'}`}</div><div class="modal-desc">Snapshot the current state as a commit.</div><div class="field"><label class="field-label">Message</label><input class="input" id="commitMsg" value="${escapeAttr(autoMsg)}" maxlength="200"></div><div class="field"><label class="field-label">${changes.length === 0 ? 'No changes' : 'Changes'}</label>${changesHtml}</div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="commitSubmit">${svg('check', 10, 2.4)} Commit</button></div>`);
  $('commitSubmit').addEventListener('click', async () => {
    const message = ($('commitMsg').value || autoMsg).trim();
    const btn = $('commitSubmit');
    await withButtonLoader(btn, async () => {
      try {
        const snapshot = {};
        for (const f of files) { if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue; snapshot[f.path] = f.content || ''; }
        const vid = `v_${Date.now()}`;
        const versionData = { message, files: snapshot, createdAt: Date.now() };
        await IDB.putVersion({ vid, pid: S.pid, ...versionData });
        let serverSynced = false;
        if (S.online && S.session && !S.isLocalOnly) {
          try { const res = await apiFetch(API_HOST + '?action=project/sync-back', { method: 'POST', body: JSON.stringify({ pid: S.pid, versions: { [vid]: versionData } }) }); serverSynced = res.ok && res.data?.success; }
          catch { serverSynced = false; }
        }
        if (!serverSynced) await enqueueSync('version-commit', { vid, data: versionData });
        else { markSynced(S.pid); updateHeader(); }
        closeModal();
        toast(serverSynced ? 'Committed' : 'Committed locally', 'success');
        bumpTabCount('commits', versions.length + 1);
        if (S.activeTab === 'code') renderPanel();
      } catch (err) { toast(err.message || 'Commit failed', 'error'); }
    });
  });
}

async function renderDeployPanel(panel) {
  if (!gate(panel, { label: 'Deploy' })) return;
  panel.innerHTML = skeletonCard(3) + skeletonCard(6);
  const now = Date.now();
  let current, history, currentId, total, maxDeployments;
  if (S.deployCache.history && (now - S.deployCache.at) < DEPLOY_HISTORY_CACHE_TTL) {
    current = S.deployState;
    history = S.deployCache.history;
    currentId = S.deployCache.currentId;
    total = S.deployCache.total;
    maxDeployments = S.deployCache.maxDeployments;
  } else {
    const [statusRes, historyRes] = await Promise.all([
      apiFetch(API_HOST + '?action=status&pid=' + encodeURIComponent(S.pid)),
      apiFetch(API_HOST + '?action=deployment/history&pid=' + encodeURIComponent(S.pid)),
    ]);
    current = statusRes.ok ? statusRes.data?.deployment : null;
    history = historyRes.ok ? (historyRes.data?.deployments || []) : [];
    currentId = historyRes.ok ? historyRes.data?.currentDeploymentId : null;
    total = historyRes.ok ? (historyRes.data?.total ?? history.length) : history.length;
    maxDeployments = historyRes.ok ? historyRes.data?.maxDeployments : 5;
    S.deployCache = { history, currentId, total, maxDeployments, at: now };
  }
  S.deployState = current;
  S.project.deployment = current || S.project.deployment;
  bumpTabCount('deployments', total);
  const isLive = current?.url && current.state !== 'OFFLINE';
  const isOffline = current?.state === 'OFFLINE';
  const needsRedeploy = current && !current.url && !isOffline;
  const canDeploy = S.isEditor && S.online && S.syncState === 'synced';
  const currentBlock = (() => {
    if (isLive) return `<div class="deploy-row current"><div class="deploy-icon">${svg('check', 13, 2.2)}</div><div class="deploy-info"><div class="deploy-title">Current deploy <span class="badge success" style="font-size:8px">CURRENT</span></div><div style="margin-top:4px;">${renderUrlDisplay(current.url, { label: 'live' })}</div><div class="deploy-sub">${timeAgo(current.deployedAt)} · ${escapeHTML(current.state || 'READY')}</div></div><div class="deploy-actions">${S.isEditor ? `<button class="btn btn-ghost btn-icon" id="btnTakeOffline" title="Take offline" data-requires-online>${svg('eyeOff', 10, 2.2)}</button>` : ''}</div></div>`;
    if (needsRedeploy) return `<div class="deploy-row"><div class="deploy-icon" style="color:var(--theme-warning)">${svg('alert', 13, 2.2)}</div><div class="deploy-info"><div class="deploy-title">Needs redeploy <span class="badge warning" style="font-size:8px">NO URL</span></div><div class="deploy-sub">Deployment record exists but has no live URL</div></div>${canDeploy ? `<button class="btn btn-primary btn-sm" id="btnRedeployNow" data-requires-online>Redeploy</button>` : ''}</div>`;
    if (isOffline) return `<div class="deploy-row"><div class="deploy-icon" style="color:var(--theme-text-tertiary)">${svg('eyeOff', 13, 2.2)}</div><div class="deploy-info"><div class="deploy-title">Offline</div><div class="deploy-sub">${current.previousUrl ? 'Last live at: ' + escapeHTML(current.previousUrl) : 'Taken offline'}</div></div>${canDeploy ? `<button class="btn btn-primary btn-sm" id="btnDeployNow" data-requires-online>Deploy</button>` : ''}</div>`;
    if (S.syncState === 'local' || S.syncState === 'orphan') return `<div style="padding:14px;"><div style="font-size:11.5px;color:var(--theme-text-tertiary);margin-bottom:8px;">${S.syncState === 'orphan' ? "This project isn't on the server yet." : "Local projects can't be deployed."}</div><button class="btn btn-primary btn-sm" id="btnPushFirst" data-requires-online>Push to server</button></div>`;
    return `<div class="deploy-row"><div class="deploy-icon">${svg('rocket', 13, 2.2)}</div><div class="deploy-info"><div class="deploy-title">Never deployed</div><div class="deploy-sub">Deploy to start building history</div></div>${canDeploy ? `<button class="btn btn-sm btn-primary" id="btnDeployNow" data-requires-online>Deploy</button>` : ''}</div>`;
  })();
  panel.innerHTML = `
    <div class="panel-section">
      ${panelSectionHeader('Deployments', 'rocket', `${total}${maxDeployments ? ` of ${maxDeployments}` : ''} kept`)}
      <div class="card">
        <div class="card-header"><div class="card-title">${svg('rocket', 13, 2.2)} Current</div>${canDeploy ? `<button class="btn btn-sm btn-primary" id="btnDeployNow" data-requires-online>${svg('rocket', 10, 2.4)} Deploy</button>` : ''}</div>
        <div class="card-body flush">${currentBlock}</div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">${svg('clock', 13, 2.2)} History</div><button class="btn btn-sm btn-ghost btn-icon" id="btnRefreshHistory" data-requires-online>${svg('refresh', 10, 2.2)}</button></div>
        <div class="card-body tight">${history.length === 0 ? emptyState('clock', 'No deployments', 'Deploy your project to start building history.') : `<div class="row-list" id="deployHistoryList">${history.map(d => renderDeploymentRow(d, currentId)).join('')}</div><div class="field-hint" style="margin-top:8px;">Deploys keep the ${maxDeployments || 5} most recent snapshots.</div>`}</div>
      </div>
    </div>
    <div class="panel-section">
      ${panelSectionHeader('Export', 'download', 'Download your project')}
      <div class="card"><div class="card-body" style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn btn-primary btn-block" id="btnDownloadFolio" data-requires-online>${svg('download', 12, 2.4)} .folio backup</button>
        <div class="field-hint">Files, versions${S.syncState === 'synced' ? ', JSON DB' : ''}.</div>

  $('btnRefreshHistory')?.addEventListener('click', () => { S.deployCache = { history: null, currentId: null, total: 0, at: 0, maxDeployments: 5 }; renderPanel(); });

  $('btnDownloadZip')?.addEventListener('click', () => downloadProject('zip'));
  $('btnDownloadDb')?.addEventListener('click', downloadJsonDb);
  panel.addEventListener('click', (e) => {
    const toggleBtn = e.target.closest('[data-deploy-toggle]');
    if (toggleBtn) { e.stopPropagation(); toggleDeploymentRow(toggleBtn.getAttribute('data-deploy-toggle')); return; }
    const rowEl = e.target.closest('[data-deploy-row]');
    if (rowEl && !e.target.closest('a, button[data-redeploy], button[data-delete-deploy]')) { toggleDeploymentRow(rowEl.getAttribute('data-deploy-row')); return; }
    const rb = e.target.closest('[data-redeploy]');
    if (rb) { e.stopPropagation(); redeployVersion(rb.getAttribute('data-redeploy')); return; }
    const db = e.target.closest('[data-delete-deploy]');
    if (db) { e.stopPropagation(); confirmDeleteDeployment(db.getAttribute('data-delete-deploy')); return; }
  });
  updateOfflineUI();
}

function toggleDeploymentRow(deploymentId) {
  if (S._expandedDeployments.has(deploymentId)) S._expandedDeployments.delete(deploymentId);
  else S._expandedDeployments.add(deploymentId);
  const list = document.getElementById('deployHistoryList');
  if (!list) return;
  const cached = S.deployCache.history || [];
  list.innerHTML = cached.map(d => renderDeploymentRow(d, S.deployCache.currentId)).join('');
}

function renderDeploymentRow(d, currentId) {
  const isCurrent = d.id === currentId;
  const hasSnapshot = d.hasSnapshot === true;
  const isLegacy = !d.versionId;
  const isExpanded = S._expandedDeployments.has(d.id);
  const cleanUrl = d.previewUrl || (d.versionId ? `${BASE_URL}/api/host?action=serve&pid=${encodeURIComponent(S.pid)}&path=index.html&from=${encodeURIComponent(d.id)}` : null);
  const at = d.deployedAt ? new Date(d.deployedAt) : null;
  const timeStr = at ? at.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  const versionShort = d.versionId ? String(d.versionId).slice(-8) : null;
  const rowHtml = `<div class="deploy-row ${isExpanded ? 'expanded' : ''} ${isCurrent ? 'current' : ''}" data-deploy-row="${escapeAttr(d.id)}"><button class="deploy-chevron" type="button" data-deploy-toggle="${escapeAttr(d.id)}" aria-label="Toggle details" aria-expanded="${isExpanded}">${svg('chevronRight', 11, 2.6)}</button><div class="deploy-icon">${svg(isCurrent ? 'check' : isLegacy ? 'file' : 'rocket', 13, 2.2)}</div><div class="deploy-info"><div class="deploy-title">${versionShort ? `v${escapeHTML(versionShort)}` : 'Legacy deploy'}${isCurrent ? '<span class="badge success" style="font-size:8px;">CURRENT</span>' : ''}${!hasSnapshot ? '<span class="badge neutral" style="font-size:8px;">NO SNAPSHOT</span>' : ''}</div><div class="deploy-sub">${timeAgo(d.deployedAt)} · ${escapeHTML(d.state || 'READY')}</div></div><div class="deploy-actions">${S.isEditor && !isCurrent && hasSnapshot && d.versionId ? `<button class="btn btn-ghost btn-icon" data-redeploy="${escapeAttr(d.versionId)}" title="Redeploy" data-requires-online>${svg('refresh', 10, 2.2)}</button>` : ''}${S.isOwner ? `<button class="btn btn-ghost btn-icon" data-delete-deploy="${escapeAttr(d.id)}" title="Delete" style="color:var(--theme-danger);" data-requires-online>${svg('trash', 10, 2.2)}</button>` : ''}</div></div>`;
  const detailHtml = isExpanded ? `<div class="deploy-detail">${!hasSnapshot ? `<div class="deploy-detail-note">${svg('alert', 12, 2.4)}<span>This deployment was created before snapshots were captured. Historic preview is unavailable.</span></div>` : ''}<div class="deploy-detail-row"><span class="deploy-detail-label">Deployed</span><span class="deploy-detail-value">${escapeHTML(timeStr)}</span><span></span></div><div class="deploy-detail-row"><span class="deploy-detail-label">Version</span><span class="deploy-detail-value ${!d.versionId ? 'empty' : ''}">${escapeHTML(d.versionId || 'not recorded')}</span>${d.versionId ? `<button class="deploy-detail-copy" data-copy-text="${escapeAttr(d.versionId)}">${svg('copy', 10, 2.4)}</button>` : '<span></span>'}</div><div class="deploy-detail-row"><span class="deploy-detail-label">Deployment</span><span class="deploy-detail-value">${escapeHTML(d.id)}</span><button class="deploy-detail-copy" data-copy-text="${escapeAttr(d.id)}">${svg('copy', 10, 2.4)}</button></div>${cleanUrl ? `<div class="deploy-detail-row"><span class="deploy-detail-label">Preview</span><span class="deploy-detail-value">${renderUrlDisplay(cleanUrl, { label: '' })}</span><span></span></div>` : ''}</div>` : '';
  return rowHtml + detailHtml;
}

async function confirmDeleteDeployment(deploymentId) {
  if (!S.isOwner || !S.online) return;
  confirmModal('Delete deployment?', 'Removes from history and deletes its snapshot.', 'Delete', true, async () => {
    showLoading('Deleting', '');
    try {
      const res = await apiFetch(API_HOST + '?action=deployment/delete', { method: 'POST', body: JSON.stringify({ pid: S.pid, deploymentId }) });
      hideLoading();
      if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
      toast('Deleted', 'success');
      S.deployCache = { history: null, currentId: null, total: 0, at: 0, maxDeployments: 5 };
      S._expandedDeployments.delete(deploymentId);
      renderPanel();
    } catch (err) { hideLoading(); toast(err.message || 'Delete failed', 'error'); }
  });
}

async function pollDeployStatus(pid) {
  for (let attempt = 0; attempt < 3; attempt++) {
    updateDeployProgress(85 + attempt * 5, 'Activating');
    await new Promise(r => setTimeout(r, 1500));
    try { const st = await apiFetch(API_HOST + '?action=status&pid=' + encodeURIComponent(pid)); if (st.ok && st.data?.success && st.data.deployment?.url) return st.data.deployment; }
    catch {}
  }
  return null;
}

async function deployNow() {
  if (!S.isEditor || !S.online) { toast('Requires internet', 'warning'); return; }
  if (S.isLocalOnly) { toast("Local projects can't be deployed", 'warning'); return; }
  if (S.syncState === 'needs-pull') { toast('Sync files first before deploying', 'warning', 4000); return; }
  let files = [];
  try { files = await IDB.listFiles(S.pid); } catch {}
  const fileMap = {};
  for (const f of files) { if (isSystemFile(f.path) && f.path !== NOTES_PATH) continue; if (typeof f.content !== 'string') continue; fileMap[f.path] = f.content; }
  if (Object.keys(fileMap).length === 0) { toast('No files to deploy', 'warning'); return; }
  const apiFiles = Object.entries(fileMap).filter(([p]) => p.startsWith('api/') && p.endsWith('.js'));
  if (apiFiles.length > 10) { toast(`You have ${apiFiles.length} API files. Limit is 10.`, 'error', 5000); return; }
  for (const [p, c] of apiFiles) { if (c.length > 50 * 1024) { toast(`${p} is ${formatBytes(c.length)}. Limit is 50 KB.`, 'error', 5000); return; } }
  const totalApiBytes = apiFiles.reduce((s, [, c]) => s + c.length, 0);
  if (totalApiBytes > 200 * 1024) { toast(`API folder is ${formatBytes(totalApiBytes)}. Limit is 200 KB.`, 'error', 5000); return; }
  confirmModal(`Deploy ${Object.keys(fileMap).length} file${Object.keys(fileMap).length === 1 ? '' : 's'}?`, 'This will build and deploy to a live URL.', 'Deploy', false, async () => {
    showDeployProgress('Deploying');
    updateDeployProgress(10, 'Uploading');
    try {
      const res = await apiFetch(API_HOST + '?action=deploy', { method: 'POST', body: JSON.stringify({ pid: S.pid, files: fileMap }) });
      if (!res.ok || !res.data?.success) {
        hideDeployProgress(false);
        let msg = res.data?.error || 'Deploy failed';
        if (res.status === 403) msg = "You don't have permission to deploy";
        if (res.status === 404) msg = 'Project not found';
        if (res.data?.violations?.length) msg = `${msg}: ${res.data.violations.map(v => `${v.host || v.name} (${v.reason})`).join(', ')}`;
        throw new Error(msg);
      }
      if (res.data.url) {
        S.deployState = { url: res.data.url, serveUrl: res.data.serveUrl || null, versionId: res.data.versionId || null, deploymentId: res.data.deploymentId, deployedAt: Date.now(), state: 'READY' };
        S.project.deployment = S.deployState;
      }
      if (res.data.shortKey) { S.project.shortKey = res.data.shortKey; S.project.shortUrl = res.data.shortUrl; S.shortlink = null; }
      markSynced(S.pid);
      updateDeployProgress(80, 'Activating');
      const live = await pollDeployStatus(S.pid);
      if (live) { S.deployState = live; S.project.deployment = live; }
      hideDeployProgress(true);
      showDeployResult(res.data.publicUrl, res.data.shortUrl);
      if (res.data.filesSkipped > 0) toast(`${res.data.filesSkipped} file(s) skipped`, 'warning', 4000);
      S.deployCache = { history: null, currentId: null, total: 0, at: 0, maxDeployments: 5 };
      await loadDeployState();
      await new Promise(r => setTimeout(r, 800));
      if (['deploy', 'overview', 'code'].includes(S.activeTab)) renderPanel();
      updateHeader();
    } catch (err) { hideDeployProgress(false); toast(err.message || 'Deploy failed', 'error', 5000); }
  });
}

async function redeployVersion(versionId) {
  if (!S.isEditor || !S.online) { toast('Requires internet', 'warning'); return; }
  confirmModal('Redeploy this version?', 'The live site will switch to this version.', 'Redeploy', false, async () => {
    showLoading('Redeploying', '');
    try {
      const res = await apiFetch(API_HOST + '?action=redeploy', { method: 'POST', body: JSON.stringify({ pid: S.pid, versionId }) });
      hideLoading();
      if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Redeploy failed');
      toast('Redeploying', 'success');
      S.deployCache = { history: null, currentId: null, total: 0, at: 0, maxDeployments: 5 };
      const live = await pollDeployStatus(S.pid);
      if (live) { S.deployState = live; S.project.deployment = live; }
      renderPanel(); updateHeader();
    } catch (err) { hideLoading(); toast(err.message || 'Redeploy failed', 'error'); }
  });
}

async function takeOffline() {
  if (!S.isEditor || !S.online) { toast('Requires internet', 'warning'); return; }
  confirmModal('Take offline?', 'The live URL will stop working.', 'Take offline', true, async () => {
    showLoading('Taking offline', '');
    try {
      const res = await apiFetch(API_HOST + '?action=deployment/offline', { method: 'POST', body: JSON.stringify({ pid: S.pid }) });
      hideLoading();
      if (!res.ok || !res.data?.success) throw new Error(res.data?.error || 'Failed');
      toast('Offline', 'success');
      S.deployCache = { history: null, currentId: null, total: 0, at: 0, maxDeployments: 5 };
      renderPanel(); updateHeader();
    } catch (err) { hideLoading(); toast(err.message || 'Failed', 'error'); }
  });
}

async function downloadProject(format) {
  if (!S.online) { toast('Requires internet', 'warning'); return; }
  try {
    const url = `${API_HOST}?action=project/export&pid=${encodeURIComponent(S.pid)}&format=${format}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${S.session}` } });
    if (!res.ok) throw new Error('Download failed');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${S.project.slug || 'project'}-${S.pid.slice(-6)}.${format === 'folio' ? 'folio' : 'zip'}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Downloaded', 'success');
  } catch (err) { toast(err.message || 'Download failed', 'error'); }
}

async function downloadJsonDb() {
  if (!S.online || S.syncState !== 'synced') { toast('Requires internet', 'warning'); return; }
  try {
    const res = await apiFetch(API_HOST + '?action=db/get&pid=' + encodeURIComponent(S.pid));
    if (!res.ok || !res.data?.success) throw new Error('Failed');
    const blob = new Blob([JSON.stringify(res.data.data || {}, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${S.project.slug || 'project'}-db.json`;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Downloaded', 'success');
  } catch (err) { toast(err.message || 'Download failed', 'error'); }
}

async function renderApiPanel(panel) {

  panel.innerHTML = skeletonCard(4);
  const res = await apiFetch(API_HOST + '?action=api-routes&pid=' + encodeURIComponent(S.pid));
  if (!res.ok || !res.data?.success) { panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('terminal', "Couldn't load API routes", res.data?.error || 'Try refreshing.')}</div></div>`; return; }
  const data = res.data;
  const system = data.system || [], user = data.user || [];
  const baseUrl = data.baseUrl || `${API_BASE}/${S.pid}`;
  const friendlyBaseUrl = data.friendlyBaseUrl, directBaseUrl = data.directBaseUrl || `${API_BASE}/${S.pid}`;
  const totalRoutes = system.length + user.length;
  const usedFiles = user.length + 1;
  panel.innerHTML = `
    <div class="panel-section">
      ${panelSectionHeader('API routes', 'terminal', `${totalRoutes} route${totalRoutes === 1 ? '' : 's'} · ${usedFiles}/10 files`)}
      <div class="card"><div class="card-body">
        <div class="api-base-url"><code class="mono">${escapeHTML(baseUrl)}</code><button class="btn btn-ghost btn-icon" data-copy-text="${escapeAttr(baseUrl)}">${svg('copy', 12, 2.2)}</button></div>
        ${friendlyBaseUrl && directBaseUrl && friendlyBaseUrl !== directBaseUrl ? `<div class="field-hint" style="margin-bottom:10px;line-height:1.55;"><strong>Friendly URL</strong><br><code class="mono" style="font-size:10px;">${escapeHTML(friendlyBaseUrl)}</code><br><br><strong>Direct URL</strong><br><code class="mono" style="font-size:10px;">${escapeHTML(directBaseUrl)}</code></div>` : ''}
        ${system.length > 0 ? `<div class="api-section-title">System routes</div><div class="api-route-list">${system.map(r => `<div class="api-route-row"><span class="api-method">GET</span><code class="api-route mono">${escapeHTML(`${baseUrl}/${r}`)}</code><span class="api-source">_system.js</span><button class="btn btn-ghost btn-icon" data-copy-text="${escapeAttr(`${baseUrl}/${r}`)}">${svg('copy', 10, 2.2)}</button></div>`).join('')}</div>` : ''}
        ${user.length > 0 ? `<div class="api-section-title" style="margin-top:12px;">User routes</div><div class="api-route-list">${user.map(r => `<div class="api-route-row"><span class="api-method post">POST</span><code class="api-route mono">${escapeHTML(`${baseUrl}/${r}`)}</code><span class="api-source">${escapeHTML(r)}.js</span><button class="btn btn-ghost btn-icon" data-copy-text="${escapeAttr(`${baseUrl}/${r}`)}">${svg('copy', 10, 2.2)}</button></div>`).join('')}</div>` : `<div class="empty-state" style="padding:20px 8px;"><div class="empty-state-icon">${svg('terminal', 18, 2)}</div><div class="empty-state-title">No user routes yet</div><div class="empty-state-desc">Create <code class="mono">api/*.js</code> files to add routes.</div></div>`}
        ${data.allowedHosts ? `<details class="api-hosts-details"><summary>${svg('globe', 11, 2.2)} Allowed hosts (${(data.allowedHosts.builtin?.length || 0) + (data.allowedHosts.declared?.length || 0)})</summary><div class="api-hosts-list">${(data.allowedHosts.builtin || []).map(h => `<div class="api-host-row"><code class="mono">${escapeHTML(h)}</code><span class="badge neutral">built-in</span></div>`).join('')}${(data.allowedHosts.declared || []).map(h => `<div class="api-host-row"><code class="mono">${escapeHTML(h.host)}</code>${h.validatedOk ? `<span class="badge success">verified</span>` : `<span class="badge danger">failed</span>`}</div>`).join('')}</div></details>` : ''}
        <div class="field-hint" style="margin-top:10px;">See <button type="button" class="link-btn" id="btnApiDocs">Docs → Private API</button> for the full reference.</div>
      </div></div>
      <div class="card" id="apiLogsCard">
        <div class="card-header">
          <div class="card-title">${svg('list', 13, 2.2)} Recent calls <span style="font-size:10px;opacity:0.6;font-weight:400;" id="apiLogsMeta">(last 50)</span></div>
          <div style="display:flex;gap:4px;align-items:center;">
            <input class="input" id="apiLogsFilterRoute" placeholder="route…" style="width:80px;height:24px;font-size:10.5px;padding:0 6px;">
            <select class="select" id="apiLogsFilterStatus" style="width:80px;height:24px;font-size:10.5px;padding:0 20px 0 6px;"><option value="">All</option><option value="ok">OK</option><option value="error">Errors</option></select>
            <button class="btn btn-sm btn-ghost btn-icon" id="btnRefreshLogs" type="button" data-requires-online>${svg('refresh', 10, 2.2)}</button>
          </div>
        </div>

        <div id="apiLogsPager"></div>

  panel.querySelectorAll('[data-copy-text]').forEach(btn => btn.addEventListener('click', () => {
    if (copyToClipboard(btn.dataset.copyText)) toast('Copied', 'success', 1000);
  }));
  $('btnApiDocs')?.addEventListener('click', () => openDocsOverlay('private-api'));
  $('btnRefreshLogs')?.addEventListener('click', () => { S._apiLogsState.offset = 0; loadApiLogs(); });
  loadApiLogs();

async function loadApiLogs() {
  const body = $('apiLogsBody'); if (!body) return;
  const qs = new URLSearchParams({ action: 'api-logs', pid: S.pid, limit: String(S._apiLogsState.limit), offset: String(S._apiLogsState.offset) });
  if (S._apiLogsState.route) qs.set('route', S._apiLogsState.route);
  if (S._apiLogsState.status) qs.set('status', S._apiLogsState.status);
  const res = await apiFetch(API_HOST + '?' + qs.toString());
  if (!res.ok || !res.data?.success) { body.innerHTML = `<div class="field-hint" style="color:var(--theme-danger);">Couldn't load logs: ${escapeHTML(res.data?.error || 'unknown')}</div>`; $('apiLogsPager').innerHTML = ''; return; }
  const { logs = [], total = 0, hasMore = false, errorSummary = {} } = res.data;
  S._apiLogsState._logs = logs;
  const meta = $('apiLogsMeta');
  if (meta) { const errs = Object.values(errorSummary).reduce((s, n) => s + n, 0); meta.textContent = total === 0 ? '(0)' : `(${total}${errs ? ` · ${errs} errors` : ''})`; }
  if (logs.length === 0) { body.innerHTML = `<div class="field-hint" style="text-align:center;padding:16px 8px;">No API calls match these filters.</div>`; $('apiLogsPager').innerHTML = ''; return; }
  body.innerHTML = logs.map(renderApiLogRow).join('');
  body.querySelectorAll('[data-log-toggle]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); const id = btn.getAttribute('data-log-toggle'); if (S._apiLogsState.expanded.has(id)) S._apiLogsState.expanded.delete(id); else S._apiLogsState.expanded.add(id); renderApiLogsList(); }));
  body.querySelectorAll('[data-copy-text]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); if (copyToClipboard(btn.dataset.copyText)) toast('Copied', 'success', 1000); }));
  const pager = $('apiLogsPager'); const from = S._apiLogsState.offset + 1; const to = Math.min(S._apiLogsState.offset + logs.length, total);
  pager.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 12px;border-top:1px solid var(--theme-divider);"><button class="btn btn-sm btn-ghost" id="apiLogsPrev" ${S._apiLogsState.offset === 0 ? 'disabled' : ''}>Prev</button><span style="font-size:10.5px;color:var(--theme-text-tertiary);">${from}–${to} of ${total}</span><button class="btn btn-sm btn-ghost" id="apiLogsNext" ${!hasMore ? 'disabled' : ''}>Next</button></div>`;
  $('apiLogsPrev')?.addEventListener('click', () => { S._apiLogsState.offset = Math.max(0, S._apiLogsState.offset - S._apiLogsState.limit); loadApiLogs(); });
  $('apiLogsNext')?.addEventListener('click', () => { S._apiLogsState.offset += S._apiLogsState.limit; loadApiLogs(); });
  const routeInput = $('apiLogsFilterRoute'), statusSel = $('apiLogsFilterStatus');
  if (routeInput && !routeInput._wired) { routeInput._wired = true; routeInput.addEventListener('input', debounce(() => { S._apiLogsState.route = routeInput.value.trim(); S._apiLogsState.offset = 0; loadApiLogs(); }, 300)); }
  if (statusSel && !statusSel._wired) { statusSel._wired = true; statusSel.addEventListener('change', () => { S._apiLogsState.status = statusSel.value; S._apiLogsState.offset = 0; loadApiLogs(); }); }
}

function renderApiLogsList() {
  const body = $('apiLogsBody'); if (!body) return;
  const logs = S._apiLogsState._logs || [];
  body.innerHTML = logs.map(renderApiLogRow).join('');
  body.querySelectorAll('[data-log-toggle]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); const id = btn.getAttribute('data-log-toggle'); if (S._apiLogsState.expanded.has(id)) S._apiLogsState.expanded.delete(id); else S._apiLogsState.expanded.add(id); renderApiLogsList(); }));
  body.querySelectorAll('[data-copy-text]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); if (copyToClipboard(btn.dataset.copyText)) toast('Copied', 'success', 1000); }));
}

function renderApiLogRow(l) {
  const isError = !l.ok;
  const iconName = isError ? 'alertCircle' : 'check';
  const badgeClass = isError ? 'danger' : 'success';
  const isExpanded = S._apiLogsState.expanded.has(l.id);
  const errInline = l.errorMessage && !isExpanded ? `<div class="field-hint mono" style="margin-top:2px;color:var(--theme-danger);font-size:10px;line-height:1.4;">${escapeHTML(l.errorName || 'Error')}: ${escapeHTML(l.errorMessage)}</div>` : '';
  const detail = isExpanded ? `<div class="api-log-detail">${rowDetail('Status', `${l.status}${l.errorClass ? ` · ${l.errorClass}` : ''}`)}${rowDetail('Method', l.method || 'POST')}${rowDetail('Duration', `${l.durationMs} ms`)}${rowDetail('Via', l.via || 'anon')}${l.requestId ? rowDetail('Request ID', l.requestId, true) : ''}${l.stage ? rowDetail('Last stage', l.stage) : ''}${l.fetchHosts && l.fetchHosts.length ? rowDetail('Fetch hosts', l.fetchHosts.join(', ')) : ''}${l.errorName ? rowDetail('Error', `${l.errorName}: ${l.errorMessage || ''}`, true) : ''}</div>` : '';
  return `<div class="api-log-row ${isExpanded ? 'expanded' : ''}"><button class="api-log-toggle" type="button" data-log-toggle="${escapeAttr(l.id)}" aria-expanded="${isExpanded}">${svg('chevronRight', 10, 2.6)}</button><div class="row-icon" style="flex-shrink:0;">${svg(iconName, 12, 2.2)}</div><div class="row-content" style="min-width:0;"><div class="row-title mono" style="font-size:11px;">${escapeHTML(l.method)} /${escapeHTML(l.route)} <span class="badge ${badgeClass}" style="font-size:9px;margin-left:4px;">${l.status}</span>${l.via && l.via !== 'anon' ? `<span class="badge neutral" style="font-size:8px;margin-left:4px;">${escapeHTML(l.via)}</span>` : ''}</div><div class="row-sub" style="font-size:10px;">${timeAgo(l.ts)} · ${l.durationMs}ms${l.errorClass ? ` · <span style="color:var(--theme-danger);">${escapeHTML(l.errorClass)}</span>` : ''}</div>${errInline}</div></div>${detail}`;
}

function rowDetail(label, value, mono = false) {
  return `<div class="api-log-detail-row"><span class="api-log-detail-label">${escapeHTML(label)}</span><span class="api-log-detail-value ${mono ? 'mono' : ''}">${escapeHTML(value)}</span></div>`;
}

async function renderInsightsPanel(panel) {
  if (!gate(panel, { label: 'Insights' })) return;
  panel.innerHTML = skeletonCard(4) + skeletonCard(6);
  const [data, logs] = await Promise.all([loadAnalytics(), loadLogs({ force: true })]);
  if (!data) { panel.innerHTML = `<div class="card"><div class="card-body">${emptyState('chart', "Couldn't load analytics", 'Try refreshing.')}</div></div>`; return; }
  const trend = data.trend7 || [];
  const topPages = data.topPages || [];
  const maxTrend = Math.max(1, ...trend.map(t => t.count || 0));
  const logsList = logs?.logs || [];
  const isCached = !S.online && data;
  panel.innerHTML = `
    <div class="panel-section">
      ${panelSectionHeader('Analytics', 'chart', 'Traffic and usage')}
      ${isCached ? `<div class="field-hint" style="color:var(--theme-warning);margin-bottom:8px;">${svg('wifi', 11, 2.2)} Showing cached data — reconnect to refresh.</div>` : ''}
      <div class="stats-grid">
        <div class="stat-tile"><div class="stat-label">Today</div><div class="stat-value">${formatNumber(data.today || 0)}</div></div>
        <div class="stat-tile"><div class="stat-label">7-day</div><div class="stat-value">${formatNumber(trend.reduce((s, t) => s + (t.count || 0), 0))}</div></div>
        <div class="stat-tile"><div class="stat-label">Total</div><div class="stat-value">${formatNumber(data.total || 0)}</div></div>
        <div class="stat-tile"><div class="stat-label">DB ops</div><div class="stat-value">${formatNumber((data.db?.reads || 0) + (data.db?.writes || 0))}</div></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">${svg('chart', 13, 2.2)} 7-day trend</div><button class="btn btn-sm btn-ghost btn-icon" id="btnRefreshAnalytics" data-requires-online>${svg('refresh', 10, 2.2)}</button></div>
        <div class="card-body">${trend.length === 0 || trend.every(t => !t.count) ? `<div style="text-align:center;padding:20px 0;color:var(--theme-text-tertiary);">No traffic yet</div>` : `<div style="display:flex;align-items:flex-end;gap:4px;height:80px;">${trend.map(t => { const pct = (t.count || 0) / maxTrend; return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:100%;height:${Math.max(3, pct * 100)}%;background:var(--theme-primary);border-radius:3px 3px 0 0;min-height:3px;opacity:0.85;"></div><div style="font-size:8px;color:var(--theme-text-tertiary);font-weight:700;">${t.date?.slice(-5) || ''}</div></div>`; }).join('')}</div>`}</div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">${svg('eye', 13, 2.2)} Top pages</div></div>
        <div class="card-body tight">${topPages.length === 0 ? emptyState('eye', 'No pages yet', 'Analytics will show once visitors land.') : `<div class="row-list">${topPages.map(t => `<div class="row-item"><div class="row-icon">${svg('file', 13, 2.2)}</div><div class="row-content"><div class="row-title mono" style="font-size:10.5px;">${escapeHTML(t.path || '/')}</div><div class="row-sub">${formatNumber(t.count || 0)} views</div></div></div>`).join('')}</div>`}</div>
      </div>
    </div>
    <div class="panel-section">
      ${panelSectionHeader('Activity', 'list', logsList.length > 0 ? `${logs?.total || 0} events` : 'No activity yet')}
      <div class="card">
        <div class="card-header"><div class="card-title">${svg('list', 13, 2.2)} Logs</div><button class="btn btn-sm btn-ghost btn-icon" id="btnRefreshLogs" data-requires-online>${svg('refresh', 10, 2.2)}</button></div>
        <div class="card-body tight">${logsList.length === 0 ? emptyState('list', 'No activity', 'Actions will appear here.') : `<div class="row-list" id="logList">${logsList.map(renderLogRow).join('')}</div>${logs?.hasMore ? `<button class="btn btn-secondary btn-block" id="btnLoadMoreLogs" style="margin-top:8px;">Load more</button>` : ''}`}</div>
      </div>
    </div>
  `;
  $('btnRefreshAnalytics')?.addEventListener('click', () => { S.analyticsCache = null; renderPanel(); });
  $('btnRefreshLogs')?.addEventListener('click', () => renderPanel());
  $('btnLoadMoreLogs')?.addEventListener('click', loadMoreLogs);
  updateOfflineUI();
}

function renderLogRow(l) {
  return `<div class="log-entry"><div class="log-time">${timeAgo(l.ts)}</div><div class="log-body"><div class="log-type">${escapeHTML(l.type || 'event')}</div><div class="log-action">${escapeHTML(l.action || '')}</div></div></div>`;
}

async function loadMoreLogs() {
  const newOffset = (S.logsData?.logs || []).length;
  const res = await apiFetch(API_HOST + '?action=logs&pid=' + encodeURIComponent(S.pid) + '&limit=50&offset=' + newOffset);
  if (!res.ok || !res.data?.success) return;
  const list = $('logList'); if (!list) return;
  (res.data.logs || []).forEach(l => list.insertAdjacentHTML('beforeend', renderLogRow(l)));
  if (!res.data.hasMore) $('btnLoadMoreLogs')?.remove();
}

// ═══════════════════════════════════════════════════════════
// DATA PANEL
