<script>
(function() {
  try {
    var pref = localStorage.getItem("folio.theme") || "dark";
    var resolved = pref;
    if (pref === "auto") {
      resolved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    }
    if (resolved === "light") document.documentElement.setAttribute("data-theme", "light");
  } catch (e) {}
})();
</script>

<div class="backdrop" id="backdrop" aria-hidden="true"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">

  <div class="sheet-header">
    <h2 class="sheet-title" id="sheetTitle">Panel</h2>

    </button>
  </div>

  <div class="sheet-footer" id="sheetFooter"></div>
</div>

<div class="sheet" id="confirmDialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-body">
    <div class="confirm-body">
      <div class="confirm-icon" id="confirmIcon">

      <div class="confirm-actions">
        <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger" id="confirmOk">Delete</button>
      </div>
    </div>
  </div>
</div>
